function applyAtlas(chapters){for(const [id,data]of Object.entries(atlasData.refinements)){const c=chapters.find(c=>c.id===id);c.lessons[0].demo=data.lessons[0].demo;c.lessons.push(...data.lessons);c.missions.unshift(...data.missions);c.refined=true;}chapters.push(atlasData.quest);for(const p of atlasData.corrections){const [chapterId,missionId,num]=p.id.split('-');const q=chapters.find(c=>c.id===chapterId).missions.find(m=>m.id===chapterId+'-'+missionId).items[Number(num.slice(1))-1];Object.assign(q,p.after);}const c12=chapters.find(c=>c.id==='c12');for(const l of c12.lessons){l.body=l.body.replace('it 专题后续继续展开','it 独立专题已开放，可继续回看');l.tags=l.tags.map(t=>t.replace('it 拓展仍待精做','it 专题已开放'));}const c19=chapters.find(c=>c.id==='c19');for(const l of c19.lessons)l.body=l.body.replace('独立拓展和全书最终精修仍需继续','独立拓展和跨章综合已开放，可继续迁移与复习');}

function renderAtlasDemo(l,value,art,esc){
 const d=l.demo,a=d.states.find(x=>x.value===value)||d.states[0],v=a.value;let scene='';
 const node=(name,cls='')=>`<span class="observe-node ${cls}">${name}</span>`,arrow='<i class="observe-arrow">⟶</i>';
 switch(d.scene){
 case'time':scene=`<div class="observe-time"><span>过去</span><b>现在参照 ●</b><span>将来</span><div class="observe-time-line"></div>${v==='habit'?'<div class="repeat-marks">↻　↻　↻　↻<small>每周重复</small></div>':'<div class="live-ring">●<small>正在进行</small></div>'}</div>`;break;
 case'world':scene=`<div class="observe-world"><article>${node('现实')}<p>Mia 不在这里</p><strong>在别处</strong></article><article class="${v==='wish'?'dream-on':''}">${node('愿望气泡')}<p>但愿 Mia 在这里</p><strong>${v==='wish'?'♡ 希望不同':'点击另一种观察'}</strong></article></div>`;break;
 case'agreement':scene=`<div class="observe-baskets">${Array.from({length:v==='one'?1:3},()=>'<span class="observe-basket">♧ ♧ ♧<small>basket</small></span>').join('')}${arrow}${node(v==='one'?'is':'are','verb-controller')}</div><p class="observe-mini">篮子的数量控制动词，内部的花不抢指挥棒。</p>`;break;
 case'passive':scene=`<div class="observe-event">${node('Mia',v==='agent'?'focus-node':'')}${arrow}${node('sign',v==='patient'?'focus-node':'')}</div><p class="observe-mini">动作方向始终 Mia → sign；金框只表示句子起点。</p>`;break;
 case'space':scene=`<div class="observe-space ${v}"><div class="observe-box">BOX</div><span class="observe-star">★</span>${v==='enter'?'<span class="observe-path">外　⟶　内</span>':'<span class="observe-path">静止在内部</span>'}</div>`;break;
 case'clause':scene=v==='direct'?'<div class="observe-chips"><b>Where</b><b>does</b><b>Mia</b><b>live?</b></div><p class="observe-mini">直接提问</p>':'<div class="observe-chips"><b>I know</b><span class="observe-capsule"><b>where</b><b>Mia</b><b>lives</b></span></div><p class="observe-mini">外部：know 的宾语；内部：Mia lives</p>';break;
 case'relative':scene=v==='identify'?'<div class="observe-candidates"><span>助手 ○</span><strong>红衣助手 ●</strong><span>助手 ○</span></div><p class="observe-mini">线索帮助辨认其中一位</p>':'<div class="observe-event"><span>Mia</span><b class="observe-comma">,</b><span class="observe-note">who is our guide</span><b class="observe-comma">,</b></div><p class="observe-mini">已经明确的人物，添加旁注</p>';break;
 case'logic':scene=`<div class="observe-event">${node(v==='cause'?'已经下雨':'会下雨吗？')}${arrow}${node(v==='cause'?'因此进屋':'若下雨才进屋')}</div><div class="observe-logic ${v}">${v==='cause'?'已给出的原因':'?　条件尚不保证发生'}</div>`;break;
 case'compare':{const data=v==='height'?[5,3]:[2,5];scene=`<div class="observe-bars">${['Mia','Leo'].map((n,i)=>`<article><div style="height:${data[i]*18}px"><strong>${data[i]}</strong></div><span>${n}</span></article>`).join('')}</div><p class="observe-mini">${v==='height'?'身高示意格':'书本数量'} · 只比较当前维度</p>`;break;}
 case'activity':scene=`<div class="observe-event">${node(v==='content'?'job 的内容':'Mia 的动作')}${arrow}<span class="activity-orb ${v}">painting signs</span></div><p class="observe-mini">${v==='content'?'活动作为工作内容，不保证此刻在做':'进行结构描述此刻动作'}</p>`;break;
 case'purpose':scene=`<p class="observe-mini">愿望中的内容，不保证已经实现</p><div class="observe-event">${node(v==='active'?'Mia 来搬':'有人来搬')}${arrow}${node('sign')}</div><p class="observe-mini">${v==='active'?'Mia 是搬运参与者':'sign 是受到搬运的对象；Mia 表达愿望'}</p>`;break;
 case'participle':scene=`<div class="observe-event">${node(v==='source'?'Mia 的讲解':'演出')}${arrow}${node(v==='source'?'访客感到兴奋':'Mia 感到兴奋')}</div><p class="observe-mini">${v==='source'?'exciting：引起感受':'excited：体验感受'}</p>`;break;
 case'reduce':scene=`<div class="observe-chips"><b>Mia can sing</b><b>and Leo can</b><b class="${v==='short'?'faded-word':''}">sing</b><b>too.</b></div><p class="observe-mini">${v==='short'?'第二个 sing 可恢复，can 和 too 保留':'两人都具备唱歌能力'}</p>`;break;
 }
 return `<div id="lesson-demo" class="lesson-demo atlas-demo" data-value="${v}"><div class="demo-top"><strong>观察小实验 · 不计分</strong><span>先停下观察，再播放示意</span></div><div class="demo-controls">${d.states.map((x,i)=>`<button data-action="lesson-demo" data-value="${x.value}" aria-pressed="${v===x.value}" class="${v===x.value?'selected':''}">${i+1} · ${esc(x.label)}</button>`).join('')}<button data-action="demo-motion" aria-pressed="false">▶ 播放示意</button></div><div class="observation-frame paused scene-${d.scene} state-${v}">${scene}</div><p lang="en">${esc(a.text)}</p><p>${esc(a.note)}</p><button class="sound-button" data-action="speak" data-text="${esc(a.text)}">♫ 听这句话</button></div>`;
}
function renderEditor(q,l,locked,esc){const s=l.settings,off=locked?'disabled':'';return `<div class="editor-desk"><div class="editor-original"><small>原稿与需要保留的意思</small><p lang="en">${esc(q.original)}</p><div class="editor-parts">${q.parts.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div><div class="editor-arrow">↓ 按任务改写，再核对证据</div><div class="editor-draft ${s.version?'drafted':''}"><small>你的候选稿 · 尚须检查</small><p lang="en">${esc(s.version||'先选择一份候选稿')}</p></div><div class="editor-proof"><small>你选择的核对证据</small><p>${esc(s.evidence||'再选择保留了什么')}</p></div>${Object.entries(q.axes).map(([axis,items])=>`<fieldset><legend>${axis==='version'?'① 选符合原意与任务的候选稿':'② 选择正确的核对证据'}</legend>${items.map(([v,t])=>`<button data-action="lab-direct" data-axis="${axis}" data-value="${esc(v)}" aria-pressed="${s[axis]===v}" class="${s[axis]===v?'selected':''}" ${off}>${esc(t)}</button>`).join('')}</fieldset>`).join('')}<button class="primary" data-action="check-lab" ${locked||!s.version||!s.evidence?'disabled':''}>核对稿件与证据 ✓</button><p class="interaction-tip">不按句子长短判对错；这题只核对给定的候选方案。</p></div>`;}
function renderQuestTrail(chapter,done,esc){if(chapter.kind!=='integrated')return '';const total=chapter.missions.length,complete=chapter.missions.filter(m=>done.includes(m.id)).length;return `<section class="quest-trail" aria-label="庆典故事进度"><div><strong>开园庆典 · ${complete} / ${total} 幕完成</strong><p>${complete===total?'整场冒险已走完。可以重玩，试着先自己解释再看反馈。':'每一幕解决一个真实表达任务，可按顺序玩，也能先回顾感兴趣的部分。'}</p></div><div class="quest-stops">${chapter.missions.map((m,i)=>`<button data-action="play" data-id="${m.id}" class="${done.includes(m.id)?'finished':''}" aria-label="${esc(m.title)}">${done.includes(m.id)?'✓':i+1}</button>`).join('')}</div></section>`;}

// Four meaning-led mechanisms for non-finite structures and careful reduction.
function renderFinale(q,l,locked,art,esc,portraitSVG,answered,feedback){
 const s=l.settings,off=locked?'disabled':'';
 const button=(axis,value,title,extra='')=>`<button data-action="lab-direct" data-axis="${axis}" data-value="${esc(value)}" aria-pressed="${s[axis]===value}" class="${s[axis]===value?'selected ':''}${extra}" ${off}>${esc(title)}</button>`;
 const field=(axis,title)=>`<fieldset><legend>${title}</legend>${q.axes[axis].map(([v,t])=>button(axis,v,t)).join('')}</fieldset>`;
 const person=v=>v==='sign'?art('sign'):v==='book'||/box|book/.test(v)?art('book'):v==='reader'?art('portrait'):portraitSVG({size:'small',color:v==='Leo'?'blue':'red',prop:'hat'});
 let stage='',controls='',preview='';

// A noun-to-clue link, an event relation circuit, and a structural bridge/comparison ruler.
function renderCrossing(q,l,locked,art,esc,portraitSVG,answered,feedback){
 const s=l.settings,off=locked?'disabled':'';
 const button=(axis,value,label,extra='')=>`<button data-action="lab-direct" data-axis="${axis}" data-value="${esc(value)}" aria-pressed="${s[axis]===value}" class="${s[axis]===value?'selected ':''}${extra}" ${off}>${esc(label)}</button>`;
 const field=(axis,label)=>`<fieldset><legend>${label}</legend>${q.axes[axis].map(([v,t])=>button(axis,v,t)).join('')}</fieldset>`;
 let stage='',controls='',preview='';
 if(q.type==='relative'){
  const index=q.axes.head.findIndex(([v])=>v===s.head),x=index===0?125:375;
  const icon=h=>/sign/i.test(h)?'sign':/map/i.test(h)?'map':/book|news/i.test(h)?'book':/garden/i.test(h)?'flower':/day/i.test(h)?'clock':/box/i.test(h)?'box':/bag|hat/i.test(h)?'bag':/race/i.test(h)?'star':'fox';
  stage=`<div class="relative-desk mode-${s.mode||'waiting'}"><span class="lab-overline">① 找到这条线索要接的对象</span><div class="antecedent-cards">${q.axes.head.map(([v,t])=>`<div class="antecedent ${s.head===v?'anchored':''}"><div>${art(icon(v))}</div>${button('head',v,t)}</div>`).join('')}</div><div class="relative-wire"><svg viewBox="0 0 500 65" aria-hidden="true">${index>=0?`<path d="M${x} 2 Q${x} 31 250 35 L250 63" fill="none" stroke="#aab6a2" stroke-width="3"/><circle cx="${x}" cy="4" r="5" fill="#aab6a2"/><circle class="wire-signal" cx="250" cy="59" r="5" fill="#d0ae6a"/>`:'<path d="M250 0V63" stroke="#ced6c6" stroke-dasharray="5 5"/>'}</svg></div><div class="clue-envelope"><b class="comma-tag">${s.mode==='extra'?',':'◌'}</b><div><span>${s.mode==='extra'?'补充信息的旁注':s.mode==='defining'?'帮助辨认的线索':'先决定线索的工作'}</span><p lang="en">${esc(s.clue||'〔选择关系从句〕')}</p></div><b class="comma-tag">${s.mode==='extra'?',':'◌'}</b></div><p class="stage-note">连线指向所选片段；逗号闸门显示你的试接方式，不预先判定正确。</p></div>`;
  controls=field('clue','② 给这个对象接上符合任务的从句')+field('mode','③ 是辨认哪一个，还是补充旁注？');
  preview=s.mode?q.frames[s.mode].replace('{head}',s.head||'〔对象〕').replace('{clause}',s.clue||'〔从句〕'):'先选线索工作，再观察整句';
 }else if(q.type==='chain'){
  const labels={time:'◷ 时间关系',cause:'? 原因关系',condition:'◇ 条件关系',concession:'↝ 让步关系',contrast:'∥ 对照关系',purpose:'◎ 目的关系',result:'✦ 结果关系'};
  stage=`<div class="story-circuit relation-${s.relation||'waiting'}"><span class="lab-overline">事件卡保持原内容 · 连接词决定它们怎样相关</span><div class="event-pair"><article><div>${art(q.leftArt)}</div><p lang="en">${esc(q.left)}</p></article><div class="circuit-joint"><i></i><span>${s.link?esc(s.link):'？'}</span><i></i></div><article><div>${art(q.rightArt)}</div><p lang="en">${esc(q.right)}</p></article></div><div class="relation-dial">${labels[s.relation]||'选择关系机关'}<div class="circuit-lights"><i></i><i></i><i></i></div></div><p class="stage-note">${s.relation==='condition'?'条件未必发生；先看 if / unless 等具体意思。':s.relation==='time'?'左右排列不代表先后顺序；读 before / after 等具体连接。':s.relation==='purpose'?'目的说明想实现什么，不保证目的已经达成。':'亮灯表示试接；不能单凭两件事相邻就断言因果。'}</p></div>`;
  controls=field('relation','① 故事要求哪种关系？')+field('link','② 装入符合意思的连接词');
  preview=q.frame.replace('{link}',s.link||'___');
 }else if(q.labKind==='bridge'){
  stage=`<div class="parallel-bridge level-${s.level||'waiting'}"><span class="lab-overline">① 两边是什么层级？</span><div class="bridge-islands"><article><span>A</span><p lang="en">${esc(q.left)}</p></article><div class="bridge-plank ${s.link?'connected':''}"><strong>${esc(s.link||'___')}</strong><i></i><i></i><i></i></div><article><span>B</span><p lang="en">${esc(q.right)}</p></article></div><div class="bridge-level">${s.level?esc(q.axes.level.find(([v])=>v===s.level)[1])+' ↔ 同层连接':'先判断：词、短语还是完整分句？'}</div><p class="stage-note">桥搭上不等于句子一定正确；层级、意思和连接词要一起检查。</p></div>`;
  controls=field('level','① 识别两边连接的结构层级')+field('link','② 用符合任务的连词搭桥');
  preview=q.frame.replace('{left}',q.left).replace('{right}',q.right).replace('{link}',s.link||'___');
 }else{
  const metric=s.measure,data=q.readings[metric],names={height:'身高刻度 · 格',books:'书本数量 · 本',speed:'速度刻度 · 格'};
  stage=`<div class="comparison-ruler measure-${metric||'waiting'}"><span class="lab-overline">比较尺 · ${names[metric]||'先选同一个维度'}</span><div class="comparison-people">${['Mia','Leo'].map((name,i)=>`<article><div class="metric-tower">${data?`<div class="metric-bar" style="height:${data[i]*17}px"><strong>${data[i]}</strong></div>`:'<span class="unknown-metric">?</span>'}</div><div class="ruler-person">${portraitSVG({size:'small',color:i?'blue':'red',prop:i?'hat':'book'})}${metric==='speed'?`<span class="speed-spark" style="--lap:${(7-data[i])*.5}s">✧</span>`:''}</div><strong>${name}</strong>${metric==='books'?`<div class="little-books" aria-label="${data[i]} 本书">${'▣ '.repeat(data[i])}</div>`:''}</article>`).join('')}</div><div class="ruler-base"><i></i><i></i><i></i><i></i><i></i><i></i></div><p class="stage-note">只比较所选维度。身高和速度刻度为示意；图中高低不是质量，也不是学习能力。</p></div>`;
  controls=field('measure','① 这次要比较哪一个维度？')+field('line','② 按同一维度的数值选择表达');
  preview=s.line||'请选择符合图中关系的句子';
 }
 const filled=Object.keys(q.axes).every(k=>s[k]);
 return stage+`<div class="voyage-controls crossing-controls">${controls}</div><div class="lab-preview" aria-live="polite"><small>${answered?'这次连接成功':feedback?'试操作 · 请看解释后重试':'你的试操作 · 尚未判定'}</small><p lang="en">${esc(preview)}</p></div><button class="primary" data-action="check-lab" ${locked||!filled?'disabled':''}>${q.type==='relative'?'检查线索与逗号':q.type==='chain'?'检查故事的连接':'检查桥梁与比较'} ✓</button>`;
}

        "body": "I know where Mia lives. 里，where Mia lives 有自己的主语和动词，但整体是 know 的宾语。初学常把这种整体做名词式工作的结构称为名词性从句；能做类似工作不代表任何位置、搭配都可随意互换。",
        "example": "I know where Mia lives.",
        "zh": "我知道米娅住在哪里。",
        "visual": "box",
        "tags": [
          "从句内部有结构",
          "对主句整体起作用",
          "不是任意替换"
        ]

      {
        "title": "外面问，里面仍按陈述语序",
        "body": "Where does Mia live? 是直接问句。I know where Mia lives. 里的嵌入从句不把 does 放到主语前；去掉提问用 does 后，lives 恢复第三人称形式。who 作主语时通常原本就不需要这种倒装。",
        "example": "Where does Mia live? I know where Mia lives.",
        "zh": "米娅住哪里？我知道她住哪里。",
        "visual": "train",
        "tags": [
          "主语 + 动词",
          "不保留提问用 do/does/did",
          "谁作主语要看清"

      {
        "title": "that、what 与是否不是同一个包",
        "body": "that 常引入完整陈述内容；what 可表示什么或……的东西，并在从句里担任角色。whether/if 表示是否，仍保留未定的问题内容。用陈述语序不意味着从句内容一定不是问题。",

          "是否"

// Three distinct semantic stages; answers use the shared review/progress pipeline.
function renderExpedition(q,l,locked,art,esc,portraitSVG,answered,feedback){
 const s=l.settings,off=locked?'disabled':'',chosen=(axis,value)=>s[axis]===value;
 const button=(axis,value,label,extra='')=>`<button data-action="lab-direct" data-axis="${axis}" data-value="${esc(value)}" aria-pressed="${chosen(axis,value)}" class="${chosen(axis,value)?'selected ':''}${extra}" ${off}>${esc(label)}</button>`;
 const controls=(axis,title)=>`<fieldset><legend>${title}</legend>${q.axes[axis].map(([v,t])=>button(axis,v,t)).join('')}</fieldset>`;
 let stage='',controlsHTML='',preview='';
 if(q.type==='passive'){
  const f=s.focus;
  stage=`<div class="passive-stage focus-${f||'empty'}"><div class="film-perforations" aria-hidden="true">▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪ ▪</div><div class="film-context"><span>原事件 · ${esc(q.time)}</span><p lang="en">${esc(q.active)}</p></div><div class="event-cast"><div class="cast-node actor-node"><span>动作发出的一方</span><div>${portraitSVG({size:'small',color:'red',prop:'hat'})}</div><strong>${esc(q.actor)}</strong><small>${f==='agent'?'📷 句子的起点':'事件角色保持'}</small></div><div class="event-arrow"><span>作用方向</span><i></i><b aria-hidden="true">➜</b></div><div class="cast-node patient-node"><span>动作涉及的对象</span><div>${art(q.objectArt)}</div><strong>${esc(q.patient)}</strong><small>${f==='patient'?'📷 句子的起点':'事件角色保持'}</small></div></div><p class="stage-note">机位只换关注点，事件箭头不会反转。选中的动词仍需检查。</p></div>`;
  controlsHTML=controls('focus','① 这句话从哪一方说起？')+controls('film','② 装入保留原时间的动词胶片');
  preview=f?q.frames[f].replace('{film}',s.film||'___'):'先选择句子的起点';
 }else if(q.type==='treasure'){
  const spot=s.spot;
  if(q.mapKind==='space'){
   const coords={inside:[48,55],top:[48,28],below:[48,87],beside:[84,55],behind:[38,34]};
   const pos=coords[spot]||[14,22];
   stage=`<div class="treasure-space pos-${spot||'waiting'}"><div class="map-horizon"></div><div class="chest-shadow"></div><div class="treasure-chest"><span>BOX · 箱子</span><i></i></div><div class="treasure-star" style="left:${pos[0]}%;top:${pos[1]}%">★</div><div class="chest-front" aria-hidden="true"></div>${q.axes.spot.map(([v,t])=>{const [x,y]=coords[v];return `<div class="map-anchor anchor-${v}" style="left:${x}%;top:${y}%">${button('spot',v,t,'map-pin')}</div>`;}).join('')}<span class="map-view-label">从正面看 · 箱下留有空间</span></div>`;
  }else if(q.mapKind==='route'){
   const paths={enter:'M 25 65 L 72 65',exit:'M 72 65 L 25 65',cross:'M 110 125 L 210 125',follow:'M 129 188 L 129 30',toward:'M 220 185 L 278 60'};
   const d=paths[spot]||'';
   stage=`<div class="treasure-route route-${spot||'waiting'}"><svg viewBox="0 0 320 220" role="img" aria-label="路线地图：左侧箱子，中间河流，右上小屋。选路线后显示箭头。"><defs><marker id="route-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L6 3.5L0 7" fill="none" stroke="#a87c44" stroke-width="1.5"/></marker></defs><rect width="320" height="220" rx="16" fill="#e7efdb"/><path d="M150 0Q181 60 163 110T170 220" stroke="#b6d9df" stroke-width="30" fill="none"/><path d="M150 0Q181 60 163 110T170 220" stroke="#e2f4ed" stroke-width="2" stroke-dasharray="7 10" fill="none"/><rect x="47" y="40" width="50" height="50" rx="5" fill="#d8b77a" stroke="#b59360" stroke-width="2"/><text x="72" y="105" text-anchor="middle" font-size="10" fill="#6b785e">箱子</text><path d="M250 45L278 22L305 45V76H250Z" fill="#b7ca9f"/><path d="M244 45L278 16L311 45" fill="#d2aa7b"/><text x="278" y="93" text-anchor="middle" font-size="10" fill="#6b785e">小屋</text><text x="180" y="201" font-size="10" fill="#668f99">河流</text>${d?`<path class="route-path" d="${d}" fill="none" stroke="#a87c44" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#route-arrow)"/><path class="route-traveller" d="M0 -9L3 -3L9 -3L4 2L6 8L0 4L-6 8L-4 2L-9 -3L-3 -3Z" fill="#d7ac52" stroke="#fff5cd" stroke-width="1" style="offset-path:path('${d}');"/>`:''}</svg>${d?'':'<span class="route-wait">选一条路线，星星就会出发</span>'}</div>`;
  }else{
   const cards={clock:['◷','09:00','一个钟点'],day:['▦','MONDAY','星期一'],month:['❀','JUNE','六月'],earlier:['←','BEFORE','午饭之前'],later:['→','AFTER','午饭之后']};
   stage=`<div class="calendar-board">${q.axes.spot.map(([v,t])=>`<article class="calendar-card ${chosen('spot',v)?'lit':''}"><span>${cards[v][0]}</span><strong>${cards[v][1]}</strong><small>${cards[v][2]}</small>${button('spot',v,t)}</article>`).join('')}</div>`;
  }
  controlsHTML=(q.mapKind==='space'?'<p class="stage-note">① 点击图中位置标签摆放星星；金色星星表示你选的位置。</p>':q.mapKind==='route'?controls('spot','① 选择行走路线'):'<p class="stage-note">① 点亮符合任务的时间卡。</p>')+controls('phrase','② 给地图接上完整介词短语');
  preview=q.frame.replace('{phrase}',s.phrase||'___');
 }else if(q.type==='capsule'){
  stage=`<div class="capsule-port"><div class="port-skeleton"><small>题目的句子骨架</small><p lang="en">${esc(q.frame.replace('{clause}','〔 整个从句 〕'))}</p></div><div class="sealed-capsule ${s.clause?'sealed':''}"><span>◉ 一个完整内容包</span><p lang="en">${esc(s.clause||'先选择内部语序')}</p><i aria-hidden="true"></i></div><div class="shipping-line ${s.dock?'connected':''}"><span>${s.dock?'↓ 试送到所选泊位':'↓ 选择这个整体的工作'}</span></div><div class="port-docks">${q.axes.dock.map(([v,t])=>`<div class="port-dock ${chosen('dock',v)?'docked':''}">${button('dock',v,t)}<span aria-hidden="true">${chosen('dock',v)?'📦':'◌'}</span></div>`).join('')}</div><p class="stage-note">胶囊内部也要语法正确。送到泊位只是试操作，确认后再看是否适合题目。</p></div>`;
  controlsHTML=controls('clause','① 封装从句：选择符合中文任务的内部表达')+'<p class="stage-note">② 在上方五个泊位中，选择这个整体在句子里的工作。</p>';
  preview=(s.clause||'〔尚未封装〕')+(s.dock?' → '+q.axes.dock.find(([v])=>v===s.dock)[1]:' → 等待选择泊位');
 }
 const filled=Object.keys(q.axes).every(k=>s[k]);
 return stage+`<div class="voyage-controls expedition-controls">${controlsHTML}</div><div class="lab-preview" aria-live="polite"><small>${answered?'这次连接成功':feedback?'试操作 · 请看解释后重试':'你的试操作 · 尚未判定'}</small><p lang="en">${esc(preview)}</p></div><button class="primary" data-action="check-lab" ${locked||!filled?'disabled':''}>${q.type==='passive'?'检查这次换机位':q.type==='treasure'?'检查地图与表达':'检查胶囊与泊位'} ✓</button>`;
}

{title:'先问：你说的是哪一个？',body:'bird 只说“鸟”；a small bird 加上大小；the bird in the tree 再说明在哪里。形容词和其他定语都能添加信息，有些用于认出对象，有些只是补充描述。画像游戏先练习认出对象。',example:'The small fox in a blue hat is here.',zh:'戴蓝帽子的小狐狸在这里。',visual:'portrait',tags:['small → 大小线索','in a blue hat → 帽子线索','线索一起看，才找得准']},
{title:'短形容词常在前，长线索常在后',body:'a red bag 的 red 在名词前；the fox with a book 的 with a book 在名词后。something new 里的 new 也在后。分词可以单独放前面，如 a sleeping cat；较长的分词短语常放后面。不要背成“分词永远后置”。',example:'A red bag. Something new. A sleeping cat.',zh:'一个红色背包。新的东西。一只睡着的猫。',visual:'paint',tags:['red bag','something new','the fox with a book','the cat sleeping under the tree']},
{title:'多种形状，都能给名词添信息',body:'the bird in the tree 用介词短语；the bird that sings 用定语从句；a book to read 用不定式；the bird singing outside 用分词短语。先找到它们描述的名词，再认识结构名称。具体用法会在后续各章展开。',example:'The bird that sings is small.',zh:'那只唱歌的鸟很小。',visual:'bird',tags:['介词短语','定语从句','不定式','分词短语']},
{title:'形容词，也会换句中角色',body:'a happy fox 中 happy 作定语；The fox is happy. 中 happy 作表语。多个形容词放在名词前常有自然顺序，先练“看法 → 大小 → 颜色”，如 a lovely small red bag。这是常见次序，不是所有表达都必须套同一条口诀。',example:'A lovely small red bag. The fox is happy.',zh:'一个可爱的小红背包。狐狸很开心。',visual:'mirror',tags:['词性不变，句中功能可以变','限定词 a / the / my 与形容词有区别','先练清楚、自然的短语']}

{id:'be1',number:'BE',kind:'extension',title:'身份镜屋',subtitle:'换一个人物，让 be 找到新搭档',mechanic:'人物切换 · 时间镜面 · be 连接',theme:'lavender',scene:'mirror',book:'拓展 1 · 书内 49–52 页',brief:'I am、she is、they are：人物走到镜子前，连接词也跟着变。再试昨天、否定句和问句，分清 be 的两份工作。',lessons:[
{title:'现在，谁站在镜子前？',body:'I 配 am；he/she/it 和单个名字配 is；you/we/they 配 are。you 指一个人或多个人时都配 are。be 后面可以说身份、状态或位置，不必每次都硬译成“是”。',example:'I am happy. She is a painter. They are here.',zh:'我很开心。她是一位画家。他们在这里。',visual:'mirror',tags:['I am','she / he / it is','you / we / they are','单数名字 Mia is']},
{title:'昨天的镜子',body:'说过去的状态，I/he/she/it 常配 was，you/we/they 常配 were。这里只练普通陈述句；虚拟结构等特殊情形以后再学。be 的家族还包括原形 be、过去分词 been、-ing 形式 being，要按结构选择。',example:'I was tired yesterday. They were happy.',zh:'我昨天很累。他们（那时）很开心。',visual:'clock',tags:['现在 am / is → 过去 was','现在 are → 过去 were','will / can 后用 be','have / has 后可用 been']},
{title:'镜子与动作助手，是两份工作',body:'Mia is happy. 里的 is 连接米娅和状态，是系动词。Mia is reading. 里的 is 与 reading 合作构成进行时，是助动词。被动结构也会用到 be。不能看到 be 后有词，就把后面统统叫作表语。',example:'Mia is happy. Mia is reading.',zh:'米娅很开心。米娅正在读书。',visual:'mirror',tags:['连接身份 / 状态 / 位置','be + 动词-ing → 进行结构','be + 过去分词 → 可构成被动','不能随意删掉 be']},
{title:'加 not，或者换个站位',body:'否定句把 not 放在 be 后：She is not tired. 问句把 be 提到主语前：Is she tired? 简短回答可以说 Yes, she is. 不必加 do。短语 the book on the shelf 可以描述书，但它本身还不是普通的完整陈述句。',example:'Is she tired? No, she is not.',zh:'她累吗？不，她不累。',visual:'book',tags:['she is → she is not','she is → is she?','不能说 she happy 来代替普通陈述句','短语与完整句子分开认识']}

{id:'c6',number:'06',title:'动作导演台',subtitle:'一句话，可以拍出不同的故事',mechanic:'调节场景 · 动作播放 · 状语导演',theme:'blue',scene:'director',book:'第 6 章 · 书内 53–68 页',brief:'让阿栗慢慢走、快速走，在花园里走，或者有时才走。用控制台看见副词与状语怎样改变一段故事。',lessons:[
{title:'给动作调一调',body:'quickly 和 slowly 说怎样做；always、sometimes、never 说多常做；today 说什么时候；here 说在哪里；very 可以加强形容词；luckily 可以表达说话者对整件事的看法。副词不只是以 -ly 结尾的词。',example:'The fox walks slowly. The fox walks quickly.',zh:'狐狸慢慢走。狐狸快速走。',visual:'director',tags:['方式 how','频率 how often','时间 when','地点 where','程度 how much','评论整件事']},
{title:'位置灵活，但有自然习惯',body:'频率副词常在普通实义动词前：Mia often reads. 在 be 作主要动词时常放后面：Mia is often happy. 方式副词可在句末；有宾语时不要机械插到动词和宾语之间。并不是所有副词只有一个合法位置。',example:'Mia often reads. Mia is often happy.',zh:'米娅经常读书。米娅经常很开心。',visual:'train',tags:['often reads','is often happy','reads the book carefully','Carefully, ... 等位置也可能成立']},
{title:'一整组词，也能当导演',body:'in the garden 说地点；after lunch 说时间；because it rains 说原因；to help Mia 说目的；smiling 也能说明伴随状态。它们不是同一种词，却都能给句子添信息。分词状语要留心逻辑主语。',example:'In the garden, Mia reads to learn.',zh:'在花园里，米娅读书来学习。',visual:'capsule',tags:['介词短语','状语从句','不定式表目的','分词表伴随等','同一短语在不同句子里功能会变']},
{title:'已经、仍然、还没',body:'already 表示到参照时间前已经发生；still 说状态仍在持续；not ... yet 说到参照时间还没发生，常有期待。它们不是过去、现在、将来的替身。先用现在的生活场景练习，更复杂用法以后展开。',example:'I am still reading. I have not finished yet.',zh:'我仍在读。我还没有读完。',visual:'clock',tags:['already：已经','still：仍然','not ... yet：还没有','yet 常见于否定和问句，但并非永不能用于肯定句']}

if(q.type==='director'){const s=l.settings,filled=Object.keys(q.axes).every(k=>!!s[k]),sentence=q.frame.replace(/\{(\w+)\}/g,(_,k)=>s[k]||'___'),freq=s.frequency==='always'?5:s.frequency==='sometimes'?2:s.frequency==='never'?0:null;body=`<div class="director-room"><div class="movie-stage ${q.axes.degree?'degree-scene':''} ${s.place==='at home'?'at-home':'garden'} ${s.time==='tomorrow'?'tomorrow':''} ${s.frequency==='never'?'never':''}" style="--walk-time:${s.manner==='quickly'?'1.5s':'5s'}"><span class="movie-sun">${s.time==='tomorrow'?'明天':'☀'}</span><div class="movie-scenery">${art(s.place==='at home'?'house':'flower')}</div><div class="walking-fox">${portraitSVG({size:'small',color:'red',prop:'hat'})}</div>${s.degree?`<span class="tired-meter" aria-label="疲倦程度">${s.degree==='very'?'Z z z z':'z'}<i style="width:${s.degree==='very'?88:25}%"></i></span>`:''}${freq!==null?`<div class="frequency-dots" aria-label="频率示意，非精确比例">${Array.from({length:5},(_,i)=>`<i class="${i<freq?'on':''}"></i>`).join('')}<span>${s.frequency==='never'?'从不出发':s.frequency==='always'?'每次出发':'有时出发'}</span></div>`:''}</div><div class="director-controls">${Object.entries(q.axes).map(([axis,opts])=>`<fieldset><legend>${({manner:'速度与方式',place:'地点',frequency:'频率',time:'故事时间',degree:'程度'})[axis]}</legend>${opts.map(([v,t])=>`<button data-action="lab-direct" data-axis="${axis}" data-value="${v}" aria-pressed="${s[axis]===v}" class="${s[axis]===v?'selected':''}" ${off}><strong>${esc(v)}</strong><small>${esc(t)}</small></button>`).join('')}</fieldset>`).join('')}</div><div class="lab-preview"><small>正在试拍的故事</small><p lang="en">${esc(sentence)}</p></div><button class="primary" data-action="check-lab" ${locked||!filled?'disabled':''}>这个镜头符合任务 ✓</button></div>`;}

render(`<div class="game-top">${btn('← '+(session.review?'复习背包':c.title),'leave-play',`data-id="${c.id}"`,'back')}<span>${session.review?'复习挑战':m.title}</span><span>${session.index+1} / ${session.questions.length}</span></div><div class="game-progress"><i style="width:${session.index/session.questions.length*100}%"></i></div><section class="play-header">${label(session.review?'LET’S TRY AGAIN':c.mechanic)}<h1>${gameTitle(q,c)}</h1><p>${CUSTOM_TYPES.has(q.type)?esc(q.zh):q.type==='build'?'按中文意思拼句。词块已经准备好了。':q.type==='role'?esc(q.zh):q.target==='整句'?'读一读场景，选择符合本题意思的表达或解释。':q.target==='主干'?'拿掉这句中可选的细节，保留主干。':'观察场景和高亮提示，慢慢想一想。'}</p></section><div class="game-layout chapter-${c.id} ${q.type==='time'?'time-game':''}"><aside class="question-scene ${c.theme}">${art(q.icon)}<div class="guide-caption">${q.type==='build'?'词块建筑台':q.type==='role'?'每节车厢，都有自己的工作':q.type==='time'?'故事没变，时间镜头变了':'先想意思，再找它的工作'}</div></aside><section class="challenge"><div class="sentence-box"><div class="sentence-label"><span>${q.type==='build'?'你的任务':'看看这句话'}</span>${btn('♫ 听英文','speak',`data-text="${esc(questionSentence(q))}"`,'sound-button')}</div>${q.type==='build'?`<h2>${esc(q.zh)}</h2>`:`<h2 lang="en">${CUSTOM_TYPES.has(q.type)?esc(questionSentence(q)):highlighted(q)}</h2><p>${q.type==='role'?esc(''):esc(q.zh)}</p>`}${q.type!=='build'&&q.target&&q.target!=='整句'?`<span class="target-label">${q.type==='role'?'':esc(q.target)}</span>`:''}</div>${interaction}<div id="feedback" aria-live="polite"></div><div class="game-tools">${btn('☀ 阿栗的提示','hint','','text-button')}${btn('听中文任务','speak',`data-lang="zh-CN" data-text="${esc(q.zh)}"`,'text-button')}<span>书内 ${esc(q.pages)} 页 · 原创练习</span></div></section></div>`,!keepPosition);
if(keepPosition){const next=document.querySelector('.word-bank button:not(:disabled)')||document.querySelector('[data-action="check-build"]');next?.focus({preventScroll:true});}if(session.feedback)showFeedback();if(state.settings.auto&&!keepPosition&&session.attempts===0)speak(questionSentence(q));}
function relatedStories(q){return q.links?.length?'<div class="related-stories"><p>回看相关小故事，关闭后继续当前挑战。</p>'+q.links.map(id=>btn(esc(chapterById(id).title),'related-story','data-id="'+id+'"','text-button')).join('')+'</div>':'';}
function showFeedback(){const f=session.feedback,q=session.questions[session.index];$('#feedback').innerHTML=`<div class="feedback ${f.correct?'correct':'retry'}"><span class="feedback-icon">${f.correct?'✦':'☀'}</span><div><h3>${f.correct?(session.attempts===1?'你发现规律啦！':'这次连接上啦！'):'没关系，我们一起看看'}</h3><p>${esc(q.why)}</p>${f.correct?`<p class="correct-answer" lang="en">${esc(q.sentence.replace('___',q.answer||''))}</p>${btn('♫ 听完整表达','speak',`data-text="${esc(q.sentence.replace('___',q.answer||''))}"`,'sound-button')}`:''}${btn(f.correct?(session.index===session.questions.length-1?'完成这次探险 →':'下一个挑战 →'):'明白了，再试一次',f.correct?'next':'retry','','primary')}${relatedStories(q)}</div></div>`;$('#feedback [data-action="next"],#feedback [data-action="retry"]')?.focus({preventScroll:true});$('#feedback').scrollIntoView({behavior:state.settings.motion?'smooth':'instant',block:'nearest'});}
function evaluate(answer){if(!session||session.answered||session.feedback)return;const q=session.questions[session.index];session.attempts++;const correct=q.type==='build'?answer===q.words.join('|'):answer===q.answer;if(correct){session.answered=true;session.correct++;if(session.attempts===1)session.first++;const old=state.solved[q.id];state.solved[q.id]={independent:!!old?.independent||session.attempts===1};if(session.review)state.wrong=state.wrong.filter(id=>id!==q.id);persist();document.querySelectorAll('[data-action="answer"],[data-action="build"],[data-action="unbuild"],[data-action="check-build"],[data-action="clear-build"]').forEach(b=>b.disabled=true);$('.question-scene')?.classList.add('celebrate');}else{if(!state.wrong.includes(q.id))state.wrong.push(q.id);persist();}document.querySelectorAll('[data-action="answer"],[data-action="build"],[data-action="unbuild"],[data-action="check-build"],[data-action="clear-build"]').forEach(b=>{b.disabled=true;if(correct&&b.dataset.answer===answer)b.classList.add('delivered');});session.feedback={correct};if(CUSTOM_TYPES.has(q.type))updateLab();showFeedback();}
function finish(){stopSpeech();if(!session.review&&!state.done.includes(session.id))state.done.push(session.id);persist();const c=chapterById(session.questions[0].chapter),m=missionById(session.id),next=c.missions[c.missions.findIndex(x=>x.id===session.id)+1];view='finish';render(`<section class="finish-screen"><div class="finish-stars">✧ <span>✦</span> ✧</div>${art('fox')} ${label('ONE LITTLE STEP, WELL DONE!')}<h1>${session.review?'背包又轻了一点！':'一小段冒险，完成啦！'}</h1><p>${session.review?'你重新想了一遍，也让知识更牢了一点。':'你不只选出了答案，也看见了句子背后的关系。'}</p><div class="finish-stats"><div><strong>${session.correct}</strong><span>完成挑战</span></div><div><strong>${session.first}</strong><span>本次独立完成</span></div><div><strong>${state.wrong.length}</strong><span>留待复习</span></div></div><p class="finish-note">${session.first===session.questions.length?'每一道都独立完成，真好。':'看过解释再做对，也是一种进步。答错的题已放进复习背包。'}</p><div class="finish-actions">${next&&!session.review?btn('下一个任务 →','play',`data-id="${next.id}"`):btn(session.review?'回到复习背包':'回到章节故事',''+(session.review?'review':'chapter'),`data-id="${c.id}"`)}${btn('回小岛地图','home','','secondary')}</div></section>`);}
function reviewPage(){view='review';render(`<div class="page-top">${btn('← 小岛地图','home','','back')}<span>温柔地，再试一次</span></div><section class="review-hero"><div>${label('YOUR LITTLE LEARNING BACKPACK')}<h1>复习背包</h1><p>有些知识，需要多见几次面。<br>答对后，它就会从背包里毕业。</p><div class="review-actions">${btn(state.wrong.length?`复习这 ${state.wrong.length} 个挑战 →`:'去小岛上探索 →',state.wrong.length?'start-review':'home')}</div></div>${art(state.wrong.length?'book':'fox')}</section>${state.wrong.length?`<div class="review-list">${state.wrong.map(id=>{const q=qById(id);return `<article><span>☀</span><div><small>${chapterById(q.chapter).title} · ${missionById(q.mission).title}</small><p lang="en">${esc(q.sentence)}</p></div>${btn('♫','speak',`data-text="${esc(q.sentence)}" aria-label="朗读 ${esc(q.sentence)}"`,'sound-button')}</article>`;}).join('')}</div>`:'<div class="empty-state"><span>✧</span><h2>背包现在空空的</h2><p>不用专门答错来填满它。学到的每一点，都算数。</p></div>'}`);}
function planPage(){view='plan';render(`<div class="page-top">${btn('← 小岛地图','home','','back')}<span>19 章 + 3 个拓展 · 全书精做路线</span></div><section class="chapter-heading">${label('A WHOLE WORLD TO DISCOVER')}<h1>一整本书，一座小世界。</h1><p>每章有自己的玩法，让抽象的语法变成可以看见、可以操作的故事。<br>19 章与三个附加专题均已开放，并可进入开园庆典练习跨章运用。</p></section><div class="plan-legend"><span><i class="dot"></i> 第 1–19 章与 be / used / it 已开放</span><span>◐ 原时态样板保留</span><span>✦ 跨章庆典 · 8 幕综合冒险</span></div><section class="roadmap">${roadmap.map((r,i)=>`<${r[5]?'button':'article'} class="roadmap-card ${r[5]?'available':''}" ${r[5]?`data-action="chapter" data-id="${r[5]}"`:''}><span class="road-number">${r[0]}</span><div class="road-art">${art(r[3])}</div><div><span class="status-badge">${r[5]?(r[5]==='t1'?'样板可玩':'已开放 · 可玩'):'后续计划'}</span><h2>${r[1]}</h2><p>${r[2]}</p><small>${r[4]}</small></div>${r[5]?'<span class="road-go">↗</span>':''}</${r[5]?'button':'article'}>`).join('')}</section><section class="plan-note"><h2>全书已经连起来，继续玩出理解</h2><p>每章已有图解故事、核心机制、观察动画与练习。当前开放第 1–19 章、三个附加专题、原时态样板和跨章庆典。本轮精修已覆盖全书；可以重玩、回看和复习，不必赶进度。</p><p>已完成软件检查不等于已经证明教学效果。后续会结合真实使用反馈，继续调整难度与表达。</p></section>`);}
function stopSpeech(){speechToken++;if('speechSynthesis'in window)window.speechSynthesis.cancel();}
function loadVoices(){if('speechSynthesis'in window)voices=window.speechSynthesis.getVoices();}
if('speechSynthesis'in window){loadVoices();window.speechSynthesis.addEventListener('voiceschanged',loadVoices);}
function speak(text,lang='en-US',rate=state.settings.rate){if(!('speechSynthesis'in window)){toast('这个浏览器没有朗读功能，文字仍可正常学习。');return;}stopSpeech();loadVoices();const utterance=new SpeechSynthesisUtterance(text.replace(/___/g,'blank'));utterance.lang=lang;utterance.rate=rate;const voice=voices.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2)));if(voice)utterance.voice=voice;const token=speechToken;let began=false;utterance.onstart=()=>{began=true;toast(lang.startsWith('en')?'正在朗读英文 ♪':'正在朗读中文 ♪');};utterance.onerror=()=>{if(token===speechToken)toast('朗读未能播放。请检查设备声音或切换浏览器重试。');};utterance.onend=()=>{if(token===speechToken)toast('朗读完成，可以再听一次。');};window.speechSynthesis.speak(utterance);setTimeout(()=>{if(!began&&token===speechToken)toast('设备暂未开始朗读。请检查是否安装了对应语言的语音。');},5000);}
function dialog(html){$('#dialog-content').innerHTML=html;$('#dialog').showModal();}
function settings(){loadVoices();dialog(`<div class="dialog-heading"><h2>按你的节奏来</h2>${btn('×','close','','close')}</div><p>不用快，听清楚、看明白就好。</p><label class="field">朗读速度<select id="rate"><option value=".65" ${state.settings.rate===.65?'selected':''}>慢一点 · 0.65 倍</option><option value=".8" ${state.settings.rate===.8?'selected':''}>轻松听 · 0.8 倍</option><option value="1" ${state.settings.rate===1?'selected':''}>正常速度 · 1 倍</option></select></label><label class="toggle-row"><span><strong>自动读英文题目</strong><small>进入新题时朗读；也可以随时手动重听。</small></span><input type="checkbox" id="auto-read" ${state.settings.auto?'checked':''}></label><label class="toggle-row"><span><strong>开启场景动画</strong><small>关闭后画面静止，操作仍可正常进行。</small></span><input type="checkbox" id="motion" ${state.settings.motion?'checked':''}></label><p class="settings-help">朗读使用浏览器或系统语音，不录音、不开麦。声音与离线可用性取决于设备。${voices.some(v=>v.lang.startsWith('en'))?'已检测到英文声音。':'尚未检测到英文声音，首次播放时系统可能继续加载。'}</p><div class="settings-actions">${btn('♫ 试听英文','test-speech','','secondary')}${btn('导出进度','export','','secondary')}<label class="file-button">恢复进度<input type="file" id="import-progress" accept="application/json,.json"></label></div><p class="settings-help">进度仅保存在当前浏览器。换设备前可导出，恢复时会覆盖当前进度。</p>${btn('保存设置','save-settings','','primary wide')}`);}
function about(){dialog(`<div class="dialog-heading"><h2>学习说明</h2>${btn('×','close','','close')}</div><p>语法小岛把抽象规则变成有意义的操作。建议先看每章小故事，再做任务；如果还不认识英文，请使用英文朗读和中文提示，儿童可由成人陪同。</p><p>当前开放第 1–19 章与 be、used、it 三个拓展的核心学习目标，含 ${allQuestions.length} 个原创挑战。第 7 章新增十二种常见时态组合，原入门样板仍可重玩。三个附加专题已开放，第 1–6 章已完成本轮精修；第 1–19 章已完成本轮精修，跨章综合庆典已开放；可继续重玩迁移。</p><p>采用《一看就懂的英语语法书》的章节路线，例句、场景与练习为原创改编；使用语境限定和例外提示，避免机械套用简化口诀。五种句型是入门框架。</p><p>补充核对：<a href="https://dictionary.cambridge.org/grammar/british-grammar/complements" target="_blank" rel="noopener">Cambridge · Complements</a>；<a href="https://dictionary.cambridge.org/uk/grammar/british-grammar/verb-patterns-with-and-without-objects" target="_blank" rel="noopener">Verb patterns</a>；<a href="https://learnenglishkids.britishcouncil.org/grammar-vocabulary/grammar-practice/present-simple-present-continuous" target="_blank" rel="noopener">British Council · 现在时入门</a>。</p><p>没有倒计时。答错不扣命：查看解释后重试，并在复习背包重新作答。完成任务与首次答对会分别记录。</p>${btn('明白了，一起探索','close','','primary')}`);}
function download(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='语法小岛-学习进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('学习进度已导出。');}
let importState=null;
document.addEventListener('change',async e=>{if(e.target.id!=='import-progress')return;try{const file=e.target.files[0];if(!file)return;if(file.size>2e6)throw Error('文件太大');importState=sanitize(JSON.parse(await file.text()));$('#dialog-content').innerHTML=`<h2>恢复这份进度？</h2><p>备份包含 ${importState.done.length} 个已完成任务、${Object.keys(importState.solved).length} 个已学挑战。恢复会覆盖当前浏览器记录。</p><div class="settings-actions">${btn('确认恢复','confirm-import')}${btn('保留当前进度','settings','','secondary')}</div>`;}catch{toast('无法读取这份进度，请选择语法小岛导出的 JSON 文件。');e.target.value='';}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;switch(a){
case'home':go('home');break;case'chapter':lessonIndex=0;go('chapter/'+b.dataset.id);break;case'review':go('review');break;case'plan':go('plan');break;case'scroll-map':$('#islands')?.scrollIntoView({behavior:state.settings.motion?'smooth':'instant'});break;case'scroll-missions':$('#missions')?.scrollIntoView({behavior:state.settings.motion?'smooth':'instant'});break;
case'lesson':lessonIndex=Number(b.dataset.index);stopSpeech();chapterPage(currentChapter.id);break;case'play':go('play/'+b.dataset.id);break;case'start-review':go('practice');break;case'leave-play':go(session?.review?'review':'chapter/'+b.dataset.id);break;
case'answer':evaluate(b.dataset.answer);break;
case'lab-bin':if(session?.feedback)return;session.lab.bin=b.dataset.value;updateLab();break;
case'lab-count':if(session?.feedback)return;session.lab.count=Math.max(1,Math.min(5,session.lab.count+Number(b.dataset.value)));updateLab();break;
case'lab-clue':{if(session?.feedback)return;const i=Number(b.dataset.index);session.lab.clues=session.lab.clues.includes(i)?session.lab.clues.filter(v=>v!==i):[...session.lab.clues,i];updateLab();break;}
case'lab-person':if(session?.feedback)return;session.lab.subject=b.dataset.value;updateLab();break;
case'lab-time':if(session?.feedback)return;session.lab.time=b.dataset.value;updateLab();break;
case'lab-be':if(session?.feedback)return;session.lab.be=b.dataset.value;updateLab();break;
case'demo-motion':{const frame=$('#lesson-demo .observation-frame');if(frame){const paused=frame.classList.toggle('paused');b.setAttribute('aria-pressed',String(!paused));b.textContent=paused?'▶ 播放示意':'❚❚ 暂停示意';if(!state.settings.motion)toast('当前已关闭场景动画；文字和观察切换仍可使用。');}break;}
case'related-story':{const c=chapterById(b.dataset.id),l=c?.lessons[0];if(l)dialog('<div class="dialog-heading"><h2>'+esc(c.title)+'</h2>'+btn('×','close','','close')+'</div><p>'+esc(l.body)+'</p><div class="example"><p lang="en">'+esc(l.example)+'</p><small>'+esc(l.zh)+'</small></div>'+btn('♫ 听例句','speak','data-text="'+esc(l.example)+'"','sound-button')+btn('关闭，继续当前挑战','close','','primary'));break;}
case'lesson-demo':{const l=currentChapter?.lessons[lessonIndex],host=$('#lesson-demo');if(host&&l?.demo){host.outerHTML=renderLessonDemo(l,b.dataset.value,art,esc);document.querySelector('#lesson-demo [data-value="'+b.dataset.value+'"]')?.focus({preventScroll:true});}break;}
case'lab-direct':if(session?.feedback)return;session.lab.settings[b.dataset.axis]=b.dataset.value;updateLab();break;
case'check-lab':evaluate(labAnswer(session.questions[session.index],session.lab));break;
case'build':if(session?.feedback)return;session.selected.push(session.pool.find(x=>x.i===Number(b.dataset.index)));game(true);break;
case'unbuild':if(session?.feedback)return;session.selected.splice(Number(b.dataset.index),1);game(true);break;
case'clear-build':if(session?.feedback)return;session.selected=[];game(true);break;
case'check-build':evaluate(session.selected.map(x=>x.word).join('|'));break;
case'retry':session.feedback=null;session.selected=[];session.lab=newLabState();game();break;
case'next':stopSpeech();if(session.index===session.questions.length-1)finish();else{session.index++;prepareQuestion();game();}break;
case'hint':{if(!session)return;session.attempts=Math.max(1,session.attempts);const q=session.questions[session.index];dialog(`<div class="dialog-heading"><h2>阿栗的小提示</h2>${btn('×','close','','close')}</div><div class="hint-art">${art('fox')}</div><p>${esc(q.why)}</p><p class="settings-help">看提示很正常。这一题会记作“看过提示完成”，继续试试吧。</p>${btn('我来试一试','close')}`);break;}
case'time':session.timeView=b.dataset.value;document.querySelectorAll('[data-action="time"]').forEach(t=>{t.classList.toggle('selected',t.dataset.value===session.timeView);t.setAttribute('aria-pressed',String(t.dataset.value===session.timeView));});$('#time-observation').innerHTML=timeScene(session.timeView);break;
case'speak':speak(b.dataset.text,b.dataset.lang||'en-US');break;case'settings':settings();break;case'about':about();break;case'close':$('#dialog').close();break;
case'test-speech':speak('Hello! Welcome to Grammar Island.','en-US',Number($('#rate').value));break;
case'save-settings':state.settings.rate=Number($('#rate').value);state.settings.auto=$('#auto-read').checked;state.settings.motion=$('#motion').checked;persist();$('#dialog').close();toast('已保存，按你的节奏来。');break;
case'export':download();break;case'confirm-import':if(importState){state=importState;importState=null;persist();$('#dialog').close();go('home');toast('进度恢复完成。');}break;
}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))$('#dialog').close();});
function route(){stopSpeech();const [path,id]=location.hash.slice(1).split('/');if(path==='play'){startPlay(id);return;}if(path==='practice'){startPlay(null,true);return;}session=null;if(path==='chapter')chapterPage(id);else if(path==='review')reviewPage();else if(path==='plan')planPage();else home();}
window.addEventListener('hashchange',route);window.addEventListener('pagehide',stopSpeech);route();
