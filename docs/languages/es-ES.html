</script></head><body><header><a href="../suite.html">← 大陆地图</a><span id="courseName" class="brand">语言大陆</span></header><main><div id="notice" role="status" aria-live="polite"></div><div id="app"></div></main><footer>0.11.0 · Español · A1–B1 生活学习目标 · 本地合成音频 · 专业语言审阅与真实学习效果验证待完成</footer><script>window.ContinentData={"id":"es-ES","name":"西班牙语","nativeName":"Español","country":"西班牙","chapters":[{"id":"es-01","number":1,"title":"见面与道别","goal":"在不同时间问候，自我介绍并结束简短交流。","level":"A1","stage":"beginner","grammar":{"title":"主语与 ser 的现在时","explanation":"soy 表示“我是”，eres 表示“你是”。西班牙语常省略主语；问句仍使用倒问号。","examples":[{"text":"Soy Ana.","zh":"我是安娜。"},{"text":"¿Eres de Madrid?","zh":"你来自马德里吗？"}]},"vocab":[{"head":"hola","zh":"你好","example":"Hola, soy Leo.","exampleZh":"你好，我是莱奥。","icon":"talk"},{"head":"buenos días","zh":"早上好","example":"Buenos días, Ana.","exampleZh":"早上好，安娜。","icon":"talk"},{"head":"buenas tardes","zh":"下午好","example":"Buenas tardes, señor Ruiz.","exampleZh":"下午好，鲁伊斯先生。","icon":"talk"},{"head":"buenas noches","zh":"晚上好；晚安","example":"Buenas noches, hasta mañana.","exampleZh":"晚安，明天见。","icon":"talk"},{"head":"adiós","zh":"再见","example":"Adiós, Marta.","exampleZh":"再见，玛尔塔。","icon":"talk"},{"head":"hasta luego","zh":"回头见","example":"Hasta luego, nos vemos.","exampleZh":"回头见，我们再见。","icon":"talk"},{"head":"nombre","zh":"名字","example":"Mi nombre es Eva.","exampleZh":"我的名字是埃娃。","icon":"talk"},{"head":"España","zh":"西班牙","example":"Soy de España.","exampleZh":"我来自西班牙。","icon":"talk"},{"head":"amigo","zh":"朋友","example":"Luis es mi amigo.","exampleZh":"路易斯是我的朋友。","icon":"talk"},{"head":"encantado","zh":"很高兴认识你","example":"Encantado de conocerte.","exampleZh":"很高兴认识你。","icon":"talk"}],"lessons":[{"id":"es-01-1","text":"Hola, me llamo Lin.","zh":"你好，我叫林。","tip":"me llamo 后直接接名字。"},{"id":"es-01-2","text":"¿Cómo te llamas?","zh":"你叫什么名字？","tip":"cómo 表示“怎样”，此处询问名字。"},{"id":"es-01-3","text":"Soy de China.","zh":"我来自中国。","tip":"de 表示来源。"},{"id":"es-01-4","text":"Encantada de conocerte.","zh":"很高兴认识你。","tip":"女性说话者通常说 encantada。"},{"id":"es-01-5","text":"¿Eres de aquí?","zh":"你是这里人吗？","tip":"aquí 指说话者所在的地方。"},{"id":"es-01-6","text":"Hasta mañana.","zh":"明天见。","tip":"hasta 后可接下次见面的时间。"}],"dialogue":[{"speaker":"Ana","text":"Hola, soy Ana. ¿Y tú?","zh":"你好，我是安娜。你呢？"},{"speaker":"Lin","text":"Me llamo Lin. Soy de China.","zh":"我叫林，来自中国。"},{"speaker":"Ana","text":"Encantada. ¿Vives aquí?","zh":"很高兴认识你。你住在这里吗？"},{"speaker":"Lin","text":"Sí, vivo cerca. Hasta luego.","zh":"是的，我住在附近。回头见。"}],"reading":{"title":"楼道里的第一次见面","text":"Lin llega a un edificio de Madrid con una maleta pequeña. En la puerta conoce a Ana, una vecina. Ana dice buenos días y pregunta cómo se llama. Lin se presenta y explica que es de China. Ana es de Madrid y vive en el segundo piso. Los dos hablan un momento. Después, Ana tiene que salir. Se despiden y dicen hasta luego porque esperan verse otra vez por la tarde.","zh":"林带着一个小行李箱来到马德里的一栋楼。在门口，他认识了邻居安娜。安娜说早上好，并问他叫什么名字。林介绍自己，说明自己来自中国。安娜来自马德里，住在三楼。两人聊了一会儿。随后安娜得出门。他们互相道别，说回头见，因为他们希望下午再次碰面。"},"assessment":{"reading":{"title":"书店门口","text":"Por la tarde, Eva entra en una librería pequeña de Toledo. En la puerta saluda a un chico que lleva varios libros. El chico se llama Pablo y es de Valencia, pero ahora vive en Toledo. Eva se presenta y dice que también vive en la ciudad. Pablo tiene una clase y no puede hablar mucho. Los dos se despiden con un hasta luego. Eva entra para buscar un libro de cocina."},"questions":[{"prompt":"他们何时见面？","options":["早上","下午","深夜"],"answer":1,"explanation":"文中开头说 Por la tarde。"},{"prompt":"男孩叫什么？","options":["Pablo","Eva","Lin"],"answer":0,"explanation":"文中明确说男孩叫 Pablo。"},{"prompt":"Pablo 来自哪里？","options":["托莱多","马德里","瓦伦西亚"],"answer":2,"explanation":"他说来自 Valencia，现在住在 Toledo。"},{"prompt":"Eva 要找什么书？","options":["旅游书","烹饪书","语法书"],"answer":1,"explanation":"最后一句是 un libro de cocina。"}],"writing":"写三句自我介绍，包括名字、来自哪里以及一句问候。","speaking":"模拟在楼道认识邻居：问候、交换名字、道别。"},"story":{"id":"es-01","npc":"Ana","place":"小镇入口","scene":"你刚到西班牙，新邻居向你打招呼。先回应，再介绍自己。","text":"¡Hola! ¿Es la primera vez que vienes por aquí?","zh":"你好！你是第一次来这里吗？","icon":"person"},"support":{"id":"es-01","pronunciation":{"focus":"不发音的 h 与五个元音","explanation":"hola 的 h 不发音；a、e、i、o、u 保持清晰，避免把 hola 读成英语式双元音。","examples":[{"text":"Hola, ¿eres el nuevo vecino?","zh":"你好，你是新邻居吗？"},{"text":"Hasta el viernes.","zh":"周五见。"}]},"grammarNotes":["介绍身份用 ser：soy 是第一人称，eres 是 tú 的形式；不能直接用 yo 后接名字而省略动词。","me llamo 已包含第一人称信息，通常不必再说 yo；询问对方用 te llamas，不能照搬 me。","encantado/encantada 随说话者的性别变化，不随听话者变化；来源用 ser de，而不是 estar de。"],"cultureNote":"西班牙日常初见常用 hola；是否握手或贴面礼取决于关系和场合，先观察对方，不把某种礼节当作所有人的习惯。","vocabularyNotes":[{"head":"buenos días","note":"días 为阳性复数，固定说 buenos días；不要按中文“好”统一换成 buenas。"},{"head":"nombre","note":"问名字用 ¿Cómo te llamas? 或 ¿Cuál es tu nombre?；nombre 与 apellido（姓）区分。"},{"head":"encantado","note":"女性说话者常说 encantada；可单独回应，也可接 de conocerte。"}],"transfer":[{"id":"es-01-transfer-1","prompt":"在合唱团首次见面，介绍自己和身份","text":"Buenas tardes, soy la nueva cantante del grupo.","zh":"下午好，我是团里新来的歌手。","explanation":"soy 说明身份，la nueva cantante 明确是新来的女歌手。"},{"id":"es-01-transfer-2","prompt":"想在名单上登记新同伴的名字","text":"Perdona, ¿cómo te llamas para apuntarte en la lista?","zh":"不好意思，你叫什么名字？我要把你记在名单上。","explanation":"te llamas 对应 tú；para 加不定式说明询问目的。"},{"id":"es-01-transfer-3","prompt":"说明出生地与当前居住地不同","text":"Soy de Pekín, pero ahora vivo en Sevilla.","zh":"我来自北京，但现在住在塞维利亚。","explanation":"ser de 表示来源，vivo en 表示居住，不能互换介词。"},{"id":"es-01-transfer-4","prompt":"女性向新同事表达认识后的愉快","text":"Encantada de trabajar contigo en este proyecto.","zh":"很高兴在这个项目中与你共事。","explanation":"说话者为女性用 encantada；contigo 是“与你”。"},{"id":"es-01-transfer-5","prompt":"确认参观者是不是本地人","text":"¿Sois de este barrio o estáis de visita?","zh":"你们是这个街区的人，还是来参观的？","explanation":"西班牙非正式复数用 sois；estar de visita 表示临时来访。"},{"id":"es-01-transfer-6","prompt":"周五活动结束时约定周一再见","text":"Que pases un buen fin de semana; nos vemos el lunes.","zh":"祝你周末愉快；我们周一见。","explanation":"nos vemos 可用于道别，具体某天前用 el。"}],"grammarCheck":[{"prompt":"女性向别人介绍自己来自北京，哪句正确？","options":["Soy de Pekín.","Estoy de Pekín.","Soy en Pekín."],"answer":0,"explanation":"来源用 ser de；estar 不表示籍贯，en 不表示来自。"},{"prompt":"询问一位同龄人的名字，哪句正确？","options":["¿Cómo me llamas?","¿Cómo te llamas?","¿Cómo tú llama?"],"answer":1,"explanation":"询问对方自身名字用 te llamas；me llamas 是“你叫我”。"},{"prompt":"男性说很高兴认识对方，哪句正确？","options":["Soy encantada.","Encantada de conocerte.","Encantado de conocerte."],"answer":2,"explanation":"此处省略完整主句的固定表达，男性说话者用 encantado。"}],"writingChecklist":["检查 ser 是否随主语变为 soy/eres/es/sois。","来源前是否用了 de，居住地前是否用了 en。","问句是否有双问号，encantado 是否符合说话者。"],"speakingFollowups":["你怎么介绍自己正在这里做的事情？","对方说自己来自另一座城市，你会怎么继续聊？","如果周末后才见面，你会怎么道别？"]}},{"id":"es-02","number":2,"title":"礼貌求助与澄清","goal":"请求重复、放慢语速并确认意思。","level":"A1","stage":"beginner","grammar":{"title":"礼貌请求 puedes 与 puede","explanation":"¿Puedes…? 用于熟悉或非正式对象；¿Puede…? 配合 usted 表示较礼貌或正式的请求。动词后接不定式。","examples":[{"text":"¿Puedes repetir?","zh":"你能重复吗？"},{"text":"¿Puede hablar más despacio?","zh":"您能说慢一点吗？"}]},"vocab":[{"head":"por favor","zh":"请","example":"Repite, por favor.","exampleZh":"请重复一下。","icon":"talk"},{"head":"gracias","zh":"谢谢","example":"Gracias por tu ayuda.","exampleZh":"谢谢你的帮助。","icon":"talk"},{"head":"perdón","zh":"不好意思；对不起","example":"Perdón, no entiendo.","exampleZh":"不好意思，我不明白。","icon":"talk"},{"head":"repetir","zh":"重复","example":"¿Puedes repetir la dirección?","exampleZh":"你能重复地址吗？","icon":"talk"},{"head":"despacio","zh":"慢慢地","example":"Habla despacio, por favor.","exampleZh":"请慢慢说。","icon":"talk"},{"head":"entender","zh":"理解","example":"No entiendo esta palabra.","exampleZh":"我不懂这个词。","icon":"talk"},{"head":"palabra","zh":"词语","example":"¿Qué significa esta palabra?","exampleZh":"这个词是什么意思？","icon":"talk"},{"head":"ayuda","zh":"帮助","example":"Necesito ayuda.","exampleZh":"我需要帮助。","icon":"talk"},{"head":"escribir","zh":"写","example":"¿Puede escribir el nombre?","exampleZh":"您能写下名字吗？","icon":"talk"},{"head":"significar","zh":"意思是","example":"¿Qué significa salida?","exampleZh":"salida 是什么意思？","icon":"talk"}],"lessons":[{"id":"es-02-1","text":"Perdón, no entiendo.","zh":"不好意思，我没听懂。","tip":"no 放在动词之前。"},{"id":"es-02-2","text":"¿Puedes repetir, por favor?","zh":"请你重复一下好吗？","tip":"repetir 使用不定式。"},{"id":"es-02-3","text":"¿Puede hablar más despacio?","zh":"您能说慢一点吗？","tip":"正式场景可使用 puede。"},{"id":"es-02-4","text":"¿Qué significa esta palabra?","zh":"这个词是什么意思？","tip":"qué 用来询问含义。"},{"id":"es-02-5","text":"¿Lo puedes escribir?","zh":"你能把它写下来吗？","tip":"lo 指前面提到的信息。"},{"id":"es-02-6","text":"Gracias, ahora lo entiendo.","zh":"谢谢，我现在明白了。","tip":"ahora 表示现在。"}],"dialogue":[{"speaker":"Lin","text":"Perdón, ¿qué significa «salida»?","zh":"不好意思，salida 是什么意思？"},{"speaker":"Eva","text":"Es el lugar por donde puedes salir.","zh":"是你可以出去的地方。"},{"speaker":"Lin","text":"¿Puedes escribir la palabra?","zh":"你能把这个词写下来吗？"},{"speaker":"Eva","text":"Sí, claro: salida.","zh":"当然可以：salida。"}],"reading":{"title":"信息台的帮助","text":"En una estación, Lin busca la salida hacia la plaza. Pregunta a una trabajadora, pero ella habla muy deprisa. Lin dice que no entiende y pide que repita más despacio. La trabajadora sonríe y señala un pasillo a la derecha. Después escribe el nombre de la plaza en un papel. Lin lee el nombre y confirma la dirección. Da las gracias y camina hacia la salida sin prisa.","zh":"在车站里，林寻找通往广场的出口。他问了一位工作人员，但对方说得很快。林说自己没听懂，请她放慢速度重复。工作人员微笑着指向右边的一条通道。随后她把广场的名字写在纸上。林读了名字，确认方向。他道谢后，不慌不忙地走向出口。"},"assessment":{"reading":{"title":"寻找教室","text":"Mei llega a una escuela para su primera clase de español. En recepción pregunta por el aula de su grupo. El empleado dice un número, pero Mei no lo entiende. Pide que lo repita y que lo escriba. El empleado escribe catorce en una tarjeta y señala la escalera. Mei pregunta si el aula está en la primera planta. Él responde que sí. Mei da las gracias y sube."},"questions":[{"prompt":"Mei 在哪里求助？","options":["学校前台","药店","银行"],"answer":0,"explanation":"她在学校 recepción 问教室。"},{"prompt":"她没有听懂什么？","options":["老师姓名","开课日期","一个数字"],"answer":2,"explanation":"员工说了一个数字，她没有听懂。"},{"prompt":"员工写了哪个数？","options":["四十","十四","四"],"answer":1,"explanation":"catorce 是十四。"},{"prompt":"教室在哪层？","options":["底层","三楼","西班牙所说的第一层"],"answer":2,"explanation":"她确认 primera planta，员工回答是。"}],"writing":"写一段三句求助信息：说明没听懂，请求重复，再致谢。","speaking":"请同伴报一个地址；你请求慢说、写下来并复述确认。"},"story":{"id":"es-02","npc":"Pablo","place":"街角咨询处","scene":"对方说得太快。礼貌请求重复，比假装听懂更有帮助。","text":"Podemos hablar más despacio. ¿Qué necesitas aclarar?","zh":"我们可以说慢一点。你需要弄清什么？","icon":"talk"},"support":{"id":"es-02","pronunciation":{"focus":"重音与问句节奏","explanation":"repetir 重读最后一节，despacio 重读 pa；请求句保持完整节奏，不要每个词都同样用力。","examples":[{"text":"¿Puedes repetir el número?","zh":"你能重复号码吗？"},{"text":"No entiendo la última parte.","zh":"我不明白最后一部分。"}]},"grammarNotes":["puedes 对应 tú，puede 对应 usted；即使省略 usted，动词仍用第三人称形式。","poder 后的第二个动词保持不定式，如 puede escribir；不要写 puede escribe。","lo 可以放在变位动词前，也可连在不定式后：lo puedes escribir / puedes escribirlo；不要放在两动词之间。"],"cultureNote":"西班牙许多日常服务场合使用 tú，但不确定时可用 usted；por favor 和感谢能自然表达礼貌，无须把所有请求都升级为正式称呼。","vocabularyNotes":[{"head":"repetir","note":"不定式以 -ir 结尾；请求用 puedes repetir，单独变位则是 repites。"},{"head":"despacio","note":"副词不随人物性数改变；más despacio 是“更慢一点”。"},{"head":"significar","note":"问单个词用 ¿Qué significa…?；问多个词可用 ¿Qué significan estas palabras?。"}],"transfer":[{"id":"es-02-transfer-1","prompt":"车站广播末尾没听懂，指出范围","text":"Perdón, no entiendo el nombre de la estación.","zh":"不好意思，我没听懂车站的名字。","explanation":"no 在 entiendo 前；补出具体信息比只说“不懂”更明确。"},{"id":"es-02-transfer-2","prompt":"请同伴重报集合地点","text":"¿Puedes repetir dónde nos encontramos?","zh":"你能重复一下我们在哪里碰面吗？","explanation":"puedes 后接 repetir；间接问句 dónde 保留重音。"},{"id":"es-02-transfer-3","prompt":"请工作人员逐位念号码","text":"¿Puede decir los números uno a uno, por favor?","zh":"请您逐个说这些数字，好吗？","explanation":"正式单数用 puede；uno a uno 表示逐个。"},{"id":"es-02-transfer-4","prompt":"询问菜单上复数词的意思","text":"¿Qué significan estas palabras del menú?","zh":"菜单上的这些词是什么意思？","explanation":"主语 estas palabras 为复数，因此用 significan。"},{"id":"es-02-transfer-5","prompt":"请朋友把门禁码发成文字","text":"¿Puedes escribirme el código en un mensaje?","zh":"你能在消息里把代码写给我吗？","explanation":"me 连在不定式后，表示写给我；código 是直接宾语。"},{"id":"es-02-transfer-6","prompt":"复述后确认自己已经理解集合安排","text":"Gracias, ahora sé que tenemos que esperar fuera.","zh":"谢谢，现在我知道我们必须在外面等。","explanation":"sé que 引出已理解的信息；tener que 后接 esperar。"}],"grammarCheck":[{"prompt":"向一位工作人员请求写地址，哪句正确？","options":["¿Puede escribir la dirección?","¿Puede escribe la dirección?","¿Puede escribes la dirección?"],"answer":0,"explanation":"poder 后接不定式 escribir，不再按人称变位。"},{"prompt":"请求朋友把信息写下来，哪句正确？","options":["¿Puedes lo escribir?","¿Puedes escribirlo?","¿Puedes escribir él?"],"answer":1,"explanation":"宾语代词可连在不定式末尾；不能夹在 puedes 与 escribir 中间。"},{"prompt":"说自己没听懂，哪句正确？","options":["Entiendo no el número.","No entender el número.","No entiendo el número."],"answer":2,"explanation":"否定词放在变位动词前；第一人称用 entiendo。"}],"writingChecklist":["检查 tú/usted 与 puedes/puede 是否一致。","第二个动词是否保留不定式。","写明没有听懂的具体词、号码或步骤。"],"speakingFollowups":["若对方重复后你仍没懂，你会请求哪种帮助？","你会如何复述地址来核对？","你想请对方把哪个信息写下来？"]}},{"id":"es-03","number":3,"title":"个人信息","goal":"介绍国籍、职业、联系方式并核对拼写。","level":"A1","stage":"beginner","grammar":{"title":"llamarse 与 tener","explanation":"me llamo 表示“我叫”；tengo 可表达年龄。电话号码通常逐位念，邮箱可用 arroba 表示 @。","examples":[{"text":"Me llamo Mei.","zh":"我叫梅。"},{"text":"Tengo treinta años.","zh":"我三十岁。"}]},"vocab":[{"head":"apellido","zh":"姓氏","example":"Mi apellido es Wang.","exampleZh":"我姓王。","icon":"talk"},{"head":"edad","zh":"年龄","example":"¿Qué edad tienes?","exampleZh":"你多大？","icon":"talk"},{"head":"año","zh":"年；岁","example":"Tengo veinte años.","exampleZh":"我二十岁。","icon":"talk"},{"head":"profesión","zh":"职业","example":"¿Cuál es tu profesión?","exampleZh":"你的职业是什么？","icon":"talk"},{"head":"estudiante","zh":"学生","example":"Soy estudiante.","exampleZh":"我是学生。","icon":"talk"},{"head":"profesor","zh":"教师","example":"Luis es profesor.","exampleZh":"路易斯是教师。","icon":"talk"},{"head":"móvil","zh":"手机","example":"Este es mi móvil.","exampleZh":"这是我的手机。","icon":"talk"},{"head":"correo electrónico","zh":"电子邮箱","example":"Escribe tu correo electrónico.","exampleZh":"写下你的电子邮箱。","icon":"talk"},{"head":"letra","zh":"字母","example":"Falta una letra.","exampleZh":"少了一个字母。","icon":"talk"},{"head":"arroba","zh":"邮箱中的 @","example":"Mi correo lleva una arroba.","exampleZh":"我的邮箱里有一个 @。","icon":"talk"}],"lessons":[{"id":"es-03-1","text":"Mi apellido es Chen.","zh":"我姓陈。","tip":"apellido 是姓，nombre 是名字。"},{"id":"es-03-2","text":"Tengo veintiocho años.","zh":"我二十八岁。","tip":"年龄用 tener，不用 ser。"},{"id":"es-03-3","text":"Soy profesora de chino.","zh":"我是中文教师。","tip":"职业在 ser 后通常不加不定冠词。"},{"id":"es-03-4","text":"¿Cuál es tu número de móvil?","zh":"你的手机号是多少？","tip":"cuál 询问具体号码。"},{"id":"es-03-5","text":"¿Cómo se escribe tu apellido?","zh":"你的姓怎么拼？","tip":"se escribe 用于询问写法。"},{"id":"es-03-6","text":"Prefiero dar mi correo electrónico.","zh":"我更愿意提供电子邮箱。","tip":"prefiero 表达个人偏好。"}],"dialogue":[{"speaker":"Empleado","text":"¿Nombre y apellido?","zh":"名字和姓氏？"},{"speaker":"Mei","text":"Mei Chen. Soy estudiante.","zh":"梅·陈。我是学生。"},{"speaker":"Empleado","text":"¿Un correo electrónico de contacto?","zh":"留一个联系邮箱好吗？"},{"speaker":"Mei","text":"Sí, lo escribo aquí.","zh":"好的，我写在这里。"}],"reading":{"title":"语言交换登记","text":"Mei se apunta a un intercambio de idiomas en una biblioteca. En la ficha escribe su nombre, su apellido y su correo electrónico. Tiene veintiocho años y trabaja como profesora de chino. Una voluntaria pregunta si quiere dar también su número de móvil. Mei prefiere usar solo el correo para el primer contacto. La voluntaria revisa las letras con ella y le entrega una tarjeta con el horario del próximo encuentro.","zh":"梅在图书馆报名参加语言交换活动。她在表格上填写名字、姓氏和电子邮箱。她二十八岁，从事中文教学。一位志愿者问她是否也愿意留下手机号。梅更愿意首次联系只用邮箱。志愿者和她一起核对字母，然后给她一张写有下次活动时间的卡片。"},"assessment":{"reading":{"title":"体育中心的表格","text":"Nora quiere recibir información sobre un curso de natación. En el centro deportivo le dan una ficha. Escribe Nora Ruiz y marca que tiene treinta y dos años. Trabaja como diseñadora y vive cerca del centro. En la casilla de contacto escribe su correo electrónico; no añade su móvil. Antes de entregar la ficha, revisa su apellido porque la última letra se ve mal. La empleada confirma que puede leerlo."},"questions":[{"prompt":"Nora 想了解什么？","options":["烹饪课","游泳课","语言交换"],"answer":1,"explanation":"她要了解 curso de natación。"},{"prompt":"她多大？","options":["二十三岁","三十岁","三十二岁"],"answer":2,"explanation":"treinta y dos 是三十二。"},{"prompt":"她填写哪种联系方式？","options":["电子邮箱","手机号","邮寄地址"],"answer":0,"explanation":"她只填写邮箱，没有加手机号。"},{"prompt":"为什么检查姓氏？","options":["写错了姓","最后一个字母不清楚","员工不认识她"],"answer":1,"explanation":"最后一个字母看不清楚。"}],"writing":"填写虚构报名信息：姓名、年龄、职业和一种联系方式。不要填写真实隐私信息。","speaking":"模拟前台登记，拼读自己的虚构姓氏并确认联系方式。"},"story":{"id":"es-03","npc":"Lucía","place":"社区登记桌","scene":"你需要介绍基本情况。用虚构资料练习名字、来源和联系方式。","text":"¿Cómo te llamas y de dónde eres?","zh":"你叫什么名字，来自哪里？","icon":"person"},"support":{"id":"es-03","pronunciation":{"focus":"ñ 与 n 的区别","explanation":"año 中 ñ 是一个腭鼻音，不等于 n；años 表示岁数，拼写和发音都不能遗漏波浪号。","examples":[{"text":"Tengo treinta y dos años.","zh":"我三十二岁。"},{"text":"Mi apellido lleva una eñe.","zh":"我的姓里有一个 ñ。"}]},"grammarNotes":["年龄用 tener：tengo…años，不能按中文“我是三十岁”翻译成 soy treinta años。","职业在 ser 后无修饰时通常不用不定冠词，如 soy ingeniera；国籍和职业名通常小写。","询问拼写用 ¿Cómo se escribe…?；姓氏为复数时要说 ¿Cómo se escriben tus apellidos?。"],"cultureNote":"西班牙表格可能分别询问 nombre 与 apellidos；按表格实际栏位填写自己的姓名，不要为了套用习惯而自行增加姓氏。","vocabularyNotes":[{"head":"apellido","note":"常见复数 apellidos 指姓氏部分；mi apellido es… 用单数，mis apellidos son… 用复数。"},{"head":"estudiante","note":"男女均可用 estudiante，通过 el/la 或其他搭配体现；不要自行造 estudianta。"},{"head":"móvil","note":"西班牙常用 móvil 表示手机，重音在 mó；número de móvil 指手机号。"}],"transfer":[{"id":"es-03-transfer-1","prompt":"报名表把姓和名弄反了，请纠正","text":"Liu es mi apellido y Wen es mi nombre.","zh":"刘是我的姓，文是我的名字。","explanation":"两个信息分别用 es；用 y 清晰区分姓名栏。"},{"id":"es-03-transfer-2","prompt":"为成人课程说明自己已满四十岁","text":"Tengo cuarenta años y busco un curso para adultos.","zh":"我四十岁，想找一个成人课程。","explanation":"年龄用 tengo；para adultos 说明课程对象。"},{"id":"es-03-transfer-3","prompt":"介绍自己的工作和学习状态","text":"Soy arquitecta y estudio español por las tardes.","zh":"我是建筑师，下午学习西班牙语。","explanation":"职业前省略冠词；por las tardes 表示经常在下午。"},{"id":"es-03-transfer-4","prompt":"问前台应填写哪一个联系电话","text":"¿Qué número de teléfono debo poner en el formulario?","zh":"我应该在表格上填哪个电话号码？","explanation":"qué 直接修饰 número；debo 后接不定式 poner。"},{"id":"es-03-transfer-5","prompt":"核对姓中是否有双字母","text":"¿Tu apellido se escribe con dos eles?","zh":"你的姓拼写时有两个 l 吗？","explanation":"con 表示包含某字母；eles 是字母 ele 的复数。"},{"id":"es-03-transfer-6","prompt":"解释为何只提供工作邮箱","text":"Para esta actividad prefiero usar mi correo del trabajo.","zh":"这项活动我更愿意使用工作邮箱。","explanation":"prefiero 后接 usar，del 是 de el 的缩合。"}],"grammarCheck":[{"prompt":"表达三十一岁，哪句正确？","options":["Tengo treinta y un años.","Soy treinta y un años.","Tengo treinta y uno años."],"answer":0,"explanation":"年龄用 tener；uno 在阳性复数名词 años 前变为 un。"},{"prompt":"女性介绍自己是学生，哪句正确？","options":["Soy estudianta.","Soy estudiante.","Estoy estudiante."],"answer":1,"explanation":"estudiante 通用于男女；身份用 ser。"},{"prompt":"问两个姓怎么拼，哪句正确？","options":["¿Cómo se escribe tus apellidos?","¿Cómo te escribe tus apellidos?","¿Cómo se escriben tus apellidos?"],"answer":2,"explanation":"apellidos 为复数，搭配 se escriben；不是第二人称 te。"}],"writingChecklist":["年龄句是否用了 tener 并写出 años。","职业与国籍是否小写，职业性别形式是否合适。","姓名与联系方式是否分清，数字和字母是否核对。"],"speakingFollowups":["你的名字中哪个字母最需要解释？","你希望在什么场合提供工作邮箱？","除了职业，你还想向新同伴介绍哪一点？"]}},{"id":"es-04","number":4,"title":"数字、日期与时间","goal":"理解价格和时间，约定简单见面时间。","level":"A1","stage":"beginner","grammar":{"title":"¿Qué hora es? 与 a las","explanation":"报时用 Es la una 或 Son las dos；约定几点做事用 a la una 或 a las dos。媒体或时刻表常用二十四小时制。","examples":[{"text":"Son las tres y media.","zh":"现在三点半。"},{"text":"Quedamos a las cinco.","zh":"我们五点见。"}]},"vocab":[{"head":"hora","zh":"小时；时间","example":"¿Qué hora es?","exampleZh":"现在几点？","icon":"talk"},{"head":"minuto","zh":"分钟","example":"Espera cinco minutos.","exampleZh":"等五分钟。","icon":"talk"},{"head":"media","zh":"半","example":"Son las seis y media.","exampleZh":"现在六点半。","icon":"talk"},{"head":"cuarto","zh":"一刻钟","example":"Son las dos y cuarto.","exampleZh":"现在两点一刻。","icon":"talk"},{"head":"hoy","zh":"今天","example":"Hoy es lunes.","exampleZh":"今天星期一。","icon":"talk"},{"head":"mañana","zh":"明天","example":"Mañana tengo clase.","exampleZh":"我明天有课。","icon":"talk"},{"head":"lunes","zh":"星期一","example":"Nos vemos el lunes.","exampleZh":"我们星期一见。","icon":"talk"},{"head":"fecha","zh":"日期","example":"Confirma la fecha.","exampleZh":"请确认日期。","icon":"talk"},{"head":"euro","zh":"欧元","example":"Cuesta diez euros.","exampleZh":"价格是十欧元。","icon":"talk"},{"head":"precio","zh":"价格","example":"¿Cuál es el precio?","exampleZh":"价格是多少？","icon":"talk"}],"lessons":[{"id":"es-04-1","text":"¿Qué hora es?","zh":"现在几点？","tip":"hora 在此使用单数。"},{"id":"es-04-2","text":"Es la una y cuarto.","zh":"现在一点一刻。","tip":"一点用 es la una。"},{"id":"es-04-3","text":"Son las ocho menos diez.","zh":"现在差十分八点。","tip":"menos 表示距离下一整点的差额。"},{"id":"es-04-4","text":"La clase empieza a las nueve.","zh":"课九点开始。","tip":"开始时间用 a las。"},{"id":"es-04-5","text":"¿Cuánto cuesta?","zh":"多少钱？","tip":"cuánto 询问数量或价格。"},{"id":"es-04-6","text":"Quedamos el martes a las seis.","zh":"我们星期二六点见。","tip":"星期几前可用 el。"}],"dialogue":[{"speaker":"Luis","text":"¿Quedamos mañana?","zh":"我们明天见吗？"},{"speaker":"Mei","text":"Sí. ¿A las seis y media?","zh":"好。六点半怎么样？"},{"speaker":"Luis","text":"Mejor a las siete, junto al reloj.","zh":"最好七点，在钟旁边。"},{"speaker":"Mei","text":"Perfecto, a las siete.","zh":"好的，七点。"}],"reading":{"title":"广场上的约定","text":"Hoy es lunes y Mei quiere visitar un mercado con Luis. Miran sus horarios antes de quedar. Mei termina su clase a las seis y media, pero Luis sale del trabajo a las siete. Deciden encontrarse el martes a las siete y cuarto junto al reloj de la plaza. El mercado cierra a las nueve, así que tienen tiempo. Mei escribe la hora en su agenda para no confundirse al día siguiente.","zh":"今天星期一，梅想和路易斯逛市场。他们在约时间前查看了各自的日程。梅六点半下课，路易斯却七点下班。他们决定星期二七点一刻在广场的钟旁见面。市场九点关门，因此他们有时间。梅把时间记在日程本上，以免第二天弄错。"},"assessment":{"reading":{"title":"电影前的晚餐","text":"El sábado, Clara y Dani quieren cenar antes de ir al cine. La película empieza a las diez de la noche. Dani propone quedar a las ocho, pero Clara tiene una llamada hasta las ocho y cuarto. Al final se ven a las ocho y media en un restaurante cercano. El menú cuesta quince euros por persona. Deciden caminar al cine después de cenar porque está a diez minutos."},"questions":[{"prompt":"电影几点开始？","options":["晚上十点","晚上八点","晚上九点"],"answer":0,"explanation":"电影 a las diez de la noche 开始。"},{"prompt":"最终几点见面？","options":["八点","八点一刻","八点半"],"answer":2,"explanation":"最终决定 a las ocho y media。"},{"prompt":"套餐每人多少钱？","options":["十欧元","十五欧元","三十欧元"],"answer":1,"explanation":"文中为 quince euros por persona。"},{"prompt":"他们怎么去电影院？","options":["开车","步行","乘地铁"],"answer":1,"explanation":"他们决定 caminar。"}],"writing":"写一条约见信息，包括星期、具体时间和地点。","speaking":"用两种说法表达七点四十五，再协商一个双方都有空的时间。"},"story":{"id":"es-04","npc":"Ana","place":"活动公告栏","scene":"你们要约一个时间。把数字、日期和钟点核对清楚。","text":"¿Qué día y a qué hora te viene bien quedar?","zh":"哪天几点见面对你方便？","icon":"time"},"support":{"id":"es-04","pronunciation":{"focus":"重音符号区分疑问词","explanation":"qué、cuánto 在直接和间接疑问中带重音；hora 的 h 不发音，避免读出额外辅音。","examples":[{"text":"¿A qué hora termina?","zh":"几点结束？"},{"text":"Son las dos y veinte.","zh":"现在两点二十分。"}]},"grammarNotes":["一点用 es la una，其他点钟用 son las…；预约时间前用 a la una / a las dos。","menos 表示距下一整点还差多少：las diez menos cuarto 是九点四十五，不是十点十五。","具体某一天常用 el martes；每周二用 los martes；月份通常小写，日期用 el cinco de mayo。"],"cultureNote":"西班牙书面日程常见24小时制，口语也常用12小时制；预约时补充 de la mañana/tarde/noche 或复述数字能减少误会。","vocabularyNotes":[{"head":"cuarto","note":"时间里 un cuarto 指十五分钟；y cuarto 加一刻，menos cuarto 差一刻。"},{"head":"mañana","note":"mañana 可表示明天；la mañana 是早晨，mañana por la mañana 是明天早上。"},{"head":"euro","note":"复数 euros；un euro 不用 uno euro，价格可说 dos euros con cincuenta。"}],"transfer":[{"id":"es-04-transfer-1","prompt":"看展前询问闭馆时间","text":"¿A qué hora cierra el museo los domingos?","zh":"博物馆周日几点关门？","explanation":"询问事件时间用 a qué hora；los domingos 表示每个周日。"},{"id":"es-04-transfer-2","prompt":"告诉同伴现在十二点半","text":"Son las doce y media; aún tenemos tiempo.","zh":"现在十二点半，我们还有时间。","explanation":"十二点用 son las；media 表示半小时。"},{"id":"es-04-transfer-3","prompt":"说明离七点还有一刻钟","text":"Son las siete menos cuarto y la tienda sigue abierta.","zh":"现在六点四十五分，店还开着。","explanation":"以接近的七点为基准减去十五分钟。"},{"id":"es-04-transfer-4","prompt":"通知一项活动一点开始","text":"La visita empieza a la una de la tarde.","zh":"参观下午一点开始。","explanation":"一点是单数 a la una，不能写 a las una。"},{"id":"es-04-transfer-5","prompt":"问两张票总价","text":"¿Cuánto cuestan dos entradas para hoy?","zh":"今天的两张门票多少钱？","explanation":"主语 dos entradas 为复数，动词用 cuestan。"},{"id":"es-04-transfer-6","prompt":"约定月初某日午间取书","text":"Recojo el libro el tres de junio a las doce.","zh":"我六月三日十二点取书。","explanation":"日期前用 el，月份前用 de，点钟前用 a las。"}],"grammarCheck":[{"prompt":"说活动一点开始，哪句正确？","options":["Empieza a la una.","Empieza a las una.","Empieza en la una."],"answer":0,"explanation":"钟点前用 a；una 按单数搭配 la。"},{"prompt":"表示九点四十五，哪句正确？","options":["Son las nueve y cuarto.","Son las diez menos cuarto.","Es las diez menos cuarto."],"answer":1,"explanation":"十点差一刻即九点四十五；多于一点用 son。"},{"prompt":"表示每周一上课，哪句正确？","options":["Tengo clase en lunes.","Tengo clase el luneses.","Tengo clase los lunes."],"answer":2,"explanation":"规律性的星期用复数定冠词 los，lunes 本身不再加 -es。"}],"writingChecklist":["现在几点与几点开始是否分别用了 es/son 和 a。","一刻、半小时及 menos 的换算是否正确。","单次日期与每周安排是否分别用了 el 和 los。"],"speakingFollowups":["如果只听见“六点”，你会怎么确认早晚？","你会怎样报出自己的下一次预约日期？","两项活动时间冲突时你会提出哪个新时间？"]}},{"id":"es-05","number":5,"title":"咖啡馆点单","goal":"点饮品和简单食物，询问堂食外带及结账。","level":"A1","stage":"beginner","grammar":{"title":"querer 与 para","explanation":"quiero 可表达需求；quería 在点单中常用于委婉表达。para llevar 表示外带，para tomar aquí 表示堂食。","examples":[{"text":"Quería un café con leche.","zh":"我想要一杯牛奶咖啡。"},{"text":"Es para llevar.","zh":"是外带的。"}]},"vocab":[{"head":"café con leche","zh":"牛奶咖啡","example":"Tomo un café con leche.","exampleZh":"我喝一杯牛奶咖啡。","icon":"talk"},{"head":"cortado","zh":"加少量奶的咖啡","example":"Quería un cortado.","exampleZh":"我想要一杯 cortado。","icon":"talk"},{"head":"té","zh":"茶","example":"¿Tenéis té verde?","exampleZh":"你们有绿茶吗？","icon":"talk"},{"head":"agua","zh":"水","example":"Una botella de agua, por favor.","exampleZh":"请给我一瓶水。","icon":"talk"},{"head":"tostada","zh":"烤面包片","example":"Quiero una tostada con tomate.","exampleZh":"我要一份番茄烤面包。","icon":"talk"},{"head":"azúcar","zh":"糖","example":"Sin azúcar, gracias.","exampleZh":"不加糖，谢谢。","icon":"talk"},{"head":"leche","zh":"牛奶","example":"¿Hay leche sin lactosa?","exampleZh":"有无乳糖牛奶吗？","icon":"talk"},{"head":"cuenta","zh":"账单","example":"La cuenta, por favor.","exampleZh":"请结账。","icon":"talk"},{"head":"llevar","zh":"带走","example":"Es para llevar.","exampleZh":"是外带的。","icon":"talk"},{"head":"mesa","zh":"桌子","example":"Esta mesa está libre.","exampleZh":"这张桌子是空的。","icon":"talk"}],"lessons":[{"id":"es-05-1","text":"Quería un café con leche.","zh":"我想要一杯牛奶咖啡。","tip":"quería 让点单语气较委婉。"},{"id":"es-05-2","text":"¿Tenéis leche sin lactosa?","zh":"你们有无乳糖牛奶吗？","tip":"tenéis 是 vosotros 的变位，在西班牙常用。"},{"id":"es-05-3","text":"Una tostada con tomate, por favor.","zh":"请给我一份番茄烤面包。","tip":"con 表示配有。"},{"id":"es-05-4","text":"Sin azúcar, gracias.","zh":"不加糖，谢谢。","tip":"sin 表示不加或没有。"},{"id":"es-05-5","text":"Es para tomar aquí.","zh":"是在这里吃的。","tip":"tomar aquí 表示堂食。"},{"id":"es-05-6","text":"¿Puedo pagar con tarjeta?","zh":"我能刷卡吗？","tip":"poder 后接 pagar。"}],"dialogue":[{"speaker":"Camarera","text":"Buenos días. ¿Qué te pongo?","zh":"早上好。你要什么？"},{"speaker":"Mei","text":"Un cortado y una tostada, por favor.","zh":"请给我一杯 cortado 和一份烤面包。"},{"speaker":"Camarera","text":"¿Para tomar aquí o para llevar?","zh":"堂食还是外带？"},{"speaker":"Mei","text":"Para tomar aquí. Sin azúcar, gracias.","zh":"堂食。不加糖，谢谢。"}],"reading":{"title":"上课前的早餐","text":"Antes de la clase, Mei entra en una cafetería cerca de la escuela. Pide un café con leche y una tostada con tomate. Pregunta si tienen leche sin lactosa y la camarera dice que sí. Mei se sienta en una mesa junto a la ventana. No quiere azúcar. Cuando termina el desayuno, pide la cuenta y pregunta si puede pagar con tarjeta. Después guarda el recibo y sale hacia la escuela.","zh":"上课前，梅走进学校附近的一家咖啡馆。她点了一杯牛奶咖啡和一份番茄烤面包。她问有没有无乳糖牛奶，女服务员说有。梅坐在窗边的桌子旁。她不想加糖。吃完早餐后，她要账单并询问能否刷卡。随后她收好小票，向学校走去。"},"assessment":{"reading":{"title":"外带的饮品","text":"Álvaro pasa por una cafetería antes de coger el autobús. Pide un té y un bocadillo de queso para llevar. La camarera le pregunta si quiere azúcar, pero él dice que no. También pide una botella de agua para el viaje. El bocadillo tarda unos minutos porque lo preparan en ese momento. Álvaro paga en efectivo y espera junto a la barra. Cuando recibe la bolsa, da las gracias."},"questions":[{"prompt":"Álvaro 点了什么热饮？","options":["咖啡","热巧克力","茶"],"answer":2,"explanation":"他点的是 un té。"},{"prompt":"三明治是什么馅？","options":["火腿","奶酪","鸡肉"],"answer":1,"explanation":"bocadillo de queso 是奶酪长面包三明治。"},{"prompt":"他在哪里吃？","options":["带走","店内","文中说在学校"],"answer":0,"explanation":"他点单时说 para llevar。"},{"prompt":"他如何付款？","options":["刷卡","手机转账","现金"],"answer":2,"explanation":"en efectivo 表示现金支付。"}],"writing":"写一张点单便条：一种饮品、一种食物、一项偏好及堂食或外带。","speaking":"扮演顾客点早餐，询问一种奶的选择并结账。"},"story":{"id":"es-05","npc":"Pablo","place":"街角咖啡馆","scene":"轮到你点单了。先说想要什么，再问清数量和价格。","text":"Buenos días. ¿Qué te pongo?","zh":"早上好。你要点什么？","icon":"food"},"support":{"id":"es-05","pronunciation":{"focus":"c 的地区读音与清楚点单","explanation":"在西班牙许多地区，café 的 c 发 /k/，azúcar 中 z 发近似英语 th 的清辅音；部分地区不作此区分也很自然。","examples":[{"text":"Un café sin leche, por favor.","zh":"请来一杯不加奶的咖啡。"},{"text":"¿Es para llevar?","zh":"是打包的吗？"}]},"grammarNotes":["quería 在点单时可柔和地表达“我想要”；不用再在后面加变位动词，如 quería tomar 中 tomar 保持不定式。","询问店家多人或店面整体在西班牙可用 tenéis；正式单数用 tiene，不能混用 tenéis 与 usted。","para llevar 是带走，para tomar aquí 是在这里喝；sin 后直接接名词，表示不加某物。"],"cultureNote":"café con leche、cortado 的奶量和杯型可能因店而异；有饮食需求时说明具体成分并向店员确认。","vocabularyNotes":[{"head":"cortado","note":"阳性：un cortado，通常指加少量奶的浓缩咖啡；并不是所有店都使用相同比例。"},{"head":"agua","note":"阴性名词，但重读 a 开头，单数说 el agua fría、un agua；形容词仍用阴性。"},{"head":"cuenta","note":"la cuenta 是账单，常说 pedir la cuenta；不要与 cuento（故事）混淆。"}],"transfer":[{"id":"es-05-transfer-1","prompt":"点两份早餐并说明咖啡种类","text":"Quería dos cafés solos y una tostada para compartir.","zh":"我想要两杯黑咖啡和一份吐司一起分着吃。","explanation":"数量大于一时 cafés 变复数；para compartir 表示共享。"},{"id":"es-05-transfer-2","prompt":"询问是否有植物奶","text":"¿Tenéis bebida de avena para el café?","zh":"你们有可以加到咖啡里的燕麦饮品吗？","explanation":"西班牙对店方可用 tenéis；para el café 说明用途。"},{"id":"es-05-transfer-3","prompt":"点一份不含火腿的三明治","text":"Un bocadillo de queso sin jamón, por favor.","zh":"请来一个不加火腿的奶酪三明治。","explanation":"de 指主要配料，sin 明确排除配料。"},{"id":"es-05-transfer-4","prompt":"说明茶里不加糖和奶","text":"El té, sin azúcar ni leche, por favor.","zh":"这杯茶请不要加糖，也不要加奶。","explanation":"sin…ni… 连接两个均不添加的成分。"},{"id":"es-05-transfer-5","prompt":"告诉店员全部打包","text":"Todo es para llevar; no vamos a sentarnos.","zh":"全部打包，我们不坐下来。","explanation":"todo 作整体单数用 es；para llevar 为固定用途表达。"},{"id":"es-05-transfer-6","prompt":"付款前询问能否分开结账","text":"¿Podemos pagar por separado?","zh":"我们可以分开付吗？","explanation":"主语是我们，poder 用 podemos；por separado 是分别地。"}],"grammarCheck":[{"prompt":"点一杯冷水，哪句正确？","options":["Un agua fría, por favor.","Una agua frío, por favor.","Un agua frío, por favor."],"answer":0,"explanation":"agua 阴性，重读 a 前用 un，但形容词必须是 fría。"},{"prompt":"说不加糖也不加奶，哪句正确？","options":["Sin azúcar no leche.","Sin azúcar ni leche.","Sin azúcar y no sin leche."],"answer":1,"explanation":"sin 下并列排除项用 ni 连接最自然清楚。"},{"prompt":"表示两杯咖啡打包，哪句正确？","options":["Dos café por llevar.","Dos cafés para llevamos.","Dos cafés para llevar."],"answer":2,"explanation":"cafés 复数；para 后接不定式 llevar。"}],"writingChecklist":["数量、冠词和饮品名是否配合。","把不要的成分写在 sin 后，多个成分用 ni。","明确写出堂食、打包或付款方式。"],"speakingFollowups":["店里没有你要的奶时，你会怎么改点？","店员问堂食还是外带，你会怎么回答？","你会怎样确认是否含某种食材？"]}},{"id":"es-06","number":6,"title":"超市与市场","goal":"询问货物位置、数量和付款方式。","level":"A1","stage":"beginner","grammar":{"title":"hay 与 estar","explanation":"hay 表示某处有某物；已知或特定事物的位置用 estar。数量可用 un kilo de 或 medio kilo de。","examples":[{"text":"¿Hay pan integral?","zh":"有全麦面包吗？"},{"text":"La leche está al fondo.","zh":"牛奶在里面尽头。"}]},"vocab":[{"head":"supermercado","zh":"超市","example":"El supermercado abre hoy.","exampleZh":"超市今天开门。","icon":"talk"},{"head":"pan","zh":"面包","example":"Necesito pan integral.","exampleZh":"我需要全麦面包。","icon":"talk"},{"head":"fruta","zh":"水果","example":"Compro fruta fresca.","exampleZh":"我买新鲜水果。","icon":"talk"},{"head":"manzana","zh":"苹果","example":"Quiero dos manzanas.","exampleZh":"我要两个苹果。","icon":"talk"},{"head":"kilo","zh":"公斤","example":"Un kilo de tomates.","exampleZh":"一公斤番茄。","icon":"talk"},{"head":"bolsa","zh":"袋子","example":"Traigo mi bolsa.","exampleZh":"我带了自己的袋子。","icon":"talk"},{"head":"caja","zh":"收银台","example":"La caja está allí.","exampleZh":"收银台在那边。","icon":"talk"},{"head":"efectivo","zh":"现金","example":"Pago en efectivo.","exampleZh":"我用现金付款。","icon":"talk"},{"head":"tarjeta","zh":"卡","example":"Pago con tarjeta.","exampleZh":"我刷卡付款。","icon":"talk"},{"head":"recibo","zh":"收据；小票","example":"Guarda el recibo.","exampleZh":"请收好小票。","icon":"talk"}],"lessons":[{"id":"es-06-1","text":"¿Dónde está el arroz?","zh":"大米在哪里？","tip":"特定商品的位置用 está。"},{"id":"es-06-2","text":"¿Hay pan integral?","zh":"有全麦面包吗？","tip":"hay 不随名词单复数变化。"},{"id":"es-06-3","text":"Quería medio kilo de tomates.","zh":"我想要半公斤番茄。","tip":"重量和商品之间用 de。"},{"id":"es-06-4","text":"¿Cuánto es en total?","zh":"一共多少钱？","tip":"en total 表示合计。"},{"id":"es-06-5","text":"Traigo mi propia bolsa.","zh":"我带了自己的袋子。","tip":"propia 强调自备。"},{"id":"es-06-6","text":"¿Me da el recibo, por favor?","zh":"请给我小票好吗？","tip":"da 对应礼貌称呼 usted。"}],"dialogue":[{"speaker":"Mei","text":"Perdone, ¿dónde está la pasta?","zh":"不好意思，意面在哪里？"},{"speaker":"Empleado","text":"En el pasillo tres, al lado del arroz.","zh":"在三号通道，大米旁边。"},{"speaker":"Mei","text":"Gracias. ¿Y hay pan integral?","zh":"谢谢。有全麦面包吗？"},{"speaker":"Empleado","text":"Sí, junto a la entrada.","zh":"有，在入口旁边。"}],"reading":{"title":"周末采购","text":"El sábado por la mañana, Mei va al supermercado con una lista y una bolsa de tela. Necesita arroz, pan integral y fruta para varios días. No encuentra el arroz y pregunta a un empleado. Él le indica el pasillo tres. En la zona de fruta, Mei elige cuatro manzanas y medio kilo de tomates. Después pasa por caja, paga con tarjeta y guarda el recibo antes de volver a casa.","zh":"星期六早上，梅带着购物清单和布袋去超市。她需要买几天吃的大米、全麦面包和水果。她没找到大米，便询问员工。员工告诉她去三号通道。在果蔬区，梅挑了四个苹果和半公斤番茄。随后她到收银台刷卡付款，收好小票后回家。"},"assessment":{"reading":{"title":"市场的午餐食材","text":"Rosa compra en el mercado para preparar una comida con su hermano. Primero pide un kilo de patatas y dos cebollas. Después busca pescado, pero el puesto ya no tiene el que quiere. Decide comprar huevos para hacer una tortilla. Lleva una bolsa de tela y no necesita otra. En el último puesto paga en efectivo porque el lector de tarjetas no funciona. Al salir, llama a su hermano para avisarle del cambio."},"questions":[{"prompt":"Rosa 最先买什么？","options":["土豆和洋葱","大米和面包","鱼和鸡蛋"],"answer":0,"explanation":"她首先要一公斤土豆和两个洋葱。"},{"prompt":"为什么改买鸡蛋？","options":["忘带钱","想要的鱼没有了","弟弟不吃鱼"],"answer":1,"explanation":"鱼摊没有她想要的鱼。"},{"prompt":"她需要新袋子吗？","options":["需要两个","文中未说","不需要"],"answer":2,"explanation":"她自带布袋，不需要另一个。"},{"prompt":"为什么付现金？","options":["读卡器故障","现金更便宜","她没有卡"],"answer":0,"explanation":"读卡器不能使用。"}],"writing":"列出四项购物需求，并写一句询问商品位置的话。","speaking":"模拟向市场摊主购买半公斤食材，询问总价并表示自带袋子。"},"story":{"id":"es-06","npc":"Lucía","place":"社区市场","scene":"你在为晚餐买材料。试着询问商品位置、数量和付款方式。","text":"¿Buscas algún producto en particular?","zh":"你在找某种特定商品吗？","icon":"food"},"support":{"id":"es-06","pronunciation":{"focus":"j 与 g 的摩擦音","explanation":"caja 的 j 与 gente 的 ge 在西班牙常读喉部摩擦音；不要读成英语 j。kilo 的 k 保持清晰。","examples":[{"text":"La caja está al fondo.","zh":"收银台在里面。"},{"text":"Un kilo de naranjas.","zh":"一公斤橙子。"}]},"grammarNotes":["hay 介绍是否存在某物，不随单复数变：hay una bolsa / hay dos bolsas；已知物品的位置用 está/están。","数量单位与商品间用 de：medio kilo de peras；medio 随 kilo 为阳性，media 随 docena 为阴性。","询问总价用 ¿Cuánto es?，询问复数商品单价可用 ¿Cuánto cuestan…?；不要把所有“多少”都写成 cuánto cuesta。"],"cultureNote":"西班牙市场可按重量或个数购买；部分超市需自己称重，部分由员工操作，观察标识或询问店员。","vocabularyNotes":[{"head":"kilo","note":"un kilo de 后接商品，半公斤是 medio kilo；不是 un medio kilos。"},{"head":"caja","note":"在商店可指收银台，也可指盒子；pasar por caja 是到收银台结账。"},{"head":"recibo","note":"el recibo 可指收据；购物中也常听到 tique，索取时可说 ¿Me da el tique?。"}],"transfer":[{"id":"es-06-transfer-1","prompt":"寻找已在购物单上的鸡蛋","text":"¿Dónde están los huevos de esta oferta?","zh":"这次特价的鸡蛋在哪里？","explanation":"明确的一批复数鸡蛋用 están，不用 hay 来问其位置。"},{"id":"es-06-transfer-2","prompt":"询问是否供应无盐面包","text":"¿Hay pan sin sal en esta tienda?","zh":"这家店有无盐面包吗？","explanation":"hay 询问存在；pan 作物质名词，此处不加 un。"},{"id":"es-06-transfer-3","prompt":"在果摊买四分之一公斤樱桃","text":"Quería un cuarto de kilo de cerezas.","zh":"我想买四分之一公斤樱桃。","explanation":"un cuarto de kilo 为四分之一公斤，再用 de 连接商品。"},{"id":"es-06-transfer-4","prompt":"核实三个商品的合计","text":"¿Cuánto es todo junto, incluidas las bolsas?","zh":"包括袋子在内，全部合计多少钱？","explanation":"todo junto 作整体用 es；incluidas 随 bolsas 用阴性复数。"},{"id":"es-06-transfer-5","prompt":"拒绝新袋子并说明已带背包","text":"No necesito bolsa; puedo guardarlo todo en mi mochila.","zh":"我不需要袋子，可以把所有东西放进背包。","explanation":"no 在 necesito 前；guardarlo 中 lo 指采购物品这一整体。"},{"id":"es-06-transfer-6","prompt":"请给能显示商品明细的购物凭条","text":"¿Me puede dar un tique con el detalle de la compra?","zh":"您能给我一张列出购物明细的凭条吗？","explanation":"me 是受益者；puede 后接不定式 dar。"}],"grammarCheck":[{"prompt":"说有三台收银机，哪句正确？","options":["Hay tres cajas.","Hayan tres cajas.","Está tres cajas."],"answer":0,"explanation":"存在用固定形式 hay；不因三台变成其他形式。"},{"prompt":"问这些苹果在哪，哪句正确？","options":["¿Dónde está estas manzanas?","¿Dónde están estas manzanas?","¿Dónde hay están estas manzanas?"],"answer":1,"explanation":"具体复数物品的位置用 están，不同时加 hay。"},{"prompt":"买半公斤梨，哪句正确？","options":["Media kilo peras.","Medio kilos de peras.","Medio kilo de peras."],"answer":2,"explanation":"kilo 单数阳性，用 medio，并以 de 连接商品。"}],"writingChecklist":["是否区分 hay 的存在与 está/están 的位置。","重量单位后是否加 de，单位是否用正确单复数。","说明数量与商品，并核对合计是否包含袋子等项目。"],"speakingFollowups":["如果商品售罄，你会询问哪种替代品？","你会如何要求少买一点？","你怎样确认价格是每公斤还是每件？"]}},{"id":"es-07","number":7,"title":"问路与地标","goal":"用地标理解步行方向并确认目的地。","level":"A2","stage":"beginner","grammar":{"title":"方位介词与指路命令","explanation":"cerca de、delante de 后接参照物；al lado de 表示紧邻。gira、sigue 常用于对 tú 指路。","examples":[{"text":"La farmacia está al lado del banco.","zh":"药店在银行旁边。"},{"text":"Sigue recto y gira a la izquierda.","zh":"直走，然后左转。"}]},"vocab":[{"head":"calle","zh":"街道","example":"Esta calle es tranquila.","exampleZh":"这条街很安静。","icon":"talk"},{"head":"plaza","zh":"广场","example":"La plaza está cerca.","exampleZh":"广场就在附近。","icon":"talk"},{"head":"derecha","zh":"右边","example":"Gira a la derecha.","exampleZh":"向右转。","icon":"talk"},{"head":"izquierda","zh":"左边","example":"El banco está a la izquierda.","exampleZh":"银行在左边。","icon":"talk"},{"head":"recto","zh":"直着","example":"Sigue recto.","exampleZh":"继续直走。","icon":"talk"},{"head":"esquina","zh":"街角","example":"Hay un café en la esquina.","exampleZh":"街角有咖啡馆。","icon":"talk"},{"head":"puente","zh":"桥","example":"Cruza el puente.","exampleZh":"过桥。","icon":"talk"},{"head":"cerca","zh":"近","example":"Vivo cerca del parque.","exampleZh":"我住在公园附近。","icon":"talk"},{"head":"lejos","zh":"远","example":"El museo está lejos.","exampleZh":"博物馆很远。","icon":"talk"},{"head":"enfrente","zh":"对面","example":"La tienda está enfrente.","exampleZh":"商店在对面。","icon":"talk"}],"lessons":[{"id":"es-07-1","text":"¿Cómo se va a la biblioteca?","zh":"去图书馆怎么走？","tip":"cómo se va a 用来询问路线。"},{"id":"es-07-2","text":"Sigue todo recto.","zh":"一直向前走。","tip":"todo 加强“一直”的意思。"},{"id":"es-07-3","text":"Gira a la izquierda en la esquina.","zh":"在街角左转。","tip":"en 指动作发生的位置。"},{"id":"es-07-4","text":"Está enfrente del banco.","zh":"它在银行对面。","tip":"de 与 el 合为 del。"},{"id":"es-07-5","text":"¿Está muy lejos de aquí?","zh":"离这里很远吗？","tip":"lejos de 表示离某处远。"},{"id":"es-07-6","text":"Entonces, ¿cruzo la plaza?","zh":"那么，我穿过广场吗？","tip":"entonces 可引出确认。"}],"dialogue":[{"speaker":"Mei","text":"Perdone, ¿cómo se va al museo?","zh":"不好意思，去博物馆怎么走？"},{"speaker":"Vecino","text":"Sigue recto y cruza la plaza.","zh":"直走，穿过广场。"},{"speaker":"Mei","text":"¿Está al lado de la iglesia?","zh":"它在教堂旁边吗？"},{"speaker":"Vecino","text":"Sí, la entrada está en la esquina.","zh":"是的，入口在街角。"}],"reading":{"title":"去图书馆的路","text":"Mei quiere devolver un libro, pero no conoce la biblioteca del barrio. Pregunta a un vecino en una plaza. Él le explica que debe seguir recto, cruzar un puente pequeño y girar a la izquierda. La biblioteca está enfrente de una farmacia, junto a un parque. Mei repite las indicaciones para comprobar que las entiende. El vecino dice que son unos diez minutos a pie. Ella da las gracias y sigue el camino.","zh":"梅想还书，却不认识社区图书馆。她在广场上向一位邻居问路。邻居告诉她直走，过一座小桥，然后左转。图书馆在药店对面、公园旁边。梅重复了一遍路线，确认自己理解正确。邻居说步行约十分钟。她道谢后沿着这条路线走去。"},"assessment":{"reading":{"title":"邮局在哪里","text":"Óscar tiene que enviar una postal y busca una oficina de Correos. Pregunta en una panadería. La dependienta le dice que siga hasta el semáforo y gire a la derecha. La oficina está junto a una tienda de bicicletas, frente a una plaza pequeña. Óscar pregunta si necesita cruzar el puente. La dependienta responde que no, porque el puente está en la dirección contraria. Él sale y camina hacia el semáforo."},"questions":[{"prompt":"Óscar 要去哪里？","options":["图书馆","邮局","自行车店"],"answer":1,"explanation":"他寻找 oficina de Correos。"},{"prompt":"到红绿灯后怎么走？","options":["直走","左转","右转"],"answer":2,"explanation":"店员说 gire a la derecha。"},{"prompt":"邮局旁边是什么？","options":["自行车店","面包店","桥"],"answer":0,"explanation":"邮局 junto a una tienda de bicicletas。"},{"prompt":"需要过桥吗？","options":["需要","不需要","要过两座桥"],"answer":1,"explanation":"桥在相反方向，不需要过去。"}],"writing":"用四句描述从一个虚构广场到图书馆的路线，包含两个地标。","speaking":"先听一段三步路线，再用自己的话复述确认。"},"story":{"id":"es-07","npc":"Ana","place":"路口地图旁","scene":"你第一次独自出门。先问路，再用地标确认自己没有听反。","text":"¿Adónde quieres ir? Puedo indicarte el camino.","zh":"你想去哪里？我可以给你指路。","icon":"travel"},"support":{"id":"es-07","pronunciation":{"focus":"单 r 与双 rr","explanation":"pero 的单 r 通常短促，perro 的 rr 为颤音；recto 词首 r 较强，不要额外加元音。","examples":[{"text":"Gira a la derecha.","zh":"向右转。"},{"text":"El parque está cerca.","zh":"公园在附近。"}]},"grammarNotes":["去某处用 ir a；a el 缩合成 al，如 al museo，但 a la plaza 不缩合。","方位结构是 enfrente de / cerca de / lejos de；后接 el 时 de el 合为 del。","对 tú 指路用 sigue、gira、cruza；对 usted 用 siga、gire、cruce，不把不同称呼混在同一组指令里。"],"cultureNote":"西班牙一些街道门牌按奇偶分侧，但现场布局会不同；问路时用街名和地标确认，不仅依赖“第二个路口”。","vocabularyNotes":[{"head":"derecha","note":"向右用 a la derecha；在右边可说 a la derecha de la farmacia。"},{"head":"recto","note":"seguir todo recto 是一直直走；此处 recto 作方向表达，不随听话者性别改变。"},{"head":"enfrente","note":"通常搭配 de：enfrente del mercado；不能直接接市场名而省去 de。"}],"transfer":[{"id":"es-07-transfer-1","prompt":"从广场询问去邮局的路线","text":"¿Cómo puedo llegar a Correos desde esta plaza?","zh":"我从这个广场怎么去邮局？","explanation":"llegar a 表示到达；desde 标出起点。"},{"id":"es-07-transfer-2","prompt":"让朋友沿河一直走到桥边","text":"Sigue junto al río hasta el puente.","zh":"沿着河一直走到桥边。","explanation":"sigue 对应 tú；hasta 指路线终点。"},{"id":"es-07-transfer-3","prompt":"向游客礼貌说明在第二条街右转","text":"Gire a la derecha en la segunda calle.","zh":"请在第二条街向右转。","explanation":"正式称呼用 gire；a la derecha 是转弯方向。"},{"id":"es-07-transfer-4","prompt":"用面包店定位诊所","text":"La clínica está al lado de la panadería.","zh":"诊所在面包店旁边。","explanation":"al lado de 是完整方位短语，已知地点用 está。"},{"id":"es-07-transfer-5","prompt":"确认步行距离是否很近","text":"¿Se puede ir andando o queda demasiado lejos?","zh":"可以走过去，还是太远了？","explanation":"ir andando 表示步行；queda 可说明距离状态。"},{"id":"es-07-transfer-6","prompt":"复述先过桥再左转的路线","text":"Entonces cruzo el puente y después giro a la izquierda, ¿verdad?","zh":"那么我先过桥，然后左转，对吗？","explanation":"cruzo/giro 是第一人称复述，不是向对方发命令。"}],"grammarCheck":[{"prompt":"表达在银行对面，哪句正确？","options":["Está enfrente del banco.","Está enfrente el banco.","Está enfrente de el banco."],"answer":0,"explanation":"enfrente de 不能省 de；de el 必须缩合为 del。"},{"prompt":"向一位陌生人用 usted 指路，哪句正确？","options":["Sigue y gira a la derecha.","Siga y gire a la derecha.","Sigas y giras a la derecha."],"answer":1,"explanation":"正式单数肯定命令为 siga、gire。"},{"prompt":"表示去博物馆，哪句正确？","options":["Voy a el museo.","Voy en el museo.","Voy al museo."],"answer":2,"explanation":"目的地用 a，a el 缩合成 al。"}],"writingChecklist":["起点、终点是否分别用 desde 与 a/hasta。","cerca/enfrente 等方位词后是否补 de。","整段指令是否使用同一称呼形式。"],"speakingFollowups":["如果对方说得太快，你会怎样确认第二个转弯？","你会用哪个明显地标描述你现在的位置？","路线中哪一段你想请对方画出来？"]}},{"id":"es-08","number":8,"title":"城市交通与车票","goal":"查询线路、换乘和车票信息。","level":"A2","stage":"beginner","grammar":{"title":"ir a 与 en","explanation":"ir a 后接目的地；交通方式一般用 en，如 en autobús。步行是 a pie。线路和票务条件应询问当地运营方。","examples":[{"text":"Voy al centro en metro.","zh":"我乘地铁去市中心。"},{"text":"Tenemos que cambiar de línea.","zh":"我们得换乘线路。"}]},"vocab":[{"head":"billete","zh":"车票","example":"Necesito un billete sencillo.","exampleZh":"我需要一张单程票。","icon":"talk"},{"head":"ida","zh":"去程","example":"Es un billete de ida.","exampleZh":"这是一张单程票。","icon":"talk"},{"head":"vuelta","zh":"返程","example":"La vuelta es mañana.","exampleZh":"返程是明天。","icon":"talk"},{"head":"parada","zh":"站点","example":"La parada está aquí.","exampleZh":"车站在这里。","icon":"talk"},{"head":"estación","zh":"车站","example":"Voy a la estación.","exampleZh":"我要去车站。","icon":"talk"},{"head":"línea","zh":"线路","example":"Busca la línea azul.","exampleZh":"找蓝线。","icon":"talk"},{"head":"andén","zh":"站台","example":"El tren sale del andén dos.","exampleZh":"火车从二号站台出发。","icon":"talk"},{"head":"transbordo","zh":"换乘","example":"Hay un transbordo.","exampleZh":"需要换乘一次。","icon":"talk"},{"head":"autobús","zh":"公交车","example":"El autobús llega pronto.","exampleZh":"公交车很快就到。","icon":"talk"},{"head":"metro","zh":"地铁","example":"Voy en metro.","exampleZh":"我乘地铁去。","icon":"talk"}],"lessons":[{"id":"es-08-1","text":"¿Este autobús va al centro?","zh":"这班公交车去市中心吗？","tip":"este 指眼前这辆车。"},{"id":"es-08-2","text":"Un billete de ida y vuelta, por favor.","zh":"请给我一张往返票。","tip":"ida y vuelta 表示往返。"},{"id":"es-08-3","text":"¿Dónde tengo que bajar?","zh":"我得在哪里下车？","tip":"tener que 表示需要。"},{"id":"es-08-4","text":"¿Hay que hacer transbordo?","zh":"需要换乘吗？","tip":"hay que 表达一般必要性。"},{"id":"es-08-5","text":"¿En qué andén sale el tren?","zh":"火车从哪个站台出发？","tip":"en qué 询问具体位置。"},{"id":"es-08-6","text":"¿Dónde se valida el billete?","zh":"在哪里验票？","tip":"不同系统操作不同，可直接询问。"}],"dialogue":[{"speaker":"Mei","text":"¿Cómo llego al hospital en metro?","zh":"我怎么乘地铁去医院？"},{"speaker":"Empleado","text":"Toma esta línea y cambia en Sol.","zh":"乘这条线，在 Sol 换乘。"},{"speaker":"Mei","text":"¿Tengo que comprar otro billete?","zh":"我需要再买一张票吗？"},{"speaker":"Empleado","text":"Vamos a comprobar qué billete tienes.","zh":"我们来确认你持有什么票。"}],"reading":{"title":"第一次换乘","text":"Mei necesita ir a una exposición al otro lado de la ciudad. En la estación mira el plano del metro, pero duda sobre el transbordo. Una empleada le indica la línea que debe tomar y la estación donde tiene que cambiar. Mei pregunta también qué billete necesita para ese recorrido. Después comprueba el destino en la pantalla del andén. Cuando llega el tren, espera a que salgan los pasajeros antes de entrar.","zh":"梅要去城市另一边看展览。在车站，她查看地铁图，但不确定怎样换乘。一位工作人员告诉她该乘哪条线，以及在哪站换乘。梅还询问这段行程需要什么票。随后她查看站台屏幕上的目的地。列车到站时，她先等乘客下车，再上车。"},"assessment":{"reading":{"title":"去海边的火车","text":"El domingo, Julia y su primo van a visitar a una amiga en la costa. Compran billetes de ida porque volverán en coche con ella. En la estación, la pantalla anuncia el andén cuatro. Julia quiere comprar agua, mientras su primo comprueba la hora de salida. El tren sale a las diez y veinte. Cuando llegan al andén, oyen un aviso de cambio al andén seis y preguntan a una empleada para confirmarlo."},"questions":[{"prompt":"为什么买单程票？","options":["返程朋友开车送他们","往返票已售完","他们要搬家"],"answer":0,"explanation":"他们将和朋友乘车返回。"},{"prompt":"最初屏幕显示哪个站台？","options":["六号","二号","四号"],"answer":2,"explanation":"最初显示 andén cuatro。"},{"prompt":"火车几点出发？","options":["十点","十点二十","十一点二十"],"answer":1,"explanation":"文中为 diez y veinte。"},{"prompt":"他们听到通知后做什么？","options":["离开车站","退票","向员工确认"],"answer":2,"explanation":"他们向工作人员确认站台变更。"}],"writing":"写一段车站咨询，包含目的地、单程或往返以及换乘问题。","speaking":"模拟查询路线，复述线路、下车站，并询问所需车票。"},"story":{"id":"es-08","npc":"Pablo","place":"车站售票窗","scene":"你准备坐车去另一个街区。确认目的地、车票和出发时间。","text":"¿Cuál es tu destino y cuándo quieres salir?","zh":"你的目的地在哪里，想什么时候出发？","icon":"travel"},"support":{"id":"es-08","pronunciation":{"focus":"重音落在末节的交通词","explanation":"andén、estación 中重音符号提示末节重读；autobús 也重读末节，复数 autobuses 不带重音符号。","examples":[{"text":"El autobús llega en diez minutos.","zh":"公交车十分钟后到。"},{"text":"¿Cuál es el andén?","zh":"是哪个站台？"}]},"grammarNotes":["目的地用 a，交通方式通常用 en：voy al centro en metro；步行是 a pie，不说 en pie。","tener que 表示某人必须做，按人称变位；hay que 是无人称的一般要求，始终保持 hay。","salir de 表示从某站台出发；问站台可说 ¿De qué andén sale…?，不要受中文“在哪”影响只用 en。"],"cultureNote":"公交和铁路的票制、换乘与验票方式依城市和运营方而异；使用 billete、validar 等词提问，再确认现场信息。","vocabularyNotes":[{"head":"billete","note":"西班牙常用 billete 指交通票；un billete de ida 是单程，de ida y vuelta 是往返。"},{"head":"parada","note":"多用于公交站或地铁停靠站；铁路车站通常用 estación，站台是 andén。"},{"head":"transbordo","note":"hacer transbordo 是换乘，重音在 bor；不要直接说 cambiar transbordo。"}],"transfer":[{"id":"es-08-transfer-1","prompt":"确认这班地铁是否经过大学","text":"¿Esta línea de metro pasa por la universidad?","zh":"这条地铁线经过大学吗？","explanation":"pasar por 强调途经，不等同于最终目的地。"},{"id":"es-08-transfer-2","prompt":"买周六去周日回的票","text":"Quería ir el sábado y volver el domingo; ¿hay billete de ida y vuelta?","zh":"我想周六去、周日回，有往返票吗？","explanation":"ir 与 volver 配合两个时间；hay 不随 billete 改变。"},{"id":"es-08-transfer-3","prompt":"问去医院应在哪站下车","text":"¿En qué parada tengo que bajarme para ir al hospital?","zh":"去医院我该在哪一站下车？","explanation":"bajarse 的 me 可接不定式后；para ir 表目的。"},{"id":"es-08-transfer-4","prompt":"确认直达还是在中途换乘","text":"¿El tren es directo o hay que cambiar en Valladolid?","zh":"这趟列车是直达，还是需要在巴利亚多利德换乘？","explanation":"无人称要求用 hay que；两种选择以 o 连接。"},{"id":"es-08-transfer-5","prompt":"询问去机场的列车出发站台","text":"¿De qué andén sale el tren del aeropuerto?","zh":"机场列车从哪个站台出发？","explanation":"出发点用 de；del aeropuerto 修饰列车。"},{"id":"es-08-transfer-6","prompt":"首次乘车请人示范验票","text":"Es mi primer viaje aquí; ¿me puede enseñar a validar el billete?","zh":"这是我第一次在这里乘车，您能教我验票吗？","explanation":"enseñar a 加不定式说明教某人做什么，不假定所有票都同样操作。"}],"grammarCheck":[{"prompt":"说乘公交去车站，哪句正确？","options":["Voy a la estación en autobús.","Voy en la estación a autobús.","Voy a estación con autobús."],"answer":0,"explanation":"目的地用 a la，交通工具用 en。"},{"prompt":"一般规定需要换乘，哪句正确？","options":["Hay que hacer transborda.","Hay que hacer transbordo.","Hay hacer transbordo."],"answer":1,"explanation":"hay que 后接不定式 hacer，hacer transbordo 为固定搭配。"},{"prompt":"问列车从哪个站台发车，哪句最准确？","options":["¿A qué andén sale el tren?","¿Con qué andén sale el tren?","¿De qué andén sale el tren?"],"answer":2,"explanation":"从某处出发用 salir de，a 指去向。"}],"writingChecklist":["写明线路、方向与上下车地点。","检查目的地 a、工具 en、出发地 de。","把需要确认的票种、换乘或验票方式写成具体问题。"],"speakingFollowups":["如果列车取消，你会问什么替代路线？","你如何确认自己上的是正确方向？","工作人员说必须换乘，你会追问哪两条信息？"]}},{"id":"es-09","number":9,"title":"入住与住宿","goal":"核对预订，询问房间设施并报告简单问题。","level":"A2","stage":"beginner","grammar":{"title":"estar 与形容词","explanation":"estar 表达房间或设施当前的状态，如 abierta、cerrada。名词的阴阳性影响相应形容词形式。","examples":[{"text":"La ventana está abierta.","zh":"窗户开着。"},{"text":"El baño está limpio.","zh":"浴室很干净。"}]},"vocab":[{"head":"reserva","zh":"预订","example":"Tengo una reserva.","exampleZh":"我有预订。","icon":"talk"},{"head":"habitación","zh":"房间","example":"La habitación es tranquila.","exampleZh":"房间很安静。","icon":"talk"},{"head":"llave","zh":"钥匙","example":"No encuentro la llave.","exampleZh":"我找不到钥匙。","icon":"talk"},{"head":"recepción","zh":"前台","example":"Pregunta en recepción.","exampleZh":"去前台问一下。","icon":"talk"},{"head":"baño","zh":"浴室；卫生间","example":"El baño está al fondo.","exampleZh":"卫生间在尽头。","icon":"talk"},{"head":"ducha","zh":"淋浴","example":"La ducha no funciona.","exampleZh":"淋浴不能用。","icon":"talk"},{"head":"toalla","zh":"毛巾","example":"Necesito una toalla.","exampleZh":"我需要一条毛巾。","icon":"talk"},{"head":"ascensor","zh":"电梯","example":"Hay un ascensor.","exampleZh":"有一部电梯。","icon":"talk"},{"head":"equipaje","zh":"行李","example":"Dejo aquí el equipaje.","exampleZh":"我把行李放在这里。","icon":"talk"},{"head":"desayuno","zh":"早餐","example":"¿Está incluido el desayuno?","exampleZh":"包含早餐吗？","icon":"talk"}],"lessons":[{"id":"es-09-1","text":"Tengo una reserva a nombre de Chen.","zh":"我有一个以陈为名的预订。","tip":"a nombre de 表示以某人姓名登记。"},{"id":"es-09-2","text":"¿A qué hora es el desayuno?","zh":"早餐几点开始？","tip":"a qué hora 询问时间。"},{"id":"es-09-3","text":"¿Hay ascensor?","zh":"有电梯吗？","tip":"询问是否有某设施用 hay。"},{"id":"es-09-4","text":"La llave no abre la puerta.","zh":"钥匙打不开门。","tip":"no 放在动词前。"},{"id":"es-09-5","text":"¿Podéis revisar la ducha?","zh":"你们能检查淋浴吗？","tip":"podéis 是对多人说“你们能”。"},{"id":"es-09-6","text":"¿Puedo dejar el equipaje aquí?","zh":"我能把行李寄放这里吗？","tip":"dejar 在此是留下或寄放。"}],"dialogue":[{"speaker":"Recepcionista","text":"Buenas tardes. ¿Tiene reserva?","zh":"下午好。您有预订吗？"},{"speaker":"Mei","text":"Sí, a nombre de Chen, dos noches.","zh":"有，姓陈，两晚。"},{"speaker":"Recepcionista","text":"Aquí tiene la llave. ¿Necesita algo más?","zh":"这是钥匙。还需要什么吗？"},{"speaker":"Mei","text":"Sí, ¿a qué hora se sirve el desayuno?","zh":"需要，早餐几点供应？"}],"reading":{"title":"到达旅馆","text":"Mei llega a una pequeña pensión de Sevilla después de viajar en tren. Tiene una reserva para dos noches. En recepción confirma su nombre y pregunta por el desayuno. La recepcionista explica el horario y le entrega una llave. La habitación está en la segunda planta y hay ascensor. Al entrar, Mei ve que falta una toalla. Llama a recepción y pide una. Más tarde sale a pasear y deja la llave donde le han indicado.","zh":"梅乘火车后到达塞维利亚的一家小旅馆。她预订了两晚。在前台，她确认姓名并询问早餐。女接待员说明用餐时间，交给她一把钥匙。房间在西班牙所说的第二层，楼里有电梯。进屋后，梅发现少了一条毛巾。她致电前台要了一条。后来她外出散步，按照先前指示放好钥匙。"},"assessment":{"reading":{"title":"房间的小问题","text":"Marcos llega a un alojamiento con su hermana. Han reservado una habitación con dos camas. La habitación es correcta, pero una lámpara no se enciende. Marcos baja a recepción para explicar el problema. La recepcionista ofrece enviar a alguien después de las seis. Como ellos quieren salir antes, acuerdan que revisen la lámpara mientras están fuera. Antes de irse, preguntan dónde pueden dejar el equipaje al día siguiente, después de salir de la habitación."},"questions":[{"prompt":"他们预订什么房间？","options":["一张床的房间","两张床的房间","带厨房的公寓"],"answer":1,"explanation":"预订的是 con dos camas。"},{"prompt":"什么坏了？","options":["淋浴","电梯","一盏灯"],"answer":2,"explanation":"一盏灯不亮。"},{"prompt":"约定何时维修？","options":["他们外出期间","他们吃早餐时","他们退房后"],"answer":0,"explanation":"同意在他们外出时检查。"},{"prompt":"离开前还问了什么？","options":["晚餐价格","次日寄放行李地点","机场路线"],"answer":1,"explanation":"他们询问次日退房后寄存行李的位置。"}],"writing":"给住宿前台写四句留言：说明房号、一个设施问题和方便处理的时间。","speaking":"模拟入住，核对姓名和住宿晚数，询问早餐及行李寄存。"},"story":{"id":"es-09","npc":"Lucía","place":"旅馆前台","scene":"你来到预订的住处。说明来意，也把自己的需要说清楚。","text":"Buenas tardes. ¿Tienes una reserva a tu nombre?","zh":"下午好。你有以自己名字作的预订吗？","icon":"home"},"support":{"id":"es-09","pronunciation":{"focus":"ll 与 y 的常见合流","explanation":"llave 的 ll 在西班牙多数口音中与 y 相近；habitación 的 h 不发音，ción 末节重读。","examples":[{"text":"La habitación está lista.","zh":"房间准备好了。"},{"text":"Necesito otra llave.","zh":"我需要另一把钥匙。"}]},"grammarNotes":["房间状态用 estar 加形容词：está limpia；形容词随名词变为 limpia/limpias，不随住客变。","a nombre de 表示以某人名义预订；不能按中文说 en nombre de 来替换所有预订场合。","询问是否有设施用 hay；问已有设施在哪里用 está/están，如 ¿Dónde están las toallas?。"],"cultureNote":"酒店早餐时间、行李寄存与入住安排各不相同；用问句确认是否提供以及具体条件，不把表达范例当成服务保证。","vocabularyNotes":[{"head":"habitación","note":"阴性：la habitación；复数 habitaciones 去掉原重音符号，定冠词 las。"},{"head":"equipaje","note":"阳性集合名词，通常说 el equipaje 或 dos maletas，不按行李件数说 dos equipajes。"},{"head":"reserva","note":"tener una reserva a nombre de…；reserva 也可作动词形式，须看句子位置。"}],"transfer":[{"id":"es-09-transfer-1","prompt":"说明两晚的预订并出示邮件","text":"He reservado dos noches y tengo aquí el correo de confirmación.","zh":"我预订了两晚，确认邮件在这里。","explanation":"he reservado 说明已完成的预订；dos noches 直接表示时长。"},{"id":"es-09-transfer-2","prompt":"询问早班车前能否吃早餐","text":"Salimos a las siete; ¿el desayuno empieza antes?","zh":"我们七点出发，早餐在那之前开始吗？","explanation":"salimos 为我们；antes 回指七点之前。"},{"id":"es-09-transfer-3","prompt":"担心爬楼梯，询问房间所在楼层","text":"¿En qué planta está la habitación y hay ascensor?","zh":"房间在几层？有电梯吗？","explanation":"具体房间位置用 está；设施存在用 hay。"},{"id":"es-09-transfer-4","prompt":"说明门卡能开外门却开不了房门","text":"La tarjeta abre la entrada, pero no abre mi habitación.","zh":"这张卡能打开入口的门，却打不开我的房间。","explanation":"两个并列谓语用 pero 表转折；no 放在第二个 abre 前。"},{"id":"es-09-transfer-5","prompt":"报告浴室没有热水","text":"La ducha está fría; ¿podéis comprobar el agua caliente?","zh":"淋浴水是冷的，你们能检查一下热水吗？","explanation":"fría 随 ducha；podéis 对应西班牙非正式复数。"},{"id":"es-09-transfer-6","prompt":"退房后请求短时寄存并问取件时间","text":"¿Puedo dejar una maleta hasta las tres y recogerla después?","zh":"我能把一只行李箱放到三点，之后再取吗？","explanation":"recogerla 的 la 回指阴性 maleta；hasta 表截止时间。"}],"grammarCheck":[{"prompt":"说两间房都干净，哪句正确？","options":["Las habitaciones están limpias.","Las habitaciones está limpia.","Las habitaciones son limpio."],"answer":0,"explanation":"复数主语用 están，形容词阴性复数 limpias。"},{"prompt":"问有无电梯，哪句正确？","options":["¿Está un ascensor?","¿Hay ascensor?","¿Es ascensor?"],"answer":1,"explanation":"是否提供设施用 hay，不是确定设施的位置。"},{"prompt":"说钥匙以外的行李在这里，哪句正确？","options":["Los equipajes está aquí.","La equipaje está aquí.","El equipaje está aquí."],"answer":2,"explanation":"equipaje 是阳性集合名词，常用单数 el equipaje。"}],"writingChecklist":["房间和设施的性数是否与形容词、动词一致。","区分预订信息、设施存在和设施位置。","请求写清日期、时间、物品及需要确认的条件。"],"speakingFollowups":["如果房间尚未准备好，你会怎样询问安排？","你会怎么描述一种具体的设施故障？","寄存行李前你还想核对什么？"]}},{"id":"es-10","number":10,"title":"家居与日常安排","goal":"描述住房、作息和分配家务。","level":"A2","stage":"beginner","grammar":{"title":"反身动词与频率","explanation":"me levanto、me acuesto 描述自己的起床、就寝。siempre、a veces、nunca 表达不同频率。","examples":[{"text":"Me levanto a las siete.","zh":"我七点起床。"},{"text":"A veces cocinamos juntos.","zh":"我们有时一起做饭。"}]},"vocab":[{"head":"piso","zh":"公寓；楼层","example":"Vivo en un piso pequeño.","exampleZh":"我住在一套小公寓里。","icon":"talk"},{"head":"cocina","zh":"厨房","example":"La cocina es luminosa.","exampleZh":"厨房很明亮。","icon":"talk"},{"head":"salón","zh":"客厅","example":"Estudio en el salón.","exampleZh":"我在客厅学习。","icon":"talk"},{"head":"dormitorio","zh":"卧室","example":"Mi dormitorio da al patio.","exampleZh":"我的卧室朝向内院。","icon":"talk"},{"head":"levantarse","zh":"起床","example":"Me levanto temprano.","exampleZh":"我起得早。","icon":"talk"},{"head":"acostarse","zh":"上床睡觉","example":"Me acuesto a las once.","exampleZh":"我十一点上床睡觉。","icon":"talk"},{"head":"limpiar","zh":"打扫","example":"Limpio la cocina.","exampleZh":"我打扫厨房。","icon":"talk"},{"head":"lavadora","zh":"洗衣机","example":"Pongo la lavadora por la tarde.","exampleZh":"我下午开洗衣机洗衣服。","icon":"talk"},{"head":"basura","zh":"垃圾","example":"Saco la basura.","exampleZh":"我把垃圾拿出去。","icon":"talk"},{"head":"compañero de piso","zh":"室友","example":"Mi compañero de piso cocina bien.","exampleZh":"我室友很会做饭。","icon":"talk"}],"lessons":[{"id":"es-10-1","text":"Vivo en un piso compartido.","zh":"我住在合租公寓里。","tip":"compartido 表示共同使用。"},{"id":"es-10-2","text":"Me levanto a las siete y media.","zh":"我七点半起床。","tip":"levantarse 的代词变为 me。"},{"id":"es-10-3","text":"Normalmente desayuno en casa.","zh":"我通常在家吃早餐。","tip":"normalmente 表示通常。"},{"id":"es-10-4","text":"¿Cuándo ponemos la lavadora?","zh":"我们什么时候洗衣服？","tip":"poner la lavadora 是常见表达。"},{"id":"es-10-5","text":"Hoy me toca limpiar la cocina.","zh":"今天轮到我打扫厨房。","tip":"me toca 表示轮到我。"},{"id":"es-10-6","text":"¿Vosotros cenáis juntos?","zh":"你们一起吃晚饭吗？","tip":"cenáis 是 vosotros 的变位。"}],"dialogue":[{"speaker":"Mei","text":"¿Hoy te toca sacar la basura?","zh":"今天轮到你倒垃圾吗？"},{"speaker":"Luis","text":"Sí. ¿Tú puedes limpiar la mesa?","zh":"是的。你能擦桌子吗？"},{"speaker":"Mei","text":"Claro, después de cenar.","zh":"当然，晚饭后擦。"},{"speaker":"Luis","text":"Perfecto. Mañana cocino yo.","zh":"好的。明天我做饭。"}],"reading":{"title":"合租生活","text":"Mei comparte un piso con Luis y Sara. Cada persona tiene su dormitorio, pero los tres usan la misma cocina y el mismo salón. Mei se levanta temprano porque su clase empieza a las nueve. Luis trabaja por la tarde y desayuna más tarde. Para organizarse, escriben las tareas en una hoja pegada a la nevera. Esta semana Mei limpia la cocina, Luis saca la basura y Sara compra los productos de limpieza.","zh":"梅和路易斯、萨拉合租一套公寓。每人都有自己的卧室，但三人共用厨房和客厅。梅起得早，因为她九点开始上课。路易斯下午工作，早餐吃得晚一些。为了安排好家务，他们把任务写在一张贴在冰箱上的纸上。本周梅打扫厨房，路易斯倒垃圾，萨拉购买清洁用品。"},"assessment":{"reading":{"title":"星期三的家务","text":"En el piso de Irene viven tres personas. Los miércoles suelen limpiar juntos, pero esta semana Irene tiene una reunión hasta tarde. Propone limpiar el baño el jueves por la mañana. Sus compañeros aceptan. David se encarga de la cocina y Lucía del salón el miércoles. También acuerdan no poner la lavadora durante la reunión de Irene porque hace mucho ruido. Después de organizar las tareas, preparan una cena sencilla con lo que hay en la nevera."},"questions":[{"prompt":"通常哪天一起打扫？","options":["星期三","星期四","星期日"],"answer":0,"explanation":"Los miércoles suelen limpiar juntos。"},{"prompt":"Irene 为什么改时间？","options":["去旅游","有会议到很晚","洗衣机坏了"],"answer":1,"explanation":"她本周有会议到很晚。"},{"prompt":"Lucía 负责哪里？","options":["厨房","浴室","客厅"],"answer":2,"explanation":"Lucía del salón 指她负责客厅。"},{"prompt":"会议期间不做什么？","options":["做饭","开洗衣机","打扫浴室"],"answer":1,"explanation":"他们同意不开声音很大的洗衣机。"}],"writing":"描述你的理想合租生活，写作息、公共空间和两项家务安排。","speaking":"与室友商量本周家务，提出一个时间冲突并达成新安排。"},"story":{"id":"es-10","npc":"Ana","place":"合住公寓","scene":"新室友想了解你的作息。说说日常安排，再商量共用空间。","text":"¿Cómo sueles organizar tu día?","zh":"你通常怎样安排一天？","icon":"home"},"support":{"id":"es-10","pronunciation":{"focus":"重读元音与反身词尾","explanation":"levántate 中重音符号保持重读位置；acostarse 重读 tar，变位 me acuesto 时出现 ue。","examples":[{"text":"Me acuesto temprano.","zh":"我很早上床睡觉。"},{"text":"¿Os levantáis a las ocho?","zh":"你们八点起床吗？"}]},"grammarNotes":["反身代词随主语变化：me levanto、te levantas、nos levantamos、os levantáis；不能一律用 se。","acostarse 在现在时部分人称变为 ue：me acuesto，但 nosotros nos acostamos、vosotros os acostáis。","习惯用 normalmente、siempre 等词与现在时；me toca limpiar 表示轮到我，后接不定式。"],"cultureNote":"合租生活中的吃饭与安静时间应共同商量；西班牙常见较晚用餐并不代表每个人的作息一致。","vocabularyNotes":[{"head":"piso","note":"西班牙常指一套公寓；compartir piso 是合租，住几层则用 en el segundo piso 等。"},{"head":"lavadora","note":"poner la lavadora 是开洗衣机洗衣服，不是把机器摆到某处；一轮洗衣可说 una lavadora。"},{"head":"basura","note":"通常用单数 la basura；sacar la basura 指把垃圾拿到外面丢弃。"}],"transfer":[{"id":"es-10-transfer-1","prompt":"说明独居但偶尔接待朋友","text":"Vivo solo, aunque algunos fines de semana vienen amigos.","zh":"我独自居住，不过有些周末朋友会来。","explanation":"solo 随男性说话者；aunque 衔接不同情况。"},{"id":"es-10-transfer-2","prompt":"对比上班日与周末起床时间","text":"Entre semana me levanto temprano, pero los domingos duermo más.","zh":"工作日我起得早，但周日睡得久一些。","explanation":"me levanto 为第一人称反身；los domingos 表规律。"},{"id":"es-10-transfer-3","prompt":"描述自己不常在家吃晚饭","text":"Casi nunca ceno en casa porque salgo tarde del trabajo.","zh":"我几乎从不在家吃晚饭，因为下班很晚。","explanation":"casi nunca 放动词前时无需另加 no。"},{"id":"es-10-transfer-4","prompt":"与室友商量避开休息时间洗衣","text":"¿Ponemos la lavadora antes de cenar para no molestar por la noche?","zh":"我们晚饭前洗衣服，好避免晚上打扰别人，怎么样？","explanation":"antes de 后接 cenar；para no molestar 的 no 在不定式前。"},{"id":"es-10-transfer-5","prompt":"说明这周的轮值并提出交换","text":"Esta semana me toca sacar la basura; ¿puedo cambiar el turno contigo?","zh":"这周轮到我倒垃圾，我能和你换班吗？","explanation":"me toca 后接不定式；contigo 表“与你”。"},{"id":"es-10-transfer-6","prompt":"询问几位室友的共同作息","text":"¿Os acostáis todos a la misma hora o tenéis horarios distintos?","zh":"你们都是同一时间睡觉，还是作息不同？","explanation":"vosotros 反身代词用 os，acostáis 不发生 ue 变化。"}],"grammarCheck":[{"prompt":"说我们七点起床，哪句正确？","options":["Nos levantamos a las siete.","Me levantamos a las siete.","Nos levantan a las siete."],"answer":0,"explanation":"第一人称复数需 nos 与 levantamos 配合。"},{"prompt":"问你们几点睡觉，哪句正确？","options":["¿A qué hora os acuestáis?","¿A qué hora os acostáis?","¿A qué hora se acostáis?"],"answer":1,"explanation":"vosotros 形式为 acostáis，不变 ue；反身代词是 os。"},{"prompt":"表达几乎从不在家吃饭，哪句正确？","options":["Casi no nunca como en casa.","Casi nunca no como en casa.","Casi nunca como en casa."],"answer":2,"explanation":"nunca 在动词前已使句子否定，不重复加 no。"}],"writingChecklist":["反身代词和变位是否属于同一人称。","是否准确区分工作日、每周某天与今天。","家务分工是否说明谁做、何时做及是否需要协商。"],"speakingFollowups":["如果洗衣时间影响室友休息，你会怎么提出新安排？","你和室友哪种作息差异最大？","轮到你打扫但临时忙碌时你会怎么说？"]}},{"id":"es-11","number":11,"title":"就医前的表达","goal":"描述不适，询问预约与语言帮助。","level":"A2","stage":"beginner","grammar":{"title":"doler 与身体部位","explanation":"me duele 后接单数部位；me duelen 后接复数部位。身体部位前通常用定冠词。这些句型用于沟通，不用于自我诊断。","examples":[{"text":"Me duele la garganta.","zh":"我嗓子疼。"},{"text":"Me duelen los pies.","zh":"我双脚疼。"}]},"vocab":[{"head":"cita","zh":"预约","example":"Necesito una cita.","exampleZh":"我需要预约。","icon":"talk"},{"head":"centro de salud","zh":"社区医疗中心","example":"Busco el centro de salud.","exampleZh":"我在找社区医疗中心。","icon":"talk"},{"head":"médico","zh":"医生","example":"Quiero hablar con un médico.","exampleZh":"我想和医生谈谈。","icon":"talk"},{"head":"farmacia","zh":"药店","example":"La farmacia está cerca.","exampleZh":"药店在附近。","icon":"talk"},{"head":"dolor","zh":"疼痛","example":"Tengo dolor de cabeza.","exampleZh":"我头疼。","icon":"talk"},{"head":"garganta","zh":"喉咙","example":"Me duele la garganta.","exampleZh":"我嗓子疼。","icon":"talk"},{"head":"fiebre","zh":"发烧","example":"Tengo fiebre desde ayer.","exampleZh":"我从昨天开始发烧。","icon":"talk"},{"head":"alergia","zh":"过敏","example":"Tengo alergia a este medicamento.","exampleZh":"我对这种药过敏。","icon":"talk"},{"head":"medicamento","zh":"药物","example":"Tomo este medicamento.","exampleZh":"我在服用这种药。","icon":"talk"},{"head":"intérprete","zh":"口译员","example":"¿Hay servicio de intérprete?","exampleZh":"有口译服务吗？","icon":"talk"}],"lessons":[{"id":"es-11-1","text":"Quería pedir una cita.","zh":"我想预约。","tip":"pedir una cita 表示预约就诊等服务。"},{"id":"es-11-2","text":"Me duele la cabeza desde ayer.","zh":"我从昨天起头疼。","tip":"desde 引出开始时间。"},{"id":"es-11-3","text":"Me duelen las piernas.","zh":"我腿疼。","tip":"复数部位使用 duelen。"},{"id":"es-11-4","text":"Tengo alergia a este medicamento.","zh":"我对这种药过敏。","tip":"alergia a 后接过敏原。"},{"id":"es-11-5","text":"¿Puede escribir las instrucciones?","zh":"您能把说明写下来吗？","tip":"可以请求书面信息以便确认。"},{"id":"es-11-6","text":"No hablo mucho español. ¿Hay ayuda lingüística?","zh":"我西语说得不多。有语言帮助吗？","tip":"清楚说明沟通需要。"}],"dialogue":[{"speaker":"Mei","text":"Buenos días, quería pedir una cita.","zh":"早上好，我想预约。"},{"speaker":"Recepcionista","text":"¿Qué le ocurre?","zh":"您哪里不舒服？"},{"speaker":"Mei","text":"Me duele la garganta desde ayer.","zh":"我从昨天起嗓子疼。"},{"speaker":"Recepcionista","text":"Vamos a comprobar las citas disponibles.","zh":"我们查看一下可预约时间。"}],"reading":{"title":"带着笔记去咨询","text":"Mei lleva dos días con dolor de garganta y quiere consultar a un profesional. Llama a su centro de salud para preguntar por una cita. Antes de llamar, escribe cuándo empezó el dolor y qué medicamentos toma normalmente. Durante la conversación pide que hablen despacio. La persona de recepción le indica cómo comprobar las citas disponibles. Mei repite la información para confirmarla y guarda su nota para explicar los síntomas durante la consulta.","zh":"梅嗓子疼了两天，想咨询专业人员。她打电话给社区医疗中心询问预约。打电话前，她记下疼痛何时开始，以及平常服用什么药。通话中，她请求对方慢些说。前台人员告诉她如何查询可预约时间。梅重复信息加以确认，并保留笔记，以便在就诊时说明症状。"},"assessment":{"reading":{"title":"预约前的确认","text":"Tomás llama a una clínica porque necesita cambiar la hora de una consulta. Tiene cita el jueves por la mañana, pero ese día trabaja. Pregunta si hay alguna hora disponible el viernes por la tarde. La recepcionista encuentra una a las cinco y le pide que confirme su nombre. Tomás acepta la nueva hora. Antes de colgar, pregunta qué documentos debe llevar y anota la respuesta para no olvidarla."},"questions":[{"prompt":"Tomás 为什么改预约？","options":["要出游","原来的医生离职","原时间要工作"],"answer":2,"explanation":"星期四早上他要工作。"},{"prompt":"希望改到何时？","options":["星期五下午","星期四晚上","星期六早上"],"answer":0,"explanation":"他询问 viernes por la tarde。"},{"prompt":"新预约是几点？","options":["四点","五点","六点"],"answer":1,"explanation":"前台找到 a las cinco 的时间。"},{"prompt":"挂电话前问了什么？","options":["药品价格","该带什么文件","检查结果"],"answer":1,"explanation":"他询问 qué documentos debe llevar。"}],"writing":"写一张就诊沟通卡：一个虚构症状、开始时间、已知过敏信息或“需要确认”，以及语言帮助需求。","speaking":"模拟打电话预约，说明症状持续时间，请对方慢说并复述预约信息。"},"story":{"id":"es-11","npc":"Pablo","place":"就医接待处","scene":"你需要说明不适。先讲感受和持续时间，再寻求适当帮助。","text":"¿Qué te pasa y desde cuándo te encuentras así?","zh":"你哪里不舒服，这种情况持续多久了？","icon":"health"},"support":{"id":"es-11","pronunciation":{"focus":"gue 与 gui 中的 u","explanation":"garganta 的 ga 发硬音；guerra 的 gue 中 u 通常不发音，而 lingüística 的 ü 提示发出 u 音。","examples":[{"text":"Me duele la garganta.","zh":"我喉咙疼。"},{"text":"¿Hay apoyo lingüístico?","zh":"有语言协助吗？"}]},"grammarNotes":["doler 的主语是疼痛部位：me duele el brazo / me duelen los brazos；不能按“我痛”用 yo duelo。","身体部位通常用定冠词，并以 me/te 等表示感受者，如 me duele la espalda，不必写 mi espalda。","持续到现在的症状可用 desde 加起点，desde hace 加时长：desde el lunes / desde hace dos días。"],"cultureNote":"求助时简明说明症状、持续时间和语言需要；能否获得口译或预约取决于具体机构，需要现场确认。","vocabularyNotes":[{"head":"dolor","note":"名词用 tener dolor de…；动词结构用 me duele…，两者不要混成 tengo duele。"},{"head":"alergia","note":"搭配 tener alergia a；若信息尚未核实，应说明自己不确定，而不把猜测说成既定事实。"},{"head":"intérprete","note":"重读 tér；可说 un intérprete / una intérprete，职业名的词尾不随男女改变。"}],"transfer":[{"id":"es-11-transfer-1","prompt":"想预约咨询并询问可用时间","text":"Necesito una cita para consultar un problema; ¿qué horas hay disponibles?","zh":"我需要预约咨询一个问题，有哪些可用时间？","explanation":"necesito 后接名词；horas 复数用 disponibles。"},{"id":"es-11-transfer-2","prompt":"描述肩部不适的起始时间","text":"Me duele el hombro desde el domingo por la tarde.","zh":"我从周日下午开始肩膀疼。","explanation":"单数 hombro 用 duele；desde 加具体起点。"},{"id":"es-11-transfer-3","prompt":"说明双眼疼痛持续两天","text":"Me duelen los ojos desde hace dos días.","zh":"我眼睛疼已经两天了。","explanation":"复数 ojos 决定 duelen；时长用 desde hace。"},{"id":"es-11-transfer-4","prompt":"告知曾有过敏反应但不清楚药名","text":"He tenido una reacción alérgica, pero no recuerdo el nombre del medicamento.","zh":"我曾出现过过敏反应，但不记得药的名字。","explanation":"he tenido 表经历；明确不知道名称，避免添加未核实信息。"},{"id":"es-11-transfer-5","prompt":"请工作人员写明复诊日期","text":"¿Puede apuntar la fecha de la próxima visita para que no la confunda?","zh":"您能写下下次就诊日期，以免我弄错吗？","explanation":"la 回指 fecha；此处请求的是书面日期。"},{"id":"es-11-transfer-6","prompt":"说明需要帮助理解表格","text":"Me cuesta entender este formulario; ¿hay alguien que pueda ayudarme?","zh":"我理解这份表格有困难，有人能帮我吗？","explanation":"me cuesta 加不定式表示做某事困难；询问有无可提供帮助的人。"}],"grammarCheck":[{"prompt":"说双腿疼，哪句正确？","options":["Me duelen las piernas.","Yo duele las piernas.","Me duele las piernas."],"answer":0,"explanation":"疼痛部位为复数，动词用 duelen，me 是感受者。"},{"prompt":"说从昨天起喉咙疼，哪句正确？","options":["Me duele la garganta desde hace ayer.","Me duele la garganta desde ayer.","Me duele la garganta por ayer."],"answer":1,"explanation":"ayer 是起点，用 desde；desde hace 后接时长。"},{"prompt":"表达对某种药过敏，哪句正确？","options":["Tengo alergia de este medicamento.","Soy alergia a este medicamento.","Tengo alergia a este medicamento."],"answer":2,"explanation":"固定搭配为 tener alergia a，不用 ser 或介词 de。"}],"writingChecklist":["疼痛部位的单复数是否决定了 duele/duelen。","明确写出症状开始时间或持续时长。","把已知事实、不确定信息与需要的语言帮助说清楚。"],"speakingFollowups":["如果不记得药名，你会怎样说明？","工作人员问何时开始不适，你会怎么回答？","你需要对方写下哪项信息以便核对？"]}},{"id":"es-12","number":12,"title":"邀请与社交计划","goal":"发出邀请，接受或婉拒并协商安排。","level":"A2","stage":"beginner","grammar":{"title":"gustar 与 apetecer","explanation":"me gusta 后接单数名词或不定式；me gustan 后接复数。¿Te apetece…? 常用于询问是否想做某事。","examples":[{"text":"Me gusta pasear.","zh":"我喜欢散步。"},{"text":"¿Te apetece tomar algo?","zh":"你想喝点什么吗？"}]},"vocab":[{"head":"quedar","zh":"约见","example":"¿Quedamos el viernes?","exampleZh":"我们星期五见吗？","icon":"talk"},{"head":"invitar","zh":"邀请；请客","example":"Te invito a cenar.","exampleZh":"我请你吃晚饭。","icon":"talk"},{"head":"pasear","zh":"散步","example":"Me gusta pasear.","exampleZh":"我喜欢散步。","icon":"talk"},{"head":"plan","zh":"计划；活动安排","example":"Tengo otro plan.","exampleZh":"我另有安排。","icon":"talk"},{"head":"entrada","zh":"门票","example":"Compro dos entradas.","exampleZh":"我买两张门票。","icon":"talk"},{"head":"concierto","zh":"音乐会","example":"Vamos a un concierto.","exampleZh":"我们去听音乐会。","icon":"talk"},{"head":"libre","zh":"有空的","example":"Estoy libre el sábado.","exampleZh":"我星期六有空。","icon":"talk"},{"head":"juntos","zh":"一起","example":"Podemos ir juntos.","exampleZh":"我们可以一起去。","icon":"talk"},{"head":"quizá","zh":"也许","example":"Quizá vaya mañana.","exampleZh":"也许我明天去。","icon":"talk"},{"head":"otra vez","zh":"下次；再一次","example":"Podemos quedar otra vez.","exampleZh":"我们可以下次再约。","icon":"talk"}],"lessons":[{"id":"es-12-1","text":"¿Te apetece dar un paseo?","zh":"你想去散步吗？","tip":"apetecer 可接不定式短语。"},{"id":"es-12-2","text":"Me encantaría, gracias.","zh":"我很愿意，谢谢。","tip":"用于热情地接受邀请。"},{"id":"es-12-3","text":"Lo siento, ya tengo otro plan.","zh":"不好意思，我已经另有安排。","tip":"ya 强调已有安排。"},{"id":"es-12-4","text":"¿Y si quedamos el domingo?","zh":"我们改约星期日怎么样？","tip":"¿Y si…? 引出建议。"},{"id":"es-12-5","text":"¿Venís vosotros también?","zh":"你们也来吗？","tip":"venís 对应 vosotros。"},{"id":"es-12-6","text":"Te confirmo mañana por la mañana.","zh":"我明天早上向你确认。","tip":"可明确承诺回复的时间。"}],"dialogue":[{"speaker":"Sara","text":"¿Te apetece ir al cine el sábado?","zh":"你星期六想去看电影吗？"},{"speaker":"Mei","text":"Ese día no puedo. ¿Y el domingo?","zh":"那天我不行。星期日呢？"},{"speaker":"Sara","text":"El domingo estoy libre por la tarde.","zh":"星期日下午我有空。"},{"speaker":"Mei","text":"Perfecto. Miramos las películas mañana.","zh":"好极了。我们明天看看有什么电影。"}],"reading":{"title":"公园里的小聚会","text":"Sara propone una merienda en el parque para celebrar el final del curso. Invita a Mei y a varios compañeros. Mei quiere ir, pero el sábado por la mañana tiene que trabajar. Sara explica que la merienda será por la tarde, a las seis. Cada persona puede llevar algo sencillo para compartir. Mei acepta y ofrece llevar fruta. Antes de despedirse, pregunta qué harán si llueve. Sara promete confirmar el lugar por mensaje el viernes.","zh":"萨拉提议到公园吃下午茶，庆祝课程结束。她邀请梅和几位同学。梅想参加，但星期六早上要工作。萨拉解释说下午茶在下午六点。每个人可以带些简单食物分享。梅接受邀请，表示带水果。告别前，她问如果下雨怎么办。萨拉答应星期五发消息确认地点。"},"assessment":{"reading":{"title":"改到星期日的散步","text":"Diego invita a Paula a caminar por el río el sábado. Ella agradece la invitación, pero tiene una comida familiar ese día. Propone salir el domingo por la mañana. Diego acepta, aunque prefiere empezar después de las diez. Acuerdan verse a las diez y media junto al puente viejo. Paula llevará agua y Diego mirará la previsión del tiempo. Si hace demasiado calor, buscarán un recorrido con más sombra."},"questions":[{"prompt":"Paula 为什么星期六没空？","options":["要考试","有家庭聚餐","要上班"],"answer":1,"explanation":"她有 una comida familiar。"},{"prompt":"最终何时见面？","options":["星期日十点半","星期六十点半","星期日九点"],"answer":0,"explanation":"约定星期日早上十点半。"},{"prompt":"Diego 负责什么？","options":["买水","订餐","查看天气预报"],"answer":2,"explanation":"Diego mirará la previsión del tiempo。"},{"prompt":"太热时如何调整？","options":["取消所有计划","找更荫凉的路线","改去海边"],"answer":1,"explanation":"他们会寻找 sombra 更多的路线。"}],"writing":"写一条邀请和一条婉拒回复，回复中提出替代时间。","speaking":"协商周末活动：表达喜好、说明一个时间限制并约定确认方式。"},"story":{"id":"es-12","npc":"Lucía","place":"公园长椅","scene":"朋友邀请你周末见面。接受、改期和婉拒都可以好好说。","text":"¿Te apetece hacer algo juntos este fin de semana?","zh":"你想这周末一起做点什么吗？","icon":"talk"},"support":{"id":"es-12","pronunciation":{"focus":"重音区分单复数邀请","explanation":"venís 的 í 重读，区别于 vienes；quizá 重读末节，可与 quizás 交替使用。","examples":[{"text":"¿Venís a cenar?","zh":"你们来吃晚饭吗？"},{"text":"¿Te apetece un paseo?","zh":"你想散步吗？"}]},"grammarNotes":["apetecer 的事物作主语：me apetece un café / me apetecen unas tapas；不定式活动用单数 apetece。","gustar 同样以活动或事物为主语：me gusta pasear，不说 yo gusto pasear。","接受邀请可用 me encantaría；拒绝时说明已有安排并提出替代时间，比只说 no 更便于继续协商。"],"cultureNote":"quedar 在西班牙常指约好碰面；邀请有时只是先提出意向，最好继续确认日期、地点和人数。","vocabularyNotes":[{"head":"quedar","note":"quedar con alguien 是与某人见面；quedar en un sitio 是约在某地，介词承担不同信息。"},{"head":"entrada","note":"la entrada 可指门票或入口；comprar entradas 指买票，en la entrada 指在入口处。"},{"head":"juntos","note":"随参与者变化：全女性可说 juntas；不是表示固定时间的副词“同时”。"}],"transfer":[{"id":"es-12-transfer-1","prompt":"邀请朋友在天气好时骑车","text":"¿Te apetece ir en bici por el parque esta tarde?","zh":"你今天下午想在公园骑车吗？","explanation":"活动 ir en bici 作整体主语，因此用 apetece。"},{"id":"es-12-transfer-2","prompt":"接受野餐邀请并提出带食物","text":"Me encantaría ir; puedo llevar fruta para todos.","zh":"我很想去，可以给大家带水果。","explanation":"encantaría 用条件式柔和接受；llevar 指带去。"},{"id":"es-12-transfer-3","prompt":"婉拒当天但保留另约可能","text":"Hoy no puedo porque trabajo, pero el viernes estoy libre.","zh":"今天不行，因为我要工作，不过周五我有空。","explanation":"porque 说明原因，pero 引出可行的替代时间。"},{"id":"es-12-transfer-4","prompt":"提出把聚会换到下周","text":"¿Y si lo dejamos para la semana que viene?","zh":"要不我们留到下周，怎么样？","explanation":"¿Y si…? 后可用现在时提出建议；lo 指这次安排。"},{"id":"es-12-transfer-5","prompt":"询问邀请对象是否带孩子来","text":"¿Venís con los niños o vais a venir solos?","zh":"你们带孩子一起来，还是自己来？","explanation":"非正式复数 venís/vais；solos 表示无其他人陪同。"},{"id":"es-12-transfer-6","prompt":"承诺核对工作安排后当天答复","text":"Miro mi horario y te digo algo esta noche.","zh":"我看看自己的日程，今晚给你答复。","explanation":"现在时可表达近期已打算的行动；te 表答复对象。"}],"grammarCheck":[{"prompt":"表达想吃几份小吃，哪句正确？","options":["Me apetecen unas tapas.","Me apetece unas tapas.","Yo apetezco unas tapas."],"answer":0,"explanation":"复数 tapas 作主语，使用 apetecen；me 是感受者。"},{"prompt":"表达喜欢散步，哪句正确？","options":["Yo gusto pasear.","Me gusta pasear.","Me gustan pasear."],"answer":1,"explanation":"不定式活动作单数主语用 gusta。"},{"prompt":"表达与同事约在广场见，哪句正确？","options":["Quedo en mis compañeros con la plaza.","Quedo a mis compañeros de la plaza.","Quedo con mis compañeros en la plaza."],"answer":2,"explanation":"与人用 con，约定地点用 en。"}],"writingChecklist":["gustar/apetecer 的动词是否与事物或活动一致。","邀请是否说明时间、地点和活动。","不能参加时是否给出原因或可行替代时间。"],"speakingFollowups":["如果朋友还没确定人数，你会怎么追问？","你会提出什么不用提前买票的备选活动？","接受邀请后，你还需要核实哪项安排？"]}},{"id":"es-13","number":13,"title":"租房咨询","goal":"询问租金所含项目、住房状态和看房安排。","level":"B1","stage":"intermediate","grammar":{"title":"间接疑问句","explanation":"礼貌询问可用 Quería saber si… 或 ¿Podrías decirme…? 间接疑问词如 cuánto 仍保留重音符号。租约细节需向对方核实。","examples":[{"text":"Quería saber si los gastos están incluidos.","zh":"我想知道费用是否包含在内。"},{"text":"¿Podrías decirme cuánto cuesta al mes?","zh":"你能告诉我每月多少钱吗？"}]},"vocab":[{"head":"alquiler","zh":"租金；租赁","example":"El alquiler es mensual.","exampleZh":"租金按月支付。","icon":"talk"},{"head":"gastos","zh":"费用","example":"¿Qué gastos están incluidos?","exampleZh":"包含哪些费用？","icon":"talk"},{"head":"fianza","zh":"押金","example":"Quiero preguntar por la fianza.","exampleZh":"我想询问押金。","icon":"talk"},{"head":"contrato","zh":"合同","example":"Necesito leer el contrato.","exampleZh":"我需要阅读合同。","icon":"talk"},{"head":"amueblado","zh":"带家具的","example":"El piso está amueblado.","exampleZh":"公寓配有家具。","icon":"talk"},{"head":"calefacción","zh":"供暖","example":"¿Funciona la calefacción?","exampleZh":"供暖能用吗？","icon":"talk"},{"head":"humedad","zh":"潮湿","example":"Veo humedad en la pared.","exampleZh":"我看到墙面有潮湿痕迹。","icon":"talk"},{"head":"visita","zh":"参观；看房","example":"Concertamos una visita.","exampleZh":"我们约定看房。","icon":"talk"},{"head":"propietario","zh":"业主","example":"Voy a hablar con el propietario.","exampleZh":"我要和业主谈谈。","icon":"talk"},{"head":"disponible","zh":"可用的；可租的","example":"¿Sigue disponible el piso?","exampleZh":"公寓还可以租吗？","icon":"talk"}],"lessons":[{"id":"es-13-1","text":"¿Sigue disponible el piso del anuncio?","zh":"广告里的公寓还可以租吗？","tip":"sigue 后接形容词表示仍处于某状态。"},{"id":"es-13-2","text":"Quería saber qué gastos están incluidos.","zh":"我想知道包含哪些费用。","tip":"间接疑问
