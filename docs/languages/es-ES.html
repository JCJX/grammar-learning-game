to habitual. Le responden que la visita sigue prevista para el sábado, aunque empezará media hora más tarde. Clara comparte esta confirmación con el grupo.":"../language-audio/799ed2231b75d15877907ee1.mp3","¿Has comprobado esta información con la organización?":"../language-audio/5adc6a2c18cf60653612ecba.mp3","Voy a verificar el aviso.":"../language-audio/8c43fe17a24d267db24ad5db.mp3","¿Sigue siendo válido?":"../language-audio/27f23c4ce759262eaa7259b4.mp3","Me ha llegado un recordatorio de un taller que ya terminó.":"../language-audio/4a2fa1d1dc7807c35d8525a6.mp3","No sé si el lugar sigue siendo el mismo que en el cartel.":"../language-audio/92a415de2388e65865ce677f.mp3","Voy a mirar la fecha de publicación antes de compartir el enlace.":"../language-audio/2413a11bb958f861aec14d80.mp3","Escribiré a la dirección que usamos la última vez para confirmar los detalles.":"../language-audio/63ff5b5da1e1c4a97dcf98e0.mp3","Si trasladan la actividad, enviaré la nueva dirección a quienes se han apuntado.":"../language-audio/0a051af6043657d1470ebcc3.mp3","Guardaré el mensaje y la respuesta en la misma carpeta para encontrarlos después.":"../language-audio/119fcf907d16c11cb6b912c2.mp3","No sé si el aviso es válido.":"../language-audio/7a569bfb80c137f7c87b4bc1.mp3","Voy a reenviarla.":"../language-audio/ddf99be10911eeb4a79766a8.mp3","Si cambia la hora, avisaré.":"../language-audio/779b82b6966df5652c8eaa0e.mp3","Ayer compré este aparato y hoy no funciona.":"../language-audio/eab963e3dd5ee6baa3872318.mp3","He traído el recibo para explicar el problema.":"../language-audio/51ed0531857658461544ebef.mp3","¿Podría indicarme qué opciones hay en este caso?":"../language-audio/208429e213a886334b6540d1.mp3","No quiero decidir sin entender las condiciones.":"../language-audio/fd5e1474b7775e6ebe5b0192.mp3","Si necesitan revisarlo, ¿cuándo tendré una respuesta?":"../language-audio/b65b01b6bd9f145d2f2f9c5e.mp3","Por favor, anote el número de la consulta.":"../language-audio/6b8737352f49adb5da74adf9.mp3","Ayer compré este aparato y hoy no funciona. He traído el recibo para explicar el problema. ¿Podría indicarme qué opciones hay en este caso? No quiero decidir sin entender las condiciones. Si necesitan revisarlo, ¿cuándo tendré una respuesta? Por favor, anote el número de la consulta.":"../language-audio/c8109e97377b7a2bec10cda0.mp3","El lunes, Diego compró una lámpara para su habitación. Al montarla siguiendo las instrucciones, observó que una pieza no encajaba. El miércoles fue a la tienda con la pieza, unas fotos y el justificante de compra. La empleada escuchó su explicación y pidió consultar al servicio técnico antes de ofrecer una solución. Diego no recibió una promesa de devolución inmediata. Le dieron un número de consulta y le indicaron que esperara una respuesta por correo.":"../language-audio/45b31ef8ca8c36758606ceb9.mp3","¿Puedes contarme qué ha pasado con el producto?":"../language-audio/a73e40a9869f95b9164cbf9b.mp3","Ayer probé el aparato.":"../language-audio/22ea84d6d646415038c412fc.mp3","¿Podría revisarlo?":"../language-audio/0fa6aa3ec6f8bab42450ca1e.mp3","La lámpara llegó ayer y esta mañana no he conseguido encenderla.":"../language-audio/26d79bb4e258feee479d6da2.mp3","He guardado el pedido y unas fotos para mostrar lo que ocurre.":"../language-audio/d3f8b8f661fc852717a00949.mp3","¿Podría explicarme cómo se tramita una revisión y qué alternativas hay?":"../language-audio/0934db2341fc7de82d3bba46.mp3","Prefiero leer el presupuesto antes de autorizar la reparación.":"../language-audio/c8b6e6d6c6b3b1a949f454d2.mp3","Si dejo aquí la lámpara, ¿cuándo me comunicarán el resultado?":"../language-audio/959c0649dbf1cbd1d3fe3ff7.mp3","Por favor, anote la referencia y el teléfono de contacto en este papel.":"../language-audio/f34a993b3a0a66c1cf4c2815.mp3","Ayer compré una lámpara.":"../language-audio/94f90c385afa9087a707be4f.mp3","¿Podría explicarme las opciones?":"../language-audio/703c3eb9b7f52e4adfec7b28.mp3","Anote la referencia, por favor.":"../language-audio/b93f92a1540f8fd7e400b912.mp3","El mes pasado fui a visitar a una amiga.":"../language-audio/aeda53ef0d2d38154a5c3a52.mp3","Salí pronto porque no conocía bien el camino.":"../language-audio/886a1c6f43c30c148b16fa20.mp3","Cuando llegué a la estación, el tren ya había salido.":"../language-audio/262e3179d0e25289fb3105e4.mp3","Pedí ayuda para buscar otra conexión.":"../language-audio/b6e324d0268ebe20bf983f79.mp3","Avisé a mi amiga de que llegaría más tarde.":"../language-audio/f708b29e10dc0657e67e250e.mp3","Al final pudimos vernos y cambiamos el plan de la tarde.":"../language-audio/48c152205138fde532e3988d.mp3","El mes pasado fui a visitar a una amiga. Salí pronto porque no conocía bien el camino. Cuando llegué a la estación, el tren ya había salido. Pedí ayuda para buscar otra conexión. Avisé a mi amiga de que llegaría más tarde. Al final pudimos vernos y cambiamos el plan de la tarde.":"../language-audio/a4c1b8bf891917acef5f5d39.mp3","El sábado, Mei había quedado con Ana para visitar una exposición. Llovía mucho cuando salió de casa y el autobús tardó más de lo habitual. Mei llamó a Ana para avisarla del retraso. Mientras esperaba, consultó el horario de otra línea, pero al final llegó su autobús. Se encontraron cuarenta minutos después de la hora prevista. Como quedaba poco tiempo antes de comer, decidieron ver una sola sala y volver otro día para visitar el resto.":"../language-audio/e14426745f3dfed7498b06ce.mp3","¿Qué tal fue la excursión? ¿Hubo algún imprevisto?":"../language-audio/d268e81e30467a5cf3b253b4.mp3","Cuando llegué, ya había cerrado.":"../language-audio/5128043aa97eb0c0c409ecac.mp3","No conocía el barrio.":"../language-audio/0fa2ffb62e7e164534463dc0.mp3","El otoño pasado viajé a Bilbao para ver una exposición.":"../language-audio/324a9ec9852587757d5a48f0.mp3","Llovía mucho y no sabía dónde estaba la parada, así que pedí un taxi.":"../language-audio/f6d9249bc250db5094f9bf34.mp3","Cuando llegué al museo, ya había terminado el horario de entrada.":"../language-audio/fd36b6f5ddcb0257ce30d42a.mp3","Pregunté en recepción si podía volver a la mañana siguiente.":"../language-audio/a4ccbc2c2da7768fe4390a4c.mp3","Llamé a mis compañeros y les dije que me reuniría con ellos más tarde.":"../language-audio/524d3c17f567556dd8e1d023.mp3","Al final paseamos por la ría y descubrimos un mercado que no conocíamos.":"../language-audio/eb57f1ef471db7f3af428116.mp3","Llovía cuando salí.":"../language-audio/01a43befe91e041062829944.mp3","Cuando llegué, el tren ya había salido.":"../language-audio/c362dd57dd4e0b981fe46dff.mp3","Dije que llegaría más tarde.":"../language-audio/028c18d6c2c5da50edb27b80.mp3","Nos gustaría organizar una excursión el próximo domingo.":"../language-audio/2a14f215d60af84e54f8f3c3.mp3","Primero tenemos que acordar la hora de salida.":"../language-audio/5bfad2a2e1aeb517c6de50b3.mp3","Si hace mal tiempo, podemos elegir una actividad cubierta.":"../language-audio/babfc5b4d48c1c50f8289a4e.mp3","Prefiero confirmar el plan antes de comprar los billetes.":"../language-audio/8ed07622d1f3686ec7b7c42f.mp3","Quizá sea mejor dejar un rato libre por la tarde.":"../language-audio/71c8aa8c787ee30eca352025.mp3","Así podremos cambiar de idea sin tener que correr.":"../language-audio/7245d7d98897f008004b3fd7.mp3","Nos gustaría organizar una excursión el próximo domingo. Primero tenemos que acordar la hora de salida. Si hace mal tiempo, podemos elegir una actividad cubierta. Prefiero confirmar el plan antes de comprar los billetes. Quizá sea mejor dejar un rato libre por la tarde. Así podremos cambiar de idea sin tener que correr.":"../language-audio/6f9cb18ac827b8c7af8e6985.mp3","Marta y dos amigos quieren salir de Madrid el domingo. Comparan dos destinos a los que se puede llegar en tren. Uno tiene un parque junto al río; el otro ofrece un museo cerca de la estación. Todavía no han comprado los billetes porque esperan la previsión del tiempo. Si llueve, elegirán el museo. Uno de los amigos trabaja temprano el lunes, así que acuerdan regresar antes de las ocho de la tarde y confirmar el plan el viernes.":"../language-audio/ec9d2b28748a8f88368a0785.mp3","¿Y si llueve? ¿Tenemos otro plan?":"../language-audio/38c4d616bfe99a7f9118a407.mp3","Si llueve, iremos al cine.":"../language-audio/1fb28192016985b2c53e34be.mp3","Quizá podamos cambiarlo.":"../language-audio/11f710d09588b62dd566b1f6.mp3","Nos gustaría hacer una salida de un día sin gastar demasiado.":"../language-audio/4b2553b947e553a665064b7b.mp3","Antes de elegir destino, tenemos que saber a qué hora necesita volver cada uno.":"../language-audio/12dbad19b7c6ec24b24af0ea.mp3","Si hace demasiado calor, visitaremos una exposición en lugar de caminar.":"../language-audio/0fc5563e7aaf134d1c05e4db.mp3","Prefiero comprobar el horario antes de pagar las entradas.":"../language-audio/0ad8bc9907a17ae0c643690f.mp3","Quizá convenga reservar más tiempo para comer sin prisas.":"../language-audio/dd5c426412add88fe24feea5.mp3","Con ese margen podremos esperar al siguiente autobús si perdemos el primero.":"../language-audio/d9b1cb54a3604cba6d0370cd.mp3","Si llueve, cambiaremos de actividad.":"../language-audio/e0c070af9a09d81c3412c519.mp3","Quizá sea mejor salir temprano.":"../language-audio/4aec5e6326538cd69dc9eef6.mp3","Confirmamos antes de comprar.":"../language-audio/4a9d15d6ed536cceace5c62d.mp3","Comparto piso con dos personas.":"../language-audio/ca3b1f3965c8ff4b4c0a0b7e.mp3","Queremos acordar unas normas para las zonas comunes.":"../language-audio/efafe8d888882ae597049f16.mp3","Entre semana necesito acostarme bastante pronto.":"../language-audio/b8a28fd47108cd3428bb9465.mp3","Puedo limpiar la cocina si otra persona saca la basura.":"../language-audio/214ec6d0e76766996e64f531.mp3","Si hay un problema, prefiero hablarlo directamente.":"../language-audio/5b67bcc32d948c55b321f9de.mp3","Dentro de dos semanas podemos revisar el acuerdo.":"../language-audio/037279bf3caf485baee8b86f.mp3","Comparto piso con dos personas. Queremos acordar unas normas para las zonas comunes. Entre semana necesito acostarme bastante pronto. Puedo limpiar la cocina si otra persona saca la basura. Si hay un problema, prefiero hablarlo directamente. Dentro de dos semanas podemos revisar el acuerdo.":"../language-audio/6888d75ec6dc0a4defa6296b.mp3","Luis vive con Sara y Pablo en un piso compartido. Últimamente encuentran platos sucios en la cocina por la mañana. Luis propone hablar el domingo en vez de dejar una nota enfadada. Los tres acuerdan repartirse las tareas y no dejar la vajilla hasta el día siguiente. Sara trabaja por turnos y pide cierta flexibilidad con los horarios. Deciden probar el nuevo reparto durante dos semanas y volver a hablar si alguna tarea no queda bien organizada.":"../language-audio/2af86135578087795538f990.mp3","¿Cómo podemos repartir mejor las tareas de casa?":"../language-audio/94cba542875dcaea5d670da5.mp3","Las zonas comunes están limpias.":"../language-audio/215621653bd92d56d617dcf0.mp3","¿Lo hablamos esta tarde?":"../language-audio/04f0f815f86560b0942d53f1.mp3","Vivo con una compañera que trabaja de noche y tenemos horarios distintos.":"../language-audio/be1de599996e1c66ffaeb243.mp3","Podemos preparar juntos una lista para organizar el uso de la cocina.":"../language-audio/ad58620db5f0a9515d065f57.mp3","Como madrugo, os agradecería que bajarais la música después de las diez.":"../language-audio/50d2e8e19e77fe4a29907a2d.mp3","Yo friego los platos si tú tiendes la ropa después de poner la lavadora.":"../language-audio/670e5ae18a5de04f46e18981.mp3","Antes de dejar una nota, prefiero preguntar qué ha pasado esta noche.":"../language-audio/cfb2cc3bb94af0c2d37cafb8.mp3","Probamos este reparto hasta el domingo y luego vemos si hace falta cambiar algo.":"../language-audio/b132da82effde764be2e7bd9.mp3","Necesito acostarme temprano.":"../language-audio/9ab6c3ca8e43d156928a8628.mp3","Hablamos de las normas de la cocina.":"../language-audio/e42f37b49a83f4a906b89ef2.mp3","Si cocinas, friego los platos.":"../language-audio/8186c36b49c1c520fa1f4e38.mp3","Acabo de mudarme y tengo varias gestiones pendientes.":"../language-audio/af3cc2c91d47f3809670e3bb.mp3","Voy a hacer una lista y empezar por lo más urgente.":"../language-audio/1c038314700390ca6bf12e26.mp3","Necesito confirmar la dirección y la hora de la cita.":"../language-audio/833d2def48b20dea4640e8d2.mp3","Si no puedo asistir, avisaré con antelación.":"../language-audio/55036cf3f037753e4d12930f.mp3","Después de cada llamada guardaré una nota con la respuesta.":"../language-audio/7daa5288c538ad4335ab775e.mp3","Al terminar comprobaré qué asuntos siguen sin resolver.":"../language-audio/ca9906f1417fa1a315594b19.mp3","Acabo de mudarme y tengo varias gestiones pendientes. Voy a hacer una lista y empezar por lo más urgente. Necesito confirmar la dirección y la hora de la cita. Si no puedo asistir, avisaré con antelación. Después de cada llamada guardaré una nota con la respuesta. Al terminar comprobaré qué asuntos siguen sin resolver.":"../language-audio/0ff0cb26295fe4292faeea81.mp3","Lin se ha mudado a un barrio nuevo de Valencia. Tiene una cita para entregar documentos el miércoles y quiere apuntarse a un curso cerca de casa. Al leer la confirmación, ve que la atención será en un edificio distinto del habitual. Escribe para comprobar la dirección y prepara los documentos que le indican. Después llama a una escuela, pero el grupo que prefiere está completo. Pide información sobre otro horario y anota que todavía espera esa respuesta.":"../language-audio/638df3d94672845d679d0b9e.mp3","¿Cuál de estas gestiones necesitas hacer primero?":"../language-audio/46c9822956d1376dae61eccc.mp3","Comprobaré qué falta.":"../language-audio/88d5ed73c53abfc153a2fbd4.mp3","Acabo de llegar al barrio.":"../language-audio/8adb90c1cb298e174b8f1d15.mp3","Acabo de empezar en otra oficina y aún tengo varios asuntos por organizar.":"../language-audio/bb454454f5c4deb830a13813.mp3","Voy a ordenar las tareas por fecha y resolver primero las que vencen antes.":"../language-audio/cbf6b1cf069684f71e192c6f.mp3","Necesito saber si la reunión es en línea y qué documentos debo tener preparados.":"../language-audio/9d20a9447b7fbb23a4f3078d.mp3","Si me coincide con el trabajo, pediré otra franja horaria cuanto antes.":"../language-audio/ad50972d6d0bf41e9c40954e.mp3","Después de hablar con cada persona, anotaré su nombre y el siguiente paso.":"../language-audio/e9495dcec35d86b4275fc935.mp3","Al acabar, revisaré qué solicitudes siguen sin respuesta y cuándo debo volver a preguntar.":"../language-audio/812462e4a49834be43ce422e.mp3","Acabo de enviar el correo.":"../language-audio/d2f504fe7b750992feecbf4a.mp3","Empiezo por lo más urgente.":"../language-audio/34b66281bd8e516dd3ed14c2.mp3","Al terminar reviso qué solicitudes siguen sin respuesta.":"../language-audio/d380bad5f70d986f042b9bc9.mp3","El sábado por la mañana, Clara entra en una tienda de su barrio. Busca fruta para una merienda con cuatro amigos. Compra seis manzanas y un kilo de naranjas, pero no compra pan porque ya tiene en casa. Las manzanas cuestan dos euros y las naranjas, tres. Clara lleva una bolsa grande. Paga con tarjeta y pide el tique. Después va a casa para preparar la mesa.":"../language-audio/207c46c692e393430264f013.mp3","Hola, soy Raquel, de la clase de español. Hoy quedamos en la cafetería Azul a las cinco y media. Está en la calle Norte, número ocho. Quiero tomar un té y una tostada. Si no encuentras la cafetería, puedes escribir a mi móvil. Mi amiga llega a las seis. Hasta luego.":"../language-audio/bce4cf1efeaa9b78710831f1.mp3","Diego pasa dos noches en un alojamiento de Zaragoza. El domingo quiere visitar a una amiga al otro lado de la ciudad. En recepción le explican que el autobús habitual no pasa por su calle esa mañana. Puede caminar diez minutos hasta otra parada o tomar el tranvía cerca del mercado. Diego elige caminar porque hace buen tiempo. Antes de salir, deja una mochila en recepción y pregunta hasta qué hora puede recogerla.":"../language-audio/d7bb812e2f77dc8a7b6677d7.mp3","Hola, Julia. Esta tarde no puedo ir al concierto contigo porque tengo que terminar un trabajo. Lo siento mucho. Mi entrada está en el correo que te envié ayer; puedes invitar a otra persona. ¿Te apetece que nos veamos el domingo para pasear? Estoy libre después de comer. Dime si prefieres ir al parque o al río.":"../language-audio/c21adc1374d2b06e1ee1e2f9.mp3","En su nuevo trabajo, Nuria debe preparar una presentación con datos de dos departamentos. Ya ha recibido las cifras de ventas, pero todavía espera la información de gastos. La reunión está prevista para el jueves. Como quiere comprobar todo con tiempo, escribe a sus compañeros y propone recibir lo que falta el martes por la tarde. También ofrece enviarles un borrador el miércoles. Si los datos no llegan, explicará a su responsable qué parte sigue pendiente antes de cerrar la versión final.":"../language-audio/5374b7d3c1f56cdfbbc885fc.mp3","Buenos días. Llamo por la visita del técnico que tenemos prevista para mañana. Me han cambiado el horario de trabajo y no estaré en casa hasta las cuatro. ¿Sería posible venir después o cambiar la visita al viernes por la mañana? Antes de confirmar, también quería saber si la revisión incluye el desplazamiento. Pueden responder al correo que figura en la solicitud. Gracias.":"../language-audio/115947f0577c35cfadbb0be9.mp3","El grupo de lectura iba a reunirse el viernes en una biblioteca, pero recibió un mensaje que anunciaba otro lugar. Antes de reenviarlo, Elena consultó la página del grupo y escribió a la coordinadora. La respuesta aclaró que el mensaje correspondía a una actividad anterior. La reunión seguía en la biblioteca, aunque empezaría media hora más tarde por una obra en la entrada. Elena informó al resto, guardó la confirmación y propuso esperar juntos fuera para entrar por la puerta lateral.":"../language-audio/2302f2be10c7e49d7fe95072.mp3","Hola a todos. Después de probar el reparto de tareas durante una semana, creo que debemos cambiar dos cosas. La cocina ha quedado limpia, pero nadie ha sacado las bolsas del reciclaje. Además, el miércoles puse la lavadora muy tarde y molesté a Marta; lo siento. Propongo ocuparme del reciclaje y usar la lavadora antes de las nueve. ¿Podemos hablarlo el domingo y revisar cómo funciona dentro de quince días?":"../language-audio/b8eeb8284bfa160a234d2c87.mp3"};</script><script>(function(root){'use strict';

function lesson(id,c,options={}){const info=L.lesson(C,id);c=info.chapter;const useStory=!options.stages&&!!window.ContinentStory,paint=(title,body,step)=>useStory?window.ContinentStory.frame(info,title,body,step):frame(title,body);const list=options.stages||L.STAGES;let index=options.stages?0:Math.max(0,list.findIndex(k=>!D().stages[id]?.[k]?.correct));const render=()=>{if(index>=list.length){if(options.done){options.done();return}paint('一小节完成','<section class="card wide"><h2>把句子放回生活中。</h2><p>试着不看屏幕，用自己的细节再说一次。这次训练不自动增加词汇掌握次数。</p><button id="lessonReturn">返回本章</button></section>',6);$('#lessonReturn').onclick=()=>A.openChapter(c.id);return}const stage=list[index],target=L.expected(C,id,stage),task=stage==='transfer'?info.transfer:info.lesson;let assisted=false,chosen=[],submitted=false,choices=[],tiles=[];if(stage==='meaning'||stage==='listening')choices=shuffle([target,...shuffle(c.lessons.filter(l=>l.id!==id)).slice(0,2).map(l=>l.zh)]);if(stage==='order'||stage==='transfer')tiles=shuffle(L.tokens(target).map((text,i)=>({text,id:i})));

function runWords(queue){let index=0,passed=0;const map=new Map(C.chapters.flatMap(c=>c.vocab).map(v=>[v.head,v]));const next=()=>{if(index>=queue.length){frame('本轮回忆完成','<article class="card wide"><h2>'+passed+'/'+queue.length+' 词两项都正确</h2><p>拼写、词义分别记录。至少间隔24小时的独立正确才增加该项次数：3次掌握、6次熟练、10次牢记。口语识别不参与。</p><button id="roundPlan">返回今日计划</button></article>');$('#roundPlan').onclick=daily;return}const v=queue[index],options=shuffle([v.zh,...shuffle([...new Set([...map.values()].map(v=>v.zh))].filter(x=>x!==v.zh)).slice(0,3)]);let helped=false,submitted=false;frame('听音拼写与词义','<article class="card wide"><small>第 '+(index+1)+' / '+queue.length+' 词</small><div class="cue">'+WordCues.svg(v.head,v.zh,v.icon)+'</div><h2>听单词，写下来，再选词义。</h2>'+A.audioButtons(v.head)+'<p class="muted">简图只作联想提示。重音、变音符号及德语名词、句首大小写有意义。</p><form id="detailWordForm"><input id="quizSpelling" lang="'+C.id+'" aria-label="听音拼写" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required maxlength="250">'+accents('quizSpelling')+options.map((x,i)=>'<label class="option"><input type="radio" name="meaning" required value="'+i+'">'+H(x)+'</label>').join('')+'<div class="row"><button class="primary">提交这个词</button><button type="button" id="wordHelp">提示（不计通过）</button></div></form><div id="wordFeedback"></div><button id="wordContinue" hidden>下一个词 →</button></article>');bindAccents();$('#wordHelp').onclick=()=>{helped=true;$('#wordFeedback').textContent=v.head+' · '+v.zh};$('#detailWordForm').onsubmit=e=>{e.preventDefault();if(submitted)return;submitted=true;const spelling=L.equal($('#quizSpelling').value,v.head,C.id),meaning=options[+new FormData(e.target).get('meaning')]===v.zh;L.observeWord(S(),C,v,'spelling',spelling,{assisted:helped});L.observeWord(S(),C,v,'meaning',meaning,{assisted:helped});if(spelling&&meaning&&!helped)passed++;A.save();$('#wordFeedback').innerHTML='<div class="feedback"><b>'+H(v.head)+' · '+H(v.zh)+'</b><p>拼写 '+(spelling?'✓':'需复练')+' · 词义 '+(meaning?'✓':'需复练')+(helped? function wrong(){L.syncLegacy(S(),C);const errors=Object.values(D().errors).sort((a,b)=>Number(a.stable)-Number(b.stable)||a.due-b.due);frame('统一错题本与延迟复练','<section class="card wide"><p>汇总句子、听音、词汇、语法辨析、阅读与阶段测评的错误。错因按练习类型初步标记，可自行更正。先理解，再回忆；相隔1、7、21天的正确复练用于观察保持，不是正式水平认证。</p><label>显示<select id="errorFilter"><option value="active">待巩固</option><option value="all">全部记录</option><option value="due">到期延迟复练</option><option value="stable">复练稳定</option></select></label><div id="errorList"></div></section>');const draw=()=>{const filter=$('#errorFilter').value;$('#errorList').innerHTML=errors.filter(e=>filter==='all'||filter==='active'&&!e.stable||filter==='stable'&&e.stable||filter==='due'&&!e.stable&&e.due<=Date.now()).map(e=>'<article class="error-item"><small>'+H(e.source)+' · '+(e.stable?'复练稳定':e.validations+'/3 次延迟通过')+'</small><h3>'+H(e.prompt)+'</h3><details><summary>错因与理解</summary><p>此前回答：'+H(e.response||'旧版未记录具体作答')+'</p><p>参考：'+H(e.answer)+'</p><p>'+H(e.explanation)+'</p></details><label>我的错因<select data-cause="'+H(e.id)+'">'+Object.entries(L.CAUSES).map(([k,v])=>'<option value="'+k+'" '+(e.cause===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><p>建议延迟复练：'+new Date(e.due).toLocaleString()+'。到期前可以训练，但不计延迟通过。</p><button data-error="'+H(e.id)+'">理解与变式复练</button></article>').join('')||'<p>当前没有符合筛选的错题。</p>';bindErrors();document.querySelectorAll('[data-cause]').forEach(e=>e.onchange=()=>{D().errors[e.dataset.cause].cause=e.value;A.save()})};$('#errorFilter').onchange=draw;draw()}

function repair(id){const e=D().errors[id];if(!e)return;const c=C.chapters.find(c=>c.id===e.chapter);let viewed=false;frame('理解与延迟回忆','<article class="card wide"><h2>'+H(e.prompt)+'</h2><p>如果已到延迟复练日期，先独立作答；打开下面的答案讲解会标记本轮使用提示。</p><details id="repairExplain"><summary>先查看错因与参考答案（本轮不计独立通过）</summary><p>'+H(e.answer)+'</p><div class="feedback">'+H(e.explanation)+'</div></details><label for="errorNote">用自己的话记录理解或疑问</label><textarea id="errorNote" maxlength="2000">'+H(e.note)+'</textarea><p class="muted">到期前答对只计训练。延迟复练可能包含原题，再接章节变式；熟题不会被说成陌生能力证据。</p><button class="primary" id="repairStart">开始独立回忆</button></article>');$('#repairExplain').ontoggle=()=>{if($('#repairExplain')?.open)viewed=true};$('#repairStart').onclick=()=>{e.note=$('#errorNote').value;A.save();if(e.head&&e.skill){repairWord(id,viewed);return}let q=null,context='',listen=false;const parts=id.split(':');if(id.startsWith('grammar:'))q=c.support.grammarCheck[+parts.at(-1)];if(id.startsWith('checkpoint:')){const b=C.checkpoints.find(b=>b.id===parts[1]),i=+parts.at(-1);if(b){q=[...b.reading.questions,...b.listening.questions][i];listen=i>=4;context=listen?b.listening.text:b.reading.text}}if(id.startsWith('legacy:')){const m=id.match(/-q(\d+)$/);if(m){q=c.assessment.questions[+m[1]];context=c.assessment.reading.text}}
const complete=()=>repairComplete(id,viewed),fail=()=>{L.retention(S(),id,false);A.save()},variant=()=>{const chosen=e.lesson?L.lesson(C,e.lesson):L.lesson(C,c.lessons[e.validations%c.lessons.length].id);lesson(chosen.lesson.id,c,{stages:[e.validations%2===0?'transfer':'listening'],onFailure:fail,done:complete})};
if(!q){variant();return}frame('原题回忆与章节迁移','<article class="card wide"><p class="muted">本题已见过，用于延迟回忆，不是陌生测评。</p>'+(context?(listen?A.audioButtons(context):'<p class="target">'+H(context)+'</p>'):'')+'<h2>'+H(q.prompt)+'</h2><form id="repairQuestion">'+shuffle(q.options.map((text,i)=>({text,i}))).map(o=>'<label class="option"><input required type="radio" name="r" value="'+o.i+'">'+H(o.text)+'</label>').join('')+'<button class="primary">提交回忆</button></form><div id="repairFeedback"></div><button id="repairVariant" hidden>继续本章变式</button></article>');$('#repairQuestion').onsubmit=event=>{event.preventDefault();const ok=+new FormData(event.target).get('r')===q.answer;if(!ok)fail();$('#repairFeedback').innerHTML='<div class="feedback">'+(ok?'✓ 回忆正确':'↻ 需要重新理解')+'<p>'+H(q.options[q.answer])+'</p><p>'+H(q.explanation)+'</p></div>';event.target.querySelectorAll('input,button').forEach(b=>b.disabled=true);$('#repairVariant').hidden=false;$('#repairVariant').onclick=variant}}}
function repairComplete(id,assisted){const r=L.retention(S(),id,true,{assisted});A.save();frame('复练记录已保存','<article class="card wide"><p>'+(r.counted?'本次计入延迟复练，当前 '+r.error.validations+'/3 次。':assisted?'本轮看过讲解，记为提示练习；下次独立回忆再验证。':'本次为到期前训练，未增加延迟通过次数。')+'</p><p>下一次建议：'+new Date(r.error.due).toLocaleString()+'。这里记录的是复练保持，不自动证明整体语言水平。</p><button id="repairBack">返回错题本</button></article>');$('#repairBack').onclick=wrong}
function repairWord(id,viewed){const e=D().errors[id],v=C.chapters.flatMap(c=>c.vocab).find(v=>v.head===e.head);if(!v){wrong();return}const options=shuffle([v.zh,...shuffle([...new Set(C.chapters.flatMap(c=>c.vocab).map(v=>v.zh))].filter(x=>x!==v.zh)).slice(0,3)]);frame('词汇独立回忆','<article class="card wide"><p>'+H(v.exampleZh)+'</p>'+A.audioButtons(v.head)+'<form id="repairWordForm">'+(e.skill==='spelling'?'<input required id="repairSpelling" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="词汇拼写">'+accents('repairSpelling'):options.map((x,i)=>'<label class="option"><input type="radio" name="r" required value="'+i+'">'+H(x)+'</label>').join(''))+'<button class="primary">提交词汇回忆</button></form><div id="repairWordFeedback"></div><button id="repairWordContinue" hidden>查看复练记录</button></article>');bindAccents();$('#repairWordForm').onsubmit=event=>{event.preventDefault();const ok=e.skill==='spelling'?L.equal($('#repairSpelling').value,v.head,C.id):options[+new FormData(event.target).get('r')]===v.zh;L.observeWord(S(),C,v,e.skill,ok,{assisted:viewed});if(!ok)L.retention(S(),id,false);A.save();$('#repairWordFeedback').innerHTML='<div class="feedback">'+(ok?'✓':'↻')+' '+H(v.head)+' · '+H(v.zh)+'<p>'+H(v.example)+'<br>'+H(v.exampleZh)+'</p></div>';event.target.querySelectorAll('input,button').forEach(b=>b.disabled=true);$('#repairWordContinue').hidden=false;$('#repairWordContinue').onclick=()=>repairComplete(id,viewed)}}
function output(c){const sup=c.support,container=document.createElement('article');container.className='card support-card';const versions=D().revisions[c.id]||[],spoken=D().speaking[c.id]||{};container.innerHTML='<h2>写作版本与修订</h2>'+accents('draft')+'<p>系统提供过程记录和自检，不根据词数、关键词或自评授予等级。</p><fieldset><legend>本章自检</legend>'+sup.writingChecklist.map((x,i)=>'<label class="option"><input type="checkbox" data-writing-check="'+i+'">'+H(x)+'</label>').join('')+'</fieldset><p class="feedback">人工评阅建议分别检查：任务是否完成、组织是否清楚、语言是否准确、语域是否适合对象。口语另看可理解性、连贯性、互动回应与澄清修复。自评和伙伴反馈用于改进，不授予等级。</p><label>反馈来源<select id="reviewRole"><option value="self">自我检查</option><option value="partner">学习伙伴</option><option value="teacher">教师／评阅者（自行填写身份）</option></select></label><input id="reviewerName" type="text" maxlength="80" aria-label="反馈者称呼" placeholder="反馈者称呼（可选）"><label for="revisionNote">反馈／修改理由</label><textarea id="revisionNote" maxlength="4000" placeholder="记录伙伴、教师反馈，或说明这一版改了什么。"></textarea><button id="saveRevision">保存当前草稿为一个版本</button><div id="revisionStatus" role="status"></div><div id="revisionHistory">'+versions.map((r,i)=>'<details><summary>版本 '+(i+1)+' · '+new Date(r.date).toLocaleString()+' · '+L.tokens(r.text).length+' 个空格分隔片段</summary><p class="target">'+H(r.text)+'</p><p>'+H(r.note)+'</p><small>反馈来源：'+H({self:'自评',partner:'伙伴',teacher:'自行登记的教师／评阅者'}[r.role||'self'])+' '+H(r.reviewer||'')+'</small></details>').join('')+'</div><h2>口语追问与表达记录</h2><ol>'+sup.speakingFollowups.map(x=>'<li>'+H(x)+'</li>').join('')+'</ol><label for="speakingNote">记录卡住的地方、伙伴回应和下一次改进</label><textarea id="speakingNote" maxlength="10000">'+H(spoken.note||'')+'</textarea><label class="option"><input type="checkbox" id="spokenPracticed" '+(spoken.practiced?'checked':'')+'>我已实际练习并回听／和伙伴交流（自报记录，非能力评分）</label><div class="row"><button id="saveSpeaking">保存口语记录</button><button id="exportRecording">导出录音文件</button><button id="exportRecordingJson">导出录音JSON备份</button><label>恢复录音备份<input id="restoreRecording" type="file" accept="application/json,.json"></label></div><div id="restoredAudio"></div><p class="muted">录音备份单独保存，学习进度JSON不含声音。三语暂无本地自动识别；识别失败不会影响词汇分级。</p>';$('#chapterBody').append(container);$('#saveRevision').onclick=()=>{const text=$('#draft').value.trim();if(!text){$('#revisionStatus').textContent='请先在上方写作框填写草稿。';return}const list=D().revisions[c.id]||=[];if(list.at(-1)?.text===text&&list.at(-1)?.note===$('#revisionNote').value){$('#revisionStatus').textContent='与上一个版本相同，无需重复保存。';return}list.push({text,date:Date.now(),note:$('#revisionNote').value,role:$('#reviewRole').value,reviewer:$('#reviewerName').value,checks:[...document.querySelectorAll('[data-writing-check]:checked')].map(x=>+x.dataset.writingCheck)});D().revisions[c.id]=list.slice(-10);S().drafts[c.id]=text;A.save();$('#revisionStatus').textContent='版本已保存。每章最多保留最近10版；请定期导出进度。'};$('#saveSpeaking').onclick=()=>{D().speaking[c.id]={note:$('#speakingNote').value,practiced:$('#spokenPracticed').checked,date:Date.now()};A.save();$('#notice').textContent='口语过程记录已保存；没有自动评定语言等级。'};$('#exportRecordingJson').onclick=exportRecording;$('#exportRecording').onclick=async()=>{const blob=A.latestRecording;if(!blob){$('#notice').textContent='请先录音或导入设备录音。';return}try{const type=blob.type,extension=type.includes('wav')?'wav':type.includes('mpeg')?'mp3':type.includes('ogg')?'ogg':type.includes('mp4')?'m4a':'webm';await window.QuestLocalExport.audio('语言大陆-'+C.id+'-'+Date.now()+'.'+extension,blob)}catch(e){$('#notice').textContent='导出失败：'+e.message}};$('#restoreRecording').onchange=restoreRecording;bindAccents()}
async function exportRecording(){const blob=A.latestRecording;if(!blob){$('#notice').textContent='请先录音或导入设备录音，再导出。';return}if(blob.size>15000000){$('#notice').textContent='录音过大，请缩短至120秒以内。';return}const bytes=new Uint8Array(await blob.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));download('语言大陆-'+C.id+'-录音.json',JSON.stringify({type:'continent-recording',version:1,locale:C.id,mime:blob.type,date:Date.now(),data:btoa(binary)}))}
function download(name,text){if(window.QuestLocalExport?.text){try{window.QuestLocalExport.text(name,text)}catch(e){$('#notice').textContent=e.message}return}if(window.QuestNative?.saveText){window.QuestNative.saveText(name,text);return}const u=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
async function restoreRecording(e){try{const file=e.target.files[0];if(!file||file.size>21000000)throw Error('请选择21MB以内的本应用录音备份');const x=JSON.parse(await file.text());if(x.type!=='continent-recording'||x.version!==1||x.locale!==C.id||!/^audio\//.test(x.mime)||typeof x.data!=='string')throw Error('录音格式或语言不匹配');const raw=atob(x.data);if(raw.length>15000000)throw Error('录音过大');const blob=new Blob([Uint8Array.from(raw,c=>c.charCodeAt(0))],{type:x.mime});A.latestRecording=blob;const u=URL.createObjectURL(blob);$('#restoredAudio').innerHTML='<audio controls></audio>';$('#restoredAudio audio').src=u;$('#restoredAudio audio').onloadeddata=()=>URL.revokeObjectURL(u)}catch(e){$('#notice').textContent='恢复录音失败：'+e.message}}

function checkpoint(id){const bank=C.checkpoints.find(b=>b.id===id);let fresh=!D().exposures[id+':reading']&&!D().exposures[id+':listening'],assisted=false,submitted=false,heard=false;const started=Date.now();L.expose(S(),id+':reading',started);L.expose(S(),id+':listening',started);A.save();const qs=[...bank.reading.questions,...bank.listening.questions];frame('阶段综合测评 · '+bank.target,'<article class="card wide"><p>'+(fresh?'本机首次接触本组材料。':'本组材料已接触过，本次记为熟题复测。')+' 暂不查看翻译或笔记，先完成客观题。可随时离开，离开也保留“已暴露”标记。</p><h2>阅读</h2><p class="target" lang="'+C.id+'">'+H(bank.reading.text)+'</p><h2>听力</h2>'+A.audioButtons(bank.listening.text)+'<button id="showTranscript">需要文字脚本（将标记使用提示）</button><div id="transcript"></div><form id="checkpointForm">'+qs.map((q,i)=>'<fieldset><legend>'+(i<4?'阅读':'听力')+' '+(i%4+1)+' · '+H(q.prompt)+'</legend>'+shuffle(q.options.map((text,j)=>({text,j}))).map(o=>'<label class="option"><input required type="radio" name="s'+i+'" value="'+o.j+'">'+H(o.text)+'</label>').join('')+'</fieldset>').join('')+'<button class="primary">提交客观题</button></form><div id="checkpointFeedback"></div><h2>写作与互动</h2><p>'+H(bank.writing)+'</p><p>'+H(bank.speaking)+'</p><p class="muted">请在对应章节的写作与口语页保存输出及反馈。客观题通过不替代这两项能力证据。</p><button id="stageBack">返回阶段记录</button></article>');$('#stageBack').onclick=checkpoints;document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=async()=>{const player=await A.play(b.dataset.audio,Number(b.dataset.rate)||1);player?.addEventListener?.('ended',()=>{heard=true;$('#notice').textContent='已完整播放一次听力，可提交客观题。'},{once:true})});$('#showTranscript').onclick=()=>{assisted=true;$('#transcript').innerHTML='<p class="target">'+H(bank.listening.text)+'</p><p class="muted">本次已标记使用文字提示。</p>'};$('#checkpointForm').onsubmit=e=>{e.preventDefault();if(submitted)return;if(!heard){$('#notice').textContent='请先完整播放至少一次听力音频，再提交本组客观题。';return}submitted=true;const answers=qs.map((_,i)=>+new FormData(e.target).get('s'+i)),bits=answers.map((a,i)=>a===qs[i].answer),record={id,date:Date.now(),started,answers,reading:bits.slice(0,4).filter(Boolean).length,listening:bits.slice(4).filter(Boolean).length,fresh,assisted,heard};D().checkpoints.push(record);D().checkpoints=D().checkpoints.slice(-100);qs.forEach((q,i)=>{if(!bits[i])L.error(S(),'checkpoint:'+id+':'+i,{chapter:C.chapters[bank.afterChapter-1].id,source:'阶段综合测评',cause:i<4?'inference':'listening',prompt:q.prompt,answer:q.options[q.answer],response:q.options[answers[i]],explanation:q.explanation})});A.save();$('#checkpointFeedback').innerHTML='<div class="feedback"><h2>阅读 '+record.reading+'/4 · 听力 '+record.listening+'/4</h2><p>'+(fresh&&!assisted?'首次无文字提示记录。':'本次为熟题或使用提示，不作为新的陌生材料表现。')+'</p>'+qs.map((q,i)=>'<p>'+(bits[i]?'✓':'↻')+' '+H(q.prompt)+'：'+H(q.options[q.answer])+'<br>'+H(q.explanation)+'</p>').join('')+'<p>结果只描述这组材料的客观题表现，不授予 CEFR 或雅思等级。</p></div>';e.target.querySelectorAll('input,button').forEach(b=>b.disabled=true)}}

(function(){'use strict';const KEY='twin-islands-grammar-summary-v1';let carried=null;
function valid(x){if(!x||typeof x!=='object')return null;for(const k of ['chapters','completedChapters','missions','completedMissions','questions','solvedQuestions','independentQuestions','wrong'])if(!Number.isInteger(x[k])||x[k]<0||x[k]>100000)return null;if(x.completedChapters>x.chapters||x.completedMissions>x.missions||x.solvedQuestions>x.questions||x.independentQuestions>x.solvedQuestions)return null;return x}

(function(){'use strict';const KEY='continent-summaries-v1',ids=['english','grammar','pt-PT','es-ES','de-DE'];let summaries={};
function clean(x){if(!x||typeof x!=='object')return null;const out={};for(const k of ['chapters','completed','lessons','totalLessons','studied','mastered','fluent','remembered','updated','deepCompleted','completedStages','totalStages']){const n=Number(x[k]||0);if(!Number.isFinite(n)||n<0||n>1e14)return null;out[k]=Math.floor(n)}if(out.completed>out.chapters||out.lessons>out.totalLessons||out.deepCompleted>out.chapters||out.completedStages>out.totalStages)return null;return out}

function persist(){try{localStorage.setItem(KEY,JSON.stringify(summaries))}catch{}document.querySelectorAll('[data-continent-progress]').forEach(el=>{const id=el.dataset.continentProgress,v=summaries[id];el.textContent=v&&v.totalStages?v.deepCompleted+' / '+v.chapters+' 章精练 · '+v.completedStages+' / '+v.totalStages+' 步':v?v.completed+' / '+v.chapters+' 章 · '+v.lessons+' / '+v.totalLessons+(id==='grammar'?' 个任务':' 个句子任务'):'尚未开始 · 进度保存在本机'})}
