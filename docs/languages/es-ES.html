中的 qué 保留重音。"},{"id":"es-13-3","text":"¿Podríamos visitarlo el jueves?","zh":"我们能星期四看房吗？","tip":"条件式可使请求较委婉。"},{"id":"es-13-4","text":"¿La calefacción funciona en todas las habitaciones?","zh":"每间房的供暖都能用吗？","tip":"todas 与复数名词呼应。"},{"id":"es-13-5","text":"Antes de decidir, necesito leer las condiciones.","zh":"决定前，我需要阅读条件。","tip":"antes de 后接不定式。"},{"id":"es-13-6","text":"¿Me lo podéis enviar por escrito?","zh":"你们能以书面形式发给我吗？","tip":"por escrito 表示书面形式。"}],"dialogue":[{"speaker":"Mei","text":"Quería saber si los gastos están incluidos.","zh":"我想知道费用是否包含在内。"},{"speaker":"Agente","text":"El anuncio incluye la comunidad, pero no los suministros.","zh":"广告价格包含物业费用，但不含水电等。"},{"speaker":"Mei","text":"¿Podrías enviarme el detalle por escrito?","zh":"你能把明细书面发给我吗？"},{"speaker":"Agente","text":"Sí, y podemos concertar una visita.","zh":"可以，我们也可以约看房。"}],"reading":{"title":"看房前的问题","text":"Mei busca un piso más cerca del trabajo. Encuentra un anuncio con buenas fotos, pero no explica todos los gastos. Antes de concertar una visita, escribe al anunciante para preguntar por el alquiler mensual, los suministros y los muebles. También quiere saber si la calefacción funciona y cuándo estaría disponible la vivienda. Durante la visita tomará notas y revisará las condiciones con calma. No quiere decidir solo por las fotos ni por la cercanía al metro.","zh":"梅想找一套离工作地点更近的公寓。她看到一则照片不错的广告，但费用说明不全。约看房前，她给广告发布者写信，询问月租、水电等费用及家具情况。她也想知道供暖能否使用，以及住房什么时候可以入住。看房时她会记笔记，慢慢查看条件。她不想仅凭照片或离地铁近就作决定。"},"assessment":{"reading":{"title":"两套住房的比较","text":"Raúl visita dos pisos el mismo día. El primero está cerca de su oficina, pero tiene poca luz y no dispone de ascensor. El segundo queda más lejos, aunque es luminoso y tiene una habitación extra para trabajar. En ambos casos pregunta qué gastos se pagan aparte. La propietaria del segundo piso promete enviarle las condiciones por correo. Raúl decide esperar a leerlas antes de dar una respuesta, aunque le ha gustado mucho la vivienda."},"questions":[{"prompt":"第一套住房有什么问题？","options":["光线少且无电梯","离办公室远","没有卧室"],"answer":0,"explanation":"第一套 poca luz、没有 ascensor。"},{"prompt":"第二套的额外房间可用于什么？","options":["储存自行车","工作","出租给游客"],"answer":1,"explanation":"文中说 para trabajar。"},{"prompt":"他对两套都问了什么？","options":["邻居年龄","装修年份","哪些费用另付"],"answer":2,"explanation":"他问 qué gastos se pagan aparte。"},{"prompt":"Raúl 何时决定回复？","options":["看完照片后","读完条件后","搬进去后"],"answer":1,"explanation":"他说要先读条件再答复。"}],"writing":"写一封租房咨询，提出四个具体问题，并请求书面费用明细。","speaking":"比较两套虚构住房，说明你还需要核实什么才能决定。"},"story":{"id":"es-13","npc":"Ana","place":"看房现场","scene":"房子看上去合适。作决定前，先核对费用和自己不理解的条件。","text":"¿Qué te gustaría saber sobre el piso?","zh":"关于这套房，你想了解什么？","icon":"home"},"support":{"id":"es-13","pronunciation":{"focus":"重音词与连读","explanation":"alquiler 重读 ler，calefacción 重读 ción；gastos incluidos 连读时仍要保留两词边界。","examples":[{"text":"¿Está amueblado?","zh":"带家具吗？"},{"text":"¿Qué gastos incluye?","zh":"包含哪些费用？"}]},"grammarNotes":["间接问句用陈述结构：Quería saber qué gastos incluye el alquiler；qué、cuánto、cuándo 在间接疑问中仍带重音。","saber si 表示想知道是否，si 不带重音；sí 带重音表示肯定“是”。","piso amueblado、habitaciones amuebladas 的性数跟名词一致；estar disponible 表目前可用状态。"],"cultureNote":"询价时区分 alquiler、gastos、fianza 等项目，要求书面说明；这些词本身不代表任何费用、合同条件或办理结果必然适用。","vocabularyNotes":[{"head":"alquiler","note":"el alquiler 指租金或租赁；preguntar por el alquiler 是问租金，piso de alquiler 是出租公寓。"},{"head":"gastos","note":"常用复数 los gastos；gastos incluidos 表费用已包含，但具体包括哪些仍应逐项询问。"},{"head":"amueblado","note":"来自 amueblar，随房屋名词变化：piso amueblado / habitación amueblada。"}],"transfer":[{"id":"es-13-transfer-1","prompt":"咨询广告中的房间是否仍可看房","text":"He visto el anuncio de una habitación; ¿todavía se puede visitar?","zh":"我看到了一个房间的广告，现在还可以看房吗？","explanation":"todavía 询问当前状态；se puede 加不定式为一般可能性。"},{"id":"es-13-transfer-2","prompt":"询问水电是否包含在租金里","text":"Quisiera saber si el precio incluye el agua y la electricidad.","zh":"我想知道价格是否包含水费和电费。","explanation":"间接的是非问句用 si，不写 sí。"},{"id":"es-13-transfer-3","prompt":"因上班提出周末看房","text":"Trabajo por las tardes; ¿podríamos verla el sábado por la mañana?","zh":"我下午上班，我们能周六上午去看吗？","explanation":"podríamos 为我们能否；verla 的 la 指 habitación。"},{"id":"es-13-transfer-4","prompt":"具体问卧室窗边是否潮湿","text":"¿Hay humedad cerca de la ventana del dormitorio?","zh":"卧室窗户附近有潮湿现象吗？","explanation":"hay 询问有无；cerca de 标出具体位置。"},{"id":"es-13-transfer-5","prompt":"签字前要求时间比较条款","text":"Antes de firmar, quiero comparar las condiciones con las del anuncio.","zh":"签字前，我想把条件和广告中的条件比较一下。","explanation":"antes de 后接 firmar；las del anuncio 省略重复的 condiciones。"},{"id":"es-13-transfer-6","prompt":"请对方邮件列明押金和额外费用","text":"¿Podéis enviarme por correo el importe de la fianza y los gastos aparte?","zh":"你们能邮件告知押金金额和另外的费用吗？","explanation":"enviarme 表发给我；明确要的是项目和金额。"}],"grammarCheck":[{"prompt":"间接问是否带家具，哪句正确？","options":["Quería saber si está amueblado.","Quería saber sí está amueblado.","Quería saber que si es amueblada el piso."],"answer":0,"explanation":"是否用不带重音的 si；piso 搭配 amueblado。"},{"prompt":"间接问含哪些费用，哪句正确？","options":["No sé que gastos incluye.","No sé qué gastos incluye.","No sé qué gastos incluyen el precio."],"answer":1,"explanation":"疑问限定词 qué 保留重音；若主语是价格，动词用单数 incluye。"},{"prompt":"描述两间带家具的房间，哪句正确？","options":["Dos habitaciones amueblado.","Dos habitaciones amueblados.","Dos habitaciones amuebladas."],"answer":2,"explanation":"habitaciones 为阴性复数，形容词用 amuebladas。"}],"writingChecklist":["间接疑问词是否保留必要重音，si/sí 是否区分。","房间与公寓对应的形容词性数是否一致。","明确询问价格所含项目和希望获得的书面信息。"],"speakingFollowups":["如果广告与看房情况不同，你会怎么询问？","你会先核实哪三项费用？","对方不能周末看房时你有什么备选时间？"]}},{"id":"es-14","number":14,"title":"预约与改期","goal":"解释改期原因，提出可选时间并确认安排。","level":"B1","stage":"intermediate","grammar":{"title":"条件式礼貌表达","explanation":"podría、vendría、sería 常用于委婉请求或协商。¿Te vendría bien…? 表示“某时间对你方便吗”。","examples":[{"text":"¿Sería posible cambiar la cita?","zh":"可以改预约吗？"},{"text":"¿Te vendría bien el lunes?","zh":"你星期一方便吗？"}]},"vocab":[{"head":"cambiar","zh":"更改","example":"Necesito cambiar la cita.","exampleZh":"我需要更改预约。","icon":"talk"},{"head":"aplazar","zh":"推迟","example":"Podemos aplazar la reunión.","exampleZh":"我们可以推迟会议。","icon":"talk"},{"head":"adelantar","zh":"提前","example":"¿Se puede adelantar la visita?","exampleZh":"能提前上门吗？","icon":"talk"},{"head":"hueco","zh":"空档","example":"¿Tenéis algún hueco mañana?","exampleZh":"你们明天有空档吗？","icon":"talk"},{"head":"confirmación","zh":"确认","example":"Espero la confirmación.","exampleZh":"我在等确认。","icon":"talk"},{"head":"imprevisto","zh":"突发情况","example":"Me ha surgido un imprevisto.","exampleZh":"我遇到一个突发情况。","icon":"talk"},{"head":"disponibilidad","zh":"可安排时间","example":"Envíame tu disponibilidad.","exampleZh":"把你可安排的时间发给我。","icon":"talk"},{"head":"anular","zh":"取消","example":"Tengo que anular la reserva.","exampleZh":"我得取消预订。","icon":"talk"},{"head":"aviso","zh":"通知","example":"Gracias por el aviso.","exampleZh":"谢谢通知。","icon":"talk"},{"head":"franja horaria","zh":"时间段","example":"Prefiero la franja de la tarde.","exampleZh":"我更喜欢下午这个时间段。","icon":"talk"}],"lessons":[{"id":"es-14-1","text":"Me ha surgido un imprevisto.","zh":"我遇到了一件突发情况。","tip":"现在完成时联系刚发生的事情与当前安排。"},{"id":"es-14-2","text":"¿Sería posible aplazar la cita?","zh":"可以把预约推迟吗？","tip":"sería posible 语气委婉。"},{"id":"es-14-3","text":"Tengo disponibilidad el lunes por la mañana.","zh":"我星期一上午可以安排。","tip":"disponibilidad 用于可用时间。"},{"id":"es-14-4","text":"¿Os vendría bien a las once?","zh":"十一点对你们方便吗？","tip":"os 对应 vosotros。"},{"id":"es-14-5","text":"Si no hay hueco, puedo esperar al jueves.","zh":"如果没有空档，我可以等到星期四。","tip":"真实可能条件用 si 加现在时。"},{"id":"es-14-6","text":"Quedo pendiente de vuestra confirmación.","zh":"我等待你们的确认。","tip":"适合邮件或较正式的消息。"}],"dialogue":[{"speaker":"Mei","text":"Necesito cambiar la cita del martes.","zh":"我需要更改星期二的预约。"},{"speaker":"Empleado","text":"¿Qué día le vendría bien?","zh":"哪天对您方便？"},{"speaker":"Mei","text":"El jueves por la mañana, si hay hueco.","zh":"星期四上午，如果有空档的话。"},{"speaker":"Empleado","text":"Lo compruebo y le envío la confirmación.","zh":"我查一下，然后给您发确认。"}],"reading":{"title":"维修时间的协调","text":"Mei ha pedido que revisen la lavadora de su piso. La visita estaba prevista para el miércoles por la mañana, pero le han cambiado una reunión de trabajo. Llama al servicio técnico en cuanto lo sabe. Explica el problema y ofrece dos alternativas: el jueves por la tarde o el viernes a primera hora. La persona que la atiende consulta la agenda. Finalmente acuerdan el jueves y Mei pide una confirmación por mensaje para avisar a su compañero de piso.","zh":"梅申请了公寓洗衣机检修。原计划星期三上午上门，但她的一场工作会议改了时间。她一得知就打给维修服务。她解释情况，提出两个选择：星期四下午或星期五一早。接线人员查看日程。最后双方约定星期四，梅请求用消息确认，以便通知室友。"},"assessment":{"reading":{"title":"摄影课的新时间","text":"La profesora de fotografía escribe al grupo para avisar de un cambio. La clase del viernes no puede celebrarse porque la sala estará ocupada. Ofrece recuperarla el sábado por la mañana o el lunes por la tarde. Cada estudiante debe responder antes del miércoles. Sonia puede ir el lunes, pero trabaja el sábado. Responde al correo y pregunta si deben llevar las mismas fotos que prepararon para la clase original. La profesora confirma que sí."},"questions":[{"prompt":"为什么原课不能举行？","options":["教师生病","教室将被占用","学生都没空"],"answer":1,"explanation":"原因是 la sala estará ocupada。"},{"prompt":"回复截止何时？","options":["星期五前","星期一前","星期三前"],"answer":2,"explanation":"需 antes del miércoles 回复。"},{"prompt":"Sonia 能参加哪个时间？","options":["星期一下午","星期六上午","星期五晚上"],"answer":0,"explanation":"她星期六工作，星期一能去。"},{"prompt":"需要带原先准备的照片吗？","options":["不需要","需要","只有新生需要"],"answer":1,"explanation":"老师确认带同样的照片。"}],"writing":"写一封改期邮件：解释简短原因，给两个备选时间，请求确认。","speaking":"和服务人员协商上门时间，其中一个时段冲突，最终复述达成的安排。"},"story":{"id":"es-14","npc":"Pablo","place":"预约服务台","scene":"原来的时间不方便了。说明原因，再提出可以安排的时间。","text":"¿Necesitas confirmar la cita o cambiarla?","zh":"你需要确认预约，还是更改预约？","icon":"time"},"support":{"id":"es-14","pronunciation":{"focus":"ía 与元音分节","explanation":"sería、vendría、podría 中 í 与 a 分成两节，重音在 í；避免把 ía 吞成一个轻弱音。","examples":[{"text":"¿Sería posible cambiar la hora?","zh":"可以改时间吗？"},{"text":"Me vendría bien el viernes.","zh":"周五对我合适。"}]},"grammarNotes":["条件式可柔和提出请求：sería posible、podría；tener 的条件式词干为 tendr-，venir 为 vendr-。","venir bien 的人称代词表示谁觉得方便：me vendría bien / os vendría bien，不是只按日期变动代词。","现实条件句用 si 加现在时，如 si no hay hueco；不能把礼貌条件式机械放入 si 从句。"],"cultureNote":"改期时先说明原预约，再提供可选时间并等待明确确认；提出新时间不等于预约已自动更改。","vocabularyNotes":[{"head":"aplazar","note":"指推迟到更晚；aplazar la cita al viernes，若提早则用 adelantar。"},{"head":"hueco","note":"日程里的空档常用 tener un hueco；不是字面上的物理洞口。"},{"head":"disponibilidad","note":"阴性抽象名词 la disponibilidad；tener disponibilidad el lunes 表周一可安排。"}],"transfer":[{"id":"es-14-transfer-1","prompt":"突发加班后说明无法赴约","text":"Me han cambiado el turno y no puedo acudir a la hora prevista.","zh":"我的班次被调整了，无法按原定时间前来。","explanation":"me han cambiado 表别人改了我的安排；no puedo 后接 acudir。"},{"id":"es-14-transfer-2","prompt":"请求将下午预约提前到上午","text":"¿Sería posible adelantar la visita a la mañana?","zh":"可以把上门时间提前到上午吗？","explanation":"adelantar 是提前，与 aplazar 相反。"},{"id":"es-14-transfer-3","prompt":"提供两段可安排时间","text":"Estoy disponible el martes después de las cinco o el miércoles antes de comer.","zh":"我周二五点后或周三午饭前有空。","explanation":"disponible 表状态；después de 与 antes de 标出范围。"},{"id":"es-14-transfer-4","prompt":"询问对方整个团队是否方便","text":"¿Os vendría bien que nos reuniéramos a mediodía?","zh":"我们中午见面，你们方便吗？","explanation":"os 指你们；vendría 与作为整体的从句配合，礼貌假设用 reuniéramos。"},{"id":"es-14-transfer-5","prompt":"说明若本周约满则选下周","text":"Si esta semana está completa, prefiero reservar para la siguiente.","zh":"如果本周排满了，我更愿意预约下一周。","explanation":"现实条件 si 后用现在时 está；la siguiente 省略 semana。"},{"id":"es-14-transfer-6","prompt":"要求确认新的时间和地点","text":"Cuando tengáis la nueva hora, enviadme también la dirección.","zh":"你们确定新时间后，也请把地址发给我。","explanation":"未来待发生时间用 cuando tengáis；复数命令 enviadme。"}],"grammarCheck":[{"prompt":"礼貌地问能否改期，哪句正确？","options":["¿Podría cambiar la cita?","¿Podería cambiar la cita?","¿Podría cambio la cita?"],"answer":0,"explanation":"poder 条件式不规则词干 podr-；后接不定式 cambiar。"},{"prompt":"表达周四对我方便，哪句正确？","options":["Yo vendría bien el jueves.","Me vendría bien el jueves.","Mi vendría bien el jueves."],"answer":1,"explanation":"venir bien 用 me 表受益者或感受者，不能用主格 yo 或物主词 mi 替换。"},{"prompt":"表达如果没有空档就等，哪句正确？","options":["Si no habría hueco, espero.","Si no hay un huecos, espero.","Si no hay hueco, espero."],"answer":2,"explanation":"现实条件 si 后用现在时 hay；hueco 单数无需不协调的 un huecos。"}],"writingChecklist":["写明原预约与希望提前或推迟的方向。","条件式词干及其后不定式是否正确。","列出可用时间，并明确需要收到确认。"],"speakingFollowups":["对方只提供一个不方便的时间，你会怎样协商？","怎样确认改期后地点有没有变化？","如果尚未收到确认，你会怎样追问？"]}},{"id":"es-15","number":15,"title":"维修与生活服务","goal":"描述故障经过，确认上门、报价和后续安排。","level":"B1","stage":"intermediate","grammar":{"title":"llevar 加时间与现在完成时","explanation":"lleva dos días sin funcionar 表示持续两天不能用；ha dejado de funcionar 表示已经停止工作。服务范围与价格应逐项核实。","examples":[{"text":"La nevera lleva dos días sin enfriar.","zh":"冰箱已经两天不制冷了。"},{"text":"El horno ha dejado de funcionar.","zh":"烤箱已经停止工作了。"}]},"vocab":[{"head":"avería","zh":"故障","example":"Hay una avería en el horno.","exampleZh":"烤箱有故障。","icon":"talk"},{"head":"fontanero","zh":"水管工","example":"Necesitamos un fontanero.","exampleZh":"我们需要水管工。","icon":"talk"},{"head":"técnico","zh":"维修技术人员","example":"El técnico viene mañana.","exampleZh":"维修人员明天来。","icon":"talk"},{"head":"presupuesto","zh":"报价","example":"Quería un presupuesto por escrito.","exampleZh":"我想要书面报价。","icon":"talk"},{"head":"grifo","zh":"水龙头","example":"El grifo gotea.","exampleZh":"水龙头滴水。","icon":"talk"},{"head":"enchufe","zh":"插座","example":"Este enchufe no funciona.","exampleZh":"这个插座不能用。","icon":"talk"},{"head":"nevera","zh":"冰箱","example":"La nevera no enfría.","exampleZh":"冰箱不制冷。","icon":"talk"},{"head":"reparación","zh":"维修","example":"¿Cuánto tarda la reparación?","exampleZh":"维修要多久？","icon":"talk"},{"head":"pieza","zh":"零件","example":"Hay que cambiar una pieza.","exampleZh":"需要换一个零件。","icon":"talk"},{"head":"desplazamiento","zh":"上门交通服务","example":"¿El precio incluye el desplazamiento?","exampleZh":"价格包含上门费用吗？","icon":"talk"}],"lessons":[{"id":"es-15-1","text":"El grifo lleva tres días goteando.","zh":"水龙头已经滴水三天了。","tip":"llevar 加时间再接动名词表示持续。"},{"id":"es-15-2","text":"La nevera ha dejado de enfriar.","zh":"冰箱已经不制冷了。","tip":"dejar de 加不定式表示停止。"},{"id":"es-15-3","text":"¿El presupuesto incluye las piezas?","zh":"报价包含零件吗？","tip":"incluye 后可接费用项目。"},{"id":"es-15-4","text":"Antes de reparar, avisadme del coste.","zh":"维修前请告知我费用。","tip":"avisad 是对 vosotros 的命令式。"},{"id":"es-15-5","text":"Puedo estar en casa a partir de las cuatro.","zh":"四点起我可以在家。","tip":"a partir de 表示从某时间起。"},{"id":"es-15-6","text":"Si necesitáis una foto, os la envío.","zh":"如果你们需要照片，我就发给你们。","tip":"la 指照片，os 指接收的人。"}],"dialogue":[{"speaker":"Mei","text":"El grifo lleva dos días goteando.","zh":"水龙头已经滴水两天了。"},{"speaker":"Técnico","text":"¿Puede enviarnos una foto?","zh":"您能给我们发张照片吗？"},{"speaker":"Mei","text":"Sí. ¿La visita tiene un coste aparte?","zh":"可以。上门另收费吗？"},{"speaker":"Técnico","text":"Le enviaré el detalle antes de confirmar.","zh":"确认前我会把明细发给您。"}],"reading":{"title":"先弄清服务范围","text":"En el piso de Mei, el grifo de la cocina gotea desde hace varios días. Ella contacta con un servicio de reparación y describe lo que ocurre. Le piden una foto para preparar la visita. Mei pregunta si el precio anunciado incluye el desplazamiento y si las piezas se cobran aparte. Antes de aceptar, quiere recibir el detalle por escrito. También acuerda que el técnico avise antes de llegar, porque necesita salir del trabajo a una hora concreta.","zh":"梅家厨房的水龙头滴水好几天了。她联系维修服务，描述问题。对方让她发张照片，以便准备上门。梅询问广告价格是否包含上门费用，以及零件是否另算。接受前，她希望获得书面明细。她还约定让维修人员到达前通知，因为她需要在特定时间离开工作地点。"},"assessment":{"reading":{"title":"烤箱的维修安排","text":"El horno de Alicia se apaga pocos minutos después de encenderlo. Llama a un técnico y explica que el problema empezó el lunes. Él le propone una visita el jueves entre las diez y las doce. Alicia acepta esa franja, pero pide que le llamen media hora antes. También pregunta si recibirá un presupuesto antes de cambiar alguna pieza. El técnico responde que revisará primero el aparato y explicará las opciones sin empezar la reparación hasta que ella decida."},"questions":[{"prompt":"烤箱怎么了？","options":["开机几分钟后熄灭","完全打不开门","温度显示太高"],"answer":0,"explanation":"se apaga pocos minutos después de encenderlo。"},{"prompt":"上门时间是什么？","options":["星期一十至十二点","星期四下午","星期四十至十二点"],"answer":2,"explanation":"约定周四十点至十二点。"},{"prompt":"Alicia 请求提前多久打电话？","options":["十分钟","半小时","两小时"],"answer":1,"explanation":"她要求 media hora antes。"},{"prompt":"更换零件前会做什么？","options":["先检修并解释选项","自动开始维修","立刻丢掉烤箱"],"answer":0,"explanation":"维修人员先检查并说明，等她决定。"}],"writing":"向维修服务写故障说明，包含持续时间、可上门时段及两个报价问题。","speaking":"模拟询价和上门协调，要求费用明细并确认开始维修前的沟通方式。"},"story":{"id":"es-15","npc":"Lucía","place":"维修咨询台","scene":"家里有一件东西需要维修。描述问题，再确认下一步怎么做。","text":"¿Puedes describir qué no funciona?","zh":"你能描述一下什么地方不能正常使用吗？","icon":"work"},"support":{"id":"es-15","pronunciation":{"focus":"辅音组合 gr 与 pr","explanation":"grifo 的 gr、presupuesto 的 pr 连续发出，不在辅音之间插入“呃”；avería 重读 rí。","examples":[{"text":"El grifo no cierra bien.","zh":"水龙头关不严。"},{"text":"Necesito un presupuesto.","zh":"我需要一份报价。"}]},"grammarNotes":["llevar 加时长加副动词表示持续：lleva dos días fallando；副动词不按主语改变词尾。","现在完成时用 haber 加过去分词：ha dejado de funcionar；haber 不能按中文“有”误换成 tener。","给你们的命令可用 avisadme；双宾语发送照片为 os la envío，la 指 foto，os 在前。"],"cultureNote":"维修咨询中区分检查、上门、零件和施工等费用，询问是否包括在报价里；表达范例不保证任何项目免费或一定可修。","vocabularyNotes":[{"head":"avería","note":"阴性 la avería，重音形成分节 a-ve-rí-a；tener una avería 表发生故障。"},{"head":"presupuesto","note":"pedir un presupuesto 是索取报价，不等于已经接受施工；aceptar el presupuesto 才表示接受报价。"},{"head":"desplazamiento","note":"常指人员上门或路程相关费用；可问 si está incluido，不直接假设它属于维修价。"}],"transfer":[{"id":"es-15-transfer-1","prompt":"报告插座一周来时好时坏","text":"El enchufe lleva una semana fallando de vez en cuando.","zh":"这个插座一周来时不时出问题。","explanation":"lleva 加时长再加 fallando；de vez en cuando 表间歇发生。"},{"id":"es-15-transfer-2","prompt":"说明洗衣机今天不再排水","text":"La lavadora ha dejado de desaguar esta mañana.","zh":"洗衣机今天早上开始不排水了。","explanation":"ha dejado de 加不定式说明停止原有功能。"},{"id":"es-15-transfer-3","prompt":"核实报价是否含上门和人工","text":"¿El presupuesto incluye el desplazamiento y la mano de obra?","zh":"报价包含上门费和人工费吗？","explanation":"单数 presupuesto 作主语，动词 incluye；列出具体两项。"},{"id":"es-15-transfer-4","prompt":"要求更换前先告知零件价格","text":"Antes de cambiar ninguna pieza, decidme cuánto cuesta.","zh":"更换任何零件之前，请先告诉我它多少钱。","explanation":"antes de 后接不定式；decidme 是对 vosotros 的命令。"},{"id":"es-15-transfer-5","prompt":"约定可在家等待的时间范围","text":"El jueves puedo estar en casa de diez a dos.","zh":"周四十点到两点我可以在家。","explanation":"de…a… 标出起止范围；puedo 后接 estar。"},{"id":"es-15-transfer-6","prompt":"答应提供故障录像而非照片","text":"Si os sirve un vídeo del ruido, os lo mando esta tarde.","zh":"如果噪声的视频对你们有帮助，我今天下午发给你们。","explanation":"vídeo 阳性用 lo；os lo 的顺序为间接宾语在前。"}],"grammarCheck":[{"prompt":"说水龙头漏水两天，哪句正确？","options":["Lleva dos días goteando.","Lleva dos días gotea.","Ha dos días goteando."],"answer":0,"explanation":"llevar 加时间与副动词 goteando 表持续。"},{"prompt":"说冰箱停止工作了，哪句正确？","options":["La nevera tiene dejado de funcionar.","La nevera ha dejado de funcionar.","La nevera ha dejó de funcionar."],"answer":1,"explanation":"完成时用 ha 加过去分词 dejado，后接 de funcionar。"},{"prompt":"把照片发给你们，哪句正确？","options":["La os envío.","Os le envío la foto a vosotros.","Os la envío."],"answer":2,"explanation":"间接宾语 os 在直接宾语 la 前；foto 阴性用 la。"}],"writingChecklist":["区分故障持续多久与何时停止工作。","报价问题是否点明零件、上门或人工项目。","照片/视频的代词是否与名词性别匹配。"],"speakingFollowups":["维修方只报总价时你还想核实什么？","如果需要改上门时间，你会怎么说明？","怎样描述故障出现的频率而不自行下诊断？"]}},{"id":"es-16","number":16,"title":"工作沟通","goal":"说明进度、分工和期限，遇到困难及时求助。","level":"B1","stage":"intermediate","grammar":{"title":"ya、todavía 与现在完成时","explanation":"ya he terminado 表示已经完成；todavía no he terminado 表示尚未完成。具体已经结束的过去时间常用简单过去时。","examples":[{"text":"Ya he enviado el informe.","zh":"我已经发送报告了。"},{"text":"Todavía no hemos revisado los datos.","zh":"我们还没有核对数据。"}]},"vocab":[{"head":"informe","zh":"报告","example":"He preparado el informe.","exampleZh":"我已准备好报告。","icon":"talk"},{"head":"plazo","zh":"期限","example":"El plazo termina el viernes.","exampleZh":"截止时间是星期五。","icon":"talk"},{"head":"reunión","zh":"会议","example":"La reunión empieza a las diez.","exampleZh":"会议十点开始。","icon":"talk"},{"head":"equipo","zh":"团队","example":"Trabajo con este equipo.","exampleZh":"我和这个团队一起工作。","icon":"talk"},{"head":"tarea","zh":"任务","example":"Esta tarea es urgente.","exampleZh":"这项任务很紧急。","icon":"talk"},{"head":"revisar","zh":"检查；审阅","example":"Voy a revisar los datos.","exampleZh":"我要核对数据。","icon":"talk"},{"head":"adjunto","zh":"附件","example":"Encontrarás el archivo adjunto.","exampleZh":"你会看到所附文件。","icon":"talk"},{"head":"prioridad","zh":"优先事项","example":"Esta entrega es la prioridad.","exampleZh":"这次交付是优先事项。","icon":"talk"},{"head":"entrega","zh":"提交；交付","example":"La entrega será el martes.","exampleZh":"将在星期二提交。","icon":"talk"},{"head":"duda","zh":"疑问","example":"Tengo una duda sobre el gráfico.","exampleZh":"我对图表有个疑问。","icon":"talk"}],"lessons":[{"id":"es-16-1","text":"Ya he actualizado el documento.","zh":"我已经更新文件了。","tip":"ya 常与完成结果一起使用。"},{"id":"es-16-2","text":"Todavía falta revisar la última página.","zh":"最后一页还需审阅。","tip":"falta 加不定式表示待办事项。"},{"id":"es-16-3","text":"¿Podéis enviarme los datos antes del jueves?","zh":"你们能在星期四前把数据发给我吗？","tip":"antes del 指截止界限。"},{"id":"es-16-4","text":"No llego al plazo si falta esta información.","zh":"缺少这些信息我就赶不上截止时间。","tip":"no llego al plazo 表达无法按时完成。"},{"id":"es-16-5","text":"Propongo repartir las tareas de otra manera.","zh":"我建议换一种方式分工。","tip":"proponer 后可接不定式。"},{"id":"es-16-6","text":"Os adjunto la versión revisada.","zh":"附件是我修订的版本。","tip":"os 用于多人收件者。"}],"dialogue":[{"speaker":"Mei","text":"Ya he preparado las tablas, pero falta un dato.","zh":"我已做好表格，但缺一个数据。"},{"speaker":"Ana","text":"¿Puedes terminar el resto mientras lo busco?","zh":"我查找时，你能完成其余部分吗？"},{"speaker":"Mei","text":"Sí. ¿Lo tendrás antes de las cuatro?","zh":"可以。你四点前能找到吗？"},{"speaker":"Ana","text":"Te confirmo a las tres cómo va.","zh":"我三点告诉你进展。"}],"reading":{"title":"交付前的协作","text":"El equipo de Mei prepara una presentación para un cliente. Ella ya ha terminado las tablas, pero necesita confirmar dos cifras antes de enviar el documento. Escribe a Ana y explica exactamente qué información falta. Como el plazo termina el viernes, propone revisar juntos la versión final el jueves por la tarde. Ana responde que puede conseguir las cifras por la mañana. Mei actualiza la lista de tareas para que todos sepan qué está hecho y qué queda pendiente.","zh":"梅的团队在为客户准备演示文稿。她已经做完表格，但发送文件前需要确认两个数字。她写信给安娜，准确说明还缺什么信息。由于星期五截止，她建议星期四下午一起审阅最终版。安娜回复说上午能拿到数据。梅更新任务清单，让所有人知道哪些已完成、哪些仍待处理。"},"assessment":{"reading":{"title":"宣传册的进度","text":"El equipo de una biblioteca prepara un folleto de actividades. Pablo ya ha escrito los textos y Julia ha elegido las imágenes. Sin embargo, falta confirmar el horario de dos talleres. La imprenta necesita el archivo el miércoles por la mañana. Pablo propone llamar a los responsables el lunes y revisar todo el martes. Julia acepta y pide que usen una carpeta compartida para evitar confusiones entre versiones. Ambos acuerdan avisar al resto del equipo cuando esté listo."},"questions":[{"prompt":"尚未确认什么？","options":["活动地点","两场工作坊的时间","图片版权费"],"answer":1,"explanation":"缺的是 horario de dos talleres。"},{"prompt":"印刷厂何时需要文件？","options":["星期二晚上","星期五上午","星期三上午"],"answer":2,"explanation":"文中写 miércoles por la mañana。"},{"prompt":"谁已选好图片？","options":["Julia","Pablo","印刷员"],"answer":0,"explanation":"Julia ha elegido las imágenes。"},{"prompt":"为何使用共享文件夹？","options":["让图片变大","避免版本混乱","减少活动次数"],"answer":1,"explanation":"目的是 evitar confusiones entre versiones。"}],"writing":"写一封进度邮件：已完成事项、待确认信息、期限和下一步分工。","speaking":"模拟团队会议，说明一个阻碍并协商可执行的分工与反馈时间。"},"story":{"id":"es-16","npc":"Ana","place":"工作交接桌","scene":"同事正在安排任务。问清要求、提出困难，一起商量可行时间。","text":"¿Revisamos las tareas y el plazo de entrega?","zh":"我们核对一下任务和提交期限好吗？","icon":"work"},"support":{"id":"es-16","pronunciation":{"focus":"ado 在正式与日常语速中","explanation":"actualizado、revisado 的 -ado 在部分日常口音中 d 较弱；初学时保留清楚的 d，有助于听者辨认完成时。","examples":[{"text":"Ya hemos revisado las cifras.","zh":"我们已经核对了数字。"},{"text":"Todavía falta una tabla.","zh":"还缺一张表。"}]},"grammarNotes":["ya 常表示已经完成，todavía no 表尚未完成；todavía falta 加待办事项，不把 falta 与 no 重复造成相反意思。","现在完成时助动词随主语变：he/has/ha/hemos/habéis/han；分词通常不随宾语性数变化。","antes de + 时间点强调提前完成；hasta + 时间点可表示截止或持续，需说明具体“发送”还是“等待”。"],"cultureNote":"工作消息中明确版本、截止时间和责任人很有帮助；西班牙团队可能使用 vosotros，但对外邮件需根据关系选择称呼。","vocabularyNotes":[{"head":"plazo","note":"el plazo 指期限；cumplir el plazo 是按期完成，ampliar el plazo 是延长期限。"},{"head":"adjunto","note":"作动词可说 os adjunto el archivo；作形容词需配合名词，如 la tabla adjunta。"},{"head":"duda","note":"tener una duda 常指有一个问题或不确定点；resolver una duda 表解答，不等于怀疑他人诚信。"}],"transfer":[{"id":"es-16-transfer-1","prompt":"报告已经核对完预算数字","text":"Ya hemos comprobado las cifras del presupuesto.","zh":"我们已经核对了预算数字。","explanation":"主语我们用 hemos；comprobado 不随 cifras 变成 comprobadas。"},{"id":"es-16-transfer-2","prompt":"指出还缺客户确认","text":"Todavía no hemos recibido la confirmación del cliente.","zh":"我们还没有收到客户的确认。","explanation":"todavía no 加完成时，明确未完成事项。"},{"id":"es-16-transfer-3","prompt":"请同事在会议前提供图表","text":"¿Podéis compartir la tabla antes de la reunión de mañana?","zh":"你们能在明天开会前分享那张表吗？","explanation":"podéis 加 compartir；antes de 说明行动截止点。"},{"id":"es-16-transfer-4","prompt":"解释依赖材料会影响交付","text":"Sin las cifras definitivas no puedo cerrar el informe a tiempo.","zh":"没有最终数字，我无法按时完成报告。","explanation":"sin 表缺少前提；a tiempo 指按时。"},{"id":"es-16-transfer-5","prompt":"提出重新分工并具体落实","text":"Propongo que yo revise el texto y que vosotros preparéis los gráficos.","zh":"我建议由我审阅文字，你们准备图表。","explanation":"proponer que 引出建议，用 revise、preparéis 虚拟式。"},{"id":"es-16-transfer-6","prompt":"发送附件并说明修订位置","text":"Os envío el archivo corregido; los cambios están marcados en azul.","zh":"我把改正后的文件发给你们，改动已用蓝色标出。","explanation":"os 指收件人；marcados 随 cambios 为阳性复数。"}],"grammarCheck":[{"prompt":"说我们已更新表格，哪句正确？","options":["Hemos actualizado la tabla.","Hemos actualizada la tabla.","Tenemos actualizado la tabla."],"answer":0,"explanation":"完成时用 hemos，分词不随 tabla 变为 actualizada。"},{"prompt":"表示还没发送，哪句正确？","options":["Todavía hemos enviado no el archivo.","Todavía no hemos enviado el archivo.","Ya todavía enviado el archivo."],"answer":1,"explanation":"否定 no 在助动词前，todavía 表尚未。"},{"prompt":"形容两张附上的表，哪句正确？","options":["Las tablas adjunto.","Las tablas adjuntos.","Las tablas adjuntas."],"answer":2,"explanation":"adjunto 作形容词时与阴性复数 tablas 一致。"}],"writingChecklist":["用 ya 或 todavía no 清楚区分已完成和待完成。","完成时助动词是否随主语变化，分词是否保持正确形式。","具体写出附件版本、下一步和截止时间。"],"speakingFollowups":["如果数据仍未收到，你会给出什么可行时间？","同事问哪一版是最新版，你会怎么回答？","你会怎样提出更公平的任务分工？"]}},{"id":"es-17","number":17,"title":"学习与学校事务","goal":"询问课程要求，解释缺席并安排补学。","level":"B1","stage":"intermediate","grammar":{"title":"deber 与 tener que","explanation":"tener que 表达具体需要；deber 可表示义务或建议，力度取决于语境。询问要求可说 ¿Es obligatorio…?。","examples":[{"text":"Tengo que entregar el trabajo el lunes.","zh":"我得星期一交作业。"},{"text":"¿Es obligatorio asistir a todas las sesiones?","zh":"必须参加所有课次吗？"}]},"vocab":[{"head":"matrícula","zh":"报名；注册","example":"He completado la matrícula.","exampleZh":"我已完成注册。","icon":"talk"},{"head":"asignatura","zh":"课程科目","example":"Esta asignatura es interesante.","exampleZh":"这门课很有趣。","icon":"talk"},{"head":"apuntes","zh":"课堂笔记","example":"¿Me prestas tus apuntes?","exampleZh":"你能借我课堂笔记吗？","icon":"talk"},{"head":"falta","zh":"缺席","example":"Quiero comunicar una falta.","exampleZh":"我想说明一次缺席。","icon":"talk"},{"head":"tutoría","zh":"辅导答疑","example":"He pedido una tutoría.","exampleZh":"我已约了答疑。","icon":"talk"},{"head":"beca","zh":"奖学金；助学金","example":"Quiero información sobre una beca.","exampleZh":"我想了解一项助学金。","icon":"talk"},{"head":"entregar","zh":"提交","example":"Debo entregar el proyecto.","exampleZh":"我得交项目。","icon":"talk"},{"head":"asistir","zh":"出席","example":"No podré asistir mañana.","exampleZh":"我明天无法出席。","icon":"talk"},{"head":"recuperar","zh":"补上","example":"Quiero recuperar la clase.","exampleZh":"我想补上这节课。","icon":"talk"},{"head":"requisito","zh":"要求；条件","example":"¿Cuáles son los requisitos?","exampleZh":"有哪些要求？","icon":"talk"}],"lessons":[{"id":"es-17-1","text":"No podré asistir a la clase del martes.","zh":"我无法参加星期二的课。","tip":"podré 是 poder 的将来时。"},{"id":"es-17-2","text":"¿Cómo puedo recuperar el contenido?","zh":"我怎样能补学内容？","tip":"内容补学不一定意味着补上整节课。"},{"id":"es-17-3","text":"¿Es obligatorio entregar una copia impresa?","zh":"必须交纸质版吗？","tip":"es obligatorio 后接不定式。"},{"id":"es-17-4","text":"Tengo que revisar mis apuntes antes del examen.","zh":"考试前我得复习笔记。","tip":"antes del 表示某事件之前。"},{"id":"es-17-5","text":"Me gustaría pedir una tutoría.","zh":"我想预约答疑。","tip":"me gustaría 是礼貌愿望表达。"},{"id":"es-17-6","text":"¿Hasta cuándo está abierta la matrícula?","zh":"报名开放到什么时候？","tip":"hasta cuándo 询问终止时间。"}],"dialogue":[{"speaker":"Mei","text":"No podré venir el martes. ¿Habrá material para estudiar?","zh":"我星期二来不了。有学习材料吗？"},{"speaker":"Profesor","text":"Sí, dejaré los textos en la plataforma.","zh":"有，我会把课文放到平台上。"},{"speaker":"Mei","text":"¿Debo entregar también el ejercicio?","zh":"我也要交练习吗？"},{"speaker":"Profesor","text":"Sí, pero podemos acordar otra fecha.","zh":"要，不过我们可以另约日期。"}],"reading":{"title":"主动补上缺课内容","text":"Mei estudia un curso de español dos tardes por semana. La próxima semana tiene un viaje de trabajo y faltará a una clase. Escribe a su profesora antes de viajar para explicar la situación. Pregunta qué contenidos estudiará el grupo y cómo puede recuperar el trabajo. La profesora le envía una lectura y le propone una breve tutoría al volver. Mei revisa también la fecha de entrega del ejercicio para organizar su tiempo durante el viaje.","zh":"梅每周有两个下午上西语课。下周她要出差，会缺一节课。出发前，她给老师写信说明情况，询问全班将学习什么内容，以及如何补上任务。老师发给她一篇阅读材料，并建议她回来后进行简短答疑。梅也核对了练习提交日期，以便安排出差期间的时间。"},"assessment":{"reading":{"title":"新课程的要求","text":"Álex quiere apuntarse a un taller de escritura. Antes de matricularse, pregunta si necesita experiencia previa. La coordinadora explica que no, pero cada participante debe llevar un texto breve a la primera sesión. El taller se celebra los jueves por la tarde durante seis semanas. Álex tiene libre ese horario, aunque no puede acudir el último jueves. Pregunta cómo se gestiona una ausencia y espera la respuesta antes de completar la inscripción."},"questions":[{"prompt":"课程需要写作经验吗？","options":["需要多年经验","不需要","只接受教师"],"answer":1,"explanation":"协调员说不需要先前经验。"},{"prompt":"第一课要带什么？","options":["一段短文","打印合同","一张照片"],"answer":0,"explanation":"每人应带 un texto breve。"},{"prompt":"课程持续多久？","options":["两周","四周","六周"],"answer":2,"explanation":"文中是 durante seis semanas。"},{"prompt":"Álex 还在等待什么？","options":["上课地点","缺席如何处理的答复","教材邮寄"],"answer":1,"explanation":"他询问如何处理缺席后等答复再报名。"}],"writing":"给教师写信说明一次缺席，问清补学内容和提交要求。","speaking":"咨询一门课程：问时间、先修要求和一次缺席的处理方式。"},"story":{"id":"es-17","npc":"Pablo","place":"课程咨询室","scene":"你想找到适合的课程。先说目标，再询问要求和学习安排。","text":"¿Qué te gustaría aprender en este curso?","zh":"你想在这门课中学到什么？","icon":"study"},"support":{"id":"es-17","pronunciation":{"focus":"词尾 d 与重音","explanation":"matrícula 重读 trí，tutoría 重读 rí；universidad 末尾 d 在不同口音中可能较弱，学习时不要因此省略拼写。","examples":[{"text":"Tengo que entregar los apuntes.","zh":"我必须交笔记。"},{"text":"¿Hay tutoría esta semana?","zh":"本周有辅导答疑吗？"}]},"grammarNotes":["tener que 与 deber 后都接不定式；tengo que entregar，不说 tengo que entrego。","未来无法参加可用 no podré asistir；asistir a clase 表出席，不能按英语 assist 理解为帮助。","截止前疑问用 ¿Hasta cuándo…?；询问起始时间用 ¿Desde cuándo…?，两者方向相反。"],"cultureNote":"课程补课、注册与辅导要求由学校和课程具体规定；表达重点是询问要求与截止时间，不把例句当作普遍规则。","vocabularyNotes":[{"head":"asistir","note":"搭配 asistir a una clase / a una reunión，表示参加；帮助某人通常用 ayudar。"},{"head":"matrícula","note":"la matrícula 可指注册手续或相关费用；plazo de matrícula 是注册期限。"},{"head":"apuntes","note":"课堂笔记常用复数 los apuntes；tomar apuntes 是做笔记，pedir los apuntes 是借看笔记。"}],"transfer":[{"id":"es-17-transfer-1","prompt":"因实习缺席并提前通知","text":"El jueves tengo prácticas y no podré ir al seminario.","zh":"周四我有实习，无法参加研讨课。","explanation":"podré 是 poder 将来时，后接 ir；al 缩合 a el。"},{"id":"es-17-transfer-2","prompt":"询问是否可看课堂录制","text":"¿Puedo consultar una grabación para ponerme al día?","zh":"我能查看一份录制内容以赶上进度吗？","explanation":"ponerme al día 表补上进度；me 连在不定式后。"},{"id":"es-17-transfer-3","prompt":"核实作业是否必须线上提交","text":"¿Tenemos que subir el trabajo a la plataforma o se entrega en papel?","zh":"我们必须把作业上传平台，还是交纸质版？","explanation":"tenemos que 加 subir；se entrega 用一般提交方式。"},{"id":"es-17-transfer-4","prompt":"安排考前复习并标明重点","text":"Debo repasar los verbos antes de hacer los ejercicios del examen.","zh":"做考试练习前，我应该复习动词。","explanation":"debo 后接 repasar；antes de hacer 的 hacer 不变位。"},{"id":"es-17-transfer-5","prompt":"约辅导讨论反馈","text":"Me gustaría concertar una tutoría para comentar la corrección del trabajo.","zh":"我想约一次辅导，讨论作业的批改意见。","explanation":"me gustaría 加不定式 concertar，para 加 comentar 表目的。"},{"id":"es-17-transfer-6","prompt":"询问晚报名是否还有名额","text":"Quería saber si aún quedan plazas y cuándo termina la matrícula.","zh":"我想知道是否还有名额，以及注册何时结束。","explanation":"si 引出是否；cuándo 在间接问句中保留重音。"}],"grammarCheck":[{"prompt":"表达必须交作业，哪句正确？","options":["Tengo que entregar el trabajo.","Tengo entregar el trabajo.","Tengo que entrego el trabajo."],"answer":0,"explanation":"tener que 的 que 不能省，后接不定式。"},{"prompt":"表达参加课程，哪句正确？","options":["Asisto la clase.","Asisto a clase.","Ayudo a clase."],"answer":1,"explanation":"出席用 asistir a；ayudar 表帮助，不是参加。"},{"prompt":"询问注册到何时截止，哪句正确？","options":["¿Desde cuándo termina la matrícula?","¿Cuánto termina la matrícula?","¿Hasta cuándo está abierta la matrícula?"],"answer":2,"explanation":"hasta cuándo 询问开放持续到何时，即截止时间。"}],"writingChecklist":["deber/tener que 后是否为不定式。","说明缺席原因，并问清补上内容的方法。","区分注册截止、作业提交期限和辅导预约时间。"],"speakingFollowups":["如果录制内容不可用，你会提出什么替代方式？","老师问你对哪部分反馈有疑问，你会如何具体回答？","你会怎样核实提交成功而不是只确认文件已上传？"]}},{"id":"es-18","number":18,"title":"银行与支付事务","goal":"描述支付问题，询问费用并安全确认处理步骤。","level":"B1","stage":"intermediate","grammar":{"title":"否定词与过去经历","explanation":"no aparece 表示当前未显示；no he recibido 表示到现在还未收到。nunca 放在动词前时通常不再用 no。不要在练习中使用真实卡号或验证码。","examples":[{"text":"No he recibido la confirmación.","zh":"我没有收到确认。"},{"text":"Nunca comparto mi clave.","zh":"我从不分享密码。"}]},"vocab":[{"head":"cuenta bancaria","zh":"银行账户","example":"Quiero información sobre una cuenta bancaria.","exampleZh":"我想了解银行账户。","icon":"talk"},{"head":"transferencia","zh":"转账","example":"La transferencia no aparece.","exampleZh":"转账没有显示。","icon":"talk"},{"head":"comisión","zh":"手续费","example":"¿Hay alguna comisión?","exampleZh":"有手续费吗？","icon":"talk"},{"head":"cajero","zh":"自动取款机","example":"El cajero está fuera.","exampleZh":"自动取款机在外面。","icon":"talk"},{"head":"saldo","zh":"余额","example":"Quiero consultar el saldo.","exampleZh":"我想查询余额。","icon":"talk"},{"head":"cargo","zh":"扣款","example":"No reconozco este cargo.","exampleZh":"我不认识这笔扣款。","icon":"talk"},{"head":"justificante","zh":"凭证","example":"He guardado el justificante.","exampleZh":"我保留了凭证。","icon":"talk"},{"head":"clave","zh":"密码","example":"No compartas tu clave.","exampleZh":"不要分享密码。","icon":"talk"},{"head":"bloquear","zh":"冻结；锁定","example":"Necesito bloquear la tarjeta.","exampleZh":"我需要冻结卡片。","icon":"talk"},{"head":"operación","zh":"交易；操作","example":"Quiero revisar esta operación.","exampleZh":"我想核查这笔交易。","icon":"talk"}],"lessons":[{"id":"es-18-1","text":"No reconozco este cargo en mi cuenta.","zh":"我不认识账户里的这笔扣款。","tip":"reconocer 在此指辨认交易。"},{"id":"es-18-2","text":"He guardado el justificante de la operación.","zh":"我保留了交易凭证。","tip":"de 引出凭证所属交易。"},{"id":"es-18-3","text":"¿Podéis explicarme qué comisión se aplica?","zh":"你们能解释适用什么手续费吗？","tip":"间接疑问 qué 保留重音。"},{"id":"es-18-4","text":"Quiero comprobarlo a través del canal oficial.","zh":"我想通过官方渠道核实。","tip":"a través de 表示通过。"},{"id":"es-18-5","text":"¿Qué pasos debo seguir para bloquear la tarjeta?","zh":"冻结卡片我该按什么步骤操作？","tip":"pasos 指操作步骤。"},{"id":"es-18-6","text":"No voy a enviar mi clave por mensaje.","zh":"我不会通过消息发送密码。","tip":"ir a 加不定式表示打算。"}],"dialogue":[{"speaker":"Mei","text":"No reconozco un cargo. ¿Cómo puedo revisarlo?","zh":"我不认识一笔扣款。该怎么核查？"},{"speaker":"Empleado","text":"Podemos indicarle los pasos por el canal oficial.","zh":"我们可以通过官方渠道告诉您步骤。"},{"speaker":"Mei","text":"Tengo el justificante, pero no enviaré mis claves.","zh":"我有凭证，但不会发送密码。"},{"speaker":"Empleado","text":"De acuerdo. Primero comprobamos qué operación es.","zh":"好的。先确认是哪笔交易。"}],"reading":{"title":"先核实再操作","text":"Al revisar su cuenta, Mei ve un cargo que no recuerda. Busca sus recibos para comprobar si corresponde a una compra reciente. Como sigue teniendo dudas, contacta con el banco por el canal oficial que utiliza habitualmente. Describe la fecha y el importe sin compartir sus claves. Pregunta qué pasos debe seguir y cómo guardar una constancia de la consulta. Después anota la respuesta para poder hacer un seguimiento si el problema no se aclara.","zh":"梅查看账户时看到一笔想不起来的扣款。她找出收据，确认是否是近期购物。由于仍有疑问，她通过平时使用的官方渠道联系银行。她描述日期和金额，不分享密码。她询问该如何处理，以及如何保留咨询记录。随后她记下答复，以便问题未解决时继续跟进。"},"assessment":{"reading":{"title":"付款后的重复记录","text":"Después de comprar una mesa, Iván consulta su aplicación bancaria y ve dos movimientos del mismo importe. Conserva el recibo de la tienda y comprueba que solo hizo una compra. Primero pregunta al comercio si hubo algún problema al cobrar. Luego contacta con su banco por un canal oficial para explicar lo ocurrido y consultar los pasos siguientes. No sabe todavía si ambos movimientos son cargos definitivos. Guarda las respuestas y decide revisar de nuevo el estado al día siguiente."},"questions":[{"prompt":"Iván 买了什么？","options":["一张桌子","一部手机","一张车票"],"answer":0,"explanation":"文中是 comprar una mesa。"},{"prompt":"应用显示什么？","options":["账户关闭","两个相同金额的记录","余额为零"],"answer":1,"explanation":"他看见 dos movimientos del mismo importe。"},{"prompt":"他已确认两笔均最终扣款了吗？","options":["是","只确认一笔","尚未确认"],"answer":2,"explanation":"他还不知道两笔是否都是最终扣款。"},{"prompt":"他保留什么？","options":["只有包装盒","店员私人号码","收据和答复"],"answer":2,"explanation":"他保存收据及双方答复。"}],"writing":"用虚构日期和金额写一段支付问题说明，并询问后续步骤，不填写真实账户信息。","speaking":"模拟向银行描述陌生扣款，说明已做的核查并请求官方处理步骤。"},"story":{"id":"es-18","npc":"Lucía","place":"银行咨询台","scene":"付款记录让你有疑问。用虚构信息说明问题，不输入真实密码。","text":"¿Qué duda tienes sobre este pago?","zh":"你对这笔付款有什么疑问？","icon":"money"},"support":{"id":"es-18","pronunciation":{"focus":"c 与 qu 的硬音","explanation":"cuenta 的 cu 与 clave 的 cl 保持辅音组合，qué 中 qu 只发 /k/；comisión 重读末节。","examples":[{"text":"No reconozco este pago.","zh":"我不认识这笔付款。"},{"text":"He guardado el justificante.","zh":"我保存了凭证。"}]},"grammarNotes":["否定词通常在变位动词前：no reconozco；nunca 位于动词后需搭配 no，如 no he enviado nunca esa clave。","经历可用 he recibido、he guardado；已结束的具体过去时段如 ayer 常用简单过去时 recibí。","疑问词带重音：qué comisión、qué pasos；间接问句解释内容也保留 qué。"],"cultureNote":"咨询支付问题时先描述记录与需要核对的项目；银行渠道、手续和处理结果需向相应机构确认，语言例句不构成操作保证。","vocabularyNotes":[{"head":"cargo","note":"el cargo 在账务中指扣款；也可指职位，需依据 en la cuenta 等上下文判断。"},{"head":"justificante","note":"阳性 el justificante，常搭配 guardar / solicitar；justificante de pago 是付款凭证。"},{"head":"clave","note":"阴性 la clave，可能指密码或访问码；区分询问流程与向他人透露具体秘密信息。"}],"transfer":[{"id":"es-18-transfer-1","prompt":"说明同一日期有两笔疑似重复扣款","text":"Veo dos cargos con el mismo importe y quiero comprobar si están duplicados.","zh":"我看到两笔金额相同的扣款，想核实是否重复。","explanation":"dos cargos 复数，对应 están duplicados；si 表是否。"},{"id":"es-18-transfer-2","prompt":"说明已经保存转账编号","text":"He anotado la referencia de la transferencia para poder consultarla.","zh":"我已记下转账编号，以便查询这笔转账。","explanation":"he anotado 是完成动作；consultarla 的 la 指 transferencia。"},{"id":"es-18-transfer-3","prompt":"问国际转账费用由哪些部分组成","text":"¿Podéis detallar qué gastos tendría esta transferencia?","zh":"你们能详细说明这笔转账会有哪些费用吗？","explanation":"qué 修饰 gastos；tendría 表拟议交易的可能费用。"},{"id":"es-18-transfer-4","prompt":"要求先核对网站是否为惯用入口","text":"Antes de introducir datos, voy a comprobar que estoy en la web habitual.","zh":"输入资料前，我会核实自己是否在平常使用的网站上。","explanation":"antes de 加 introducir；voy a comprobar 表近期打算。"},{"id":"es-18-transfer-5","prompt":"只问冻结流程而不假定立即完成","text":"¿Dónde puedo consultar el procedimiento para bloquear la tarjeta?","zh":"我在哪里可以查询停用银行卡的流程？","explanation":"para bloquear 表流程目的；只询问获取流程的位置。"},{"id":"es-18-transfer-6","prompt":"拒绝在聊天中发送验证码并改用惯用渠道","text":"No comparto códigos por este chat; consultaré la solicitud en mi aplicación habitual.","zh":"我不通过这个聊天发送验证码，会在惯用应用里核实这项请求。","explanation":"no 放变位动词前；consultaré 表后续行动。"}],"grammarCheck":[{"prompt":"表达从未发送这项代码，哪句正确？","options":["Nunca he enviado ese código.","Nunca no he enviado ese código.","He nunca enviado ese código."],"answer":0,"explanation":"nunca 在动词前已否定；正常位置在助动词前。"},{"prompt":"表示昨天收到转账，哪句正确？","options":["Ayer recibo una transferencia.","Ayer recibí una transferencia.","Ayer he recibida una transferencia."],"answer":1,"explanation":"ayer 是已结束的过去时间，使用 recibí；完成时分词也不能写 recibida。"},{"prompt":"间接问收取哪项费用，哪句正确？","options":["No sé que comisión se aplica.","No sé cuál comisión aplicarse.","No sé qué comisión se aplica."],"answer":2,"explanation":"间接疑问 qué 保留重音，后接完整变位谓语。"}],"writingChecklist":["明确区分已看到的账务记录与尚未证实的推测。","否定词的位置与过去时态是否符合时间范围。","问题是否指向费用、凭证或流程等具体项目。"],"speakingFollowups":["如果两笔金额相同，你会提供哪些非敏感线索以便核查？","对方答复不清楚时，你会怎样要求书面说明？","你会如何描述自己已保存的凭证而不读出完整私密信息？"]}},{"id":"es-19","number":19,"title":"消息与信息核实","level":"B1","stage":"intermediate","goal":"将已学表达迁移到消息与信息核实，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"He recibido un aviso sobre una actividad del barrio.","zh":"我收到一条社区活动通知。"},{"text":"No sé si la información sigue siendo válida.","zh":"我不知道信息是否仍然有效。"}]},"vocab":[{"head":"por favor","zh":"请","example":"Repite, por favor.","exampleZh":"请重复一下。","icon":"talk","review":true},{"head":"gracias","zh":"谢谢","example":"Gracias por tu ayuda.","exampleZh":"谢谢你的帮助。","icon":"talk","review":true},{"head":"perdón","zh":"不好意思；对不起","example":"Perdón, no entiendo.","exampleZh":"不好意思，我不明白。","icon":"talk","review":true},{"head":"repetir","zh":"重复","example":"¿Puedes repetir la dirección?","exampleZh":"你能重复地址吗？","icon":"talk","review":true},{"head":"despacio","zh":"慢慢地","example":"Habla despacio, por favor.","exampleZh":"请慢慢说。","icon":"talk","review":true},{"head":"entender","zh":"理解","example":"No entiendo esta palabra.","exampleZh":"我不懂这个词。","icon":"talk","review":true},{"head":"palabra","zh":"词语","example":"¿Qué significa esta palabra?","exampleZh":"这个词是什么意思？","icon":"talk","review":true},{"head":"ayuda","zh":"帮助","example":"Necesito ayuda.","exampleZh":"我需要帮助。","icon":"talk","review":true},{"head":"escribir","zh":"写","example":"¿Puede escribir el nombre?","exampleZh":"您能写下名字吗？","icon":"talk","review":true},{"head":"significar","zh":"意思是","example":"¿Qué significa salida?","exampleZh":"salida 是什么意思？","icon":"talk","review":true}],"lessons":[{"id":"es-19-1","text":"He recibido un aviso sobre una actividad del barrio.","zh":"我收到一条社区活动通知。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-19-2","text":"No sé si la información sigue siendo válida.","zh":"我不知道信息是否仍然有效。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-19-3","text":"Antes de reenviarla, voy a consultar la fuente.","zh":"转发前，我会查阅来源。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-19-4","text":"Prefiero escribir al contacto habitual de la organización.","zh":"我更愿意写给组织方的常用联系人。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-19-5","text":"Si cambia la hora, avisaré al resto del grupo.","zh":"如果时间变动，我会通知群里其他人。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-19-6","text":"Después guardaré la confirmación para poder revisarla.","zh":"之后我会保存确认消息，以便查看。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"He recibido un aviso sobre una actividad del barrio. No sé si la información sigue siendo válida. Antes de reenviarla, voy a consultar la fuente. Prefiero escribir al contacto habitual de la organización. Si cambia la hora, avisaré al resto del grupo. Después guardaré la confirmación para poder revisarla.","zh":"我收到一条社区活动通知。我不知道信息是否仍然有效。转发前，我会查阅来源。我更愿意写给组织方的常用联系人。如果时间变动，我会通知群里其他人。之后我会保存确认消息，以便查看。"},"assessment":{"reading":{"title":"陌生情境验收","text":"Clara recibe en un grupo un mensaje que anuncia la cancelación de una visita. El mensaje no incluye fecha ni nombre de la persona responsable. Antes de cambiar sus planes, Clara consulta el correo que recibió de la organización el día anterior. Como no encuentra ningún aviso nuevo, escribe al contacto habitual. Le responden que la visita sigue prevista para el sábado, aunque empezará media hora más tarde. Clara comparte esta confirmación con el grupo."},"questions":[{"prompt":"最初消息声称什么？","options":["取消参观","门票涨价","提前集合"],"answer":0,"explanation":"anuncia la cancelación。"},{"prompt":"消息缺什么？","options":["照片","日期和负责人姓名","地图颜色"],"answer":1,"explanation":"no incluye fecha ni nombre。"},{"prompt":"实际何时参观？","options":["周二","周四","周六"],"answer":2,"explanation":"para el sábado。"},{"prompt":"开始时间如何变化？","options":["晚半小时","早两小时","没变化"],"answer":0,"explanation":"media hora más tarde。"}],"writing":"围绕“消息与信息核实”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“消息与信息核实”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"es-19","npc":"Ana","place":"社区消息栏","scene":"群里转来一条活动通知。先核实，再决定是否改变计划。","text":"¿Has comprobado esta información con la organización?","zh":"你向组织方核实过这项信息了吗？","icon":"idea"},"support":{"id":"es-19","pronunciation":{"focus":"b 与 v 的发音","explanation":"aviso、válida 中 v 与 b 在西班牙语中通常不形成英语式的音位区别；不要为了字母不同刻意咬唇发 v。","examples":[{"text":"Voy a verificar el aviso.","zh":"我去核实这条通知。"},{"text":"¿Sigue siendo válido?","zh":"它仍然有效吗？"}]},"grammarNotes":["no sé si 后接陈述信息，si 不带重音；sé 是 saber 第一人称，需要重音以区别 se。","直接宾语代词按所指名词变化：la información→reenviarla，el aviso→reenviarlo。","现实未来条件用 si + 现在时，主句可用将来时：si cambia, avisaré；si 从句不用 cambiará。"],"cultureNote":"邻里群聊中的转发不等于来源已核实；可用 contacto habitual、fuente 等词说明核查对象，避免把群消息当作机构确认。","vocabularyNotes":[{"head":"escribir","note":"escribir a alguien 是写信给某人，escribir algo 是写某内容；两个宾语可说 escribirle un mensaje。"},{"head":"palabra","note":"dar mi palabra 是作承诺，与“一个词”不同；信息核实时不应把口头承诺直接说成书面确认。"},{"head":"entender","note":"entiendo 有 e→ie 变化，entendemos 不变化；entender el aviso 比只说 entender 更清楚。"}],"transfer":[{"id":"es-19-transfer-1","prompt":"说明收到的是旧活动的提醒","text":"Me ha llegado un recordatorio de un taller que ya terminó.","zh":"我收到了一项已经结束的工作坊的提醒。","explanation":"ha llegado 表近期收到；terminó 指已结束的活动。"},{"id":"es-19-transfer-2","prompt":"怀疑地点可能有变但不确定","text":"No sé si el lugar sigue siendo el mismo que en el cartel.","zh":"我不知道地点是否仍与海报上相同。","explanation":"sigue siendo 表持续状态；si 引出不确定的是非问题。"},{"id":"es-19-transfer-3","prompt":"决定转发前先查发布日期","text":"Voy a mirar la fecha de publicación antes de compartir el enlace.","zh":"分享链接前，我会先看发布日期。","explanation":"antes de 加 compartir；先后顺序由时间短语明确。"},{"id":"es-19-transfer-4","prompt":"选择用之前联系过的邮箱核实","text":"Escribiré a la dirección que usamos la última vez para confirmar los detalles.","zh":"我会写信到我们上次使用的邮箱地址核实细节。","explanation":"escribir a 标出对象；que 引导已知地址的说明。"},{"id":"es-19-transfer-5","prompt":"承诺确认更换地点后通知参与者","text":"Si trasladan la actividad, enviaré la nueva dirección a quienes se han apuntado.","zh":"如果活动换地点，我会把新地址发给已报名的人。","explanation":"条件从句 trasladan 用现在时，主句 enviaré 表未来。"},{"id":"es-19-transfer-6","prompt":"整理截图与答复便于再次核对","text":"Guardaré el mensaje y la respuesta en la misma carpeta para encontrarlos después.","zh":"我会把消息和答复保存在同一文件夹，以便之后找到它们。","explanation":"两个阳性名词作为整体用 los，附在 encontrar 后。"}],"grammarCheck":[{"prompt":"表达不知道通知是否有效，哪句正确？","options":["No sé si el aviso es válido.","No se sí el aviso es válido.","No sé si es válida el aviso."],"answer":0,"explanation":"sé 带重音，是否 si 不带重音；aviso 阳性用 válido。"},{"prompt":"用代词指代 información，哪句正确？","options":["Voy a reenviarlo.","Voy a reenviarla.","Voy a reenviarle ella."],"answer":1,"explanation":"información 阴性单数，直接宾语用 la。"},{"prompt":"表示如果时间改变就通知，哪句正确？","options":["Si cambiará la hora, avisaré.","Si cambia la hora, avisar yo.","Si cambia la hora, avisaré."],"answer":2,"explanation":"现实未来条件 si 从句用现在时，主句使用将来时。"}],"writingChecklist":["把收到的信息、来源和不确定之处分开说明。","宾语代词是否对应 aviso/información 等名词。","写出核实后准备采取的行动与通知对象。"],"speakingFollowups":["你会怎样追问这条消息的发布时间？","两条通知时间不一致时你会向谁核实？","确认后你会怎样向群里简明解释改动？"]}},{"id":"es-20","number":20,"title":"投诉与协商解决","level":"B1","stage":"intermediate","goal":"将已学表达迁移到投诉与协商解决，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Ayer compré este aparato y hoy no funciona.","zh":"我昨天买了这台设备，今天不能用了。"},{"text":"He traído el recibo para explicar el problema.","zh":"我带了收据来说明问题。"}]},"vocab":[{"head":"avería","zh":"故障","example":"Hay una avería en el horno.","exampleZh":"烤箱有故障。","icon":"talk","review":true},{"head":"fontanero","zh":"水管工","example":"Necesitamos un fontanero.","exampleZh":"我们需要水管工。","icon":"talk","review":true},{"head":"técnico","zh":"维修技术人员","example":"El técnico viene mañana.","exampleZh":"维修人员明天来。","icon":"talk","review":true},{"head":"presupuesto","zh":"报价","example":"Quería un presupuesto por escrito.","exampleZh":"我想要书面报价。","icon":"talk","review":true},{"head":"grifo","zh":"水龙头","example":"El grifo gotea.","exampleZh":"水龙头滴水。","icon":"talk","review":true},{"head":"enchufe","zh":"插座","example":"Este enchufe no funciona.","exampleZh":"这个插座不能用。","icon":"talk","review":true},{"head":"nevera","zh":"冰箱","example":"La nevera no enfría.","exampleZh":"冰箱不制冷。","icon":"talk","review":true},{"head":"reparación","zh":"维修","example":"¿Cuánto tarda la reparación?","exampleZh":"维修要多久？","icon":"talk","review":true},{"head":"pieza","zh":"零件","example":"Hay que cambiar una pieza.","exampleZh":"需要换一个零件。","icon":"talk","review":true},{"head":"desplazamiento","zh":"上门交通服务","example":"¿El precio incluye el desplazamiento?","exampleZh":"价格包含上门费用吗？","icon":"talk","review":true}],"lessons":[{"id":"es-20-1","text":"Ayer compré este aparato y hoy no funciona.","zh":"我昨天买了这台设备，今天不能用了。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-20-2","text":"He traído el recibo para explicar el problema.","zh":"我带了收据来说明问题。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-20-3","text":"¿Podría indicarme qué opciones hay en este caso?","zh":"您能告诉我这种情况有哪些选项吗？","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-20-4","text":"No quiero decidir sin entender las condiciones.","zh":"我不想在不明白条件时作决定。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-20-5","text":"Si necesitan revisarlo, ¿cuándo tendré una respuesta?","zh":"如果需要检查，我什么时候能收到答复？","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-20-6","text":"Por favor, anote el número de la consulta.","zh":"请记下咨询编号。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Ayer compré este aparato y hoy no funciona. He traído el recibo para explicar el problema. ¿Podría indicarme qué opciones hay en este caso? No quiero decidir sin entender las condiciones. Si necesitan revisarlo, ¿cuándo tendré una respuesta? Por favor, anote el número de la consulta.","zh":"我昨天买了这台设备，今天不能用了。我带了收据来说明问题。您能告诉我这种情况有哪些选项吗？我不想在不明白条件时作决定。如果需要检查，我什么时候能收到答复？请记下咨询编号。"},"assessment":{"reading":{"title":"陌生情境验收","text":"El lunes, Diego compró una lámpara para su habitación. Al montarla siguiendo las instrucciones, observó que una pieza no encajaba. El miércoles fue a la tienda con la pieza, unas fotos y el justificante de compra. La empleada escuchó su explicación y pidió consultar al servicio técnico antes de ofrecer una solución. Diego no recibió una promesa de devolución inmediata. Le dieron un número de consulta y le indicaron que esperara una respuesta por correo."},"questions":[{"prompt":"Diego 买了什么？","options":["台灯","冰箱","手机"],"answer":0,"explanation":"una lámpara。"},{"prompt":"发现什么问题？","options":["少了收据","部件装不上","颜色错误"],"answer":1,"explanation":"una pieza no encajaba。"},{"prompt":"是否已承诺立即退款？","options":["是","只退款一半","没有"],"answer":2,"explanation":"no recibió una promesa… inmediata。"},{"prompt":"如何等答复？","options":["邮件","邻居口信","广播"],"answer":0,"explanation":"una respuesta por correo。"}],"writing":"围绕“投诉与协商解决”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“投诉与协商解决”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"es-20","npc":"Pablo","place":"商店服务台","scene":"买到的东西出了问题。平静说明经过，再询问解决步骤。","text":"¿Puedes contarme qué ha pasado con el producto?","zh":"你能告诉我商品出了什么情况吗？","icon":"talk"},"support":{"id":"es-20","pronunciation":{"focus":"过去式的末节重音","explanation":"compré、probé 的 é 明确提示过去时第一人称末节重读；compre 无重音是另一种形式，书写不能随意省略。","examples":[{"text":"Ayer probé el aparato.","zh":"我昨天试了这个设备。"},{"text":"¿Podría revisarlo?","zh":"您能检查一下吗？"}]},"grammarNotes":["投诉先区分时间：ayer compré 是已结束过去，hoy he notado 是与今天相关的完成时。","正式请求用 podría + 不定式；对工作人员单数可用 indique/anote，复数用 indiquen/anoten。","sin 后接不定式表示未做某事：sin entender las condiciones；直接宾语代词 revisar + lo 对应 aparato。"],"cultureNote":"协商时描述具体故障、购买时间与希望了解的选项，保留书面记录；处理方案和权益应依据具体情况确认。","vocabularyNotes":[{"head":"reparación","note":"阴性 la reparación；solicitar una reparación 是提出维修请求，不代表已获同意。"},{"head":"pieza","note":"una pieza 指一个零件；cambiar una pieza 与 cambiar el aparato 不是同一种解决方案。"},{"head":"presupuesto","note":"presupuesto por escrito 指书面报价；可询问有效期和所含项目，不自行理解为最终账单。"}],"transfer":[{"id":"es-20-transfer-1","prompt":"说明网购灯昨天到货但今天无法打开","text":"La lámpara llegó ayer y esta mañana no he conseguido encenderla.","zh":"台灯昨天到货，今天早上我没能把它打开。","explanation":"llegó 指昨天；encenderla 的 la 指 lámpara。"},{"id":"es-20-transfer-2","prompt":"出示订单和故障照片而非仅口头描述","text":"He guardado el pedido y unas fotos para mostrar lo que ocurre.","zh":"我保存了订单和一些照片，以展示发生的问题。","explanation":"he guardado 表当前持有的记录；lo que ocurre 指具体情况。"},{"id":"es-20-transfer-3","prompt":"询问检测与更换各需什么步骤","text":"¿Podría explicarme cómo se tramita una revisión y qué alternativas hay?","zh":"您能向我解释检测如何办理，以及有哪些替代方案吗？","explanation":"间接疑问 cómo、qué 均保留重音。"},{"id":"es-20-transfer-4","prompt":"表示先读报价再决定是否接受维修","text":"Prefiero leer el presupuesto antes de autorizar la reparación.","zh":"我更愿意先阅读报价，再授权维修。","explanation":"antes de autorizar 说明先后，不把询价等同于授权。"},{"id":"es-20-transfer-5","prompt":"问何时会得到检测结果","text":"Si dejo aquí la lámpara, ¿cuándo me comunicarán el resultado?","zh":"如果把台灯留在这里，你们什么时候会告知我结果？","explanation":"si dejo 用现在时；comunicarán 是正式复数未来时。"},{"id":"es-20-transfer-6","prompt":"请写下咨询编号及联系方式","text":"Por favor, anote la referencia y el teléfono de contacto en este papel.","zh":"请在这张纸上写下编号和联系电话。","explanation":"正式单数肯定命令用 anote；两个宾语并列。"}],"grammarCheck":[{"prompt":"描述昨天买了台灯，哪句正确？","options":["Ayer compré una lámpara.","Ayer compro una lámpara.","Ayer comprado una lámpara."],"answer":0,"explanation":"已结束的昨天用简单过去时 compré，不能只有分词。"},{"prompt":"请求对方解释，哪句正确？","options":["¿Podría me explica las opciones?","¿Podría explicarme las opciones?","¿Podría explico las opciones?"],"answer":1,"explanation":"podría 后接不定式 explicar，me 可附其后。"},{"prompt":"正式请一位工作人员写编号，哪句正确？","options":["Escribes la referencia, por favor.","Anota usted la referencia.","Anote la referencia, por favor."],"answer":2,"explanation":"usted 的肯定命令为 anote；anota 是 tú 的形式，不能搭配 usted。"}],"writingChecklist":["按时间顺序说明购买、发现故障和已采取的行动。","语气是否礼貌，单复数称呼是否一致。","列明希望获知的选项、答复时间及咨询编号。"],"speakingFollowups":["如果对方提出收费检测，你会先核实什么？","你会怎样说明问题偶尔出现而不是一直发生？","得到口头方案后，你会请求哪项书面记录？"]}},{"id":"es-21","number":21,"title":"讲述过去的经历","level":"B1","stage":"intermediate","goal":"将已学表达迁移到讲述过去的经历，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"El mes pasado fui a visitar a una amiga.","zh":"上个月我去看望了一位朋友。"},{"text":"Salí pronto porque no conocía bien el camino.","zh":"我很早出发，因为不熟悉路线。"}]},"vocab":[{"head":"billete","zh":"车票","example":"Necesito un billete sencillo.","exampleZh":"我需要一张单程票。","icon":"talk","review":true},{"head":"ida","zh":"去程","example":"Es un billete de ida.","exampleZh":"这是一张单程票。","icon":"talk","review":true},{"head":"vuelta","zh":"返程","example":"La vuelta es mañana.","exampleZh":"返程是明天。","icon":"talk","review":true},{"head":"parada","zh":"站点","example":"La parada está aquí.","exampleZh":"车站在这里。","icon":"talk","review":true},{"head":"estación","zh":"车站","example":"Voy a la estación.","exampleZh":"我要去车站。","icon":"talk","review":true},{"head":"línea","zh":"线路","example":"Busca la línea azul.","exampleZh":"找蓝线。","icon":"talk","review":true},{"head":"andén","zh":"站台","example":"El tren sale del andén dos.","exampleZh":"火车从二号站台出发。","icon":"talk","review":true},{"head":"transbordo","zh":"换乘","example":"Hay un transbordo.","exampleZh":"需要换乘一次。","icon":"talk","review":true},{"head":"autobús","zh":"公交车","example":"El autobús llega pronto.","exampleZh":"公交车很快就到。","icon":"talk","review":true},{"head":"metro","zh":"地铁","example":"Voy en metro.","exampleZh":"我乘地铁去。","icon":"talk","review":true}],"lessons":[{"id":"es-21-1","text":"El mes pasado fui a visitar a una amiga.","zh":"上个月我去看望了一位朋友。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-21-2","text":"Salí pronto porque no conocía bien el camino.","zh":"我很早出发，因为不熟悉路线。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-21-3","text":"Cuando llegué a la estación, el tren ya había salido.","zh":"我到车站时，火车已经开走了。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-21-4","text":"Pedí ayuda para buscar otra conexión.","zh":"我请求帮助，寻找另一种接驳方式。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-21-5","text":"Avisé a mi amiga de que llegaría más tarde.","zh":"我告诉朋友我会晚到。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-21-6","text":"Al final pudimos vernos y cambiamos el plan de la tarde.","zh":"最后我们见到了面，并调整了下午计划。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"El mes pasado fui a visitar a una amiga. Salí pronto porque no conocía bien el camino. Cuando llegué a la estación, el tren ya había salido. Pedí ayuda para buscar otra conexión. Avisé a mi amiga de que llegaría más tarde. Al final pudimos vernos y cambiamos el plan de la tarde.","zh":"上个月我去看望了一位朋友。我很早出发，因为不熟悉路线。我到车站时，火车已经开走了。我请求帮助，寻找另一种接驳方式。我告诉朋友我会晚到。最后我们见到了面，并调整了下午计划。"},"assessment":{"reading":{"title":"陌生情境验收","text":"El sábado, Mei había quedado con Ana para visitar una exposición. Llovía mucho cuando salió de casa y el autobús tardó más de lo habitual. Mei llamó a Ana para avisarla del retraso. Mientras esperaba, consultó el horario de otra línea, pero al final llegó su autobús. Se encontraron cuarenta minutos después de la hora prevista. Como quedaba poco tiempo antes de comer, decidieron ver una sola sala y volver otro día para visitar el resto."},"questions":[{"prompt":"天气怎样？","options":["下雨","晴天","下雪"],"answer":0,"explanation":"Llovía mucho。"},{"prompt":"为何打电话？","options":["订餐","通知迟到","找护照"],"answer":1,"explanation":"avisarla del retraso。"},{"prompt":"晚了多久？","options":["四分钟","一小时","四十分钟"],"answer":2,"explanation":"cuarenta minutos después。"},{"prompt":"最后怎样参观？","options":["只看一个展厅","看完整个展览","完全没去"],"answer":0,"explanation":"ver una sola sala。"}],"writing":"围绕“讲述过去的经历”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“讲述过去的经历”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"es-21","npc":"Lucía","place":"朋友家的餐桌","scene":"朋友想听你的经历。按先后顺序讲清事情怎样发生，又怎样结束。","text":"¿Qué tal fue la excursión? ¿Hubo algún imprevisto?","zh":"出游怎么样？有没有意外情况？","icon":"travel"},"support":{"id":"es-21","pronunciation":{"focus":"简单过去式的重音对比","explanation":"llegué 重读末节，llegue 的重音不同；salí 的 í 也必须写出，以清楚区分过去叙述。","examples":[{"text":"Cuando llegué, ya había cerrado.","zh":"我到的时候，它已经关门了。"},{"text":"No conocía el barrio.","zh":"我当时不熟悉这个街区。"}]},"grammarNotes":["简单过去时推动事件：salí、llegué、pedí；未完成过去时交代背景：llovía、no conocía。","过去某时之前已发生的事用过去完成时：había salido；不能把两个动作都写成现在完成时而丢失先后。","从过去看将来的转述可用条件式：dije que llegaría tarde；不是直接把所有将来时照抄进过去叙事。"],"cultureNote":"叙述旅行经历时说明票、车站和换乘即可，不必为所有交通延误寻找文化原因；具体原因以当时获得的信息为准。","vocabularyNotes":[{"head":"ida","note":"la ida 指去程，与 la vuelta 回程成对；a la ida 是在去程中。"},{"head":"andén","note":"阳性 el andén，复数 los andenes 去掉重音；不要与 estación（车站整体）混淆。"},{"head":"transbordo","note":"hacer un transbordo 是进行一次换乘；perder la conexión 指没赶上接续班次，侧重点不同。"}],"transfer":[{"id":"es-21-transfer-1","prompt":"叙述去年为参加展览出行","text":"El otoño pasado viajé a Bilbao para ver una exposición.","zh":"去年秋天我去了毕尔巴鄂看一场展览。","explanation":"明确结束时间 el otoño pasado，使用 viajé。"},{"id":"es-21-transfer-2","prompt":"解释当时雨很大所以叫了出租车","text":"Llovía mucho y no sabía dónde estaba la parada, así que pedí un taxi.","zh":"当时雨很大，我不知道车站在哪里，所以叫了出租车。","explanation":"llovía/sabía/estaba 作背景，pedí 为发生的事件。"},{"id":"es-21-transfer-3","prompt":"到达展馆时最后入场时间已过","text":"Cuando llegué al museo, ya había terminado el horario de entrada.","zh":"我到博物馆时，入场时段已经结束了。","explanation":"había terminado 先于 llegué，清楚体现过去先后。"},{"id":"es-21-transfer-4","prompt":"向工作人员寻求另一种参观安排","text":"Pregunté en recepción si podía volver a la mañana siguiente.","zh":"我在前台问能否第二天早上再来。","explanation":"pregunté 是动作，podía 表当时的可能性；si 为是否。"},{"id":"es-21-transfer-5","prompt":"告诉同行者自己会晚些会合","text":"Llamé a mis compañeros y les dije que me reuniría con ellos más tarde.","zh":"我打电话给同伴，告诉他们我会晚些与他们会合。","explanation":"过去转述未来用 reuniría；les 指复数同伴。"},{"id":"es-21-transfer-6","prompt":"总结当天改去散步后的体验","text":"Al final paseamos por la ría y descubrimos un mercado que no conocíamos.","zh":"最后我们沿河口散步，发现了一个之前不知道的市场。","explanation":"paseamos/descubrimos 推动叙事，no conocíamos 交代此前背景。"}],"grammarCheck":[{"prompt":"说明过去天气背景，哪句正确？","options":["Llovía cuando salí.","Llueve cuando salí.","Llovió cuando salía siempre ayer."],"answer":0,"explanation":"未完成过去时 llovía 表当时背景，salí 为一次出门动作。"},{"prompt":"说到车站前列车已走，哪句正确？","options":["Cuando llegué, el tren ya ha salido.","Cuando llegué, el tren ya había salido.","Cuando llegué, el tren ya había salí."],"answer":1,"explanation":"更早的过去用 había 加过去分词 salido。"},{"prompt":"转述当时说自己将晚到，哪句正确？","options":["Dije que llegaré ayer.","Dije que llegaba mañana ayer.","Dije que llegaría más tarde."],"answer":2,"explanation":"从过去视角谈后续行动用条件式 llegaría，时间表达也需一致。"}],"writingChecklist":["用过去时区分背景和关键动作。","较早发生的过去事件是否使用 había 加分词。","转述中的人称、时间词和未来视角是否调整。"],"speakingFollowups":["旅途中哪个背景情况影响了你的决定？","哪件事在你到达之前就发生了？","如果再次遇到同样情况，你会怎样安排？"]}},{"id":"es-22","number":22,"title":"计划与备选方案","level":"B1","stage":"intermediate","goal":"将已学表达迁移到计划与备选方案，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Nos gustaría organizar una excursión el próximo domingo.","zh":"我们想在下周日组织一次出游。"},{"text":"Primero tenemos que acordar la hora de salida.","zh":"首先我们要商量出发时间。"}]},"vocab":[{"head":"quedar","zh":"约见","example":"¿Quedamos el viernes?","exampleZh":"我们星期五见吗？","icon":"talk","review":true},{"head":"invitar","zh":"邀请；请客","example":"Te invito a cenar.","exampleZh":"我请你吃晚饭。","icon":"talk","review":true},{"head":"pasear","zh":"散步","example":"Me gusta pasear.","exampleZh":"我喜欢散步。","icon":"talk","review":true},{"head":"plan","zh":"计划；活动安排","example":"Tengo otro plan.","exampleZh":"我另有安排。","icon":"talk","review":true},{"head":"entrada","zh":"门票","example":"Compro dos entradas.","exampleZh":"我买两张门票。","icon":"talk","review":true},{"head":"concierto","zh":"音乐会","example":"Vamos a un concierto.","exampleZh":"我们去听音乐会。","icon":"talk","review":true},{"head":"libre","zh":"有空的","example":"Estoy libre el sábado.","exampleZh":"我星期六有空。","icon":"talk","review":true},{"head":"juntos","zh":"一起","example":"Podemos ir juntos.","exampleZh":"我们可以一起去。","icon":"talk","review":true},{"head":"quizá","zh":"也许","example":"Quizá vaya mañana.","exampleZh":"也许我明天去。","icon":"talk","review":true},{"head":"otra vez","zh":"下次；再一次","example":"Podemos quedar otra vez.","exampleZh":"我们可以下次再约。","icon":"talk","review":true}],"lessons":[{"id":"es-22-1","text":"Nos gustaría organizar una excursión el próximo domingo.","zh":"我们想在下周日组织一次出游。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-22-2","text":"Primero tenemos que acordar la hora de salida.","zh":"首先我们要商量出发时间。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-22-3","text":"Si hace mal tiempo, podemos elegir una actividad cubierta.","zh":"如果天气不好，我们可以选室内活动。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-22-4","text":"Prefiero confirmar el plan antes de comprar los billetes.","zh":"我更愿意买票前确认计划。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-22-5","text":"Quizá sea mejor dejar un rato libre por la tarde.","zh":"也许最好下午留出一些空闲时间。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-22-6","text":"Así podremos cambiar de idea sin tener que correr.","zh":"这样我们能从容改变主意，不必赶时间。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Nos gustaría organizar una excursión el próximo domingo. Primero tenemos que acordar la hora de salida. Si hace mal tiempo, podemos elegir una actividad cubierta. Prefiero confirmar el plan antes de comprar los billetes. Quizá sea mejor dejar un rato libre por la tarde. Así podremos cambiar de idea sin tener que correr.","zh":"我们想在下周日组织一次出游。首先我们要商量出发时间。如果天气不好，我们可以选室内活动。我更愿意买票前确认计划。也许最好下午留出一些空闲时间。这样我们能从容改变主意，不必赶时间。"},"assessment":{"reading":{"title":"陌生情境验收","text":"Marta y dos amigos quieren salir de Madrid el domingo. Comparan dos destinos a los que se puede llegar en tren. Uno tiene un parque junto al río; el otro ofrece un museo cerca de la estación. Todavía no han comprado los billetes porque esperan la previsión del tiempo. Si llueve, elegirán el museo. Uno de los amigos trabaja temprano el lunes, así que acuerdan regresar antes de las ocho de la tarde y confirmar el plan el viernes."},"questions":[{"prompt":"出游在哪天？","options":["周日","周一","周五"],"answer":0,"explanation":"el domingo。"},{"prompt":"为什么还没买票？","options":["没找到车站","等天气预报","忘了名字"],"answer":1,"explanation":"esperan la previsión。"},{"prompt":"下雨选什么？","options":["河边公园","海边","博物馆"],"answer":2,"explanation":"elegirán el museo。"},{"prompt":"何时确认计划？","options":["周五","周四","周二"],"answer":0,"explanation":"confirmar el plan el viernes。"}],"writing":"围绕“计划与备选方案”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“计划与备选方案”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"es-22","npc":"Ana","place":"周末计划桌","scene":"你们想一起出游。提出计划，也为天气或时间变化准备备选。","text":"¿Y si llueve? ¿Tenemos otro plan?","zh":"如果下雨呢？我们有另一个计划吗？","icon":"nature"},"support":{"id":"es-22","pronunciation":{"focus":"词重音与停顿表达备选","explanation":"próximo、sábado 的重音在倒数第三节；条件部分后稍停顿，有助于听者区分条件与结果。","examples":[{"text":"Si llueve, iremos al cine.","zh":"如果下雨，我们就去电影院。"},{"text":"Quizá podamos cambiarlo.","zh":"也许我们可以改一下。"}]},"grammarNotes":["现实条件用 si + 现在时，结果可用将来时或 poder：si llueve, iremos；不说 si lloverá。","quizá 可与虚拟式表达不确定：quizá sea、quizá podamos；不要把 sea 当作 ser 的一般现在时形式。","antes de 后接不定式用于同一主体行动；antes de que 后接从句，未来待发生时用虚拟式。"],"cultureNote":"集体出行时确认预算、出发时间与返程要求比假定大家整天有空更有效；天气备选可先讨论，再据具体信息决定。","vocabularyNotes":[{"head":"plan","note":"复数 planes，不是 plans；cambiar de plan 指改换计划，hacer planes 指做安排。"},{"head":"libre","note":"tener tiempo libre 是有空闲时间，entrada libre 则可指自由入场，语境不同。"},{"head":"quizá","note":"也可写 quizás；用于保留可能性，并非已确定承诺，后续需明确谁何时确认。"}],"transfer":[{"id":"es-22-transfer-1","prompt":"为预算有限的团队提议近郊游","text":"Nos gustaría hacer una salida de un día sin gastar demasiado.","zh":"我们想安排一次不花太多钱的一日游。","explanation":"nos gustaría 的主语是后面的活动整体，动词用单数。"},{"id":"es-22-transfer-2","prompt":"先核对所有人的返程需求","text":"Antes de elegir destino, tenemos que saber a qué hora necesita volver cada uno.","zh":"选目的地之前，我们必须知道每个人需要几点返回。","explanation":"antes de elegir 为先后；间接疑问 a qué hora 带重音。"},{"id":"es-22-transfer-3","prompt":"提出高温时改为室内参观","text":"Si hace demasiado calor, visitaremos una exposición en lugar de caminar.","zh":"如果太热，我们就参观展览，而不是步行。","explanation":"si 从句用 hace，主句 visitaremos；en lugar de 加不定式。"},{"id":"es-22-transfer-4","prompt":"决定核对是否开门后再付票款","text":"Prefiero comprobar el horario antes de pagar las entradas.","zh":"我更愿意付门票前先核实开放时间。","explanation":"prefiero 加 comprobar；antes de pagar 不变位。"},{"id":"es-22-transfer-5","prompt":"建议给午饭留有余量","text":"Quizá convenga reservar más tiempo para comer sin prisas.","zh":"也许最好留更多时间从容吃饭。","explanation":"convenga 是 convenir 虚拟式，用于不确定建议。"},{"id":"es-22-transfer-6","prompt":"说明多留时间能应对交通延误","text":"Con ese margen podremos esperar al siguiente autobús si perdemos el primero.","zh":"有这段余量，如果错过第一班公交，我们就能等下一班。","explanation":"podremos 为 poder 将来时；si perdemos 仍用现在时。"}],"grammarCheck":[{"prompt":"表达如果下雨就换活动，哪句正确？","options":["Si llueve, cambiaremos de actividad.","Si lloverá, cambiaremos de actividad.","Si llueve, cambiar de actividad nosotros."],"answer":0,"explanation":"现实未来条件从句用现在时，结果可用将来时。"},{"prompt":"表达也许最好早点出发，哪句正确？","options":["Quizá es mejor que salimos temprano.","Quizá sea mejor salir temprano.","Quizá sea mejor salimos temprano."],"answer":1,"explanation":"不确定建议可用 sea；mejor 后的活动用不定式 salir。"},{"prompt":"表达买票前确认，哪句正确？","options":["Confirmamos antes comprar.","Confirmamos antes de compramos.","Confirmamos antes de comprar."],"answer":2,"explanation":"antes de 是完整结构，后接不定式 comprar。"}],"writingChecklist":["每个条件是否有明确结果与备选方案。","si 从句、quizá 建议与将来时是否分别用对。","买票或付款之前是否说明要先确认哪些信息。"],"speakingFollowups":["同行者必须提早回家时你会怎么调整？","坏天气下你会选什么具体备选活动？","计划还未确定时你会怎样说明而不误导同伴？"]}},{"id":"es-23","number":23,"title":"邻里与共同生活","level":"B1","stage":"intermediate","goal":"将已学表达迁移到邻里与共同生活，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Comparto piso con dos personas.","zh":"我和两个人合租。"},{"text":"Queremos acordar unas normas para las zonas comunes.","zh":"我们想商量公共区域的一些规则。"}]},"vocab":[{"head":"piso","zh":"公寓；楼层","example":"Vivo en un piso pequeño.","exampleZh":"我住在一套小公寓里。","icon":"talk","review":true},{"head":"cocina","zh":"厨房","example":"La cocina es luminosa.","exampleZh":"厨房很明亮。","icon":"talk","review":true},{"head":"salón","zh":"客厅","example":"Estudio en el salón.","exampleZh":"我在客厅学习。","icon":"talk","review":true},{"head":"dormitorio","zh":"卧室","example":"Mi dormitorio da al patio.","exampleZh":"我的卧室朝向内院。","icon":"talk","review":true},{"head":"levantarse","zh":"起床","example":"Me levanto temprano.","exampleZh":"我起得早。","icon":"talk","review":true},{"head":"acostarse","zh":"上床睡觉","example":"Me acuesto a las once.","exampleZh":"我十一点上床睡觉。","icon":"talk","review":true},{"head":"limpiar","zh":"打扫","example":"Limpio la cocina.","exampleZh":"我打扫厨房。","icon":"talk","review":true},{"head":"lavadora","zh":"洗衣机","example":"Pongo la lavadora por la tarde.","exampleZh":"我下午开洗衣机洗衣服。","icon":"talk","review":true},{"head":"basura","zh":"垃圾","example":"Saco la basura.","exampleZh":"我把垃圾拿出去。","icon":"talk","review":true},{"head":"compañero de piso","zh":"室友","example":"Mi compañero de piso cocina bien.","exampleZh":"我室友很会做饭。","icon":"talk","review":true}],"lessons":[{"id":"es-23-1","text":"Comparto piso con dos personas.","zh":"我和两个人合租。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-23-2","text":"Queremos acordar unas normas para las zonas comunes.","zh":"我们想商量公共区域的一些规则。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-23-3","text":"Entre semana necesito acostarme bastante pronto.","zh":"工作日我需要较早睡觉。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-23-4","text":"Puedo limpiar la cocina si otra persona saca la basura.","zh":"如果另一个人倒垃圾，我可以清洁厨房。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-23-5","text":"Si hay un problema, prefiero hablarlo directamente.","zh":"如果有问题，我更愿意直接谈。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-23-6","text":"Dentro de dos semanas podemos revisar el acuerdo.","zh":"两周后我们可以重新讨论约定。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Comparto piso con dos personas. Queremos acordar unas normas para las zonas comunes. Entre semana necesito acostarme bastante pronto. Puedo limpiar la cocina si otra persona saca la basura. Si hay un problema, prefiero hablarlo directamente. Dentro de dos semanas podemos revisar el acuerdo.","zh":"我和两个人合租。我们想商量公共区域的一些规则。工作日我需要较早睡觉。如果另一个人倒垃圾，我可以清洁厨房。如果有问题，我更愿意直接谈。两周后我们可以重新讨论约定。"},"assessment":{"reading":{"title":"陌生情境验收","text":"Luis vive con Sara y Pablo en un piso compartido. Últimamente encuentran platos sucios en la cocina por la mañana. Luis propone hablar el domingo en vez de dejar una nota enfadada. Los tres acuerdan repartirse las tareas y no dejar la vajilla hasta el día siguiente. Sara trabaja por turnos y pide cierta flexibilidad con los horarios. Deciden probar el nuevo reparto durante dos semanas y volver a hablar si alguna tarea no queda bien organizada."},"questions":[{"prompt":"问题在哪个区域？","options":["厨房","车库","学校"],"answer":0,"explanation":"platos sucios en la cocina。"},{"prompt":"他们何时商量？","options":["周六","周日","周三"],"answer":1,"explanation":"hablar el domingo。"},{"prompt":"Sara 为什么要灵活时间？","options":["要出国","不住那里","轮班工作"],"answer":2,"explanation":"trabaja por turnos。"},{"prompt":"先试多久？","options":["两周","一年","一天"],"answer":0,"explanation":"durante dos semanas。"}],"writing":"围绕“邻里与共同生活”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“邻里与共同生活”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"es-23","npc":"Pablo","place":"公寓公共厨房","scene":"家务安排需要调整。说出具体困难，也给对方留出商量的余地。","text":"¿Cómo podemos repartir mejor las tareas de casa?","zh":"我们怎样才能更好地分配家务？","icon":"home"},"support":{"id":"es-23","pronunciation":{"focus":"s 与词边界","explanation":"zonas comunes 中 s 清楚标出复数；部分西班牙口音会弱化词尾 s，阅读与写作仍须保留性数一致。","examples":[{"text":"Las zonas comunes están limpias.","zh":"公共区域很干净。"},{"text":"¿Lo hablamos esta tarde?","zh":"我们今天下午谈谈这件事吗？"}]},"grammarNotes":["necesitar + 反身不定式时可说 necesito acostarme，也可说 me necesito acostar，但前一种在此更自然清楚。","条件分工用 si + 现在时：limpio si tú cocinas；不把所有协商都写成单向命令。","hablarlo 的 lo 指整件事；如果具体指 las normas，应使用 hablar de las normas，不能机械把任何宾语直接接 hablar。"],"cultureNote":"合租规则应由相关住户协商；用具体行为、频率和时间描述问题，避免用国籍或地区习惯概括某位室友。","vocabularyNotes":[{"head":"compañero de piso","note":"指室友，女性可说 compañera de piso；与同房间的 compañero de habitación 不完全相同。"},{"head":"limpiar","note":"limpiar la cocina 是打扫厨房；fregar los platos 是洗碗，任务划分时可更具体。"},{"head":"acostarse","note":"表示上床睡觉，不保证立即睡着；dormirse 表入睡，协商安静时间时可区分。"}],"transfer":[{"id":"es-23-transfer-1","prompt":"说明与室友作息不同但愿意协商","text":"Vivo con una compañera que trabaja de noche y tenemos horarios distintos.","zh":"我与一位上夜班的女室友同住，我们的作息不同。","explanation":"compañera 阴性；que 引导说明其工作安排。"},{"id":"es-23-transfer-2","prompt":"建议为厨房使用写一份共同清单","text":"Podemos preparar juntos una lista para organizar el uso de la cocina.","zh":"我们可以一起列一份清单，安排厨房的使用。","explanation":"podemos 加 preparar 表共同提议，不直接替别人决定。"},{"id":"es-23-transfer-3","prompt":"解释自己早起，提出安静请求","text":"Como madrugo, os agradecería que bajarais la música después de las diez.","zh":"因为我早起，希望你们十点后把音乐调低一些。","explanation":"como 置句首说明原因；agradecería que 后用虚拟式 bajarais。"},{"id":"es-23-transfer-4","prompt":"提出家务互换的具体方案","text":"Yo friego los platos si tú tiendes la ropa después de poner la lavadora.","zh":"如果你洗衣后晾衣服，我就洗碗。","explanation":"si 从句用现在时 tiendes；poner 不定式跟在 después de 后。"},{"id":"es-23-transfer-5","prompt":"选择先了解原因再讨论噪声问题","text":"Antes de dejar una nota, prefiero preguntar qué ha pasado esta noche.","zh":"留纸条之前，我更愿意先问昨晚发生了什么。","explanation":"qué ha pasado 是间接疑问；prefiero 加 preguntar。"},{"id":"es-23-transfer-6","prompt":"设定试行期限并约定复议","text":"Probamos este reparto hasta el domingo y luego vemos si hace falta cambiar algo.","zh":"我们把这套分工试行到周日，然后看看是否需要改动。","explanation":"hasta 表试行截止；si 引出是否需要调整。"}],"grammarCheck":[{"prompt":"表达我需要早睡，哪句正确？","options":["Necesito acostarme temprano.","Necesito me acostar temprano.","Necesito acostarse temprano."],"answer":0,"explanation":"第一人称反身代词 me 连在不定式后；不能夹在 necesito 与 acostar 中间。"},{"prompt":"表达讨论厨房规则，哪句正确？","options":["Hablamos las normas en ellas.","Hablamos de las normas de la cocina.","Hablamos a las normas de la cocina."],"answer":1,"explanation":"谈论某话题常用 hablar de；规则不是谈话对象，不用 a。"},{"prompt":"表达如果你做饭我洗碗，哪句正确？","options":["Si cocinarás, friego los platos.","Si cocinas, friegan yo los platos.","Si cocinas, friego los platos."],"answer":2,"explanation":"现实条件用现在时 cocinas，主句第一人称为 friego。"}],"writingChecklist":["请求是否指向具体行为与时间而非笼统指责。","反身代词、条件句和话题介词是否正确。","分工是否包含双方任务、试行期限与再次商量的时间。"],"speakingFollowups":["室友解释自己轮班时，你会怎么调整提议？","你最希望先商量哪一项公共区域安排？","试行后有人觉得不公平，你会怎样开启讨论？"]}},{"id":"es-24","number":24,"title":"综合生活任务","level":"B1","stage":"intermediate","goal":"将已学表达迁移到综合生活任务，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Acabo de mudarme y tengo varias gestiones pendientes.","zh":"我刚搬家，还有几件待办事务。"},{"text":"Voy a hacer una lista y empezar por lo más urgente.","zh":"我会列清单，从最紧急的开始。"}]},"vocab":[{"head":"cambiar","zh":"更改","example":"Necesito cambiar la cita.","exampleZh":"我需要更改预约。","icon":"talk","review":true},{"head":"aplazar","zh":"推迟","example":"Podemos aplazar la reunión.","exampleZh":"我们可以推迟会议。","icon":"talk","review":true},{"head":"adelantar","zh":"提前","example":"¿Se puede adelantar la visita?","exampleZh":"能提前上门吗？","icon":"talk","review":true},{"head":"hueco","zh":"空档","example":"¿Tenéis algún hueco mañana?","exampleZh":"你们明天有空档吗？","icon":"talk","review":true},{"head":"confirmación","zh":"确认","example":"Espero la confirmación.","exampleZh":"我在等确认。","icon":"talk","review":true},{"head":"imprevisto","zh":"突发情况","example":"Me ha surgido un imprevisto.","exampleZh":"我遇到一个突发情况。","icon":"talk","review":true},{"head":"disponibilidad","zh":"可安排时间","example":"Envíame tu disponibilidad.","exampleZh":"把你可安排的时间发给我。","icon":"talk","review":true},{"head":"anular","zh":"取消","example":"Tengo que anular la reserva.","exampleZh":"我得取消预订。","icon":"talk","review":true},{"head":"aviso","zh":"通知","example":"Gracias por el aviso.","exampleZh":"谢谢通知。","icon":"talk","review":true},{"head":"franja horaria","zh":"时间段","example":"Prefiero la franja de la tarde.","exampleZh":"我更喜欢下午这个时间段。","icon":"talk","review":true}],"lessons":[{"id":"es-24-1","text":"Acabo de mudarme y tengo varias gestiones pendientes.","zh":"我刚搬家，还有几件待办事务。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-24-2","text":"Voy a hacer una lista y empezar por lo más urgente.","zh":"我会列清单，从最紧急的开始。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-24-3","text":"Necesito confirmar la dirección y la hora de la cita.","zh":"我需要确认地址和预约时间。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-24-4","text":"Si no puedo asistir, avisaré con antelación.","zh":"如果不能参加，我会提前通知。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-24-5","text":"Después de cada llamada guardaré una nota con la respuesta.","zh":"每次通话后，我都会记下答复。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"es-24-6","text":"Al terminar comprobaré qué asuntos siguen sin resolver.","zh":"结束时我会检查哪些事务仍未解决。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Acabo de mudarme y tengo varias gestiones pendientes. Voy a hacer una lista y empezar por lo más urgente. Necesito confirmar la dirección y la hora de la cita. Si no puedo asistir, avisaré con antelación. Después de cada llamada guardaré una nota con la respuesta. Al terminar comprobaré qué asuntos siguen sin resolver.","zh":"我刚搬家，还有几件待办事务。我会列清单，从最紧急的开始。我需要确认地址和预约时间。如果不能参加，我会提前通知。每次通话后，我都会记下答复。结束时我会检查哪些事务仍未解决。"},"assessment":{"reading":{"title":"陌生情境验收","text":"Lin se ha mudado a un barrio nuevo de Valencia. Tiene una cita para entregar documentos el miércoles y quiere apuntarse a un curso cerca de casa. Al leer la confirmación, ve que la atención será en un edificio distinto del habitual. Escribe para comprobar la dirección y prepara los documentos que le indican. Después llama a una escuela, pero el grupo que prefiere está completo. Pide información sobre otro horario y anota que todavía espera esa respuesta."},"questions":[{"prompt":"预约在哪天？","options":["周三","周五","周日"],"answer":0,"explanation":"el miércoles。"},{"prompt":"办事地点怎样？","options":["原地点","另一栋楼","线上办理"],"answer":1,"explanation":"un edificio distinto。"},{"prompt":"喜欢的班怎样？","options":["已取消","降价","已经满员"],"answer":2,"explanat
