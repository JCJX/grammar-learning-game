ion":"está completo。"},{"prompt":"还在等什么？","options":["其他时段的信息","护照寄送","租金清单"],"answer":0,"explanation":"información sobre otro horario。"}],"writing":"围绕“综合生活任务”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“综合生活任务”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"es-24","npc":"Lucía","place":"新社区的早晨","scene":"搬家后还有几件事要办。先排出顺序，再逐项确认信息。","text":"¿Cuál de estas gestiones necesitas hacer primero?","zh":"这些事务中，你需要先办哪一件？","icon":"idea"},"support":{"id":"es-24","pronunciation":{"focus":"疑问词在复句中的重读","explanation":"qué、cuándo 即使不带问号也可能是间接疑问词，应保留重音；comprobaré 的 é 提示将来时第一人称重读。","examples":[{"text":"Comprobaré qué falta.","zh":"我会核实还缺什么。"},{"text":"Acabo de llegar al barrio.","zh":"我刚到这个街区。"}]},"grammarNotes":["acabar de + 不定式表示刚刚完成：acabo de enviar；反身词可说 acabo de mudarme，不能用 acabo de me mudar。","lo más + 形容词把性质名词化：lo más urgente 指最紧急的事，不与后面事项的性别配成 la más urgente。","al + 不定式表示做某事时/之后：al terminar；seguir sin + 不定式表示仍未做，如 sigue sin responder。"],"cultureNote":"搬家后的待办事务因个人与机构而异；先核对具体要求、地点和时间，再记录完成状态，不把学习例句当作通用手续清单。","vocabularyNotes":[{"head":"confirmación","note":"la confirmación 指确认信息；recibir una confirmación 才表示收到确认，solicitarla 只表示提出请求。"},{"head":"aviso","note":"dar aviso / avisar 指通知；通知内容需要说明对象和事项，仅说 he avisado 可能不够具体。"},{"head":"franja horaria","note":"阴性 la franja horaria，复数 franjas horarias；表示一段时间而非精确的单个钟点。"}],"transfer":[{"id":"es-24-transfer-1","prompt":"说明刚换工作地点有多项待办","text":"Acabo de empezar en otra oficina y aún tengo varios asuntos por organizar.","zh":"我刚到另一间办公室开始工作，还有几件事要安排。","explanation":"acabo de 加 empezar 表刚开始；por organizar 表待安排。"},{"id":"es-24-transfer-2","prompt":"按期限给事项排序","text":"Voy a ordenar las tareas por fecha y resolver primero las que vencen antes.","zh":"我会按日期排列任务，先解决那些最早到期的。","explanation":"las que 指 tareas；primero 明确优先次序。"},{"id":"es-24-transfer-3","prompt":"核实预约是否在线上以及应准备什么","text":"Necesito saber si la reunión es en línea y qué documentos debo tener preparados.","zh":"我需要知道会议是否在线，以及应该准备哪些文件。","explanation":"si 引出是否，qué 引出具体内容；preparados 随 documentos。"},{"id":"es-24-transfer-4","prompt":"承诺不能到场会请求新时段","text":"Si me coincide con el trabajo, pediré otra franja horaria cuanto antes.","zh":"如果与工作时间冲突，我会尽早请求另一个时间段。","explanation":"si coincide 现在时，pediré 将来时；otra 随 franja 为阴性。"},{"id":"es-24-transfer-5","prompt":"每次处理后记录负责人和下一步","text":"Después de hablar con cada persona, anotaré su nombre y el siguiente paso.","zh":"与每个人谈过后，我会记下其姓名和下一步。","explanation":"después de hablar 不定式，anotaré 明确未来记录行为。"},{"id":"es-24-transfer-6","prompt":"结束时核对未回复项目并安排跟进","text":"Al acabar, revisaré qué solicitudes siguen sin respuesta y cuándo debo volver a preguntar.","zh":"结束时，我会查看哪些申请仍未收到回复，以及何时应再询问。","explanation":"间接疑问 qué/cuándo 保留重音；siguen 对应复数 solicitudes。"}],"grammarCheck":[{"prompt":"表达刚发送邮件，哪句正确？","options":["Acabo de enviar el correo.","Acabo enviar el correo.","Acabo de enviado el correo."],"answer":0,"explanation":"acabar de 后接不定式 enviar，de 不可省。"},{"prompt":"表达先做最紧急的事，哪句正确？","options":["Empiezo por la más urgente todo.","Empiezo por lo más urgente.","Empiezo por el más urgentemente."],"answer":1,"explanation":"lo más urgente 把形容词名词化，泛指最紧急的事情。"},{"prompt":"表达结束时检查未回复事项，哪句正确？","options":["Al termino reviso qué solicitudes sigue sin responder.","Al terminar reviso que solicitudes siguen sin respondido.","Al terminar reviso qué solicitudes siguen sin respuesta."],"answer":2,"explanation":"al 后接不定式；qué 是疑问限定词；复数 solicitudes 用 siguen。"}],"writingChecklist":["区分刚完成、将执行和仍待解决的事项。","间接疑问词重音及 al/antes de/seguir sin 结构是否正确。","记录每项事务的联系人、确认信息与下一次跟进时间。"],"speakingFollowups":["如果两件急事时间冲突，你会按什么信息排序？","对方没有答复时，你会怎样礼貌追问？","你会怎样向别人简要汇报已完成和待完成的事项？"]}}],"checkpoints":[{"id":"es-stage-1","afterChapter":6,"target":"A1","reading":{"text":"El sábado por la mañana, Clara entra en una tienda de su barrio. Busca fruta para una merienda con cuatro amigos. Compra seis manzanas y un kilo de naranjas, pero no compra pan porque ya tiene en casa. Las manzanas cuestan dos euros y las naranjas, tres. Clara lleva una bolsa grande. Paga con tarjeta y pide el tique. Después va a casa para preparar la mesa.","questions":[{"prompt":"Clara 为什么买水果？","options":["为朋友聚会准备点心","为上班准备午饭","为旅行准备早餐"],"answer":0,"explanation":"para una merienda con cuatro amigos 说明为与四位朋友的点心聚会采购。"},{"prompt":"她没有买什么？","options":["苹果","面包","橙子"],"answer":1,"explanation":"no compra pan porque ya tiene en casa：家里已有面包，因此没有买。"},{"prompt":"水果共花多少钱？","options":["三欧元","四欧元","五欧元"],"answer":2,"explanation":"苹果两欧元加橙子三欧元，合计五欧元。"},{"prompt":"她怎样付款？","options":["银行卡","现金","朋友代付"],"answer":0,"explanation":"Paga con tarjeta 明确为银行卡付款。"}]},"listening":{"text":"Hola, soy Raquel, de la clase de español. Hoy quedamos en la cafetería Azul a las cinco y media. Está en la calle Norte, número ocho. Quiero tomar un té y una tostada. Si no encuentras la cafetería, puedes escribir a mi móvil. Mi amiga llega a las seis. Hasta luego.","questions":[{"prompt":"Raquel 与听者是什么关系？","options":["旅馆员工与客人","西班牙语班同学","店员与顾客"],"answer":1,"explanation":"de la clase de español 表明她来自西班牙语班。"},{"prompt":"约定几点见面？","options":["五点","六点","五点半"],"answer":2,"explanation":"a las cinco y media 是五点半。"},{"prompt":"咖啡馆门牌号是多少？","options":["八号","十八号","六号"],"answer":0,"explanation":"número ocho 是八号。"},{"prompt":"找不到咖啡馆时怎么办？","options":["在学校等","发消息到她手机","直接回家"],"answer":1,"explanation":"puedes escribir a mi móvil 表示可以给她手机发消息。"}]},"writing":"写40–55个西班牙语词，给新同学留一条见面消息：介绍自己、约定咖啡馆和具体时间、说想点什么，再问对方是否方便。","speaking":"与伙伴模拟咖啡馆初次见面：交换名字和来源，询问一种饮品价格；伙伴报一个时间后，你复述核对并约定下次见面。"},{"id":"es-stage-2","afterChapter":12,"target":"A2","reading":{"text":"Diego pasa dos noches en un alojamiento de Zaragoza. El domingo quiere visitar a una amiga al otro lado de la ciudad. En recepción le explican que el autobús habitual no pasa por su calle esa mañana. Puede caminar diez minutos hasta otra parada o tomar el tranvía cerca del mercado. Diego elige caminar porque hace buen tiempo. Antes de salir, deja una mochila en recepción y pregunta hasta qué hora puede recogerla.","questions":[{"prompt":"Diego 周日打算做什么？","options":["买早餐","拜访朋友","更换旅馆"],"answer":1,"explanation":"quiere visitar a una amiga 说明要拜访朋友。"},{"prompt":"平常的公交有何变化？","options":["当天完全停运","票价上涨","那天早上不经过他所在的街道"],"answer":2,"explanation":"no pasa por su calle esa mañana 只说明那天早上的线路情况。"},{"prompt":"他选择哪种方式？","options":["步行到另一个站点","在市场乘电车","请朋友来接"],"answer":0,"explanation":"Diego elige caminar，选择步行十分钟到另一站。"},{"prompt":"离开前他向前台询问什么？","options":["房间何时打扫","背包最晚几点能取","哪里可以买手机"],"answer":1,"explanation":"pregunta hasta qué hora puede recogerla，la 指留下的 mochila。"}]},"listening":{"text":"Hola, Julia. Esta tarde no puedo ir al concierto contigo porque tengo que terminar un trabajo. Lo siento mucho. Mi entrada está en el correo que te envié ayer; puedes invitar a otra persona. ¿Te apetece que nos veamos el domingo para pasear? Estoy libre después de comer. Dime si prefieres ir al parque o al río.","questions":[{"prompt":"说话者为何不能去音乐会？","options":["身体不适","没买到门票","必须完成工作"],"answer":2,"explanation":"tengo que terminar un trabajo 明确说明原因。"},{"prompt":"门票在哪里？","options":["昨天发给 Julia 的邮件里","公园售票处","说话者的包里"],"answer":0,"explanation":"Mi entrada está en el correo que te envié ayer。"},{"prompt":"说话者周日何时有空？","options":["早餐前","午饭后","深夜"],"answer":1,"explanation":"después de comer 在此表示午饭后。"},{"prompt":"Julia 需要回答什么？","options":["需要几张门票","音乐会几点开始","更愿去公园还是河边"],"answer":2,"explanation":"结尾请她在 parque 和 río 之间表达偏好。"}]},"writing":"写60–75个西班牙语词给住宿前台：说明你周日的出行计划，问一种交通方式及返程时间；再请求暂存一件行李，并询问领取条件。","speaking":"邀请伙伴周末参加活动。伙伴先拒绝并说明已有安排，你提出另一个日期和地点；共同确认交通方式，最后复述双方约定的时间。"},{"id":"es-stage-3","afterChapter":18,"target":"B1","reading":{"text":"En su nuevo trabajo, Nuria debe preparar una presentación con datos de dos departamentos. Ya ha recibido las cifras de ventas, pero todavía espera la información de gastos. La reunión está prevista para el jueves. Como quiere comprobar todo con tiempo, escribe a sus compañeros y propone recibir lo que falta el martes por la tarde. También ofrece enviarles un borrador el miércoles. Si los datos no llegan, explicará a su responsable qué parte sigue pendiente antes de cerrar la versión final.","questions":[{"prompt":"Nuria 还缺哪类信息？","options":["销售数字","费用信息","参会名单"],"answer":1,"explanation":"ya ha recibido las cifras de ventas, pero todavía espera la información de gastos。"},{"prompt":"会议原定何时？","options":["周二","周三","周四"],"answer":2,"explanation":"La reunión está prevista para el jueves。"},{"prompt":"她希望何时收到缺失信息？","options":["周二下午","周三上午","周四晚上"],"answer":0,"explanation":"propone recibir lo que falta el martes por la tarde。"},{"prompt":"数据未到时她会怎样做？","options":["自行编造数字","向负责人说明仍待完成的部分","取消所有部门的工作"],"answer":1,"explanation":"explicará a su responsable qué parte sigue pendiente，不是自行补造或取消。"}]},"listening":{"text":"Buenos días. Llamo por la visita del técnico que tenemos prevista para mañana. Me han cambiado el horario de trabajo y no estaré en casa hasta las cuatro. ¿Sería posible venir después o cambiar la visita al viernes por la mañana? Antes de confirmar, también quería saber si la revisión incluye el desplazamiento. Pueden responder al correo que figura en la solicitud. Gracias.","questions":[{"prompt":"为什么提出改时间？","options":["技术人员取消了服务","家里正在装修","工作时间被调整"],"answer":2,"explanation":"Me han cambiado el horario de trabajo 是提出改期的原因。"},{"prompt":"明天说话者何时能在家？","options":["四点以后","上午十点前","全天都在"],"answer":0,"explanation":"no estaré en casa hasta las cuatro 表示直到四点才在家。"},{"prompt":"另一个建议时段是什么？","options":["周四下午","周五上午","周六晚上"],"answer":1,"explanation":"cambiar la visita al viernes por la mañana。"},{"prompt":"确认前还要核实什么？","options":["是否必须买新设备","技术人员的国籍","检查费是否包括上门费"],"answer":2,"explanation":"si la revisión incluye el desplazamiento 指检查是否含上门。"}]},"writing":"写85–105个西班牙语词给课程协调员：你与一项必修活动时间冲突，说明原因，提出两个具体替代时段，询问补上内容与提交材料的要求，并请求书面确认。","speaking":"与伙伴模拟维修预约：你描述一种持续数日的故障，对方追问时间和频率；再协商上门时段，问清报价包含的两项费用，最后复述仍待确认的事项。"},{"id":"es-stage-4","afterChapter":24,"target":"B1","reading":{"text":"El grupo de lectura iba a reunirse el viernes en una biblioteca, pero recibió un mensaje que anunciaba otro lugar. Antes de reenviarlo, Elena consultó la página del grupo y escribió a la coordinadora. La respuesta aclaró que el mensaje correspondía a una actividad anterior. La reunión seguía en la biblioteca, aunque empezaría media hora más tarde por una obra en la entrada. Elena informó al resto, guardó la confirmación y propuso esperar juntos fuera para entrar por la puerta lateral.","questions":[{"prompt":"Elena 最先要核实什么？","options":["是否需要买书","聚会地点是否改变","谁负责施工"],"answer":1,"explanation":"收到宣布另一个地点的消息后，她核查来源并联系协调员。"},{"prompt":"那条消息实际属于什么？","options":["当天紧急通知","图书馆的新规定","过去的一项活动"],"answer":2,"explanation":"el mensaje correspondía a una actividad anterior。"},{"prompt":"本次聚会实际变化是什么？","options":["晚开始半小时","换到另一座城市","提前一天"],"answer":0,"explanation":"seguía en la biblioteca, aunque empezaría media hora más tarde。"},{"prompt":"Elena 提议大家如何进入？","options":["单独从正门进入","一起在外等候后从侧门进入","让施工人员带入"],"answer":1,"explanation":"esperar juntos fuera para entrar por la puerta lateral。"}]},"listening":{"text":"Hola a todos. Después de probar el reparto de tareas durante una semana, creo que debemos cambiar dos cosas. La cocina ha quedado limpia, pero nadie ha sacado las bolsas del reciclaje. Además, el miércoles puse la lavadora muy tarde y molesté a Marta; lo siento. Propongo ocuparme del reciclaje y usar la lavadora antes de las nueve. ¿Podemos hablarlo el domingo y revisar cómo funciona dentro de quince días?","questions":[{"prompt":"这次任务分工试行了多久？","options":["十五天","一个月","一周"],"answer":2,"explanation":"durante una semana 明确是一周；十五天是后续复议间隔。"},{"prompt":"哪项任务没有人做？","options":["倒分类回收物","打扫厨房","整理卧室"],"answer":0,"explanation":"nadie ha sacado las bolsas del reciclaje。"},{"prompt":"说话者为何道歉？","options":["忘了周日见面","周三洗衣太晚打扰了 Marta","弄坏洗衣机"],"answer":1,"explanation":"el miércoles puse la lavadora muy tarde y molesté a Marta。"},{"prompt":"说话者提出何时商量？","options":["周三","明天早上","周日"],"answer":2,"explanation":"¿Podemos hablarlo el domingo…? 明确商量时间，十五天后再评估。"}]},"writing":"写100–120个西班牙语词，向合租伙伴汇报一项公共区域问题：按时间说明发现和已尝试的解决办法，提出双方可分担的任务、一个备选方案和试行期限，最后邀请对方补充意见。","speaking":"与伙伴协商一次三人周末出游：先交流预算、出发和最晚返程时间；伙伴提出天气或交通突发情况后，你调整方案并说明理由。最后总结已确定、待核实及由谁跟进的事项。"}],"curriculumVersion":2};window.ContinentAudio={"hola":"../language-audio/d5f87a17fbb9d312cb907444.mp3","Hola, soy Leo.":"../language-audio/7514d8cdc4673241092a0d75.mp3","buenos días":"../language-audio/fa04946f68e48d38c57cb8f2.mp3","Buenos días, Ana.":"../language-audio/fad2228075c9db85bffa971c.mp3","buenas tardes":"../language-audio/37287de9aae01e9ffd339e2f.mp3","Buenas tardes, señor Ruiz.":"../language-audio/24ffa5861fea0e491f489160.mp3","buenas noches":"../language-audio/6fb250416d67c58bc8aa59d8.mp3","Buenas noches, hasta mañana.":"../language-audio/e6a104d56fd6cfbceb0aaa0a.mp3","adiós":"../language-audio/c122ad768f8f05623046a982.mp3","Adiós, Marta.":"../language-audio/44a61bd464bc4c1347f8f1a1.mp3","hasta luego":"../language-audio/2fe2ffd4b767f8df52de45de.mp3","Hasta luego, nos vemos.":"../language-audio/e476d43ba6ef99b3cc822e84.mp3","nombre":"../language-audio/9531ca9f56fb32105b91155a.mp3","Mi nombre es Eva.":"../language-audio/ebe152af6142ff8ffc74ea3e.mp3","España":"../language-audio/cddf9048792a3d644fa58947.mp3","Soy de España.":"../language-audio/4c85603825f03269e3c238d5.mp3","amigo":"../language-audio/5c52ba5141142a269137c994.mp3","Luis es mi amigo.":"../language-audio/1a52d0fb25a05af3340c9def.mp3","encantado":"../language-audio/920869183eef38e38516dbb0.mp3","Encantado de conocerte.":"../language-audio/0c3211016f6faafd20681614.mp3","Hola, me llamo Lin.":"../language-audio/6dad95bc4641be10db11f6d0.mp3","¿Cómo te llamas?":"../language-audio/b50671e5dcea4e94b0818b3d.mp3","Soy de China.":"../language-audio/a3e78614b99e1a040d23e631.mp3","Encantada de conocerte.":"../language-audio/633c5ac0760504c98c4455a1.mp3","¿Eres de aquí?":"../language-audio/a1a9b0a0892289d1eddef6d1.mp3","Hasta mañana.":"../language-audio/3694de031ccd918cfd8faf0a.mp3","Hola, soy Ana. ¿Y tú?":"../language-audio/cf367f0a5ac15fad4f4c1dc4.mp3","Me llamo Lin. Soy de China.":"../language-audio/cece287d6194da047ca3ba46.mp3","Encantada. ¿Vives aquí?":"../language-audio/c642ce076ec882b8b8dad9d2.mp3","Sí, vivo cerca. Hasta luego.":"../language-audio/2376173ac777ee8428fce8d1.mp3","Soy Ana.":"../language-audio/54289ceea0c650898ae447f2.mp3","¿Eres de Madrid?":"../language-audio/4355c47ebd4ceac0413f5349.mp3","Lin llega a un edificio de Madrid con una maleta pequeña. En la puerta conoce a Ana, una vecina. Ana dice buenos días y pregunta cómo se llama. Lin se presenta y explica que es de China. Ana es de Madrid y vive en el segundo piso. Los dos hablan un momento. Después, Ana tiene que salir. Se despiden y dicen hasta luego porque esperan verse otra vez por la tarde.":"../language-audio/f581faa14642e8b0d7a9d288.mp3","Por la tarde, Eva entra en una librería pequeña de Toledo. En la puerta saluda a un chico que lleva varios libros. El chico se llama Pablo y es de Valencia, pero ahora vive en Toledo. Eva se presenta y dice que también vive en la ciudad. Pablo tiene una clase y no puede hablar mucho. Los dos se despiden con un hasta luego. Eva entra para buscar un libro de cocina.":"../language-audio/fd1d3eebdb6d2bbed629221a.mp3","¡Hola! ¿Es la primera vez que vienes por aquí?":"../language-audio/1d8fd3d501ce0d837bb40f0c.mp3","Hola, ¿eres el nuevo vecino?":"../language-audio/084a962d81f171c50e94ded2.mp3","Hasta el viernes.":"../language-audio/36f4fb64f8d4dd88aa9fe9f4.mp3","Buenas tardes, soy la nueva cantante del grupo.":"../language-audio/684a9352e68c4b157d5ef01a.mp3","Perdona, ¿cómo te llamas para apuntarte en la lista?":"../language-audio/0fb8d299c698715615da6c7e.mp3","Soy de Pekín, pero ahora vivo en Sevilla.":"../language-audio/06146e22a5a1158fa3ef7e37.mp3","Encantada de trabajar contigo en este proyecto.":"../language-audio/a87bafc0b0fbe0ed6b5eefe0.mp3","¿Sois de este barrio o estáis de visita?":"../language-audio/a7885ff54b9ae142fed303dd.mp3","Que pases un buen fin de semana; nos vemos el lunes.":"../language-audio/2be162abb2d7de4f0e1c52a2.mp3","Soy de Pekín.":"../language-audio/2fda7d57f05d4487b8ee853f.mp3","por favor":"../language-audio/9111b8fd2fa383902a7a0de4.mp3","Repite, por favor.":"../language-audio/38f15efb02d6724389b03c23.mp3","gracias":"../language-audio/7e322ed29b02948fd0f2df77.mp3","Gracias por tu ayuda.":"../language-audio/3e69a0680036611c1a535547.mp3","perdón":"../language-audio/eb3440b321f7e732374eeba6.mp3","Perdón, no entiendo.":"../language-audio/30848e00f2d53b37924a001c.mp3","repetir":"../language-audio/cc31ebca999102c0ef20f50f.mp3","¿Puedes repetir la dirección?":"../language-audio/26a3d4764cdf2e603ca0b79d.mp3","despacio":"../language-audio/bcba01104150979496f80ae8.mp3","Habla despacio, por favor.":"../language-audio/d5c9c28a6f20a3100a53062a.mp3","entender":"../language-audio/6299f7e8ca7503cc8f8f1445.mp3","No entiendo esta palabra.":"../language-audio/0bdeb811b5d71be48f6ee72e.mp3","palabra":"../language-audio/e0b1b67ff448efd28bc2c00b.mp3","¿Qué significa esta palabra?":"../language-audio/47e739f422da1606c309b023.mp3","ayuda":"../language-audio/6f62825e2e0ac1022bbac68f.mp3","Necesito ayuda.":"../language-audio/078089fc4f16b5988c617f14.mp3","escribir":"../language-audio/b5cb28f43238e96b0e646ada.mp3","¿Puede escribir el nombre?":"../language-audio/f709b880c4026a488e64fc38.mp3","significar":"../language-audio/8668e88b60417e379b18b240.mp3","¿Qué significa salida?":"../language-audio/6ccb450f13411c9594c3fbfd.mp3","¿Puedes repetir, por favor?":"../language-audio/b2dd63e8c0cce73a788ca16d.mp3","¿Puede hablar más despacio?":"../language-audio/dd9ac641835df6a1b71f7c6d.mp3","¿Lo puedes escribir?":"../language-audio/59a23623198662e074245361.mp3","Gracias, ahora lo entiendo.":"../language-audio/22f65346f82c496308626f89.mp3","Perdón, ¿qué significa «salida»?":"../language-audio/b0bef6ea6a2fa0584c881703.mp3","Es el lugar por donde puedes salir.":"../language-audio/473fe3bd749e66f32025aeb6.mp3","¿Puedes escribir la palabra?":"../language-audio/d403f7267906534c52df17b2.mp3","Sí, claro: salida.":"../language-audio/a5c25a05304e3fa0308a4c16.mp3","¿Puedes repetir?":"../language-audio/3a66c123671043912085e16d.mp3","En una estación, Lin busca la salida hacia la plaza. Pregunta a una trabajadora, pero ella habla muy deprisa. Lin dice que no entiende y pide que repita más despacio. La trabajadora sonríe y señala un pasillo a la derecha. Después escribe el nombre de la plaza en un papel. Lin lee el nombre y confirma la dirección. Da las gracias y camina hacia la salida sin prisa.":"../language-audio/e048085b88d7395d8076dad4.mp3","Mei llega a una escuela para su primera clase de español. En recepción pregunta por el aula de su grupo. El empleado dice un número, pero Mei no lo entiende. Pide que lo repita y que lo escriba. El empleado escribe catorce en una tarjeta y señala la escalera. Mei pregunta si el aula está en la primera planta. Él responde que sí. Mei da las gracias y sube.":"../language-audio/8a5eb710cd0dbe85e261ad3e.mp3","Podemos hablar más despacio. ¿Qué necesitas aclarar?":"../language-audio/2b934c8d935d9ce31849d416.mp3","¿Puedes repetir el número?":"../language-audio/c01acb3e94e7ea1786eb9887.mp3","No entiendo la última parte.":"../language-audio/5d6eea0920934ff4e66b837e.mp3","Perdón, no entiendo el nombre de la estación.":"../language-audio/44adf90808990a52f254e685.mp3","¿Puedes repetir dónde nos encontramos?":"../language-audio/3e1d0b3e7c0b0efaff0024da.mp3","¿Puede decir los números uno a uno, por favor?":"../language-audio/18b1002e35c52943068f6631.mp3","¿Qué significan estas palabras del menú?":"../language-audio/32fb004c8e45ae279fa7b5ac.mp3","¿Puedes escribirme el código en un mensaje?":"../language-audio/914a558d988279552df705ab.mp3","Gracias, ahora sé que tenemos que esperar fuera.":"../language-audio/a48cd4c2e75d0e63d26e9186.mp3","¿Puede escribir la dirección?":"../language-audio/8f1026c263d7762255c85e63.mp3","¿Puedes escribirlo?":"../language-audio/70a82dbd07fcfb51d81f6263.mp3","No entiendo el número.":"../language-audio/f93d5dcfeeb0f766c2708b86.mp3","apellido":"../language-audio/4d6b8e14cc5d58f53829cd72.mp3","Mi apellido es Wang.":"../language-audio/553c6e5891f322e21fc83ee5.mp3","edad":"../language-audio/d3d85866e8efe62630b1828e.mp3","¿Qué edad tienes?":"../language-audio/f541b455ae489f424d5c9d8a.mp3","año":"../language-audio/b4f5e6b884ed8e2717b6535b.mp3","Tengo veinte años.":"../language-audio/a1cb19b7684da038d67b9089.mp3","profesión":"../language-audio/561bfeb76245adb8c620cc9c.mp3","¿Cuál es tu profesión?":"../language-audio/b4f46e283d727e1a76b95fbc.mp3","estudiante":"../language-audio/e807c664f677a104b27babdd.mp3","Soy estudiante.":"../language-audio/3ade9686e50687a2affd1093.mp3","profesor":"../language-audio/d45d95ca53dcb3172c841cc3.mp3","Luis es profesor.":"../language-audio/0f6019a4975620096b998c48.mp3","móvil":"../language-audio/a51f1deb19358c01fa30ab5c.mp3","Este es mi móvil.":"../language-audio/4365cc6e4cf16b2652d975e9.mp3","correo electrónico":"../language-audio/2d28095669203c02d103b43e.mp3","Escribe tu correo electrónico.":"../language-audio/55ef1ff538faf0c55c67383b.mp3","letra":"../language-audio/08268b99d53eacbff7c91e51.mp3","Falta una letra.":"../language-audio/d7be29e6a8841f9bf5fe729a.mp3","arroba":"../language-audio/e92b19668709d1c3d260a48a.mp3","Mi correo lleva una arroba.":"../language-audio/1ea23a27af4dd9f29b3fee1f.mp3","Mi apellido es Chen.":"../language-audio/b7b2793b033b6fd10e0c7455.mp3","Tengo veintiocho años.":"../language-audio/d9c7314afdd8b7705a0d3c58.mp3","Soy profesora de chino.":"../language-audio/a2d8883531a105de1fa547b1.mp3","¿Cuál es tu número de móvil?":"../language-audio/cadd6f00af8ed53036402eff.mp3","¿Cómo se escribe tu apellido?":"../language-audio/2ff755a4add900eeb6745d3f.mp3","Prefiero dar mi correo electrónico.":"../language-audio/7c0f36f5707e3fd910c44f46.mp3","¿Nombre y apellido?":"../language-audio/2913ef831c74ed8f28e36bd3.mp3","Mei Chen. Soy estudiante.":"../language-audio/f56c014e968a3b99f59a833b.mp3","¿Un correo electrónico de contacto?":"../language-audio/c39ed496a35260ba690ab06a.mp3","Sí, lo escribo aquí.":"../language-audio/7fa4b84ae6149ed15c5fe134.mp3","Me llamo Mei.":"../language-audio/9cba2111b56800d24dcc712d.mp3","Tengo treinta años.":"../language-audio/4555c5383355c7a8040f94a1.mp3","Mei se apunta a un intercambio de idiomas en una biblioteca. En la ficha escribe su nombre, su apellido y su correo electrónico. Tiene veintiocho años y trabaja como profesora de chino. Una voluntaria pregunta si quiere dar también su número de móvil. Mei prefiere usar solo el correo para el primer contacto. La voluntaria revisa las letras con ella y le entrega una tarjeta con el horario del próximo encuentro.":"../language-audio/b795323afe6fd6a23d969d28.mp3","Nora quiere recibir información sobre un curso de natación. En el centro deportivo le dan una ficha. Escribe Nora Ruiz y marca que tiene treinta y dos años. Trabaja como diseñadora y vive cerca del centro. En la casilla de contacto escribe su correo electrónico; no añade su móvil. Antes de entregar la ficha, revisa su apellido porque la última letra se ve mal. La empleada confirma que puede leerlo.":"../language-audio/4c57a36c7db2398083c5a648.mp3","¿Cómo te llamas y de dónde eres?":"../language-audio/0b0b4cd2f4e9dbd58ca82c2e.mp3","Tengo treinta y dos años.":"../language-audio/0aed60e4f562748943617470.mp3","Mi apellido lleva una eñe.":"../language-audio/aa12898495d99c1aa80803ec.mp3","Liu es mi apellido y Wen es mi nombre.":"../language-audio/ca61decbbb69dfd82fdf37ef.mp3","Tengo cuarenta años y busco un curso para adultos.":"../language-audio/ed66f0da4a846361dd25d28c.mp3","Soy arquitecta y estudio español por las tardes.":"../language-audio/c8d07e7dc8d1733a339cc663.mp3","¿Qué número de teléfono debo poner en el formulario?":"../language-audio/7d5d5bdd5f6e3fcf0d2f0d9e.mp3","¿Tu apellido se escribe con dos eles?":"../language-audio/dbbf89b83c2920cb8504c255.mp3","Para esta actividad prefiero usar mi correo del trabajo.":"../language-audio/c3d9d27e4fc29d84fc94a1fe.mp3","Tengo treinta y un años.":"../language-audio/de11350d4a21fbe1321787eb.mp3","¿Cómo se escriben tus apellidos?":"../language-audio/6220b00ad127c212226c6ebb.mp3","hora":"../language-audio/e39a47d6f688c79bd4e573a6.mp3","¿Qué hora es?":"../language-audio/0805c6be61168eb44f77d759.mp3","minuto":"../language-audio/73804a30ca2ba50b89dfea26.mp3","Espera cinco minutos.":"../language-audio/f087ca39d86a98f622ff7dfb.mp3","media":"../language-audio/75f6ef4cc5d4b2a9932ddc7c.mp3","Son las seis y media.":"../language-audio/e42fbf7240bbec4f823fc1f3.mp3","cuarto":"../language-audio/508612f3a326e1e44580935f.mp3","Son las dos y cuarto.":"../language-audio/36c49a4de93f3492a68f2301.mp3","hoy":"../language-audio/5cd0a4934dca4093b83f7fe7.mp3","Hoy es lunes.":"../language-audio/359c0348caa69aac8c08bf0c.mp3","mañana":"../language-audio/25d14b70b4599eac325f7442.mp3","Mañana tengo clase.":"../language-audio/931f76c5e284683bbf8ae16f.mp3","lunes":"../language-audio/0290d659aa06d4d0ea2f7a75.mp3","Nos vemos el lunes.":"../language-audio/d13e0d10e0de148f7d292a50.mp3","fecha":"../language-audio/e547cb1be0d2f4f07024ce8b.mp3","Confirma la fecha.":"../language-audio/2cc2fd84fae91be3682d30e7.mp3","euro":"../language-audio/f7f6aeaba1c6ce52c4e846de.mp3","Cuesta diez euros.":"../language-audio/10aca6ffc12023f110f12e7f.mp3","precio":"../language-audio/bdeb4b95ca2dd1eb0fe1da37.mp3","¿Cuál es el precio?":"../language-audio/7515e44eb1328342ecaaf359.mp3","Es la una y cuarto.":"../language-audio/80e3afb263cfa17a3a7bc363.mp3","Son las ocho menos diez.":"../language-audio/004f4f8403eaa2b7fb170118.mp3","La clase empieza a las nueve.":"../language-audio/9504a4c490c698ea5e1b8aef.mp3","¿Cuánto cuesta?":"../language-audio/c08f6ddb3dc63d033fb8639c.mp3","Quedamos el martes a las seis.":"../language-audio/20bf6e807909c4f35bdb042d.mp3","¿Quedamos mañana?":"../language-audio/fbe9bc5edc65a85e9caf7876.mp3","Sí. ¿A las seis y media?":"../language-audio/dde1d2151d8ca62f1d2b00fb.mp3","Mejor a las siete, junto al reloj.":"../language-audio/7444f0fdeda1462c72d306bb.mp3","Perfecto, a las siete.":"../language-audio/a62892d849483ae61e449844.mp3","Son las tres y media.":"../language-audio/af9373dc0ec2430ae6255e1d.mp3","Quedamos a las cinco.":"../language-audio/c80c79ec0d91a1f62454123b.mp3","Hoy es lunes y Mei quiere visitar un mercado con Luis. Miran sus horarios antes de quedar. Mei termina su clase a las seis y media, pero Luis sale del trabajo a las siete. Deciden encontrarse el martes a las siete y cuarto junto al reloj de la plaza. El mercado cierra a las nueve, así que tienen tiempo. Mei escribe la hora en su agenda para no confundirse al día siguiente.":"../language-audio/4e99835bc6b73fb70266b803.mp3","El sábado, Clara y Dani quieren cenar antes de ir al cine. La película empieza a las diez de la noche. Dani propone quedar a las ocho, pero Clara tiene una llamada hasta las ocho y cuarto. Al final se ven a las ocho y media en un restaurante cercano. El menú cuesta quince euros por persona. Deciden caminar al cine después de cenar porque está a diez minutos.":"../language-audio/cae64ddee025eaa0ba555bc8.mp3","¿Qué día y a qué hora te viene bien quedar?":"../language-audio/01dbe16b602209ef034c28be.mp3","¿A qué hora termina?":"../language-audio/cba88e89f1795651c446e42c.mp3","Son las dos y veinte.":"../language-audio/43135f51629302e6ed06e48b.mp3","¿A qué hora cierra el museo los domingos?":"../language-audio/d439bdb4a062690174bfaf77.mp3","Son las doce y media; aún tenemos tiempo.":"../language-audio/38f402ce5573a1e61a393c37.mp3","Son las siete menos cuarto y la tienda sigue abierta.":"../language-audio/a25d517d52831eea1373c4cd.mp3","La visita empieza a la una de la tarde.":"../language-audio/d0d0e25a52e49252ffb5d765.mp3","¿Cuánto cuestan dos entradas para hoy?":"../language-audio/8e76ba6d442d84b508283dd1.mp3","Recojo el libro el tres de junio a las doce.":"../language-audio/1cbca799664585e31adc9444.mp3","Empieza a la una.":"../language-audio/0075019e5678b996f674fab6.mp3","Son las diez menos cuarto.":"../language-audio/60e05fe4257f0386269a5402.mp3","Tengo clase los lunes.":"../language-audio/fc2cd29c0db0413a5dc33a22.mp3","café con leche":"../language-audio/960ef8c0885180d358094a0f.mp3","Tomo un café con leche.":"../language-audio/4894b9e4cc01af8eb753b17d.mp3","cortado":"../language-audio/e92407e685e5b25882d7037a.mp3","Quería un cortado.":"../language-audio/92faf8ece159161a74c06065.mp3","té":"../language-audio/3a8a3c061ca0f06f6f1f52be.mp3","¿Tenéis té verde?":"../language-audio/52e11cf1cbd296e4be7d08dc.mp3","agua":"../language-audio/76c829f4a273851bdac2406c.mp3","Una botella de agua, por favor.":"../language-audio/508dc710718217738cc58ecc.mp3","tostada":"../language-audio/34411b9fccda7c86131e3c3a.mp3","Quiero una tostada con tomate.":"../language-audio/20c05fcb921808cd6a3e8b1f.mp3","azúcar":"../language-audio/0a973951bb0ddf2c80fa895a.mp3","Sin azúcar, gracias.":"../language-audio/74d355ce5b8f79fce2a45f70.mp3","leche":"../language-audio/baf3aafe3d76a3dcaf4dc6b2.mp3","¿Hay leche sin lactosa?":"../language-audio/4a60a08eea78385f7378c93e.mp3","cuenta":"../language-audio/f15d32f7a248c5edd33a45a9.mp3","La cuenta, por favor.":"../language-audio/044d164a9cd03338d180c06d.mp3","llevar":"../language-audio/2906f116002ada517325bf0c.mp3","Es para llevar.":"../language-audio/6ef1aabd2322fbc6ae9307ad.mp3","mesa":"../language-audio/2a90d01887b1d948b713f5ee.mp3","Esta mesa está libre.":"../language-audio/f5fdf6c07bcd09b88eaa5871.mp3","Quería un café con leche.":"../language-audio/5d12dbb7900777b8de9906da.mp3","¿Tenéis leche sin lactosa?":"../language-audio/7cb576bf5a8c199f82b2f076.mp3","Una tostada con tomate, por favor.":"../language-audio/605da7f74baa2e57504a5a0f.mp3","Es para tomar aquí.":"../language-audio/b6e9e6eba8bbbe3dad8e28c2.mp3","¿Puedo pagar con tarjeta?":"../language-audio/8f02a23f393c337f087d8d40.mp3","Buenos días. ¿Qué te pongo?":"../language-audio/b83f81b19a1a37fd3f023337.mp3","Un cortado y una tostada, por favor.":"../language-audio/c3e65ab34b71c5439d1cf134.mp3","¿Para tomar aquí o para llevar?":"../language-audio/bc04a1537ea46c31e178efbf.mp3","Para tomar aquí. Sin azúcar, gracias.":"../language-audio/221f74db463c73d945023de9.mp3","Antes de la clase, Mei entra en una cafetería cerca de la escuela. Pide un café con leche y una tostada con tomate. Pregunta si tienen leche sin lactosa y la camarera dice que sí. Mei se sienta en una mesa junto a la ventana. No quiere azúcar. Cuando termina el desayuno, pide la cuenta y pregunta si puede pagar con tarjeta. Después guarda el recibo y sale hacia la escuela.":"../language-audio/b02d3784f11f31765a3625e1.mp3","Álvaro pasa por una cafetería antes de coger el autobús. Pide un té y un bocadillo de queso para llevar. La camarera le pregunta si quiere azúcar, pero él dice que no. También pide una botella de agua para el viaje. El bocadillo tarda unos minutos porque lo preparan en ese momento. Álvaro paga en efectivo y espera junto a la barra. Cuando recibe la bolsa, da las gracias.":"../language-audio/b7498d358c84ab1821e3f982.mp3","Un café sin leche, por favor.":"../language-audio/e913e08eaa43e028a29344b8.mp3","¿Es para llevar?":"../language-audio/b1b16e45a40b8d43506f8a23.mp3","Quería dos cafés solos y una tostada para compartir.":"../language-audio/459b50b7ad36ce261b584d2a.mp3","¿Tenéis bebida de avena para el café?":"../language-audio/2890899a58cc93463be28c61.mp3","Un bocadillo de queso sin jamón, por favor.":"../language-audio/8d4d8456c6f91fa05cabf7f1.mp3","El té, sin azúcar ni leche, por favor.":"../language-audio/8e7f704c561524cdfa6d0ad0.mp3","Todo es para llevar; no vamos a sentarnos.":"../language-audio/b21296b42c8ee79ea99f9564.mp3","¿Podemos pagar por separado?":"../language-audio/a0e69ed0db7b49c1b15e9a35.mp3","Un agua fría, por favor.":"../language-audio/2edf54726b86ebebe992e5e5.mp3","Sin azúcar ni leche.":"../language-audio/2eb7ea2021203a75e47b3bb0.mp3","Dos cafés para llevar.":"../language-audio/ac813416e1b8b6d7ae5c962a.mp3","supermercado":"../language-audio/366c0290fe7c909ca223ab75.mp3","El supermercado abre hoy.":"../language-audio/eb69f30dccea895d01f8a468.mp3","pan":"../language-audio/951969c7c1831e27791926ea.mp3","Necesito pan integral.":"../language-audio/19510d324bc2fa0714648eee.mp3","fruta":"../language-audio/f3f020f601d52b66f5ba39ab.mp3","Compro fruta fresca.":"../language-audio/8a92740aecc922e3ae48340e.mp3","manzana":"../language-audio/d86870fa7ff228e1804b3719.mp3","Quiero dos manzanas.":"../language-audio/7d45ea514fa8aa788e0ef92a.mp3","kilo":"../language-audio/9a5f26bf94d4a4fa279df23a.mp3","Un kilo de tomates.":"../language-audio/56f55200c949a7c774b3f1de.mp3","bolsa":"../language-audio/f515fe3cc021b33b37815437.mp3","Traigo mi bolsa.":"../language-audio/0f94e952b98ac41692cf41d3.mp3","caja":"../language-audio/10537fa117381d545a89f6a6.mp3","La caja está allí.":"../language-audio/b3833253dc8839559c03f47b.mp3","efectivo":"../language-audio/0462d1707deda2d12383bd2d.mp3","Pago en efectivo.":"../language-audio/1f7b5e7fa6d993fd6a8567c5.mp3","tarjeta":"../language-audio/47f2b0c582f5e65fcbf4405f.mp3","Pago con tarjeta.":"../language-audio/31b09ed71327c20b674f068e.mp3","recibo":"../language-audio/3d25656773be8f1f0e993944.mp3","Guarda el recibo.":"../language-audio/b39ad6419bb1b0f4b34a2232.mp3","¿Dónde está el arroz?":"../language-audio/6efa0c3f4f54c717ff33e5dc.mp3","¿Hay pan integral?":"../language-audio/2c3495f09400aaf140eb549a.mp3","Quería medio kilo de tomates.":"../language-audio/1b67c8a107aa22cf04c417e1.mp3","¿Cuánto es en total?":"../language-audio/df1147f9983a849353cd8560.mp3","Traigo mi propia bolsa.":"../language-audio/ac486fd6afad524657e2ed2d.mp3","¿Me da el recibo, por favor?":"../language-audio/bf5caefdaf0c1997abb29c05.mp3","Perdone, ¿dónde está la pasta?":"../language-audio/6030e91398b69537de44a794.mp3","En el pasillo tres, al lado del arroz.":"../language-audio/4293a88075d7037f732406bc.mp3","Gracias. ¿Y hay pan integral?":"../language-audio/1af5bbab35ce907c318bb49d.mp3","Sí, junto a la entrada.":"../language-audio/28acf2aa9987ac81489eba1f.mp3","La leche está al fondo.":"../language-audio/9d61312690052be3d7914cbc.mp3","El sábado por la mañana, Mei va al supermercado con una lista y una bolsa de tela. Necesita arroz, pan integral y fruta para varios días. No encuentra el arroz y pregunta a un empleado. Él le indica el pasillo tres. En la zona de fruta, Mei elige cuatro manzanas y medio kilo de tomates. Después pasa por caja, paga con tarjeta y guarda el recibo antes de volver a casa.":"../language-audio/b42134b66ec914444d9873e6.mp3","Rosa compra en el mercado para preparar una comida con su hermano. Primero pide un kilo de patatas y dos cebollas. Después busca pescado, pero el puesto ya no tiene el que quiere. Decide comprar huevos para hacer una tortilla. Lleva una bolsa de tela y no necesita otra. En el último puesto paga en efectivo porque el lector de tarjetas no funciona. Al salir, llama a su hermano para avisarle del cambio.":"../language-audio/ee7188ffd2b23b3c18e7e26d.mp3","¿Buscas algún producto en particular?":"../language-audio/d1db46796b85660cb21ba294.mp3","La caja está al fondo.":"../language-audio/942206df67eb79ccd116dc6e.mp3","Un kilo de naranjas.":"../language-audio/2ac76bda3bfa5aac0aa80aac.mp3","¿Dónde están los huevos de esta oferta?":"../language-audio/ad13461e1b35c3a0ce730d12.mp3","¿Hay pan sin sal en esta tienda?":"../language-audio/46c40734dee488dfcad3d506.mp3","Quería un cuarto de kilo de cerezas.":"../language-audio/db5b891e944057d9ae086da0.mp3","¿Cuánto es todo junto, incluidas las bolsas?":"../language-audio/726fdfee70277259172e27b7.mp3","No necesito bolsa; puedo guardarlo todo en mi mochila.":"../language-audio/8e9d8c1ce51abd27955d3af7.mp3","¿Me puede dar un tique con el detalle de la compra?":"../language-audio/4c14633dde0593d2e1ec5483.mp3","Hay tres cajas.":"../language-audio/7150057cc8ee61e0604ef09f.mp3","¿Dónde están estas manzanas?":"../language-audio/490c7f1d961c2fb127eb8876.mp3","Medio kilo de peras.":"../language-audio/2955a3d74665aaab1c0f8cec.mp3","calle":"../language-audio/824cb59dea03fef2ae0b8c30.mp3","Esta calle es tranquila.":"../language-audio/c7440454657551c5e95f164a.mp3","plaza":"../language-audio/c247b162505b806af58d0675.mp3","La plaza está cerca.":"../language-audio/c71a024861e188fbdd430f37.mp3","derecha":"../language-audio/43fe7efa47e380bc8ac05222.mp3","Gira a la derecha.":"../language-audio/c43130fd1c45910475c91d61.mp3","izquierda":"../language-audio/abc745bd2b3157ec406fdf57.mp3","El banco está a la izquierda.":"../language-audio/0a159457d264e5465955cc2d.mp3","recto":"../language-audio/cfdb17d98130f5a0934ebbd8.mp3","Sigue recto.":"../language-audio/a521938fa2d91ec22078b9bc.mp3","esquina":"../language-audio/30acc0c1ab0443102aa77c34.mp3","Hay un café en la esquina.":"../language-audio/af47d8b0384e96966c8c0fba.mp3","puente":"../language-audio/eba5e5bf4d5d6f6a945553f4.mp3","Cruza el puente.":"../language-audio/3816284730525f1538538e95.mp3","cerca":"../language-audio/fa71f7f3271a34352ed2261c.mp3","Vivo cerca del parque.":"../language-audio/714963d6a82b373111d5f530.mp3","lejos":"../language-audio/68bee95c570cd8c32f55aced.mp3","El museo está lejos.":"../language-audio/24c7a1c3771214b92bec5e3a.mp3","enfrente":"../language-audio/6f5b128de5274f8470dcef98.mp3","La tienda está enfrente.":"../language-audio/084ddb884329d8759b902f4a.mp3","¿Cómo se va a la biblioteca?":"../language-audio/410f28db6bf467dda5489681.mp3","Sigue todo recto.":"../language-audio/8a8e2982ff13097a0a240cbc.mp3","Gira a la izquierda en la esquina.":"../language-audio/56c79a6a476f484ea2211d6c.mp3","Está enfrente del banco.":"../language-audio/45bb5f5dd137af828607dd83.mp3","¿Está muy lejos de aquí?":"../language-audio/bf2b48e172aaaec1582e0a4e.mp3","Entonces, ¿cruzo la plaza?":"../language-audio/cfbf50042b3e592c5f2259a9.mp3","Perdone, ¿cómo se va al museo?":"../language-audio/f33c9daaf3acab6ca75849a4.mp3","Sigue recto y cruza la plaza.":"../language-audio/9b1ee0073fd0d97e8540d030.mp3","¿Está al lado de la iglesia?":"../language-audio/4118ef0e5528a8c9484469e6.mp3","Sí, la entrada está en la esquina.":"../language-audio/1aa73af4a7def3382a88daa3.mp3","La farmacia está al lado del banco.":"../language-audio/431fc9beb6b024ffdecc3c4a.mp3","Sigue recto y gira a la izquierda.":"../language-audio/1d192e22563fedcf6ab6eba7.mp3","Mei quiere devolver un libro, pero no conoce la biblioteca del barrio. Pregunta a un vecino en una plaza. Él le explica que debe seguir recto, cruzar un puente pequeño y girar a la izquierda. La biblioteca está enfrente de una farmacia, junto a un parque. Mei repite las indicaciones para comprobar que las entiende. El vecino dice que son unos diez minutos a pie. Ella da las gracias y sigue el camino.":"../language-audio/c6c731906a564344cae24445.mp3","Óscar tiene que enviar una postal y busca una oficina de Correos. Pregunta en una panadería. La dependienta le dice que siga hasta el semáforo y gire a la derecha. La oficina está junto a una tienda de bicicletas, frente a una plaza pequeña. Óscar pregunta si necesita cruzar el puente. La dependienta responde que no, porque el puente está en la dirección contraria. Él sale y camina hacia el semáforo.":"../language-audio/0637a16e8a1092c0d187bcc8.mp3","¿Adónde quieres ir? Puedo indicarte el camino.":"../language-audio/bdd03f84fa11f90fee5cc0f6.mp3","El parque está cerca.":"../language-audio/b8f660ca4bf4741de1285209.mp3","¿Cómo puedo llegar a Correos desde esta plaza?":"../language-audio/3b911af7ff01a8bc84c3b7ad.mp3","Sigue junto al río hasta el puente.":"../language-audio/8a1c13ad0e3abb148da31adb.mp3","Gire a la derecha en la segunda calle.":"../language-audio/4ba2282e8e75d8beb45e806b.mp3","La clínica está al lado de la panadería.":"../language-audio/76989c6746e2ab7fd529ee9d.mp3","¿Se puede ir andando o queda demasiado lejos?":"../language-audio/fd3493531bcbb90af9256d53.mp3","Entonces cruzo el puente y después giro a la izquierda, ¿verdad?":"../language-audio/8c223e5553c2ca921a091e82.mp3","Siga y gire a la derecha.":"../language-audio/3943b20ffceaf21f7429ac4b.mp3","Voy al museo.":"../language-audio/0e03fd73294143976c3ca492.mp3","billete":"../language-audio/b2ea1f8fd28383c51436aeee.mp3","Necesito un billete sencillo.":"../language-audio/9d32f360d9fcf7e4467c1ad0.mp3","ida":"../language-audio/b6052546cd256c2dcfb9fc86.mp3","Es un billete de ida.":"../language-audio/386f23fe1e483b982d84d3b1.mp3","vuelta":"../language-audio/a36f1a15c264c668c5feeb9c.mp3","La vuelta es mañana.":"../language-audio/66306a56c1ba2c8cdeb3311c.mp3","parada":"../language-audio/7345999732c2f9dfc1f7a5db.mp3","La parada está aquí.":"../language-audio/5e1a1b2a0603e95dfa7ba3ac.mp3","estación":"../language-audio/86c48a6d809a51ea62ad81c8.mp3","Voy a la estación.":"../language-audio/9ff078cf06890f9a81ad62bf.mp3","línea":"../language-audio/ce4169b895ed87fd9ab28d3d.mp3","Busca la línea azul.":"../language-audio/1155b1e0bf485dc8b966fdb3.mp3","andén":"../language-audio/90cf898357e89756d5616b3e.mp3","El tren sale del andén dos.":"../language-audio/df0222a88d133333879e62bd.mp3","transbordo":"../language-audio/0b4e694e8ad39466cdd78e23.mp3","Hay un transbordo.":"../language-audio/93cfd0f60ff8ef94c322ba15.mp3","autobús":"../language-audio/5777b49b7fb1d28b03995d93.mp3","El autobús llega pronto.":"../language-audio/55f3807dc086fc3270c20b3d.mp3","metro":"../language-audio/9625819c209a837a7ac61300.mp3","Voy en metro.":"../language-audio/14ee90de99f8848e03586c45.mp3","¿Este autobús va al centro?":"../language-audio/1ffbf5cb1b73f828d9e9237a.mp3","Un billete de ida y vuelta, por favor.":"../language-audio/0db641c818f187a55bd5127f.mp3","¿Dónde tengo que bajar?":"../language-audio/4083d7ccb7b45087b0dd56b5.mp3","¿Hay que hacer transbordo?":"../language-audio/c48ca7192c0b634af813186b.mp3","¿En qué andén sale el tren?":"../language-audio/301e5bff8c77d50d9f1d81c0.mp3","¿Dónde se valida el billete?":"../language-audio/09422937ff7a86bf2a8f19d3.mp3","¿Cómo llego al hospital en metro?":"../language-audio/d53e47b920aa75a1e402db82.mp3","Toma esta línea y cambia en Sol.":"../language-audio/36edc68358bfc0e13be6f7d8.mp3","¿Tengo que comprar otro billete?":"../language-audio/bb077bea56ed93f056392f71.mp3","Vamos a comprobar qué billete tienes.":"../language-audio/939acc0d514b8cb28fe22133.mp3","Voy al centro en metro.":"../language-audio/c4e5ac82627d6f5a5dfcb86d.mp3","Tenemos que cambiar de línea.":"../language-audio/d28fd2957790b376a92c54a1.mp3","Mei necesita ir a una exposición al otro lado de la ciudad. En la estación mira el plano del metro, pero duda sobre el transbordo. Una empleada le indica la línea que debe tomar y la estación donde tiene que cambiar. Mei pregunta también qué billete necesita para ese recorrido. Después comprueba el destino en la pantalla del andén. Cuando llega el tren, espera a que salgan los pasajeros antes de entrar.":"../language-audio/fc36672da62bc989bda26e69.mp3","El domingo, Julia y su primo van a visitar a una amiga en la costa. Compran billetes de ida porque volverán en coche con ella. En la estación, la pantalla anuncia el andén cuatro. Julia quiere comprar agua, mientras su primo comprueba la hora de salida. El tren sale a las diez y veinte. Cuando llegan al andén, oyen un aviso de cambio al andén seis y preguntan a una empleada para confirmarlo.":"../language-audio/7bc40cec53703ce0fa994202.mp3","¿Cuál es tu destino y cuándo quieres salir?":"../language-audio/d2fa4f69e8abfb936d3d8073.mp3","El autobús llega en diez minutos.":"../language-audio/09f40b4ef2eeae7c0e0f4e07.mp3","¿Cuál es el andén?":"../language-audio/2f67fbf7130a7ceac102eefa.mp3","¿Esta línea de metro pasa por la universidad?":"../language-audio/7ca6a5c7468754764e8b4364.mp3","Quería ir el sábado y volver el domingo; ¿hay billete de ida y vuelta?":"../language-audio/8c2d56b3cc14abc8bbf272a8.mp3","¿En qué parada tengo que bajarme para ir al hospital?":"../language-audio/000da65c8c8f88733c631075.mp3","¿El tren es directo o hay que cambiar en Valladolid?":"../language-audio/806ec247a3c25e5b709b5d08.mp3","¿De qué andén sale el tren del aeropuerto?":"../language-audio/a8b20b698836401fd46e2045.mp3","Es mi primer viaje aquí; ¿me puede enseñar a validar el billete?":"../language-audio/3a6d80408f3eed46583704d9.mp3","Voy a la estación en autobús.":"../language-audio/dc697f1dd3e31d81060c2428.mp3","Hay que hacer transbordo.":"../language-audio/d3ce81c5b5c1b9dea29a52f8.mp3","¿De qué andén sale el tren?":"../language-audio/fb07295ff34b5e9379e706c6.mp3","reserva":"../language-audio/e90e67e5b800a42a2b271b00.mp3","Tengo una reserva.":"../language-audio/cac135c67d1b765b4cbc3e9f.mp3","habitación":"../language-audio/752b18c86e071e6c8c31aac7.mp3","La habitación es tranquila.":"../language-audio/11044813f4925fa1087b750d.mp3","llave":"../language-audio/9493e6625f85e01eca86852a.mp3","No encuentro la llave.":"../language-audio/bca26c44f0d72b73f8956323.mp3","recepción":"../language-audio/7572b28962bacd8edc224988.mp3","Pregunta en recepción.":"../language-audio/8cc84c6f1879849a05b50c7d.mp3","baño":"../language-audio/97bf3df8959e99e6665f63de.mp3","El baño está al fondo.":"../language-audio/79a1997068a409917c620492.mp3","ducha":"../language-audio/91050ca8f3a69c9f6f9707f7.mp3","La ducha no funciona.":"../language-audio/7c1488ea16307ad73c108c14.mp3","toalla":"../language-audio/34bb6aacd68c4e41003ebac8.mp3","Necesito una toalla.":"../language-audio/37d83874e27aaffdd97b348e.mp3","ascensor":"../language-audio/f272710f2a6f4909cee2b181.mp3","Hay un ascensor.":"../language-audio/d22d27a0d66b909b3fc10568.mp3","equipaje":"../language-audio/1e83c924a5c8bfe535925763.mp3","Dejo aquí el equipaje.":"../language-audio/f5b40a9c50fc463913d43531.mp3","desayuno":"../language-audio/0f16b85897a5eac2fb23e72b.mp3","¿Está incluido el desayuno?":"../language-audio/f655e74cfcaa712226318ead.mp3","Tengo una reserva a nombre de Chen.":"../language-audio/fee048234bc8d47f5a764907.mp3","¿A qué hora es el desayuno?":"../language-audio/4547364fc15c6113d02bd190.mp3","¿Hay ascensor?":"../language-audio/37770be1f441ad17e1284be2.mp3","La llave no abre la puerta.":"../language-audio/ad8db3b22869246129907cd6.mp3","¿Podéis revisar la ducha?":"../language-audio/8838c558f21464cabc648605.mp3","¿Puedo dejar el equipaje aquí?":"../language-audio/55d5c0eed6fb4b9e10a3b0ba.mp3","Buenas tardes. ¿Tiene reserva?":"../language-audio/632540ce4e1975377f248bc5.mp3","Sí, a nombre de Chen, dos noches.":"../language-audio/17bc86b0190b73f5fe16c3ce.mp3","Aquí tiene la llave. ¿Necesita algo más?":"../language-audio/22b62008be325fab96437e0f.mp3","Sí, ¿a qué hora se sirve el desayuno?":"../language-audio/ba2555d871533c6f5b4155dd.mp3","La ventana está abierta.":"../language-audio/1813d1bd7a179d1f84a3873d.mp3","El baño está limpio.":"../language-audio/0515446b5fca7db622031b42.mp3","Mei llega a una pequeña pensión de Sevilla después de viajar en tren. Tiene una reserva para dos noches. En recepción confirma su nombre y pregunta por el desayuno. La recepcionista explica el horario y le entrega una llave. La habitación está en la segunda planta y hay ascensor. Al entrar, Mei ve que falta una toalla. Llama a recepción y pide una. Más tarde sale a pasear y deja la llave donde le han indicado.":"../language-audio/f636015aadd69c0e6b546916.mp3","Marcos llega a un alojamiento con su hermana. Han reservado una habitación con dos camas. La habitación es correcta, pero una lámpara no se enciende. Marcos baja a recepción para explicar el problema. La recepcionista ofrece enviar a alguien después de las seis. Como ellos quieren salir antes, acuerdan que revisen la lámpara mientras están fuera. Antes de irse, preguntan dónde pueden dejar el equipaje al día siguiente, después de salir de la habitación.":"../language-audio/0de8ff7531b1207c573432d1.mp3","Buenas tardes. ¿Tienes una reserva a tu nombre?":"../language-audio/c60a30f7aae4337ae6f61008.mp3","La habitación está lista.":"../language-audio/c401919a61a24bdb2e2e55df.mp3","Necesito otra llave.":"../language-audio/02483c2ad6e7a14b744e51cd.mp3","He reservado dos noches y tengo aquí el correo de confirmación.":"../language-audio/b6732b87e4e2088d8d3ebbb9.mp3","Salimos a las siete; ¿el desayuno empieza antes?":"../language-audio/52de563ac84415d34c25dac3.mp3","¿En qué planta está la habitación y hay ascensor?":"../language-audio/a4e28212cc2c4d615d3aaef5.mp3","La tarjeta abre la entrada, pero no abre mi habitación.":"../language-audio/e2517a8095806bdf30ba1532.mp3","La ducha está fría; ¿podéis comprobar el agua caliente?":"../language-audio/5947970bf785f40984be7955.mp3","¿Puedo dejar una maleta hasta las tres y recogerla después?":"../language-audio/ab7430d844a3b1a2eca8d199.mp3","Las habitaciones están limpias.":"../language-audio/ed05a32aa9065eef426878c0.mp3","El equipaje está aquí.":"../language-audio/5b26bb6830add8d7a5f6e4ef.mp3","piso":"../language-audio/65982ee50c491bf6f4fcbd5f.mp3","Vivo en un piso pequeño.":"../language-audio/7faf1d75f9564bc15931fe89.mp3","cocina":"../language-audio/27a9dd638dd2e8002d016a86.mp3","La cocina es luminosa.":"../language-audio/da05847579b601a8e6cd1094.mp3","salón":"../language-audio/4a8602e1be476e61cc8f3fc7.mp3","Estudio en el salón.":"../language-audio/361aa3b7d184badcbd2e6d1d.mp3","dormitorio":"../language-audio/b01a16d73845cb7b1c4edaa9.mp3","Mi dormitorio da al patio.":"../language-audio/c1b97797e91ddf3d94ef5492.mp3","levantarse":"../language-audio/56232d242cab23cbb41973d4.mp3","Me levanto temprano.":"../language-audio/0d7fb7f1b6b4dd1e1c7f6b18.mp3","acostarse":"../language-audio/ea3cef01924d191febf86402.mp3","Me acuesto a las once.":"../language-audio/7a316a7d660a579bfa36010e.mp3","limpiar":"../language-audio/5dfcb019f4d3d74a3b25422c.mp3","Limpio la cocina.":"../language-audio/5a5b6bb340a9a911fd5bb894.mp3","lavadora":"../language-audio/30b94a26a44218fbf8af5a2d.mp3","Pongo la lavadora por la tarde.":"../language-audio/13e5f322b311332ba7f13def.mp3","basura":"../language-audio/b0a661c0627921dae8193ea8.mp3","Saco la basura.":"../language-audio/b35757571f20760113c42fa7.mp3","compañero de piso":"../language-audio/9724718dffaa4315448fb63c.mp3","Mi compañero de piso cocina bien.":"../language-audio/3ab1b907ef2afb0e37399e4e.mp3","Vivo en un piso compartido.":"../language-audio/93dcbd12986fc4d8a9aeeffd.mp3","Me levanto a las siete y media.":"../language-audio/40580c6860f6cd661c1a0649.mp3","Normalmente desayuno en casa.":"../language-audio/d90e58bafa8bd2e09b06cb9c.mp3","¿Cuándo ponemos la lavadora?":"../language-audio/1dc3984dff1f7acac1218fce.mp3","Hoy me toca limpiar la cocina.":"../language-audio/0cd840dc59982f4b0d390351.mp3","¿Vosotros cenáis juntos?":"../language-audio/d0295b003c10faf019ea575b.mp3","¿Hoy te toca sacar la basura?":"../language-audio/51b2e18be82ff98b4233b583.mp3","Sí. ¿Tú puedes limpiar la mesa?":"../language-audio/62cdb15e3fc72668f0694636.mp3","Claro, después de cenar.":"../language-audio/7da42c8b244432c198c313a0.mp3","Perfecto. Mañana cocino yo.":"../language-audio/631f104d07a9ba4b15057e78.mp3","Me levanto a las siete.":"../language-audio/a64e188201d535356e1078d0.mp3","A veces cocinamos juntos.":"../language-audio/05ab220d699ed550c270b17c.mp3","Mei comparte un piso con Luis y Sara. Cada persona tiene su dormitorio, pero los tres usan la misma cocina y el mismo salón. Mei se levanta temprano porque su clase empieza a las nueve. Luis trabaja por la tarde y desayuna más tarde. Para organizarse, escriben las tareas en una hoja pegada a la nevera. Esta semana Mei limpia la cocina, Luis saca la basura y Sara compra los productos de limpieza.":"../language-audio/091523104586e44d879cc7ce.mp3","En el piso de Irene viven tres personas. Los miércoles suelen limpiar juntos, pero esta semana Irene tiene una reunión hasta tarde. Propone limpiar el baño el jueves por la mañana. Sus compañeros aceptan. David se encarga de la cocina y Lucía del salón el miércoles. También acuerdan no poner la lavadora durante la reunión de Irene porque hace mucho ruido. Después de organizar las tareas, preparan una cena sencilla con lo que hay en la nevera.":"../language-audio/eab167ac1724deda452a557e.mp3","¿Cómo sueles organizar tu día?":"../language-audio/710e12bdbb8c6ba0d34a0226.mp3","Me acuesto temprano.":"../language-audio/d69795086fae99098f4c4378.mp3","¿Os levantáis a las ocho?":"../language-audio/cb464581782cdd06b4634803.mp3","Vivo solo, aunque algunos fines de semana vienen amigos.":"../language-audio/29e6ed292f7067bfd6f0e38d.mp3","Entre semana me levanto temprano, pero los domingos duermo más.":"../language-audio/08f5133e14f69d62551d41a1.mp3","Casi nunca ceno en casa porque salgo tarde del trabajo.":"../language-audio/e3d1b668dc3a84306bbbdf65.mp3","¿Ponemos la lavadora antes de cenar para no molestar por la noche?":"../language-audio/e430c6e304427379977e593f.mp3","Esta semana me toca sacar la basura; ¿puedo cambiar el turno contigo?":"../language-audio/662ccfc4252c7b043c50814e.mp3","¿Os acostáis todos a la misma hora o tenéis horarios distintos?":"../language-audio/c66e8b80580199151d782be6.mp3","Nos levantamos a las siete.":"../language-audio/9294da07e9569d5519922800.mp3","¿A qué hora os acostáis?":"../language-audio/8f63fdd2add0ca10fc6080a3.mp3","Casi nunca como en casa.":"../language-audio/ba4cda74659ccdf70cadcd9a.mp3","cita":"../language-audio/432c09d9dfd3f35fb557db76.mp3","Necesito una cita.":"../language-audio/c6c65d936c6624ff2af5fa43.mp3","centro de salud":"../language-audio/390a878ab6f84199f49642a3.mp3","Busco el centro de salud.":"../language-audio/78484af1689aa7b5fc213d06.mp3","médico":"../language-audio/8d0b8414cbb561ffacc46ef6.mp3","Quiero hablar con un médico.":"../language-audio/61ef25a60188d6b729cb4b62.mp3","farmacia":"../language-audio/849a060277a8d84dbc3d92e6.mp3","La farmacia está cerca.":"../language-audio/56e55eda4641cf1bca77dc7a.mp3","dolor":"../language-audio/b03205d90c60ec7e40693643.mp3","Tengo dolor de cabeza.":"../language-audio/edda6dcb2806bcff4e66d6c8.mp3","garganta":"../language-audio/944676c9909f42c37c0ec5a3.mp3","Me duele la garganta.":"../language-audio/11ccad0620ac76cead92d83f.mp3","fiebre":"../language-audio/c2d9668cfaf767d80a5494b0.mp3","Tengo fiebre desde ayer.":"../language-audio/2eeafb154fbabe4dbfaa80c9.mp3","alergia":"../language-audio/085268e19b12d5f825278634.mp3","Tengo alergia a este medicamento.":"../language-audio/fff63430ad05a8ba0ed97940.mp3","medicamento":"../language-audio/0072e7a7ec3401d5959a8456.mp3","Tomo este medicamento.":"../language-audio/8241eac722e0e53be59e9f2c.mp3","intérprete":"../language-audio/0b9effe17ec386afaa77050d.mp3","¿Hay servicio de intérprete?":"../language-audio/c398f61c7f7f289601fea6f0.mp3","Quería pedir una cita.":"../language-audio/0351a1a2a1217b5302db3227.mp3","Me duele la cabeza desde ayer.":"../language-audio/1ee46fe37a75ec914acd3fd1.mp3","Me duelen las piernas.":"../language-audio/f8f426d48c38352320ae7333.mp3","¿Puede escribir las instrucciones?":"../language-audio/f6e7f4975c9b37475793c2ac.mp3","No hablo mucho español. ¿Hay ayuda lingüística?":"../language-audio/2c22e919a26ab6ca72bd249b.mp3","Buenos días, quería pedir una cita.":"../language-audio/06311e37f294a96f80b7b264.mp3","¿Qué le ocurre?":"../language-audio/728473e920f32350673f6802.mp3","Me duele la garganta desde ayer.":"../language-audio/db5b7e6c1cb08ddcbc010831.mp3","Vamos a comprobar las citas disponibles.":"../language-audio/5d4af06864f81a59b668af62.mp3","Me duelen los pies.":"../language-audio/33b2d2d241ad039478b94d4d.mp3","Mei lleva dos días con dolor de garganta y quiere consultar a un profesional. Llama a su centro de salud para preguntar por una cita. Antes de llamar, escribe cuándo empezó el dolor y qué medicamentos toma normalmente. Durante la conversación pide que hablen despacio. La persona de recepción le indica cómo comprobar las citas disponibles. Mei repite la información para confirmarla y guarda su nota para explicar los síntomas durante la consulta.":"../language-audio/57a9e330647894f864a6be80.mp3","Tomás llama a una clínica porque necesita cambiar la hora de una consulta. Tiene cita el jueves por la mañana, pero ese día trabaja. Pregunta si hay alguna hora disponible el viernes por la tarde. La recepcionista encuentra una a las cinco y le pide que confirme su nombre. Tomás acepta la nueva hora. Antes de colgar, pregunta qué documentos debe llevar y anota la respuesta para no olvidarla.":"../language-audio/d47e33e65779712050fc852a.mp3","¿Qué te pasa y desde cuándo te encuentras así?":"../language-audio/04eecbd7021e2410711e1620.mp3","¿Hay apoyo lingüístico?":"../language-audio/bc972ebf8017d1c4b790e20d.mp3","Necesito una cita para consultar un problema; ¿qué horas hay disponibles?":"../language-audio/b650d0906117c6b26c2d7be6.mp3","Me duele el hombro desde el domingo por la tarde.":"../language-audio/ba7c9bc36caad378b3aedca6.mp3","Me duelen los ojos desde hace dos días.":"../language-audio/e2b2bc54f2ad6aba5a2378e9.mp3","He tenido una reacción alérgica, pero no recuerdo el nombre del medicamento.":"../language-audio/4742e5b633c112b59760cd6c.mp3","¿Puede apuntar la fecha de la próxima visita para que no la confunda?":"../language-audio/a142e609f0405295d1962ebc.mp3","Me cuesta entender este formulario; ¿hay alguien que pueda ayudarme?":"../language-audio/82aca274a15c4edf856166b8.mp3","quedar":"../language-audio/7647b3b6a9e4f7ea86fdde0e.mp3","¿Quedamos el viernes?":"../language-audio/542af02338500fda722b98a3.mp3","invitar":"../language-audio/48780e1826eb4e66a428d729.mp3","Te invito a cenar.":"../language-audio/1be6b2211ff8591a95b55992.mp3","pasear":"../language-audio/4ab367dcd3c11166d5ee4cf4.mp3","Me gusta pasear.":"../language-audio/ad267c8036d1db043e21c64d.mp3","plan":"../language-audio/0f34a29f18999929169ac255.mp3","Tengo otro plan.":"../language-audio/9e32bc4d58b9221733ac1262.mp3","entrada":"../language-audio/0d9fa1d7eecd8279cb151a54.mp3","Compro dos entradas.":"../language-audio/eee75577423def79c0061d92.mp3","concierto":"../language-audio/ca47134a88c9306538fad78e.mp3","Vamos a un concierto.":"../language-audio/0eeb2c543da5e3d9b081245f.mp3","libre":"../language-audio/9b78f6543562c3d23556e75c.mp3","Estoy libre el sábado.":"../language-audio/36bb692e6547c0d07bfaa0bf.mp3","juntos":"../language-audio/8c650d753b55c094e668e8c6.mp3","Podemos ir juntos.":"../language-audio/6059d5f68d5e236649e1d081.mp3","quizá":"../language-audio/90188b6beab4ec4b358a912e.mp3","Quizá vaya mañana.":"../language-audio/8d26083011f19cfb0d7d856c.mp3","otra vez":"../language-audio/7a102052e748550b88b2fc1b.mp3","Podemos quedar otra vez.":"../language-audio/097c7f1647c18ed11549a16d.mp3","¿Te apetece dar un paseo?":"../language-audio/a38c399b0f074fb4ece5698e.mp3","Me encantaría, gracias.":"../language-audio/96144b6fa464b984e339c281.mp3","Lo siento, ya tengo otro plan.":"../language-audio/a84f19e114b911a37bb713d3.mp3","¿Y si quedamos el domingo?":"../language-audio/d210ab953f6c725725f3ad70.mp3","¿Venís vosotros también?":"../language-audio/92047a2ee81cb92835d7a732.mp3","Te confirmo mañana por la mañana.":"../language-audio/872aa8789560e219984291d4.mp3","¿Te apetece ir al cine el sábado?":"../language-audio/e2e2e2cccdaac958dba829e6.mp3","Ese día no puedo. ¿Y el domingo?":"../language-audio/fca5395da12d569fa57d3827.mp3","El domingo estoy libre por la tarde.":"../language-audio/f62cb97d4d70b392b4750470.mp3","Perfecto. Miramos las películas mañana.":"../language-audio/1f9fd2fecede79ff04f78f68.mp3","¿Te apetece tomar algo?":"../language-audio/e6b92628c3498ae5ddaeb604.mp3","Sara propone una merienda en el parque para celebrar el final del curso. Invita a Mei y a varios compañeros. Mei quiere ir, pero el sábado por la mañana tiene que trabajar. Sara explica que la merienda será por la tarde, a las seis. Cada persona puede llevar algo sencillo para compartir. Mei acepta y ofrece llevar fruta. Antes de despedirse, pregunta qué harán si llueve. Sara promete confirmar el lugar por mensaje el viernes.":"../language-audio/6411c3c076a7d733c49f5804.mp3","Diego invita a Paula a caminar por el río el sábado. Ella agradece la invitación, pero tiene una comida familiar ese día. Propone salir el domingo por la mañana. Diego acepta, aunque prefiere empezar después de las diez. Acuerdan verse a las diez y media junto al puente viejo. Paula llevará agua y Diego mirará la previsión del tiempo. Si hace demasiado calor, buscarán un recorrido con más sombra.":"../language-audio/4560ff9f572b5a4eadad94fc.mp3","¿Te apetece hacer algo juntos este fin de semana?":"../language-audio/9644222df588257a2122d06f.mp3","¿Venís a cenar?":"../language-audio/0f0a7181560d54fc36f9c648.mp3","¿Te apetece un paseo?":"../language-audio/e0f05f7bec7ce5c38fa37050.mp3","¿Te apetece ir en bici por el parque esta tarde?":"../language-audio/da8b7c3722318dd891d6a06d.mp3","Me encantaría ir; puedo llevar fruta para todos.":"../language-audio/6983c54a7909fae7db37f4ff.mp3","Hoy no puedo porque trabajo, pero el viernes estoy libre.":"../language-audio/8535e4f143ab6311f587a29c.mp3","¿Y si lo dejamos para la semana que viene?":"../language-audio/6260c0e5df42235b3adeb37c.mp3","¿Venís con los niños o vais a venir solos?":"../language-audio/0d4cb88e4d4444a6a3a7c057.mp3","Miro mi horario y te digo algo esta noche.":"../language-audio/d1fe7d3539740fb239504ec1.mp3","Me apetecen unas tapas.":"../language-audio/e6681d4c400a176928156261.mp3","Quedo con mis compañeros en la plaza.":"../language-audio/38bf59c4c5a67d69873b1b17.mp3","alquiler":"../language-audio/bb4cc1f4353a94685ec2c417.mp3","El alquiler es mensual.":"../language-audio/d9ac8fb0d86984660b82ffdd.mp3","gastos":"../language-audio/2d7719fdf3387d4325804012.mp3","¿Qué gastos están incluidos?":"../language-audio/8607f2c84f3f935d179ec8e7.mp3","fianza":"../language-audio/1085325c8b2fb2acf6c901d6.mp3","Quiero preguntar por la fianza.":"../language-audio/cc12c922f18b1aef3438eb0a.mp3","contrato":"../language-audio/45d1259771257cc60edee578.mp3","Necesito leer el contrato.":"../language-audio/c5371e97d2b06164ef1f9298.mp3","amueblado":"../language-audio/013de3ed617d957c436fa292.mp3","El piso está amueblado.":"../language-audio/9bb349546e92e63565e4bdaf.mp3","calefacción":"../language-audio/1e4fe097a59afcac69148a7e.mp3","¿Funciona la calefacción?":"../language-audio/8d441b778eb91723c22de230.mp3","humedad":"../language-audio/d24520f9d0be8b3af3f9edd4.mp3","Veo humedad en la pared.":"../language-audio/1ac4ca6850d16aa74db27a54.mp3","visita":"../language-audio/b0f00f4e956531bc4191478f.mp3","Concertamos una visita.":"../language-audio/7d1441e6d5e3f8bd4a547225.mp3","propietario":"../language-audio/54c5741b01e15faab42c46a5.mp3","Voy a hablar con el propietario.":"../language-audio/d6668e73ac67a25349ce01bc.mp3","disponible":"../language-audio/a8fd6a33858bad9ff85535e6.mp3","¿Sigue disponible el piso?":"../language-audio/0a9a212b7f24d88e6a41f6d7.mp3","¿Sigue disponible el piso del anuncio?":"../language-audio/36d7ebc6f2f5b202d0549504.mp3","Quería saber qué gastos están incluidos.":"../language-audio/25d2e6aee78e1870def26368.mp3","¿Podríamos visitarlo el jueves?":"../language-audio/b716105b3a612cb3b0ebe932.mp3","¿La calefacción funciona en todas las habitaciones?":"../language-audio/bd6280ad731f263d222f6194.mp3","Antes de decidir, necesito leer las condiciones.":"../language-audio/87f5e9b5d1d1be8aa605eed1.mp3","¿Me lo podéis enviar por escrito?":"../language-audio/ee9d47c722b97266535d85d5.mp3","Quería saber si los gastos están incluidos.":"../language-audio/64c3f7c2def3e6426e505cd9.mp3","El anuncio incluye la comunidad, pero no los suministros.":"../language-audio/751b91a764592a5abd77d4df.mp3","¿Podrías enviarme el detalle por escrito?":"../language-audio/55d5908b91988344c2e5bffc.mp3","Sí, y podemos concertar una visita.":"../language-audio/505ffc5007c7c57122bd8b7a.mp3","¿Podrías decirme cuánto cuesta al mes?":"../language-audio/6e103d3fd61934c783a5568d.mp3","Mei busca un piso más cerca del trabajo. Encuentra un anuncio con buenas fotos, pero no explica todos los gastos. Antes de concertar una visita, escribe al anunciante para preguntar por el alquiler mensual, los suministros y los muebles. También quiere saber si la calefacción funciona y cuándo estaría disponible la vivienda. Durante la visita tomará notas y revisará las condiciones con calma. No quiere decidir solo por las fotos ni por la cercanía al metro.":"../language-audio/10b68d9cfb6ecea4c724263f.mp3","Raúl visita dos pisos el mismo día. El primero está cerca de su oficina, pero tiene poca luz y no dispone de ascensor. El segundo queda más lejos, aunque es luminoso y tiene una habitación extra para trabajar. En ambos casos pregunta qué gastos se pagan aparte. La propietaria del segundo piso promete enviarle las condiciones por correo. Raúl decide esperar a leerlas antes de dar una respuesta, aunque le ha gustado mucho la vivienda.":"../language-audio/94e5eaa24de5d346702919c9.mp3","¿Qué te gustaría saber sobre el piso?":"../language-audio/17d47d65057209156279530e.mp3","¿Está amueblado?":"../language-audio/ea9c8cb56b9ee048aaa3d557.mp3","¿Qué gastos incluye?":"../language-audio/dc5e1ff058c5a4d895c1847e.mp3","He visto el anuncio de una habitación; ¿todavía se puede visitar?":"../language-audio/40fa9e91c3310777b0afec59.mp3","Quisiera saber si el precio incluye el agua y la electricidad.":"../language-audio/a6919a97f1c49259072cc72f.mp3","Trabajo por las tardes; ¿podríamos verla el sábado por la mañana?":"../language-audio/41500bb0d9722de7f8749d70.mp3","¿Hay humedad cerca de la ventana del dormitorio?":"../language-audio/df74caf25fae2c48c06e5845.mp3","Antes de firmar, quiero comparar las condiciones con las del anuncio.":"../language-audio/3916c88f73952d60018ec412.mp3","¿Podéis enviarme por correo el importe de la fianza y los gastos aparte?":"../language-audio/00c9fb84eb250a25ee6074e4.mp3","Quería saber si está amueblado.":"../language-audio/9729ecab94a6c8e944d7d65d.mp3","No sé qué gastos incluye.":"../language-audio/fc256b2f64b24809f043bb82.mp3","Dos habitaciones amuebladas.":"../language-audio/ceeb991a9498ae5bbfccc1a9.mp3","cambiar":"../language-audio/fa6c5df18e87cf3efe3c2a85.mp3","Necesito cambiar la cita.":"../language-audio/bb4ba05d376398f4209b2ef8.mp3","aplazar":"../language-audio/c22ffe9bffa29d2ee55e6cc6.mp3","Podemos aplazar la reunión.":"../language-audio/49c7afd2e37fe7f55971a91a.mp3","adelantar":"../language-audio/50479a13b4a580cffc972844.mp3","¿Se puede adelantar la visita?":"../language-audio/01bc24088518e7b0e2bed08b.mp3","hueco":"../language-audio/b4e4d5751a0d134ad7900215.mp3","¿Tenéis algún hueco mañana?":"../language-audio/3453d8d332da8c8820b4e81c.mp3","confirmación":"../language-audio/fc690df8bcb5872184a06a9e.mp3","Espero la confirmación.":"../language-audio/e4a456b65af334894b7ee7a0.mp3","imprevisto":"../language-audio/8d6b09edb73b3410e437db7b.mp3","Me ha surgido un imprevisto.":"../language-audio/5160152c05e621de606dcc09.mp3","disponibilidad":"../language-audio/fd6a8dd4e27f3cdbf8675a22.mp3","Envíame tu disponibilidad.":"../language-audio/52fc56668867095b9a96b2dc.mp3","anular":"../language-audio/8cebb85086b7fa45c22a2388.mp3","Tengo que anular la reserva.":"../language-audio/8e127c6a5eb47fcb9005d3bf.mp3","aviso":"../language-audio/87751dc35335d333a74cf696.mp3","Gracias por el aviso.":"../language-audio/edc03d6eb9453a494df6bc7e.mp3","franja horaria":"../language-audio/5936cdba88bd3fa506429bf7.mp3","Prefiero la franja de la tarde.":"../language-audio/62244db917592995620aac2a.mp3","¿Sería posible aplazar la cita?":"../language-audio/c8b36de0401d621e484397dc.mp3","Tengo disponibilidad el lunes por la mañana.":"../language-audio/042ec874466eca3998866870.mp3","¿Os vendría bien a las once?":"../language-audio/36bff36dec010059291fec89.mp3","Si no hay hueco, puedo esperar al jueves.":"../language-audio/469beb36386b4978bb86767f.mp3","Quedo pendiente de vuestra confirmación.":"../language-audio/d5a41f3a42c7b0b9a243c505.mp3","Necesito cambiar la cita del martes.":"../language-audio/86688b3d70841e49f55630bd.mp3","¿Qué día le vendría bien?":"../language-audio/a24dc8b4f58900259c53836b.mp3","El jueves por la mañana, si hay hueco.":"../language-audio/11a4166b92ab20b5053c14a2.mp3","Lo compruebo y le envío la confirmación.":"../language-audio/6455b8b3b86ab4d3f90e2eb3.mp3","¿Sería posible cambiar la cita?":"../language-audio/8e6450b4b3a8308cdf433833.mp3","¿Te vendría bien el lunes?":"../language-audio/34fe8e9e8ab6c2060d5ac58e.mp3","Mei ha pedido que revisen la lavadora de su piso. La visita estaba prevista para el miércoles por la mañana, pero le han cambiado una reunión de trabajo. Llama al servicio técnico en cuanto lo sabe. Explica el problema y ofrece dos alternativas: el jueves por la tarde o el viernes a primera hora. La persona que la atiende consulta la agenda. Finalmente acuerdan el jueves y Mei pide una confirmación por mensaje para avisar a su compañero de piso.":"../language-audio/9499e85b5d0f4f7c001244e0.mp3","La profesora de fotografía escribe al grupo para avisar de un cambio. La clase del viernes no puede celebrarse porque la sala estará ocupada. Ofrece recuperarla el sábado por la mañana o el lunes por la tarde. Cada estudiante debe responder antes del miércoles. Sonia puede ir el lunes, pero trabaja el sábado. Responde al correo y pregunta si deben llevar las mismas fotos que prepararon para la clase original. La profesora confirma que sí.":"../language-audio/28c8220006237fb0efcf25a0.mp3","¿Necesitas confirmar la cita o cambiarla?":"../language-audio/3c007b07b4accda1ce93b0c0.mp3","¿Sería posible cambiar la hora?":"../language-audio/07d07754b7b73197e4aa89e1.mp3","Me vendría bien el viernes.":"../language-audio/f30a17690d9e135a4ad58d3e.mp3","Me han cambiado el turno y no puedo acudir a la hora prevista.":"../language-audio/16e6d29a68daf74eff284916.mp3","¿Sería posible adelantar la visita a la mañana?":"../language-audio/6b02aa187aa906be5e0eed11.mp3","Estoy disponible el martes después de las cinco o el miércoles antes de comer.":"../language-audio/1659a98579cc0cf8a84527a6.mp3","¿Os vendría bien que nos reuniéramos a mediodía?":"../language-audio/69f48a80b7cf77c066af2eb3.mp3","Si esta semana está completa, prefiero reservar para la siguiente.":"../language-audio/0c60863d1d7900f3e408706f.mp3","Cuando tengáis la nueva hora, enviadme también la dirección.":"../language-audio/f178d25a141a2bd1fe80669f.mp3","¿Podría cambiar la cita?":"../language-audio/5aa8c53dbe00e8061b974cee.mp3","Me vendría bien el jueves.":"../language-audio/0a7343f187130704b6ff2f59.mp3","Si no hay hueco, espero.":"../language-audio/f694b0499bb794b4b065b10f.mp3","avería":"../language-audio/1847e62a7cec396ea903eae5.mp3","Hay una avería en el horno.":"../language-audio/f6840631d2c1a47152279d50.mp3","fontanero":"../language-audio/a9ec5e05bb6aa22585da4902.mp3","Necesitamos un fontanero.":"../language-audio/09ca80c56222584ca9d21c3d.mp3","técnico":"../language-audio/c4597a8113bfac7a6cbf78c8.mp3","El técnico viene mañana.":"../language-audio/7da20c8fbbee6c99983dc04d.mp3","presupuesto":"../language-audio/6efebb597a30b9aa4250794b.mp3","Quería un presupuesto por escrito.":"../language-audio/c9ccd0ebffbcedfae70bcd59.mp3","grifo":"../language-audio/59feebf2804637f4aeba724b.mp3","El grifo gotea.":"../language-audio/c5064687a87f242140340cc0.mp3","enchufe":"../language-audio/9fe08e6478f1450b9eb7ff4d.mp3","Este enchufe no funciona.":"../language-audio/565074fe7296a3b631babf86.mp3","nevera":"../language-audio/0e8b0f3c3df993abca979ea1.mp3","La nevera no enfría.":"../language-audio/7337c2217e515651c75717a3.mp3","reparación":"../language-audio/72693174b30534d260e182b5.mp3","¿Cuánto tarda la reparación?":"../language-audio/f7e800b3f790ea38825e4e71.mp3","pieza":"../language-audio/558ccce9baf42d04babaf851.mp3","Hay que cambiar una pieza.":"../language-audio/8cc49601d72afba0698f4dfd.mp3","desplazamiento":"../language-audio/bec311714ffadd71c9620a77.mp3","¿El precio incluye el desplazamiento?":"../language-audio/533b60f6d78d5ef9632bfda4.mp3","El grifo lleva tres días goteando.":"../language-audio/9664cda72956a345572bbb9a.mp3","La nevera ha dejado de enfriar.":"../language-audio/d65e942a11447216aceb3ecc.mp3","¿El presupuesto incluye las piezas?":"../language-audio/e1528ff101e3ae98e536bcbf.mp3","Antes de reparar, avisadme del coste.":"../language-audio/0f574ba8436631e9b230c69d.mp3","Puedo estar en casa a partir de las cuatro.":"../language-audio/2f4c01d5b987556a7a5b69ea.mp3","Si necesitáis una foto, os la envío.":"../language-audio/39a5b2cdcc7360ba3bcf7a49.mp3","El grifo lleva dos días goteando.":"../language-audio/a644c7aea8ee87eecc72c17a.mp3","¿Puede enviarnos una foto?":"../language-audio/0115a103e849e1ebda4e4b23.mp3","Sí. ¿La visita tiene un coste aparte?":"../language-audio/9ac16dfc412daaa2a25c69f4.mp3","Le enviaré el detalle antes de confirmar.":"../language-audio/4ef4293df1f269956bc419d8.mp3","La nevera lleva dos días sin enfriar.":"../language-audio/83f0f38947802bb5f3d49c47.mp3","El horno ha dejado de funcionar.":"../language-audio/66b83c219d059b476d712e84.mp3","En el piso de Mei, el grifo de la cocina gotea desde hace varios días. Ella contacta con un servicio de reparación y describe lo que ocurre. Le piden una foto para preparar la visita. Mei pregunta si el precio anunciado incluye el desplazamiento y si las piezas se cobran aparte. Antes de aceptar, quiere recibir el detalle por escrito. También acuerda que el técnico avise antes de llegar, porque necesita salir del trabajo a una hora concreta.":"../language-audio/79a2d8bc7ddad18f95792528.mp3","El horno de Alicia se apaga pocos minutos después de encenderlo. Llama a un técnico y explica que el problema empezó el lunes. Él le propone una visita el jueves entre las diez y las doce. Alicia acepta esa franja, pero pide que le llamen media hora antes. También pregunta si recibirá un presupuesto antes de cambiar alguna pieza. El técnico responde que revisará primero el aparato y explicará las opciones sin empezar la reparación hasta que ella decida.":"../language-audio/272fbc5b929d1ec3adf41fac.mp3","¿Puedes describir qué no funciona?":"../language-audio/e76efca66f7fc28f0914c145.mp3","El grifo no cierra bien.":"../language-audio/4c42f5fa919575864e42dcf8.mp3","Necesito un presupuesto.":"../language-audio/7dcc6a449a974b639ad91def.mp3","El enchufe lleva una semana falland  por semana. La próxima semana tiene un viaje de trabajo y faltará a una clase. Escribe a su profesora antes de viajar para explicar la situación. Pregunta qué contenidos estudiará el grupo y cómo puede recuperar el trabajo. La profesora le envía una lectura y le propone una breve tutoría al volver. Mei revisa también la fecha de entrega del ejercicio para organizar su tiempo durante el viaje.":"../language-audio/748983c97007c06d98bbca12.mp3","Álex quiere apuntarse a un taller de escritura. Antes de matricularse, pregunta si necesita experiencia previa. La coordinadora explica que no, pero cada participante debe llevar un texto breve a la primera sesión. El taller se celebra los jueves por la tarde durante seis semanas. Álex tiene libre ese horario, aunque no puede acudir el último jueves. Pregunta cómo se gestiona una ausencia y espera la respuesta antes de completar la inscripción.":"../language-audio/9ad5d44ea753812f2528c44a.mp3","¿Qué te gustaría aprender en este curso?":"../language-audio/7ad08fed1404bd460ca6d450.mp3","Tengo que entregar los apuntes.":"../language-audio/fa9dba9771ecc379500b6136.mp3","¿Hay tutoría esta semana?":"../language-audio/9e694b6610398efc17cdc945.mp3","El jueves tengo prácticas y no podré ir al seminario.":"../language-audio/6cbee3179853984d4749345e.mp3","¿Puedo consultar una grabación para ponerme al día?":"../language-audio/ca48fa999669f9d5d2ac1615.mp3","¿Tenemos que subir el trabajo a la plataforma o se entrega en papel?":"../language-audio/9fe4cb2d131de2a96ddc845e.mp3","Debo repasar los verbos antes de hacer los ejercicios del examen.":"../language-audio/00ee37cc9196c2b9bfb7f080.mp3","Me gustaría concertar una tutoría para comentar la corrección del trabajo.":"../language-audio/a3dca4a3ac3feb8bd46f3a9b.mp3","Quería saber si aún quedan plazas y cuándo termina la matrícula.":"../language-audio/ce698e5e912dbe549cb57c2e.mp3","Tengo que entregar el trabajo.":"../language-audio/6eb74bbc01f01f0fbe57103e.mp3","Asisto a clase.":"../language-a ,"No reconozco un cargo. ¿Cómo puedo revisarlo?":"../language-audio/3d02851101fbc1c0eb4ef7d3.mp3","Podemos indicarle los pasos por el canal oficial.":"../language-audio/7d593cf70b97145b01cfd151.mp3","Tengo el justificante, pero no enviaré mis claves.":"../language-audio/a7b3664289c1e97458b41c3d.mp3","De acuerdo. Primero comprobamos qué operación es.":"../language-audio/d86b8117a6dc6d3601b8b4f7.mp3","No he recibido la confirmación.":"../language-audio/7f8a4585fa7219c26625a932.mp3","Nunca comparto mi clave.":"../language-audio/12a555abd5f0e012bc064296.mp3","Al revisar su cuenta, Mei ve un cargo que no recuerda. Busca sus recibos para comprobar si corresponde a una compra reciente. Como sigue teniendo dudas, contacta con el banco por el canal oficial que utiliza habitualmente. Describe la fecha y el importe sin compartir sus claves. Pregunta qué pasos debe seguir y cómo guardar una constancia de la consulta. Después anota la respuesta para poder hacer un seguimiento si el problema no se aclara.":"../language-audio/529b7be6dd2424f0fbf54dff.mp3","Después de comprar una mesa, Iván consulta su aplicación bancaria y ve dos movimientos del mismo importe. Conserva el recibo de la tienda y comprueba que solo hizo una compra. Primero pregunta al comercio si hubo algún problema al cobrar. Luego contacta con su banco por un canal oficial para explicar lo ocurrido y consultar los pasos siguientes. No sabe todavía si ambos movimientos son cargos definitivos. Guarda las respuestas y decide revisar de nuevo el estado al día siguiente.":"../language-audio/9e5859bc488149f3ea2fc6cd.mp3","¿Qué duda tienes sobre este pago?":"../language-audio/10149227b7ca8e6480a1bb0f.mp3","No reconozco este pago.":"../language-audio/fe3f06bf76cd335811a7ff8c.mp3","Veo dos cargos con el mismo importe y quiero comprobar si están duplicados.":"../language-audio/a781033c49c4f4462e349fc3.mp3","He anotado la referencia de la transferencia para poder consultarla.":"../language-audio/8645fe20f9d28e1a376808a3.mp3",
