r":"甲","text":"Pode enviar-me essa informação por escrito?","zh":"您能把这项信息以书面形式发给我吗？"},{"speaker":"乙","text":"Sim, envio uma proposta para poder ler com calma.","zh":"可以，我发一份方案，让您从容阅读。"}],"reading":{"title":"看房之后","text":"Depois de visitar um apartamento, a Mei recebe uma proposta de arrendamento. A casa parece adequada, mas ela tem dúvidas sobre as despesas e o prazo. Envia perguntas à senhoria e pede uma cópia do documento para ler com calma. Quer também saber como são comunicados os problemas da casa. Uma amiga ajuda-a com o vocabulário. Se uma cláusula continuar pouco clara, a Mei pretende pedir esclarecimento profissional antes de tomar uma decisão.","zh":"看过一套公寓后，梅收到一份租赁方案。房子看起来合适，但她对费用和期限有疑问。她给房东发问题，并要一份文件副本，以便从容阅读。她还想知道如何报告房屋问题。一位朋友帮她理解词汇。如果某项条款仍不清楚，梅打算在作决定前寻求专业解释。"},"assessment":{"reading":{"title":"比较两份方案","text":"O Chen compara dois quartos. O primeiro tem uma renda mais baixa, mas a proposta não esclarece as despesas da internet. O segundo inclui internet e fica mais perto do trabalho. O Chen pede ao primeiro senhorio informação por escrito sobre os custos e o prazo. Ainda não escolheu nenhum quarto. Quer ler os documentos completos e esclarecer uma cláusula sobre reparações antes de decidir qual proposta corresponde melhor às suas necessidades."},"questions":[{"prompt":"第一间房的方案有什么不清楚？","options":["网络费用","房屋位置","家具颜色"],"answer":0,"explanation":"方案未说明 despesas da internet。"},{"prompt":"第二间房有什么位置优势？","options":["靠近机场","靠近工作地点","靠近海边"],"answer":1,"explanation":"fica mais perto do trabalho。"},{"prompt":"陈目前决定了吗？","options":["已选第一间","已选第二间","尚未选择"],"answer":2,"explanation":"Ainda não escolheu nenhum quarto。"},{"prompt":"他还想弄清哪类条款？","options":["维修","宠物食品","火车票"],"answer":0,"explanation":"cláusula sobre reparações。"}],"writing":"写一封租房询问信，询问四项具体条件；对不理解的条款请求解释。","speaking":"模拟看房后与房东核对费用、期限和维修沟通方式，最后请求书面说明。"},"story":{"id":"pt-13","npc":"Inês","place":"看房现场","scene":"房间看上去不错，但你还需要了解租金、费用和条件。不要急着答应。","text":"Que informações gostaria de confirmar sobre a casa?","zh":"您想确认这所房子的哪些信息？","icon":"home"},"support":{"id":"pt-13","pronunciation":{"focus":"ão 与重读位置","explanation":"caução、reparação 的词尾都含鼻化 ão；contrato 重音在 tra，不要按中文逐字等长念。","examples":[{"text":"A caução.","zh":"押金。"},{"text":"Uma reparação.","zh":"一次维修。"}]},"grammarNotes":["Gostava de saber se… 中 se 表“是否”，引出间接疑问，不等于条件句“如果”。","间接疑问保留陈述式语序：quando termina o contrato；不要加一个没有作用的 é 来仿照汉语“是什么时候”。","enviar-me 在肯定请求中可附着在原形后；por escrito 是以书面形式，不是 para escrito。"],"cultureNote":"在葡萄牙租房交流中，可要求把费用和维修安排写清楚；本课程只训练提问，不保证某项费用必然包含，也不解释合同的法律效力。","vocabularyNotes":[{"head":"renda","note":"renda 为阴性，租金可说 pagar a renda；不要与英语 rent 的拼写混淆。"},{"head":"caução","note":"caução 是阴性，指押金；询问金额可说 Qual é o valor da caução?。"},{"head":"cláusula","note":"cláusula 为阴性且重音在 cláus；uma cláusula do contrato 指合同条款。"}],"transfer":[{"id":"pt-13-transfer-1","prompt":"询问网络费用是否包含","text":"Gostava de saber se a internet está incluída na renda.","zh":"我想知道房租是否包含网络费。","explanation":"internet 为阴性，分词用 incluída；se 表是否。"},{"id":"pt-13-transfer-2","prompt":"询问押金何时支付","text":"Pode explicar quando devo pagar a caução?","zh":"您能说明我应何时付押金吗？","explanation":"when 信息放在 quando 从句，devo 后接 pagar。"},{"id":"pt-13-transfer-3","prompt":"签字前核实维修责任","text":"Antes de assinar, queria esclarecer quem trata das reparações.","zh":"签字前，我想弄清谁负责维修。","explanation":"antes de+原形；quem 引出责任人的间接疑问。"},{"id":"pt-13-transfer-4","prompt":"说明某项费用每月另付","text":"O consumo de gás é pago à parte todos os meses.","zh":"燃气费用每月另行支付。","explanation":"主语 consumo 阳性单数，分词 pago 随之配合。"},{"id":"pt-13-transfer-5","prompt":"索要相关合同条款副本","text":"Pode enviar-me uma cópia dessa cláusula?","zh":"您能发给我那一条款的副本吗？","explanation":"dessa=de+essa；uma cópia de 说明副本对象。"},{"id":"pt-13-transfer-6","prompt":"承诺阅读后再确认疑问","text":"Vou ler a proposta e depois envio as minhas perguntas.","zh":"我会先读提议，然后发出我的问题。","explanation":"先后动作由 e depois 连接，不把读完误写为已经接受。"}],"grammarCheck":[{"prompt":"选择表达“我想知道是否包含水费。”且语法、用法正确的一项。","options":["Gostava de saber se a água está incluída.","Gostava saber se a água está incluída.","Gostava de saber se a água está incluído."],"answer":0,"explanation":"gostava de 后接 saber；água 阴性，对应 incluída。"},{"prompt":"选择表达“您能解释合同何时结束吗？”且语法、用法正确的一项。","options":["Pode explicar quando terminar o contrato?","Pode explicar quando termina o contrato?","Pode explicar quando termina a contrato?"],"answer":1,"explanation":"此处询问合同的既定终止时间用 termina；contrato 阳性，冠词 o。"},{"prompt":"选择表达“决定前，我想弄清费用。”且语法、用法正确的一项。","options":["Antes de decidir, queria esclarecer de as despesas.","Antes de decido, queria esclarecer as despesas.","Antes de decidir, queria esclarecer as despesas."],"answer":2,"explanation":"antes de 后接原形 decidir；esclarecer 直接接宾语，不插入 de。"}],"writingChecklist":["是否用 se/quem/quando 清楚引出疑问？","费用项目和是否包含是否分别表述？","是否将口头信息请求为书面确认？"],"speakingFollowups":["如果对方只说“费用另付”，你还要问哪些细节？","你怎样询问一项条款的具体含义？","看完提议后发现数字不同，你会怎样核实？"]}},{"id":"pt-14","number":14,"title":"预约与公共服务沟通","level":"B1","stage":"intermediate","goal":"能说明办理目的、确认材料并更改预约。","grammar":{"title":"条件句 se 与将来虚拟式","explanation":"Se faltar um documento, contacto o serviço 表达未来可能发生的条件；faltar 在这里是将来虚拟式，与该动词不定式同形，并不是现在时 falta。请求中可用 seria possível…；服务流程与所需文件应向具体机构核对。","examples":[{"text":"Se faltar algum documento, volto a contactar o serviço.","zh":"如果缺文件，我会再次联系该机构。"},{"text":"Seria possível alterar a marcação?","zh":"可以更改预约吗？"}]},"vocab":[{"head":"marcação","zh":"预约","example":"Tenho uma marcação para amanhã.","exampleZh":"我预约了明天。","icon":"time"},{"head":"atendimento","zh":"接待；办事服务","example":"O atendimento começa às nove.","exampleZh":"办事服务九点开始。","icon":"work"},{"head":"documento","zh":"文件；证件","example":"Que documento devo levar?","exampleZh":"我应带什么文件？","icon":"study"},{"head":"formulário","zh":"表格","example":"Preciso de preencher o formulário.","exampleZh":"我需要填写表格。","icon":"work"},{"head":"comprovativo","zh":"证明材料","example":"Este comprovativo é suficiente?","exampleZh":"这份证明材料足够吗？","icon":"study"},{"head":"disponível","zh":"可用的；有空的","example":"Há uma hora disponível?","exampleZh":"有可预约的时间吗？","icon":"time"},{"head":"adiar","zh":"推迟","example":"Preciso de adiar a marcação.","exampleZh":"我需要推迟预约。","icon":"time"},{"head":"cancelar","zh":"取消","example":"Posso cancelar pela internet?","exampleZh":"我能在线取消吗？","icon":"time"},{"head":"confirmar","zh":"确认","example":"Quero confirmar o horário.","exampleZh":"我想确认时间。","icon":"talk"},{"head":"balcão","zh":"柜台","example":"Onde fica o balcão de informações?","exampleZh":"咨询柜台在哪里？","icon":"work"}],"lessons":[{"id":"pt-14-1","text":"Se faltar algum documento, volto a contactar o serviço.","zh":"如果缺文件，我会再次联系该机构。","tip":"se 引出未来可能条件，faltar 为将来虚拟式。"},{"id":"pt-14-2","text":"Seria possível alterar a marcação?","zh":"可以更改预约吗？","tip":"seria possível 是委婉询问。"},{"id":"pt-14-3","text":"Tenho uma marcação, mas não posso ir nessa data.","zh":"我有预约，但那个日期不能去。","tip":"nessa data 指前述日期。"},{"id":"pt-14-4","text":"Pode indicar outra data disponível?","zh":"您能提供另一个可预约日期吗？","tip":"indicar 表示告知或指出。"},{"id":"pt-14-5","text":"Há algum documento que deva preparar?","zh":"有什么文件是我应该准备的吗？","tip":"deva 表达尚待确认的要求。"},{"id":"pt-14-6","text":"Consulte a lista enviada com a confirmação.","zh":"请查看随确认信息发出的清单。","tip":"以本次确认资料核实要求。"}],"dialogue":[{"speaker":"甲","text":"Tenho uma marcação, mas não posso ir nessa data.","zh":"我有预约，但那个日期不能去。"},{"speaker":"乙","text":"Pode indicar outra data disponível?","zh":"您能提供另一个可预约日期吗？"},{"speaker":"甲","text":"Há algum documento que deva preparar?","zh":"有什么文件是我应该准备的吗？"},{"speaker":"乙","text":"Consulte a lista enviada com a confirmação.","zh":"请查看随确认信息发出的清单。"}],"reading":{"title":"更改办事时间","text":"A Li tinha uma marcação num serviço municipal, mas recebeu um novo horário de trabalho. Como as horas coincidem, contacta o serviço para pedir outra data. Explica o motivo de forma breve e pergunta se pode manter os documentos já preparados. A funcionária envia uma nova confirmação e uma lista para consultar. A Li guarda a mensagem e verifica a morada do balcão, pois o atendimento pode ser num edifício diferente.","zh":"小李原本预约了市政服务，但收到了新的工作时间。由于时间冲突，她联系机构申请另一个日期。她简短说明原因，询问已准备的文件是否仍可使用。工作人员发送新的确认信息和供查看的清单。小李保存消息，并核对柜台地址，因为办事地点可能在另一栋楼。"},"assessment":{"reading":{"title":"确认所需材料","text":"O Liu marcou um atendimento para sexta-feira de manhã. Ao ler a confirmação, percebe que não sabe qual comprovativo de morada deve apresentar. Em vez de adivinhar, envia uma pergunta ao serviço e pede exemplos dos documentos aceites para o seu caso. A resposta chega na quinta-feira e indica também um novo balcão no mesmo edifício. O Liu prepara os documentos, guarda a resposta e confirma a hora antes de sair de casa."},"questions":[{"prompt":"刘预约在何时？","options":["周四下午","周五上午","周六晚上"],"answer":1,"explanation":"sexta-feira de manhã。"},{"prompt":"他对什么有疑问？","options":["车票价格","午餐地点","住址证明材料"],"answer":2,"explanation":"qual comprovativo de morada deve apresentar。"},{"prompt":"回复还说明什么变化？","options":["同楼内更换柜台","改到另一个城市","预约取消"],"answer":0,"explanation":"novo balcão no mesmo edifício。"},{"prompt":"刘如何处理疑问？","options":["自行猜测","向机构询问","让邻居代签"],"answer":1,"explanation":"他发送问题并要求适用于自身情况的例子。"}],"writing":"写一封更改预约邮件，说明原时间、简短原因、两个可行时间并请求确认。","speaking":"模拟致电办事机构，确认目的、地点和针对本人的材料要求。"},"story":{"id":"pt-14","npc":"Rui","place":"办事服务台","scene":"你有一项待办事务。先说明目的，再核对本次预约和材料要求。","text":"Tem uma marcação ou precisa de pedir uma?","zh":"您已有预约，还是需要预约？","icon":"time"},"support":{"id":"pt-14","pronunciation":{"focus":"重音符号与鼻化尾音","explanation":"marcação 的 ção 含 s 音与鼻化元音；disponível 重音在 ní，最后 l 的实现随口音变化，不读作独立音节。","examples":[{"text":"Uma marcação.","zh":"一个预约。"},{"text":"Está disponível?","zh":"有空吗？"}]},"grammarNotes":["Se faltar algum documento 中 faltar 是将来虚拟式，恰好与原形同形；不能因形式相同就把所有将来条件都概括为现在时。","可能的未来条件常用 se+将来虚拟式：se não puder ir；已经现实的条件可用现在直陈式。","Há algum documento que deva preparar? 中 deva 是现在虚拟式，表达尚不确定是否存在的所需文件。"],"cultureNote":"葡萄牙公共服务的预约渠道、材料和办理地点各不相同；可请求官方确认，不把教学例句中的某个文件或日期视为实际要求。","vocabularyNotes":[{"head":"marcação","note":"marcação 为阴性；fazer/alterar/cancelar uma marcação 分别是预约、改期、取消。"},{"head":"comprovativo","note":"comprovativo 为阳性，指证明材料；de morada 可说明所证明的信息。"},{"head":"adiar","note":"adiar 是向后推迟；alterar a data 只表示更改日期，不一定更晚。"}],"transfer":[{"id":"pt-14-transfer-1","prompt":"说明材料不足会先询问","text":"Se faltarem documentos, peço esclarecimentos antes de sair de casa.","zh":"如果缺文件，我会出门前先询问清楚。","explanation":"复数 documentos 对应 faltarem，将来条件用将来虚拟式。"},{"id":"pt-14-transfer-2","prompt":"礼貌询问能否改成上午","text":"Seria possível passar a marcação para a manhã?","zh":"能否把预约改到上午？","explanation":"seria possível 缓和请求；para 标示新的时段。"},{"id":"pt-14-transfer-3","prompt":"解释预约和工作冲突","text":"Tenho uma marcação na terça-feira, mas trabalho nesse dia.","zh":"我周二有预约，不过那天要上班。","explanation":"nesse dia 回指明确日期，避免模糊地说那天。"},{"id":"pt-14-transfer-4","prompt":"询问下周是否有空档","text":"Pode indicar um horário disponível para a próxima semana?","zh":"您能告知下周一个可预约的时段吗？","explanation":"disponível 修饰阳性 horário，但形式本身不变。"},{"id":"pt-14-transfer-5","prompt":"询问是否需要带复印件","text":"É necessário levar uma cópia do documento?","zh":"需要带证件复印件吗？","explanation":"é necessário+原形；uma cópia do 明确材料。"},{"id":"pt-14-transfer-6","prompt":"提醒核对确认信地址","text":"Verifique a morada indicada na mensagem de confirmação.","zh":"请核对确认消息上注明的地址。","explanation":"indicada 与阴性 morada 配合；verifique 是礼貌指令。"}],"grammarCheck":[{"prompt":"选择表达“如果缺文件，我会再次联系该机构。”且语法、用法正确的一项。","options":["Se falta algum documento amanhã, volto contactar o serviço.","Se faltar algum documento, volto a contactar o serviço.","Se faltar algum documento, volto a contacto o serviço."],"answer":1,"explanation":"未来的可能条件用 faltar；voltar a 后必须接原形 contactar，且不能漏 a。"},{"prompt":"选择表达“可以更改预约吗？”且语法、用法正确的一项。","options":["Seria possível altera a marcação?","Seriam possível alterar a marcação?","Seria possível alterar a marcação?"],"answer":2,"explanation":"seria possível 后用原形 alterar；非人称结构保持第三人称单数 seria。"},{"prompt":"选择表达“我有预约，但那个日期不能去。”且语法、用法正确的一项。","options":["Tenho uma marcação, mas não posso ir nessa data.","Tenho um marcação, mas não posso ir nessa data.","Tenho uma marcação, mas não posso vou nessa data."],"answer":0,"explanation":"marcação 阴性配 uma；posso 后接原形 ir，不接变位 vou。"}],"writingChecklist":["未来条件中的动词是否选对形式？","请求中是否清楚写出原日期和希望的新时段？","材料与地点是否向相关服务确认？"],"speakingFollowups":["如果只有更晚的日期可选，你会怎样回应？","对方没有说明原件或复印件，你怎样问？","你如何请求书面确认预约变更？"]}},{"id":"pt-15","number":15,"title":"工作请求与协作","level":"B1","stage":"intermediate","goal":"能说明任务、请求协助并协商截止时间。","grammar":{"title":"条件式礼貌请求与目的","explanation":"Poderia ajudar-me… 比直接命令更委婉。para + 原形表达目的；当动作主体不同时，可用 para que 并搭配虚拟式。本章先练常用请求。","examples":[{"text":"Poderia rever este ficheiro antes da reunião?","zh":"您能在开会前复核这个文件吗？"},{"text":"Envio o rascunho para receber os teus comentários.","zh":"我发送草稿，以便收到你的意见。"}]},"vocab":[{"head":"tarefa","zh":"任务","example":"Esta tarefa demora uma hora.","exampleZh":"这项任务需要一小时。","icon":"work"},{"head":"prazo de entrega","zh":"交付期限","example":"Qual é o prazo de entrega?","exampleZh":"交付期限是什么时候？","icon":"work"},{"head":"reunião","zh":"会议","example":"A reunião começa às dez.","exampleZh":"会议十点开始。","icon":"work"},{"head":"ficheiro","zh":"文件","example":"Enviei o ficheiro correto.","exampleZh":"我发了正确的文件。","icon":"work"},{"head":"anexo","zh":"附件","example":"O relatório segue em anexo.","exampleZh":"报告随信附上。","icon":"work"},{"head":"equipa","zh":"团队","example":"A equipa precisa de ajuda.","exampleZh":"团队需要帮助。","icon":"work"},{"head":"prioridade","zh":"优先事项","example":"Esta tarefa é a prioridade?","exampleZh":"这项任务是优先事项吗？","icon":"work"},{"head":"rever","zh":"复核；修订","example":"Pode rever o texto?","exampleZh":"您能复核文字吗？","icon":"work"},{"head":"partilhar","zh":"分享；共享","example":"Vou partilhar a pasta.","exampleZh":"我要共享文件夹。","icon":"work"},{"head":"concluir","zh":"完成","example":"Espero concluir hoje.","exampleZh":"我希望今天完成。","icon":"work"}],"lessons":[{"id":"pt-15-1","text":"Poderia rever este ficheiro antes da reunião?","zh":"您能在开会前复核这个文件吗？","tip":"poderia 让请求更委婉。"},{"id":"pt-15-2","text":"Envio o rascunho para receber os teus comentários.","zh":"我发送草稿，以便收到你的意见。","tip":"para + 原形表示目的。"},{"id":"pt-15-3","text":"Consigo terminar amanhã, mas preciso dos dados de hoje.","zh":"我能明天完成，但需要今天的数据。","tip":"先说明可交付时间，再提出依赖条件。"},{"id":"pt-15-4","text":"Eu envio os dados até às quatro.","zh":"我会在四点前发送数据。","tip":"até às 表示最晚时间。"},{"id":"pt-15-5","text":"Se houver alterações, podes avisar-me?","zh":"如果有变化，你能通知我吗？","tip":"houver 为 haver 的将来虚拟式，指可能发生的变化。"},{"id":"pt-15-6","text":"Claro, deixo uma mensagem na pasta da equipa.","zh":"当然，我会在团队文件夹里留一条消息。","tip":"明确协作信息放在哪里。"}],"dialogue":[{"speaker":"甲","text":"Consigo terminar amanhã, mas preciso dos dados de hoje.","zh":"我能明天完成，但需要今天的数据。"},{"speaker":"乙","text":"Eu envio os dados até às quatro.","zh":"我会在四点前发送数据。"},{"speaker":"甲","text":"Se houver alterações, podes avisar-me?","zh":"如果有变化，你能通知我吗？"},{"speaker":"乙","text":"Claro, deixo uma mensagem na pasta da equipa.","zh":"当然，我会在团队文件夹里留一条消息。"}],"reading":{"title":"重新安排任务","text":"A Mei prepara uma apresentação com a equipa. Precisa de dados que ainda não recebeu, por isso avisa o colega antes do prazo. Explica o que já concluiu e pede que ele envie a tabela até ao fim da tarde. Propõe entregar um rascunho no dia seguinte, para haver tempo de revisão. O colega aceita e confirma quais são os números mais recentes. A Mei regista o acordo numa mensagem curta.","zh":"梅正在和团队准备演示文稿。她还没收到所需数据，因此在截止时间前通知同事。她说明已完成的部分，请他在下午结束前发送表格。她提议第二天提交草稿，好留出复核时间。同事同意，并确认哪些数字是最新的。梅用一条简短消息记录了约定。"},"assessment":{"reading":{"title":"核对文件版本","text":"O Chen recebe dois ficheiros com nomes parecidos antes de uma reunião. Não sabe qual contém os valores corrigidos. Pergunta à colega qual deve usar e explica que a apresentação depende dessa confirmação. A colega responde que a versão com a data de terça-feira é a mais recente. Pede ainda que ele retire um gráfico antigo. O Chen faz a alteração, envia o rascunho e solicita comentários até ao meio-dia seguinte."},"questions":[{"prompt":"陈最初遇到什么问题？","options":["电脑断电","数据全丢了","无法确认文件版本"],"answer":2,"explanation":"两个名称相近的文件让他不知用哪份。"},{"prompt":"最新版本带什么日期？","options":["周二","周一","周五"],"answer":0,"explanation":"versão com a data de terça-feira。"},{"prompt":"同事要求删去什么？","options":["整份报告","旧图表","会议日期"],"answer":1,"explanation":"retire um gráfico antigo。"},{"prompt":"他希望何时前收到意见？","options":["当天四点","下周五","次日中午"],"answer":2,"explanation":"até ao meio-dia seguinte。"}],"writing":"写一条工作请求：说明任务、所需帮助、截止时间及无法按时完成时的沟通安排。","speaking":"与同事协商一项有依赖条件的任务，确认分工及时间。"},"story":{"id":"pt-15","npc":"Ana","place":"工作交接桌","scene":"同事正在安排任务。你可以澄清要求、请求协助，也可以协商时间。","text":"Podemos confirmar o que falta fazer e até quando?","zh":"我们能确认还要做什么，以及何时完成吗？","icon":"work"},"support":{"id":"pt-15","pronunciation":{"focus":"词群节奏与重音","explanation":"ficheiro 重音在 chei，reunião 的末尾是鼻化双元音。读请求时可在 antes da reunião 前稍作停顿，突出截止点。","examples":[{"text":"O ficheiro.","zh":"文件。"},{"text":"Antes da reunião.","zh":"会议之前。"}]},"grammarNotes":["poderia+原形构成礼貌请求；不是 poderia revê，后面不要再次变位。","para+原形说明目的：para receber comentários；若动作者明确不同，可用 para que+虚拟式。","Se houver alterações 使用 haver 的将来虚拟式 houver；存在用法保持单数，不说 houverem alterações。"],"cultureNote":"在葡萄牙团队沟通中，ficheiro 常指电脑文件，equipa 指团队。截止时间可用 até às…，并说明需要的是草稿、反馈还是最终版本。","vocabularyNotes":[{"head":"reunião","note":"reunião 阴性；antes da reunião、depois da reunião 都需 de+a 合并。"},{"head":"ficheiro","note":"ficheiro 为阳性，partilhar um ficheiro 是共享文件。"},{"head":"rever","note":"rever 的现在时第一人称为 revejo；请求中可直接用原形 rever。"}],"transfer":[{"id":"pt-15-transfer-1","prompt":"请同事核对附件中的表格","text":"Poderia verificar a tabela em anexo antes do almoço?","zh":"您能在午饭前核对附件中的表格吗？","explanation":"poderia 后用 verificar；antes do almoço 给出明确期限。"},{"id":"pt-15-transfer-2","prompt":"发送问题清单以便开会准备","text":"Envio a lista de dúvidas para prepararmos a reunião.","zh":"我发出问题清单，以便我们准备会议。","explanation":"para prepararmos 使用人称不定式，明确我们共同准备。"},{"id":"pt-15-transfer-3","prompt":"说明缺数据导致进度限制","text":"Consigo rever o texto hoje, mas só recebo os números amanhã.","zh":"我今天能审阅文字，不过明天才收到数字。","explanation":"consigo+原形；só 限定收到数据的时间。"},{"id":"pt-15-transfer-4","prompt":"承诺上午十点前传草稿","text":"Partilho o rascunho convosco até às dez da manhã.","zh":"我会在上午十点前与你们共享草稿。","explanation":"convosco 是欧洲葡语“与你们”；até às 指截止时刻。"},{"id":"pt-15-transfer-5","prompt":"要求变更后通知全部人员","text":"Se houver mudanças no prazo, podes avisar toda a equipa?","zh":"如果截止时间有变化，你能通知全组吗？","explanation":"houver 的存在用法用单数；podes+原形。"},{"id":"pt-15-transfer-6","prompt":"确认在共享文件中记录决定","text":"Claro, vou registar a decisão no ficheiro partilhado.","zh":"当然，我会把决定记在共享文件里。","explanation":"vou registar 为即将行动；partilhado 修饰 ficheiro。"}],"grammarCheck":[{"prompt":"选择表达“您能在开会前复核这个文件吗？”且语法、用法正确的一项。","options":["Poderia revê este ficheiro antes da reunião?","Poderia rever esta ficheiro antes da reunião?","Poderia rever este ficheiro antes da reunião?"],"answer":2,"explanation":"poderia 后接原形 rever；ficheiro 阳性，指示词用 este。"},{"prompt":"选择表达“我发送草稿，以便收到你的意见。”且语法、用法正确的一项。","options":["Envio o rascunho para receber os teus comentários.","Envio o rascunho para recebo os teus comentários.","Envio o rascunho por receber os teus comentários."],"answer":0,"explanation":"目的用 para+原形 receber；recebo 是变位形式，por 在这里改变了逻辑关系。"},{"prompt":"选择表达“我能明天完成，但需要今天的数据。”且语法、用法正确的一项。","options":["Consigo termino amanhã, mas preciso dos dados de hoje.","Consigo terminar amanhã, mas preciso dos dados de hoje.","Consigo terminar amanhã, mas preciso os dados de hoje."],"answer":1,"explanation":"consigo 后接原形 terminar；precisar de+os 合并为 preciso dos。"}],"writingChecklist":["每项请求是否指明任务和截止时间？","目的结构 para 后的动词是否正确？","变更通知是否说明对象和沟通位置？"],"speakingFollowups":["如果无法按时完成，你会怎样提出新的时间？","同事发错附件时你会如何说明？","你怎样区分“请审核”与“请确认收到”？"]}},{"id":"pt-16","number":16,"title":"学校与持续学习","level":"B1","stage":"intermediate","goal":"能询问课程要求、解释学习困难并商量改进。","grammar":{"title":"比较级与学习目标","explanation":"mais… do que… 表示比……更……；tão… como… 表示与……一样……。为了表达学习目标，可用 quero conseguir + 原形，避免把进步等同于正式等级认证。","examples":[{"text":"Ler é mais fácil para mim do que ouvir.","zh":"对我来说，阅读比听力容易。"},{"text":"Este exercício é tão útil como o anterior.","zh":"这个练习和上一个一样有用。"}]},"vocab":[{"head":"inscrição","zh":"报名","example":"A inscrição termina amanhã.","exampleZh":"报名明天截止。","icon":"study"},{"head":"propina","zh":"学费","example":"Qual é o valor da propina?","exampleZh":"学费是多少？","icon":"money"},{"head":"horário","zh":"时间表","example":"Este horário é melhor para mim.","exampleZh":"这个时间表更适合我。","icon":"time"},{"head":"exercício","zh":"练习","example":"Preciso de repetir o exercício.","exampleZh":"我需要重做练习。","icon":"study"},{"head":"dúvida","zh":"疑问","example":"Tenho uma dúvida sobre o texto.","exampleZh":"我对文章有一个疑问。","icon":"study"},{"head":"avaliação","zh":"评估","example":"Como funciona a avaliação?","exampleZh":"评估如何进行？","icon":"study"},{"head":"melhorar","zh":"改进；提高","example":"Quero melhorar a pronúncia.","exampleZh":"我想改善发音。","icon":"study"},{"head":"pronúncia","zh":"发音","example":"A pronúncia exige prática.","exampleZh":"发音需要练习。","icon":"study"},{"head":"faltar","zh":"缺席；缺少","example":"Vou faltar à aula de hoje.","exampleZh":"我今天要缺课。","icon":"study"},{"head":"apoio","zh":"支持；辅导","example":"Existe apoio para esta atividade?","exampleZh":"这项活动有辅导吗？","icon":"study"}],"lessons":[{"id":"pt-16-1","text":"Ler é mais fácil para mim do que ouvir.","zh":"对我来说，阅读比听力容易。","tip":"mais… do que… 构成比较。"},{"id":"pt-16-2","text":"Este exercício é tão útil como o anterior.","zh":"这个练习和上一个一样有用。","tip":"tão… como… 表示同等程度。"},{"id":"pt-16-3","text":"Tenho dificuldade em perceber conversas rápidas.","zh":"我难以听懂快速的对话。","tip":"ter dificuldade em 加原形描述困难。"},{"id":"pt-16-4","text":"Podemos praticar com gravações mais curtas.","zh":"我们可以用更短的录音练习。","tip":"提出具体、可执行的练习调整。"},{"id":"pt-16-5","text":"Quanto tempo devo estudar entre as aulas?","zh":"两次课之间我应学习多久？","tip":"devo 表示询问合适安排。"},{"id":"pt-16-6","text":"Começa com períodos curtos e regista as tuas dúvidas.","zh":"先从短时间学习开始，并记下疑问。","tip":"本句是学习安排建议。"}],"dialogue":[{"speaker":"甲","text":"Tenho dificuldade em perceber conversas rápidas.","zh":"我难以听懂快速的对话。"},{"speaker":"乙","text":"Podemos praticar com gravações mais curtas.","zh":"我们可以用更短的录音练习。"},{"speaker":"甲","text":"Quanto tempo devo estudar entre as aulas?","zh":"两次课之间我应学习多久？"},{"speaker":"乙","text":"Começa com períodos curtos e regista as tuas dúvidas.","zh":"先从短时间学习开始，并记下疑问。"}],"reading":{"title":"调整学习方法","text":"O Liu frequenta um curso à noite. Lê os textos com alguma facilidade, mas perde informação quando várias pessoas falam depressa. Na aula pede à professora uma estratégia para praticar em casa. Ela sugere ouvir um excerto curto, anotar palavras importantes e voltar a ouvir. O Liu decide experimentar durante uma semana. Depois quer comparar o que percebeu na primeira e na última tentativa, sem esperar compreender tudo imediatamente.","zh":"刘在上夜课。他阅读文章较为轻松，但多人快速说话时会漏掉信息。课堂上，他请老师提供在家练习的方法。老师建议听一小段录音，记下关键词，再听一遍。刘决定试一周。之后他想比较第一次与最后一次听懂的内容，不期待立刻全部听懂。"},"assessment":{"reading":{"title":"选课前询问","text":"A Li procura um curso de fotografia. Encontra duas opções: uma tem aulas de manhã e outra funciona ao sábado. Como trabalha durante a semana, prefere a segunda. Antes de se inscrever, pergunta se precisa de levar uma máquina própria e como são avaliados os trabalhos. A escola responde que pode começar com o equipamento disponível nas aulas, mas deve confirmar a reserva. A Li pede também informação sobre o custo total."},"questions":[{"prompt":"小李偏好哪种上课时间？","options":["周六","工作日上午","每天晚上"],"answer":0,"explanation":"prefere a segunda，即周六课程。"},{"prompt":"她问了哪项评估问题？","options":["老师国籍","作品如何评估","考试地点"],"answer":1,"explanation":"como são avaliados os trabalhos。"},{"prompt":"开始时可以使用什么？","options":["必须新买相机","只能手机","课堂可用设备"],"answer":2,"explanation":"equipamento disponível nas aulas。"},{"prompt":"她还询问什么？","options":["总费用","周末天气","住址证明"],"answer":0,"explanation":"informação sobre o custo total。"}],"writing":"写一封课程询问信，说明时间限制，询问设备、费用与评估方式。","speaking":"向老师描述一项学习困难，协商一周练习计划并约定如何观察进步。"},"story":{"id":"pt-16","npc":"Inês","place":"课程咨询室","scene":"你想找到合适的课程。把自己的目标说出来，再问清学习安排。","text":"O que gostaria de aprender neste curso?","zh":"您想在这门课中学到什么？","icon":"study"},"support":{"id":"pt-16","pronunciation":{"focus":"重音与 ç 的声音","explanation":"pronúncia 重音在 nún；inscrição 的 ç 发 s 音。avaliação 可按 a-va-li-a-ção 慢读后连起来，避免吞掉重读尾音。","examples":[{"text":"A pronúncia.","zh":"发音。"},{"text":"Uma dúvida.","zh":"一个疑问。"}]},"grammarNotes":["比较级可用 mais…do que；比较两种活动时原形可作主语：Ler é mais fácil…。","同等比较用 tão+形容词+como；不要把 tão 与 mais 混成 tão mais útil como。","ter dificuldade em+原形说明做某事有困难；不能直接省掉 em。"],"cultureNote":"在葡萄牙学校或培训课程中，propina 常指学费而非“小费”。课程时间、费用及评价方式应向具体机构询问，本章不承诺任何等级认证。","vocabularyNotes":[{"head":"propina","note":"propina 是阴性，葡萄牙语境常为学费；给服务员的小费通常叫 gorjeta。"},{"head":"dúvida","note":"dúvida 阴性且 ú 标重音；tirar/esclarecer uma dúvida 表示解答疑问。"},{"head":"faltar","note":"faltar a uma aula 表示缺课；faltar um documento 表示缺一份文件，结构不同。"}],"transfer":[{"id":"pt-16-transfer-1","prompt":"比较阅读与写作难度","text":"Escrever mensagens é mais difícil para mim do que ler notícias.","zh":"对我而言，写消息比读新闻更难。","explanation":"两种活动均用原形作比较对象，mais…do que 成对。"},{"id":"pt-16-transfer-2","prompt":"比较两次练习的实用性","text":"A atividade de hoje é tão prática como a de ontem.","zh":"今天的活动和昨天的一样实用。","explanation":"tão…como 表同等；a de ontem 省略重复的 atividade。"},{"id":"pt-16-transfer-3","prompt":"说明不擅长区分相近声音","text":"Tenho dificuldade em distinguir sons parecidos.","zh":"我难以区分相近的声音。","explanation":"em 后接原形 distinguir；parecidos 修饰复数 sons。"},{"id":"pt-16-transfer-4","prompt":"建议先听较慢的对话","text":"Podemos começar por diálogos mais lentos e depois aumentar a velocidade.","zh":"我们可以先听较慢的对话，然后加快速度。","explanation":"começar por 表示从什么开始；mais lentos 为比较形式。"},{"id":"pt-16-transfer-5","prompt":"询问课后练习的合理安排","text":"Quantos exercícios devo fazer antes da próxima aula?","zh":"下节课前我应做多少道练习？","explanation":"quantos 与复数 exercícios 一致；devo+原形。"},{"id":"pt-16-transfer-6","prompt":"建议记录听不懂的表达","text":"Ouve um diálogo curto e anota as expressões que não percebes.","zh":"听一段短对话，记下没听懂的表达。","explanation":"ouve、anota 是 tu 的指令形式；não percebes 为否定关系从句。"}],"grammarCheck":[{"prompt":"选择表达“对我来说，阅读比听力容易。”且语法、用法正确的一项。","options":["Ler é mais fácil para mim do que ouvir.","Ler é mais fácil para mim como ouvir.","Ler é tão fácil para mim do que ouvir."],"answer":0,"explanation":"mais…do que 是比较级；tão…como 是同等比较，连接成分不能交叉。"},{"prompt":"选择表达“这个练习和上一个一样有用。”且语法、用法正确的一项。","options":["Este exercício é tão útil do que o anterior.","Este exercício é tão útil como o anterior.","Este exercício é tão úteis como o anterior."],"answer":1,"explanation":"tão 与 como 配套；exercício 单数，形容词用 útil。"},{"prompt":"选择表达“我难以听懂快速的对话。”且语法、用法正确的一项。","options":["Tenho dificuldade perceber conversas rápidas.","Tenho dificuldade em percebo conversas rápidas.","Tenho dificuldade em perceber conversas rápidas."],"answer":2,"explanation":"ter dificuldade em 后接原形 perceber；不可省 em 或使用变位 percebo。"}],"writingChecklist":["mais…do que 与 tão…como 是否正确成对？","dificuldade 后是否有 em 和原形？","学习目标是否具体到活动和频率？"],"speakingFollowups":["你怎样说明自己最难听懂的内容？","如果练习太长，你会提出什么调整？","你想用什么方法检查自己的进步？"]}},{"id":"pt-17","number":17,"title":"银行与日常付款","level":"B1","stage":"intermediate","goal":"能核对费用、说明支付问题并保护敏感信息。","grammar":{"title":"直接宾语代词与否定位置","explanation":"o/a/os/as 可代替已提及的物品。肯定句常后置，如 recebi-o；带 não 时通常前置，如 não o recebi。涉及费用和账户条件时应向具体机构核实。","examples":[{"text":"Recebi o recibo e guardei-o.","zh":"我收到收据并把它保存了。"},{"text":"Pedi o comprovativo, mas não o recebi.","zh":"我要求了凭证，但没收到。"}]},"vocab":[{"head":"conta bancária","zh":"银行账户","example":"Quero informação sobre uma conta bancária.","exampleZh":"我想了解银行账户。","icon":"money"},{"head":"transferência","zh":"转账","example":"A transferência ainda não chegou.","exampleZh":"转账还没到账。","icon":"money"},{"head":"saldo","zh":"余额","example":"Preciso de consultar o saldo.","exampleZh":"我需要查询余额。","icon":"money"},{"head":"comissão","zh":"手续费","example":"Esta operação tem comissão?","exampleZh":"这项操作收手续费吗？","icon":"money"},{"head":"pagamento","zh":"付款","example":"O pagamento foi recusado.","exampleZh":"付款被拒绝了。","icon":"money"},{"head":"levantamento","zh":"取款","example":"Quero confirmar o limite de levantamento.","exampleZh":"我想确认取款限额。","icon":"money"},{"head":"recibo","zh":"收据","example":"Preciso de um recibo.","exampleZh":"我需要收据。","icon":"money"},{"head":"montante","zh":"金额","example":"O montante está correto.","exampleZh":"金额正确。","icon":"money"},{"head":"código","zh":"代码；密码","example":"Não vou partilhar o código.","exampleZh":"我不会分享验证码／密码。","icon":"money"},{"head":"movimento","zh":"账户交易记录","example":"Não reconheço este movimento.","exampleZh":"我不认识这笔交易。","icon":"money"}],"lessons":[{"id":"pt-17-1","text":"Recebi o recibo e guardei-o.","zh":"我收到收据并把它保存了。","tip":"o 代替阳性单数 recibo，肯定句后置。"},{"id":"pt-17-2","text":"Pedi o comprovativo, mas não o recebi.","zh":"我要求了凭证，但没收到。","tip":"não 使代词位于动词前。"},{"id":"pt-17-3","text":"O cartão foi recusado, mas o valor aparece na aplicação.","zh":"卡付款被拒绝，但应用里显示了这笔金额。","tip":"陈述看到的情况，避免自行断言扣款状态。"},{"id":"pt-17-4","text":"Tem o comprovativo da tentativa de pagamento?","zh":"您有付款尝试的凭证吗？","tip":"tentativa 区别于已确认完成的付款。"},{"id":"pt-17-5","text":"Sim. Pode explicar o estado desta operação?","zh":"有。您能解释这项操作的状态吗？","tip":"询问具体状态。"},{"id":"pt-17-6","text":"Vamos verificar a informação pelo canal oficial.","zh":"我们通过官方渠道核实信息。","tip":"渠道应独立核实，避免传递敏感代码。"}],"dialogue":[{"speaker":"甲","text":"O cartão foi recusado, mas o valor aparece na aplicação.","zh":"卡付款被拒绝，但应用里显示了这笔金额。"},{"speaker":"乙","text":"Tem o comprovativo da tentativa de pagamento?","zh":"您有付款尝试的凭证吗？"},{"speaker":"甲","text":"Sim. Pode explicar o estado desta operação?","zh":"有。您能解释这项操作的状态吗？"},{"speaker":"乙","text":"Vamos verificar a informação pelo canal oficial.","zh":"我们通过官方渠道核实信息。"}],"reading":{"title":"核对一笔付款","text":"A Mei tenta pagar uma compra com cartão, mas o terminal apresenta uma mensagem de erro. Na aplicação do banco aparece um valor relacionado com a tentativa. Ela guarda o talão e pergunta à loja se a compra ficou registada. Depois contacta o banco pelo canal oficial para perceber o estado da operação. Descreve a hora e o montante, sem enviar códigos de segurança por mensagem. Quer uma explicação antes de repetir o pagamento.","zh":"梅尝试刷卡购物，但终端显示错误消息。银行应用中出现了与此次尝试有关的一笔金额。她保存小票，询问商店购物是否已记录。随后她通过官方渠道联系银行，了解操作状态。她说明时间和金额，不通过消息发送安全代码。她想先得到解释再重新付款。"},"assessment":{"reading":{"title":"一笔不认识的记录","text":"O Rui consulta os movimentos da conta e encontra um nome que não reconhece. Antes de concluir que existe um erro, compara o montante e a data com os recibos guardados. Um recibo tem o mesmo valor, mas apresenta outro nome comercial. O Rui continua com dúvidas e contacta o apoio do banco através da aplicação habitual. Pede informação sobre a operação e anota a referência do contacto para acompanhar a resposta."},"questions":[{"prompt":"鲁伊发现了什么？","options":["余额为零","不认识的交易名称","丢失的银行卡"],"answer":1,"explanation":"encontra um nome que não reconhece。"},{"prompt":"他首先做什么？","options":["再次付款","删除应用","核对收据金额与日期"],"answer":2,"explanation":"compara o montante e a data com os recibos。"},{"prompt":"他用什么渠道联系银行？","options":["平时使用的应用","陌生链接","社交媒体评论"],"answer":0,"explanation":"através da aplicação habitual。"},{"prompt":"他记下什么以跟进？","options":["商店菜单","联系参考编号","朋友密码"],"answer":1,"explanation":"anota a referência do contacto。"}],"writing":"写一条向银行查询交易状态的信息，使用虚构日期与金额，避免包含账户密码或验证码。","speaking":"模拟向客服说明一次付款问题，询问状态、可能费用及后续联系参考号。"},"story":{"id":"pt-17","npc":"Rui","place":"银行咨询台","scene":"账单中有一项不明白的记录。使用虚构信息练习提问，不提供密码。","text":"Pode explicar qual é a sua dúvida sobre o pagamento?","zh":"您能说明对这笔付款有什么疑问吗？","icon":"money"},"support":{"id":"pt-17","pronunciation":{"focus":"词尾与重读元音","explanation":"código 的重音在 có；recibo 的重音在 ci。不要把 recibo“收据”与 recebo“我收到”只靠字形相似判断为同一个词。","examples":[{"text":"O recibo.","zh":"收据。"},{"text":"Eu recebo.","zh":"我收到。"}]},"grammarNotes":["阳性单数直接宾语可用 o 替代：guardei-o；阴性单数用 a：guardei-a。","否定句中宾语代词置于动词前：não o recebi；不要保留肯定句的后置次序。","被动态中分词随主语性数变化：o cartão foi recusado；a transferência foi recusada。"],"cultureNote":"葡萄牙银行沟通中可说 montante 指金额、movimento 指账户交易记录。实际操作状态、费用和处理时间须由官方渠道确认，教学句不构成金融建议。","vocabularyNotes":[{"head":"transferência","note":"transferência 是阴性；fazer uma transferência 表示转账。"},{"head":"recibo","note":"recibo 阳性；guardei-o 的 o 可回指它。"},{"head":"montante","note":"montante 阳性，通常指金额；qual é o montante? 可询问具体数额。"}],"transfer":[{"id":"pt-17-transfer-1","prompt":"说明已下载并保存凭证","text":"Descarreguei o comprovativo e guardei-o numa pasta.","zh":"我下载了凭证并把它存到一个文件夹里。","explanation":"o 回指阳性 comprovativo；肯定句后置并加连字符。"},{"id":"pt-17-transfer-2","prompt":"说明付款确认未收到","text":"Pedi a confirmação, mas ainda não a recebi.","zh":"我请求了确认，不过还没收到。","explanation":"a 回指阴性 confirmação；não 触发前置。"},{"id":"pt-17-transfer-3","prompt":"描述转账显示处理中","text":"Fiz a transferência, mas a aplicação ainda mostra «pendente».","zh":"我转了账，但应用里仍显示“待处理”。","explanation":"fiz 说明已做的动作；ainda 指状态持续。"},{"id":"pt-17-transfer-4","prompt":"询问是否保留了交易号码","text":"Guardou o número da operação?","zh":"您保存了交易号码吗？","explanation":"guardou 为礼貌第三人称过去式，número 阳性。"},{"id":"pt-17-transfer-5","prompt":"要求解释额外费用","text":"Pode explicar a que corresponde esta comissão?","zh":"您能解释这笔费用对应什么吗？","explanation":"corresponder a 的 a 在间接疑问中保留为 a que。"},{"id":"pt-17-transfer-6","prompt":"表示将通过已知银行渠道核实","text":"Vou confirmar o movimento através do contacto habitual do banco.","zh":"我会通过银行惯常使用的联系方式核实这笔交易。","explanation":"através de+o 合并为 através do；不在句中承诺核实结果。"}],"grammarCheck":[{"prompt":"选择表达“我收到收据并把它保存了。”且语法、用法正确的一项。","options":["Recebi o recibo e guardei-a.","Recebi o recibo e guardei-o.","Recebi o recibo e guardei o."],"answer":1,"explanation":"o 回指阳性 recibo；后置弱读代词要用连字符 guardei-o。"},{"prompt":"选择表达“我要求了凭证，但没收到。”且语法、用法正确的一项。","options":["Pedi o comprovativo, mas não recebi-o.","Pedi o comprovativo, mas não a recebi.","Pedi o comprovativo, mas não o recebi."],"answer":2,"explanation":"não 触发代词前置；comprovativo 阳性应以 o 回指。"},{"prompt":"选择表达“卡付款被拒绝，但应用里显示了这笔金额。”且语法、用法正确的一项。","options":["O cartão foi recusado, mas o valor aparece na aplicação.","O cartão foi recusada, mas o valor aparece na aplicação.","O cartão foram recusado, mas o valor aparece na aplicação."],"answer":0,"explanation":"cartão 阳性单数，助动词用 foi，分词用 recusado。"}],"writingChecklist":["宾语代词的性数是否与所指名词一致？","não 后的代词是否放在动词前？","交易事实、显示状态和待核实事项是否区分？"],"speakingFollowups":["金额显示与实际付款不同，你会怎样说明？","你怎样询问某项手续费的用途？","对方让你提供不熟悉的代码时，你会怎样先确认？"]}},{"id":"pt-18","number":18,"title":"数字消息与沟通语气","level":"B1","stage":"intermediate","goal":"能写清晰消息、区分语气并核实可疑请求。","grammar":{"title":"口语与书面语体","explanation":"对熟悉的人可用 Olá 和 tu；较正式消息可用 Bom dia 与礼貌请求。间接引语可用 diz que…；消息中先说明事项，再写需要对方做什么。","examples":[{"text":"A mensagem diz que a reunião mudou de sala.","zh":"消息说会议换了房间。"},{"text":"Bom dia, poderia confirmar a receção deste email?","zh":"您好，您能确认收到这封邮件吗？"}]},"vocab":[{"head":"mensagem","zh":"消息","example":"Recebi a tua mensagem.","exampleZh":"我收到你的消息了。","icon":"talk"},{"head":"assunto","zh":"主题","example":"O assunto está no início.","exampleZh":"主题在开头。","icon":"talk"},{"head":"ligação","zh":"链接；连接","example":"Não abri a ligação.","exampleZh":"我没有打开链接。","icon":"talk"},{"head":"palavra-passe","zh":"密码","example":"Esqueci-me da palavra-passe.","exampleZh":"我忘记密码了。","icon":"talk"},{"head":"remetente","zh":"发件人","example":"Conheces o remetente?","exampleZh":"你认识发件人吗？","icon":"person"},{"head":"destinatário","zh":"收件人","example":"Confirma o destinatário.","exampleZh":"请确认收件人。","icon":"person"},{"head":"rascunho","zh":"草稿","example":"Guardei um rascunho.","exampleZh":"我保存了一份草稿。","icon":"study"},{"head":"responder","zh":"回复","example":"Vou responder amanhã.","exampleZh":"我会明天回复。","icon":"talk"},{"head":"encaminhar","zh":"转发","example":"Posso encaminhar esta informação?","exampleZh":"我能转发这项信息吗？","icon":"talk"},{"head":"verificar","zh":"核实","example":"É melhor verificar a origem.","exampleZh":"最好核实来源。","icon":"idea"}],"lessons":[{"id":"pt-18-1","text":"A mensagem diz que a reunião mudou de sala.","zh":"消息说会议换了房间。","tip":"diz que 引出间接转述。"},{"id":"pt-18-2","text":"Bom dia, poderia confirmar a receção deste email?","zh":"您好，您能确认收到这封邮件吗？","tip":"用于较正式的书面请求。"},{"id":"pt-18-3","text":"Recebi uma ligação, mas não reconheço o remetente.","zh":"我收到一个链接，但不认识发件人。","tip":"先说明不确定之处。"},{"id":"pt-18-4","text":"A mensagem pede alguma informação pessoal?","zh":"消息要求提供个人信息吗？","tip":"alguma 在问句中表示某些。"},{"id":"pt-18-5","text":"Sim, pede uma palavra-passe e cria muita urgência.","zh":"是的，要求密码，还催得很急。","tip":"说明消息的具体特征。"},{"id":"pt-18-6","text":"Vou contactar o serviço através do endereço que já conheço.","zh":"我会通过已知地址联系该服务。","tip":"独立核实渠道，不依赖消息提供的链接。"}],"dialogue":[{"speaker":"甲","text":"Recebi uma ligação, mas não reconheço o remetente.","zh":"我收到一个链接，但不认识发件人。"},{"speaker":"乙","text":"A mensagem pede alguma informação pessoal?","zh":"消息要求提供个人信息吗？"},{"speaker":"甲","text":"Sim, pede uma palavra-passe e cria muita urgência.","zh":"是的，要求密码，还催得很急。"},{"speaker":"乙","text":"Vou contactar o serviço através do endereço que já conheço.","zh":"我会通过已知地址联系该服务。"}],"reading":{"title":"发送前检查","text":"A Li escreve uma mensagem à escola para perguntar sobre uma aula. Coloca um assunto claro e explica a dúvida em poucas frases. Antes de enviar, confirma o destinatário e verifica se o anexo está correto. Mais tarde recebe uma mensagem inesperada que pede a palavra-passe da conta. Como não reconhece o remetente, não responde com dados pessoais. Prefere contactar a escola através do endereço que utiliza habitualmente para esclarecer a situação.","zh":"小李写消息给学校，询问一节课。她填写清晰主题，用几句话说明疑问。发送前，她确认收件人，检查附件是否正确。后来她收到一条意外消息，要求账户密码。因为不认识发件人，她不回复个人数据。她选择通过平时使用的地址联系学校，以弄清情况。"},"assessment":{"reading":{"title":"确认活动变动","text":"O Chen recebe no grupo uma mensagem a dizer que a visita de sábado foi cancelada. A mensagem foi encaminhada e não indica quem tomou a decisão. Antes de alterar os planos, o Chen consulta o email enviado pela organização. Não encontra qualquer aviso novo, por isso escreve diretamente para o contacto habitual. A organização responde que a visita se mantém, mas começa meia hora mais tarde. O Chen partilha a confirmação com o grupo."},"questions":[{"prompt":"群里最初的消息声称什么？","options":["活动提前","集合地点变更","参观取消"],"answer":2,"explanation":"a visita… foi cancelada。"},{"prompt":"陈为什么核实？","options":["消息是转发且未注明决定者","他丢了票","他想换城市"],"answer":0,"explanation":"foi encaminhada e não indica quem tomou a decisão。"},{"prompt":"组织方确认什么？","options":["活动取消","照常但晚半小时开始","推迟一个月"],"answer":1,"explanation":"se mantém, mas começa meia hora mais tarde。"},{"prompt":"陈最后做什么？","options":["删除群聊","再买一张票","向群里分享确认信息"],"answer":2,"explanation":"partilha a confirmação com o grupo。"}],"writing":"分别给朋友和办事机构写一条同主题消息，注意称呼与请求语气。","speaking":"复述一条尚未核实的活动消息，说明不确定点并商量核实方法。"},"story":{"id":"pt-18","npc":"Ana","place":"家中的书桌","scene":"你要发一条消息。先想想收件人是谁，再选择合适的称呼和语气。","text":"A quem vai escrever e o que precisa de esclarecer?","zh":"您要写给谁，需要弄清什么？","icon":"talk"},"support":{"id":"pt-18","pronunciation":{"focus":"邮件词汇的重音","explanation":"mensagem 重音在 sa，词尾含鼻化；palavra-passe 中两个词都保留可辨识节奏，不把连字符读出来。","examples":[{"text":"Uma mensagem.","zh":"一条消息。"},{"text":"A palavra-passe.","zh":"密码。"}]},"grammarNotes":["转述信息可用 diz que…；que 后是完整从句，不需要重复一套“说”的动词。","礼貌书面请求可用 Poderia confirmar…?；熟人之间可用 Podes confirmar…?，需保持称呼一致。","através de 后的名词若带 o 合并为 através do；não reconheço 中否定词在动词前。"],"cultureNote":"葡萄牙正式邮件常用 Bom dia 或 Exmo./Exma. 等称呼，具体取决于关系。对陌生消息应先通过已知联系方式确认，勿把紧急措辞当成身份保证。","vocabularyNotes":[{"head":"ligação","note":"ligação 可指链接、连接或电话联络；需要网址时可明确说 ligação para o site。"},{"head":"palavra-passe","note":"palavra-passe 是阴性复合词：a palavra-passe；不要在教学回答中填写真实密码。"},{"head":"remetente","note":"remetente 是发送者；destinatário 是接收者，检查消息时勿对调。"}],"transfer":[{"id":"pt-18-transfer-1","prompt":"转告会议推迟","text":"O email informa que a reunião foi adiada para sexta-feira.","zh":"邮件通知会议推迟到周五。","explanation":"informa que 引出转述；adiada 随阴性 reunião 变化。"},{"id":"pt-18-transfer-2","prompt":"正式询问附件是否收到","text":"Bom dia, poderia confirmar se recebeu o ficheiro em anexo?","zh":"早上好，您能确认是否收到了附件中的文件吗？","explanation":"se 表是否，recebeu 为过去式；poderia 缓和语气。"},{"id":"pt-18-transfer-3","prompt":"说明不确定陌生链接来源","text":"Recebi uma ligação para um site, mas não sei quem a enviou.","zh":"我收到一个网站链接，但不知道是谁发来的。","explanation":"a 回指阴性 ligação；quem a enviou 中代词前置。"},{"id":"pt-18-transfer-4","prompt":"追问消息的具体要求","text":"Que dados pede essa mensagem?","zh":"那条消息要求哪些资料？","explanation":"que dados 是复数宾语，主语 mensagem 仍对应单数 pede。"},{"id":"pt-18-transfer-5","prompt":"说明消息索要验证码","text":"Pede um código de acesso e diz que a conta vai ser bloqueada.","zh":"它索要访问代码，并说账户将被锁定。","explanation":"vai ser bloqueada 为被动将来表达；bloqueada 与 conta 一致。"},{"id":"pt-18-transfer-6","prompt":"决定核实发件地址后再回应","text":"Antes de responder, vou verificar o endereço do remetente.","zh":"回复前，我会核对发件人的地址。","explanation":"antes de+原形明确先核实再回复的顺序。"}],"grammarCheck":[{"prompt":"选择表达“消息说会议换了房间。”且语法、用法正确的一项。","options":["A mensagem diz de que a reunião mudou de sala.","A mensagem dizem que a reunião mudou de sala.","A mensagem diz que a reunião mudou de sala."],"answer":2,"explanation":"dizer que 不加 de；主语 mensagem 单数，用 diz。"},{"prompt":"选择表达“您好，您能确认收到这封邮件吗？”且语法、用法正确的一项。","options":["Bom dia, poderia confirmar a receção deste email?","Bom dia, poderia confirma a receção deste email?","Bom dia, poderia confirmar o receção deste email?"],"answer":0,"explanation":"poderia 后用原形 confirmar；receção 为阴性，冠词 a。"},{"prompt":"选择表达“我收到一个链接，但不认识发件人。”且语法、用法正确的一项。","options":["Recebi uma ligação, mas não reconhecer o remetente.","Recebi uma ligação, mas não reconheço o remetente.","Recebi uma ligação, mas reconheço não o remetente."],"answer":1,"explanation":"独立陈述需要变位 reconheço，不能直接用原形 reconhecer；não 应放在变位动词之前，而非其后。"}],"writingChecklist":["转述从句是否以 que 正确连接？","邮件称呼与动词人称是否一致？","回复前需要核实的来源是否写清？"],"speakingFollowups":["如何在不生硬的情况下请求确认收到？","如果看不到附件，你会怎样写邮件？","你会如何询问一条陌生链接的用途？"]}},{"id":"pt-19","number":19,"title":"消息与信息核实","level":"B1","stage":"intermediate","goal":"将已学表达迁移到消息与信息核实，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Recebi uma mensagem sobre uma reunião.","zh":"我收到一条关于会议的消息。"},{"text":"A mensagem não indica quem a escreveu.","zh":"消息没有注明是谁写的。"}]},"vocab":[{"head":"mensagem","zh":"消息","example":"Recebi a tua mensagem.","exampleZh":"我收到你的消息了。","icon":"talk","review":true},{"head":"assunto","zh":"主题","example":"O assunto está no início.","exampleZh":"主题在开头。","icon":"talk","review":true},{"head":"ligação","zh":"链接；连接","example":"Não abri a ligação.","exampleZh":"我没有打开链接。","icon":"talk","review":true},{"head":"palavra-passe","zh":"密码","example":"Esqueci-me da palavra-passe.","exampleZh":"我忘记密码了。","icon":"talk","review":true},{"head":"remetente","zh":"发件人","example":"Conheces o remetente?","exampleZh":"你认识发件人吗？","icon":"person","review":true},{"head":"destinatário","zh":"收件人","example":"Confirma o destinatário.","exampleZh":"请确认收件人。","icon":"person","review":true},{"head":"rascunho","zh":"草稿","example":"Guardei um rascunho.","exampleZh":"我保存了一份草稿。","icon":"study","review":true},{"head":"responder","zh":"回复","example":"Vou responder amanhã.","exampleZh":"我会明天回复。","icon":"talk","review":true},{"head":"encaminhar","zh":"转发","example":"Posso encaminhar esta informação?","exampleZh":"我能转发这项信息吗？","icon":"talk","review":true},{"head":"verificar","zh":"核实","example":"É melhor verificar a origem.","exampleZh":"最好核实来源。","icon":"idea","review":true}],"lessons":[{"id":"pt-19-1","text":"Recebi uma mensagem sobre uma reunião.","zh":"我收到一条关于会议的消息。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-19-2","text":"A mensagem não indica quem a escreveu.","zh":"消息没有注明是谁写的。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-19-3","text":"Antes de mudar os planos, vou confirmar a informação.","zh":"改变计划前，我会确认信息。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-19-4","text":"Prefiro contactar a organização pelo endereço habitual.","zh":"我更愿意通过常用地址联系组织方。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-19-5","text":"Se a hora mudar, aviso também os meus colegas.","zh":"如果时间改变，我也会通知同事。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-19-6","text":"Depois guardo a resposta para a poder consultar.","zh":"随后我保存答复，以便查询。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Recebi uma mensagem sobre uma reunião. A mensagem não indica quem a escreveu. Antes de mudar os planos, vou confirmar a informação. Prefiro contactar a organização pelo endereço habitual. Se a hora mudar, aviso também os meus colegas. Depois guardo a resposta para a poder consultar.","zh":"我收到一条关于会议的消息。消息没有注明是谁写的。改变计划前，我会确认信息。我更愿意通过常用地址联系组织方。如果时间改变，我也会通知同事。随后我保存答复，以便查询。"},"assessment":{"reading":{"title":"陌生情境验收","text":"A Ana recebe uma mensagem encaminhada sobre um curso. Segundo a mensagem, a aula de terça-feira passou para quinta-feira. A Ana não encontra o nome de quem enviou o aviso original. Por isso, escreve ao contacto habitual da escola antes de alterar a sua agenda. A escola responde que a aula continua na terça-feira, mas será noutra sala. A Ana guarda a confirmação e informa o colega que lhe enviou a mensagem."},"questions":[{"prompt":"原消息说改到哪天？","options":["周一","周四","周日"],"answer":1,"explanation":"passou para quinta-feira。"},{"prompt":"为什么要核实？","options":["不知道原发送者","课程结束","丢了手机"],"answer":0,"explanation":"não encontra o nome… aviso original。"},{"prompt":"实际改变了什么？","options":["日期","教师","教室"],"answer":2,"explanation":"será noutra sala。"},{"prompt":"她最后通知谁？","options":["医生","发消息的同学","房东"],"answer":1,"explanation":"informa o colega… enviou a mensagem。"}],"writing":"围绕“消息与信息核实”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“消息与信息核实”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"pt-19","npc":"Inês","place":"社区消息栏","scene":"群里转来一条通知。先核实来源，再决定要不要改变计划。","text":"Já confirmou esta informação com a organização?","zh":"您已向组织方确认这项信息了吗？","icon":"idea"},"support":{"id":"pt-19","pronunciation":{"focus":"词尾鼻音与疑问语调","explanation":"informação 和 organização 都以鼻化 ão 结尾；quem 的元音带鼻化。询问“谁写的”时不要把 quem 弱化到听不见。","examples":[{"text":"Quem escreveu?","zh":"谁写的？"},{"text":"Vou confirmar.","zh":"我会核实。"}]},"grammarNotes":["quem a escreveu 中 a 回指 mensagem，疑问词 quem 使宾语代词出现在动词前。","antes de+原形表达动作顺序；antes de mudar 不等于 depois de mudar。","Se a hora mudar 中 mudar 为将来虚拟式，与原形同形；回顾已知事实时才按具体语境使用过去或现在直陈式。"],"cultureNote":"葡萄牙工作或社团沟通中，可通过 endereço habitual 核实通知。转述时区分“收到一条消息”和“已证实消息属实”，避免把来源不明的信息写成确定安排。","vocabularyNotes":[{"head":"mensagem","note":"mensagem 阴性；a resposta à mensagem 中 a+a 合并为 à。"},{"head":"assunto","note":"assunto 指邮件主题或事项；o assunto da mensagem 帮助明确核实内容。"},{"head":"verificar","note":"verificar 常直接接信息或事实：verificar a informação；不必加 de。"}],"transfer":[{"id":"pt-19-transfer-1","prompt":"说明收到活动取消通知","text":"Recebi um aviso sobre o cancelamento do encontro.","zh":"我收到了一则聚会取消的通知。","explanation":"sobre 引出主题；cancelamento 是阳性名词。"},{"id":"pt-19-transfer-2","prompt":"指出消息没有联系方式","text":"O aviso não inclui nenhum contacto da organização.","zh":"通知没有提供主办方的任何联系方式。","explanation":"não…nenhum 构成自然的否定结构。"},{"id":"pt-19-transfer-3","prompt":"决定先查日期再告知别人","text":"Antes de avisar os amigos, vou confirmar a data.","zh":"通知朋友前，我会先确认日期。","explanation":"先后关系通过 antes de 准确表达。"},{"id":"pt-19-transfer-4","prompt":"说明将给熟悉的负责人发邮件","text":"Prefiro escrever à pessoa que costuma organizar o encontro.","zh":"我更愿意写信给通常组织聚会的那个人。","explanation":"escrever a+a pessoa 合并为 à pessoa。"},{"id":"pt-19-transfer-5","prompt":"承诺地址若变更会转告","text":"Se o local mudar, envio a nova morada ao grupo.","zh":"如果地点变化，我会把新地址发给群组。","explanation":"将来条件 mudar；enviar algo a alguém 明确接收者。"},{"id":"pt-19-transfer-6","prompt":"说明保存已确认的时间","text":"Depois de receber a confirmação, anoto a hora na agenda.","zh":"收到确认后，我会把时间记在日程本上。","explanation":"depois de receber 表先收到后记录，不混淆动作次序。"}],"grammarCheck":[{"prompt":"选择表达“我收到一条关于会议的消息。”且语法、用法正确的一项。","options":["Recebi uma mensagem sobre uma reunião.","Recebi uma mensagem sobre um reunião.","Receber uma mensagem sobre uma reunião."],"answer":0,"explanation":"reunião 为阴性配 uma；独立过去陈述要用 recebi，而非原形 receber。"},{"prompt":"选择表达“消息没有注明是谁写的。”且语法、用法正确的一项。","options":["A mensagem não indica quem escreveu-a.","A mensagem não indica quem a escreveu.","A mensagem não indicam quem a escreveu."],"answer":1,"explanation":"quem 引发 a 前置；mensagem 单数对应 indica。"},{"prompt":"选择表达“改变计划前，我会确认信息。”且语法、用法正确的一项。","options":["Antes de mudo os planos, vou confirmar a informação.","Antes mudar os planos, vou confirmar a informação.","Antes de mudar os planos, vou confirmar a informação."],"answer":2,"explanation":"antes de 后接原形 mudar；不能把它变位或省略介词 de。"}],"writingChecklist":["未知来源与已确认信息是否区别标示？","间接疑问中的代词位置是否正确？","先核实后转告的顺序是否明确？"],"speakingFollowups":["两条通知的时间不一样，你会先问什么？","你如何向朋友说明目前尚未确认？","收到澄清后你会如何更新原来的消息？"]}},{"id":"pt-20","number":20,"title":"投诉与协商解决","level":"B1","stage":"intermediate","goal":"将已学表达迁移到投诉与协商解决，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Comprei este produto ontem e guardei o recibo.","zh":"我昨天买了这件商品并保留了收据。"},{"text":"Quando cheguei a casa, reparei num problema.","zh":"到家时，我发现了一个问题。"}]},"vocab":[{"head":"supermercado","zh":"超市","example":"Vou ao supermercado.","exampleZh":"我要去超市。","icon":"food","review":true},{"head":"fruta","zh":"水果","example":"A fruta fica ali.","exampleZh":"水果在那边。","icon":"food","review":true},{"head":"maçã","zh":"苹果","example":"Queria duas maçãs.","exampleZh":"我想要两个苹果。","icon":"food","review":true},{"head":"arroz","zh":"大米","example":"Este arroz é barato.","exampleZh":"这种大米便宜。","icon":"food","review":true},{"head":"quilo","zh":"公斤","example":"Quero um quilo de batatas.","exampleZh":"我要一公斤土豆。","icon":"food","review":true},{"head":"saco","zh":"袋子","example":"Preciso de um saco.","exampleZh":"我需要一个袋子。","icon":"home","review":true},{"head":"caixa","zh":"收银台；箱子","example":"A caixa está aberta.","exampleZh":"收银台开放着。","icon":"money","review":true},{"head":"cartão","zh":"卡","example":"Posso pagar com cartão?","exampleZh":"我能用卡付款吗？","icon":"money","review":true},{"head":"dinheiro","zh":"现金；钱","example":"Vou pagar em dinheiro.","exampleZh":"我要用现金付款。","icon":"money","review":true},{"head":"talão","zh":"小票","example":"Pode dar-me o talão?","exampleZh":"能给我小票吗？","icon":"money","review":true}],"lessons":[{"id":"pt-20-1","text":"Comprei este produto ontem e guardei o recibo.","zh":"我昨天买了这件商品并保留了收据。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-20-2","text":"Quando cheguei a casa, reparei num problema.","zh":"到家时，我发现了一个问题。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-20-3","text":"Gostava de explicar o que aconteceu com calma.","zh":"我想平静地说明发生的情况。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-20-4","text":"Pode dizer-me quais são as opções neste caso?","zh":"您能告诉我这种情况下有哪些选项吗？","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-20-5","text":"Se não for possível resolver hoje, quando devo voltar?","zh":"如果今天不能解决，我应该什么时候再来？","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-20-6","text":"Vou guardar a resposta e o número do pedido.","zh":"我会保存答复和申请编号。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Comprei este produto ontem e guardei o recibo. Quando cheguei a casa, reparei num problema. Gostava de explicar o que aconteceu com calma. Pode dizer-me quais são as opções neste caso? Se não for possível resolver hoje, quando devo voltar? Vou guardar a resposta e o número do pedido.","zh":"我昨天买了这件商品并保留了收据。到家时，我发现了一个问题。我想平静地说明发生的情况。您能告诉我这种情况下有哪些选项吗？如果今天不能解决，我应该什么时候再来？我会保存答复和申请编号。"},"assessment":{"reading":{"title":"陌生情境验收","text":"O Rui comprou uma mochila numa loja na segunda-feira. Ao chegar a casa, viu que uma das alças estava solta. Na quarta-feira voltou à loja com a mochila e o recibo. A funcionária ouviu a explicação e disse que precisava de consultar a responsável antes de indicar uma solução. Pediu um contacto e entregou ao Rui um número de pedido. Ele perguntou quando poderia esperar uma resposta e anotou a informação."},"questions":[{"prompt":"商品是什么？","options":["背包","杯子","桌子"],"answer":0,"explanation":"uma mochila。"},{"prompt":"发现什么问题？","options":["颜色太深","肩带松脱","没有口袋"],"answer":1,"explanation":"uma das alças estava solta。"},{"prompt":"店员立刻承诺退款了吗？","options":["是","承诺换新","没有，要先咨询负责人"],"answer":2,"explanation":"precisava de consultar a responsável。"},{"prompt":"Rui 拿到了什么？","options":["申请编号","免费车票","密码"],"answer":0,"explanation":"um número de pedido。"}],"writing":"围绕“投诉与协商解决”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“投诉与协商解决”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"pt-20","npc":"Rui","place":"商店服务台","scene":"买到的东西出现问题。平静描述经过，再询问可以采取哪些步骤。","text":"Pode contar-me o que aconteceu com o produto?","zh":"您能告诉我商品出了什么情况吗？","icon":"talk"},"support":{"id":"pt-20","pronunciation":{"focus":"过去式的重音","explanation":"comprei、guardei 的重音落在最后的 ei；produto 重音在 du。不要把过去式末尾弱化成现在时的 -o。","examples":[{"text":"Comprei ontem.","zh":"我昨天买的。"},{"text":"Guardei o talão.","zh":"我留了小票。"}]},"grammarNotes":["一次已完成事件用过去完成式：comprei、reparei；背景或习惯则可能用未完成过去式，不能仅按中文“了”选时态。","Gostava de explicar 缓和投诉语气；o que aconteceu 引出发生了什么的内容从句。","Se não for possível 中 for 是 ser 的将来虚拟式；不要机械改成 se não é 讨论尚未发生的可能性。"],"cultureNote":"在葡萄牙商店沟通问题时，可先说明购买时间、具体问题和希望了解的处理选项。实际退换或维修条件需按购买情形和商店回复核实，本章不承诺结果。","vocabularyNotes":[{"head":"caixa","note":"caixa 可指收银台、盒子；na caixa 与 numa caixa 的冠词帮助区分具体语境。"},{"head":"cartão","note":"cartão 阳性，付款可说 pagar com cartão；plural cartões。"},{"head":"talão","note":"talão 指购物小票，可用作说明购买情况的材料，但勿把语言例句当作保证处理结果。"}],"transfer":[{"id":"pt-20-transfer-1","prompt":"说明买回后发现包装破损","text":"Comprei esta embalagem de arroz de manhã e guardei o talão.","zh":"我早上买了这包米，并留了小票。","explanation":"esta 配阴性 embalagem；arroz 说明包装内容。"},{"id":"pt-20-transfer-2","prompt":"描述打开后发现少了物品","text":"Quando abri o saco, vi que faltava um produto.","zh":"打开袋子时，我发现少了一件商品。","explanation":"abri、vi 为已完成动作；faltava 描述当时的缺少状态。"},{"id":"pt-20-transfer-3","prompt":"请求先说明事情经过","text":"Gostava de explicar o problema antes de escolher uma solução.","zh":"我想先说明问题，再选择解决办法。","explanation":"antes de+原形明确讨论步骤。"},{"id":"pt-20-transfer-4","prompt":"询问可否核对付款记录","text":"Pode verificar se o valor no talão corresponde ao que paguei?","zh":"您能核对小票金额是否与我支付的一致吗？","explanation":"se 表是否；corresponder a 与 ao que 连接。"},{"id":"pt-20-transfer-5","prompt":"询问当天解决不了如何联系","text":"Se não conseguirmos resolver agora, como posso acompanhar o pedido?","zh":"如果我们现在不能解决，我如何跟进这项请求？","explanation":"conseguirmos 是第一人称复数将来虚拟式。"},{"id":"pt-20-transfer-6","prompt":"表示会记录处理日期与联系人","text":"Vou anotar a data da resposta e o nome da pessoa com quem falei.","zh":"我会记下答复日期和与我交谈的人的姓名。","explanation":"com quem 保留 falar com 的介词。"}],"grammarCheck":[{"prompt":"选择表达“我昨天买了这件商品并保留了收据。”且语法、用法正确的一项。","options":["Compro este produto ontem e guardei o recibo.","Comprei este produto ontem e guardei o recibo.","Comprei este produto ontem e guardo-o ontem."],"answer":1,"explanation":"ontem 标明已完成过去事件，购买和保存均应使用相应过去式，不能无理由转为现在时。"},{"prompt":"选择表达“到家时，我发现了一个问题。”且语法、用法正确的一项。","options":["Quando cheguei em casa, reparei de um problema.","Quando chego a casa ontem, reparei num problema.","Quando cheguei a casa, reparei num problema."],"answer":2,"explanation":"欧洲葡语常用 chegar a casa；reparar em+um= num。与昨天的完成事件一致用 cheguei。"},{"prompt":"选择表达“我想平静地说明发生的情况。”且语法、用法正确的一项。","options":["Gostava de explicar o que aconteceu com calma.","Gostava explicar o que aconteceu com calma.","Gostava de explicar o que acontecer com calma."],"answer":0,"explanation":"gostava de 后接原形；已发生的经过用 aconteceu，不用未变位的 acontecer。"}],"writingChecklist":["购买与发现问题的先后是否清晰？","投诉是否包含具体事实而非只有情绪？","后续行动是否记录日期、联系人和请求号？"],"speakingFollowups":["工作人员没理解问题时你会如何补充？","如果需要进一步核查，你想问哪些跟进信息？","你如何礼貌说明对方的解释与小票不一致？"]}},{"id":"pt-21","number":21,"title":"讲述过去的经历","level":"B1","stage":"intermediate","goal":"将已学表达迁移到讲述过去的经历，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"No mês passado fui visitar uma amiga.","zh":"上个月我去看了一位朋友。"},{"text":"Saí cedo porque não conhecia bem o caminho.","zh":"我很早出发，因为不熟悉路线。"}]},"vocab":[{"head":"autocarro","zh":"公交车；长途客车","example":"Vou de autocarro.","exampleZh":"我乘公交车去。","icon":"travel","review":true},{"head":"comboio","zh":"火车","example":"O comboio chega cedo.","exampleZh":"火车很早到。","icon":"travel","review":true},{"head":"bilhete","zh":"票","example":"Preciso de um bilhete.","exampleZh":"我需要一张票。","icon":"travel","review":true},{"head":"ida","zh":"去程","example":"Queria um bilhete de ida.","exampleZh":"我想要一张单程票。","icon":"travel","review":true},{"head":"volta","zh":"回程","example":"A volta é amanhã.","exampleZh":"回程是明天。","icon":"travel","review":true},{"head":"paragem","zh":"公交站","example":"Onde fica a paragem?","exampleZh":"公交站在哪里？","icon":"travel","review":true},{"head":"estação","zh":"火车站；站","example":"A estação está aberta.","exampleZh":"车站开着。","icon":"travel","review":true},{"head":"linha","zh":"线路；股道","example":"Qual é a linha?","exampleZh":"是哪条线路／股道？","icon":"travel","review":true},{"head":"atraso","zh":"延误","example":"Há um atraso de dez minutos.","exampleZh":"延误十分钟。","icon":"time","review":true},{"head":"validar","zh":"验票；使票生效","example":"Onde tenho de validar o bilhete?","exampleZh":"我要在哪里验票？","icon":"travel","review":true}],"lessons":[{"id":"pt-21-1","text":"No mês passado fui visitar uma amiga.","zh":"上个月我去看了一位朋友。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-21-2","text":"Saí cedo porque não conhecia bem o caminho.","zh":"我很早出发，因为不熟悉路线。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-21-3","text":"Quando cheguei à estação, o comboio já tinha partido.","zh":"我到车站时，火车已经开走了。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-21-4","text":"Pedi ajuda e procurei outra ligação.","zh":"我求助并寻找另一个接驳方案。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-21-5","text":"Avisei a minha amiga de que chegaria mais tarde.","zh":"我告诉朋友自己会晚到。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-21-6","text":"No fim correu tudo bem e aprendi a verificar o horário.","zh":"最后一切顺利，我学会了核对时刻表。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"No mês passado fui visitar uma amiga. Saí cedo porque não conhecia bem o caminho. Quando cheguei à estação, o comboio já tinha partido. Pedi ajuda e procurei outra ligação. Avisei a minha amiga de que chegaria mais tarde. No fim correu tudo bem e aprendi a verificar o horário.","zh":"上个月我去看了一位朋友。我很早出发，因为不熟悉路线。我到车站时，火车已经开走了。我求助并寻找另一个接驳方案。我告诉朋友自己会晚到。最后一切顺利，我学会了核对时刻表。"},"assessment":{"reading":{"title":"陌生情境验收","text":"No sábado, a Mei planeava visitar um museu com o Chen. Estava a chover quando saiu de casa e demorou mais tempo a chegar à paragem. Perdeu o primeiro autocarro, mas não quis desistir do passeio. Telefonou ao Chen para avisar do atraso e consultou outra ligação. Encontraram-se meia hora depois do previsto. Como já tinham pouco tempo antes do almoço, decidiram visitar apenas uma exposição e deixar as outras para outra ocasião."},"questions":[{"prompt":"天气如何？","options":["下雪","晴朗","下雨"],"answer":2,"explanation":"Estava a chover。"},{"prompt":"Mei 为何打电话？","options":["取消房间","告知迟到","买午餐"],"answer":1,"explanation":"avisar do atraso。"},{"prompt":"他们晚了多久见面？","options":["半小时","一天","五分钟"],"answer":0,"explanation":"meia hora depois。"},{"prompt":"最后怎样安排？","options":["参观所有展览","只看一项展览","回家不去"],"answer":1,"explanation":"apenas uma exposição。"}],"writing":"围绕“讲述过去的经历”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“讲述过去的经历”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"pt-21","npc":"Ana","place":"朋友家的餐桌","scene":"朋友想听你的经历。按先后顺序讲清发生了什么，以及你怎样处理。","text":"Como correu o passeio? Aconteceu algum imprevisto?","zh":"出游怎么样？有没有意外情况？","icon":"travel"},"support":{"id":"pt-21","pronunciation":{"focus":"过去式中的重读尾音","explanation":"saí 的 í 单独成音节并重读；fui 是一个音节。cheguei 中 gue 保持硬 g 音，不按 ge 的发音读。","examples":[{"text":"Saí cedo.","zh":"我很早出门。"},{"text":"Cheguei tarde.","zh":"我晚到了。"}]},"grammarNotes":["完成过去动作可用 fui、saí、pedi；conhecia 表示过去的背景状态或持续认知。","já tinha partido 使用 ter 的未完成过去式+分词，表示比另一个过去时刻更早已完成。","avisar alguém de que… 保留介词 de；chegaria 从过去视点表示其后预计会发生的动作。"],"cultureNote":"在葡萄牙叙述出行经历时，ligação 可指交通衔接或换乘。描述延误宜说明自己看到的时间和采取的行动，不把某次经历概括为所有线路的固定情况。","vocabularyNotes":[{"head":"volta","note":"volta 可指返回；de volta 表返程或回来，取决于上下文。"},{"head":"linha","note":"linha 指线路或站台线道；询问时同时说目的地可避免误解。"},{"head":"atraso","note":"atraso 为阳性；com atraso 表示延误，chegar atrasado 表到晚。"}],"transfer":[{"id":"pt-21-transfer-1","prompt":"讲述上周去海边的经历","text":"Na semana passada fui de comboio até à praia.","zh":"上周我坐火车去了海边。","explanation":"na semana passada 是完成过去的时间框架。"},{"id":"pt-21-transfer-2","prompt":"说明当时赶早车的原因","text":"Saí de casa antes das sete porque queria evitar o trânsito.","zh":"我七点前出门，因为想避开交通拥堵。","explanation":"saí 为一次完成动作；queria 为当时的愿望背景。"},{"id":"pt-21-transfer-3","prompt":"描述到站时售票处已关门","text":"Quando cheguei, a bilheteira já tinha fechado.","zh":"我到达时，售票处已经关门了。","explanation":"tinha fechado 表示关门先于到达。"},{"id":"pt-21-transfer-4","prompt":"说明向司机询问替代路线","text":"Perguntei ao motorista se havia outro autocarro para o centro.","zh":"我问司机是否有另一班去市中心的公交车。","explanation":"perguntei a+o=ao；havia 描述当时的存在情况。"},{"id":"pt-21-transfer-5","prompt":"转述通知朋友会迟到","text":"Enviei uma mensagem a dizer que ia chegar depois do almoço.","zh":"我发了一条消息，说我会在午饭后到。","explanation":"ia chegar 从过去视角表达即将发生的到达。"},{"id":"pt-21-transfer-6","prompt":"说明经历后的收获","text":"Consegui chegar a tempo e passei a consultar os horários na véspera.","zh":"我成功及时到达，此后开始在前一天查看时刻表。","explanation":"passei a+原形表达从某时开始形成的新做法。"}],"grammarCheck":[{"prompt":"选择表达“上个月我去看了一位朋友。”且语法、用法正确的一项。","options":["No mês passado vou visitar uma amiga.","No mês passado foi visitar uma amiga eu.","No mês passado fui visitar uma amiga."],"answer":2,"explanation":"no mês passado 标记过去；“我去”过去式为 fui，不能用现在 vou 或第三人称 foi。"},{"prompt":"选择表达“我很早出发，因为不熟悉路线。”且语法、用法正确的一项。","options":["Saí cedo porque não conhecia bem o caminho.","Saí cedo porque não conheci bem o caminho nessa altura.","Saí cedo porque não conhecia bem a caminho."],"answer":0,"explanation":"此句“不熟悉路线”是出门时背景，用 conhecia；caminho 为阳性。"},{"prompt":"选择表达“我到车站时，火车已经开走了。”且语法、用法正确的一项。","options":["Quando cheguei à estação, o comboio já tinha partiu.","Quando cheguei à estação, o comboio já tinha partido.","Quando cheguei à estação, o comboio já tinham partido."],"answer":1,"explanation":"过去完成时为 tinha+分词 partido；comboio 单数，助动词用 tinha。"}],"writingChecklist":["完成动作与背景状态的时态是否区分？","较早发生的过去事件是否用 já tinha+分词？","原因、转折和结果是否按顺序交代？"],"speakingFollowups":["如果能重来，你会改变哪一个步骤？","你怎样说明到达前已经发生的事情？","朋友问你为什么迟到时，你会如何简明回答？"]}},{"id":"pt-22","number":22,"title":"计划与备选方案","level":"B1","stage":"intermediate","goal":"将已学表达迁移到计划与备选方案，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Gostava de organizar um passeio no próximo fim de semana.","zh":"我想在下周末组织一次出游。"},{"text":"Primeiro precisamos de combinar a hora e o lugar.","zh":"首先我们需要商量时间和地点。"}]},"vocab":[{"head":"amigo / amiga","zh":"朋友","example":"A Ana é minha amiga.","exampleZh":"安娜是我的朋友。","icon":"person","review":true},{"head":"convidar","zh":"邀请","example":"Quero convidar o Rui.","exampleZh":"我想邀请鲁伊。","icon":"talk","review":true},{"head":"jantar","zh":"晚餐；吃晚饭","example":"Vamos jantar juntos?","exampleZh":"我们一起吃晚饭好吗？","icon":"food","review":true},{"head":"passear","zh":"散步；逛","example":"Gosto de passear.","exampleZh":"我喜欢散步。","icon":"nature","review":true},{"head":"livre","zh":"有空的","example":"Estás livre amanhã?","exampleZh":"你明天有空吗？","icon":"time","review":true},{"head":"ocupado / ocupada","zh":"忙的","example":"Estou ocupada hoje.","exampleZh":"我今天很忙。","icon":"work","review":true},{"head":"combinar","zh":"约定","example":"Podemos combinar outra hora.","exampleZh":"我们可以另约时间。","icon":"talk","review":true},{"head":"talvez","zh":"也许","example":"Talvez no domingo.","exampleZh":"也许周日。","icon":"idea","review":true},{"head":"pena","zh":"遗憾","example":"Que pena!","exampleZh":"真遗憾！","icon":"talk","review":true},{"head":"aceitar","zh":"接受","example":"Obrigada por aceitar o convite.","exampleZh":"谢谢您接受邀请。","icon":"talk","review":true}],"lessons":[{"id":"pt-22-1","text":"Gostava de organizar um passeio no próximo fim de semana.","zh":"我想在下周末组织一次出游。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-22-2","text":"Primeiro precisamos de combinar a hora e o lugar.","zh":"首先我们需要商量时间和地点。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-22-3","text":"Se chover, podemos escolher uma atividade dentro de casa.","zh":"如果下雨，我们可以选择室内活动。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-22-4","text":"Prefiro confirmar o plano com todos antes de reservar.","zh":"我更愿意预订前和所有人确认计划。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-22-5","text":"Talvez seja melhor deixar algum tempo livre.","zh":"也许最好留出一些空闲时间。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-22-6","text":"Assim podemos adaptar o passeio sem pressa.","zh":"这样我们能从容调整行程。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Gostava de organizar um passeio no próximo fim de semana. Primeiro precisamos de combinar a hora e o lugar. Se chover, podemos escolher uma atividade dentro de casa. Prefiro confirmar o plano com todos antes de reservar. Talvez seja melhor deixar algum tempo livre. Assim podemos adaptar o passeio sem pressa.","zh":"我想在下周末组织一次出游。首先我们需要商量时间和地点。如果下雨，我们可以选择室内活动。我更愿意预订前和所有人确认计划。也许最好留出一些空闲时间。这样我们能从容调整行程。"},"assessment":{"reading":{"title":"陌生情境验收","text":"A Inês e dois amigos querem passar o domingo fora da cidade. Pensam ir de comboio, mas ainda não compraram os bilhetes. Antes de decidir, comparam o preço e o tempo de viagem de duas localidades. Uma delas tem um parque; a outra tem um museu perto da estação. Se a previsão indicar chuva, vão escolher o museu. Combinam voltar antes das oito da noite porque um dos amigos trabalha cedo na segunda-feira."},"questions":[{"prompt":"他们打算哪天出游？","options":["周日","周三","周五"],"answer":0,"explanation":"passar o domingo。"},{"prompt":"车票买了吗？","options":["买了","还没有","已经退票"],"answer":1,"explanation":"ainda não compraram。"},{"prompt":"下雨会选哪里？","options":["海滩","公园","博物馆"],"answer":2,"explanation":"vão escolher o museu。"},{"prompt":"为何八点前返回？","options":["朋友周一早上工作","车站关闭","没有饭店"],"answer":0,"explanation":"trabalha cedo na segunda-feira。"}],"writing":"围绕“计划与备选方案”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“计划与备选方案”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"pt-22","npc":"Inês","place":"周末计划桌","scene":"你们想一起出游。提出一个计划，也为天气或时间变化留个备选。","text":"E se chover? Temos outra opção para o passeio?","zh":"如果下雨呢？我们有另一个出游选择吗？","icon":"nature"},"support":{"id":"pt-22","pronunciation":{"focus":"未来条件词的读音","explanation":"chover 重音在 ver；talvez 重音在 vez。句首 Se chover 可独立成一个节奏块，再说应对方案。","examples":[{"text":"Se chover…","zh":"如果下雨……"},{"text":"Talvez seja melhor.","zh":"也许更好。"}]},"grammarNotes":["Se chover 中 chover 为将来虚拟式，规则动词形式与原形同形；不能据此认为 se 后总用原形。","talvez 放在动词前表达不确定性时通常配虚拟式：talvez seja，不能按肯定事实写 talvez é。","antes de reservar 后用原形；需要说明我们共同做某事时可使用人称不定式：antes de reservarmos。"],"cultureNote":"在葡萄牙朋友间安排周末，可先确认人数、集合地点和交通，再给出天气备选方案。是否需要预订应以具体场所信息为准。","vocabularyNotes":[{"head":"jantar","note":"jantar 可为“吃晚饭”的动词，也可为阳性名词“晚餐”；para jantar 与 para o jantar 含义依语境区别。"},{"head":"combinar","note":"combinar 可指约定安排：combinar a hora、combinar um encontro。"},{"head":"talvez","note":"talvez 表也许，不等于已经答应；作计划时可用它提出未确定的可能性。"}],"transfer":[{"id":"pt-22-transfer-1","prompt":"提议安排不需要长途旅行的活动","text":"Gostava de organizar um almoço perto de casa para não viajarmos muito.","zh":"我想在家附近安排午餐，这样我们不用走很远。","explanation":"para não viajarmos 使用人称不定式说明我们共同的目的。"},{"id":"pt-22-transfer-2","prompt":"商量人数再确定餐厅","text":"Primeiro precisamos de saber quantas pessoas vão antes de escolher o restaurante.","zh":"首先要知道有多少人去，再选餐厅。","explanation":"precisar de+原形；quantas pessoas 引出人数疑问。"},{"id":"pt-22-transfer-3","prompt":"天气炎热则改变活动地点","text":"Se estiver muito calor, podemos encontrar-nos num sítio com sombra.","zh":"如果很热，我们可以在有阴凉的地方见面。","explanation":"estiver 是 estar 的将来虚拟式；podemos+原形。"},{"id":"pt-22-transfer-4","prompt":"说明先确认预算再订票","text":"Prefiro confirmar o orçamento com o grupo antes de comprar os bilhetes.","zh":"我更愿意买票前先和大家确认预算。","explanation":"antes de comprar 明确尚未购票的顺序。"},{"id":"pt-22-transfer-5","prompt":"提出留出休息时间","text":"Talvez seja melhor fazer uma pausa depois do almoço.","zh":"也许午饭后休息一下更好。","explanation":"talvez 前置时使用虚拟式 seja。"},{"id":"pt-22-transfer-6","prompt":"解释备选方案的目的","text":"Assim, se alguém se atrasar, ainda temos tempo para ajustar o programa.","zh":"这样，如果有人迟到，我们仍有时间调整安排。","explanation":"se atrasar 的 se 是自反代词；前一个 se 引导条件。"}],"grammarCheck":[{"prompt":"选择表达“我想在下周末组织一次出游。”且语法、用法正确的一项。","options":["Gostava de organizar um passeio no próximo fim de semana.","Gostava organizar um passeio no próximo fim de semana.","Gostava de organizo um passeio no próximo fim de semana."],"answer":0,"explanation":"gostava de 后用原形 organizar，不能漏 de 或重复变位。"},{"prompt":"选择表达“首先我们需要商量时间和地点。”且语法、用法正确的一项。","options":["Primeiro precisamos combinar a hora e o lugar.","Primeiro precisamos de combinar a hora e o lugar.","Primeiro precisa de combinar a hora e o lugar nós."],"answer":1,"explanation":"precisar de 必须有 de；nós 的形式为 precisamos。"},{"prompt":"选择表达“如果下雨，我们可以选择室内活动。”且语法、用法正确的一项。","options":["Se choverá, podemos escolher uma atividade dentro de casa.","Se chover, podemos escolhemos uma atividade dentro de casa.","Se chover, podemos escolher uma atividade dentro de casa."],"answer":2,"explanation":"未来条件从句不用直陈式将来 choverá；podemos 后接原形 escolher。"}],"writingChecklist":["每个备选方案是否有明确触发条件？","talvez 后是否正确用虚拟式？","预订前要确认的人数、预算和时间是否完整？"],"speakingFollowups":["有人临时退出时你会怎样调整计划？","你怎样说明一个方案尚未最终确定？","如果天气预报改变，你会怎样通知大家？"]}},{"id":"pt-23","number":23,"title":"邻里与共同生活","level":"B1","stage":"intermediate","goal":"将已学表达迁移到邻里与共同生活，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Partilho a casa com duas pessoas.","zh":"我和两个人合住。"},{"text":"Queremos combinar algumas regras para os espaços comuns.","zh":"我们想商量公共空间的一些规则。"}]},"vocab":[{"head":"cozinha","zh":"厨房","example":"A cozinha é pequena.","exampleZh":"厨房很小。","icon":"home","review":true},{"head":"sala","zh":"客厅","example":"Estudo na sala.","exampleZh":"我在客厅学习。","icon":"home","review":true},{"head":"janela","zh":"窗户","example":"Abro a janela.","exampleZh":"我打开窗户。","icon":"home","review":true},{"head":"limpar","zh":"打扫","example":"Vou limpar a cozinha.","exampleZh":"我要打扫厨房。","icon":"home","review":true},{"head":"lavar","zh":"洗","example":"Preciso de lavar a roupa.","exampleZh":"我需要洗衣服。","icon":"home","review":true},{"head":"cozinhar","zh":"做饭","example":"Gosto de cozinhar.","exampleZh":"我喜欢做饭。","icon":"food","review":true},{"head":"levantar-se","zh":"起床","example":"Levanto-me às sete.","exampleZh":"我七点起床。","icon":"time","review":true},{"head":"deitar-se","zh":"上床睡觉","example":"Deito-me cedo.","exampleZh":"我很早上床睡觉。","icon":"time","review":true},{"head":"às vezes","zh":"有时","example":"Às vezes almoço em casa.","exampleZh":"我有时在家吃午饭。","icon":"time","review":true},{"head":"todos os dias","zh":"每天","example":"Leio todos os dias.","exampleZh":"我每天读书。","icon":"study","review":true}],"lessons":[{"id":"pt-23-1","text":"Partilho a casa com duas pessoas.","zh":"我和两个人合住。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-23-2","text":"Queremos combinar algumas regras para os espaços comuns.","zh":"我们想商量公共空间的一些规则。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-23-3","text":"Durante a semana preciso de descansar mais cedo.","zh":"工作日我需要早点休息。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-23-4","text":"Posso limpar a cozinha se alguém tratar do lixo.","zh":"如果有人处理垃圾，我可以清洁厨房。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-23-5","text":"Quando houver um problema, prefiro falar diretamente.","zh":"出现问题时，我更愿意直接交谈。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-23-6","text":"Podemos rever o acordo daqui a duas semanas.","zh":"我们可以两周后重新讨论约定。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Partilho a casa com duas pessoas. Queremos combinar algumas regras para os espaços comuns. Durante a semana preciso de descansar mais cedo. Posso limpar a cozinha se alguém tratar do lixo. Quando houver um problema, prefiro falar diretamente. Podemos rever o acordo daqui a duas semanas.","zh":"我和两个人合住。我们想商量公共空间的一些规则。工作日我需要早点休息。如果有人处理垃圾，我可以清洁厨房。出现问题时，我更愿意直接交谈。我们可以两周后重新讨论约定。"},"assessment":{"reading":{"title":"陌生情境验收","text":"O Luís partilha um apartamento com a Sara e o Pedro. Nas últimas semanas, tem sido difícil encontrar a cozinha limpa à noite. Em vez de deixar uma mensagem zangada, o Luís pede uma conversa no domingo. Os três combinam uma lista simples de tarefas e decidem não deixar loiça no lava-loiça até ao dia seguinte. A Sara trabalha por turnos, por isso pede alguma flexibilidade no horário. Concordam em experimentar o plano durante duas semanas."},"questions":[{"prompt":"他们讨论什么？","options":["车票","厨房清洁","学校课程"],"answer":1,"explanation":"cozinha limpa。"},{"prompt":"何时交谈？","options":["周日","周二","每天中午"],"answer":0,"explanation":"uma conversa no domingo。"},{"prompt":"Sara 为什么需要灵活时间？","options":["要旅游","不住那里","轮班工作"],"answer":2,"explanation":"trabalha por turnos。"},{"prompt":"先试多久？","options":["一年","两周","一个月"],"answer":1,"explanation":"durante duas semanas。"}],"writing":"围绕“邻里与共同生活”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“邻里与共同生活”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"pt-23","npc":"Rui","place":"公寓公共厨房","scene":"你和室友需要重新分配家务。把困难说清楚，也听听对方的安排。","text":"Como podemos dividir melhor as tarefas da casa?","zh":"我们怎样才能更好地分配家务？","icon":"home"},"support":{"id":"pt-23","pronunciation":{"focus":"lh 与词组重音","explanation":"partilho 的 lh 是一个腭边音；cozinha 的 nh 是鼻音，两者不要混同。espaços 的 ç 读 s。","examples":[{"text":"Partilho a cozinha.","zh":"我共用厨房。"},{"text":"Vou cozinhar.","zh":"我要做饭。"}]},"grammarNotes":["partilhar algo com alguém 表与某人分享或共用某物，不要把 com 省略。","se alguém tratar… 与 quando houver… 都面向未来可能情形，使用将来虚拟式；houver 的存在用法不变复数。","daqui a duas semanas 表两周以后；há duas semanas 表两周前或已持续两周，时间方向不同。"],"cultureNote":"在葡萄牙合住时，可用 espaços comuns 指共用空间，并商量 loiça、lixo 和清洁轮值。具体安静时段应由住户约定或核实适用规则，例句不代替规定。","vocabularyNotes":[{"head":"cozinha","note":"cozinha 阴性，可指厨房；cozinhar 是做饭的动词，两者勿混用。"},{"head":"lavar","note":"lavar a loiça 是洗餐具；lavar a roupa 是洗衣服，要把宾语说清。"},{"head":"todos os dias","note":"todos os dias 意为每天；合住分工中也可用 dia sim, dia não 表示隔天。"}],"transfer":[{"id":"pt-23-transfer-1","prompt":"说明厨房与三位室友共用","text":"Partilho a cozinha com três colegas que têm horários diferentes.","zh":"我和三位作息不同的室友共用厨房。","explanation":"com 引出合用者；que têm 的复数配 colegas。"},{"id":"pt-23-transfer-2","prompt":"提议讨论轮流清洁","text":"Podemos combinar quem limpa a sala em cada semana?","zh":"我们能商量每周谁清洁客厅吗？","explanation":"quem 引出分工内容，cada semana 表示逐周安排。"},{"id":"pt-23-transfer-3","prompt":"解释因早班要早点睡","text":"Como começo a trabalhar cedo, preciso de me deitar antes das dez.","zh":"因为我上班早，需要十点前睡觉。","explanation":"como 引出原因；preciso de me deitar 可把代词放在原形前。"},{"id":"pt-23-transfer-4","prompt":"提出条件式分工","text":"Posso lavar a loiça se outra pessoa limpar a mesa.","zh":"如果另一个人擦桌子，我可以洗餐具。","explanation":"limpar 为将来虚拟式同形，提出未来可行的交换分工。"},{"id":"pt-23-transfer-5","prompt":"约定问题出现时先发消息","text":"Quando surgir alguma dificuldade, podemos mandar uma mensagem ao grupo.","zh":"出现困难时，我们可以先在群里发消息。","explanation":"quando surgir 指将来情形；mandar algo a alguém。"},{"id":"pt-23-transfer-6","prompt":"提出试行再评估","text":"Experimentamos este plano durante uma semana e depois voltamos a falar.","zh":"我们先试行这个计划一周，然后再谈。","explanation":"durante 表持续时段；voltar a+原形表达再次行动。"}],"grammarCheck":[{"prompt":"选择表达“我和两个人合住。”且语法、用法正确的一项。","options":["Partilho a casa de duas pessoas.","Partilho a casa com duas pessoas.","Partilha a casa com duas pessoas eu."],"answer":1,"explanation":"合住伙伴用 com 引出；主语 eu 对应 partilho，不是 partilha。"},{"prompt":"选择表达“我们想商量公共空间的一些规则。”且语法、用法正确的一项。","options":["Queremos combinamos algumas regras para os espaços comuns.","Queremos combinar algumas regra para os espaço comum.","Queremos combinar algumas regras para os espaços comuns."],"answer":2,"explanation":"queremos 后接原形 combinar；algumas regras 和 os espaços comuns 都需复数一致。"},{"prompt":"选择表达“工作日我需要早点休息。”且语法、用法正确的一项。","options":["Durante a semana preciso de descansar mais cedo.","Durante a semana preciso descansar mais cedo.","Durante a semana precisam de descansar mais cedo eu."],"answer":0,"explanation":"precisar de 后接原形；第一人称单数为 preciso。"}],"writingChecklist":["分工是否说明谁做什么、何时做？","未来条件和时间从句是否用正确动词形式？","试行时长与复议日期是否区分？"],"speakingFollowups":["室友轮班导致原计划不可行时你会怎样商量？","你如何礼貌提醒对方清理餐具？","如果一次谈话没有解决问题，你会提出什么后续安排？"]}},{"id":"pt-24","number":24,"title":"综合生活任务","level":"B1","stage":"intermediate","goal":"将已学表达迁移到综合生活任务，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Mudei de casa e tenho vários assuntos para organizar.","zh":"我搬家了，有几件事需要安排。"},{"text":"Vou fazer uma lista e escolher o que é mais urgente.","zh":"我会列清单并选出最紧急的事情。"}]},"vocab":[{"head":"marcação","zh":"预约","example":"Tenho uma marcação para amanhã.","exampleZh":"我预约了明天。","icon":"time","review":true},{"head":"atendimento","zh":"接待；办事服务","example":"O atendimento começa às nove.","exampleZh":"办事服务九点开始。","icon":"work","review":true},{"head":"documento","zh":"文件；证件","example":"Que documento devo levar?","exampleZh":"我应带什么文件？","icon":"study","review":true},{"head":"formulário","zh":"表格","example":"Preciso de preencher o formulário.","exampleZh":"我需要填写表格。","icon":"work","review":true},{"head":"comprovativo","zh":"证明材料","example":"Este comprovativo é suficiente?","exampleZh":"这份证明材料足够吗？","icon":"study","review":true},{"head":"disponível","zh":"可用的；有空的","example":"Há uma hora disponível?","exampleZh":"有可预约的时间吗？","icon":"time","review":true},{"head":"adiar","zh":"推迟","example":"Preciso de adiar a marcação.","exampleZh":"我需要推迟预约。","icon":"time","review":true},{"head":"cancelar","zh":"取消","example":"Posso cancelar pela internet?","exampleZh":"我能在线取消吗？","icon":"time","review":true},{"head":"confirmar","zh":"确认","example":"Quero confirmar o horário.","exampleZh":"我想确认时间。","icon":"talk","review":true},{"head":"balcão","zh":"柜台","example":"Onde fica o balcão de informações?","exampleZh":"咨询柜台在哪里？","icon":"work","review":true}],"lessons":[{"id":"pt-24-1","text":"Mudei de casa e tenho vários assuntos para organizar.","zh":"我搬家了，有几件事需要安排。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-24-2","text":"Vou fazer uma lista e escolher o que é mais urgente.","zh":"我会列清单并选出最紧急的事情。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-24-3","text":"Preciso de confirmar a morada e a hora da marcação.","zh":"我需要确认地址和预约时间。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-24-4","text":"Se não conseguir ir, aviso o serviço com antecedência.","zh":"如果不能去，我会提前通知机构。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-24-5","text":"Depois de cada contacto guardo uma nota com a resposta.","zh":"每次联系后，我都记下答复。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"pt-24-6","text":"No fim verifico o que ficou por resolver.","zh":"最后我检查还有什么没有解决。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Mudei de casa e tenho vários assuntos para organizar. Vou fazer uma lista e escolher o que é mais urgente. Preciso de confirmar a morada e a hora da marcação. Se não conseguir ir, aviso o serviço com antecedência. Depois de cada contacto guardo uma nota com a resposta. No fim verifico o que ficou por resolver.","zh":"我搬家了，有几件事需要安排。我会列清单并选出最紧急的事情。我需要确认地址和预约时间。如果不能去，我会提前通知机构。每次联系后，我都记下答复。最后我检查还有什么没有解决。"},"assessment":{"reading":{"title":"陌生情境验收","text":"A Li mudou-se para um bairro novo. Tem uma marcação para entregar documentos na quarta-feira e quer também procurar um curso perto de casa. Ao consultar a confirmação, descobre que o atendimento será num edifício diferente do habitual. Envia uma pergunta sobr
