minha amiga de que chegaria mais tarde.":"../language-audio/92f4cc2643bad57f379c8b77.mp3","No fim correu tudo bem e aprendi a verificar o horário.":"../language-audio/7dc3689f759e91194112ca2f.mp3","No mês passado fui visitar uma amiga. Saí cedo porque não conhecia bem o caminho. Quando cheguei à estação, o comboio já tinha partido. Pedi ajuda e procurei outra ligação. Avisei a minha amiga de que chegaria mais tarde. No fim correu tudo bem e aprendi a verificar o horário.":"../language-audio/ed3c584b0448e3d4bcc731ae.mp3","No sábado, a Mei planeava visitar um museu com o Chen. Estava a chover quando saiu de casa e demorou mais tempo a chegar à paragem. Perdeu o primeiro autocarro, mas não quis desistir do passeio. Telefonou ao Chen para avisar do atraso e consultou outra ligação. Encontraram-se meia hora depois do previsto. Como já tinham pouco tempo antes do almoço, decidiram visitar apenas uma exposição e deixar as outras para outra ocasião.":"../language-audio/f6d8440201b25b2a58eb61be.mp3","Como correu o passeio? Aconteceu algum imprevisto?":"../language-audio/6fb775d5c0316850f9db41ee.mp3","Saí cedo.":"../language-audio/fa1105c76e9078ac0e239b68.mp3","Cheguei tarde.":"../language-audio/10710415f7ba973efe4bc95c.mp3","Na semana passada fui de comboio até à praia.":"../language-audio/0383f70268af113ff0cff2e4.mp3","Saí de casa antes das sete porque queria evitar o trânsito.":"../language-audio/5edfded45632e9cd0d3ae277.mp3","Quando cheguei, a bilheteira já tinha fechado.":"../language-audio/60b2ece94296fc9dc339f61b.mp3","Perguntei ao motorista se havia outro autocarro para o centro.":"../language-audio/4f6084963be97a8cf519586d.mp3","Enviei uma mensagem a dizer que ia chegar depois do almoço.":"../language-audio/c1f6151ec12c401101e5f449.mp3","Consegui chegar a tempo e passei a consultar os horários na véspera.":"../language-audio/912a57d08fa0ae72c4c4e32f.mp3","Gostava de organizar um passeio no próximo fim de semana.":"../language-audio/19aa4088d9d9ec0afbdc726b.mp3","Primeiro precisamos de combinar a hora e o lugar.":"../language-audio/634ca4df390cc85b4ec0933e.mp3","Se chover, podemos escolher uma atividade dentro de casa.":"../language-audio/f9843f09e9ca67792288b354.mp3","Prefiro confirmar o plano com todos antes de reservar.":"../language-audio/33770cb5dfa337df76000541.mp3","Talvez seja melhor deixar algum tempo livre.":"../language-audio/7f68c5d3931c8de4827990c2.mp3","Assim podemos adaptar o passeio sem pressa.":"../language-audio/60cf0e3017568bb6faa26099.mp3","Gostava de organizar um passeio no próximo fim de semana. Primeiro precisamos de combinar a hora e o lugar. Se chover, podemos escolher uma atividade dentro de casa. Prefiro confirmar o plano com todos antes de reservar. Talvez seja melhor deixar algum tempo livre. Assim podemos adaptar o passeio sem pressa.":"../language-audio/185d6605a1509a14a299fdfb.mp3","A Inês e dois amigos querem passar o domingo fora da cidade. Pensam ir de comboio, mas ainda não compraram os bilhetes. Antes de decidir, comparam o preço e o tempo de viagem de duas localidades. Uma delas tem um parque; a outra tem um museu perto da estação. Se a previsão indicar chuva, vão escolher o museu. Combinam voltar antes das oito da noite porque um dos amigos trabalha cedo na segunda-feira.":"../language-audio/eadec87e97af8c5208ffb058.mp3","E se chover? Temos outra opção para o passeio?":"../language-audio/80f5a4a00a959bb988514010.mp3","Se chover…":"../language-audio/b1a25f81abb319eb887f9f6a.mp3","Talvez seja melhor.":"../language-audio/51a316841a66f739e2c9975b.mp3","Gostava de organizar um almoço perto de casa para não viajarmos muito.":"../language-audio/88783eef992406a72652a0fe.mp3","Primeiro precisamos de saber quantas pessoas vão antes de escolher o restaurante.":"../language-audio/a967f1d30b04e7dc19e31065.mp3","Se estiver muito calor, podemos encontrar-nos num sítio com sombra.":"../language-audio/e5a9ca8970d51de98356676b.mp3","Prefiro confirmar o orçamento com o grupo antes de comprar os bilhetes.":"../language-audio/b17e135df230bf1915df5bb0.mp3","Talvez seja melhor fazer uma pausa depois do almoço.":"../language-audio/e94dad74bf4f0b689b5b72f5.mp3","Assim, se alguém se atrasar, ainda temos tempo para ajustar o programa.":"../language-audio/2505c715b15428e3188c4929.mp3","Partilho a casa com duas pessoas.":"../language-audio/87f183e19b18b20cdea58c80.mp3","Queremos combinar algumas regras para os espaços comuns.":"../language-audio/f7f7019d8c7bb0f6dbd3de66.mp3","Durante a semana preciso de descansar mais cedo.":"../language-audio/fa21fbd52033b2daddde3ccc.mp3","Posso limpar a cozinha se alguém tratar do lixo.":"../language-audio/165620d40a31e19b63393931.mp3","Quando houver um problema, prefiro falar diretamente.":"../language-audio/e192fbccbef18149838bb032.mp3","Podemos rever o acordo daqui a duas semanas.":"../language-audio/ea6c67c33834df7bc3e5dada.mp3","Partilho a casa com duas pessoas. Queremos combinar algumas regras para os espaços comuns. Durante a semana preciso de descansar mais cedo. Posso limpar a cozinha se alguém tratar do lixo. Quando houver um problema, prefiro falar diretamente. Podemos rever o acordo daqui a duas semanas.":"../language-audio/b69c31f1bd3692cb32a33c72.mp3","O Luís partilha um apartamento com a Sara e o Pedro. Nas últimas semanas, tem sido difícil encontrar a cozinha limpa à noite. Em vez de deixar uma mensagem zangada, o Luís pede uma conversa no domingo. Os três combinam uma lista simples de tarefas e decidem não deixar loiça no lava-loiça até ao dia seguinte. A Sara trabalha por turnos, por isso pede alguma flexibilidade no horário. Concordam em experimentar o plano durante duas semanas.":"../language-audio/0321d3affb76108e2f7d9d0f.mp3","Como podemos dividir melhor as tarefas da casa?":"../language-audio/a5ed7e5151e5cd5ca977bc7e.mp3","Partilho a cozinha.":"../language-audio/1d1a9b08ef7e2e57ff166e41.mp3","Vou cozinhar.":"../language-audio/367a10d03ceb7aaa912ab4bd.mp3","Partilho a cozinha com três colegas que têm horários diferentes.":"../language-audio/8f482c1b95973dcd2ab62515.mp3","Podemos combinar quem limpa a sala em cada semana?":"../language-audio/72040279c2a70012ed452544.mp3","Como começo a trabalhar cedo, preciso de me deitar antes das dez.":"../language-audio/a8f1c5988012de8404b3f68f.mp3","Posso lavar a loiça se outra pessoa limpar a mesa.":"../language-audio/7839b186ebb081ec6213f911.mp3","Quando surgir alguma dificuldade, podemos mandar uma mensagem ao grupo.":"../language-audio/3a76c1e682532bb9e81f0d03.mp3","Experimentamos este plano durante uma semana e depois voltamos a falar.":"../language-audio/10f056a137e090c8a79eb0b8.mp3","Mudei de casa e tenho vários assuntos para organizar.":"../language-audio/1a64da9a6bc8f52117f2be58.mp3","Vou fazer uma lista e escolher o que é mais urgente.":"../language-audio/26ccf06dd0c2f5b47240661c.mp3","Preciso de confirmar a morada e a hora da marcação.":"../language-audio/3cb301e9bf5c6c3f24c2bab1.mp3","Se não conseguir ir, aviso o serviço com antecedência.":"../language-audio/54ab0a7242e3984d8ae9fec3.mp3","Depois de cada contacto guardo uma nota com a resposta.":"../language-audio/998dd3f1894b0bcc3eac6dd9.mp3","No fim verifico o que ficou por resolver.":"../language-audio/4a7dfef7e38c4e280905e964.mp3","Mudei de casa e tenho vários assuntos para organizar. Vou fazer uma lista e escolher o que é mais urgente. Preciso de confirmar a morada e a hora da marcação. Se não conseguir ir, aviso o serviço com antecedência. Depois de cada contacto guardo uma nota com a resposta. No fim verifico o que ficou por resolver.":"../language-audio/be7a7a71dde6067f0bcfd43b.mp3","A Li mudou-se para um bairro novo. Tem uma marcação para entregar documentos na quarta-feira e quer também procurar um curso perto de casa. Ao consultar a confirmação, descobre que o atendimento será num edifício diferente do habitual. Envia uma pergunta sobre a morada e prepara os documentos indicados na mensagem. Depois contacta uma escola, mas a turma que prefere está completa. Pede informação sobre outra turma e anota que ainda está à espera dessa resposta.":"../language-audio/ab756126eb89e91b7e682eb9.mp3","Qual destes assuntos precisa de resolver primeiro?":"../language-audio/1037afd4d401e591391c5fad.mp3","A confirmação chegou.":"../language-audio/5d9dfe4428abe6f968d05b45.mp3","Comecei um trabalho novo e preciso de reorganizar as minhas marcações.":"../language-audio/71d05ab7230763fefa38f43b.mp3","Vou ordenar as tarefas pelo prazo e tratar primeiro da mais urgente.":"../language-audio/36a6cf18f0f6086c80ada8a8.mp3","Preciso de confirmar se o atendimento continua no mesmo edifício.":"../language-audio/0b8fe521333ad1b0c4babfcf.mp3","Se tiver de adiar a visita, aviso também a pessoa que vai comigo.":"../language-audio/4739a7a38d5e8cef37783940.mp3","Depois de falar com cada serviço, anoto o passo seguinte e a data.":"../language-audio/2082e7794eb7d64cfa03eb26.mp3","No fim, separo os assuntos resolvidos daqueles que ainda aguardam resposta.":"../language-audio/2d9cb41db49a1912397fb9bd.mp3","A Joana trabalha numa pequena loja de fruta. Hoje chega às oito e abre a porta às oito e meia. Na primeira caixa há peras, e as maçãs estão junto à janela. Um cliente pede dois quilos de peras, mas leva apenas um quilo porque o saco é pequeno. Paga em dinheiro e pede o talão. Antes de sair, pergunta a que horas a loja fecha. A Joana responde: às seis da tarde.":"../language-audio/08d4f10eac8796b9976a783c.mp3","Boa tarde. Queria encomendar pão para amanhã de manhã. Somos quatro pessoas e precisamos de seis pães pequenos. Não queremos queijo nem leite. Posso passar aqui às nove? O meu nome é Teresa. Se não perceber o nome, posso escrevê-lo neste papel. Queria saber também quanto custa a encomenda toda.":"../language-audio/0aef312ab14a35842e492c83.mp3","O Miguel vai passar duas noites numa pensão perto do rio. Quando chega, a rececionista explica que o quarto fica no primeiro andar e que não há elevador. O Miguel traz uma mala pesada e pede ajuda. Depois pergunta pelo pequeno-almoço, que começa às sete e termina às dez. Quer sair cedo para visitar um amigo, por isso combina tomar o pequeno-almoço às sete e meia. À noite, prefere jantar fora com esse amigo.":"../language-audio/352e52f1f638b2373d9a9ab6.mp3","Olá, sou a tua vizinha do andar de cima. Amanhã vêm cá dois amigos e vamos cozinhar ao fim da tarde. Queria perguntar se precisas de usar a cozinha entre as seis e as sete. Se precisares, posso começar mais cedo. Também queria convidar-te para jantar connosco. Não há problema se não puderes ficar até ao fim.":"../language-audio/5710a7c09f1cbb806024c627.mp3","A associação do bairro enviou um email sobre uma oficina de fotografia. A Rita quer participar, mas o horário coincide com uma reunião de trabalho. Antes de pagar a inscrição, escreve à organização para perguntar se haverá outra sessão. Recebe uma resposta que propõe sábado de manhã, num edifício diferente. A Rita pede a morada completa e confirma que pode levar a sua própria máquina. Só depois guarda a resposta e ajusta a agenda.":"../language-audio/dc31fbc0ccbc4c47e380fc83.mp3","Bom dia. Estou a ligar por causa do ficheiro que enviou ontem. Consegui abrir o anexo, mas faltam os dados da última semana. Poderia enviar uma versão atualizada até às três? Não precisa de alterar o texto da apresentação. Se não conseguir reunir todos os números, envie primeiro os que já confirmou e indique o que falta.":"../language-audio/d236496f6caa697f21d3f54f.mp3","Na segunda-feira, o André recebeu duas mensagens sobre uma visita de estudo. Uma indicava a estação antiga; a outra, a praça do mercado. Como não sabia qual era a versão mais recente, contactou a organizadora pelo número habitual. Descobriu que o local tinha mudado, mas a hora continuava igual. Avisou os colegas e guardou a confirmação. No sábado, um amigo atrasou-se. O grupo esperou dez minutos e depois combinou encontrá-lo junto à entrada do museu.":"../language-audio/6929f1409c94095f5ceaddce.mp3","Olá a todos. Já falei com o senhorio sobre a janela da sala. Ele pediu fotografias antes de marcar a reparação. Posso enviá-las hoje, mas preciso de saber quando há alguém em casa na próxima semana. Se o técnico só puder vir de manhã, consigo ficar na terça-feira. Nos outros dias, seria bom combinarmos quem fica em casa. Depois envio ao grupo a confirmação por escrito.":"../language-audio/0ef70efd91ac2be0ade2b8e4.mp3"};</script><script>(function(root){'use strict';

function lessonTask(id){if(window.ContinentEnhance){window.ContinentEnhance.lesson(id,chapter);return}const c=chapter,l=c.lessons.find(l=>l.id===id),opts=shuffle([l.zh,...shuffle(c.lessons.filter(x=>x.id!==id)).slice(0,2).map(x=>x.zh)]);mount('<article class="card wide"><small>理解练习</small><p class="target" lang="'+C.id+'">'+H(l.text)+'</p>'+audioButtons(l.text)+'<form id="lessonForm">'+opts.map((o,i)=>'<label class="option"><input required type="radio" name="meaning" value="'+i+'">'+H(o)+'</label>').join('')+'<button class="primary">核对理解</button></form><div id="lessonFeedback" aria-live="polite"></div><button id="returnChapter">返回章节</button></article>');$('#returnChapter').onclick=()=>openChapter(c.id);$('#lessonForm').onsubmit=e=>{e.preventDefault();const ok=opts[+new FormData(e.target).get('meaning')]===l.zh;if(ok){s.lessons[id]=true;if(c.lessons.every(l=>s.lessons[l.id]))for(const v of c.vocab){s.vocab[v.head]||={};s.vocab[v.head].seen=true}save()}else{s.wrong[id]={chapter:c.id,prompt:l.text,answer:l.zh,explanation:l.tip,date:Date.now()};save()}$('#lessonFeedback').innerHTML='<div class="feedback">'+(ok?'✓ 理解正确。':'↻ 再理解一次：')+H(l.zh)+'<p>'+H(l.tip)+'</p></div>';e.target.querySelector('button').disabled=true}}

function practice(){if(window.ContinentEnhance){window.ContinentEnhance.practice();return}const map=new Map(C.chapters.flatMap(c=>c.vocab).map(v=>[v.head,v])),eligible=[...map.values()].filter(v=>s.vocab[v.head]?.seen);if(eligible.length<20){alert('需先在词汇页学习至少20个不同词条。当前 '+eligible.length+' 个。');return}const queue=shuffle(eligible).slice(0,20);let index=0,passedWords=0;const next=()=>{if(index===20){mount('<article class="card wide"><h1>本轮完成</h1><p>'+passedWords+'/20 词拼写与词义都正确。</p><p>每个词的两项独立正确次数分别记录；24小时内重复正确不会重复增加掌握计数。错误或使用提示会清零该项连续次数。</p><button id="donePractice">返回课程地图</button></article>');$('#donePractice').onclick=home;return}const v=queue[index],options=shuffle([v.zh,...shuffle([...new Set([...map.values()].map(x=>x.zh))].filter(x=>x!==v.zh)).slice(0,3)]);let helped=false;mount('<article class="card wide"><small>词汇抽查 '+(index+1)+' / 20</small><div class="cue">'+WordCues.svg(v.head,v.zh,v.icon)+'</div><h2>听音拼写，再选择词义</h2>'+audioButtons(v.head)+'<p class="muted">示意图仅辅助联想，不代表所有词义。</p><form id="practiceForm"><label for="spelling">拼写（请保留重音；德语名词保留大写）</label><input id="spelling" lang="'+C.id+'" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required>'+options.map((o,i)=>'<label class="option"><input type="radio" name="meaning" required value="'+i+'">'+H(o)+'</label>').join('')+'<div class="row"><button class="primary">提交这个词</button><button id="hint" type="button">查看提示（本次不计通过）</button></div></form><div id="practiceFeedback" aria-live="polite"></div><button id="nextWord" hidden>下一个词 →</button></article>');$('#hint').onclick=()=>{helped=true;$('#practiceFeedback').textContent=v.head+'：'+v.zh};$('#practiceForm').onsubmit=e=>{e.preventDefault();const correct={spelling:norm($('#spelling').value)===norm(v.head),meaning:options[+new FormData(e.target).get('meaning')]===v.zh},now=Date.now();for(const skill of ['spelling','meaning']){const c=s.vocab[v.head][skill]||{count:0,last:0,due:now};if(!correct[skill]||helped){c.count=0;c.last=now;c.due=now+600000;s.wrong['word-'+v.head+'-'+skill]={chapter:C.chapters.find(c=>c.vocab.some(x=>x.head===v.head)).id,prompt:skill==='spelling'?'听音拼写：'+v.zh:v.head,answer:skill==='spelling'?v.head:v.zh,explanation:v.example+' · '+v.exampleZh,date:now}}else if(!c.count||now>=c.last+DAY){c.count=Math.min(100,c.count+1);c.last=now;c.due=now+Math.min(30,2**Math.min(c.count-1,5))*DAY}s.vocab[v.head][skill]=c}if(correct.spelling&&correct.meaning&&!helped)passedWords++;save();$('#practiceFeedback').innerHTML='<div class="feedback"><b>'+H(v.head)+' · '+H(v.zh)+'</b><p>拼写：'+(correct.spelling?'正确':'需复练')+' · 词义：'+(correct.meaning?'正确':'需复练')+(helped?' · 已使用提示':'')+'</p><p>'+H(v.example)+'<br>'+H(v.exampleZh)+'</p></div>';e.target.querySelectorAll('input,button').forEach(x=>x.disabled=true);$('#nextWord').hidden=false;$('#nextWord').onclick=()=>{index++;next()}}};next()}

function repair(id){const e=D().errors[id];if(!e)return;const c=C.chapters.find(c=>c.id===e.chapter);let viewed=false;frame('理解与延迟回忆','<article class="card wide"><h2>'+H(e.prompt)+'</h2><p>如果已到延迟复练日期，先独立作答；打开下面的答案讲解会标记本轮使用提示。</p><details id="repairExplain"><summary>先查看错因与参考答案（本轮不计独立通过）</summary><p>'+H(e.answer)+'</p><div class="feedback">'+H(e.explanation)+'</div></details><label for="errorNote">用自己的话记录理解或疑问</label><textarea id="errorNote" maxlength="2000">'+H(e.note)+'</textarea><p class="muted">到期前答对只计训练。延迟复练可能包含原题，再接章节变式；熟题不会被说成陌生能力证据。</p><button class="primary" id="repairStart">开始独立回忆</button></article>');$('#repairExplain').ontoggle=()=>{if($('#repairExplain')?.open)viewed=true};$('#repairStart').onclick=()=>{e.note=$('#errorNote').value;A.save();if(e.head&&e.skill){repairWord(id,viewed);return}let q=null,context='',listen=false;const parts=id.split(':');if(id.startsWith('grammar:'))q=c.support.grammarCheck[+parts.at(-1)];if(id.startsWith('checkpoint:')){const b=C.checkpoints.find(b=>b.id===parts[1]),i=+parts.at(-1);if(b){q=[...b.reading.questions,...b.listening.questions][i];listen=i>=4;context=listen?b.listening.text:b.reading.text}}if(id.startsWith('legacy:')){const m=id.match(/-q(\d+)$/);if(m){q=c.assessment.questions[+m[1]];context=c.assessment.reading.text}}

async function exportRecording(){const blob=A.latestRecording;if(!blob){$('#notice').textContent='请先录音或导入设备录音，再导出。';return}if(blob.size>15000000){$('#notice').textContent='录音过大，请缩短至120秒以内。';return}const bytes=new Uint8Array(await blob.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));download('语言大陆-'+C.id+'-录音.json',JSON.stringify({type:'continent-recording',version:1,locale:C.id,mime:blob.type,date:Date.now(),data:btoa(binary)}))}
function download(name,text){if(window.QuestLocalExport?.text){try{window.QuestLocalExport.text(name,text)}catch(e){$('#notice').textContent=e.message}return}if(window.QuestNative?.saveText){window.QuestNative.saveText(name,text);return}const u=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
async function restoreRecording(e){try{const file=e.target.files[0];if(!file||file.size>21000000)throw Error('请选择21MB以内的本应用录音备份');const x=JSON.parse(await file.text());if(x.type!=='continent-recording'||x.version!==1||x.locale!==C.id||!/^audio\//.test(x.mime)||typeof x.data!=='string')throw Error('录音格式或语言不匹配');const raw=atob(x.data);if(raw.length>15000000)throw Error('录音过大');const blob=new Blob([Uint8Array.from(raw,c=>c.charCodeAt(0))],{type:x.mime});A.latestRecording=blob;const u=URL.createObjectURL(blob);$('#restoredAudio').innerHTML='<audio controls></audio>';$('#restoredAudio audio').src=u;$('#restoredAudio audio').onloadeddata=()=>URL.revokeObjectURL(u)}catch(e){$('#notice').textContent='恢复录音失败：'+e.message}}
function checkpoints(){frame('阶段综合测评','<p>每6章一组，阅读与听力材料独立于日常教学。首次开始即记录材料暴露；重复练习会标记熟题。口语、写作任务需人工反馈，客观题不能直接换算 CEFR 或雅思。</p><div class="grid">'+C.checkpoints.map(b=>{const records=D().checkpoints.filter(a=>a.id===b.id),last=records.at(-1);return '<article class="card"><span class="tag">第'+b.afterChapter+'章后 · '+b.target+' 内容目标</span><h2>阶段 '+H(b.id.split('-').at(-1))+'</h2><p>阅读4题＋听力4题＋写作与互动任务。</p><p>'+(last?'最近：阅读 '+last.reading+'/4 · 听力 '+last.listening+'/4 · '+(last.fresh&&!last.assisted?'首次未用提示':'熟题或有提示'):'尚未测评，可用作前测')+'</p><button data-checkpoint="'+b.id+'">开始／复测</button></article>'}).join('')+'</div><section class="card wide"><h2>如何理解结果</h2><p>单项3/4可作为本组材料的复习参考，不能证明整体达级。多次复测熟题不会形成新的陌生能力证据。请分别保留写作原稿、修订和口语录音，必要时请合适的评阅者检查。</p>'+D().checkpoints.slice(-12).reverse().map(a=>'<p>'+H(a.id)+' · '+new Date(a.date).toLocaleString()+' · 阅读 '+a.reading+'/4 · 听力 '+a.listening+'/4 · '+(a.fresh&&!a.assisted?'首次无提示记录':'熟题／提示记录')+'</p>').join('')+'</section>');document.querySelectorAll('[data-checkpoint]').forEach(b=>b.onclick=()=>checkpoint(b.dataset.checkpoint))}
function checkpoint(id){const bank=C.checkpoints.find(b=>b.id===id);let fresh=!D().exposures[id+':reading']&&!D().exposures[id+':listening'],assisted=false,submitted=false,heard=false;const started=Date.now();L.expose(S(),id+':reading',started);L.expose(S(),id+':listening',started);A.save();const qs=[...bank.reading.questions,...bank.listening.questions];frame('阶段综合测评 · '+bank.target,'<article class="card wide"><p>'+(fresh?'本机首次接触本组材料。':'本组材料已接触过，本次记为熟题复测。')+' 暂不查看翻译或笔记，先完成客观题。可随时离开，离开也保留“已暴露”标记。</p><h2>阅读</h2><p class="target" lang="'+C.id+'">'+H(bank.reading.text)+'</p><h2>听力</h2>'+A.audioButtons(bank.listening.text)+'<button id="showTranscript">需要文字脚本（将标记使用提示）</button><div id="transcript"></div><form id="checkpointForm">'+qs.map((q,i)=>'<fieldset><legend>'+(i<4?'阅读':'听力')+' '+(i%4+1)+' · '+H(q.prompt)+'</legend>'+shuffle(q.options.map((text,j)=>({text,j}))).map(o=>'<label class="option"><input required type="radio" name="s'+i+'" value="'+o.j+'">'+H(o.text)+'</label>').join('')+'</fieldset>').join('')+'<button class="primary">提交客观题</button></form><div id="checkpointFeedback"></div><h2>写作与互动</h2><p>'+H(bank.writing)+'</p><p>'+H(bank.speaking)+'</p><p class="muted">请在对应章节的写作与口语页保存输出及反馈。客观题通过不替代这两项能力证据。</p><button id="stageBack">返回阶段记录</button></article>');$('#stageBack').onclick=checkpoints;document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=async()=>{const player=await A.play(b.dataset.audio,Number(b.dataset.rate)||1);player?.addEventListener?.('ended',()=>{heard=true;$('#notice').textContent='已完整播放一次听力，可提交客观题。'},{once:true})});$('#showTranscript').onclick=()=>{assisted=true;$('#transcript').innerHTML='<p class="target">'+H(bank.listening.text)+'</p><p class="muted">本次已标记使用文字提示。</p>'};$('#checkpointForm').onsubmit=e=>{e.preventDefault();if(submitted)return;if(!heard){$('#notice').textContent='请先完整播放至少一次听力音频，再提交本组客观题。';return}submitted=true;const answers=qs.map((_,i)=>+new FormData(e.target).get('s'+i)),bits=answers.map((a,i)=>a===qs[i].answer),record={id,date:Date.now(),started,answers,reading:bits.slice(0,4).filter(Boolean).length,listening:bits.slice(4).filter(Boolean).length,fresh,assisted,heard};D().checkpoints.push(record);D().checkpoints=D().checkpoints.slice(-100);qs.forEach((q,i)=>{if(!bits[i])L.error(S(),'checkpoint:'+id+':'+i,{chapter:C.chapters[bank.afterChapter-1].id,source:'阶段综合测评',cause:i<4?'inference':'listening',prompt:q.prompt,answer:q.options[q.answer],response:q.options[answers[i]],explanation:q.explanation})});A.save();$('#checkpointFeedback').innerHTML='<div class="feedback"><h2>阅读 '+record.reading+'/4 · 听力 '+record.listening+'/4</h2><p>'+(fresh&&!assisted?'首次无文字提示记录。':'本次为熟题或使用提示，不作为新的陌生材料表现。')+'</p>'+qs.map((q,i)=>'<p>'+(bits[i]?'✓':'↻')+' '+H(q.prompt)+'：'+H(q.options[q.answer])+'<br>'+H(q.explanation)+'</p>').join('')+'<p>结果只描述这组材料的客观题表现，不授予 CEFR 或雅思等级。</p></div>';e.target.querySelectorAll('input,button').forEach(b=>b.disabled=true)}}

(function(){'use strict';const KEY='twin-islands-grammar-summary-v1';let carried=null;
function valid(x){if(!x||typeof x!=='object')return null;for(const k of ['chapters','completedChapters','missions','completedMissions','questions','solvedQuestions','independentQuestions','wrong'])if(!Number.isInteger(x[k])||x[k]<0||x[k]>100000)return null;if(x.completedChapters>x.chapters||x.completedMissions>x.missions||x.solvedQuestions>x.questions||x.independentQuestions>x.solvedQuestions)return null;return x}

(function(){'use strict';const KEY='continent-summaries-v1',ids=['english','grammar','pt-PT','es-ES','de-DE'];let summaries={};
function clean(x){if(!x||typeof x!=='object')return null;const out={};for(const k of ['chapters','completed','lessons','totalLessons','studied','mastered','fluent','remembered','updated','deepCompleted','completedStages','totalStages']){const n=Number(x[k]||0);if(!Number.isFinite(n)||n<0||n>1e14)return null;out[k]=Math.floor(n)}if(out.completed>out.chapters||out.lessons>out.totalLessons||out.deepCompleted>out.chapters||out.completedStages>out.totalStages)return null;return out}
function merge(x){for(const id of ids){const v=clean(x?.[id]);if(v&&(!summaries[id]||v.updated>=summaries[id].updated))summaries[id]=v}}
try{merge(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{}merge(window.ContinentIncoming?.summaries);
const g=window.ContinentIncoming?.grammar;if(g&&typeof window.VocabularyProgress?.grammarSummary==='function'){const v=window.VocabularyProgress.grammarSummary(g);if(v)try{localStorage.setItem('twin-islands-grammar-summary-v1',JSON.stringify(v))}catch{}}else if(g&&Number.isInteger(g.completedMissions)&&g.completedMissions<=g.missions)try{localStorage.setItem('twin-islands-grammar-summary-v1',JSON.stringify(g))}catch{}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(summaries))}catch{}document.querySelectorAll('[data-continent-progress]').forEach(el=>{const id=el.dataset.continentProgress,v=summaries[id];el.textContent=v&&v.totalStages?v.deepCompleted+' / '+v.chapters+' 章精练 · '+v.completedStages+' / '+v.totalStages+' 步':v?v.completed+' / '+v.chapters+' 章 · '+v.lessons+' / '+v.totalLessons+(id==='grammar'?' 个任务':' 个句子任务'):'尚未开始 · 进度保存在本机'})}
function publish(id,x){if(!ids.includes(id))return;const v=clean(x);if(v){summaries[id]=v;persist()}}
function update(){try{if(window.ContinentCourse)publish(window.ContinentData.id,window.ContinentCourse.summary());if(typeof state!=='undefined'&&typeof lessons!=='undefined'&&typeof chapters!=='undefined'){const completed=new Set(state.completed||[]),v=window.VocabularyProgress?.summary(state);publish('english',{chapters:chapters.length,completed:chapters.filter((c,i)=>{const ls=lessons.filter(l=>l.chapter===i+1);return ls.length&&ls.every(l=>completed.has(l.id))}).length,lessons:completed.size,totalLessons:lessons.length,studied:v?.studied||0,mastered:v?.masteredTotal||0,fluent:v?.fluent||0,remembered:v?.remembered||0,updated:Date.now()})}const g=window.QuestSuiteGrammar?.();if(g)publish('grammar',{chapters:g.chapters,completed:g.completedChapters,lessons:g.completedMissions,totalLessons:g.missions,updated:g.updated||Date.now()})}catch{}persist()}
