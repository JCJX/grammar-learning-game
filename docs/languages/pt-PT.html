e a morada e prepara os documentos indicados na mensagem. Depois contacta uma escola, mas a turma que prefere está completa. Pede informação sobre outra turma e anota que ainda está à espera dessa resposta."},"questions":[{"prompt":"办事预约在哪天？","options":["周四","周一","周三"],"answer":2,"explanation":"na quarta-feira。"},{"prompt":"确认消息有何变化？","options":["另一栋楼","改成电话","已取消"],"answer":0,"explanation":"num edifício diferente。"},{"prompt":"课程遇到什么问题？","options":["没有教材","想去的班已满","学校搬走"],"answer":1,"explanation":"a turma… está completa。"},{"prompt":"她还在等待什么？","options":["房租","另一班的信息","银行密码"],"answer":1,"explanation":"informação sobre outra turma。"}],"writing":"围绕“综合生活任务”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“综合生活任务”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"pt-24","npc":"Ana","place":"新社区的早晨","scene":"搬家后有几件事要办。列出优先顺序，逐项确认还缺哪些信息。","text":"Qual destes assuntos precisa de resolver primeiro?","zh":"这些事情中，您需要先解决哪一件？","icon":"idea"},"support":{"id":"pt-24","pronunciation":{"focus":"辅音群与任务词重音","explanation":"documento 重音在 men；confirmar 重音在 mar，confirmação 则在 ção。区分动词与名词的节奏有助于理解待办内容。","examples":[{"text":"Vou confirmar.","zh":"我会确认。"},{"text":"A confirmação chegou.","zh":"确认消息到了。"}]},"grammarNotes":["mudei de casa 为已完成搬家；tenho assuntos para organizar 为现在尚待处理，两种时态可在同一句并用。","Se não conseguir ir 中 conseguir 为将来虚拟式；否定条件中不能因 não 而改用原形以外的随意形式。","ficar por+原形表示尚未完成：ficou por resolver；与 ficar a resolver“留下来解决”意义不同。"],"cultureNote":"在葡萄牙处理多项生活事务时，可分别记录每个机构的确认信息和待答复事项。本章是综合语言练习，不提供具体机构的办理承诺或材料清单。","vocabularyNotes":[{"head":"documento","note":"documento 阳性；os documentos necessários 中形容词需复数。"},{"head":"confirmar","note":"confirmar 可直接接 a morada、a hora；不是所有“确认”都意味着预约已经成功。"},{"head":"balcão","note":"balcão 阳性，复数 balcões；balcão de atendimento 指服务柜台。"}],"transfer":[{"id":"pt-24-transfer-1","prompt":"说明新工作开始后需要重排事务","text":"Comecei um trabalho novo e preciso de reorganizar as minhas marcações.","zh":"我开始了一份新工作，需要重新安排预约。","explanation":"comecei 表完成的变化；preciso de 表当前需求。"},{"id":"pt-24-transfer-2","prompt":"给待办事项按期限排序","text":"Vou ordenar as tarefas pelo prazo e tratar primeiro da mais urgente.","zh":"我会按期限排列任务，先处理最紧急的一项。","explanation":"tratar de+a 合并为 da；a mais urgente 省略 tarefa。"},{"id":"pt-24-transfer-3","prompt":"核对预约地点是否发生变化","text":"Preciso de confirmar se o atendimento continua no mesmo edifício.","zh":"我需要确认办事接待是否仍在同一栋楼里。","explanation":"se 引出是否；continua 说明现状是否延续。"},{"id":"pt-24-transfer-4","prompt":"表示如果改期会同时通知同伴","text":"Se tiver de adiar a visita, aviso também a pessoa que vai comigo.","zh":"如果必须推迟到访，我也会通知和我同行的人。","explanation":"tiver 为 ter 的将来虚拟式；ter de 后用原形。"},{"id":"pt-24-transfer-5","prompt":"说明每次联络后记录下一步","text":"Depois de falar com cada serviço, anoto o passo seguinte e a data.","zh":"与每个服务机构联系后，我会记下下一步和日期。","explanation":"depois de+原形表达已完成联络后的动作。"},{"id":"pt-24-transfer-6","prompt":"总结尚在等待答复的事项","text":"No fim, separo os assuntos resolvidos daqueles que ainda aguardam resposta.","zh":"最后，我把已解决的事项与仍在等待答复的事项分开。","explanation":"separar algo de algo；daqueles=de+aqueles，指余下的事项。"}],"grammarCheck":[{"prompt":"选择表达“我搬家了，有几件事需要安排。”且语法、用法正确的一项。","options":["Mudo de casa ontem e tenho vários assuntos para organizar.","Mudei de casa e tem vários assuntos para organizar eu.","Mudei de casa e tenho vários assuntos para organizar."],"answer":2,"explanation":"已完成搬家用 mudei；“我有”用 tenho，不能用第三人称 tem。"},{"prompt":"选择表达“我会列清单并选出最紧急的事情。”且语法、用法正确的一项。","options":["Vou fazer uma lista e escolher o que é mais urgente.","Vou faço uma lista e escolher o que é mais urgente.","Vou fazer uma lista e escolho o que é mais urgente ontem."],"answer":0,"explanation":"vou 后的并列动作保持原形 fazer、escolher；不能插入过去时间又无理由改用现在。"},{"prompt":"选择表达“我需要确认地址和预约时间。”且语法、用法正确的一项。","options":["Preciso confirmar a morada e a hora da marcação.","Preciso de confirmar a morada e a hora da marcação.","Preciso de confirmo a morada e a hora da marcação."],"answer":1,"explanation":"precisar de 需 de；其后动词为原形 confirmar，不是 confirmo。"}],"writingChecklist":["已完成、计划中和等待答复的事项是否明确？","未来条件中的不规则形式如 tiver 是否正确？","每个事项是否记录下一步与期限？"],"speakingFollowups":["两项预约冲突时你先联系哪一方，怎样说明？","如何追问仍未收到答复的事项？","你会怎样向朋友简要汇报今天办事的结果？"]}}],"checkpoints":[{"id":"pt-stage-1","afterChapter":6,"target":"A1","reading":{"text":"A Joana trabalha numa pequena loja de fruta. Hoje chega às oito e abre a porta às oito e meia. Na primeira caixa há peras, e as maçãs estão junto à janela. Um cliente pede dois quilos de peras, mas leva apenas um quilo porque o saco é pequeno. Paga em dinheiro e pede o talão. Antes de sair, pergunta a que horas a loja fecha. A Joana responde: às seis da tarde.","questions":[{"prompt":"商店几点开门？","options":["八点","八点半","下午六点"],"answer":1,"explanation":"八点是到达时间；abre a porta às oito e meia 才是开门时间。"},{"prompt":"苹果放在哪里？","options":["窗边","门外","第一只箱子里"],"answer":0,"explanation":"as maçãs estão junto à janela；第一只箱子里是梨。"},{"prompt":"顾客最终买了多少梨？","options":["两公斤","半公斤","一公斤"],"answer":2,"explanation":"最初要求两公斤，但最后 leva apenas um quilo。"},{"prompt":"顾客怎样付款？","options":["银行卡","现金","未付款"],"answer":1,"explanation":"Paga em dinheiro 明确表示现金付款。"}]},"listening":{"text":"Boa tarde. Queria encomendar pão para amanhã de manhã. Somos quatro pessoas e precisamos de seis pães pequenos. Não queremos queijo nem leite. Posso passar aqui às nove? O meu nome é Teresa. Se não perceber o nome, posso escrevê-lo neste papel. Queria saber também quanto custa a encomenda toda.","questions":[{"prompt":"预订何时取用的面包？","options":["今天下午","明天早上","明晚"],"answer":1,"explanation":"para amanhã de manhã 指明预订用途时间。"},{"prompt":"需要几个小面包？","options":["四个","九个","六个"],"answer":2,"explanation":"四是人数；seis pães pequenos 才是面包数量。"},{"prompt":"顾客打算几点来？","options":["九点","六点","四点"],"answer":0,"explanation":"Posso passar aqui às nove? 是询问能否九点来。"},{"prompt":"没听清名字时顾客提出什么办法？","options":["改用邮箱","写在纸上","明天再说"],"answer":1,"explanation":"posso escrevê-lo neste papel 指写在这张纸上。"}]},"writing":"给面包店写5–6句预订信息：说明明天取货的时间、两种食品及数量，询问总价，并在末尾礼貌感谢。不得使用真实联系方式。","speaking":"两人模拟首次到咖啡馆预订：顾客点两样食品、问价格；店员说明一种缺货；顾客选择替代品并确认取货时间。"},{"id":"pt-stage-2","afterChapter":12,"target":"A2","reading":{"text":"O Miguel vai passar duas noites numa pensão perto do rio. Quando chega, a rececionista explica que o quarto fica no primeiro andar e que não há elevador. O Miguel traz uma mala pesada e pede ajuda. Depois pergunta pelo pequeno-almoço, que começa às sete e termina às dez. Quer sair cedo para visitar um amigo, por isso combina tomar o pequeno-almoço às sete e meia. À noite, prefere jantar fora com esse amigo.","questions":[{"prompt":"住宿离哪里近？","options":["河流","机场","学校"],"answer":0,"explanation":"numa pensão perto do rio 指河边附近的旅馆。"},{"prompt":"为什么需要帮忙？","options":["没有房间","行李重且没有电梯","早餐结束"],"answer":1,"explanation":"文中先说明没有电梯，又说 mala pesada，因此请求帮助。"},{"prompt":"早餐供应到几点？","options":["七点","七点半","十点"],"answer":2,"explanation":"termina às dez；七点半是他打算吃早餐的时间。"},{"prompt":"晚上他打算怎样用餐？","options":["在房间独自吃","与朋友外出吃","不吃晚餐"],"answer":1,"explanation":"prefere jantar fora com esse amigo 明确计划。"}]},"listening":{"text":"Olá, sou a tua vizinha do andar de cima. Amanhã vêm cá dois amigos e vamos cozinhar ao fim da tarde. Queria perguntar se precisas de usar a cozinha entre as seis e as sete. Se precisares, posso começar mais cedo. Também queria convidar-te para jantar connosco. Não há problema se não puderes ficar até ao fim.","questions":[{"prompt":"说话人住在哪里？","options":["楼上","楼下","另一栋楼"],"answer":0,"explanation":"a tua vizinha do andar de cima 表示楼上的女邻居。"},{"prompt":"什么时候会有朋友来？","options":["今晚","明天","下周"],"answer":1,"explanation":"Amanhã vêm cá dois amigos。"},{"prompt":"她主要核实哪一时段的厨房使用？","options":["五点到六点","七点到八点","六点到七点"],"answer":2,"explanation":"entre as seis e as sete 明确核实区间。"},{"prompt":"对方不能待到最后时她的态度是什么？","options":["必须参加全程","没有关系","取消聚餐"],"answer":1,"explanation":"Não há problema se não puderes ficar até ao fim。"}]},"writing":"写一条给室友的消息，说明明天有访客、需要厨房的时段，询问是否冲突；给出一个替代时段，并邀请室友参加。写6–8句。","speaking":"两人讨论周末访问朋友：提出交通方式和到达时间；对方临时有安排；共同改约时间，并说明住宿或餐饮的一个需求。"},{"id":"pt-stage-3","afterChapter":18,"target":"B1","reading":{"text":"A associação do bairro enviou um email sobre uma oficina de fotografia. A Rita quer participar, mas o horário coincide com uma reunião de trabalho. Antes de pagar a inscrição, escreve à organização para perguntar se haverá outra sessão. Recebe uma resposta que propõe sábado de manhã, num edifício diferente. A Rita pede a morada completa e confirma que pode levar a sua própria máquina. Só depois guarda a resposta e ajusta a agenda.","questions":[{"prompt":"Rita 为什么还没有直接报名付款？","options":["不知道兴趣","与工作会议冲突","没有照相机"],"answer":1,"explanation":"o horário coincide com uma reunião de trabalho；她先询问是否有另一个场次。"},{"prompt":"主办方提出的新时段是什么？","options":["周六早上","周五晚上","周一下午"],"answer":0,"explanation":"a resposta propõe sábado de manhã。"},{"prompt":"除了时间外还发生什么变化？","options":["费用翻倍","老师更换","地点换了建筑"],"answer":2,"explanation":"num edifício diferente 指不同建筑。"},{"prompt":"调整日程前她进一步确认什么？","options":["朋友是否参加","完整地址及能否带自己的相机","是否可带宠物"],"answer":1,"explanation":"pede a morada completa e confirma que pode levar a sua própria máquina。"}]},"listening":{"text":"Bom dia. Estou a ligar por causa do ficheiro que enviou ontem. Consegui abrir o anexo, mas faltam os dados da última semana. Poderia enviar uma versão atualizada até às três? Não precisa de alterar o texto da apresentação. Se não conseguir reunir todos os números, envie primeiro os que já confirmou e indique o que falta.","questions":[{"prompt":"来电的主要问题是什么？","options":["打不开附件","缺少上周数据","文字太长"],"answer":1,"explanation":"说话人能打开附件，但 faltam os dados da última semana。"},{"prompt":"希望何时前收到更新？","options":["两点","五点","三点"],"answer":2,"explanation":"até às três 指三点前。"},{"prompt":"演示文稿文字需要修改吗？","options":["不需要","全部重写","只改标题"],"answer":0,"explanation":"Não precisa de alterar o texto da apresentação。"},{"prompt":"暂时无法收齐数据时怎么办？","options":["不发任何内容","先发已核实数据并标出缺失部分","任意估算缺项"],"answer":1,"explanation":"envie primeiro os que já confirmou e indique o que falta 给出明确备选动作。"}]},"writing":"写一封80–100词的工作邮件：说明附件缺少哪一部分资料，礼貌请求补充并给出期限；如无法按时完成，提出先发送已核实部分的方案，最后请求确认收到。","speaking":"两人模拟更改课程报名：学习者解释时间冲突，询问另一时段与费用；工作人员提出不完全合适的选择；双方核实细节并约定下一次联系。"},{"id":"pt-stage-4","afterChapter":24,"target":"B1","reading":{"text":"Na segunda-feira, o André recebeu duas mensagens sobre uma visita de estudo. Uma indicava a estação antiga; a outra, a praça do mercado. Como não sabia qual era a versão mais recente, contactou a organizadora pelo número habitual. Descobriu que o local tinha mudado, mas a hora continuava igual. Avisou os colegas e guardou a confirmação. No sábado, um amigo atrasou-se. O grupo esperou dez minutos e depois combinou encontrá-lo junto à entrada do museu.","questions":[{"prompt":"两条消息哪里不同？","options":["集合地点","活动日期","人数"],"answer":0,"explanation":"分别指 estação antiga 与 praça do mercado，即地点不同。"},{"prompt":"André 如何核实？","options":["猜测较近地点","联系惯常号码上的组织者","询问陌生发件人"],"answer":1,"explanation":"contactou a organizadora pelo número habitual。"},{"prompt":"核实后得知什么？","options":["时间地点都变","活动取消","地点变了但时间未变"],"answer":2,"explanation":"o local tinha mudado, mas a hora continuava igual。"},{"prompt":"朋友迟到后大家最后怎样安排？","options":["取消参观","在博物馆入口与他会合","一直在原地等"],"answer":1,"explanation":"等十分钟后 combinou encontrá-lo junto à entrada do museu。"}]},"listening":{"text":"Olá a todos. Já falei com o senhorio sobre a janela da sala. Ele pediu fotografias antes de marcar a reparação. Posso enviá-las hoje, mas preciso de saber quando há alguém em casa na próxima semana. Se o técnico só puder vir de manhã, consigo ficar na terça-feira. Nos outros dias, seria bom combinarmos quem fica em casa. Depois envio ao grupo a confirmação por escrito.","questions":[{"prompt":"房东安排维修前需要什么？","options":["照片","新的合同","购买收据"],"answer":0,"explanation":"pediu fotografias antes de marcar a reparação。"},{"prompt":"说话人何时能发照片？","options":["下周","今天","维修后"],"answer":1,"explanation":"Posso enviá-las hoje。"},{"prompt":"若技术人员只能上午来，说话人哪天能在家？","options":["周五","周一","周二"],"answer":2,"explanation":"consigo ficar na terça-feira。"},{"prompt":"确认安排后会如何通知大家？","options":["电话逐个通知","群内发送书面确认","贴在商店门口"],"answer":1,"explanation":"envio ao grupo a confirmação por escrito。"}]},"writing":"写80–100词向合住者汇报一次维修安排：交代已经联系的人、对方要求、尚待确认的时间；给出至少一个条件方案，并说明会如何保存和转告最终答复。","speaking":"两人协商一天内的多项生活任务：一项预约改期、一项共用空间维修。轮流提出追问，区分已确认与未确认信息；在时间冲突时给出备选方案，最后口头归纳各自下一步。"}],"curriculumVersion":2};window.ContinentAudio={"bom dia":"../language-audio/6bb54bac07383717cde326aa.mp3","Bom dia, Ana.":"../language-audio/a5f58e0e5164dd9e3459919b.mp3","boa tarde":"../language-audio/ae0b75256bbdeea45306c637.mp3","Boa tarde, senhor Silva.":"../language-audio/b94003769357602cb53f08b5.mp3","boa noite":"../language-audio/af660088d737b2077783a8f5.mp3","Boa noite, até amanhã.":"../language-audio/64581e3c165e3246950410ac.mp3","olá":"../language-audio/c2d6bc798c36bddb0b5ecfd9.mp3","Olá, sou a Li.":"../language-audio/aceb4afcc82c56721ec81dcc.mp3","adeus":"../language-audio/10bbb4326c07417e28586992.mp3","Adeus, até breve.":"../language-audio/4fea55eb2dbac4aa7c3d0f0a.mp3","até amanhã":"../language-audio/5498c364134f73b29b018a65.mp3","Até amanhã, Rui.":"../language-audio/1d3377c50a7fbf3305e174a8.mp3","nome":"../language-audio/8f0f2a98e6aa82e4ccc270a6.mp3","O meu nome é Chen.":"../language-audio/f9057689756fffcb4e4f5029.mp3","prazer":"../language-audio/2f23478b2943560d7790cf83.mp3","Muito prazer, Ana.":"../language-audio/cabf2f13efe5761ed85d3aa7.mp3","obrigado / obrigada":"../language-audio/98708d675ff48e08194e485c.mp3","Obrigada pela ajuda.":"../language-audio/92490c8471ed56e815ce74ea.mp3","senhor / senhora":"../language-audio/ab07cd4cfbcf37cbfd6f60c2.mp3","A senhora é a Ana?":"../language-audio/234918c6ce461c693c12111b.mp3","Bom dia, sou a Li.":"../language-audio/afc71d2c337509ca567b710c.mp3","Olá, chamo-me Ana. E tu?":"../language-audio/fdc59f8958c4386edd6541c7.mp3","Chamo-me Li. Muito prazer.":"../language-audio/a1e83ae96fd17bf65c5142b8.mp3","Muito prazer. Até amanhã!":"../language-audio/fb10511b3ddeb4356b3b5245.mp3","Até amanhã, Ana!":"../language-audio/73a3dd061c761e53ccf83dfa.mp3","A Li chega a uma casa em Coimbra. À porta encontra a vizinha Ana. A Li diz: «Bom dia, sou a Li.» A Ana responde com um sorriso e apresenta o marido, o Rui. Os três falam um pouco no jardim. A Li ainda sabe poucas palavras de português, mas consegue dizer o seu nome e agradecer. Antes de entrar em casa, despede-se dos vizinhos: «Até amanhã!»":"../language-audio/20969ddd32682dafcfe3af95.mp3","O Chen vai à biblioteca de manhã. À entrada, uma funcionária diz «Bom dia» e pergunta o nome dele. Ele responde: «Chamo-me Chen.» A funcionária chama-se Marta. Ela apresenta o colega Pedro, que está ao lado da porta. O Chen agradece e vai ler uma revista. Quando sai, ainda antes do almoço, diz «Até breve» aos dois funcionários. No dia seguinte quer voltar à biblioteca.":"../language-audio/1ecd88c9da69dbb6a76d6c9b.mp3","Olá! É a sua primeira visita aqui?":"../language-audio/d9d6f66226ae07ad1ff32d2a.mp3","Olá!":"../language-audio/d1a4122dedae4fc7f9d0dd4c.mp3","Boa tarde!":"../language-audio/69853022005e8beb21d2bbf2.mp3","Bom dia, sou a nova aluna.":"../language-audio/7d75c67f77a79131c1209a89.mp3","O meu nome completo é Li Mei.":"../language-audio/883b9dbd45f0be77d30f569d.mp3","Chamo-me Mei. Como te chamas?":"../language-audio/df9a2b46edb5332288c40966.mp3","Esta é a minha colega. Muito prazer.":"../language-audio/f37992c7a72acd15bb93819f.mp3","Foi um prazer. Até segunda-feira!":"../language-audio/4dc4c8b6a506eefae20267b1.mp3","Boa noite a todos. Até breve!":"../language-audio/85317a00dea3cb326a7f840b.mp3","desculpe":"../language-audio/90949d08fa5b6de7ad945948.mp3","Desculpe, não percebi.":"../language-audio/5741a4442d9e1142da3cd26f.mp3","repetir":"../language-audio/b29a2bb9380a33e25dd6ff36.mp3","Pode repetir?":"../language-audio/33ce898e8ee322771a124c3f.mp3","devagar":"../language-audio/3f6820f6787514d25ebde36e.mp3","Fale mais devagar, por favor.":"../language-audio/01c4e69eefbd8700f4fd767d.mp3","perceber":"../language-audio/9ac9ce810744f847d27389ad.mp3","Não consigo perceber esta palavra.":"../language-audio/ce94775ccfa3b3439965f6ee.mp3","escrever":"../language-audio/73877b9e3498828561bb2e61.mp3","Pode escrever o nome?":"../language-audio/a03538255e3d0963eedeff38.mp3","palavra":"../language-audio/1435c254790f61aade4e14f5.mp3","Esta palavra é nova.":"../language-audio/e8003cccd73ccdddcfeba3e9.mp3","letra":"../language-audio/000b92b075a0c58fc35f0cf2.mp3","Qual é a primeira letra?":"../language-audio/7e12f0d1a2f9e0939f871c12.mp3","som":"../language-audio/898218e2d4c2e812f91a7335.mp3","Este som é difícil para mim.":"../language-audio/3bc82f53a34f1b006dace511.mp3","por favor":"../language-audio/21a8ada8194f286d7d0e8be6.mp3","Uma informação, por favor.":"../language-audio/4b2590a45e3c9f9774b3ea0b.mp3","como":"../language-audio/395347617624dfee1d497a89.mp3","Como se diz isto?":"../language-audio/545f0f68bc382ec742b545ad.mp3","Pode repetir, por favor?":"../language-audio/67e852723da827ca495d9f00.mp3","Não percebi a última palavra.":"../language-audio/5e97cbe52ee824da6e92aad0.mp3","Desculpe, como se escreve o seu nome?":"../language-audio/7daa8aa8a84ae100750c9fe9.mp3","Escreve-se Sara, com esse.":"../language-audio/43f7867ae97a5b55358c8701.mp3","Pode falar mais devagar?":"../language-audio/0e0ba7264e481c106edbd1bc.mp3","Claro. Vou repetir o nome.":"../language-audio/3806389b6b00ce61c5fe2b60.mp3","O Chen está na receção de uma escola. A funcionária diz o nome da professora, mas ele não percebe a última palavra. Pede para ela falar mais devagar. A funcionária repete o nome e escreve-o num papel. O Chen lê o papel e pergunta como se diz uma letra. Depois agradece. Em casa, ouve uma gravação curta e repete as palavras sem tentar falar muito depressa.":"../language-audio/bf7f7061fbd78f8408d5d208.mp3","A Mei procura uma loja numa rua desconhecida. Pergunta o caminho a um senhor, mas o nome da rua é novo para ela. A Mei pede para ele repetir mais devagar. O senhor escreve «Rua da Escola» num papel e aponta para a direita. Ela lê o nome e agradece. Antes de continuar, compara o papel com o mapa do telemóvel. A loja fica perto de uma escola.":"../language-audio/2f4de83e8ac121a71f599e71.mp3","Podemos falar mais devagar. Qual é a sua dúvida?":"../language-audio/69107eefa8c5833dc8878188.mp3","Pode escrever?":"../language-audio/3ba44afd280e62aaca184bd5.mp3","Pode repetir a pergunta, por favor?":"../language-audio/12637ebef224bba090b08521.mp3","Não percebi o número de telefone.":"../language-audio/6b11a8bb83c286fe1994872d.mp3","Como se escreve o nome desta rua?":"../language-audio/c9b12b819ea49d719f9b67b8.mp3","Escreve-se «casa», com cê.":"../language-audio/ca7adbb942e692b7c7c47d1c.mp3","Pode dizer os números um a um?":"../language-audio/831486e998392bcf209d33f7.mp3","Claro, vou escrever a morada num papel.":"../language-audio/8245d8957d10d6f311622fe4.mp3","nacionalidade":"../language-audio/e81c8c05272cb2ab584656e9.mp3","Qual é a sua nacionalidade?":"../language-audio/7d73ca7872df8fbdc37fbdf0.mp3","chinês / chinesa":"../language-audio/25d74ee60daf663f2fba9c8c.mp3","Sou chinesa.":"../language-audio/10e85497584db214dba41af6.mp3","morar":"../language-audio/6ea36167ec34efa904b2b605.mp3","Moro em Lisboa.":"../language-audio/3a4cbd5b822eccb3891a3b16.mp3","idade":"../language-audio/c2687b23081b65621f9a8aad.mp3","Qual é a sua idade?":"../language-audio/bbdeaa1508cd15a7ae40213e.mp3","anos":"../language-audio/89341768162b5e5333632976.mp3","Tenho vinte anos.":"../language-audio/9d5a19f9d1cef8a057ac8f0d.mp3","morada":"../language-audio/5be4582a94081c90dd41aa13.mp3","Esta é a minha morada.":"../language-audio/8c186c3aa0860bbc7cfa0eab.mp3","telemóvel":"../language-audio/8be6dc1192ccc5fb0b7b52cf.mp3","O meu telemóvel está aqui.":"../language-audio/05a2b5e64434ef0c79f89c0a.mp3","correio eletrónico":"../language-audio/82813f7a007ba5e87863530d.mp3","Qual é o seu correio eletrónico?":"../language-audio/6f22987ac256c5b9fa9df121.mp3","apelido":"../language-audio/d141c97dbda99d368e00baf4.mp3","O meu apelido é Wang.":"../language-audio/268fe07f4127b79b130a2f25.mp3","país":"../language-audio/04362cf8cb3ad97cf1bad8bb.mp3","De que país é?":"../language-audio/74548c609a34be123cc70e6e.mp3","Sou chinesa e moro em Lisboa.":"../language-audio/08a8dae2f1a02ac39fff4591.mp3","Tenho vinte e oito anos.":"../language-audio/cec1db828586d82452be0239.mp3","Qual é o seu apelido?":"../language-audio/e11735ec9d99503765b590c1.mp3","E qual é a sua morada?":"../language-audio/8a48e4dfe2eadd91430ca802.mp3","Moro na Rua Nova, no número dez.":"../language-audio/6b0967d4316ec93ae78596f1.mp3","A Wang vai a um curso de português no Porto. Na ficha escreve o nome completo, a nacionalidade e a morada. Tem vinte e oito anos e mora com uma amiga numa rua perto da escola. A professora pede também um contacto para enviar informações sobre as aulas. A Wang prefere dar o correio eletrónico. Antes de entregar a ficha, confirma todas as letras do apelido e verifica o endereço.":"../language-audio/47c901d8b9e1c634f7d8e978.mp3","O Liu inscreve-se num curso de desenho em Braga. Tem trinta anos e é chinês. Na ficha escreve o nome e a morada da casa onde vive com o irmão. Para receber os horários, deixa o endereço de correio eletrónico. Não escreve o número de telemóvel porque prefere mensagens por email. A funcionária pede-lhe que confirme o apelido. O Liu verifica a ficha e entrega-a no balcão.":"../language-audio/290731ce41e69f65b84c7a11.mp3","Como se chama e de onde vem?":"../language-audio/dea84d3807224eb306114d08.mp3","Sou chinês.":"../language-audio/7039c723a71bdb2d5e6a581c.mp3","Sou da China, mas agora moro no Porto.":"../language-audio/56ede7ef5058aa5ffe3dd9cf.mp3","Este ano tenho trinta anos.":"../language-audio/6683cd2678dd669f27eb7fc7.mp3","Qual é o seu endereço de correio eletrónico?":"../language-audio/c124a740b6114d77147ea4c5.mp3","Li é o meu apelido e Mei é o meu nome próprio.":"../language-audio/730cebc98c9f70130925417e.mp3","Esta é a minha nova morada.":"../language-audio/d9d54790ba91389c34796339.mp3","Moro no segundo andar de um prédio perto da estação.":"../language-audio/e8d3fc9b1c858a1b25ad4429.mp3","hora":"../language-audio/e452a3641922832352cebf8d.mp3","A que hora começa?":"../language-audio/7420635f3248515d962879a9.mp3","hoje":"../language-audio/6140431f539b0c2baa3e67f6.mp3","Hoje tenho uma aula.":"../language-audio/c4a5ae0768e885ab22a4be25.mp3","amanhã":"../language-audio/084d1ac19330b9a6e5fe5e57.mp3","Amanhã é sábado.":"../language-audio/3dcaef390abb7414df57104e.mp3","segunda-feira":"../language-audio/d4a7f9625f86799e28e94e58.mp3","A aula é na segunda-feira.":"../language-audio/8468c7706782a071d082d458.mp3","manhã":"../language-audio/c99ee1991d91239880abe8f4.mp3","Trabalho de manhã.":"../language-audio/bdedb777f41ffd8b80aef580.mp3","tarde":"../language-audio/22db51cac5e0cd1adb22ea8f.mp3","Estudo à tarde.":"../language-audio/b343c3d984786491a2d02c65.mp3","minuto":"../language-audio/d0059092323b3cabf2dabd31.mp3","Espere um minuto.":"../language-audio/1bfd7c062eb09905e6894dd6.mp3","meia":"../language-audio/f6ff8322154ac3fe5fab55bb.mp3","São duas e meia.":"../language-audio/aa1d54d07261df2a08bdbeae.mp3","quanto":"../language-audio/254cfe6e5bdce3b18fac3aec.mp3","Quanto custa o bilhete?":"../language-audio/c190ac98a7fd2ad5fb7d661c.mp3","data":"../language-audio/bb10fdff3572b6cd47de4685.mp3","Qual é a data da visita?":"../language-audio/0a4035d8be7a0a99596018f6.mp3","São nove horas e dez minutos.":"../language-audio/416b60450d18d6d0b7a5a377.mp3","A aula começa à uma da tarde.":"../language-audio/a458b8070334451814eba413.mp3","A visita é amanhã?":"../language-audio/646b3bdd74a9a76c52a9a0e9.mp3","Sim, às dez e meia.":"../language-audio/26339e92d1f7c68f74a73152.mp3","Custa oito euros.":"../language-audio/ea3682568af2d4c347d5e2bb.mp3","É sexta-feira e a Li organiza o dia seguinte. De manhã quer visitar um museu com o Rui. A visita começa às dez e meia e o bilhete custa oito euros. Combinam encontrar-se à porta às dez e vinte. Depois do almoço, a Li tem uma aula às três da tarde. Escreve as horas no caderno para não se esquecer e prepara o dinheiro para o bilhete do museu.":"../language-audio/0307256f7b5b8ad071906f81.mp3","No domingo, o Chen quer ouvir música num jardim. O concerto começa às quatro da tarde e termina às cinco e meia. A entrada custa seis euros. Ele combina encontrar-se com a Marta às três e quarenta, junto ao café do jardim. De manhã fica em casa a estudar. Antes de sair, consulta a hora no telemóvel e leva uma garrafa de água. Não precisa de levar uma cadeira.":"../language-audio/5aed10d75016662c8f6ffc9a.mp3","A que horas lhe dá jeito encontrarmo-nos?":"../language-audio/fcc2d791b528ea600df3183d.mp3","É uma hora.":"../language-audio/0f66489d94fbb6696511cdaa.mp3","São nove menos um quarto.":"../language-audio/cd04860e9437536b847e7a6b.mp3","O almoço começa à uma e meia.":"../language-audio/c4e7246cc912206e90ef18c4.mp3","A visita é na próxima segunda-feira?":"../language-audio/9b3703c91997397cb0960031.mp3","Sim, encontramo-nos às dez e quarenta e cinco da manhã.":"../language-audio/35e456235fc61ac277373fa8.mp3","Quanto custam dois bilhetes?":"../language-audio/85d45476da4994c395b9f66c.mp3","Cada bilhete custa seis euros; os dois custam doze.":"../language-audio/6ae2dfe1e45c825cf7e5279c.mp3","café":"../language-audio/5adc94e1c0857fe3880f5f3f.mp3","Queria um café.":"../language-audio/9bd3749fbe941a962555ea30.mp3","água":"../language-audio/9695157124ce68de510ba929.mp3","Uma água sem gás, por favor.":"../language-audio/36ce20e04860407f209bcc02.mp3","chá":"../language-audio/9118f69b6c38e20695aae602.mp3","Tem chá de limão?":"../language-audio/dc770ad98dd06ed9b2456f05.mp3","pão":"../language-audio/b3da2cda614bb6f3b9605a0c.mp3","Queria pão com queijo.":"../language-audio/c2279f15a9fcc9878613d404.mp3","queijo":"../language-audio/cfa8f23bad26de4be203b31b.mp3","Este queijo é suave.":"../language-audio/c471e8a07e38f7a65c6017a0.mp3","tosta":"../language-audio/44ebc9acb18eea61898a9393.mp3","A tosta está quente.":"../language-audio/ea980e1d91d858dd484e49c3.mp3","leite":"../language-audio/e8ae4e793da0bb079b3f928e.mp3","O café leva leite?":"../language-audio/7da92d3991bf3546ef54e1b1.mp3","conta":"../language-audio/7c36aacc3ec3b804656c2856.mp3","A conta, por favor.":"../language-audio/8e880c62e256127854fa92f3.mp3","sem gás":"../language-audio/00379b5ee68766d62c709360.mp3","Prefiro água sem gás.":"../language-audio/b5fb1018db11fc853c4c747f.mp3","esplanada":"../language-audio/4437f1c31e5e380d9d746d85.mp3","Há lugar na esplanada?":"../language-audio/ccb257001e8877ab4d3baea5.mp3","Queria um café e uma tosta.":"../language-audio/6dd4242e9c07dbe838435daa.mp3","Tem água sem gás?":"../language-audio/ebf9cdab9977789ce07f8f57.mp3","Bom dia. O que deseja?":"../language-audio/9b3290ea63855fc0b224ba35.mp3","Queria um chá e pão com queijo.":"../language-audio/9e94eaa01e04760014181405.mp3","É para aqui ou para levar?":"../language-audio/c1718e03978aafe9cb29a2fc.mp3","É para aqui, obrigada.":"../language-audio/906d5cd3ad1355bcf89654ae.mp3","A Mei toma o pequeno-almoço num café perto de casa. Escolhe uma mesa na esplanada e pede um chá e pão com queijo. O empregado pergunta se quer mais alguma coisa. Ela pede também uma água sem gás. Enquanto espera, lê a ementa e aprende duas palavras novas. No fim, pede a conta e confirma os três produtos. Paga e agradece antes de voltar para casa a pé.":"../language-audio/30aeee0a517ad6713477d4d0.mp3","O Rui entra num café depois do trabalho. Pede uma tosta e um café para levar, porque vai encontrar a irmã no parque. A empregada pergunta se ele quer uma bebida fria. O Rui escolhe uma água com gás. Quando recebe o saco, verifica que falta a tosta e avisa a empregada. Ela traz a tosta e pede desculpa. O Rui paga e segue para o parque.":"../language-audio/301e14a192458b9cec3c9600.mp3","Bom dia! O que deseja tomar?":"../language-audio/72f4d9d0603f697d66dd388f.mp3","Um café, por favor.":"../language-audio/080255fe0329f72f959fb810.mp3","Pão com queijo.":"../language-audio/6d850560a3467dbcfaeabb14.mp3","Queria dois cafés e uma porção de pão.":"../language-audio/acd99bda32d6e91a5fed65b0.mp3","Tem leite sem lactose?":"../language-audio/bcac015007df7562c15193c8.mp3","Bom dia. O que desejam?":"../language-audio/b54cd68fee2901cae9d7b00d.mp3","Queria um chá sem açúcar e um copo de água.":"../language-audio/908c9be685e0d76bc2a7b034.mp3","As duas tostas são para levar?":"../language-audio/f2b69741838ca26e5c4efaae.mp3","É para aqui. Podemos sentar-nos na esplanada?":"../language-audio/2bb496ea0927ab6adb6d2e4d.mp3","supermercado":"../language-audio/327bea4594f6d3f852b32247.mp3","Vou ao supermercado.":"../language-audio/750e453fd95644d2128c44b4.mp3","fruta":"../language-audio/b71e281f9c00eb43062f8bee.mp3","A fruta fica ali.":"../language-audio/ef26eb489468a813f3767cb6.mp3","maçã":"../language-audio/fa50eec7304116958ff9fa5e.mp3","Queria duas maçãs.":"../language-audio/b5f9202b904dc34dd6da2655.mp3","arroz":"../language-audio/6b4fc9e7f1f97edf6463dce8.mp3","Este arroz é barato.":"../language-audio/2acb0eb6897663a6352f56ae.mp3","quilo":"../language-audio/5a03de31bc769e74720ae7cf.mp3","Quero um quilo de batatas.":"../language-audio/a5aa235120dfae8f6eec13a7.mp3","saco":"../language-audio/7b58a243adb75d53d113edd9.mp3","Preciso de um saco.":"../language-audio/ffee0621d053121e1f1b69e2.mp3","caixa":"../language-audio/3f8bc6ce3334baddc28df390.mp3","A caixa está aberta.":"../language-audio/4b020ab60524a47201668b4d.mp3","cartão":"../language-audio/eaf9c34662a6657065defc15.mp3","Posso pagar com cartão?":"../language-audio/0594435ba097bdef6fe5fb2c.mp3","dinheiro":"../language-audio/d0d1bb12aaa082ee198fed7c.mp3","Vou pagar em dinheiro.":"../language-audio/ec58e146de328a2ce5432be3.mp3","talão":"../language-audio/ba62cbed2edf7309cf47690e.mp3","Pode dar-me o talão?":"../language-audio/3894c3d400e804a1d0e22743.mp3","Queria um quilo de maçãs.":"../language-audio/a9a4ae7c7b2398f6960c68f4.mp3","Estas maçãs são portuguesas.":"../language-audio/604c5bca182a79b10b8a0f23.mp3","Desculpe, onde está o arroz?":"../language-audio/ee749c854902286b77f13b8e.mp3","Está ao lado da massa.":"../language-audio/518e749edb5fe137ef498a8d.mp3","Sim. Quer um saco?":"../language-audio/3b4535c36253096f31e7a735.mp3","A Li leva uma lista para o supermercado: arroz, leite, maçãs e pão. Primeiro procura a fruta e escolhe um quilo de maçãs portuguesas. Não encontra o arroz e pede ajuda a uma funcionária. Depois vai à caixa com os quatro produtos. Traz um saco de casa e paga com cartão. Guarda o talão na carteira para poder conferir a compra quando chegar a casa depois das aulas.":"../language-audio/103d9ccdfbd97c7e829d5161.mp3","A Sara vai ao supermercado à noite. Quer comprar batatas, queijo e água. As batatas estão perto dos legumes, mas ela não encontra o queijo. Um funcionário mostra-lhe a zona dos produtos frescos. Na caixa, a Sara pede um saco porque deixou o seu em casa. Paga em dinheiro e guarda o talão. Ao sair, confirma que comprou os três produtos da lista e telefona ao irmão.":"../language-audio/f9e62354b26ad154bfd0b17a.mp3","Está à procura de algum produto?":"../language-audio/05055ae87309a8a6c7f91e09.mp3","Uma maçã.":"../language-audio/57fa3afa6ff2bd5459534b11.mp3","Duas maçãs.":"../language-audio/2e77786312ad4e7530dff4f6.mp3","Queria meio quilo de peras.":"../language-audio/0dfb68f42095ec51af27a21e.mp3","Estas maçãs são mais baratas do que aquelas.":"../language-audio/e81a352f7c5cd8596c1feb8d.mp3","Desculpe, onde posso encontrar arroz sem sal?":"../language-audio/9ec3de814673f355305706c0.mp3","Os sacos estão atrás da caixa.":"../language-audio/eed8e284b31a141169e20ff4.mp3","Não tenho o cartão comigo. Posso pagar em dinheiro?":"../language-audio/737a41013c71f632fafa4047.mp3","Não preciso de saco, mas queria o talão.":"../language-audio/9fb4226aa0c33a5692c2f929.mp3","rua":"../language-audio/abe533c31e9f8bf9b1700f8c.mp3","Esta rua é estreita.":"../language-audio/56502eda4503de6cb8a3861f.mp3","praça":"../language-audio/79874c4215f6f13975a11833.mp3","A praça fica perto.":"../language-audio/10488c4442c7bfd5680406d4.mp3","ponte":"../language-audio/52fde3241085145cecce074d.mp3","A ponte está à esquerda.":"../language-audio/1f619e9964d3adfe4530a2eb.mp3","à direita":"../language-audio/bb051f6dee23fa1fee154bf4.mp3","Vire à direita.":"../language-audio/fa5f251868f18d813815cf6c.mp3","à esquerda":"../language-audio/7c032cafd3322be17eeea768.mp3","Vire à esquerda.":"../language-audio/d41985b14f88858169c41e12.mp3","em frente":"../language-audio/6375fa21683ba02fed29eb0e.mp3","Siga em frente.":"../language-audio/03050e2d715ca08ae4391ca0.mp3","perto":"../language-audio/44e77e8a98e0822695b6cee4.mp3","O banco fica perto.":"../language-audio/1585d53d0eb3890c293b871f.mp3","longe":"../language-audio/cf45d221eed44f4f709f935e.mp3","A estação fica longe.":"../language-audio/a3fc130b3fc5263cbc95849d.mp3","mapa":"../language-audio/64d3ce871e5f4c015bc28627.mp3","Pode mostrar no mapa?":"../language-audio/58b35bfce64d69e8973329ce.mp3","a pé":"../language-audio/eb8ce85f6badd1bb955cf785.mp3","Vou a pé.":"../language-audio/eaf04642508e3ee0887d74cd.mp3","A farmácia fica perto da praça.":"../language-audio/abff4045eead431678941669.mp3","Vou ao mercado a pé.":"../language-audio/5239d332744bd1be9e365f42.mp3","Desculpe, como vou para a biblioteca?":"../language-audio/620c3de90e0a2df82a461388.mp3","Siga em frente até à praça.":"../language-audio/bddb1ad778311290945ce812.mp3","Depois viro à direita?":"../language-audio/0307db4dd3d02d1d29ce69d0.mp3","Sim, a biblioteca fica ao lado do café.":"../language-audio/d4a5906f88b614d933d69acf.mp3","O Chen quer ir ao mercado, mas ainda não conhece bem o bairro. Na rua pergunta o caminho a uma senhora. Ela diz para seguir em frente até à praça e depois virar à esquerda. O mercado fica ao lado de uma padaria. O Chen repete as indicações para confirmar e mostra o mapa. Como o caminho é curto, decide ir a pé e guardar o telemóvel no bolso.":"../language-audio/33d620e7e0e1ab39bcb5e1d0.mp3","A Mei precisa de encontrar os correios. Um rapaz explica que deve seguir pela rua principal até à ponte. Depois da ponte, tem de virar à direita. Os correios ficam em frente a um jardim, entre uma papelaria e um café. A Mei confirma a direção e pergunta se pode ir a pé. O rapaz diz que o caminho demora cerca de dez minutos. Ela agradece e continua.":"../language-audio/d5dd18017a2fc1f9dbbd8cc8.mp3","Para onde quer ir? Posso indicar-lhe o caminho.":"../language-audio/6cc9c9b2da42218fc9fc452a.mp3","À direita.":"../language-audio/9ebb986f46b62ffd58a204f3.mp3","À esquerda.":"../language-audio/ffdb30e6e1bfed3825fdf34c.mp3","Os correios ficam perto da ponte.":"../language-audio/4c82c1b1227bd70c4cb68549.mp3","Vou à estação a pé porque é perto.":"../language-audio/62f617fa3b30a2d008704243.mp3","Desculpe, como posso chegar ao rio?":"../language-audio/bf9b83b61faceaace9ba9696.mp3","Atravesse a praça e siga até à ponte.":"../language-audio/d51727883f138a64378f06eb.mp3","Viro à esquerda na segunda rua?":"../language-audio/9f172528284e817173bb08c4.mp3","A entrada fica em frente do café, do outro lado da rua.":"../language-audio/554a3a93c4a8cf4223de2e1b.mp3","autocarro":"../language-audio/0051674ebd98bf956a9e328f.mp3","Vou de autocarro.":"../language-audio/d398d3b7a70baa1f66224f6a.mp3","comboio":"../language-audio/1e7cfe0ee5134b2a1898e3d9.mp3","O comboio chega cedo.":"../language-audio/9094004ddd966d16c574bc27.mp3","bilhete":"../language-audio/e6376ad7cb4df60cc54884c0.mp3","Preciso de um bilhete.":"../language-audio/93cadedb2a272873f5eb5de4.mp3","ida":"../language-audio/438d2a38c05494128b8a9e14.mp3","Queria um bilhete de ida.":"../language-audio/f0b27cf1fa78afcc7cc97dec.mp3","volta":"../language-audio/3d80fa42fd5e2c3230c037a4.mp3","A volta é amanhã.":"../language-audio/728df7055a262baffce49251.mp3","paragem":"../language-audio/97d626493cfafc29e06337f6.mp3","Onde fica a paragem?":"../language-audio/8cbc36babd00246ee4ecbb4f.mp3","estação":"../language-audio/f7b2386abbfb36d9936e83e8.mp3","A estação está aberta.":"../language-audio/fdf51658c0e079b499acf8d8.mp3","linha":"../language-audio/282bd393bb2fcaeed9c33bd8.mp3","Qual é a linha?":"../language-audio/7402131691c47dadb2eb4d35.mp3","atraso":"../language-audio/dfb5dd855a1943d7637c1458.mp3","Há um atraso de dez minutos.":"../language-audio/7901c552957520d3af5dbc97.mp3","validar":"../language-audio/32e228f681ca7cf3464a87f0.mp3","Onde tenho de validar o bilhete?":"../language-audio/5bd6d49abc7ca18228b3e45b.mp3","Tenho de mudar de comboio?":"../language-audio/d1f99ac814f835ad05a69730.mp3","Vou de autocarro até à estação.":"../language-audio/d79bb6f4548a416cf8fc9446.mp3","Queria um bilhete para Coimbra.":"../language-audio/f5325a93070c2e94dd923d37.mp3","Só de ida ou de ida e volta?":"../language-audio/21c7c90ce50730d216ca40c6.mp3","Só de ida. De que linha sai?":"../language-audio/007bf2a4c5218b4a1ecfcb5c.mp3","Sai da linha três; confirme no painel.":"../language-audio/6778622d8b678d720dc45a61.mp3","A Li vai visitar uma amiga em Aveiro. Na estação compra um bilhete de ida e volta e pergunta se tem de mudar de comboio. O funcionário explica o percurso e pede que confirme a linha no painel. A Li consulta também a hora da volta. Antes de entrar, pergunta onde deve validar o bilhete. Guarda o bilhete durante a viagem e envia uma mensagem à amiga quando chega.":"../language-audio/30f5079f6bd0636ec8d6e75b.mp3","O Rui quer ir de Braga ao Porto de comboio. Compra apenas a ida, pois ainda não sabe quando volta. O painel indica um atraso de quinze minutos. Ele pergunta a uma funcionária se a linha continua a ser a mesma. Ela confirma a linha dois e pede-lhe que acompanhe as informações no painel. O Rui avisa o colega de que vai chegar mais tarde e espera junto à linha indicada.":"../language-audio/25f72568f8ea460a481a45d2.mp3","Qual é o seu destino e quando quer partir?":"../language-audio/cad6b26c1b74063cd954d1e1.mp3","Que linha?":"../language-audio/4de8b0358bc7b410eca1074b.mp3","Um bilhete.":"../language-audio/7182500b500cd38d628ee0b5.mp3","Tenho de mudar de autocarro para chegar ao hospital?":"../language-audio/8e33e08287a4fe07a8df5513.mp3","Vou de comboio e depois sigo a pé.":"../language-audio/523fa0e36ea13e7f9f6b6be6.mp3","Queria dois bilhetes de volta para hoje.":"../language-audio/89af45f65436eacce1e7e620.mp3","O bilhete de ida e volta é mais barato?":"../language-audio/078472b62484ad746e4f9a60.mp3","Só de ida, por favor. Em que paragem devo sair?":"../language-audio/902b66041a30b473a807e819.mp3","Antes de entrar, confirme o destino no painel.":"../language-audio/dce740e72781ac876cbe81b0.mp3","reserva":"../language-audio/c86bd8c3a72bd1b657fd8164.mp3","Tenho uma reserva.":"../language-audio/0f08f00baa8fb82142d6bf15.mp3","quarto":"../language-audio/6e46991166dacb0367f3f54b.mp3","O quarto fica no segundo andar.":"../language-audio/798e262c9c91fdced4646ae5.mp3","chave":"../language-audio/816d6274c83a70d16eae5b68.mp3","Aqui está a chave.":"../language-audio/cec92a5eaf0accda19557740.mp3","casa de banho":"../language-audio/94b1e3b9aca4f91ecc237bd3.mp3","Há casa de banho no quarto?":"../language-audio/a562ba71cf900cc73af675a8.mp3","pequeno-almoço":"../language-audio/369d0dd9813d1eec91f84b25.mp3","O pequeno-almoço está incluído?":"../language-audio/75278a394942f125f97a85c6.mp3","andar":"../language-audio/b70317317360a02bcee2de7c.mp3","Em que andar fica?":"../language-audio/647a0618187e554de3e89b90.mp3","receção":"../language-audio/6de8166515d15d8081092a31.mp3","A receção fica à entrada.":"../language-audio/2c5caedb244911eaf506fafb.mp3","mala":"../language-audio/cbaaff06148169680a397bbb.mp3","Posso deixar a mala aqui?":"../language-audio/4e3b8efb3e60beb2064a0cfc.mp3","incluído":"../language-audio/e9942c6168370a631e3df666.mp3","O jantar não está incluído.":"../language-audio/467e0dfa3f4e2f16bc6aac80.mp3","saída":"../language-audio/8751638d27bc3a79b02c1b71.mp3","A saída é às onze.":"../language-audio/b2493d7d095df179da2148c5.mp3","Há uma toalha no quarto.":"../language-audio/6e85825adb1ff7398f8d7e08.mp3","A chave está na receção.":"../language-audio/af577a8049672032a2836df8.mp3","Boa tarde, tenho uma reserva em nome de Li.":"../language-audio/ce6905df99fb12db491ab509.mp3","Sim, são duas noites, certo?":"../language-audio/671eedc0bf11ecea7326a2ea.mp3","Sim. O pequeno-almoço está incluído?":"../language-audio/914e3cdd9b503b31cc2650bd.mp3","Está incluído e começa às oito.":"../language-audio/913139c1e28575211e7de390.mp3","A Mei chega a um alojamento em Évora ao fim da tarde. Na receção confirma uma reserva de duas noites. O quarto fica no primeiro andar e tem uma casa de banho pequena. O funcionário entrega a chave e explica o horário do pequeno-almoço. A Mei pergunta a que horas deve sair no último dia. Depois pede para deixar a mala na receção durante algumas horas, se houver espaço disponível.":"../language-audio/5a11194f676b40e08f998857.mp3","O Chen chega a uma pensão em Viseu com uma reserva para três noites. A rececionista informa que o quarto fica no rés do chão. O pequeno-almoço não está incluído no preço, mas pode ser pedido no café ao lado. O Chen pergunta pela ligação à internet e recebe um papel com a palavra-passe. Antes de ir descansar, confirma que a saída está prevista para as dez da manhã.":"../language-audio/9b4f830f4199f33e246c9510.mp3","Boa tarde! Tem uma reserva em seu nome?":"../language-audio/9c4152104fabb668af724032.mp3","Uma toalha.":"../language-audio/cd94d5342d797cbcf1d8d413.mp3","O pequeno-almoço.":"../language-audio/ff1ea8f4908ccf914250279f.mp3","Há uma secretária no quarto?":"../language-audio/001f71d19af2d2f46f55627d.mp3","A chave extra está em cima da mesa.":"../language-audio/f8090f7dde3213acc65a9475.mp3","Boa tarde, fiz uma reserva pelo vosso site.":"../language-audio/123a19aa6db1fe38ea60d3ea.mp3","São três noites e precisava de um quarto sossegado.":"../language-audio/ca2b8404049c5a9b50b0c77c.mp3","O pequeno-almoço está incluído para duas pessoas?":"../language-audio/4edb74f4d825fbb32d510ff3.mp3","É servido na sala do rés do chão, a partir das sete.":"../language-audio/6df9d416d6d39701aa14fe61.mp3","cozinha":"../language-audio/f8dd24c67114f5a3d4ce4820.mp3","A cozinha é pequena.":"../language-audio/2d1815b009091d18a49247c0.mp3","sala":"../language-audio/bccb6bedd2a0bfb3d2ec4c74.mp3","Estudo na sala.":"../language-audio/5856c48a301a43e50225b6c9.mp3","janela":"../language-audio/c24cb1d4f81e7449cd7699d2.mp3","Abro a janela.":"../language-audio/afebea05c93b6e9cc85b2d9e.mp3","limpar":"../language-audio/b96702f52155e9381bdc6508.mp3","Vou limpar a cozinha.":"../language-audio/59f8e43d7af11fca9247317a.mp3","lavar":"../language-audio/f58fc9e4f3f2b1a5d57b45e7.mp3","Preciso de lavar a roupa.":"../language-audio/cbb410ad6abdf688eaf4086f.mp3","cozinhar":"../language-audio/b1180e8db038ed7052e3faf6.mp3","Gosto de cozinhar.":"../language-audio/b24593b85d2d9c9941365886.mp3","levantar-se":"../language-audio/aff5ef66258e8c12416c7d83.mp3","Levanto-me às sete.":"../language-audio/0691bec588281a31e2ee9b7f.mp3","deitar-se":"../language-audio/a33e9fac6d086af66e4ee264.mp3","Deito-me cedo.":"../language-audio/027077e10e3d5da874af35a5.mp3","às vezes":"../language-audio/b96c61a2e15d3f2d417ad9d5.mp3","Às vezes almoço em casa.":"../language-audio/8f86ff3b4f893301205819f8.mp3","todos os dias":"../language-audio/b5ad7ec8d039542567390901.mp3","Leio todos os dias.":"../language-audio/acdc8a29f17f507c62fcf594.mp3","Levanto-me às sete todos os dias.":"../language-audio/cc2d06eff6e152b95c1f66d7.mp3","Às vezes cozinho com uma amiga.":"../language-audio/77dfcfe10fa37258f9efeffe.mp3","A que horas usas a cozinha?":"../language-audio/7ce392b2155e77e5946f32e6.mp3","Costumo cozinhar às sete da noite.":"../language-audio/19ab67b403b9151ffa3279e2.mp3","Posso lavar a roupa depois do jantar?":"../language-audio/6692fd955ce79a1a7e69820d.mp3","Sim, eu limpo a cozinha entretanto.":"../language-audio/222d7921c157ed536a009614.mp3","A Li e a Ana partilham uma casa em Setúbal. A Li levanta-se cedo e toma o pequeno-almoço na cozinha. A Ana trabalha à tarde e costuma estudar de manhã na sala. Para organizarem a casa, escrevem uma lista de tarefas. A Li lava a roupa à quarta-feira e a Ana limpa a cozinha ao sábado. Às vezes cozinham juntas ao domingo e abrem as janelas depois do almoço.":"../language-audio/b3893bff721cc6a3d81c8019.mp3","O Liu vive com o Pedro num apartamento pequeno. O Liu trabalha de manhã e sai de casa às oito. O Pedro tem aulas à noite e costuma levantar-se às nove. Durante a semana, cada um prepara o seu almoço. Ao sábado, fazem as compras juntos. O Liu limpa a sala enquanto o Pedro lava a roupa. Depois combinam cozinhar uma sopa para o jantar e deixam a cozinha arrumada.":"../language-audio/5041f0eb3f49e6d95665836b.mp3","Como costuma organizar o seu dia?":"../language-audio/4c61bfd6edb60a753133cc71.mp3","Levanto-me cedo.":"../language-audio/7c1a34f90bccc87acf4259f2.mp3","Deito-me tarde.":"../language-audio/6439dd16f78afec26d08ef71.mp3","Ao fim de semana levanto-me mais tarde.":"../language-audio/1a3fe0e0d2887b69141cefba.mp3","Nunca almoço em casa durante a semana.":"../language-audio/c2a707e3b63f43d88e3fe219.mp3","A que horas costumas lavar a roupa?":"../language-audio/ed5dc216d903a6cf76122eb9.mp3","Costumo limpar a bancada depois de cozinhar.":"../language-audio/f301d9a7787f62ffd54ae8d4.mp3","Posso usar a casa de banho antes das sete?":"../language-audio/03706f089f65764440b2caad.mp3","Enquanto lavas a roupa, eu preparo o jantar.":"../language-audio/2fb4f28c406e169ec9f0758e.mp3","farmácia":"../language-audio/4753b91004e2d51230fcc32f.mp3","Onde fica a farmácia?":"../language-audio/badf96ec37f9031d12106370.mp3","dor":"../language-audio/bd840e62de1fcd15cf99df5a.mp3","Tenho uma dor no braço.":"../language-audio/082e6b9360a62f4acb8d9cff.mp3","cabeça":"../language-audio/b743af4525da937d73a6d2e2.mp3","Dói-me a cabeça.":"../language-audio/2837c5a5cddbe4bb791e01f0.mp3","febre":"../language-audio/c82aee71db7e79b05485999a.mp3","Tenho febre desde ontem.":"../language-audio/492b4641df8e2620d74fec51.mp3","tosse":"../language-audio/503aab2e394af9a9d7dc8538.mp3","Tenho tosse.":"../language-audio/4dcbab726e4875d3e856d689.mp3","alergia":"../language-audio/86fb47cc0e7946fca013417d.mp3","Tenho uma alergia conhecida.":"../language-audio/a0dac69694604f6943024e08.mp3","medicamento":"../language-audio/8b869a02b196d9f36b824b16.mp3","Tomo este medicamento.":"../language-audio/e5d9a4490a09c335a4dbc9c0.mp3","consulta":"../language-audio/4c5560ebd18f0833757a0839.mp3","Queria marcar uma consulta.":"../language-audio/02f9f091551a14574a1db49b.mp3","ajuda":"../language-audio/64bff6c2bc7b4fa9ff0cb1b8.mp3","Preciso de ajuda.":"../language-audio/fd458897969db231c0108bdc.mp3","urgente":"../language-audio/fd7c91b1c2f89419cc8a5c7f.mp3","Preciso de ajuda urgente.":"../language-audio/f311d87d061af54eedc8da76.mp3","Dói-me a garganta há dois dias.":"../language-audio/5e5f782e496d88f234a5973d.mp3","Tenho uma alergia a este medicamento.":"../language-audio/306866153a3667a61b39287e.mp3","Bom dia, precisava de uma informação.":"../language-audio/fa77436ed1906ac2c6afa142.mp3","Diga, em que posso ajudar?":"../language-audio/2a138a3e993cf111eb690867.mp3","Tenho tosse e queria saber onde posso pedir orientação.":"../language-audio/b1f26ceb1811f39fdd5c102a.mp3","Podemos falar com a farmacêutica.":"../language-audio/fcd5560799ee3134811c2798.mp3","O Chen entra numa farmácia porque tem uma dúvida sobre um medicamento que já toma. Leva a embalagem e uma lista das suas alergias conhecidas. Diz à farmacêutica há quanto tempo sente desconforto e pergunta onde pode obter orientação adequada. Não compreende uma palavra e pede que a escrevam. Antes de sair, confirma o que foi explicado. Se precisar de outra avaliação, quer saber como contactar um serviço de saúde.":"../language-audio/08a39535698ea8d070f5663d.mp3","A Mei telefona para uma clínica para perguntar como pode marcar uma consulta. Diz que tem uma dor no ombro há três dias. A rececionista pergunta o nome e explica que precisa de confirmar os horários disponíveis. A Mei pede que enviem a informação por escrito, porque não percebeu tudo ao telefone. Ela tem consigo uma lista dos medicamentos que toma. A conversa termina com a confirmação do seu endereço de email.":"../language-audio/1bf1f11c44191f33d4ff8b62.mp3","O que está a sentir e há quanto tempo?":"../language-audio/7ddeccbf6be4ec6b7af74e18.mp3","Tenho febre.":"../language-audio/61e8bc20defcd40b51789494.mp3","Doem-me os pés há três dias.":"../language-audio/3c210f14fbfb12e95d7e1707.mp3","Não sei se tenho alergia a esse medicamento.":"../language-audio/19c22b76974f8ac02098586b.mp3","Bom dia, podia falar com a farmacêutica?":"../language-audio/96c2724f412facabba4d2bda.mp3","Há quanto tempo tem esses sintomas?":"../language-audio/8b2fa198650f3622f58841e7.mp3","Tenho tosse desde ontem. Onde posso pedir ajuda?":"../language-audio/bd2de431adbfd6f753114a6f.mp3","É melhor explicar a alergia à farmacêutica.":"../language-audio/91d4a15283bbb207fdf9bc2a.mp3","amigo / amiga":"../language-audio/bdc5354db5b241afd270cd76.mp3","A Ana é minha amiga.":"../language-audio/be26d5aca874a81a5bf5e916.mp3","convidar":"../language-audio/28370a7f56ee333f8d421d80.mp3","Quero convidar o Rui.":"../language-audio/037c52c142d09d0bff69e6ab.mp3","jantar":"../language-audio/3dcb75fd03cf311cc5296081.mp3","Vamos jantar juntos?":"../language-audio/542adbb280db02bb8563c25a.mp3","passear":"../language-audio/8d3888b66aa7ed16b9003909.mp3","Gosto de passear.":"../language-audio/3d8a8f0e20041ca77766ee26.mp3","livre":"../language-audio/84690c26f45692d4e75fe4af.mp3","Estás livre amanhã?":"../language-audio/7f449f1e6706141cea926d64.mp3","ocupado / ocupada":"../language-audio/9b84c91ddd9113f974a7c395.mp3","Estou ocupada hoje.":"../language-audio/4b92bd3d10c4d69a3e774d34.mp3","combinar":"../language-audio/6614752b4577ac4603fc479c.mp3","Podemos combinar outra hora.":"../language-audio/2008dda9ccd8f2388b177715.mp3","talvez":"../language-audio/7643ac7430a52ce473474c10.mp3","Talvez no domingo.":"../language-audio/a8a1b96142242ce5f24ef7df.mp3","pena":"../language-audio/518829d440c534e39a2a06ad.mp3","Que pena!":"../language-audio/dbe418d1a8602c5947f2e407.mp3","aceitar":"../language-audio/a96a60295c96e08cda9ae353.mp3","Obrigada por aceitar o convite.":"../language-audio/93e129dccf49490fbb0d50bd.mp3","Gosto de passear junto ao rio.":"../language-audio/be6999160defc8778f9408d3.mp3","Gostava de te convidar para jantar.":"../language-audio/e59c6ed234dfd1249c05ac9a.mp3","Queres ir ao cinema no sábado?":"../language-audio/0527890dbfe642c48075d91b.mp3","Obrigada, mas no sábado trabalho.":"../language-audio/b7661ea1d2da54f66f56ae9e.mp3","E no domingo, estás livre?":"../language-audio/2f3633d1a7300a76aad74d9c.mp3","Sim, podemos combinar às cinco.":"../language-audio/d3e01f746ad87a0618a8692c.mp3","A Li quer convidar a Ana para um passeio junto ao rio no sábado. A Ana agradece, mas nesse dia tem de trabalhar até tarde. Propõe o domingo à tarde. A Li aceita e sugere que se encontrem às quatro, perto da ponte. As duas combinam levar água e fazer um passeio curto. Se estiver a chover, preferem encontrar-se num café e conversar um pouco antes de voltar para casa.":"../language-audio/4835ff1bd2caa1bab9661bb1.mp3","O Pedro convida o Liu para jantar em sua casa na sexta-feira. O Liu agradece, mas explica que tem uma aula nesse dia. Pergunta se o jantar pode ser no sábado. O Pedro concorda e propõe as oito da noite. O Liu aceita e pergunta se deve levar alguma coisa. O Pedro pede apenas fruta. Antes de terminar a conversa, envia a morada por mensagem para facilitar a chegada.":"../language-audio/372e8dd114280537e490869c.mp3","Queres combinar alguma coisa para o fim de semana?":"../language-audio/c11ed8cadce659cee4768b71.mp3","Queres jantar?":"../language-audio/d5316cf71772441fa0d8bee0.mp3","Talvez amanhã.":"../language-audio/a0e44150f6c221c427f73a7f.mp3","Gosto de passear à beira-mar ao domingo.":"../language-audio/b1304aae61c429fe6cb2cfe2.mp3","Gostava de te convidar para o meu almoço de aniversário.":"../language-audio/1b5ec3a65c5bf358a6cad697.mp3","Queres tomar um café depois da aula?":"../language-audio/a4aa03fd934fc1d684838ee5.mp3","Obrigado pelo convite, mas vou jantar com a minha família.":"../language-audio/3254034965f5d73d54189077.mp3","E na sexta-feira à noite, podes?":"../language-audio/96da1b8fd085f770193b1dd2.mp3","Sim, encontramo-nos à entrada do cinema às seis.":"../language-audio/91bdfe14d2afb96adbd6ee01.mp3","renda":"../language-audio/13075c49ce514aecfee96dd9.mp3","A renda inclui água?":"../language-audio/a11352fd5bc7e7320e85af5a.mp3","contrato":"../language-audio/9926094e1da1edaad1a1802c.mp3","Quero ler o contrato.":"../language-audio/03d6d05ab4d088c842697de8.mp3","caução":"../language-audio/3a6131330b6391cbf02e9008.mp3","Qual é o valor da caução?":"../language-audio/e8618676e3b68dfa02c73a8d.mp3","prazo":"../language-audio/dd42ec6a7282818a58eb0130.mp3","O prazo está escrito aqui.":"../language-audio/9cad584db995e7cb9050358c.mp3","senhorio / senhoria":"../language-audio/cba12636cf9ac231d6191d4e.mp3","Vou falar com a senhoria.":"../language-audio/39422a0adda02c2d17703898.mp3","inquilino / inquilina":"../language-audio/f2fbcc8b4029289b27265aca.mp3","O inquilino pediu uma cópia.":"../language-audio/a3509ec0d327dc5f8bf6b8fe.mp3","despesa":"../language-audio/a4ed5a7df07c89ec229cc3c3.mp3","Que despesas estão incluídas?":"../language-audio/74991bedb2b3e94d489a1087.mp3","reparação":"../language-audio/80e10c0778165a5a856014d8.mp3","Quem trata desta reparação?":"../language-audio/3bb3bc79de70556d495d926a.mp3","cláusula":"../language-audio/3b4dd00e7def7cd96d3f93f5.mp3","Não percebo esta cláusula.":"../language-audio/c1312b04b42d2630da92e3e0.mp3","cópia":"../language-audio/41af5c5aaad163802cc00ba0.mp3","Posso ficar com uma cópia?":"../language-audio/bc6e0b91b5fcfcbb64c618da.mp3","Gostava de saber se a água está incluída.":"../language-audio/9a61460f853ac22cd8739405.mp3","Pode explicar quando termina o contrato?":"../language-audio/51a6a3da47972e8e7fc4fda9.mp3","Antes de decidir, queria esclarecer as despesas.":"../language-audio/2a24d1e4d66ddfdb314b0077.mp3","A eletricidade é paga à parte.":"../language-audio/24988c873bd5657f537a7339.mp3","Pode enviar-me essa informação por escrito?":"../language-audio/a03eb8b774c2d81266ce3011.mp3","Sim, envio uma proposta para poder ler com calma.":"../language-audio/1b9252c05a6c21ea39397c35.mp3","Depois de visitar um apartamento, a Mei recebe uma proposta de arrendamento. A casa parece adequada, mas ela tem dúvidas sobre as despesas e o prazo. Envia perguntas à senhoria e pede uma cópia do documento para ler com calma. Quer também saber como são comunicados os problemas da casa. Uma amiga ajuda-a com o vocabulário. Se uma cláusula continuar pouco clara, a Mei pretende pedir esclarecimento profissional antes de tomar uma decisão.":"../language-audio/8281bc858d71b079dcb19f97.mp3","O Chen compara dois quartos. O primeiro tem uma renda mais baixa, mas a proposta não esclarece as despesas da internet. O segundo inclui internet e fica mais perto do trabalho. O Chen pede ao primeiro senhorio informação por escrito sobre os custos e o prazo. Ainda não escolheu nenhum quarto. Quer ler os documentos completos e esclarecer uma cláusula sobre reparações antes de decidir qual proposta corresponde melhor às suas necessidades.":"../language-audio/5aeded534ddc1eb85c3d3263.mp3","Que informações gostaria de confirmar sobre a casa?":"../language-audio/cee96f0f48c2264fe5b3d748.mp3","A caução.":"../language-audio/d91e28d2b109b93a2c4dba00.mp3","Uma reparação.":"../language-audio/8e0cfb2650dd359127a94f0a.mp3","Gostava de saber se a internet está incluída na renda.":"../language-audio/f18092efdcd90f07513cdff7.mp3","Pode explicar quando devo pagar a caução?":"../language-audio/97898bb28706a7b54d76caf0.mp3","Antes de assinar, queria esclarecer quem trata das reparações.":"../language-audio/a32ac15651f3e7aa223d8a5b.mp3","O consumo de gás é pago à parte todos os meses.":"../language-audio/1fb3d7e4b1c7964f610bb451.mp3","Pode enviar-me uma cópia dessa cláusula?":"../language-audio/d7a124ed208f1996ae3ab8ea.mp3","Vou ler a proposta e depois envio as minhas perguntas.":"../language-audio/226cfb74f16124416b6f9319.mp3","marcação":"../language-audio/de0afa5dddb88f9e813442f3.mp3","Tenho uma marcação para amanhã.":"../language-audio/6a30a6b88d7a6bb8ef1b6b48.mp3","atendimento":"../language-audio/cadedd9ec787c70e8ad172db.mp3","O atendimento começa às nove.":"../language-audio/bc38acf598fd15bd6090b496.mp3","documento":"../language-audio/429d003270d1f94371667069.mp3","Que documento devo levar?":"../language-audio/1ea952401bbffdd099ae43ad.mp3","formulário":"../language-audio/7415fc47698e4d1479b2877d.mp3","Preciso de preencher o formulário.":"../language-audio/b3651c66c17cb081ab1530eb.mp3","comprovativo":"../language-audio/805632580e7009443369c947.mp3","Este comprovativo é suficiente?":"../language-audio/7750eb2ac748df4d9a3eba6f.mp3","disponível":"../language-audio/cc60896c0365a19487502794.mp3","Há uma hora disponível?":"../language-audio/fa3cb915291ff29d86489285.mp3","adiar":"../language-audio/0320971bcb76a51ef60c9382.mp3","Preciso de adiar a marcação.":"../language-audio/7ab2d7ba08a8b11af8b201ea.mp3","cancelar":"../language-audio/19f64b8e7dd9a221997ad188.mp3","Posso cancelar pela internet?":"../language-audio/b1c878725d783abe59898cdb.mp3","confirmar":"../language-audio/07c75ebf11e91108f35f5fae.mp3","Quero confirmar o horário.":"../language-audio/d91eb0ffb18b9112f6822917.mp3","balcão":"../language-audio/416aba1e6c50823765c4635c.mp3","Onde fica o balcão de informações?":"../language-audio/c9c91db2807154a981d8cc4c.mp3","Se faltar algum documento, volto a contactar o serviço.":"../language-audio/b30b3d1c126ff004c64a64ed.mp3","Seria possível alterar a marcação?":"../language-audio/10915a3f52fe5cc14a250027.mp3","Tenho uma marcação, mas não posso ir nessa data.":"../language-audio/09c4404a5d1184446ecd24f7.mp3","Pode indicar outra data disponível?":"../language-audio/32961614ed1f61c17d2f29f3.mp3","Há algum documento que deva preparar?":"../language-audio/640be89d5185f2fa3d3024b9.mp3","Consulte a lista enviada com a confirmação.":"../language-audio/74b4cfa2e67d87d855ae59be.mp3","A Li tinha uma marcação num serviço municipal, mas recebeu um novo horário de trabalho. Como as horas coincidem, contacta o serviço para pedir outra data. Explica o motivo de forma breve e pergunta se pode manter os documentos já preparados. A funcionária envia uma nova confirmação e uma lista para consultar. A Li guarda a mensagem e verifica a morada do balcão, pois o atendimento pode ser num edifício diferente.":"../language-audio/06ccd6becbb9f396784450ee.mp3","O Liu marcou um atendimento para sexta-feira de manhã. Ao ler a confirmação, percebe que não sabe qual comprovativo de morada deve apresentar. Em vez de adivinhar, envia uma pergunta ao serviço e pede exemplos dos documentos aceites para o seu caso. A resposta chega na quinta-feira e indica também um novo balcão no mesmo edifício. O Liu prepara os documentos, guarda a resposta e confirma a hora antes de sair de casa.":"../language-audio/3f665b24d97fddaf8a027659.mp3","Tem uma marcação ou precisa de pedir uma?":"../language-audio/c086dcef1f3a6afc0097ec78.mp3","Uma marcação.":"../language-audio/ebfb624d4cc5c4ad4d1b39cd.mp3","Está disponível?":"../language-audio/9015cb3ff7517eba9067b810.mp3","Se faltarem documentos, peço esclarecimentos antes de sair de casa.":"../language-audio/3db5c06906420ad0dd44c7e0.mp3","Seria possível passar a marcação para a manhã?":"../language-audio/cc99d05f3dc4b8c4bc7fb92c.mp3","Tenho uma marcação na terça-feira, mas trabalho nesse dia.":"../language-audio/9290570c7b5b3249b9b7a801.mp3","Pode indicar um horário disponível para a próxima semana?":"../language-audio/cc587daa18274748da4f339d.mp3","É necessário levar uma cópia do documento?":"../language-audio/8319b7df257f1dd2df5908b4.mp3","Verifique a morada indicada na mensagem de confirmação.":"../language-audio/b7b02e251c2f16bbb47aa670.mp3","tarefa":"../language-audio/49bdc0dcf63af9926e4d633b.mp3","Esta tarefa demora uma hora.":"../language-audio/d620cd6477695da6bff90184.mp3","prazo de entrega":"../language-audio/9dfb608a68bf0f6ffb94cd82.mp3","Qual é o prazo de entrega?":"../language-audio/fe600efd5f294dfe7bf0f093.mp3","reunião":"../language-audio/93f83266b1d8c8ff5277aec4.mp3","A reunião começa às dez.":"../language-audio/71fe439d7bcb4b6b66955024.mp3","ficheiro":"../language-audio/0582945760e9f16823bfde9b.mp3","Enviei o ficheiro correto.":"../language-audio/ac775dc9c65c14dafd7a517c.mp3","anexo":"../language-audio/24cac378a0308dbfc8d042b5.mp3","O relatório segue em anexo.":"../language-audio/b4bf7ab2d56710b303230e24.mp3","equipa":"../language-audio/e742e56c0ce341b4bf997240.mp3","A equipa precisa de ajuda.":"../language-audio/a5817b23230b88a6560a59e0.mp3","prioridade":"../language-audio/63b6631ed74fd73a5062e196.mp3","Esta tarefa é a prioridade?":"../language-audio/cdab8cdd97a1d3b25c4c81e9.mp3","rever":"../language-audio/b516ae053630ff65769658f1.mp3","Pode rever o texto?":"../language-audio/239b27251f674b06f83b73ff.mp3","partilhar":"../language-audio/fdb4aad96223f2746e5c4379.mp3","Vou partilhar a pasta.":"../language-audio/4a5f08b24cb78f52c6e52aa6.mp3","concluir":"../language-audio/5911c865dea15256b8997f4b.mp3","Espero concluir hoje.":"../language-audio/d49d295789442b0f0efb1136.mp3","Poderia rever este ficheiro antes da reunião?":"../language-audio/db4aa58cf61552c7fec5a420.mp3","Envio o rascunho para receber os teus comentários.":"../language-audio/48be25eb84b758d7886078e7.mp3","Consigo terminar amanhã, mas preciso dos dados de hoje.":"../language-audio/9261f2482f202c5d775e9679.mp3","Eu envio os dados até às quatro.":"../language-audio/9ac286f85ac27f385ede3818.mp3","Se houver alterações, podes avisar-me?":"../language-audio/f6da2f6a3152550bb1d18929.mp3","Claro, deixo uma mensagem na pasta da equipa.":"../language-audio/46bdaef0dd09db1c695349dc.mp3","A Mei prepara uma apresentação com a equipa. Precisa de dados que ainda não recebeu, por isso avisa o colega antes do prazo. Explica o que já concluiu e pede que ele envie a tabela até ao fim da tarde. Propõe entregar um rascunho no dia seguinte, para haver tempo de revisão. O colega aceita e confirma quais são os números mais recentes. A Mei regista o acordo numa mensagem curta.":"../language-audio/e75f2a16f65a235a1e76f7fa.mp3","O Chen recebe dois ficheiros com nomes parecidos antes de uma reunião. Não sabe qual contém os valores corrigidos. Pergunta à colega qual deve usar e explica que a apresentação depende dessa confirmação. A colega responde que a versão com a data de terça-feira é a mais recente. Pede ainda que ele retire um gráfico antigo. O Chen faz a alteração, envia o rascunho e solicita comentários até ao meio-dia seguinte.":"../language-audio/6aa2837ccc62787f44d7c272.mp3","Podemos confirmar o que falta fazer e até quando?":"../language-audio/aa815972f9baf90d63936e63.mp3","O ficheiro.":"../language-audio/1de58567bbbe5bdda11c395b.mp3","Antes da reunião.":"../language-audio/2d502ca1d01a2e9c66cb9e81.mp3","Poderia verificar a tabela em anexo antes do almoço?":"../language-audio/dd47aba1ac9c4af35304520c.mp3","Envio a lista de dúvidas para prepararmos a reunião.":"../language-audio/11e03214516365a0c46cbb0f.mp3","Consigo rever o texto hoje, mas só recebo os números amanhã.":"../language-audio/ce0c6ab5845b4245a5bc78da.mp3","Partilho o rascunho convosco até às dez da manhã.":"../language-audio/0e566c7cc8a458f344921fe3.mp3","Se houver mudanças no prazo, podes avisar toda a equipa?":"../language-audio/405293e22580de0fcf2700ef.mp3","Claro, vou registar a decisão no ficheiro partilhado.":"../language-audio/516a3439905b7c1fa436d09d.mp3","inscrição":"../language-audio/c5f164d29d78f288ba9cd4c4.mp3","A inscrição termina amanhã.":"../language-audio/2afac02e847c79e235184412.mp3","propina":"../language-audio/cfc331366dc3b1a974d40630.mp3","Qual é o valor da propina?":"../language-audio/b4b53e5df1f4dcb3c5b42f02.mp3","horário":"../language-audio/2abcec037482f668dc374be4.mp3","Este horário é melhor para mim.":"../language-audio/e6fd7351e7de4c8f3cfee8bf.mp3","exercício":"../language-audio/d7a9ab12ef6fea027c7ecbf5.mp3","Preciso de repetir o exercício.":"../language-audio/033296acdae5b00cdf07df9d.mp3","dúvida":"../language-audio/4535d5f99f35eefc59242074.mp3","Tenho uma dúvida sobre o texto.":"../language-audio/21a7d7a21e4bfd87a36e778a.mp3","avaliação":"../language-audio/f499ffca7acd28b105528469.mp3","Como funciona a avaliação?":"../language-audio/2e17839121deee2f96876c6c.mp3","melhorar":"../language-audio/73ca7a029f686841c9f2673c.mp3","Quero melhorar a pronúncia.":"../language-audio/9ea22ad01481d57241bc06b6.mp3","pronúncia":"../language-audio/cefef7f90124ea09a7b37b0b.mp3","A pronúncia exige prática.":"../language-audio/3cd8a3d011bed0c9435ff136.mp3","faltar":"../language-audio/48dc84c3d9aba229233c4b3b.mp3","Vou faltar à aula de hoje.":"../language-audio/cd3278f15c1c2eb34781eaaa.mp3","apoio":"../language-audio/78c3fa8a233b1763f7c2d3d0.mp3","Existe apoio para esta atividade?":"../language-audio/7b786648a1e1bfd742bb385e.mp3","Ler é mais fácil para mim do que ouvir.":"../language-audio/7c751b31f4ff09a9d86ab42e.mp3","Este exercício é tão útil como o anterior.":"../language-audio/36dafdedad6ad6a0a7f64221.mp3","Tenho dificuldade em perceber conversas rápidas.":"../language-audio/2b1ca26704ef2d8580b5bbdb.mp3","Podemos praticar com gravações mais curtas.":"../language-audio/84490478c3e462a879f6f11c.mp3","Quanto tempo devo estudar entre as aulas?":"../language-audio/91ab86473a199c4d379cd0eb.mp3","Começa com períodos curtos e regista as tuas dúvidas.":"../language-audio/b47c1b567b1eb1a31995636a.mp3","O Liu frequenta um curso à noite. Lê os textos com alguma facilidade, mas perde informação quando várias pessoas falam depressa. Na aula pede à professora uma estratégia para praticar em casa. Ela sugere ouvir um excerto curto, anotar palavras importantes e voltar a ouvir. O Liu decide experimentar durante uma semana. Depois quer comparar o que percebeu na primeira e na última tentativa, sem esperar compreender tudo imediatamente.":"../language-audio/9744dc21450469dc56c32bad.mp3","A Li procura um curso de fotografia. Encontra duas opções: uma tem aulas de manhã e outra funciona ao sábado. Como trabalha durante a semana, prefere a segunda. Antes de se inscrever, pergunta se precisa de levar uma máquina própria e como são avaliados os trabalhos. A escola responde que pode começar com o equipamento disponível nas aulas, mas deve confirmar a reserva. A Li pede também informação sobre o custo total.":"../language-audio/a280a1e248eb73e42762717e.mp3","O que gostaria de aprender neste curso?":"../language-audio/ff212bef0ba23c361fd73cc3.mp3","A pronúncia.":"../language-audio/97d120d49626c9208638e8fb.mp3","Uma dúvida.":"../language-audio/56d17da80b91cea2c731e84e.mp3","Escrever mensagens é mais difícil para mim do que ler notícias.":"../language-audio/32838d43a27f3b865fdab37e.mp3","A atividade de hoje é tão prática como a de ontem.":"../language-audio/943fef42a1cfc2fd8959b0e9.mp3","Tenho dificuldade em distinguir sons parecidos.":"../language-audio/d6208ba3b00e709da73fbeaa.mp3","Podemos começar por diálogos mais lentos e depois aumentar a velocidade.":"../language-audio/059779b1f90a6b46049c0e8c.mp3","Quantos exercícios devo fazer antes da próxima aula?":"../language-audio/83d5e2eed3d7c046001d2e20.mp3","Ouve um diálogo curto e anota as expressões que não percebes.":"../language-audio/ad0c1ff62bc3254c9787bbc9.mp3","conta bancária":"../language-audio/19df6e10605d835be9534f3b.mp3","Quero informação sobre uma conta bancária.":"../language-audio/87e0bb382a0f8c9f3702c78d.mp3","transferência":"../language-audio/f9695961ebfa0d38b09a9908.mp3","A transferência ainda não chegou.":"../language-audio/35788e8926f2501385743a35.mp3","saldo":"../language-audio/0503f0453a8acf5136ea150d.mp3","Preciso de consultar o saldo.":"../language-audio/64f24b78077b4aa7e30ec0fa.mp3","comissão":"../language-audio/ff7d380fc810374838c01c5e.mp3","Esta operação tem comissão?":"../language-audio/61f95438098f4d54d2d4fe81.mp3","pagamento":"../language-audio/06ef6e86ecccf5b4337c4c90.mp3","O pagamento foi recusado.":"../language-audio/4a2e3a1f1893337180b0f5e9.mp3","levantamento":"../language-audio/ad4666fffcd103691cb0f255.mp3","Quero confirmar o limite de levantamento.":"../language-audio/8211c4db0b9eaaa33bfcdd50.mp3","recibo":"../language-audio/6aad17fc6618d9b2889443f3.mp3","Preciso de um recibo.":"../language-audio/4ce2bd5bdaec2a685128faf2.mp3","montante":"../language-audio/7b05f2ebec6d58fa50b82aa8.mp3","O montante está correto.":"../language-audio/4ba16718034147ca0f80f9d7.mp3","código":"../language-audio/59363306de5e9120eca111bc.mp3","Não vou partilhar o código.":"../language-audio/9a712e2da0b26e07ced9f5ef.mp3","movimento":"../language-audio/af13941a8ca94abc3685aba4.mp3","Não reconheço este movimento.":"../language-audio/8cbea80e933074f1e710babf.mp3","Recebi o recibo e guardei-o.":"../language-audio/c9516012d2945548a07edc4a.mp3","Pedi o comprovativo, mas não o recebi.":"../language-audio/d5d232c7622eb0d3d171863a.mp3","O cartão foi recusado, mas o valor aparece na aplicação.":"../language-audio/88066362a13ad005000f6660.mp3","Tem o comprovativo da tentativa de pagamento?":"../language-audio/40cb07b91f8fbed3cb02e209.mp3","Sim. Pode explicar o estado desta operação?":"../language-audio/407d0f80ecf280869996b892.mp3","Vamos verificar a informação pelo canal oficial.":"../language-audio/c7702cf463958ef64caea6c8.mp3","A Mei tenta pagar uma compra com cartão, mas o terminal apresenta uma mensagem de erro. Na aplicação do banco aparece um valor relacionado com a tentativa. Ela guarda o talão e pergunta à loja se a compra ficou registada. Depois contacta o banco pelo canal oficial para perceber o estado da operação. Descreve a hora e o montante, sem enviar códigos de segurança por mensagem. Quer uma explicação antes de repetir o pagamento.":"../language-audio/4b97d33e157e01c73c004533.mp3","O Rui consulta os movimentos da conta e encontra um nome que não reconhece. Antes de concluir que existe um erro, compara o montante e a data com os recibos guardados. Um recibo tem o mesmo valor, mas apresenta outro nome comercial. O Rui continua com dúvidas e contacta o apoio do banco através da aplicação habitual. Pede informação sobre a operação e anota a referência do contacto para acompanhar a resposta.":"../language-audio/cfd34b7ae0ecda8df90ebbf7.mp3","Pode explicar qual é a sua dúvida sobre o pagamento?":"../language-audio/29af0ed063d62100229c79a5.mp3","O recibo.":"../language-audio/a3bbe9802b97985b9fb8006e.mp3","Eu recebo.":"../language-audio/f5e173aff065bf3f7b62cc3d.mp3","Descarreguei o comprovativo e guardei-o numa pasta.":"../language-audio/2dfe1cd3ceaf13624eb53bd5.mp3","Pedi a confirmação, mas ainda não a recebi.":"../language-audio/0c50fc9b92e8687babcb7ba2.mp3","Fiz a transferência, mas a aplicação ainda mostra «pendente».":"../language-audio/08e0360baddd6ba3744179e7.mp3","Guardou o número da operação?":"../language-audio/ddf29c86b7d5b742872e78fe.mp3","Pode explicar a que corresponde esta comissão?":"../language-audio/44d7d2580e7ebc3471539f07.mp3","Vou confirmar o movimento através do contacto habitual do banco.":"../language-audio/722d9a46f353da827f49bfd7.mp3","mensagem":"../language-audio/e6edfaa3a4779f0da1c5a0c4.mp3","Recebi a tua mensagem.":"../language-audio/93c3324b383c26d53d6ea570.mp3","assunto":"../language-audio/884d689942f1032db79b79b3.mp3","O assunto está no início.":"../language-audio/5be9b1ccb171b2a84f67853d.mp3","ligação":"../language-audio/889e20f010cb099bafe5f4cb.mp3","Não abri a ligação.":"../language-audio/c77047a905bc6a1384412ff2.mp3","palavra-passe":"../language-audio/00a539e7af3728d126987fff.mp3","Esqueci-me da palavra-passe.":"../language-audio/d0907bd7ed4d6680810e53c4.mp3","remetente":"../language-audio/7a31e96b4e10b9cc2ee3ba38.mp3","Conheces o remetente?":"../language-audio/2ada29f92717083e4d9d93d0.mp3","destinatário":"../language-audio/fe1c2c41f3a33257db47a511.mp3","Confirma o destinatário.":"../language-audio/2195358c5b009b7039380d89.mp3","rascunho":"../language-audio/5743290f7d0bf732b76a0191.mp3","Guardei um rascunho.":"../language-audio/857cee9623244dd16ab5d46b.mp3","responder":"../language-audio/9d62a0bbf6f4c067b436fc7e.mp3","Vou responder amanhã.":"../language-audio/4167d48956600b39e724ac45.mp3","encaminhar":"../language-audio/a996442d04db7cc358921908.mp3","Posso encaminhar esta informação?":"../language-audio/cf19124dd011b4e05ee27694.mp3","verificar":"../language-audio/dbe05c21d1aa083fb44d71c1.mp3","É melhor verificar a origem.":"../language-audio/a4dfa25e014294f518321578.mp3","A mensagem diz que a reunião mudou de sala.":"../language-audio/9f2575cad5e17a23e7f47a67.mp3","Bom dia, poderia confirmar a receção deste email?":"../language-audio/dd4a5808be187cd43c9d290d.mp3","Recebi uma ligação, mas não reconheço o remetente.":"../language-audio/eb8539f4f22bbad3ebd50138.mp3","A mensagem pede alguma informação pessoal?":"../language-audio/80ff8c66abf5e9c9301ad52d.mp3","Sim, pede uma palavra-passe e cria muita urgência.":"../language-audio/edca39e6689fd624dff7bc96.mp3","Vou contactar o serviço através do endereço que já conheço.":"../language-audio/6351795a26bcf68031da546f.mp3","A Li escreve uma mensagem à escola para perguntar sobre uma aula. Coloca um assunto claro e explica a dúvida em poucas frases. Antes de enviar, confirma o destinatário e verifica se o anexo está correto. Mais tarde recebe uma mensagem inesperada que pede a palavra-passe da conta. Como não reconhece o remetente, não responde com dados pessoais. Prefere contactar a escola através do endereço que utiliza habitualmente para esclarecer a situação.":"../language-audio/43807d0a6aebb9b193692192.mp3","O Chen recebe no grupo uma mensagem a dizer que a visita de sábado foi cancelada. A mensagem foi encaminhada e não indica quem tomou a decisão. Antes de alterar os planos, o Chen consulta o email enviado pela organização. Não encontra qualquer aviso novo, por isso escreve diretamente para o contacto habitual. A organização responde que a visita se mantém, mas começa meia hora mais tarde. O Chen partilha a confirmação com o grupo.":"../language-audio/dc5f619fbd104a562cd317ca.mp3","A quem vai escrever e o que precisa de esclarecer?":"../language-audio/9f37fbfc8a78e4861992a698.mp3","Uma mensagem.":"../language-audio/088859ecfdb621ddc5fab282.mp3","A palavra-passe.":"../language-audio/cd62989af0ba93428a5f1875.mp3","O email informa que a reunião foi adiada para sexta-feira.":"../language-audio/c5f2fe9e8df136605bac9148.mp3","Bom dia, poderia confirmar se recebeu o ficheiro em anexo?":"../language-audio/7e3c666496a3306e8f957000.mp3","Recebi uma ligação para um site, mas não sei quem a enviou.":"../language-audio/7029ca936fd0e10709864fa0.mp3","Que dados pede essa mensagem?":"../language-audio/36937dd07adc1cf67fe1aaf3.mp3","Pede um código de acesso e diz que a conta vai ser bloqueada.":"../language-audio/b0245ffbc19c88fd3f98dfb3.mp3","Antes de responder, vou verificar o endereço do remetente.":"../language-audio/c64a30076bac6b589bc98e23.mp3","Recebi uma mensagem sobre uma reunião.":"../language-audio/c747f8163460d49096c75d3d.mp3","A mensagem não indica quem a escreveu.":"../language-audio/a48ac8c1fea77e47007f0ace.mp3","Antes de mudar os planos, vou confirmar a informação.":"../language-audio/3f4c0617588a1c3f526663a0.mp3","Prefiro contactar a organização pelo endereço habitual.":"../language-audio/7056a1bddbb9aef207305f6c.mp3","Se a hora mudar, aviso também os meus colegas.":"../language-audio/f8abcf7e85fb4e2f4f3c11c0.mp3","Depois guardo a resposta para a poder consultar.":"../language-audio/f410fecedf2b6d0f70fbcc93.mp3","Recebi uma mensagem sobre uma reunião. A mensagem não indica quem a escreveu. Antes de mudar os planos, vou confirmar a informação. Prefiro contactar a organização pelo endereço habitual. Se a hora mudar, aviso também os meus colegas. Depois guardo a resposta para a poder consultar.":"../language-audio/72c9e8b0fa42c5cfcc74a77c.mp3","A Ana recebe uma mensagem encaminhada sobre um curso. Segundo a mensagem, a aula de terça-feira passou para quinta-feira. A Ana não encontra o nome de quem enviou o aviso original. Por isso, escreve ao contacto habitual da escola antes de alterar a sua agenda. A escola responde que a aula continua na terça-feira, mas será noutra sala. A Ana guarda a confirmação e informa o colega que lhe enviou a mensagem.":"../language-audio/9416d845b6e9fe400019823b.mp3","Já confirmou esta informação com a organização?":"../language-audio/9ec47218ce39cfa197beae77.mp3","Quem escreveu?":"../language-audio/d07fe9e64739b504b85a4d1e.mp3","Vou confirmar.":"../language-audio/97b60605e72218604e70806b.mp3","Recebi um aviso sobre o cancelamento do encontro.":"../language-audio/652a4bf68d43f5662d22bd44.mp3","O aviso não inclui nenhum contacto da organização.":"../language-audio/dcf04db214090d9a31a3e12c.mp3","Antes de avisar os amigos, vou confirmar a data.":"../language-audio/4acc4b098d32bbac4fbbd574.mp3","Prefiro escrever à pessoa que costuma organizar o encontro.":"../language-audio/25829ffcc245c75d46b32aed.mp3","Se o local mudar, envio a nova morada ao grupo.":"../language-audio/c61588047c4f2ca25f504413.mp3","Depois de receber a confirmação, anoto a hora na agenda.":"../language-audio/27069a2b94708f820d3fb5e3.mp3","Comprei este produto ontem e guardei o recibo.":"../language-audio/75ce603c30bbd7cdaeb73de5.mp3","Quando cheguei a casa, reparei num problema.":"../language-audio/b1c06de0db53b986036ac455.mp3","Gostava de explicar o que aconteceu com calma.":"../language-audio/efa3c29ed0041d3f628f3877.mp3","Pode dizer-me quais são as opções neste caso?":"../language-audio/51e01341fdbdfb7518587746.mp3","Se não for possível resolver hoje, quando devo voltar?":"../language-audio/d1f69f1d5e596249a0231416.mp3","Vou guardar a resposta e o número do pedido.":"../language-audio/766efdaaa9a1a33269c2e8c5.mp3","Comprei este produto ontem e guardei o recibo. Quando cheguei a casa, reparei num problema. Gostava de explicar o que aconteceu com calma. Pode dizer-me quais são as opções neste caso? Se não for possível resolver hoje, quando devo voltar? Vou guardar a resposta e o número do pedido.":"../language-audio/f93672b4c1afe6477ab68948.mp3","O Rui comprou uma mochila numa loja na segunda-feira. Ao chegar a casa, viu que uma das alças estava solta. Na quarta-feira voltou à loja com a mochila e o recibo. A funcionária ouviu a explicação e disse que precisava de consultar a responsável antes de indicar uma solução. Pediu um contacto e entregou ao Rui um número de pedido. Ele perguntou quando poderia esperar uma resposta e anotou a informação.":"../language-audio/aeefcc72d2160303d0e6382f.mp3","Pode contar-me o que aconteceu com o produto?":"../language-audio/827ed41ff1e0c14b4729d603.mp3","Comprei ontem.":"../language-audio/2f07c29c22e5568ac8355e01.mp3","Guardei o talão.":"../language-audio/81806565110701cc2e4485f1.mp3","Comprei esta embalagem de arroz de manhã e guardei o talão.":"../language-audio/eeb2467483a1a13edb72e76b.mp3","Quando abri o saco, vi que faltava um produto.":"../language-audio/38b7cc53ed50de3261565b64.mp3","Gostava de explicar o problema antes de escolher uma solução.":"../language-audio/4087e15562199fe998a6c5dc.mp3","Pode verificar se o valor no talão corresponde ao que paguei?":"../language-audio/2017ade1147911a64566e15f.mp3","Se não conseguirmos resolver agora, como posso acompanhar o pedido?":"../language-audio/85839dc1e910355e873126d0.mp3","Vou anotar a data da resposta e o nome da pessoa com quem falei.":"../language-audio/67adcdc104358a89cac757fc.mp3","No mês passado fui visitar uma amiga.":"../language-audio/a34c504a9ca5ac1e5c45d15f.mp3","Saí cedo porque não conhecia bem o caminho.":"../language-audio/f18b70609dc29845fd0fdf5f.mp3","Quando cheguei à estação, o comboio já tinha partido.":"../language-audio/cb194225b1b6420554e16b27.mp3","Pedi ajuda e procurei outra ligação.":"../language-audio/4a5f0213a90241fc2d3a9464.mp3","Avisei a
