</script></head><body><header><a href="../suite.html">← 大陆地图</a><span id="courseName" class="brand">语言大陆</span></header><main><div id="notice" role="status" aria-live="polite"></div><div id="app"></div></main><footer>0.11.0 · Português · A1–B1 生活学习目标 · 本地合成音频 · 专业语言审阅与真实学习效果验证待完成</footer><script>window.ContinentData={"id":"pt-PT","name":"葡萄牙语","nativeName":"Português","country":"葡萄牙","chapters":[{"id":"pt-01","number":1,"title":"见面与告别","level":"A1","stage":"beginner","goal":"能问候、自我介绍并礼貌结束短对话。","grammar":{"title":"ser 的现在时与简单介绍","explanation":"Sou 表示“我是”，é 可表示“您是／他是／她是”；名字常用 Chamo-me。葡萄牙语通常省略可由动词判断的人称代词。","examples":[{"text":"Bom dia, sou a Li.","zh":"早上好，我是小李。"},{"text":"O meu nome é Chen.","zh":"我的名字是陈。"}]},"vocab":[{"head":"bom dia","zh":"早上好","example":"Bom dia, Ana.","exampleZh":"早上好，安娜。","icon":"talk"},{"head":"boa tarde","zh":"下午好","example":"Boa tarde, senhor Silva.","exampleZh":"下午好，席尔瓦先生。","icon":"talk"},{"head":"boa noite","zh":"晚上好；晚安","example":"Boa noite, até amanhã.","exampleZh":"晚安，明天见。","icon":"time"},{"head":"olá","zh":"你好","example":"Olá, sou a Li.","exampleZh":"你好，我是小李。","icon":"talk"},{"head":"adeus","zh":"再见","example":"Adeus, até breve.","exampleZh":"再见，回头见。","icon":"talk"},{"head":"até amanhã","zh":"明天见","example":"Até amanhã, Rui.","exampleZh":"鲁伊，明天见。","icon":"time"},{"head":"nome","zh":"名字","example":"O meu nome é Chen.","exampleZh":"我的名字是陈。","icon":"person"},{"head":"prazer","zh":"幸会；高兴","example":"Muito prazer, Ana.","exampleZh":"很高兴认识你，安娜。","icon":"talk"},{"head":"obrigado / obrigada","zh":"谢谢","example":"Obrigada pela ajuda.","exampleZh":"谢谢你的帮助。","icon":"talk"},{"head":"senhor / senhora","zh":"先生／女士","example":"A senhora é a Ana?","exampleZh":"您是安娜女士吗？","icon":"person"}],"lessons":[{"id":"pt-01-1","text":"Bom dia, sou a Li.","zh":"早上好，我是小李。","tip":"sou 来自 ser，用于介绍身份。"},{"id":"pt-01-2","text":"O meu nome é Chen.","zh":"我的名字是陈。","tip":"meu nome 前常用定冠词 o。"},{"id":"pt-01-3","text":"Olá, chamo-me Ana. E tu?","zh":"你好，我叫安娜。你呢？","tip":"tu 适合双方接受的非正式语境。"},{"id":"pt-01-4","text":"Chamo-me Li. Muito prazer.","zh":"我叫小李。很高兴认识你。","tip":"chamo-me 是欧洲葡语常见的自我介绍方式。"},{"id":"pt-01-5","text":"Muito prazer. Até amanhã!","zh":"很高兴认识你。明天见！","tip":"até 加时间表达告别。"},{"id":"pt-01-6","text":"Até amanhã, Ana!","zh":"明天见，安娜！","tip":"与对方呼应即可。"}],"dialogue":[{"speaker":"甲","text":"Olá, chamo-me Ana. E tu?","zh":"你好，我叫安娜。你呢？"},{"speaker":"乙","text":"Chamo-me Li. Muito prazer.","zh":"我叫小李。很高兴认识你。"},{"speaker":"甲","text":"Muito prazer. Até amanhã!","zh":"很高兴认识你。明天见！"},{"speaker":"乙","text":"Até amanhã, Ana!","zh":"明天见，安娜！"}],"reading":{"title":"第一天的邻居","text":"A Li chega a uma casa em Coimbra. À porta encontra a vizinha Ana. A Li diz: «Bom dia, sou a Li.» A Ana responde com um sorriso e apresenta o marido, o Rui. Os três falam um pouco no jardim. A Li ainda sabe poucas palavras de português, mas consegue dizer o seu nome e agradecer. Antes de entrar em casa, despede-se dos vizinhos: «Até amanhã!»","zh":"小李来到科英布拉的一所房子。她在门口遇到邻居安娜。小李说：“早上好，我是小李。”安娜微笑着回应，并介绍她的丈夫鲁伊。三人在花园里聊了一会儿。小李懂的葡语词汇还不多，但能说自己的名字并道谢。进屋前，她向邻居告别：“明天见！”"},"assessment":{"reading":{"title":"图书馆初见","text":"O Chen vai à biblioteca de manhã. À entrada, uma funcionária diz «Bom dia» e pergunta o nome dele. Ele responde: «Chamo-me Chen.» A funcionária chama-se Marta. Ela apresenta o colega Pedro, que está ao lado da porta. O Chen agradece e vai ler uma revista. Quando sai, ainda antes do almoço, diz «Até breve» aos dois funcionários. No dia seguinte quer voltar à biblioteca."},"questions":[{"prompt":"陈什么时候到图书馆？","options":["早上","下午","晚上"],"answer":0,"explanation":"文中说 de manhã。"},{"prompt":"工作人员玛尔塔介绍了谁？","options":["邻居","同事佩德罗","老师"],"answer":1,"explanation":"文中说 apresenta o colega Pedro。"},{"prompt":"陈读了什么？","options":["报纸","合同","杂志"],"answer":2,"explanation":"文中是 ler uma revista。"},{"prompt":"陈离开时说了什么？","options":["Até breve","Boa noite","Desculpe"],"answer":0,"explanation":"文末明确写出 Até breve。"}],"writing":"写四句初次见面的介绍，包括名字和告别语。","speaking":"模拟在上午与新邻居初次见面，问候、报名字并告别。"},"story":{"id":"pt-01","npc":"Inês","place":"小镇入口","scene":"你刚到葡萄牙，邻居主动向你打招呼。先回应，再慢慢介绍自己。","text":"Olá! É a sua primeira visita aqui?","zh":"你好！您是第一次来这里吗？","icon":"person"},"support":{"id":"pt-01","pronunciation":{"focus":"问候中的重音","explanation":"bom dia 的重音落在 dia 的 di；olá 的重音在最后音节。先保留重读元音，再适应欧洲葡语非重读元音的弱化。","examples":[{"text":"Olá!","zh":"你好！"},{"text":"Boa tarde!","zh":"下午好！"}]},"grammarNotes":["sou 对应第一人称单数；é 对应第三人称单数。不要把中文不变的“是”直接映射为同一个形式。","肯定陈述中的自反代词通常后置并连字符相连：chamo-me；不要写成 chamo eu。","姓名前在葡萄牙日常口语中常带 o/a；nome 是阳性，所以用 o meu nome，即使说话者是女性。"],"cultureNote":"在葡萄牙，不熟悉的成年人之间可先用 Bom dia 或 Boa tarde，再用第三人称礼貌表达；tu 通常留给双方接受的熟悉关系。","vocabularyNotes":[{"head":"bom dia","note":"bom 配合阳性 dia；下午、晚上分别是 boa tarde、boa noite，不能一律用 bom。"},{"head":"nome","note":"nome 是阳性：o nome；问名字可说 Como se chama?。"},{"head":"obrigado / obrigada","note":"obrigado/obrigada 通常与说话者的性别一致，而非与被感谢者一致。"}],"transfer":[{"id":"pt-01-transfer-1","prompt":"向新老师说明自己是新学生","text":"Bom dia, sou a nova aluna.","zh":"早上好，我是新来的女学生。","explanation":"sou 说明身份；aluna 为女性，nova 随之用阴性。"},{"id":"pt-01-transfer-2","prompt":"登记时说出全名","text":"O meu nome completo é Li Mei.","zh":"我的全名是李梅。","explanation":"completo 修饰阳性 nome；主语为单数，使用 é。"},{"id":"pt-01-transfer-3","prompt":"向同学介绍自己并问其姓名","text":"Chamo-me Mei. Como te chamas?","zh":"我叫梅。你叫什么名字？","explanation":"熟人式问句用第二人称 chamas，代词 te 前置在疑问词之后。"},{"id":"pt-01-transfer-4","prompt":"介绍自己的同事","text":"Esta é a minha colega. Muito prazer.","zh":"这是我的女同事。很高兴认识你。","explanation":"esta 指女性；a minha colega 保持阴性搭配。"},{"id":"pt-01-transfer-5","prompt":"周五约好下周再见后告别","text":"Foi um prazer. Até segunda-feira!","zh":"很高兴认识您。周一见！","explanation":"até 后直接接星期名称，表达下次见面的时间。"},{"id":"pt-01-transfer-6","prompt":"夜间向大家告别","text":"Boa noite a todos. Até breve!","zh":"大家晚安。回头见！","explanation":"a todos 指向所有人；boa noite 也可用于夜间告别。"}],"grammarCheck":[{"prompt":"选择表达“早上好，我是小李。”且语法、用法正确的一项。","options":["Bom dia, sou a Li.","Bom dia, eu é a Li.","Bom dia, ser a Li."],"answer":0,"explanation":"介绍“我是”要用 sou；é 是第三人称，ser 是未变位的原形。"},{"prompt":"选择表达“我的名字是陈。”且语法、用法正确的一项。","options":["O meu nome sou Chen.","O meu nome é Chen.","A minha nome é Chen."],"answer":1,"explanation":"nome 是阳性，用 o meu；单数名词主语搭配 é，不能用表示“我”的 sou。"},{"prompt":"选择表达“你好，我叫安娜。你呢？”且语法、用法正确的一项。","options":["Olá, chama-me Ana. E tu?","Olá, chamo eu Ana. E tu?","Olá, chamo-me Ana. E tu?"],"answer":2,"explanation":"自我介绍用第一人称 chamo-me；chama-me 可表示“他/她叫我”，eu 不能代替宾语代词 me。"}],"writingChecklist":["介绍自己时检查 sou，而不是 é。","nome 前的冠词和物主词是否为 o meu？","告别语是否符合下一次见面的时间？"],"speakingFollowups":["如果对方是老师，你会怎样改变称呼？","你如何把同伴介绍给刚认识的人？","如果明天不再见面，你会用什么告别语？"]}},{"id":"pt-02","number":2,"title":"听不清时的礼貌求助","level":"A1","stage":"beginner","goal":"能请对方放慢、重复或写下词语。","grammar":{"title":"礼貌请求与否定","explanation":"Pode + 动词原形构成礼貌请求。não 放在变位动词前表示否定。欧洲葡语的词尾元音常较弱，初学时可主动要求书面提示。","examples":[{"text":"Pode repetir, por favor?","zh":"请您重复一下好吗？"},{"text":"Não percebi a última palavra.","zh":"我没听明白最后一个词。"}]},"vocab":[{"head":"desculpe","zh":"劳驾；对不起","example":"Desculpe, não percebi.","exampleZh":"不好意思，我没听明白。","icon":"talk"},{"head":"repetir","zh":"重复","example":"Pode repetir?","exampleZh":"您能重复一下吗？","icon":"talk"},{"head":"devagar","zh":"慢慢地","example":"Fale mais devagar, por favor.","exampleZh":"请说慢一点。","icon":"talk"},{"head":"perceber","zh":"听懂；理解","example":"Não consigo perceber esta palavra.","exampleZh":"我听不懂这个词。","icon":"idea"},{"head":"escrever","zh":"写","example":"Pode escrever o nome?","exampleZh":"您能写下名字吗？","icon":"study"},{"head":"palavra","zh":"词","example":"Esta palavra é nova.","exampleZh":"这个词是新的。","icon":"study"},{"head":"letra","zh":"字母","example":"Qual é a primeira letra?","exampleZh":"第一个字母是什么？","icon":"study"},{"head":"som","zh":"声音","example":"Este som é difícil para mim.","exampleZh":"这个音对我来说很难。","icon":"study"},{"head":"por favor","zh":"请","example":"Uma informação, por favor.","exampleZh":"请提供一条信息。","icon":"talk"},{"head":"como","zh":"如何；怎么","example":"Como se diz isto?","exampleZh":"这个怎么说？","icon":"talk"}],"lessons":[{"id":"pt-02-1","text":"Pode repetir, por favor?","zh":"请您重复一下好吗？","tip":"pode 后用原形 repetir。"},{"id":"pt-02-2","text":"Não percebi a última palavra.","zh":"我没听明白最后一个词。","tip":"percebi 表示刚才理解了；加 não 否定。"},{"id":"pt-02-3","text":"Desculpe, como se escreve o seu nome?","zh":"不好意思，您的名字怎么拼写？","tip":"seu 可用于礼貌地指对方。"},{"id":"pt-02-4","text":"Escreve-se Sara, com esse.","zh":"写作 Sara，用字母 s。","tip":"esse 是字母 s 的名称。"},{"id":"pt-02-5","text":"Pode falar mais devagar?","zh":"您能说慢一点吗？","tip":"mais devagar 意为更慢一些。"},{"id":"pt-02-6","text":"Claro. Vou repetir o nome.","zh":"当然。我会把名字再说一遍。","tip":"vou + 原形可表达即将做的事。"}],"dialogue":[{"speaker":"甲","text":"Desculpe, como se escreve o seu nome?","zh":"不好意思，您的名字怎么拼写？"},{"speaker":"乙","text":"Escreve-se Sara, com esse.","zh":"写作 Sara，用字母 s。"},{"speaker":"甲","text":"Pode falar mais devagar?","zh":"您能说慢一点吗？"},{"speaker":"乙","text":"Claro. Vou repetir o nome.","zh":"当然。我会把名字再说一遍。"}],"reading":{"title":"在接待处","text":"O Chen está na receção de uma escola. A funcionária diz o nome da professora, mas ele não percebe a última palavra. Pede para ela falar mais devagar. A funcionária repete o nome e escreve-o num papel. O Chen lê o papel e pergunta como se diz uma letra. Depois agradece. Em casa, ouve uma gravação curta e repete as palavras sem tentar falar muito depressa.","zh":"陈在一所学校的接待处。工作人员说出老师的名字，但他没听懂最后一个词。他请她说慢一点。工作人员重复名字，并把它写在一张纸上。陈看了纸条，问一个字母怎么读。然后他道谢。回家后，他听一段简短录音，重复词语，不急着说得很快。"},"assessment":{"reading":{"title":"确认街道名称","text":"A Mei procura uma loja numa rua desconhecida. Pergunta o caminho a um senhor, mas o nome da rua é novo para ela. A Mei pede para ele repetir mais devagar. O senhor escreve «Rua da Escola» num papel e aponta para a direita. Ela lê o nome e agradece. Antes de continuar, compara o papel com o mapa do telemóvel. A loja fica perto de uma escola."},"questions":[{"prompt":"梅不熟悉什么？","options":["商店营业时间","街道名称","手机品牌"],"answer":1,"explanation":"文中说 o nome da rua é novo para ela。"},{"prompt":"那位先生把什么写在纸上？","options":["姓名","电话号码","Rua da Escola"],"answer":2,"explanation":"纸上写的是 Rua da Escola。"},{"prompt":"他指向哪个方向？","options":["右边","左边","后面"],"answer":0,"explanation":"aponta para a direita 表示指向右边。"},{"prompt":"梅用什么核对纸条？","options":["课本","手机地图","收据"],"answer":1,"explanation":"文中说 compara o papel com o mapa do telemóvel。"}],"writing":"写一段三句的求助信息：说明没听懂，请求慢说并请对方写下名称。","speaking":"模拟询问陌生词语的拼写，并重复确认你听到的内容。"},"story":{"id":"pt-02","npc":"Inês","place":"街角咨询处","scene":"对方说得太快。用礼貌的方式让交流慢下来，不必假装听懂。","text":"Podemos falar mais devagar. Qual é a sua dúvida?","zh":"我们可以慢一点说。您有什么疑问？","icon":"talk"},"support":{"id":"pt-02","pronunciation":{"focus":"词尾与辅音群的听辨","explanation":"欧洲葡语的非重读 e 常弱化，重复请求时先抓 repetir 的重读音节 tir。escrever 的开头不要机械增加一个清晰的汉语音节。","examples":[{"text":"Pode repetir?","zh":"能重复一下吗？"},{"text":"Pode escrever?","zh":"能写下来吗？"}]},"grammarNotes":["Pode 后接动词原形：pode repetir，不再把第二个动词变位成 repete。","não 放在变位动词前；Não percebi 表示刚才没有听懂，Não percebo 可说明现在仍不理解。","Como se escreve…? 中疑问词引出代词前置；独立肯定回答用 Escreve-se…。"],"cultureNote":"在葡萄牙办事或购物时，用 Desculpe 开始求助，再明确说出希望对方重复、慢说还是写下来，通常比只说 Não percebo 更容易得到针对性帮助。","vocabularyNotes":[{"head":"repetir","note":"repetir 可接要重复的内容：repetir a pergunta；不要在可以直接接宾语时加 de。"},{"head":"devagar","note":"devagar 是副词，不随人物性别变化；mais devagar 表示更慢。"},{"head":"palavra","note":"palavra 是阴性：a última palavra；letra 指字母，二者不要混同。"}],"transfer":[{"id":"pt-02-transfer-1","prompt":"电话中请对方重复问题","text":"Pode repetir a pergunta, por favor?","zh":"请您重复一下问题好吗？","explanation":"请求明确宾语 a pergunta；pode 后保持原形。"},{"id":"pt-02-transfer-2","prompt":"说明没听到号码","text":"Não percebi o número de telefone.","zh":"我没听明白电话号码。","explanation":"não 紧靠 percebi 之前；o número 是阳性单数。"},{"id":"pt-02-transfer-3","prompt":"询问街名拼写","text":"Como se escreve o nome desta rua?","zh":"这条街的名字怎么拼写？","explanation":"desta 是 de+esta；se 在疑问词 como 后置于动词前。"},{"id":"pt-02-transfer-4","prompt":"解释一个词的首字母","text":"Escreve-se «casa», com cê.","zh":"写作 casa，用字母 c。","explanation":"肯定句用 escreve-se；cê 是字母 c 的名称。"},{"id":"pt-02-transfer-5","prompt":"录音前请求逐个念数字","text":"Pode dizer os números um a um?","zh":"您能把数字逐个说出来吗？","explanation":"dizer 为原形；um a um 是“逐个”的固定表达。"},{"id":"pt-02-transfer-6","prompt":"答应并说明会写下地址","text":"Claro, vou escrever a morada num papel.","zh":"当然，我会把地址写在纸上。","explanation":"vou+原形表达接下来要做的事；num=em+um。"}],"grammarCheck":[{"prompt":"选择表达“请您重复一下好吗？”且语法、用法正确的一项。","options":["Pode repete, por favor?","Pode repetir, por favor?","Pode repetiu, por favor?"],"answer":1,"explanation":"pode 是已变位的情态动词，后接原形 repetir；repete 和 repetiu 都不能放在此处。"},{"prompt":"选择表达“我没听明白最后一个词。”且语法、用法正确的一项。","options":["Percebi não a última palavra.","Não perceber a última palavra.","Não percebi a última palavra."],"answer":2,"explanation":"否定词在变位动词前；独立陈述过去事实要用 percebi，不能直接用原形 perceber。"},{"prompt":"选择表达“不好意思，您的名字怎么拼写？”且语法、用法正确的一项。","options":["Desculpe, como se escreve o seu nome?","Desculpe, como escreve-se o seu nome?","Desculpe, como se escrever o seu nome?"],"answer":0,"explanation":"como 引导问句，代词 se 在变位动词前；escrever 是原形，这里需要 escreve。"}],"writingChecklist":["pode 后是否仍为动词原形？","否定词是否在变位动词前？","已明确说出需要重复的内容还是拼写对象吗？"],"speakingFollowups":["如果只没听懂最后一个数字，你如何说明？","如果对方写下的字母仍不清楚，你会怎么问？","你如何确认自己记下的街道名称？"]}},{"id":"pt-03","number":3,"title":"个人资料与联系方式","level":"A1","stage":"beginner","goal":"能提供国籍、居住地和联系方式。","grammar":{"title":"ser、morar 和 ter","explanation":"ser 说明身份，morar em 说明居住地点，ter 可表达年龄。em 与定冠词合成 no、na，例如 no Porto。","examples":[{"text":"Sou chinesa e moro em Lisboa.","zh":"我是中国人，住在里斯本。"},{"text":"Tenho vinte e oito anos.","zh":"我二十八岁。"}]},"vocab":[{"head":"nacionalidade","zh":"国籍","example":"Qual é a sua nacionalidade?","exampleZh":"您的国籍是什么？","icon":"person"},{"head":"chinês / chinesa","zh":"中国人；中国的","example":"Sou chinesa.","exampleZh":"我是中国人。","icon":"person"},{"head":"morar","zh":"居住","example":"Moro em Lisboa.","exampleZh":"我住在里斯本。","icon":"home"},{"head":"idade","zh":"年龄","example":"Qual é a sua idade?","exampleZh":"您的年龄是多少？","icon":"person"},{"head":"anos","zh":"岁；年","example":"Tenho vinte anos.","exampleZh":"我二十岁。","icon":"time"},{"head":"morada","zh":"住址","example":"Esta é a minha morada.","exampleZh":"这是我的住址。","icon":"home"},{"head":"telemóvel","zh":"手机","example":"O meu telemóvel está aqui.","exampleZh":"我的手机在这里。","icon":"talk"},{"head":"correio eletrónico","zh":"电子邮件","example":"Qual é o seu correio eletrónico?","exampleZh":"您的电子邮箱是什么？","icon":"talk"},{"head":"apelido","zh":"姓氏","example":"O meu apelido é Wang.","exampleZh":"我姓王。","icon":"person"},{"head":"país","zh":"国家","example":"De que país é?","exampleZh":"您来自哪个国家？","icon":"travel"}],"lessons":[{"id":"pt-03-1","text":"Sou chinesa e moro em Lisboa.","zh":"我是中国人，住在里斯本。","tip":"女性可用 chinesa，男性可用 chinês。"},{"id":"pt-03-2","text":"Tenho vinte e oito anos.","zh":"我二十八岁。","tip":"年龄用 ter，不用 ser。"},{"id":"pt-03-3","text":"Qual é o seu apelido?","zh":"您的姓是什么？","tip":"葡萄牙语的 apelido 指姓氏。"},{"id":"pt-03-4","text":"O meu apelido é Wang.","zh":"我姓王。","tip":"回答可以保留自己的姓名顺序并解释。"},{"id":"pt-03-5","text":"E qual é a sua morada?","zh":"那您的住址是什么？","tip":"morada 表示通讯或居住地址。"},{"id":"pt-03-6","text":"Moro na Rua Nova, no número dez.","zh":"我住在新街十号。","tip":"na = em + a；no = em + o。"}],"dialogue":[{"speaker":"甲","text":"Qual é o seu apelido?","zh":"您的姓是什么？"},{"speaker":"乙","text":"O meu apelido é Wang.","zh":"我姓王。"},{"speaker":"甲","text":"E qual é a sua morada?","zh":"那您的住址是什么？"},{"speaker":"乙","text":"Moro na Rua Nova, no número dez.","zh":"我住在新街十号。"}],"reading":{"title":"填写报名资料","text":"A Wang vai a um curso de português no Porto. Na ficha escreve o nome completo, a nacionalidade e a morada. Tem vinte e oito anos e mora com uma amiga numa rua perto da escola. A professora pede também um contacto para enviar informações sobre as aulas. A Wang prefere dar o correio eletrónico. Antes de entregar a ficha, confirma todas as letras do apelido e verifica o endereço.","zh":"王去波尔图参加葡语课程。她在表格上填写全名、国籍和住址。她二十八岁，与一位朋友住在学校附近的一条街上。老师还要一个联系方式，以便发送课程信息。王更愿意提供电子邮箱。交表前，她确认姓氏的所有字母，并检查地址。"},"assessment":{"reading":{"title":"新同学的资料","text":"O Liu inscreve-se num curso de desenho em Braga. Tem trinta anos e é chinês. Na ficha escreve o nome e a morada da casa onde vive com o irmão. Para receber os horários, deixa o endereço de correio eletrónico. Não escreve o número de telemóvel porque prefere mensagens por email. A funcionária pede-lhe que confirme o apelido. O Liu verifica a ficha e entrega-a no balcão."},"questions":[{"prompt":"刘报名学习什么？","options":["葡语","音乐","绘画"],"answer":2,"explanation":"curso de desenho 指绘画课程。"},{"prompt":"刘与谁同住？","options":["兄弟","老师","同事"],"answer":0,"explanation":"vive com o irmão 表示与兄弟同住。"},{"prompt":"他希望如何收到课表？","options":["电话","电子邮件","纸质信件"],"answer":1,"explanation":"他留下邮箱以接收 horários。"},{"prompt":"工作人员请他确认什么？","options":["年龄","房租","姓氏"],"answer":2,"explanation":"文中为 confirme o apelido。"}],"writing":"用虚构资料填写六行信息：姓名、国籍、年龄、城市、住址和邮箱。","speaking":"用五句话介绍自己，再询问对方的居住城市与联系方式。"},"story":{"id":"pt-03","npc":"Rui","place":"社区登记桌","scene":"工作人员需要了解你的基本情况。只练习虚构资料，不填写真实联系方式。","text":"Como se chama e de onde vem?","zh":"您叫什么名字，来自哪里？","icon":"person"},"support":{"id":"pt-03","pronunciation":{"focus":"鼻化与重音符号","explanation":"chinês 的 ê 标出重读闭口元音；chinesa 的重音在 ne，不能机械保留 chinês 的词尾音。telemóvel 的重音在 mó。","examples":[{"text":"Sou chinês.","zh":"我是中国人（男性）。"},{"text":"Sou chinesa.","zh":"我是中国人（女性）。"}]},"grammarNotes":["年龄用 ter：Tenho…anos，不能照搬汉语写 Sou…anos。","morar 后用 em；Lisboa 通常不带冠词，说 em Lisboa；Porto 常带 o，因此用 no Porto。","国籍形容词随所指人物性别变化：chinês/chinesa；物主词随被拥有的名词变化：a minha morada。"],"cultureNote":"在葡萄牙表格中，apelido 通常指姓氏，nome próprio 指名；填写时应按实际字段分开核对，不要假设所有表格都采用同一种中葡姓名顺序。","vocabularyNotes":[{"head":"nacionalidade","note":"nacionalidade 是阴性：a nacionalidade；回答可用 Sou chinês/chinesa。"},{"head":"morada","note":"morada 指住址，不是抽象的居住行为；我的住址用 a minha morada。"},{"head":"apelido","note":"apelido 是姓氏；葡萄牙语语境中不要直接理解为英语 nickname。"}],"transfer":[{"id":"pt-03-transfer-1","prompt":"说自己来自中国但目前住波尔图","text":"Sou da China, mas agora moro no Porto.","zh":"我来自中国，不过现在住在波尔图。","explanation":"da=de+a，no=em+o；mas 连接转折。"},{"id":"pt-03-transfer-2","prompt":"说明自己今年三十岁","text":"Este ano tenho trinta anos.","zh":"我今年三十岁。","explanation":"年龄使用 tenho；este ano 是时间状语。"},{"id":"pt-03-transfer-3","prompt":"登记时询问对方的邮箱","text":"Qual é o seu endereço de correio eletrónico?","zh":"您的电子邮箱地址是什么？","explanation":"核心名词 endereço 是阳性，故用 o seu。"},{"id":"pt-03-transfer-4","prompt":"区分自己的名和姓","text":"Li é o meu apelido e Mei é o meu nome próprio.","zh":"李是我的姓，梅是我的名。","explanation":"两个单数主语分别用 é，避免名姓信息颠倒。"},{"id":"pt-03-transfer-5","prompt":"说明搬家后住址变更","text":"Esta é a minha nova morada.","zh":"这是我的新住址。","explanation":"esta、a minha、nova 都按阴性 morada 配合。"},{"id":"pt-03-transfer-6","prompt":"给出具体居住地点","text":"Moro no segundo andar de um prédio perto da estação.","zh":"我住在车站附近一栋楼的二层。","explanation":"no segundo andar 表示楼层；perto de 连接地点。"}],"grammarCheck":[{"prompt":"选择表达“我是中国人，住在里斯本。”且语法、用法正确的一项。","options":["Sou chinesa e moro a Lisboa.","Sou chinêsas e moro em Lisboa.","Sou chinesa e moro em Lisboa."],"answer":2,"explanation":"morar 的地点用 em；女性单数为 chinesa，不能把单复数和重音形式拼合。"},{"prompt":"选择表达“我二十八岁。”且语法、用法正确的一项。","options":["Tenho vinte e oito anos.","Sou vinte e oito anos.","Tenho vinte e oito ano."],"answer":0,"explanation":"年龄用 ter；二十八岁后面 anos 必须复数，不能用 ser。"},{"prompt":"选择表达“您的姓是什么？”且语法、用法正确的一项。","options":["Qual é a sua apelido?","Qual é o seu apelido?","Qual são o seu apelido?"],"answer":1,"explanation":"apelido 是阳性单数，用 o seu 和 é；qual são 的单复数也不一致。"}],"writingChecklist":["年龄句是否使用 ter 和复数 anos？","morar 后的地点介词和冠词是否正确？","名与姓、邮箱与住址是否分别写清楚？"],"speakingFollowups":["你怎样说明现在的住处与出生地不同？","对方把你的名和姓写反了，你会怎样更正？","你愿意提供哪一种联系方式？"]}},{"id":"pt-04","number":4,"title":"数字、日期与时间","level":"A1","stage":"beginner","goal":"能听懂简单价格、预约日期和钟点。","grammar":{"title":"钟点表达与疑问词","explanation":"问时间用 Que horas são?；一点用 É uma hora，其余通常用 São。活动发生在某时用 à / às，例如 às duas。","examples":[{"text":"São nove horas e dez minutos.","zh":"现在是九点十分。"},{"text":"A aula começa à uma da tarde.","zh":"课在下午一点开始。"}]},"vocab":[{"head":"hora","zh":"小时；钟点","example":"A que hora começa?","exampleZh":"几点开始？","icon":"time"},{"head":"hoje","zh":"今天","example":"Hoje tenho uma aula.","exampleZh":"今天我有一节课。","icon":"time"},{"head":"amanhã","zh":"明天","example":"Amanhã é sábado.","exampleZh":"明天是星期六。","icon":"time"},{"head":"segunda-feira","zh":"星期一","example":"A aula é na segunda-feira.","exampleZh":"课在星期一。","icon":"time"},{"head":"manhã","zh":"上午","example":"Trabalho de manhã.","exampleZh":"我上午工作。","icon":"time"},{"head":"tarde","zh":"下午","example":"Estudo à tarde.","exampleZh":"我下午学习。","icon":"time"},{"head":"minuto","zh":"分钟","example":"Espere um minuto.","exampleZh":"请等一分钟。","icon":"time"},{"head":"meia","zh":"半点","example":"São duas e meia.","exampleZh":"现在两点半。","icon":"time"},{"head":"quanto","zh":"多少","example":"Quanto custa o bilhete?","exampleZh":"票多少钱？","icon":"money"},{"head":"data","zh":"日期","example":"Qual é a data da visita?","exampleZh":"参观日期是哪天？","icon":"time"}],"lessons":[{"id":"pt-04-1","text":"São nove horas e dez minutos.","zh":"现在是九点十分。","tip":"复数钟点使用 são。"},{"id":"pt-04-2","text":"A aula começa à uma da tarde.","zh":"课在下午一点开始。","tip":"à uma 表示在一点。"},{"id":"pt-04-3","text":"A visita é amanhã?","zh":"参观是在明天吗？","tip":"语调可将陈述句变为问句。"},{"id":"pt-04-4","text":"Sim, às dez e meia.","zh":"是的，十点半。","tip":"meia 在这里省略了 hora。"},{"id":"pt-04-5","text":"Quanto custa o bilhete?","zh":"票多少钱？","tip":"quanto custa 用来问单件物品的价格。"},{"id":"pt-04-6","text":"Custa oito euros.","zh":"八欧元。","tip":"欧元复数为 euros。"}],"dialogue":[{"speaker":"甲","text":"A visita é amanhã?","zh":"参观是在明天吗？"},{"speaker":"乙","text":"Sim, às dez e meia.","zh":"是的，十点半。"},{"speaker":"甲","text":"Quanto custa o bilhete?","zh":"票多少钱？"},{"speaker":"乙","text":"Custa oito euros.","zh":"八欧元。"}],"reading":{"title":"周六的安排","text":"É sexta-feira e a Li organiza o dia seguinte. De manhã quer visitar um museu com o Rui. A visita começa às dez e meia e o bilhete custa oito euros. Combinam encontrar-se à porta às dez e vinte. Depois do almoço, a Li tem uma aula às três da tarde. Escreve as horas no caderno para não se esquecer e prepara o dinheiro para o bilhete do museu.","zh":"星期五，小李在安排第二天的活动。上午她想和鲁伊参观博物馆。参观十点半开始，门票八欧元。他们约好十点二十分在门口见面。午饭后，小李下午三点有课。她把时间写在笔记本上，以免忘记，并准备好买博物馆门票的钱。"},"assessment":{"reading":{"title":"周日的音乐活动","text":"No domingo, o Chen quer ouvir música num jardim. O concerto começa às quatro da tarde e termina às cinco e meia. A entrada custa seis euros. Ele combina encontrar-se com a Marta às três e quarenta, junto ao café do jardim. De manhã fica em casa a estudar. Antes de sair, consulta a hora no telemóvel e leva uma garrafa de água. Não precisa de levar uma cadeira."},"questions":[{"prompt":"音乐会几点开始？","options":["下午四点","下午三点四十分","下午五点半"],"answer":0,"explanation":"开始时间为 às quatro da tarde。"},{"prompt":"门票多少钱？","options":["八欧元","六欧元","十欧元"],"answer":1,"explanation":"entrada custa seis euros。"},{"prompt":"他们在哪里见面？","options":["车站门口","陈家里","花园咖啡馆旁"],"answer":2,"explanation":"junto ao café do jardim 指花园咖啡馆旁。"},{"prompt":"陈上午做什么？","options":["在家学习","买椅子","听音乐会"],"answer":0,"explanation":"De manhã fica em casa a estudar。"}],"writing":"写明天的三项安排，每项包括时间；再写一个虚构票价。","speaking":"询问一场活动的日期、开始时间、会面时间和价格。"},"story":{"id":"pt-04","npc":"Rui","place":"活动公告栏","scene":"你们要约好见面。把数字、日期和钟点说清楚，再确认一次。","text":"A que horas lhe dá jeito encontrarmo-nos?","zh":"我们几点见面对您方便？","icon":"time"},"support":{"id":"pt-04","pronunciation":{"focus":"数字中的重读元音","explanation":"hora 的 h 不发音；meia 的重音在 mei。分清 nove 与 nova 的词尾，报时间时可把小时、分钟分为两个节奏块。","examples":[{"text":"É uma hora.","zh":"一点。"},{"text":"São duas e meia.","zh":"两点半。"}]},"grammarNotes":["报一点用 É uma hora，其余复数小时通常用 São；不能所有数字都配 é。","表示在几点，用 à uma、às duas；a aula começa às… 中介词 a 与阴性冠词合并并带重音。","问价格用 Quanto custa…?；单数物品配 custa，复数配 custam，不能按中文固定用同一动词形式。"],"cultureNote":"在葡萄牙书面预约和交通时间中常见24小时制；口头说 às três 时可加 da tarde 或 da manhã 避免误会。","vocabularyNotes":[{"head":"hora","note":"hora 是阴性：uma hora、duas horas；问几点可说 Que horas são?。"},{"head":"meia","note":"meia 在钟点中指半小时：duas e meia；不是名词 meia“袜子”的用法。"},{"head":"data","note":"data 表示日期；dia 可指某一天，确认预约时可同时问 a data e a hora。"}],"transfer":[{"id":"pt-04-transfer-1","prompt":"查看时间后告诉朋友九点差一刻","text":"São nove menos um quarto.","zh":"九点差一刻。","explanation":"menos um quarto 表示离下一小时还差十五分钟。"},{"id":"pt-04-transfer-2","prompt":"告知午餐一点半开始","text":"O almoço começa à uma e meia.","zh":"午餐一点半开始。","explanation":"一点的介词形式为 à uma，不能写 às uma。"},{"id":"pt-04-transfer-3","prompt":"核实参观是否在下周一","text":"A visita é na próxima segunda-feira?","zh":"参观是在下周一吗？","explanation":"na próxima segunda-feira 明确哪一个星期一。"},{"id":"pt-04-transfer-4","prompt":"确认早上十点四十五碰面","text":"Sim, encontramo-nos às dez e quarenta e cinco da manhã.","zh":"是的，我们上午十点四十五见面。","explanation":"às 引出具体时刻；da manhã 排除夜间含义。"},{"id":"pt-04-transfer-5","prompt":"询问两张票总价","text":"Quanto custam dois bilhetes?","zh":"两张票多少钱？","explanation":"主语 dois bilhetes 为复数，动词用 custam。"},{"id":"pt-04-transfer-6","prompt":"说明每张票与合计价格","text":"Cada bilhete custa seis euros; os dois custam doze.","zh":"每张票六欧元，两张共十二欧元。","explanation":"cada bilhete 为单数；os dois 为复数，分别用 custa/custam。"}],"grammarCheck":[{"prompt":"选择表达“现在是九点十分。”且语法、用法正确的一项。","options":["São nove horas e dez minutos.","É nove horas e dez minutos.","São nove hora e dez minuto."],"answer":0,"explanation":"九点的小时为复数，系词用 são，hora 和 minuto 也需要复数形式。"},{"prompt":"选择表达“课在下午一点开始。”且语法、用法正确的一项。","options":["A aula começa às uma da tarde.","A aula começa à uma da tarde.","A aula começa a uma da tarde."],"answer":1,"explanation":"一点用 à uma；不能用复数冠词 às，也不能漏掉 a+a 合并产生的重音。"},{"prompt":"选择表达“参观是在明天吗？”且语法、用法正确的一项。","options":["A visita são amanhã?","A visita é amanhãs?","A visita é amanhã?"],"answer":2,"explanation":"a visita 为单数，配 é；amanhã 作为“明天”的副词不随主语变复数。"}],"writingChecklist":["一点与其他钟点的 é/são 是否区分？","在几点的 à/às 是否带重音？","价格句的物品数与 custa/custam 是否一致？"],"speakingFollowups":["你怎样把15:45改用口头时间表达？","如果对方只说“三点”，你会怎样确认？","你如何询问两个人参观的总价？"]}},{"id":"pt-05","number":5,"title":"在咖啡馆点单","level":"A1","stage":"beginner","goal":"能点简单饮食并核对账单。","grammar":{"title":"querer 与礼貌点单","explanation":"Queria… 常用于较委婉的点单；Quero… 也能表达想要。数量加名词，um café、duas águas；带气或不带气可用 com gás / sem gás。","examples":[{"text":"Queria um café e uma tosta.","zh":"我想要一杯咖啡和一份烤三明治。"},{"text":"Tem água sem gás?","zh":"有不带气的水吗？"}]},"vocab":[{"head":"café","zh":"咖啡","example":"Queria um café.","exampleZh":"我想要一杯咖啡。","icon":"food"},{"head":"água","zh":"水","example":"Uma água sem gás, por favor.","exampleZh":"请给我一瓶不带气的水。","icon":"food"},{"head":"chá","zh":"茶","example":"Tem chá de limão?","exampleZh":"有柠檬茶吗？","icon":"food"},{"head":"pão","zh":"面包","example":"Queria pão com queijo.","exampleZh":"我想要夹奶酪的面包。","icon":"food"},{"head":"queijo","zh":"奶酪","example":"Este queijo é suave.","exampleZh":"这种奶酪味道温和。","icon":"food"},{"head":"tosta","zh":"烤三明治","example":"A tosta está quente.","exampleZh":"烤三明治是热的。","icon":"food"},{"head":"leite","zh":"牛奶","example":"O café leva leite?","exampleZh":"咖啡里有牛奶吗？","icon":"food"},{"head":"conta","zh":"账单","example":"A conta, por favor.","exampleZh":"请结账。","icon":"money"},{"head":"sem gás","zh":"不带气","example":"Prefiro água sem gás.","exampleZh":"我更喜欢不带气的水。","icon":"food"},{"head":"esplanada","zh":"露天座位区","example":"Há lugar na esplanada?","exampleZh":"露天座位区有位置吗？","icon":"home"}],"lessons":[{"id":"pt-05-1","text":"Queria um café e uma tosta.","zh":"我想要一杯咖啡和一份烤三明治。","tip":"queria 可让点单更委婉。"},{"id":"pt-05-2","text":"Tem água sem gás?","zh":"有不带气的水吗？","tip":"tem 可用于问店里是否供应。"},{"id":"pt-05-3","text":"Bom dia. O que deseja?","zh":"早上好。您想要什么？","tip":"des ejar 的变位 deseja 用于询问需求。"},{"id":"pt-05-4","text":"Queria um chá e pão com queijo.","zh":"我想要一杯茶和夹奶酪的面包。","tip":"com 表示搭配或含有。"},{"id":"pt-05-5","text":"É para aqui ou para levar?","zh":"在这里吃还是带走？","tip":"para levar 是外带的常见表达。"},{"id":"pt-05-6","text":"É para aqui, obrigada.","zh":"在这里吃，谢谢。","tip":"说话者为女性时通常用 obrigada。"}],"dialogue":[{"speaker":"甲","text":"Bom dia. O que deseja?","zh":"早上好。您想要什么？"},{"speaker":"乙","text":"Queria um chá e pão com queijo.","zh":"我想要一杯茶和夹奶酪的面包。"},{"speaker":"甲","text":"É para aqui ou para levar?","zh":"在这里吃还是带走？"},{"speaker":"乙","text":"É para aqui, obrigada.","zh":"在这里吃，谢谢。"}],"reading":{"title":"露台上的早餐","text":"A Mei toma o pequeno-almoço num café perto de casa. Escolhe uma mesa na esplanada e pede um chá e pão com queijo. O empregado pergunta se quer mais alguma coisa. Ela pede também uma água sem gás. Enquanto espera, lê a ementa e aprende duas palavras novas. No fim, pede a conta e confirma os três produtos. Paga e agradece antes de voltar para casa a pé.","zh":"梅在家附近的一家咖啡馆吃早餐。她选了露天座位区的一张桌子，点了一杯茶和夹奶酪的面包。服务员问她还要别的东西吗。她又要了一瓶不带气的水。等待时，她看菜单，学了两个新词。最后她要账单，核对了三样东西。她付款并道谢，然后步行回家。"},"assessment":{"reading":{"title":"外带午点","text":"O Rui entra num café depois do trabalho. Pede uma tosta e um café para levar, porque vai encontrar a irmã no parque. A empregada pergunta se ele quer uma bebida fria. O Rui escolhe uma água com gás. Quando recebe o saco, verifica que falta a tosta e avisa a empregada. Ela traz a tosta e pede desculpa. O Rui paga e segue para o parque."},"questions":[{"prompt":"鲁伊为什么选择外带？","options":["要回办公室","要去公园见姐妹","店里没有座位"],"answer":1,"explanation":"他要在公园见 irmã。"},{"prompt":"他点了哪种水？","options":["热水","不带气的水","带气的水"],"answer":2,"explanation":"文中说 água com gás。"},{"prompt":"袋子里最初少了什么？","options":["烤三明治","咖啡","水"],"answer":0,"explanation":"falta a tosta 表示缺少烤三明治。"},{"prompt":"服务员随后怎么做？","options":["让他重新点单","补上食物并道歉","关店"],"answer":1,"explanation":"她拿来 tosta 并 pede desculpa。"}],"writing":"写一份三样物品的点单，并注明堂食或外带。","speaking":"模拟点一杯饮品和一份食物，询问是否含奶，最后要账单。"},"story":{"id":"pt-05","npc":"Ana","place":"街角咖啡馆","scene":"咖啡香从柜台飘来。轮到你点单了，先说需求，再核对价格。","text":"Bom dia! O que deseja tomar?","zh":"早上好！您想喝点什么？","icon":"food"},"support":{"id":"pt-05","pronunciation":{"focus":"café 与 pão 的发音","explanation":"café 的 é 是重读开口元音；pão 的 ão 为鼻化双元音，不读成两个分离的汉语音节。","examples":[{"text":"Um café, por favor.","zh":"请来一杯咖啡。"},{"text":"Pão com queijo.","zh":"奶酪面包。"}]},"grammarNotes":["Queria 可作为缓和请求的表达，不必理解为只在叙述过去；后面可直接接点单名词。","表示“加什么”用 com，表示“不要什么”用 sem；sem açúcar 不需要另加 não。","água 虽以重读 a 开头，仍是阴性，使用 uma água；不能依据开头音猜冠词。"],"cultureNote":"在葡萄牙咖啡馆，um café 通常可指一小杯浓缩咖啡；想要不同容量或加奶时宜明确说明。结账可用 A conta, por favor。","vocabularyNotes":[{"head":"café","note":"café 既指咖啡也可指咖啡馆；点一杯常说 um café。"},{"head":"água","note":"água 为阴性：uma água；com gás 与 sem gás 分别指含气和无气。"},{"head":"conta","note":"conta 在餐饮中指账单；pedir a conta 是“要账单”的常见搭配。"}],"transfer":[{"id":"pt-05-transfer-1","prompt":"早餐点两杯咖啡和一份面包","text":"Queria dois cafés e uma porção de pão.","zh":"我想要两杯咖啡和一份面包。","explanation":"cafés 复数保留重音；uma porção 可量化不可数的 pão。"},{"id":"pt-05-transfer-2","prompt":"询问有没有无乳糖牛奶","text":"Tem leite sem lactose?","zh":"有无乳糖牛奶吗？","explanation":"sem 后接名词 lactose，说明排除的成分。"},{"id":"pt-05-transfer-3","prompt":"招呼两位顾客并询问需求","text":"Bom dia. O que desejam?","zh":"早上好。两位想要什么？","explanation":"对多人说话使用第三人称复数 desejam。"},{"id":"pt-05-transfer-4","prompt":"点不加糖的茶并加一杯水","text":"Queria um chá sem açúcar e um copo de água.","zh":"我想要一杯无糖茶和一杯水。","explanation":"um copo de água 用量词结构；sem açúcar 不加冠词。"},{"id":"pt-05-transfer-5","prompt":"确认是否带走两份吐司","text":"As duas tostas são para levar?","zh":"两份吐司是要带走吗？","explanation":"复数主语 as duas tostas 搭配 são。"},{"id":"pt-05-transfer-6","prompt":"说明堂食并询问能否坐露台","text":"É para aqui. Podemos sentar-nos na esplanada?","zh":"在这里吃。我们可以坐在露台吗？","explanation":"podemos 后接原形 sentar；na=em+a。"}],"grammarCheck":[{"prompt":"选择表达“我想要一杯咖啡和一份烤三明治。”且语法、用法正确的一项。","options":["Queria uma café e um tosta.","Queria um café e uma tosta.","Queria um cafés e uma tostas."],"answer":1,"explanation":"café 阳性、tosta 阴性；单数冠词后这里的名词也应保持单数。"},{"prompt":"选择表达“有不带气的水吗？”且语法、用法正确的一项。","options":["Tem água não gás?","Tem água sem com gás?","Tem água sem gás?"],"answer":2,"explanation":"无气用介词短语 sem gás，不能以 não 替代 sem，也不能并列 sem com。"},{"prompt":"选择表达“早上好。您想要什么？”且语法、用法正确的一项。","options":["Bom dia. O que deseja?","Bom dia. O que desejar?","Bom dia. O que desejas o senhor?"],"answer":0,"explanation":"礼貌询问用第三人称 deseja；desejar 是原形，desejas 是 tu 的形式，不与 o senhor 搭配。"}],"writingChecklist":["数量、冠词、饮品或食品名词是否一致？","去掉某种配料时是否用 sem？","已明确堂食或带走吗？"],"speakingFollowups":["对方问要不要加糖，你会怎样回应？","如果没有你想点的饮料，你会换什么？","你如何请求分开结账？"]}},{"id":"pt-06","number":6,"title":"超市购物","level":"A1","stage":"beginner","goal":"能找商品、问数量和确认付款方式。","grammar":{"title":"数量表达与指示词","explanation":"um quilo de… 表示一公斤；este/esta 指较近的单数事物，estes/estas 为复数。名词与形容词通常保持性数一致。","examples":[{"text":"Queria um quilo de maçãs.","zh":"我想要一公斤苹果。"},{"text":"Estas maçãs são portuguesas.","zh":"这些苹果是葡萄牙产的。"}]},"vocab":[{"head":"supermercado","zh":"超市","example":"Vou ao supermercado.","exampleZh":"我要去超市。","icon":"food"},{"head":"fruta","zh":"水果","example":"A fruta fica ali.","exampleZh":"水果在那边。","icon":"food"},{"head":"maçã","zh":"苹果","example":"Queria duas maçãs.","exampleZh":"我想要两个苹果。","icon":"food"},{"head":"arroz","zh":"大米","example":"Este arroz é barato.","exampleZh":"这种大米便宜。","icon":"food"},{"head":"quilo","zh":"公斤","example":"Quero um quilo de batatas.","exampleZh":"我要一公斤土豆。","icon":"food"},{"head":"saco","zh":"袋子","example":"Preciso de um saco.","exampleZh":"我需要一个袋子。","icon":"home"},{"head":"caixa","zh":"收银台；箱子","example":"A caixa está aberta.","exampleZh":"收银台开放着。","icon":"money"},{"head":"cartão","zh":"卡","example":"Posso pagar com cartão?","exampleZh":"我能用卡付款吗？","icon":"money"},{"head":"dinheiro","zh":"现金；钱","example":"Vou pagar em dinheiro.","exampleZh":"我要用现金付款。","icon":"money"},{"head":"talão","zh":"小票","example":"Pode dar-me o talão?","exampleZh":"能给我小票吗？","icon":"money"}],"lessons":[{"id":"pt-06-1","text":"Queria um quilo de maçãs.","zh":"我想要一公斤苹果。","tip":"重量后接 de 加商品名。"},{"id":"pt-06-2","text":"Estas maçãs são portuguesas.","zh":"这些苹果是葡萄牙产的。","tip":"estas、maçãs、portuguesas 都为阴性复数。"},{"id":"pt-06-3","text":"Desculpe, onde está o arroz?","zh":"劳驾，大米在哪里？","tip":"onde está 用于寻找位置。"},{"id":"pt-06-4","text":"Está ao lado da massa.","zh":"在意大利面旁边。","tip":"ao lado de 表示在旁边。"},{"id":"pt-06-5","text":"Posso pagar com cartão?","zh":"我可以用卡付款吗？","tip":"posso + 原形询问能否做某事。"},{"id":"pt-06-6","text":"Sim. Quer um saco?","zh":"可以。您要袋子吗？","tip":"购物时可直接用 quer 询问需求。"}],"dialogue":[{"speaker":"甲","text":"Desculpe, onde está o arroz?","zh":"劳驾，大米在哪里？"},{"speaker":"乙","text":"Está ao lado da massa.","zh":"在意大利面旁边。"},{"speaker":"甲","text":"Posso pagar com cartão?","zh":"我可以用卡付款吗？"},{"speaker":"乙","text":"Sim. Quer um saco?","zh":"可以。您要袋子吗？"}],"reading":{"title":"带着清单购物","text":"A Li leva uma lista para o supermercado: arroz, leite, maçãs e pão. Primeiro procura a fruta e escolhe um quilo de maçãs portuguesas. Não encontra o arroz e pede ajuda a uma funcionária. Depois vai à caixa com os quatro produtos. Traz um saco de casa e paga com cartão. Guarda o talão na carteira para poder conferir a compra quando chegar a casa depois das aulas.","zh":"小李带着清单去超市：大米、牛奶、苹果和面包。她先找到水果，选了一公斤葡萄牙产苹果。她没找到大米，向一位工作人员求助。然后她带着四样商品去收银台。她自己带了袋子，用卡付款。她把小票放进钱包，准备上完课到家后核对购物情况。"},"assessment":{"reading":{"title":"一次晚间购物","text":"A Sara vai ao supermercado à noite. Quer comprar batatas, queijo e água. As batatas estão perto dos legumes, mas ela não encontra o queijo. Um funcionário mostra-lhe a zona dos produtos frescos. Na caixa, a Sara pede um saco porque deixou o seu em casa. Paga em dinheiro e guarda o talão. Ao sair, confirma que comprou os três produtos da lista e telefona ao irmão."},"questions":[{"prompt":"萨拉找不到哪样商品？","options":["土豆","水","奶酪"],"answer":2,"explanation":"文中为 não encontra o queijo。"},{"prompt":"奶酪位于哪个区域？","options":["生鲜区","收银台旁","面包区"],"answer":0,"explanation":"工作人员指给她 zona dos produtos frescos。"},{"prompt":"她为什么要袋子？","options":["买了太多水果","自己的袋子忘在家","袋子坏了"],"answer":1,"explanation":"deixou o seu em casa 表示忘在家里。"},{"prompt":"她如何付款？","options":["银行卡","手机","现金"],"answer":2,"explanation":"Paga em dinheiro。"}],"writing":"写一份五样商品的清单，其中两样带数量，再写两句结账用语。","speaking":"向店员询问商品位置，购买一定重量的水果，并询问能否刷卡。"},"story":{"id":"pt-06","npc":"Ana","place":"社区超市","scene":"你在货架间寻找晚餐材料。遇到不确定的数量或价格，就开口问。","text":"Está à procura de algum produto?","zh":"您在找什么商品吗？","icon":"food"},"support":{"id":"pt-06","pronunciation":{"focus":"鼻元音与词尾复数","explanation":"maçã 的最后元音带鼻化；maçãs 的鼻化仍保留。caixa 的 x 在这个词中读类似 sh 的音，不按字母名称念。","examples":[{"text":"Uma maçã.","zh":"一个苹果。"},{"text":"Duas maçãs.","zh":"两个苹果。"}]},"grammarNotes":["重量用 um quilo de…；de 后的食物可用复数 maçãs，不要漏掉 de。","estas 与阴性复数 maçãs 配合；este/esta/estes/estas 按所指名词性数变化。","位置固定说 ao lado de；后接 a massa 时合并为 ao lado da massa，不是 ao lado a massa。"],"cultureNote":"在葡萄牙超市付款时可主动说 Queria o talão, por favor 请求购物小票；是否自取购物袋及其价格应看现场说明或向工作人员确认。","vocabularyNotes":[{"head":"maçã","note":"maçã 阴性，复数 maçãs；注意保留 ç 和鼻化符号。"},{"head":"quilo","note":"quilo 是阳性量词：meio quilo de arroz；de 连接被称量的商品。"},{"head":"talão","note":"talão 是阳性：o talão；guardar o talão 表示保留小票。"}],"transfer":[{"id":"pt-06-transfer-1","prompt":"在水果柜台买半公斤梨","text":"Queria meio quilo de peras.","zh":"我想要半公斤梨。","explanation":"meio 修饰阳性 quilo；量词后用 de。"},{"id":"pt-06-transfer-2","prompt":"比较两组苹果的价格","text":"Estas maçãs são mais baratas do que aquelas.","zh":"这些苹果比那些便宜。","explanation":"estas/aquelas 均指阴性复数；baratas 也保持一致。"},{"id":"pt-06-transfer-3","prompt":"寻找不含盐的大米产品","text":"Desculpe, onde posso encontrar arroz sem sal?","zh":"劳驾，我在哪里能找到不加盐的米饭产品？","explanation":"onde 引出地点疑问；posso 后接 encontrar。"},{"id":"pt-06-transfer-4","prompt":"说明货架位置在收银台后","text":"Os sacos estão atrás da caixa.","zh":"购物袋在收银台后面。","explanation":"已知物品位置用 estão；atrás de+a 合并为 atrás da。"},{"id":"pt-06-transfer-5","prompt":"说明卡没带并询问现金","text":"Não tenho o cartão comigo. Posso pagar em dinheiro?","zh":"我没带卡。可以付现金吗？","explanation":"pagar em dinheiro 是现金付款的常见搭配。"},{"id":"pt-06-transfer-6","prompt":"拒绝购物袋但索要小票","text":"Não preciso de saco, mas queria o talão.","zh":"我不需要袋子，不过想要小票。","explanation":"precisar de 否定仍保留介词；mas 连接不同需求。"}],"grammarCheck":[{"prompt":"选择表达“我想要一公斤苹果。”且语法、用法正确的一项。","options":["Queria um quilo maçãs.","Queria uma quilo de maçãs.","Queria um quilo de maçãs."],"answer":2,"explanation":"量词与商品之间需 de；quilo 是阳性，用 um。"},{"prompt":"选择表达“这些苹果是葡萄牙产的。”且语法、用法正确的一项。","options":["Estas maçãs são portuguesas.","Estes maçãs são portugueses.","Estas maçãs é portuguesa."],"answer":0,"explanation":"maçãs 是阴性复数，指示词用 estas，形容词用 portuguesas，动词用 são。"},{"prompt":"选择表达“劳驾，大米在哪里？”且语法、用法正确的一项。","options":["Desculpe, onde estão o arroz?","Desculpe, onde está o arroz?","Desculpe, onde está a arroz?"],"answer":1,"explanation":"arroz 是阳性单数，用 o 和 está；不能因米粒多就使用复数动词。"}],"writingChecklist":["重量表达是否含 de？","指示词和形容词是否按商品性数配合？","位置介词 de 与冠词是否正确合并？"],"speakingFollowups":["如果水果按盒出售，你会怎样询问重量？","你如何确认标价是每公斤还是每件？","收银员问你是否要袋子时你怎样回答？"]}},{"id":"pt-07","number":7,"title":"问路与方位","level":"A2","stage":"beginner","goal":"能询问附近地点并确认步行路线。","grammar":{"title":"位置介词与 ir","explanation":"perto de、longe de 表示远近；à direita、à esquerda 表示左右。到某地点常用 ir a，a 与 o/a 可合成 ao/à。","examples":[{"text":"A farmácia fica perto da praça.","zh":"药房在广场附近。"},{"text":"Vou ao mercado a pé.","zh":"我步行去市场。"}]},"vocab":[{"head":"rua","zh":"街道","example":"Esta rua é estreita.","exampleZh":"这条街很窄。","icon":"travel"},{"head":"praça","zh":"广场","example":"A praça fica perto.","exampleZh":"广场很近。","icon":"travel"},{"head":"ponte","zh":"桥","example":"A ponte está à esquerda.","exampleZh":"桥在左边。","icon":"travel"},{"head":"à direita","zh":"向右；在右边","example":"Vire à direita.","exampleZh":"请右转。","icon":"travel"},{"head":"à esquerda","zh":"向左；在左边","example":"Vire à esquerda.","exampleZh":"请左转。","icon":"travel"},{"head":"em frente","zh":"向前；前面","example":"Siga em frente.","exampleZh":"请一直向前走。","icon":"travel"},{"head":"perto","zh":"近","example":"O banco fica perto.","exampleZh":"银行很近。","icon":"travel"},{"head":"longe","zh":"远","example":"A estação fica longe.","exampleZh":"车站很远。","icon":"travel"},{"head":"mapa","zh":"地图","example":"Pode mostrar no mapa?","exampleZh":"能在地图上指出来吗？","icon":"travel"},{"head":"a pé","zh":"步行","example":"Vou a pé.","exampleZh":"我步行去。","icon":"travel"}],"lessons":[{"id":"pt-07-1","text":"A farmácia fica perto da praça.","zh":"药房在广场附近。","tip":"de 与 a 合成 da。"},{"id":"pt-07-2","text":"Vou ao mercado a pé.","zh":"我步行去市场。","tip":"ao = a + o。"},{"id":"pt-07-3","text":"Desculpe, como vou para a biblioteca?","zh":"劳驾，去图书馆怎么走？","tip":"como vou para 用于问路线。"},{"id":"pt-07-4","text":"Siga em frente até à praça.","zh":"一直向前走到广场。","tip":"até à 表示到达某处为止。"},{"id":"pt-07-5","text":"Depois viro à direita?","zh":"然后我右转吗？","tip":"可复述路线确认理解。"},{"id":"pt-07-6","text":"Sim, a biblioteca fica ao lado do café.","zh":"对，图书馆在咖啡馆旁边。","tip":"ao lado do = ao lado de + o。"}],"dialogue":[{"speaker":"甲","text":"Desculpe, como vou para a biblioteca?","zh":"劳驾，去图书馆怎么走？"},{"speaker":"乙","text":"Siga em frente até à praça.","zh":"一直向前走到广场。"},{"speaker":"甲","text":"Depois viro à direita?","zh":"然后我右转吗？"},{"speaker":"乙","text":"Sim, a biblioteca fica ao lado do café.","zh":"对，图书馆在咖啡馆旁边。"}],"reading":{"title":"走到市场","text":"O Chen quer ir ao mercado, mas ainda não conhece bem o bairro. Na rua pergunta o caminho a uma senhora. Ela diz para seguir em frente até à praça e depois virar à esquerda. O mercado fica ao lado de uma padaria. O Chen repete as indicações para confirmar e mostra o mapa. Como o caminho é curto, decide ir a pé e guardar o telemóvel no bolso.","zh":"陈想去市场，但还不熟悉这个街区。他在街上向一位女士问路。她说一直走到广场，然后左转。市场在一家面包店旁边。陈复述路线以确认，并拿出地图。因为路很短，他决定步行，把手机放进口袋。"},"assessment":{"reading":{"title":"去邮局的路线","text":"A Mei precisa de encontrar os correios. Um rapaz explica que deve seguir pela rua principal até à ponte. Depois da ponte, tem de virar à direita. Os correios ficam em frente a um jardim, entre uma papelaria e um café. A Mei confirma a direção e pergunta se pode ir a pé. O rapaz diz que o caminho demora cerca de dez minutos. Ela agradece e continua."},"questions":[{"prompt":"梅首先要走到哪里？","options":["桥","公园","咖啡馆"],"answer":0,"explanation":"先沿主街走到桥。"},{"prompt":"过桥后往哪边转？","options":["左边","右边","回头"],"answer":1,"explanation":"Depois da ponte… virar à direita。"},{"prompt":"邮局对面是什么？","options":["文具店","车站","花园"],"answer":2,"explanation":"em frente a um jardim 表示在花园对面。"},{"prompt":"步行大约多久？","options":["十分钟","半小时","一小时"],"answer":0,"explanation":"cerca de dez minutos。"}],"writing":"写四步从一个虚构广场到图书馆的路线，包括左右和地标。","speaking":"模拟问路，并用自己的话重复路线以确认。"},"story":{"id":"pt-07","npc":"Inês","place":"路口地图旁","scene":"你第一次独自出门。先问方向，再用左右和地标核对路线。","text":"Para onde quer ir? Posso indicar-lhe o caminho.","zh":"您想去哪里？我可以给您指路。","icon":"travel"},"support":{"id":"pt-07","pronunciation":{"focus":"方向词中的 lh 与重音","explanation":"à 的重音符号主要标示语法合并，不表示强行加重；direita 重音在 rei，esquerda 重音在 quer。","examples":[{"text":"À direita.","zh":"向右。"},{"text":"À esquerda.","zh":"向左。"}]},"grammarNotes":["去有冠词的地点用 ir a：ao mercado、à biblioteca；步行是 a pé，不写 à pé。","perto de、ao lado de 后若接定冠词需要合并：perto da praça。","礼貌指路可用 Siga、Vire；问自己下一步时用 Viro…?，不要把命令式照搬为第一人称。"],"cultureNote":"在葡萄牙街头问路可先用 Desculpe。对方说 em frente 往往表示继续直走，em frente de 才可能表示位于某物正对面，需结合完整句理解。","vocabularyNotes":[{"head":"à direita","note":"à direita 是向右或在右侧，重音来自 a+a；右边那个用 o da direita。"},{"head":"perto","note":"perto 常搭配 de：perto de casa、perto da estação。"},{"head":"a pé","note":"a pé 是固定的步行表达，a 不带重音；乘车则说 de autocarro。"}],"transfer":[{"id":"pt-07-transfer-1","prompt":"描述邮局在桥附近","text":"Os correios ficam perto da ponte.","zh":"邮局在桥附近。","explanation":"os correios 通常用复数形式，故配 ficam。"},{"id":"pt-07-transfer-2","prompt":"说明自己步行去车站","text":"Vou à estação a pé porque é perto.","zh":"我步行去车站，因为很近。","explanation":"à estação 合并介词和冠词；a pé 保持无重音。"},{"id":"pt-07-transfer-3","prompt":"询问怎样到河边","text":"Desculpe, como posso chegar ao rio?","zh":"劳驾，我怎样才能到河边？","explanation":"chegar a+o 合并为 chegar ao。"},{"id":"pt-07-transfer-4","prompt":"给出穿过广场后的方向","text":"Atravesse a praça e siga até à ponte.","zh":"穿过广场，然后一直走到桥边。","explanation":"两个礼貌指令都用第三人称命令形式。"},{"id":"pt-07-transfer-5","prompt":"核实应在第二条街左转","text":"Viro à esquerda na segunda rua?","zh":"我在第二条街向左转吗？","explanation":"viro 是第一人称核实；na 引出转弯地点。"},{"id":"pt-07-transfer-6","prompt":"说明入口在咖啡馆对面","text":"A entrada fica em frente do café, do outro lado da rua.","zh":"入口在咖啡馆对面，街道另一侧。","explanation":"em frente de+o 合并为 em frente do；补充另一侧消除歧义。"}],"grammarCheck":[{"prompt":"选择表达“药房在广场附近。”且语法、用法正确的一项。","options":["A farmácia fica perto da praça.","A farmácia fica perto a praça.","A farmácia ficam perto da praça."],"answer":0,"explanation":"perto 后用 de，与 a 合并为 da；a farmácia 是单数，动词用 fica。"},{"prompt":"选择表达“我步行去市场。”且语法、用法正确的一项。","options":["Vou a mercado à pé.","Vou ao mercado a pé.","Vou ao mercado de pé."],"answer":1,"explanation":"目的地用 ao mercado；步行固定 a pé。de pé 表示站着，不表达交通方式。"},{"prompt":"选择表达“劳驾，去图书馆怎么走？”且语法、用法正确的一项。","options":["Desculpe, como vou a a biblioteca?","Desculpe, como vou para o biblioteca?","Desculpe, como vou para a biblioteca?"],"answer":2,"explanation":"a+a 必须合并为 à；biblioteca 为阴性，若用 para 应配 a，而非 o。"}],"writingChecklist":["步行的 a pé 是否误加重音？","perto de 和 ao lado de 是否保留 de？","核实路线时是否用我自己的人称？"],"speakingFollowups":["你怎样确认距离是否适合步行？","如果经过路口后仍没看到目的地，你会怎样再问？","你怎样区分建筑在街道哪一侧？"]}},{"id":"pt-08","number":8,"title":"公交与火车","level":"A2","stage":"beginner","goal":"能查询车次、购票并核对站台。","grammar":{"title":"ter de 与时间范围","explanation":"ter de + 动词原形表示需要做某事。de… a… 表示起终点；交通方式常用 de autocarro、de comboio。不同运营方规则需现场核对。","examples":[{"text":"Tenho de mudar de comboio?","zh":"我需要换乘火车吗？"},{"text":"Vou de autocarro até à estação.","zh":"我乘公交车到火车站。"}]},"vocab":[{"head":"autocarro","zh":"公交车；长途客车","example":"Vou de autocarro.","exampleZh":"我乘公交车去。","icon":"travel"},{"head":"comboio","zh":"火车","example":"O comboio chega cedo.","exampleZh":"火车很早到。","icon":"travel"},{"head":"bilhete","zh":"票","example":"Preciso de um bilhete.","exampleZh":"我需要一张票。","icon":"travel"},{"head":"ida","zh":"去程","example":"Queria um bilhete de ida.","exampleZh":"我想要一张单程票。","icon":"travel"},{"head":"volta","zh":"回程","example":"A volta é amanhã.","exampleZh":"回程是明天。","icon":"travel"},{"head":"paragem","zh":"公交站","example":"Onde fica a paragem?","exampleZh":"公交站在哪里？","icon":"travel"},{"head":"estação","zh":"火车站；站","example":"A estação está aberta.","exampleZh":"车站开着。","icon":"travel"},{"head":"linha","zh":"线路；股道","example":"Qual é a linha?","exampleZh":"是哪条线路／股道？","icon":"travel"},{"head":"atraso","zh":"延误","example":"Há um atraso de dez minutos.","exampleZh":"延误十分钟。","icon":"time"},{"head":"validar","zh":"验票；使票生效","example":"Onde tenho de validar o bilhete?","exampleZh":"我要在哪里验票？","icon":"travel"}],"lessons":[{"id":"pt-08-1","text":"Tenho de mudar de comboio?","zh":"我需要换乘火车吗？","tip":"ter de 表示有必要。"},{"id":"pt-08-2","text":"Vou de autocarro até à estação.","zh":"我乘公交车到火车站。","tip":"交通工具前通常不用冠词。"},{"id":"pt-08-3","text":"Queria um bilhete para Coimbra.","zh":"我想买一张去科英布拉的票。","tip":"para 引出目的地。"},{"id":"pt-08-4","text":"Só de ida ou de ida e volta?","zh":"单程还是往返？","tip":"ida e volta 是往返。"},{"id":"pt-08-5","text":"Só de ida. De que linha sai?","zh":"单程。从哪条股道出发？","tip":"按现场用词核对股道或站台。"},{"id":"pt-08-6","text":"Sai da linha três; confirme no painel.","zh":"从三号股道出发；请在显示屏上确认。","tip":"出发信息可能变化，需再次核对。"}],"dialogue":[{"speaker":"甲","text":"Queria um bilhete para Coimbra.","zh":"我想买一张去科英布拉的票。"},{"speaker":"乙","text":"Só de ida ou de ida e volta?","zh":"单程还是往返？"},{"speaker":"甲","text":"Só de ida. De que linha sai?","zh":"单程。从哪条股道出发？"},{"speaker":"乙","text":"Sai da linha três; confirme no painel.","zh":"从三号股道出发；请在显示屏上确认。"}],"reading":{"title":"去邻城","text":"A Li vai visitar uma amiga em Aveiro. Na estação compra um bilhete de ida e volta e pergunta se tem de mudar de comboio. O funcionário explica o percurso e pede que confirme a linha no painel. A Li consulta também a hora da volta. Antes de entrar, pergunta onde deve validar o bilhete. Guarda o bilhete durante a viagem e envia uma mensagem à amiga quando chega.","zh":"小李要去阿威罗看朋友。她在车站买了一张往返票，询问是否需要换乘火车。工作人员说明路线，让她在显示屏上确认股道。小李还查询回程时间。上车前，她询问应在哪里验票。旅途中她保管好票，到达后给朋友发消息。"},"assessment":{"reading":{"title":"出发时间变化","text":"O Rui quer ir de Braga ao Porto de comboio. Compra apenas a ida, pois ainda não sabe quando volta. O painel indica um atraso de quinze minutos. Ele pergunta a uma funcionária se a linha continua a ser a mesma. Ela confirma a linha dois e pede-lhe que acompanhe as informações no painel. O Rui avisa o colega de que vai chegar mais tarde e espera junto à linha indicada."},"questions":[{"prompt":"鲁伊买了什么票？","options":["往返票","单程票","月票"],"answer":1,"explanation":"compra apenas a ida 表示只买去程。"},{"prompt":"延误多久？","options":["五分钟","半小时","十五分钟"],"answer":2,"explanation":"atraso de quinze minutos。"},{"prompt":"工作人员确认哪条股道？","options":["二号","三号","一号"],"answer":0,"explanation":"文中为 linha dois。"},{"prompt":"鲁伊通知了谁？","options":["医生","同事","房东"],"answer":1,"explanation":"avisa o colega。"}],"writing":"写一条给朋友的信息：交通方式、目的地、出发时间及延误情况。","speaking":"模拟购票，询问是否换乘、去程或往返以及股道信息。"},"story":{"id":"pt-08","npc":"Rui","place":"火车站售票窗","scene":"站台上人来人往。你要问清车次和目的地，再决定买票。","text":"Qual é o seu destino e quando quer partir?","zh":"您的目的地是哪里，想什么时候出发？","icon":"travel"},"support":{"id":"pt-08","pronunciation":{"focus":"nh 与 lh 的区别","explanation":"linha 中 nh 是一个腭鼻音，不把 n、h 分开；bilhete 的 lh 是腭边音。先对比 linha、bilhete 中间的声音。","examples":[{"text":"Que linha?","zh":"哪条线？"},{"text":"Um bilhete.","zh":"一张票。"}]},"grammarNotes":["ter de 后用原形：tenho de mudar；de 是这一结构的一部分，不要漏掉。","交通方式用 de comboio/de autocarro；具体的目的地仍用 até à estação 等。","表示出发站台用 sair de，da linha três 中 da 来自 de+a；询问哪条线用 De que linha…。"],"cultureNote":"在葡萄牙，autocarro 指公交或大巴，comboio 指火车；站台和线路信息以现场实时显示及工作人员提示为准，练习句里的数字只是示例。","vocabularyNotes":[{"head":"autocarro","note":"autocarro 为阳性；乘公交用 de autocarro，上车可说 entrar no autocarro。"},{"head":"ida","note":"ida 指去程；ida e volta 指往返，常与 bilhete 连用。"},{"head":"estação","note":"estação 通常指车站；公交停靠点常称 paragem。"}],"transfer":[{"id":"pt-08-transfer-1","prompt":"询问到目的地是否要换乘","text":"Tenho de mudar de autocarro para chegar ao hospital?","zh":"到医院我需要换公交车吗？","explanation":"tenho de+原形；chegar ao 标明最终目的地。"},{"id":"pt-08-transfer-2","prompt":"说明先坐火车再步行","text":"Vou de comboio e depois sigo a pé.","zh":"我先坐火车，然后步行。","explanation":"de comboio 与 a pé 分别说明两种出行方式。"},{"id":"pt-08-transfer-3","prompt":"购买当天两张返程票","text":"Queria dois bilhetes de volta para hoje.","zh":"我想买两张今天的返程票。","explanation":"dois bilhetes 用复数；de volta 限定票的行程。"},{"id":"pt-08-transfer-4","prompt":"询问往返是否比单程合算","text":"O bilhete de ida e volta é mais barato?","zh":"往返票更便宜吗？","explanation":"单张往返票仍用单数 é。"},{"id":"pt-08-transfer-5","prompt":"确认公交在哪里停靠","text":"Só de ida, por favor. Em que paragem devo sair?","zh":"请来单程票。我应该在哪一站下车？","explanation":"em que paragem 询问下车站；devo 后接原形。"},{"id":"pt-08-transfer-6","prompt":"提醒先核对终点站再上车","text":"Antes de entrar, confirme o destino no painel.","zh":"上车前，请在显示牌上确认目的地。","explanation":"antes de 后接原形；confirme 是礼貌指令。"}],"grammarCheck":[{"prompt":"选择表达“我需要换乘火车吗？”且语法、用法正确的一项。","options":["Tenho mudar de comboio?","Tenho de mudar de comboio?","Tenho de mudo de comboio?"],"answer":1,"explanation":"必须结构是 ter de+原形，不能省 de，也不能把 mudar 再变位成 mudo。"},{"prompt":"选择表达“我乘公交车到火车站。”且语法、用法正确的一项。","options":["Vou em autocarro até à estação.","Vou de autocarro até a a estação.","Vou de autocarro até à estação."],"answer":2,"explanation":"本句表达交通方式用 de autocarro；até a+a 应合并为 até à。"},{"prompt":"选择表达“我想买一张去科英布拉的票。”且语法、用法正确的一项。","options":["Queria um bilhete para Coimbra.","Queria uma bilhete para Coimbra.","Queria um bilhetes para Coimbra."],"answer":0,"explanation":"bilhete 是阳性；单数 um 要配单数 bilhete。"}],"writingChecklist":["ter de 后的动词是否为原形？","已写清单程、返程还是往返吗？","线路、出发时间与目的地是否分别确认？"],"speakingFollowups":["如果屏幕显示延误，你会向工作人员问什么？","你如何确认所坐的车是否到你的目的地？","错过换乘后你会怎样寻找下一班？"]}},{"id":"pt-09","number":9,"title":"住宿与入住","level":"A2","stage":"beginner","goal":"能核对预订、说明基本需求并询问设施。","grammar":{"title":"há 与 estar","explanation":"há 表示存在，不随后面名词的复数变化；estar 表示某人或物目前的位置和状态。预订条件以住宿方确认为准。","examples":[{"text":"Há uma toalha no quarto.","zh":"房间里有一条毛巾。"},{"text":"A chave está na receção.","zh":"钥匙在接待处。"}]},"vocab":[{"head":"reserva","zh":"预订","example":"Tenho uma reserva.","exampleZh":"我有预订。","icon":"home"},{"head":"quarto","zh":"房间","example":"O quarto fica no segundo andar.","exampleZh":"房间在三楼。","icon":"home"},{"head":"chave","zh":"钥匙","example":"Aqui está a chave.","exampleZh":"钥匙在这里。","icon":"home"},{"head":"casa de banho","zh":"卫生间","example":"Há casa de banho no quarto?","exampleZh":"房间里有卫生间吗？","icon":"home"},{"head":"pequeno-almoço","zh":"早餐","example":"O pequeno-almoço está incluído?","exampleZh":"包含早餐吗？","icon":"food"},{"head":"andar","zh":"楼层","example":"Em que andar fica?","exampleZh":"在第几层？","icon":"home"},{"head":"receção","zh":"接待处","example":"A receção fica à entrada.","exampleZh":"接待处在入口处。","icon":"home"},{"head":"mala","zh":"行李箱","example":"Posso deixar a mala aqui?","exampleZh":"我能把行李箱留在这里吗？","icon":"travel"},{"head":"incluído","zh":"包含在内的","example":"O jantar não está incluído.","exampleZh":"晚餐不包含在内。","icon":"money"},{"head":"saída","zh":"离开；退房","example":"A saída é às onze.","exampleZh":"退房时间是十一点。","icon":"time"}],"lessons":[{"id":"pt-09-1","text":"Há uma toalha no quarto.","zh":"房间里有一条毛巾。","tip":"há 用于说明存在。"},{"id":"pt-09-2","text":"A chave está na receção.","zh":"钥匙在接待处。","tip":"estar 用于说明位置。"},{"id":"pt-09-3","text":"Boa tarde, tenho uma reserva em nome de Li.","zh":"下午好，我有一个以李为名的预订。","tip":"em nome de 指以某人的名义。"},{"id":"pt-09-4","text":"Sim, são duas noites, certo?","zh":"是的，住两晚，对吗？","tip":"用 certo 请求核对。"},{"id":"pt-09-5","text":"Sim. O pequeno-almoço está incluído?","zh":"对。包含早餐吗？","tip":"incluído 随被修饰名词变化。"},{"id":"pt-09-6","text":"Está incluído e começa às oito.","zh":"包含，八点开始。","tip":"省略上下文已明确的主语。"}],"dialogue":[{"speaker":"甲","text":"Boa tarde, tenho uma reserva em nome de Li.","zh":"下午好，我有一个以李为名的预订。"},{"speaker":"乙","text":"Sim, são duas noites, certo?","zh":"是的，住两晚，对吗？"},{"speaker":"甲","text":"Sim. O pequeno-almoço está incluído?","zh":"对。包含早餐吗？"},{"speaker":"乙","text":"Está incluído e começa às oito.","zh":"包含，八点开始。"}],"reading":{"title":"两晚短住","text":"A Mei chega a um alojamento em Évora ao fim da tarde. Na receção confirma uma reserva de duas noites. O quarto fica no primeiro andar e tem uma casa de banho pequena. O funcionário entrega a chave e explica o horário do pequeno-almoço. A Mei pergunta a que horas deve sair no último dia. Depois pede para deixar a mala na receção durante algumas horas, se houver espaço disponível.","zh":"梅傍晚到达埃武拉的一处住宿。她在接待处确认住两晚的预订。房间在二楼，有一个小卫生间。工作人员交给她钥匙，说明早餐时间。梅询问最后一天应几点退房。随后她问，如果有空余地方，能否把行李箱寄放在接待处几个小时。"},"assessment":{"reading":{"title":"住宿信息确认","text":"O Chen chega a uma pensão em Viseu com uma reserva para três noites. A rececionista informa que o quarto fica no rés do chão. O pequeno-almoço não está incluído no preço, mas pode ser pedido no café ao lado. O Chen pergunta pela ligação à internet e recebe um papel com a palavra-passe. Antes de ir descansar, confirma que a saída está prevista para as dez da manhã."},"questions":[{"prompt":"陈住几晚？","options":["一晚","两晚","三晚"],"answer":2,"explanation":"reserva para três noites。"},{"prompt":"房间在哪层？","options":["底层","二楼","三楼"],"answer":0,"explanation":"rés do chão 指底层。"},{"prompt":"早餐在哪里可以点？","options":["房间里","旁边的咖啡馆","车站"],"answer":1,"explanation":"no café ao lado。"},{"prompt":"陈拿到的纸条上有什么？","options":["火车时刻","菜单","网络密码"],"answer":2,"explanation":"papel com a palavra-passe。"}],"writing":"写一封简短住宿询问信，询问房间、早餐、退房时间及行李寄存。","speaking":"模拟到达接待处，报预订姓名并确认两项住宿服务。"},"story":{"id":"pt-09","npc":"Ana","place":"旅馆前台","scene":"旅途结束，你来到预订的住处。说明来意，也说清自己的需要。","text":"Boa tarde! Tem uma reserva em seu nome?","zh":"下午好！您有以自己名字作的预订吗？","icon":"home"},"support":{"id":"pt-09","pronunciation":{"focus":"lh 与复合词节奏","explanation":"toalha 的 lh 不读成独立的 l+h；pequeno-almoço 有两个词汇重音，almoço 的 ç 发 s 音。","examples":[{"text":"Uma toalha.","zh":"一条毛巾。"},{"text":"O pequeno-almoço.","zh":"早餐。"}]},"grammarNotes":["há 引入存在的事物且不随名词变复数：Há duas toalhas；已知物品的位置用 está/estão。","reserva em nome de… 是按某人姓名预订的表达；不要用 no nome 来机械替换。","incluído 随主语变化：o pequeno-almoço está incluído；as refeições estão incluídas。"],"cultureNote":"在葡萄牙住宿交流中，casa de banho 指卫生间，receção 指接待处。早餐和退房时间因住宿而异，入住时应询问并以实际确认内容为准。","vocabularyNotes":[{"head":"chave","note":"chave 为阴性：a chave do quarto；复数 as chaves。"},{"head":"casa de banho","note":"casa de banho 是阴性名词短语；私人卫生间可说 casa de banho privativa。"},{"head":"incluído","note":"incluído 是分词形容词，要配合主语：incluída、incluídos、incluídas。"}],"transfer":[{"id":"pt-09-transfer-1","prompt":"询问房间是否有书桌","text":"Há uma secretária no quarto?","zh":"房间里有书桌吗？","explanation":"询问存在用 há；secretária 在此指书桌。"},{"id":"pt-09-transfer-2","prompt":"告知备用钥匙放在桌上","text":"A chave extra está em cima da mesa.","zh":"备用钥匙在桌子上。","explanation":"已知钥匙位置用 está，不用 há。"},{"id":"pt-09-transfer-3","prompt":"入住时说明预订来自网站","text":"Boa tarde, fiz uma reserva pelo vosso site.","zh":"下午好，我通过你们的网站预订了。","explanation":"fiz 是 fazer 的过去时；pelo=por+o。"},{"id":"pt-09-transfer-4","prompt":"确认三晚且需要安静房间","text":"São três noites e precisava de um quarto sossegado.","zh":"住三晚，我想要一个安静的房间。","explanation":"三晚搭配 são；precisava 缓和要求。"},{"id":"pt-09-transfer-5","prompt":"确认早餐是否包含两个人","text":"O pequeno-almoço está incluído para duas pessoas?","zh":"早餐包含两个人的份吗？","explanation":"incluído 按早餐的阳性单数变化，非按人数变化。"},{"id":"pt-09-transfer-6","prompt":"说明早餐地点并提醒时间","text":"É servido na sala do rés do chão, a partir das sete.","zh":"早餐在底层的餐厅供应，七点起开始。","explanation":"a partir de+as 合并为 a partir das；rés do chão 为底层。"}],"grammarCheck":[{"prompt":"选择表达“房间里有一条毛巾。”且语法、用法正确的一项。","options":["Hão duas toalhas no quarto.","Há uma toalhas no quarto.","Há uma toalha no quarto."],"answer":2,"explanation":"存在句用不变的 há；冠词 uma 与单数 toalha 一致，不能与复数 toalhas 搭配。"},{"prompt":"选择表达“钥匙在接待处。”且语法、用法正确的一项。","options":["A chave está na receção.","A chave estão na receção.","A chave há na receção."],"answer":0,"explanation":"钥匙是单数，位置用 está；há 用于引入存在，不作此处的位置系词。"},{"prompt":"选择表达“下午好，我有一个以李为名的预订。”且语法、用法正确的一项。","options":["Boa tarde, tenho uma reserva em nome para Li.","Boa tarde, tenho uma reserva em nome de Li.","Boa tarde, tem uma reserva em nome de Li."],"answer":1,"explanation":"固定搭配 em nome de；“我有”用 tenho，tem 表示他/她或礼貌的您有。"}],"writingChecklist":["存在与已知物品位置是否分别用 há、estar？","incluído 是否与包含的项目性数一致？","入住、早餐、退房的时间是否问清？"],"speakingFollowups":["房间缺毛巾时你会怎样请求？","你如何询问行李能否暂存？","如果预订姓名没查到，你会提供什么信息？"]}},{"id":"pt-10","number":10,"title":"家居与日常作息","level":"A2","stage":"beginner","goal":"能描述住处、家务及日常时间安排。","grammar":{"title":"现在时与频率","explanation":"规则 -ar 动词第一人称单数通常以 -o 结尾，如 trabalho。todos os dias 表示每天；às vezes 表示有时。levantar-se 等反身动词在肯定句中常后接代词。","examples":[{"text":"Levanto-me às sete todos os dias.","zh":"我每天七点起床。"},{"text":"Às vezes cozinho com uma amiga.","zh":"我有时和一位朋友做饭。"}]},"vocab":[{"head":"cozinha","zh":"厨房","example":"A cozinha é pequena.","exampleZh":"厨房很小。","icon":"home"},{"head":"sala","zh":"客厅","example":"Estudo na sala.","exampleZh":"我在客厅学习。","icon":"home"},{"head":"janela","zh":"窗户","example":"Abro a janela.","exampleZh":"我打开窗户。","icon":"home"},{"head":"limpar","zh":"打扫","example":"Vou limpar a cozinha.","exampleZh":"我要打扫厨房。","icon":"home"},{"head":"lavar","zh":"洗","example":"Preciso de lavar a roupa.","exampleZh":"我需要洗衣服。","icon":"home"},{"head":"cozinhar","zh":"做饭","example":"Gosto de cozinhar.","exampleZh":"我喜欢做饭。","icon":"food"},{"head":"levantar-se","zh":"起床","example":"Levanto-me às sete.","exampleZh":"我七点起床。","icon":"time"},{"head":"deitar-se","zh":"上床睡觉","example":"Deito-me cedo.","exampleZh":"我很早上床睡觉。","icon":"time"},{"head":"às vezes","zh":"有时","example":"Às vezes almoço em casa.","exampleZh":"我有时在家吃午饭。","icon":"time"},{"head":"todos os dias","zh":"每天","example":"Leio todos os dias.","exampleZh":"我每天读书。","icon":"study"}],"lessons":[{"id":"pt-10-1","text":"Levanto-me às sete todos os dias.","zh":"我每天七点起床。","tip":"肯定句中 me 接在变位动词后。"},{"id":"pt-10-2","text":"Às vezes cozinho com uma amiga.","zh":"我有时和一位朋友做饭。","tip":"às vezes 表示不固定的频率。"},{"id":"pt-10-3","text":"A que horas usas a cozinha?","zh":"你几点用厨房？","tip":"usar 的 tu 形式为 usas。"},{"id":"pt-10-4","text":"Costumo cozinhar às sete da noite.","zh":"我通常晚上七点做饭。","tip":"costumar + 原形表示习惯。"},{"id":"pt-10-5","text":"Posso lavar a roupa depois do jantar?","zh":"我能晚饭后洗衣服吗？","tip":"depois de 表示在某事之后。"},{"id":"pt-10-6","text":"Sim, eu limpo a cozinha entretanto.","zh":"可以，我同时打扫厨房。","tip":"entretanto 在这里表示在这期间。"}],"dialogue":[{"speaker":"甲","text":"A que horas usas a cozinha?","zh":"你几点用厨房？"},{"speaker":"乙","text":"Costumo cozinhar às sete da noite.","zh":"我通常晚上七点做饭。"},{"speaker":"甲","text":"Posso lavar a roupa depois do jantar?","zh":"我能晚饭后洗衣服吗？"},{"speaker":"乙","text":"Sim, eu limpo a cozinha entretanto.","zh":"可以，我同时打扫厨房。"}],"reading":{"title":"合住的一天","text":"A Li e a Ana partilham uma casa em Setúbal. A Li levanta-se cedo e toma o pequeno-almoço na cozinha. A Ana trabalha à tarde e costuma estudar de manhã na sala. Para organizarem a casa, escrevem uma lista de tarefas. A Li lava a roupa à quarta-feira e a Ana limpa a cozinha ao sábado. Às vezes cozinham juntas ao domingo e abrem as janelas depois do almoço.","zh":"小李和安娜在塞图巴尔合住一所房子。小李很早起床，在厨房吃早餐。安娜下午工作，通常上午在客厅学习。为了安排家务，她们列出任务清单。小李周三洗衣服，安娜周六打扫厨房。她们有时周日一起做饭，午饭后开窗。"},"assessment":{"reading":{"title":"不同的作息","text":"O Liu vive com o Pedro num apartamento pequeno. O Liu trabalha de manhã e sai de casa às oito. O Pedro tem aulas à noite e costuma levantar-se às nove. Durante a semana, cada um prepara o seu almoço. Ao sábado, fazem as compras juntos. O Liu limpa a sala enquanto o Pedro lava a roupa. Depois combinam cozinhar uma sopa para o jantar e deixam a cozinha arrumada."},"questions":[{"prompt":"刘几点出门？","options":["八点","九点","晚上"],"answer":0,"explanation":"sai de casa às oito。"},{"prompt":"佩德罗什么时候上课？","options":["上午","晚上","周日中午"],"answer":1,"explanation":"tem aulas à noite。"},{"prompt":"谁洗衣服？","options":["刘","邻居","佩德罗"],"answer":2,"explanation":"Pedro lava a roupa。"},{"prompt":"两人准备晚饭做什么？","options":["汤","烤鱼","三明治"],"answer":0,"explanation":"cozinhar uma sopa para o jantar。"}],"writing":"写六句你的虚构日常作息，至少用两个频率表达和两项家务。","speaking":"与室友商量厨房和洗衣时间，并分配两项家务。"},"story":{"id":"pt-10","npc":"Inês","place":"合住公寓","scene":"搬进新家后，你和室友交换作息。简单说明日常安排就能减少误会。","text":"Como costuma organizar o seu dia?","zh":"您通常怎样安排一天？","icon":"home"},"support":{"id":"pt-10","pronunciation":{"focus":"自反动词的连读","explanation":"levanto-me 中代词 me 通常轻读，不要把连字符读出。às vezes 的词尾 s 在连读中可能变化，先按词组整体识别。","examples":[{"text":"Levanto-me cedo.","zh":"我早起。"},{"text":"Deito-me tarde.","zh":"我晚睡。"}]},"grammarNotes":["欧洲葡语肯定独立陈述常用后置自反代词：levanto-me；否定时通常前置：não me levanto。","costumar 后接原形，表示习惯：costumo cozinhar；不要重复变位成 costumo cozinho。","todos os dias 是每天；às vezes 是有时。频率状语不改变动词的人称配合。"],"cultureNote":"葡萄牙住家中谈厨房、洗衣机等共用空间时，可明确询问具体时段并说明自己的作息，避免假定每个家庭的晚餐或安静时间相同。","vocabularyNotes":[{"head":"limpar","note":"limpar 是清洁表面或空间：limpar a cozinha；洗衣服通常用 lavar。"},{"head":"levantar-se","note":"levantar-se 的代词随主语变：levanto-me、levantas-te、levantamo-nos。"},{"head":"às vezes","note":"às vezes 是固定词组，às 的重音不能漏；一次可说 uma vez。"}],"transfer":[{"id":"pt-10-transfer-1","prompt":"说明周末晚起","text":"Ao fim de semana levanto-me mais tarde.","zh":"周末我起得比较晚。","explanation":"频率时段 ao fim de semana；肯定陈述代词后置。"},{"id":"pt-10-transfer-2","prompt":"描述从不在家吃午餐","text":"Nunca almoço em casa durante a semana.","zh":"工作日我从不在家吃午餐。","explanation":"nunca 已是否定副词，不需再加一个后置 não。"},{"id":"pt-10-transfer-3","prompt":"询问室友何时洗衣","text":"A que horas costumas lavar a roupa?","zh":"你通常几点洗衣服？","explanation":"costumas 配 tu；后面的 lavar 保持原形。"},{"id":"pt-10-transfer-4","prompt":"说明先做饭再清洁","text":"Costumo limpar a bancada depois de cozinhar.","zh":"我通常做饭后擦厨房台面。","explanation":"depois de 后接原形 cozinhar。"},{"id":"pt-10-transfer-5","prompt":"请求清晨使用浴室","text":"Posso usar a casa de banho antes das sete?","zh":"我能在七点前用卫生间吗？","explanation":"posso+原形；antes de+as 合并为 antes das。"},{"id":"pt-10-transfer-6","prompt":"提出等待期间分工","text":"Enquanto lavas a roupa, eu preparo o jantar.","zh":"你洗衣服时，我来做晚餐。","explanation":"enquanto 连接同时发生的动作，两边分别正确变位。"}],"grammarCheck":[{"prompt":"选择表达“我每天七点起床。”且语法、用法正确的一项。","options":["Levanto-me às sete todos os dias.","Levanto-se às sete todos os dias.","Levantar-me às sete todos os dias."],"answer":0,"explanation":"第一人称自反代词为 me；完整陈述需要变位 levanto，不能直接用原形。"},{"prompt":"选择表达“我有时和一位朋友做饭。”且语法、用法正确的一项。","options":["Às vezes cozinho com uma amigo.","Às vezes cozinho com uma amiga.","Às vezes cozinhar com uma amiga."],"answer":1,"explanation":"uma 要配阴性 amiga；主句动词要变为第一人称 cozinho。"},{"prompt":"选择表达“你几点用厨房？”且语法、用法正确的一项。","options":["A que horas usa tu a cozinha?","A que horas usas o cozinha?","A que horas usas a cozinha?"],"answer":2,"explanation":"tu 对应 usas；cozinha 是阴性，用 a。"}],"writingChecklist":["自反代词是否与主语配合？","习惯表达 costumar 后是否为原形？","频率和先后顺序是否具体？"],"speakingFollowups":["如果室友的作息与你不同，你会怎样商量？","你怎样说明自己一周洗几次衣服？","你会如何分配做饭和清洁的顺序？"]}},{"id":"pt-11","number":11,"title":"药房与就医求助","level":"A2","stage":"beginner","goal":"能简述不适并询问适当的服务途径。","grammar":{"title":"doer 与 há 表示持续时间","explanation":"Dói-me a cabeça 表示“我头痛”，复数部位用 doem。há dois dias 表示已持续两天。本课练习表达与求助，不提供诊断、用药方案或固定服务资格判断。","examples":[{"text":"Dói-me a garganta há dois dias.","zh":"我喉咙痛两天了。"},{"text":"Tenho uma alergia a este medicamento.","zh":"我对这种药过敏。"}]},"vocab":[{"head":"farmácia","zh":"药房","example":"Onde fica a farmácia?","exampleZh":"药房在哪里？","icon":"health"},{"head":"dor","zh":"疼痛","example":"Tenho uma dor no braço.","exampleZh":"我手臂疼。","icon":"health"},{"head":"cabeça","zh":"头","example":"Dói-me a cabeça.","exampleZh":"我头疼。","icon":"health"},{"head":"febre","zh":"发热","example":"Tenho febre desde ontem.","exampleZh":"我从昨天开始发热。","icon":"health"},{"head":"tosse","zh":"咳嗽","example":"Tenho tosse.","exampleZh":"我咳嗽。","icon":"health"},{"head":"alergia","zh":"过敏","example":"Tenho uma alergia conhecida.","exampleZh":"我有已知的过敏情况。","icon":"health"},{"head":"medicamento","zh":"药物","example":"Tomo este medicamento.","exampleZh":"我在服用这个药。","icon":"health"},{"head":"consulta","zh":"就诊；咨询","example":"Queria marcar uma consulta.","exampleZh":"我想预约就诊。","icon":"health"},{"head":"ajuda","zh":"帮助","example":"Preciso de ajuda.","exampleZh":"我需要帮助。","icon":"health"},{"head":"urgente","zh":"紧急的","example":"Preciso de ajuda urgente.","exampleZh":"我需要紧急帮助。","icon":"health"}],"lessons":[{"id":"pt-11-1","text":"Dói-me a garganta há dois dias.","zh":"我喉咙痛两天了。","tip":"há 加时长说明持续时间。"},{"id":"pt-11-2","text":"Tenho uma alergia a este medicamento.","zh":"我对这种药过敏。","tip":"已知过敏情况应清楚表达。"},{"id":"pt-11-3","text":"Bom dia, precisava de uma informação.","zh":"早上好，我想咨询一下。","tip":"precisava 可用于委婉请求。"},{"id":"pt-11-4","text":"Diga, em que posso ajudar?","zh":"请说，我能怎样帮您？","tip":"固定问句用于邀请说明需求。"},{"id":"pt-11-5","text":"Tenho tosse e queria saber onde posso pedir orientação.","zh":"我咳嗽，想知道可以在哪里寻求指导。","tip":"说明需求并寻求专业人员指引。"},{"id":"pt-11-6","text":"Podemos falar com a farmacêutica.","zh":"我们可以跟药剂师谈谈。","tip":"本句是对话安排，不是治疗建议。"}],"dialogue":[{"speaker":"甲","text":"Bom dia, precisava de uma informação.","zh":"早上好，我想咨询一下。"},{"speaker":"乙","text":"Diga, em que posso ajudar?","zh":"请说，我能怎样帮您？"},{"speaker":"甲","text":"Tenho tosse e queria saber onde posso pedir orientação.","zh":"我咳嗽，想知道可以在哪里寻求指导。"},{"speaker":"乙","text":"Podemos falar com a farmacêutica.","zh":"我们可以跟药剂师谈谈。"}],"reading":{"title":"先说明情况","text":"O Chen entra numa farmácia porque tem uma dúvida sobre um medicamento que já toma. Leva a embalagem e uma lista das suas alergias conhecidas. Diz à farmacêutica há quanto tempo sente desconforto e pergunta onde pode obter orientação adequada. Não compreende uma palavra e pede que a escrevam. Antes de sair, confirma o que foi explicado. Se precisar de outra avaliação, quer saber como contactar um serviço de saúde.","zh":"陈走进药房，因为他对正在服用的一种药有疑问。他带着包装和已知过敏清单。他告诉药剂师不适持续了多久，并询问在哪里能得到适当指导。有一个词他没听懂，请对方写下来。离开前，他确认了刚才的说明。如果需要进一步评估，他想知道怎样联系医疗服务。"},"assessment":{"reading":{"title":"打电话询问预约","text":"A Mei telefona para uma clínica para perguntar como pode marcar uma consulta. Diz que tem uma dor no ombro há três dias. A rececionista pergunta o nome e explica que precisa de confirmar os horários disponíveis. A Mei pede que enviem a informação por escrito, porque não percebeu tudo ao telefone. Ela tem consigo uma lista dos medicamentos que toma. A conversa termina com a confirmação do seu endereço de email."},"questions":[{"prompt":"梅哪里痛？","options":["头部","肩膀","喉咙"],"answer":1,"explanation":"dor no ombro 为肩膀痛。"},{"prompt":"症状持续多久？","options":["一天","一周","三天"],"answer":2,"explanation":"há três dias。"},{"prompt":"她为什么要求书面信息？","options":["电话里未全听懂","不愿提供姓名","没有手机"],"answer":0,"explanation":"文中为 não percebeu tudo ao telefone。"},{"prompt":"通话最后确认什么？","options":["付款金额","电子邮箱","检查结果"],"answer":1,"explanation":"confirmação do seu endereço de email。"}],"writing":"写一段向专业人员说明不适的文字，含部位、开始时间、已知过敏及求助问题；不要自行给出诊断。","speaking":"模拟致电询问就诊预约方式，并要求重复或书面确认信息。"},"story":{"id":"pt-11","npc":"Rui","place":"药房咨询台","scene":"你需要说明哪里不舒服。先描述感受，再询问该向谁求助。","text":"O que está a sentir e há quanto tempo?","zh":"您有什么不适，持续多久了？","icon":"health"},"support":{"id":"pt-11","pronunciation":{"focus":"鼻化与 rr","explanation":"dor 的元音与 doer 的音节数不同；garganta 中重音在 gan。药名不熟悉时应请求拼写，不根据近似发音自行判断。","examples":[{"text":"Tenho tosse.","zh":"我咳嗽。"},{"text":"Tenho febre.","zh":"我发烧。"}]},"grammarNotes":["doer 的主语是疼痛部位：Dói-me a cabeça，复数部位用 Doem-me os pés；me 表示疼痛影响我。","há+时长说明从过去持续到现在，不是将来的 daqui a；há dois dias 不等于两天后。","对某药过敏常说 ter alergia a…；后接 este medicamento 不合并成 ao este。"],"cultureNote":"在葡萄牙药房求助可先描述症状、持续时间及已知过敏，再请药剂师指导。这里的语言示范是教学支持，不构成诊断或用药建议。","vocabularyNotes":[{"head":"dor","note":"dor 是阴性：uma dor forte；复数 dores 可用于多处疼痛。"},{"head":"alergia","note":"alergia a… 中介词是 a；uma alergia a este medicamento 表示对这种药过敏。"},{"head":"consulta","note":"consulta 是阴性，可说 marcar uma consulta；不是药品或剂量名称。"}],"transfer":[{"id":"pt-11-transfer-1","prompt":"描述脚疼三天","text":"Doem-me os pés há três dias.","zh":"我的脚疼了三天。","explanation":"复数主语 os pés 对应 doem；há 引出持续时长。"},{"id":"pt-11-transfer-2","prompt":"说明不知道自己是否对该药过敏","text":"Não sei se tenho alergia a esse medicamento.","zh":"我不知道自己是否对那种药过敏。","explanation":"se 引出是否，不能把未知情况说成已确认。"},{"id":"pt-11-transfer-3","prompt":"在药房请求与药剂师交谈","text":"Bom dia, podia falar com a farmacêutica?","zh":"早上好，我可以和女药剂师谈谈吗？","explanation":"podia 缓和请求；falar com 表示与某人交谈。"},{"id":"pt-11-transfer-4","prompt":"询问症状持续多久","text":"Há quanto tempo tem esses sintomas?","zh":"您有这些症状多久了？","explanation":"há quanto tempo 询问持续时间；tem 为礼貌第三人称。"},{"id":"pt-11-transfer-5","prompt":"说明咳嗽并询问到哪里求助","text":"Tenho tosse desde ontem. Onde posso pedir ajuda?","zh":"我从昨天起咳嗽。在哪里可以求助？","explanation":"desde 接起点 ontem；há 则接时长，二者不要互换。"},{"id":"pt-11-transfer-6","prompt":"建议向专业人员描述过敏","text":"É melhor explicar a alergia à farmacêutica.","zh":"最好向女药剂师说明过敏情况。","explanation":"explicar algo a alguém；a+a 合并为 à。"}],"grammarCheck":[{"prompt":"选择表达“我喉咙痛两天了。”且语法、用法正确的一项。","options":["Doem-me a garganta há dois dias.","Dói-me a garganta há dois dias.","Dói-me a garganta daqui a dois dias."],"answer":1,"explanation":"garganta 单数配 dói；há 表示已持续，daqui a 指将来，与原意不符。"},{"prompt":"选择表达“我对这种药过敏。”且语法、用法正确的一项。","options":["Tenho uma alergia de este medicamento.","Tenho um alergia a este medicamento.","Tenho uma alergia a este medicamento."],"answer":2,"explanation":"alergia 是阴性，用 uma；过敏对象由 a 引出。"},{"prompt":"选择表达“早上好，我想咨询一下。”且语法、用法正确的一项。","options":["Bom dia, precisava de uma informação.","Bom dia, precisava uma informação.","Bom dia, precisávamos de uma informação eu."],"answer":0,"explanation":"precisar de 需要介词 de；eu 的动词形式为 precisava，不是第一人称复数 precisávamos。"}],"writingChecklist":["疼痛部位与 dói/doem 是否一致？","há 的时长与 desde 的起点是否区分？","是否准确区分已知过敏和不确定信息？"],"speakingFollowups":["对方问你症状从什么时候开始，你会怎样回答？","你怎样说明自己没听懂一个药名？","如果不确定该找谁，你会怎样询问专业帮助？"]}},{"id":"pt-12","number":12,"title":"朋友、邀请与婉拒","level":"A2","stage":"beginner","goal":"能提出邀请、协商时间并礼貌拒绝。","grammar":{"title":"gostar de 与 poder","explanation":"gostar de 后接名词或动词原形；podes / pode 表示能否。Gostava de… 可委婉表达愿望。拒绝时可先感谢，再简述原因并提出其他时间。","examples":[{"text":"Gosto de passear junto ao rio.","zh":"我喜欢在河边散步。"},{"text":"Gostava de te convidar para jantar.","zh":"我想邀请你吃晚饭。"}]},"vocab":[{"head":"amigo / amiga","zh":"朋友","example":"A Ana é minha amiga.","exampleZh":"安娜是我的朋友。","icon":"person"},{"head":"convidar","zh":"邀请","example":"Quero convidar o Rui.","exampleZh":"我想邀请鲁伊。","icon":"talk"},{"head":"jantar","zh":"晚餐；吃晚饭","example":"Vamos jantar juntos?","exampleZh":"我们一起吃晚饭好吗？","icon":"food"},{"head":"passear","zh":"散步；逛","example":"Gosto de passear.","exampleZh":"我喜欢散步。","icon":"nature"},{"head":"livre","zh":"有空的","example":"Estás livre amanhã?","exampleZh":"你明天有空吗？","icon":"time"},{"head":"ocupado / ocupada","zh":"忙的","example":"Estou ocupada hoje.","exampleZh":"我今天很忙。","icon":"work"},{"head":"combinar","zh":"约定","example":"Podemos combinar outra hora.","exampleZh":"我们可以另约时间。","icon":"talk"},{"head":"talvez","zh":"也许","example":"Talvez no domingo.","exampleZh":"也许周日。","icon":"idea"},{"head":"pena","zh":"遗憾","example":"Que pena!","exampleZh":"真遗憾！","icon":"talk"},{"head":"aceitar","zh":"接受","example":"Obrigada por aceitar o convite.","exampleZh":"谢谢您接受邀请。","icon":"talk"}],"lessons":[{"id":"pt-12-1","text":"Gosto de passear junto ao rio.","zh":"我喜欢在河边散步。","tip":"gostar 后保留介词 de。"},{"id":"pt-12-2","text":"Gostava de te convidar para jantar.","zh":"我想邀请你吃晚饭。","tip":"gostava de 使语气更委婉。"},{"id":"pt-12-3","text":"Queres ir ao cinema no sábado?","zh":"你想周六去看电影吗？","tip":"queres 是 tu 的变位形式。"},{"id":"pt-12-4","text":"Obrigada, mas no sábado trabalho.","zh":"谢谢，但周六我工作。","tip":"先感谢，再说明不方便的原因。"},{"id":"pt-12-5","text":"E no domingo, estás livre?","zh":"那周日呢，你有空吗？","tip":"可提出具体的替代时间。"},{"id":"pt-12-6","text":"Sim, podemos combinar às cinco.","zh":"有空，我们可以约五点。","tip":"用具体时间确认邀请。"}],"dialogue":[{"speaker":"甲","text":"Queres ir ao cinema no sábado?","zh":"你想周六去看电影吗？"},{"speaker":"乙","text":"Obrigada, mas no sábado trabalho.","zh":"谢谢，但周六我工作。"},{"speaker":"甲","text":"E no domingo, estás livre?","zh":"那周日呢，你有空吗？"},{"speaker":"乙","text":"Sim, podemos combinar às cinco.","zh":"有空，我们可以约五点。"}],"reading":{"title":"改到星期日","text":"A Li quer convidar a Ana para um passeio junto ao rio no sábado. A Ana agradece, mas nesse dia tem de trabalhar até tarde. Propõe o domingo à tarde. A Li aceita e sugere que se encontrem às quatro, perto da ponte. As duas combinam levar água e fazer um passeio curto. Se estiver a chover, preferem encontrar-se num café e conversar um pouco antes de voltar para casa.","zh":"小李想邀请安娜周六沿河散步。安娜感谢她，但那天要工作到很晚。她提议周日下午。小李同意，建议四点在桥附近见面。两人约定带水，散步一小段。如果下雨，她们更愿意在咖啡馆见面，聊一会儿再回家。"},"assessment":{"reading":{"title":"晚餐邀请","text":"O Pedro convida o Liu para jantar em sua casa na sexta-feira. O Liu agradece, mas explica que tem uma aula nesse dia. Pergunta se o jantar pode ser no sábado. O Pedro concorda e propõe as oito da noite. O Liu aceita e pergunta se deve levar alguma coisa. O Pedro pede apenas fruta. Antes de terminar a conversa, envia a morada por mensagem para facilitar a chegada."},"questions":[{"prompt":"刘为什么不能周五去？","options":["要旅行","有工作会议","有课"],"answer":2,"explanation":"tem uma aula nesse dia。"},{"prompt":"最后约在何时？","options":["周六晚八点","周五晚八点","周日下午四点"],"answer":0,"explanation":"sábado… oito da noite。"},{"prompt":"佩德罗请刘带什么？","options":["面包","水果","饮料"],"answer":1,"explanation":"pede apenas fruta。"},{"prompt":"佩德罗最后发送什么？","options":["账单","菜单","地址"],"answer":2,"explanation":"envia a morada por mensagem。"}],"writing":"写一条婉拒邀请的信息：感谢、简述原因并提出一个替代时间。","speaking":"邀请朋友参加活动；听到对方拒绝后，协商新的日期和时间。"},"story":{"id":"pt-12","npc":"Ana","place":"公园长椅","scene":"朋友提议周末见面。试着接受、改时间，或礼貌说明不能参加。","text":"Queres combinar alguma coisa para o fim de semana?","zh":"你想商量一下周末做点什么吗？","icon":"talk"},"support":{"id":"pt-12","pronunciation":{"focus":"lh 与 nh 的听辨","explanation":"família 的 li 与 jantar 的鼻元音不要混淆。convidar 的重音在 dar，convite 的重音在 vi，动词和名词节奏不同。","examples":[{"text":"Queres jantar?","zh":"你想一起吃晚饭吗？"},{"text":"Talvez amanhã.","zh":"也许明天。"}]},"grammarNotes":["gostar 后需要 de：gosto de passear；想邀请某人可用 gostava de te convidar。","queres、estás、podes 对应 tu；礼貌第三人称则是 quer、está、pode，勿在同一称呼关系下无意混用。","婉拒可先感谢再用 mas 给出简短理由，最后提出替代时间；não posso 之后动词仍用原形。"],"cultureNote":"在葡萄牙朋友间，Queres…? 常用于熟悉关系的邀请。拒绝时给出替代日期能明确表示仍希望见面；不必把 talvez 当作已确认的约定。","vocabularyNotes":[{"head":"livre","note":"livre 表示有空时不分阴阳性：estou livre；复数 livres。"},{"head":"ocupado / ocupada","note":"ocupado/ocupada 随所指人物性别变化，不随说话对象变化。"},{"head":"pena","note":"pena 在 Que pena! 中表示遗憾；不是处罚意义的完整法律表述。"}],"transfer":[{"id":"pt-12-transfer-1","prompt":"谈自己喜欢周末去海边","text":"Gosto de passear à beira-mar ao domingo.","zh":"我喜欢周日到海边散步。","explanation":"gosto de+原形；à beira-mar 为海边的固定表达。"},{"id":"pt-12-transfer-2","prompt":"邀请朋友参加生日午餐","text":"Gostava de te convidar para o meu almoço de aniversário.","zh":"我想邀请你参加我的生日午餐。","explanation":"convidar alguém para… 引出活动。"},{"id":"pt-12-transfer-3","prompt":"约朋友下课后喝咖啡","text":"Queres tomar um café depois da aula?","zh":"你下课后想喝杯咖啡吗？","explanation":"queres+原形；depois de+a 合并为 depois da。"},{"id":"pt-12-transfer-4","prompt":"感谢并因家庭安排婉拒","text":"Obrigado pelo convite, mas vou jantar com a minha família.","zh":"谢谢邀请，不过我要和家人吃晚饭。","explanation":"pelo=por+o；vou jantar 说明已有安排。"},{"id":"pt-12-transfer-5","prompt":"提议换到周五晚上","text":"E na sexta-feira à noite, podes?","zh":"那周五晚上你有空吗？","explanation":"na sexta-feira 与 à noite 共同限定时间。"},{"id":"pt-12-transfer-6","prompt":"确认见面地点和时间","text":"Sim, encontramo-nos à entrada do cinema às seis.","zh":"好，我们六点在电影院入口见。","explanation":"encontramo-nos 为现在时安排；à entrada 指具体会面点。"}],"grammarCheck":[{"prompt":"选择表达“我喜欢在河边散步。”且语法、用法正确的一项。","options":["Gosto passear junto ao rio.","Gosta de passear junto ao rio eu.","Gosto de passear junto ao rio."],"answer":2,"explanation":"gostar 需介词 de；“我喜欢”用 gosto，不能用第三人称 gosta。"},{"prompt":"选择表达“我想邀请你吃晚饭。”且语法、用法正确的一项。","options":["Gostava de te convidar para jantar.","Gostava de te convido para jantar.","Gostava te convidar para jantar."],"answer":0,"explanation":"gostava de 后接原形 convidar；不能省去介词 de。"},{"prompt":"选择表达“你想周六去看电影吗？”且语法、用法正确的一项。","options":["Queres vais ao cinema no sábado?","Queres ir ao cinema no sábado?","Queres ir ao cinema em sábado?"],"answer":1,"explanation":"queres 后用原形 ir；本句特定的周六用 no sábado。"}],"writingChecklist":["gostar de 的 de 是否保留？","tu 的动词形式是否前后一致？","邀请和婉拒是否给出清楚的时间或替代安排？"],"speakingFollowups":["如果你只能短暂参加，你会怎样说明？","对方说 talvez 时你会如何确认？","你怎样问是否可以再带一位朋友？"]}},{"id":"pt-13","number":13,"title":"租房与合同问题","level":"B1","stage":"intermediate","goal":"能询问租金、费用、期限及需进一步确认的条款。","grammar":{"title":"间接疑问句","explanation":"Pode explicar se… / Gostava de saber quando… 可把问题嵌入请求中。使用陈述语序。租约词语用于理解和提问，不构成法律意见；具体义务应查阅实际文件并寻求合适的专业解释。","examples":[{"text":"Gostava de saber se a água está incluída.","zh":"我想知道是否包含水费。"},{"text":"Pode explicar quando termina o contrato?","zh":"您能解释合同何时结束吗？"}]},"vocab":[{"head":"renda","zh":"租金","example":"A renda inclui água?","exampleZh":"租金包含水费吗？","icon":"money"},{"head":"contrato","zh":"合同","example":"Quero ler o contrato.","exampleZh":"我想阅读合同。","icon":"home"},{"head":"caução","zh":"押金","example":"Qual é o valor da caução?","exampleZh":"押金金额是多少？","icon":"money"},{"head":"prazo","zh":"期限","example":"O prazo está escrito aqui.","exampleZh":"期限写在这里。","icon":"time"},{"head":"senhorio / senhoria","zh":"房东","example":"Vou falar com a senhoria.","exampleZh":"我要和女房东谈谈。","icon":"person"},{"head":"inquilino / inquilina","zh":"租客","example":"O inquilino pediu uma cópia.","exampleZh":"租客要了一份副本。","icon":"person"},{"head":"despesa","zh":"费用；开支","example":"Que despesas estão incluídas?","exampleZh":"包含哪些费用？","icon":"money"},{"head":"reparação","zh":"维修","example":"Quem trata desta reparação?","exampleZh":"谁负责这项维修？","icon":"home"},{"head":"cláusula","zh":"条款","example":"Não percebo esta cláusula.","exampleZh":"我不理解这一条款。","icon":"study"},{"head":"cópia","zh":"副本","example":"Posso ficar com uma cópia?","exampleZh":"我能留一份副本吗？","icon":"home"}],"lessons":[{"id":"pt-13-1","text":"Gostava de saber se a água está incluída.","zh":"我想知道是否包含水费。","tip":"se 引出是否的问题。"},{"id":"pt-13-2","text":"Pode explicar quando termina o contrato?","zh":"您能解释合同何时结束吗？","tip":"间接问句保持通常语序。"},{"id":"pt-13-3","text":"Antes de decidir, queria esclarecer as despesas.","zh":"决定前，我想弄清费用。","tip":"antes de 加原形说明先后顺序。"},{"id":"pt-13-4","text":"A eletricidade é paga à parte.","zh":"电费另付。","tip":"à parte 表示另外计算。"},{"id":"pt-13-5","text":"Pode enviar-me essa informação por escrito?","zh":"您能把这项信息以书面形式发给我吗？","tip":"请求留存可复核的信息。"},{"id":"pt-13-6","text":"Sim, envio uma proposta para poder ler com calma.","zh":"可以，我发一份方案，让您从容阅读。","tip":"para poder 说明目的。"}],"dialogue":[{"speaker":"甲","text":"Antes de decidir, queria esclarecer as despesas.","zh":"决定前，我想弄清费用。"},{"speaker":"乙","text":"A eletricidade é paga à parte.","zh":"电费另付。"},{"speake
