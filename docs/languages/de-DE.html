</script></head><body><header><a href="../suite.html">← 大陆地图</a><span id="courseName" class="brand">语言大陆</span></header><script src="../answer-sounds.js?v=0.11.1"></script><main><div id="notice" role="status" aria-live="polite"></div><div id="app"></div></main><footer>0.11.0 · Deutsch · A1–B1 生活学习目标 · 本地合成音频 · 专业语言审阅与真实学习效果验证待完成</footer><script>window.ContinentData={"id":"de-DE","name":"德语","nativeName":"Deutsch","country":"德国","chapters":[{"id":"de-01","number":1,"title":"问候与礼貌澄清","level":"A1","stage":"beginner","goal":"能打招呼、说明没听懂，并礼貌地请对方重复。","grammar":{"title":"人称代词与动词位置","explanation":"陈述句中变位动词通常在第二位。正式场合用大写 Sie；与熟人用 du。请重复时可用 Können Sie …?，动词原形放句末。","examples":[{"text":"Guten Tag, ich heiße Lina.","zh":"您好，我叫莉娜。"},{"text":"Wie heißen Sie?","zh":"您叫什么名字？"}]},"vocab":[{"head":"Guten Tag","zh":"您好","example":"Guten Tag, ich heiße Lina.","exampleZh":"您好，我叫莉娜。","icon":"talk"},{"head":"heißen","zh":"叫作","example":"Wie heißen Sie?","exampleZh":"您叫什么名字？","icon":"person"},{"head":"bitte","zh":"请；不客气","example":"Sprechen Sie bitte langsam.","exampleZh":"请您慢一点说。","icon":"talk"},{"head":"verstehen","zh":"听懂；理解","example":"Ich verstehe das nicht.","exampleZh":"我没听懂这个。","icon":"idea"},{"head":"wiederholen","zh":"重复","example":"Können Sie das bitte wiederholen?","exampleZh":"您能重复一遍吗？","icon":"talk"},{"head":"danke","zh":"谢谢","example":"Danke für Ihre Hilfe.","exampleZh":"谢谢您的帮助。","icon":"talk"},{"head":"die Sprache","zh":"语言","example":"Deutsch ist eine neue Sprache für mich.","exampleZh":"德语对我来说是一门新语言。","icon":"study"},{"head":"der Name","zh":"姓名","example":"Mein Name ist Chen.","exampleZh":"我姓陈。","icon":"person"},{"head":"langsam","zh":"缓慢地","example":"Bitte lesen Sie langsam.","exampleZh":"请您慢慢读。","icon":"study"},{"head":"Auf Wiedersehen","zh":"再见","example":"Auf Wiedersehen, Frau Koch!","exampleZh":"再见，科赫女士！","icon":"talk"}],"lessons":[{"id":"de-01-1","text":"Guten Tag, ich heiße Lina.","zh":"您好，我叫莉娜。","tip":"ich 后的 heißen 变为 heiße。"},{"id":"de-01-2","text":"Wie heißen Sie?","zh":"您叫什么名字？","tip":"正式问姓名用 Wie heißen Sie?。"},{"id":"de-01-3","text":"Sprechen Sie bitte langsam.","zh":"请您慢一点说。","tip":"bitte 可放在请求句中。"},{"id":"de-01-4","text":"Ich verstehe das nicht.","zh":"我没听懂这个。","tip":"nicht 在这里否定 verstehen das。"},{"id":"de-01-5","text":"Können Sie das bitte wiederholen?","zh":"您能重复一遍吗？","tip":"情态动词 können 变位，wiederholen 留在句末。"},{"id":"de-01-6","text":"Danke für Ihre Hilfe.","zh":"谢谢您的帮助。","tip":"für Ihre Hilfe 表示感谢的原因。"}],"dialogue":[{"speaker":"Lina","text":"Guten Tag, ich heiße Lina.","zh":"您好，我叫莉娜。"},{"speaker":"Herr Koch","text":"Guten Tag, mein Name ist Koch.","zh":"您好，我姓科赫。"},{"speaker":"Lina","text":"Entschuldigung, können Sie Ihren Namen wiederholen?","zh":"不好意思，您能重复一下您的姓吗？"},{"speaker":"Herr Koch","text":"Koch. K-O-C-H.","zh":"科赫。K-O-C-H。"}],"reading":{"title":"问候与礼貌澄清：生活片段","text":"Lina besucht zum ersten Mal einen Deutschkurs. Vor dem Raum steht ein Mann. Lina sagt: „Guten Tag, ich heiße Lina.“ Der Mann heißt Herr Koch und ist ihr Lehrer. Er spricht zuerst sehr schnell. Lina versteht seinen Namen nicht und bittet ihn, langsam zu sprechen. Herr Koch wiederholt den Namen und schreibt ihn auf ein Blatt. Lina bedankt sich. Dann gehen beide in den Kursraum. Dort sitzen schon drei andere Personen.","zh":"莉娜第一次参加德语课。教室门前站着一位男士。莉娜说：“您好，我叫莉娜。”这位男士姓科赫，是她的老师。他一开始说得很快。莉娜没听懂他的姓，请他慢一点说。科赫先生重复了自己的姓，并把它写在一张纸上。莉娜道了谢。随后两人走进教室，里面已经坐着另外三个人。"},"assessment":{"reading":{"title":"问候与礼貌澄清：独立阅读","text":"Am Montag beginnt Omar einen Sprachkurs. Vor der Tür trifft er Frau Berg. Sie arbeitet im Büro der Schule. Omar sagt seinen Namen und fragt nach dem Kursraum. Frau Berg antwortet leise. Omar versteht die Nummer nicht. Er sagt: „Können Sie die Nummer bitte wiederholen?“ Frau Berg sagt langsam: „Raum acht.“ Omar bedankt sich und geht nach oben. Der Unterricht beginnt erst in zehn Minuten."},"questions":[{"prompt":"奥马尔在哪里遇到贝格女士？","options":["教室里面","门前","车站"],"answer":1,"explanation":"文中说他在门前遇到她。"},{"prompt":"贝格女士在哪里工作？","options":["学校办公室","餐厅","医院"],"answer":0,"explanation":"她在学校办公室工作。"},{"prompt":"奥马尔没听清什么？","options":["自己的姓名","星期几","教室号码"],"answer":2,"explanation":"他不理解她说的号码。"},{"prompt":"课程何时开始？","options":["已经开始了","十分钟后","星期二"],"answer":1,"explanation":"结尾说课程还有十分钟才开始。"}],"writing":"围绕“问候与礼貌澄清”，写3—4个简单句。能打招呼、说明没听懂，并礼貌地请对方重复。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“问候与礼貌澄清”中的一次真实交流，说出4—6句话。能打招呼、说明没听懂，并礼貌地请对方重复。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-01","npc":"Lena","place":"小镇入口","scene":"你刚到德国，一位邻居向你打招呼。先回应，不明白时可以请求重复。","text":"Guten Tag! Sind Sie neu hier?","zh":"您好！您是新来的吗？","icon":"person"},"support":{"id":"de-01","pronunciation":{"focus":"ich 音与礼貌请求","explanation":"ich 的 ch 是舌面摩擦音；Sie 的 ie 是长 i。","examples":[{"text":"ich","zh":"我"},{"text":"Sie","zh":"您"}]},"grammarNotes":["ich 后常用 -e 词尾，如 ich lerne。","礼貌疑问句用动词＋Sie，Sie 和 Ihr 大写。","können 变位后，动作原形放句末。"],"cultureNote":"初次与陌生成年人交流常用 Sie；改用 du 可由双方明确约定。","vocabularyNotes":[{"head":"Guten Tag","note":"日间正式问候，可用于商店进门。"},{"head":"heißen","note":"ich heiße、du heißt、Sie heißen，须随人称变化。"},{"head":"bitte","note":"请求中用 bitte，回应感谢也可用 Bitte。"}],"transfer":[{"id":"de-01-transfer-1","prompt":"在前台说明为材料的事情而来","text":"Guten Tag, ich bin wegen der Unterlagen hier.","zh":"您好，我是为材料的事来的。","explanation":"ich 对应 bin。"},{"id":"de-01-transfer-2","prompt":"询问如何称呼新同事","text":"Wie darf ich Sie ansprechen?","zh":"我该如何称呼您？","explanation":"darf 后 ansprechen 置末。"},{"id":"de-01-transfer-3","prompt":"请写下号码","text":"Schreiben Sie bitte die Nummer auf.","zh":"请您写下号码。","explanation":"auf 在句末。"},{"id":"de-01-transfer-4","prompt":"说明没听懂最后一句","text":"Den letzten Satz verstehe ich nicht.","zh":"最后一句我没听懂。","explanation":"宾语置首后动词仍第二位。"},{"id":"de-01-transfer-5","prompt":"请解释某词","text":"Können Sie dieses Wort bitte erklären?","zh":"您能解释这个词吗？","explanation":"erklären 是句末原形。"},{"id":"de-01-transfer-6","prompt":"感谢耐心解释","text":"Vielen Dank für die Erklärung.","zh":"非常感谢您的解释。","explanation":"für 后用宾格。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Ich lerne Deutsch.","Ich lernen Deutsch.","Ich Deutsch lerne."],"answer":0,"explanation":"ich 用 lerne，主句动词第二位。"},{"prompt":"选择语法与词序正确的句子。","options":["Sie können mir helfen?","Können Sie mir helfen?","Können Sie mir hilft?"],"answer":1,"explanation":"标准一般疑问句动词在首，后接原形。"},{"prompt":"选择语法与词序正确的句子。","options":["Danke für der Hinweis.","Danke für dem Hinweis.","Danke für den Hinweis."],"answer":2,"explanation":"für 要求宾格 den Hinweis。"}],"writingChecklist":["逐句核对：ich 后常用 -e 词尾，如 ich lerne。","检查本章表达：礼貌疑问句用动词＋Sie，Sie 和 Ihr 大写。","写入具体情境细节，并核对：können 变位后，动作原形放句末。"],"speakingFollowups":["您能把刚才那个姓拼一遍吗？","您希望我说得更慢些吗？","哪一个词需要再解释一下？"]}},{"id":"de-02","number":2,"title":"介绍自己与联系方式","level":"A1","stage":"beginner","goal":"能说明来自哪里、住在哪里，并交换简单联系方式。","grammar":{"title":"sein、kommen 与疑问词","explanation":"ich bin、Sie sind 是 sein 的不同形式。wo 问所在地，woher 问来自哪里；aus 表示来自某地，in 表示住在某地。","examples":[{"text":"Ich komme aus China.","zh":"我来自中国。"},{"text":"Ich wohne in Bonn.","zh":"我住在波恩。"}]},"vocab":[{"head":"kommen","zh":"来","example":"Ich komme aus China.","exampleZh":"我来自中国。","icon":"person"},{"head":"wohnen","zh":"居住","example":"Ich wohne in Bonn.","exampleZh":"我住在波恩。","icon":"home"},{"head":"die Adresse","zh":"地址","example":"Wie ist Ihre Adresse?","exampleZh":"您的地址是什么？","icon":"home"},{"head":"die Telefonnummer","zh":"电话号码","example":"Meine Telefonnummer steht hier.","exampleZh":"我的电话号码写在这里。","icon":"talk"},{"head":"die E-Mail-Adresse","zh":"电子邮箱地址","example":"Ist das Ihre E-Mail-Adresse?","exampleZh":"这是您的电子邮箱地址吗？","icon":"talk"},{"head":"sein","zh":"是","example":"Ich bin neu im Kurs.","exampleZh":"我是班里的新学员。","icon":"person"},{"head":"das Land","zh":"国家","example":"Aus welchem Land kommen Sie?","exampleZh":"您来自哪个国家？","icon":"travel"},{"head":"die Stadt","zh":"城市","example":"Die Stadt ist klein.","exampleZh":"这座城市很小。","icon":"home"},{"head":"buchstabieren","zh":"拼读字母","example":"Bitte buchstabieren Sie Ihren Namen.","exampleZh":"请逐个字母拼出您的姓名。","icon":"study"},{"head":"zusammen","zh":"一起","example":"Wir lernen zusammen Deutsch.","exampleZh":"我们一起学德语。","icon":"study"}],"lessons":[{"id":"de-02-1","text":"Ich komme aus China.","zh":"我来自中国。","tip":"aus China 中 China 通常不带冠词。"},{"id":"de-02-2","text":"Ich wohne in Bonn.","zh":"我住在波恩。","tip":"城市前用 in，wohnen 随 ich 变为 wohne。"},{"id":"de-02-3","text":"Wie ist Ihre Adresse?","zh":"您的地址是什么？","tip":"Wie ist …? 可用于询问地址。"},{"id":"de-02-4","text":"Meine Telefonnummer steht hier.","zh":"我的电话号码写在这里。","tip":"meine 与阴性名词 Telefonnummer 搭配。"},{"id":"de-02-5","text":"Ist das Ihre E-Mail-Adresse?","zh":"这是您的电子邮箱地址吗？","tip":"判断句把 ist 放句首。"},{"id":"de-02-6","text":"Ich bin neu im Kurs.","zh":"我是班里的新学员。","tip":"ich 对应 sein 的形式 bin。"}],"dialogue":[{"speaker":"Mia","text":"Hallo, ich bin Mia. Woher kommst du?","zh":"你好，我是米娅。你来自哪里？"},{"speaker":"Jun","text":"Ich komme aus China und wohne jetzt in Bonn.","zh":"我来自中国，现在住在波恩。"},{"speaker":"Mia","text":"Ich auch. Möchtest du meine E-Mail-Adresse?","zh":"我也住这里。你想要我的邮箱地址吗？"},{"speaker":"Jun","text":"Ja, gern. Dann können wir zusammen lernen.","zh":"好啊。这样我们就可以一起学习。"}],"reading":{"title":"介绍自己与联系方式：生活片段","text":"Jun ist neu in Bonn. Im Sprachkurs sitzt er neben Mia. Sie kommt aus Österreich und lebt seit einem Monat in der Stadt. Jun erzählt, dass er aus China kommt. Beide wohnen in der Nähe der Schule. Nach dem Unterricht tauschen sie ihre E-Mail-Adressen aus. Jun schreibt seine Adresse auf einen Zettel und buchstabiert seinen Familiennamen. Mia möchte am Mittwoch mit ihm Deutsch üben. Sie treffen sich in der Bibliothek.","zh":"俊刚到波恩。在语言课上，他坐在米娅旁边。米娅来自奥地利，在这座城市生活了一个月。俊说自己来自中国。两人都住在学校附近。下课后他们交换了邮箱地址。俊把自己的地址写在纸条上，并逐个字母拼出了自己的姓。米娅想在星期三和他练习德语。他们约在图书馆见面。"},"assessment":{"reading":{"title":"介绍自己与联系方式：独立阅读","text":"Sara und Ben lernen sich in einem Zeichenkurs kennen. Sara kommt aus Italien, Ben aus Hamburg. Jetzt wohnen beide in Leipzig. Sara wohnt in der Gartenstraße, Ben neben dem Bahnhof. Ben fragt nach Saras Telefonnummer. Sie möchte lieber ihre E-Mail-Adresse geben. Ben schreibt die Adresse in sein Heft. Am Freitag wollen sie nach dem Kurs zusammen einen Tee trinken. Sara bringt ein Foto ihrer Heimatstadt mit."},"questions":[{"prompt":"萨拉来自哪里？","options":["意大利","汉堡","莱比锡"],"answer":0,"explanation":"开头说萨拉来自意大利。"},{"prompt":"本现在住在哪里附近？","options":["学校","花园","火车站"],"answer":2,"explanation":"本住在火车站旁边。"},{"prompt":"萨拉更愿意提供什么？","options":["家庭住址","邮箱地址","电话号码"],"answer":1,"explanation":"她更愿意提供邮箱地址。"},{"prompt":"他们计划星期五做什么？","options":["一起喝茶","去意大利","去拍照"],"answer":0,"explanation":"他们想下课后一起喝茶。"}],"writing":"围绕“介绍自己与联系方式”，写3—4个简单句。能说明来自哪里、住在哪里，并交换简单联系方式。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“介绍自己与联系方式”中的一次真实交流，说出4—6句话。能说明来自哪里、住在哪里，并交换简单联系方式。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-02","npc":"Jonas","place":"社区登记桌","scene":"你需要介绍基本情况。用虚构资料练习姓名、来源和联系方式。","text":"Wie heißen Sie und woher kommen Sie?","zh":"您叫什么名字，来自哪里？","icon":"person"},"support":{"id":"de-02","pronunciation":{"focus":"长短元音","explanation":"wohnen 的 o 长，kommen 的 o 短；复合词可分块练习。","examples":[{"text":"wohnen","zh":"居住"},{"text":"kommen","zh":"来"}]},"grammarNotes":["sein 随人称变化：ich bin、du bist、Sie sind。","wo 问所在地，woher 问来源。","来源用 aus，住所城市用 in，通常不加冠词。"],"cultureNote":"交换联系方式可先询问对方愿意提供哪一种。","vocabularyNotes":[{"head":"kommen","note":"kommen aus 表示来自，woher 提问来源。"},{"head":"wohnen","note":"wohnen 指住所，不表示一次到访。"},{"head":"die Adresse","note":"die Adresse 阴性，您的地址为 Ihre Adresse。"}],"transfer":[{"id":"de-02-transfer-1","prompt":"说明来自小城","text":"Ich komme aus einer kleinen Stadt in China.","zh":"我来自中国的一座小城市。","explanation":"aus 后第三格。"},{"id":"de-02-transfer-2","prompt":"说明住学校旁","text":"Jetzt wohne ich neben der Sprachschule.","zh":"我现在住在语言学校旁边。","explanation":"Jetzt 后动词第二位。"},{"id":"de-02-transfer-3","prompt":"询问办公室地址","text":"Unter welcher Adresse finde ich Ihr Büro?","zh":"我到哪个地址能找到您的办公室？","explanation":"unter welcher Adresse 用第三格。"},{"id":"de-02-transfer-4","prompt":"告知邮件联系","text":"Sie können mich per E-Mail erreichen.","zh":"您可以通过邮件联系我。","explanation":"mich 是宾格。"},{"id":"de-02-transfer-5","prompt":"核对邮箱拼写","text":"Habe ich Ihre E-Mail-Adresse richtig geschrieben?","zh":"我把您的邮箱地址写对了吗？","explanation":"完成时疑问句以 habe 开始。"},{"id":"de-02-transfer-6","prompt":"介绍刚加入小组","text":"Ich bin seit heute in der Lesegruppe.","zh":"我从今天起加入读书小组。","explanation":"seit 配现在时表示持续状态。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Woher Sie kommen?","Woher kommen Sie?","Woher kommt Sie?"],"answer":1,"explanation":"礼貌 Sie 配 kommen，疑问词后用变位动词。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich sind aus Österreich.","Ich sein aus Österreich.","Ich bin aus Österreich."],"answer":2,"explanation":"ich 配 bin。"},{"prompt":"选择语法与词序正确的句子。","options":["Wir wohnen in Dresden.","Wir wohnt in Dresden.","Wir in Dresden wohnen."],"answer":0,"explanation":"wir 配 wohnen，动词第二位。"}],"writingChecklist":["逐句核对：sein 随人称变化：ich bin、du bist、Sie sind。","检查本章表达：wo 问所在地，woher 问来源。","写入具体情境细节，并核对：来源用 aus，住所城市用 in，通常不加冠词。"],"speakingFollowups":["您目前住在哪个城区？","您更愿意用邮件还是电话联系？","这个邮箱地址里的最后一个字母是什么？"]}},{"id":"de-03","number":3,"title":"数字、日期与约定时间","level":"A1","stage":"beginner","goal":"能询问价格、理解钟点，并约定见面时间。","grammar":{"title":"钟点与时间介词","explanation":"具体钟点用 um，星期用 am。halb neun 是八点半，即“差半小时到九点”。正式时间可说 acht Uhr dreißig。","examples":[{"text":"Es ist acht Uhr.","zh":"现在是八点。"},{"text":"Wir treffen uns um halb neun.","zh":"我们八点半见。"}]},"vocab":[{"head":"die Uhr","zh":"钟；点钟","example":"Es ist acht Uhr.","exampleZh":"现在是八点。","icon":"time"},{"head":"halb","zh":"半","example":"Wir treffen uns um halb neun.","exampleZh":"我们八点半见。","icon":"time"},{"head":"der Montag","zh":"星期一","example":"Am Montag habe ich Zeit.","exampleZh":"星期一我有时间。","icon":"time"},{"head":"kosten","zh":"价格为","example":"Wie viel kostet das Heft?","exampleZh":"这本练习本多少钱？","icon":"money"},{"head":"der Euro","zh":"欧元","example":"Das Heft kostet drei Euro.","exampleZh":"练习本三欧元。","icon":"money"},{"head":"die Minute","zh":"分钟","example":"Der Bus kommt in zehn Minuten.","exampleZh":"公交车十分钟后到。","icon":"time"},{"head":"heute","zh":"今天","example":"Heute ist der dritte Mai.","exampleZh":"今天是五月三日。","icon":"time"},{"head":"morgen","zh":"明天","example":"Morgen beginnt der Kurs früher.","exampleZh":"明天课程开始得更早。","icon":"time"},{"head":"der Termin","zh":"约定；预约","example":"Mein Termin ist um elf Uhr.","exampleZh":"我预约的时间是十一点。","icon":"time"},{"head":"spät","zh":"晚；迟","example":"Es ist schon spät.","exampleZh":"时间已经很晚了。","icon":"time"}],"lessons":[{"id":"de-03-1","text":"Es ist acht Uhr.","zh":"现在是八点。","tip":"Uhr 用于表示整点。"},{"id":"de-03-2","text":"Wir treffen uns um halb neun.","zh":"我们八点半见。","tip":"halb neun 是八点半，不是九点半。"},{"id":"de-03-3","text":"Am Montag habe ich Zeit.","zh":"星期一我有时间。","tip":"星期前的 am 是 an dem 的缩合。"},{"id":"de-03-4","text":"Wie viel kostet das Heft?","zh":"这本练习本多少钱？","tip":"Wie viel 询问金额。"},{"id":"de-03-5","text":"Das Heft kostet drei Euro.","zh":"练习本三欧元。","tip":"具体金额后的 Euro 通常不用复数词尾。"},{"id":"de-03-6","text":"Der Bus kommt in zehn Minuten.","zh":"公交车十分钟后到。","tip":"in zehn Minuten 表示十分钟之后。"}],"dialogue":[{"speaker":"Nora","text":"Wann treffen wir uns morgen?","zh":"我们明天什么时候见面？"},{"speaker":"Ali","text":"Um halb neun vor der Schule.","zh":"八点半在学校门前。"},{"speaker":"Nora","text":"Also um acht Uhr dreißig?","zh":"也就是八点三十分？"},{"speaker":"Ali","text":"Genau. Der Kurs beginnt um neun.","zh":"对。课程九点开始。"}],"reading":{"title":"数字、日期与约定时间：生活片段","text":"Nora kauft am Montag ein Heft für ihren Sprachkurs. Es kostet drei Euro. Danach ruft sie Ali an. Beide möchten am nächsten Morgen zusammen zur Schule gehen. Ali schlägt halb neun vor. Nora fragt zur Sicherheit noch einmal nach: „Acht Uhr dreißig?“ Ali sagt ja. Der Unterricht beginnt um neun Uhr. Von ihrem Treffpunkt bis zur Schule brauchen sie fünfzehn Minuten. Nora stellt am Abend ihren Wecker auf sieben Uhr.","zh":"星期一，诺拉为语言课买了一本练习本，花了三欧元。随后她给阿里打电话。两人想第二天早晨一起去学校。阿里提议八点半。诺拉为确保无误又问了一次：“八点三十分？”阿里说是。课程九点开始。从碰面地点到学校需要十五分钟。晚上诺拉把闹钟设为七点。"},"assessment":{"reading":{"title":"数字、日期与约定时间：独立阅读","text":"Am Donnerstag möchte Paul seine Freundin Lea besuchen. Er arbeitet bis fünf Uhr und braucht dann zwanzig Minuten mit dem Fahrrad. Lea ist ab halb sechs zu Hause. Sie vereinbaren ein Treffen um sechs Uhr. Paul kauft vorher Brot für zwei Euro und Obst für vier Euro. Er möchte nicht zu spät kommen und fährt um fünf Uhr dreißig los. Lea bereitet in der Küche einen Salat vor."},"questions":[{"prompt":"保罗工作到几点？","options":["四点","五点","六点"],"answer":1,"explanation":"他说工作到五点。"},{"prompt":"莉娅从几点开始在家？","options":["五点半","六点半","五点"],"answer":0,"explanation":"halb sechs 表示五点半。"},{"prompt":"面包和水果一共多少钱？","options":["二欧元","四欧元","六欧元"],"answer":2,"explanation":"二加四等于六欧元。"},{"prompt":"他们约定几点见面？","options":["五点二十","六点","五点半"],"answer":1,"explanation":"vereinbaren ein Treffen um sechs Uhr 明确约在六点。"}],"writing":"围绕“数字、日期与约定时间”，写3—4个简单句。能询问价格、理解钟点，并约定见面时间。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“数字、日期与约定时间”中的一次真实交流，说出4—6句话。能询问价格、理解钟点，并约定见面时间。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-03","npc":"Mia","place":"活动公告栏","scene":"你们要约好见面。把日期、钟点和数字确认清楚。","text":"An welchem Tag und um wie viel Uhr passt es Ihnen?","zh":"哪天几点对您方便？","icon":"time"},"support":{"id":"de-03","pronunciation":{"focus":"数词与重音","explanation":"dreizehn 重读 drei，dreißig 的 ß 清晰送气；二十一先说一再说二十。","examples":[{"text":"dreizehn","zh":"十三"},{"text":"einundzwanzig","zh":"二十一"}]},"grammarNotes":["halb zehn 是九点半，指距十点差半小时。","钟点用 um，星期和日期用 am。","时间短语置首后，先动词再主语。"],"cultureNote":"约时间可复述完整钟点；不确定地区说法时可用二十四小时制确认。","vocabularyNotes":[{"head":"die Uhr","note":"数词报时用 Uhr，不加复数词尾。"},{"head":"halb","note":"halb 后用下一小时，halb elf 是十点半。"},{"head":"der Montag","note":"am Montag 指星期一，montags 指每周一。"}],"transfer":[{"id":"de-03-transfer-1","prompt":"报当前时间","text":"Es ist kurz nach sechs.","zh":"现在刚过六点。","explanation":"nach 表示几点过后。"},{"id":"de-03-transfer-2","prompt":"约九点半见","text":"Wir treffen uns um halb zehn vor dem Eingang.","zh":"我们九点半在入口前见。","explanation":"um 引出钟点。"},{"id":"de-03-transfer-3","prompt":"告知周四下午有空","text":"Am Donnerstag kann ich nachmittags kommen.","zh":"周四下午我能来。","explanation":"kann 位于第二位。"},{"id":"de-03-transfer-4","prompt":"询问两张票总价","text":"Wie viel kosten zwei Eintrittskarten?","zh":"两张门票多少钱？","explanation":"复数主语配 kosten。"},{"id":"de-03-transfer-5","prompt":"说明午餐价格","text":"Das Mittagessen kostet acht Euro fünfzig.","zh":"午餐八欧元五十分。","explanation":"金额中 Euro 保持此形式。"},{"id":"de-03-transfer-6","prompt":"说明公交多久到","text":"Der nächste Bus kommt in einer Viertelstunde.","zh":"下一班公交一刻钟后到。","explanation":"in 加第三格表示多久以后。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Wir beginnen am neun Uhr.","Wir um neun Uhr beginnen.","Wir beginnen um neun Uhr."],"answer":2,"explanation":"钟点用 um，主句动词第二位。"},{"prompt":"选择语法与词序正确的句子。","options":["Am Freitag arbeite ich.","Am Freitag ich arbeite.","Am Freitag arbeiten ich."],"answer":0,"explanation":"时间置首后动词在第二位。"},{"prompt":"选择语法与词序正确的句子。","options":["Die Karten zehn Euro kosten.","Die Karten kosten zehn Euro.","Die Karten kostet zehn Euro."],"answer":1,"explanation":"复数 Karten 配 kosten。"}],"writingChecklist":["逐句核对：halb zehn 是九点半，指距十点差半小时。","检查本章表达：钟点用 um，星期和日期用 am。","写入具体情境细节，并核对：时间短语置首后，先动词再主语。"],"speakingFollowups":["您说的是上午九点半还是晚上九点半？","周四下午三点您有空吗？","两张票一共多少钱？"]}},{"id":"de-04","number":4,"title":"在咖啡馆点餐","level":"A1","stage":"beginner","goal":"能礼貌点饮品、表达堂食或外带，并结账。","grammar":{"title":"möchten 与宾格","explanation":"möchte 表达委婉愿望。阳性名词作宾语时 ein 变 einen，如 einen Kaffee；阴性 eine 和中性 ein 不变。","examples":[{"text":"Ich möchte einen Kaffee.","zh":"我想要一杯咖啡。"},{"text":"Haben Sie grünen Tee?","zh":"您这里有绿茶吗？"}]},"vocab":[{"head":"der Kaffee","zh":"咖啡","example":"Ich möchte einen Kaffee.","exampleZh":"我想要一杯咖啡。","icon":"food"},{"head":"der Tee","zh":"茶","example":"Haben Sie grünen Tee?","exampleZh":"您这里有绿茶吗？","icon":"food"},{"head":"die Milch","zh":"牛奶","example":"Den Kaffee bitte mit Milch.","exampleZh":"咖啡请加牛奶。","icon":"food"},{"head":"der Kuchen","zh":"蛋糕","example":"Ich nehme ein Stück Kuchen.","exampleZh":"我要一块蛋糕。","icon":"food"},{"head":"mitnehmen","zh":"带走","example":"Ich möchte den Tee mitnehmen.","exampleZh":"我想把茶带走。","icon":"food"},{"head":"bezahlen","zh":"付款","example":"Ich möchte bitte bezahlen.","exampleZh":"我想结账。","icon":"money"},{"head":"das Wasser","zh":"水","example":"Ein Glas Wasser, bitte.","exampleZh":"请给我一杯水。","icon":"food"},{"head":"die Rechnung","zh":"账单","example":"Die Rechnung, bitte.","exampleZh":"请给我账单。","icon":"money"},{"head":"ohne","zh":"不加；没有","example":"Für mich bitte ohne Zucker.","exampleZh":"我的请不要加糖。","icon":"food"},{"head":"zusammen","zh":"一起；合并","example":"Wir bezahlen zusammen.","exampleZh":"我们一起结账。","icon":"money"}],"lessons":[{"id":"de-04-1","text":"Ich möchte einen Kaffee.","zh":"我想要一杯咖啡。","tip":"einen Kaffee 是阳性宾格。"},{"id":"de-04-2","text":"Haben Sie grünen Tee?","zh":"您这里有绿茶吗？","tip":"Haben Sie …? 可询问是否提供某物。"},{"id":"de-04-3","text":"Den Kaffee bitte mit Milch.","zh":"咖啡请加牛奶。","tip":"mit Milch 表示加牛奶。"},{"id":"de-04-4","text":"Ich nehme ein Stück Kuchen.","zh":"我要一块蛋糕。","tip":"ein Stück 后可直接接 Kuchen。"},{"id":"de-04-5","text":"Ich möchte den Tee mitnehmen.","zh":"我想把茶带走。","tip":"mitnehmen 作原形放在 möchte 后的句末。"},{"id":"de-04-6","text":"Ich möchte bitte bezahlen.","zh":"我想结账。","tip":"bitte 使结账请求更礼貌。"}],"dialogue":[{"speaker":"Gast","text":"Guten Tag, einen Tee und ein Stück Kuchen, bitte.","zh":"您好，请给我一杯茶和一块蛋糕。"},{"speaker":"Service","text":"Gern. Zum Mitnehmen?","zh":"好的。外带吗？"},{"speaker":"Gast","text":"Nein, ich bleibe hier. Was kostet das zusammen?","zh":"不，我在这里吃。总共多少钱？"},{"speaker":"Service","text":"Sechs Euro fünfzig, bitte.","zh":"一共六欧元五十分。"}],"reading":{"title":"在咖啡馆点餐：生活片段","text":"Mei hat nach dem Deutschkurs eine Pause. Sie geht in ein kleines Café am Platz. Dort bestellt sie einen Kaffee mit Milch und ein Stück Apfelkuchen. Die Mitarbeiterin fragt, ob Mei alles mitnehmen möchte. Mei bleibt lieber im Café, denn draußen regnet es. Sie setzt sich ans Fenster und liest ihre Notizen. Nach einer halben Stunde bittet sie um die Rechnung. Sie bezahlt zusammen sieben Euro und geht zurück zur Schule.","zh":"德语课后梅有一段休息时间。她走进广场上的一家小咖啡馆，点了一杯加奶咖啡和一块苹果蛋糕。店员问她是否要外带。梅更想留在店里，因为外面在下雨。她坐在窗边读自己的笔记。半小时后，她要了账单，总共付了七欧元，然后返回学校。"},"assessment":{"reading":{"title":"在咖啡馆点餐：独立阅读","text":"Tobias wartet am Bahnhof auf seine Schwester. Ihr Zug kommt in vierzig Minuten. Im Café bestellt er einen schwarzen Tee ohne Zucker. Er möchte auch ein Brötchen, aber es gibt nur noch Kuchen. Deshalb nimmt er nichts zu essen. Den Tee trinkt er an einem kleinen Tisch. Als seine Schwester anruft, bezahlt er drei Euro. Dann verlässt er das Café und geht zum Gleis sieben."},"questions":[{"prompt":"托比亚斯在等谁？","options":["同事","老师","妹妹或姐姐"],"answer":2,"explanation":"文中说他在等自己的 Schwester。"},{"prompt":"他点了什么饮品？","options":["不加糖的红茶","加奶咖啡","矿泉水"],"answer":0,"explanation":"他点的是 schwarzen Tee ohne Zucker。"},{"prompt":"他为什么没买吃的？","options":["不饿","没有小面包了","忘带钱了"],"answer":1,"explanation":"他想要的小面包没有了，只有蛋糕。"},{"prompt":"他最后去了哪里？","options":["七号站台","妹妹家","售票处"],"answer":0,"explanation":"结尾说他走向 Gleis sieben。"}],"writing":"围绕“在咖啡馆点餐”，写3—4个简单句。能礼貌点饮品、表达堂食或外带，并结账。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“在咖啡馆点餐”中的一次真实交流，说出4—6句话。能礼貌点饮品、表达堂食或外带，并结账。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-04","npc":"Lena","place":"街角咖啡馆","scene":"轮到你点单了。先说明需要，再核对数量和价格。","text":"Guten Tag! Was möchten Sie bestellen?","zh":"您好！您想点些什么？","icon":"food"},"support":{"id":"de-04","pronunciation":{"focus":"ch 的前后音","explanation":"Kuchen 的 ch 在 u 后较靠后，Milch 的 ch 为舌面音。","examples":[{"text":"Kuchen","zh":"蛋糕"},{"text":"Milch","zh":"牛奶"}]},"grammarNotes":["möchte 接动作时，动作原形放末尾。","阳性宾格 ein 变 einen，中性 ein 不变。","mit 支配第三格，ohne 支配第四格。"],"cultureNote":"点餐可用 Ich hätte gern；付款时可说明分开或一起付。","vocabularyNotes":[{"head":"der Kaffee","note":"der Kaffee 阳性，一杯说 einen Kaffee。"},{"head":"der Tee","note":"der Tee 阳性，einen Tee ohne Zucker 是无糖茶。"},{"head":"die Milch","note":"die Milch 阴性，mit Milch 常不加冠词。"}],"transfer":[{"id":"de-04-transfer-1","prompt":"点不加糖的茶","text":"Ich möchte einen Tee ohne Zucker.","zh":"我想要一杯无糖茶。","explanation":"阳性宾格用 einen。"},{"id":"de-04-transfer-2","prompt":"问无咖啡因咖啡","text":"Haben Sie auch Kaffee ohne Koffein?","zh":"您也有无咖啡因咖啡吗？","explanation":"Haben Sie 是礼貌问句。"},{"id":"de-04-transfer-3","prompt":"点燕麦饮品拿铁","text":"Den Cap die Kasse","zh":"收银台","example":"Die Kasse ist dort links.","exampleZh":"收银台在那边左侧。","icon":"money"},{"head":"der Preis","zh":"价格","example":"Ist das der Preis für ein Kilo?","exampleZh":"这是一公斤的价格吗？","icon":"money"},{"head":"das Gemüse","zh":"蔬菜","example":"Das Gemüse ist frisch.","exampleZh":"蔬菜很新鲜。","icon":"food"},{"head":"das Kilo","zh":"公斤","example":"Ein Kilo Tomaten kostet vier Euro.","exampleZh":"一公斤番茄四欧元。","icon":"food"},{"head":"brauchen","zh":"需要","example":"Wir brauchen noch Reis.","exampleZh":"我们还需要米。","icon":"food"},{"head":"der Einkaufszettel","zh":"购物清单","example":"Mein Einkaufszettel liegt zu Hause.","exampleZh":"我的购物清单落在家里了。","icon":"idea"}],"lessons":[{"id":"de-05-1","text":"Ich nehme ein Kilo Äpfel.","zh":"我要一公斤苹果。","tip":"Äpfel 是 Apfel 的复数。"},{"id":"de-05-2","text":"Wo finde ich das Brot?","zh":"面包在哪里？","tip":"finden 后用宾格 das Brot。"},{"id":"de-05-3","text":"Ich brauche keine Tüte.","zh":"我不需要袋子。","tip":"keine 否定阴性名词 Tüte。"},{"id":"de-05-4","text":"Kann ich mit Karte bezahlen?","zh":"我可以刷卡付款吗？","tip":"mit Karte 是常用付款表达。"},{"id":"de-05-5","text":"Die Kasse ist dort links.","zh":"收银台在那边左侧。","tip":"links 表示在左侧。"},{"id":"de-05-6","text":"Ist das der Preis für ein Kilo?","zh":"这是一公斤的价格吗？","tip":"für ein Kilo 可确认计价单位。"}],"dialogue":[{"speaker":"Kundin","text":"Entschuldigung, wo finde ich Reis?","zh":"不好意思，米在哪里？"},{"speaker":"Mitarbeiter","text":"Im zweiten Gang rechts.","zh":"在第二条过道右侧。"},{"speaker":"Kundin","text":"Danke. Kann ich hier mit Karte bezahlen?","zh":"谢谢。我能在这里刷卡付款吗？"},{"speaker":"Mitarbeiter","text":"Ja. An der Kasse können Sie mit Karte bezahlen.","zh":"可以。您可以在收银台刷卡付款。"}],"reading":{"title":"超市购物与数量：生活片段","text":"Am Samstag geht Eva mit einem Einkaufszettel zum Supermarkt. Sie braucht Reis, Brot und Gemüse für das Wochenende. Die Tomaten kosten heute vier Euro pro Kilo. Eva nimmt nur ein halbes Kilo, denn sie lebt allein. Den Reis findet sie zuerst nicht. Ein Mitarbeiter zeigt ihr den richtigen Gang. An der Kasse packt Eva alles in ihren eigenen Rucksack. Sie braucht keine Tüte und bezahlt mit ihrer Karte. Danach geht sie zu Fuß nach Hause.","zh":"星期六，埃娃拿着购物清单去超市。她需要为周末买米、面包和蔬菜。今天番茄每公斤四欧元。埃娃只拿了半公斤，因为她独自生活。起初她找不到米。一位员工给她指了正确的过道。在收银台，她把所有东西装进自己的背包。她不需要袋子，用卡付了款，随后步行回家。"},"assessment":{"reading":{"title":"超市购物与数量：独立阅读","text":"Luis möchte am Abend für zwei Freunde kochen. Nach der Arbeit geht er einkaufen. Er kauft ein Kilo Kartoffeln und zwei Flaschen Wasser. Käse steht auch auf seiner Liste, doch der Käse im Angebot ist schon ausverkauft. Luis nimmt stattdessen Joghurt für das Frühstück. An der Kasse merkt er, dass seine Karte zu Hause liegt. Zum Glück hat er genug Bargeld. Seine Stofftasche ist groß genug für alles."},"questions":[{"prompt":"路易斯为什么去购物？","options":["为朋友做晚饭","给学校采购","买旅行用品"],"answer":0,"explanation":"他想晚上为两个朋友做饭。"},{"prompt":"哪种商品已经卖完？","options":["土豆","酸奶","特价奶酪"],"answer":2,"explanation":"特价奶酪已经售罄。"},{"prompt":"他怎样付款？","options":["刷卡","现金","朋友代付"],"answer":1,"explanation":"他的卡在家里，但现金足够。"},{"prompt":"他用什么装商品？","options":["新塑料袋","背包","布袋"],"answer":2,"explanation":"结尾提到他的布袋足够大。"}],"writing":"围绕“超市购物与数量”，写3—4个简单句。能询问商品位置、数量、价格，并说明付款方式。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“超市购物与数量”中的一次真实交流，说出4—6句话。能询问商品位置、数量、价格，并说明付款方式。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-05","npc":"Jonas","place":"社区超市","scene":"你在寻找晚餐材料。找不到商品或看不懂价格时，就开口问。","text":"Suchen Sie ein bestimmtes Produkt?","zh":"您在找某种特定商品吗？","icon":"food"},"support":{"id":"de-05","pronunciation":{"focus":"变元音 ä","explanation":"Äpfel 的 ä 与 Apfel 的 a 区别明显，复数词尾轻读。","examples":[{"text":"Apfel","zh":"苹果"},{"text":"Äpfel","zh":"苹果的复数"}]},"grammarNotes":["否定冠词随性数格变：kein Brot、keine Milch、keinen Käse。","重量可用 ein Kilo 加复数物品，如 Tomaten。","mit Karte 为零冠词表达，mit 仍支配第三格。"],"cultureNote":"购物袋与支付方式可直接询问，以现场说明为准。","vocabularyNotes":[{"head":"der Apfel","note":"Apfel 复数 Äpfel 有变元音。"},{"head":"das Brot","note":"das Brot；一片面包为 eine Scheibe Brot。"},{"head":"die Tüte","note":"die Tüte 阴性，否定宾语说 keine Tüte。"}],"transfer":[{"id":"de-05-transfer-1","prompt":"买半公斤番茄","text":"Ich hätte gern ein halbes Kilo Tomaten.","zh":"我想要半公斤番茄。","explanation":"halbes 与中性 Kilo 一致。"},{"id":"de-05-transfer-2","prompt":"找无麸质面包","text":"Wo steht das glutenfreie Brot?","zh":"无麸质面包放哪里？","explanation":"单数 Brot 配 steht。"},{"id":"de-05-transfer-3","prompt":"不要收据","text":"Ich brauche keinen Kassenbon.","zh":"我不需要收据。","explanation":"阳性宾格用 keinen。"},{"id":"de-05-transfer-4","prompt":"询问现金支付","text":"Kann ich hier bar bezahlen?","zh":"我可以在这里付现金吗？","explanation":"bar 表支付方式。"},{"id":"de-05-transfer-5","prompt":"确认开放收银台","text":"Welche Kasse ist noch geöffnet?","zh":"哪台收银台还开着？","explanation":"阴性单数用 welche。"},{"id":"de-05-transfer-6","prompt":"核实单包价格","text":"Gilt dieser Preis für eine Packung?","zh":"这个价格是一包的价格吗？","explanation":"für 后用宾格。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Ich kaufe keinen Äpfel.","Ich kaufe keine Äpfel.","Ich kaufe kein Äpfel."],"answer":1,"explanation":"复数宾格否定用 keine。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich brauche ein Beutel.","Ich brauchen einen Beutel.","Ich brauche einen Beutel."],"answer":2,"explanation":"阳性 Beutel 宾格为 einen。"},{"prompt":"选择语法与词序正确的句子。","options":["Kann ich mit der Karte zahlen?","Kann ich mit die Karte zahlen?","Kann ich mit den Karte zahlen?"],"answer":0,"explanation":"mit 后阴性第三格为 der。"}],"writingChecklist":["逐句核对：否定冠词随性数格变：kein Brot、keine Milch、keinen Käse。","检查本章表达：重量可用 ein Kilo 加复数物品，如 Tomaten。","写入具体情境细节，并核对：mit Karte 为零冠词表达，mit 仍支配第三格。"],"speakingFollowups":["这个标价是一包还是一公斤？","您需要购物袋吗？","哪里有不用冷藏的牛奶？"]}},{"id":"de-06","number":6,"title":"问路与公共交通","level":"A1","stage":"beginner","goal":"能问路、辨认方向，并确认公交目的地。","grammar":{"title":"祈使句与方向词","explanation":"正式祈使句用动词加 Sie，如 Gehen Sie …。nach links/rechts 表示向左/右，bis zur 表示一直到某个阴性地点。","examples":[{"text":"Wie komme ich zum Bahnhof?","zh":"去火车站怎么走？"},{"text":"Gehen Sie bitte geradeaus.","zh":"请您直走。"}]},"vocab":[{"head":"der Bahnhof","zh":"火车站","example":"Wie komme ich zum Bahnhof?","exampleZh":"去火车站怎么走？","icon":"travel"},{"head":"geradeaus","zh":"直行","example":"Gehen Sie bitte geradeaus.","exampleZh":"请您直走。","icon":"travel"},{"head":"links","zh":"向左；左边","example":"Biegen Sie hier links ab.","exampleZh":"请您在这里左转。","icon":"travel"},{"head":"rechts","zh":"向右；右边","example":"Die Haltestelle ist rechts.","exampleZh":"车站在右边。","icon":"travel"},{"head":"der Bus","zh":"公交车","example":"Fährt dieser Bus zum Museum?","exampleZh":"这辆公交车去博物馆吗？","icon":"travel"},{"head":"die Fahrkarte","zh":"车票","example":"Wo kann ich eine Fahrkarte kaufen?","exampleZh":"我在哪里能买车票？","icon":"travel"},{"head":"die Haltestelle","zh":"公交站","example":"Ich warte an der Haltestelle.","exampleZh":"我在公交站等。","icon":"travel"},{"head":"aussteigen","zh":"下车","example":"Steigen Sie am Markt aus.","exampleZh":"请您在市场站下车。","icon":"travel"},{"head":"umsteigen","zh":"换乘","example":"Sie müssen einmal umsteigen.","exampleZh":"您必须换乘一次。","icon":"travel"},{"head":"die Straße","zh":"街道","example":"Überqueren Sie die Straße vorsichtig.","exampleZh":"请小心穿过街道。","icon":"travel"}],"lessons":[{"id":"de-06-1","text":"Wie komme ich zum Bahnhof?","zh":"去火车站怎么走？","tip":"zum 是 zu dem 的缩合。"},{"id":"de-06-2","text":"Gehen Sie bitte geradeaus.","zh":"请您直走。","tip":"正式祈使句保留 Sie。"},{"id":"de-06-3","text":"Biegen Sie hier links ab.","zh":"请您在这里左转。","tip":"ab 是 abbiegen 的可分前缀，放句末。"},{"id":"de-06-4","text":"Die Haltestelle ist rechts.","zh":"车站在右边。","tip":"地点在右侧用 rechts。"},{"id":"de-06-5","text":"Fährt dieser Bus zum Museum?","zh":"这辆公交车去博物馆吗？","tip":"一般疑问句把 fährt 放开头。"},{"id":"de-06-6","text":"Wo kann ich eine Fahrkarte kaufen?","zh":"我在哪里能买车票？","tip":"kann 与 kaufen 构成情态动词结构。"}],"dialogue":[{"speaker":"Besucherin","text":"Entschuldigung, wie komme ich zum Museum?","zh":"不好意思，去博物馆怎么走？"},{"speaker":"Passant","text":"Nehmen Sie den Bus zwölf bis zum Markt.","zh":"坐十二路公交车到市场站。"},{"speaker":"Besucherin","text":"Muss ich umsteigen?","zh":"我需要换乘吗？"},{"speaker":"Passant","text":"Nein. Vom Markt gehen Sie fünf Minuten geradeaus.","zh":"不用。从市场站直走五分钟。"}],"reading":{"title":"问路与公共交通：生活片段","text":"Yuna möchte das Stadtmuseum besuchen. Auf ihrem Handy ist der Akku leer, deshalb fragt sie einen Mann nach dem Weg. Er erklärt, dass der Bus zwölf direkt zum Markt fährt. Die Haltestelle liegt rechts neben dem Bahnhof. Yuna kauft eine Fahrkarte am Automaten und steigt ein. Am Markt steigt sie aus. Sie geht geradeaus und biegt an der Apotheke links ab. Nach wenigen Minuten sieht sie das Museum auf der anderen Straßenseite.","zh":"优娜想参观市博物馆。她的手机没电了，于是向一位男士问路。他解释说十二路公交车直达市场站。公交站在火车站右侧。优娜在自动售票机买了票后上车，在市场站下车。她直走，到药店左转。几分钟后，她看到博物馆在街道对面。"},"assessment":{"reading":{"title":"问路与公共交通：独立阅读","text":"Heute besucht Deniz seinen Onkel im Krankenhaus. Er fährt mit der Straßenbahn vier bis zur Post. Dort muss er in den Bus neun umsteigen. Eine ältere Frau zeigt ihm die richtige Haltestelle auf der anderen Straßenseite. Deniz kauft seine Fahrkarte am Automaten. Nach drei Stationen steigt er vor dem Krankenhaus aus. Sein Onkel wartet im Garten. Für den Rückweg will Deniz dieselbe Verbindung nehmen, weil sie nur zwanzig Minuten dauert."},"questions":[{"prompt":"德尼兹先乘什么？","options":["九路公交车","四路有轨电车","火车"],"answer":1,"explanation":"他先乘四路有轨电车到邮局。"},{"prompt":"他在哪里换乘？","options":["邮局","医院","花园"],"answer":0,"explanation":"到邮局后换乘九路公交车。"},{"prompt":"公交车坐几站？","options":["一站","两站","三站"],"answer":2,"explanation":"三站后他在医院前下车。"},{"prompt":"他为什么想原路返回？","options":["不用买票","只需二十分钟","叔叔有车"],"answer":1,"explanation":"他觉得同样路线只需二十分钟。"}],"writing":"围绕“问路与公共交通”，写3—4个简单句。能问路、辨认方向，并确认公交目的地。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“问路与公共交通”中的一次真实交流，说出4—6句话。能问路、辨认方向，并确认公交目的地。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-06","npc":"Mia","place":"车站地图旁","scene":"你第一次独自出门。问清方向和交通方式，再确认路线。","text":"Wohin möchten Sie fahren? Ich kann Ihnen helfen.","zh":"您想坐车去哪里？我可以帮您。","icon":"travel"},"support":{"id":"de-06","pronunciation":{"focus":"方向词与前缀重音","explanation":"Straße 的 str 起首常为 sch 音加 tr；abbiegen 重读 ab。","examples":[{"text":"Straße","zh":"街道"},{"text":"abbiegen","zh":"转弯"}]},"grammarNotes":["Sie 祈使句使用动词＋Sie，如 Gehen Sie。","abbiegen 在主句末尾保留前缀 ab。","zu 加第三格：zu dem 缩合 zum，zu der 缩合 zur。"],"cultureNote":"问路先说 Entschuldigung 较自然；站名不清楚可请对方拼写。","vocabularyNotes":[{"head":"der Bahnhof","note":"zum Bahnhof 为去车站，Bahnhof 阳性。"},{"head":"geradeaus","note":"geradeaus 是方向副词，不加介词。"},{"head":"links","note":"links 指向左；左侧街道可说 die Straße links。"}],"transfer":[{"id":"de-06-transfer-1","prompt":"询问到图书馆","text":"Wie komme ich zur Stadtbibliothek?","zh":"我怎么去市立图书馆？","explanation":"Bibliothek 阴性，zu der 缩合 zur。"},{"id":"de-06-transfer-2","prompt":"指示到红绿灯","text":"Gehen Sie bis zur Ampel.","zh":"请走到红绿灯那里。","explanation":"bis zur 表到达界限。"},{"id":"de-06-transfer-3","prompt":"指示右转","text":"Biegen Sie an der nächsten Kreuzung rechts ab.","zh":"请在下个路口右转。","explanation":"可分前缀 ab 置末。"},{"id":"de-06-transfer-4","prompt":"说明桥后车站","text":"Die Haltestelle liegt hinter der Brücke.","zh":"车站在桥后面。","explanation":"静态位置用第三格。"},{"id":"de-06-transfer-5","prompt":"确认电车去向","text":"Fährt diese Straßenbahn zum Krankenhaus?","zh":"这辆有轨电车去医院吗？","explanation":"zu dem 缩合 zum。"},{"id":"de-06-transfer-6","prompt":"问能否车上买票","text":"Kann ich die Fahrkarte im Bus kaufen?","zh":"我能在公交车上买票吗？","explanation":"im Bus 表位置，kaufen 在末尾。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Geht Sie geradeaus.","Sie geradeaus gehen.","Gehen Sie geradeaus."],"answer":2,"explanation":"礼貌祈使为 Gehen Sie。"},{"prompt":"选择语法与词序正确的句子。","options":["Biegen Sie rechts ab.","Biegen Sie ab rechts.","Biegt Sie rechts ab."],"answer":0,"explanation":"前缀 ab 在句末。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich fahre zu die Schule.","Ich fahre zur Schule.","Ich fahre zum Schule."],"answer":1,"explanation":"Schule 阴性，zu 后 der 缩合 zur。"}],"writingChecklist":["逐句核对：Sie 祈使句使用动词＋Sie，如 Gehen Sie。","检查本章表达：abbiegen 在主句末尾保留前缀 ab。","写入具体情境细节，并核对：zu 加第三格：zu dem 缩合 zum，zu der 缩合 zur。"],"speakingFollowups":["我需要在哪一站换乘？","从这里步行大概要多久？","您说的是过桥后第一个路口吗？"]}},{"id":"de-07","number":7,"title":"住宿与入住","level":"A2","stage":"beginner","goal":"能办理入住、确认设施并报告房间问题。","grammar":{"title":"完成时与预订","explanation":"完成时由 haben 或 sein 的变位和句末过去分词组成。预订房间可说 Ich habe ein Zimmer reserviert。","examples":[{"text":"Ich habe ein Zimmer reserviert.","zh":"我预订了一个房间。"},{"text":"Ich bleibe für zwei Nächte.","zh":"我住两晚。"}]},"vocab":[{"head":"reservieren","zh":"预订","example":"Ich habe ein Zimmer reserviert.","exampleZh":"我预订了一个房间。","icon":"home"},{"head":"die Nacht","zh":"夜；晚","example":"Ich bleibe für zwei Nächte.","exampleZh":"我住两晚。","icon":"time"},{"head":"der Schlüssel","zh":"钥匙","example":"Kann ich den Schlüssel bekommen?","exampleZh":"我能拿钥匙吗？","icon":"home"},{"head":"das Frühstück","zh":"早餐","example":"Ist das Frühstück im Preis enthalten?","exampleZh":"价格包含早餐吗？","icon":"food"},{"head":"das Handtuch","zh":"毛巾","example":"Im Bad fehlt ein Handtuch.","exampleZh":"浴室里少一条毛巾。","icon":"home"},{"head":"funktionieren","zh":"正常工作","example":"Die Heizung funktioniert nicht.","exampleZh":"暖气不能正常工作。","icon":"home"},{"head":"die Rezeption","zh":"前台","example":"Die Rezeption ist unten.","exampleZh":"前台在楼下。","icon":"home"},{"head":"das Zimmer","zh":"房间","example":"Mein Zimmer liegt im zweiten Stock.","exampleZh":"我的房间在三楼。","icon":"home"},{"head":"der Aufzug","zh":"电梯","example":"Wo ist der Aufzug?","exampleZh":"电梯在哪里？","icon":"home"},{"head":"ruhig","zh":"安静的","example":"Ich hätte gern ein ruhiges Zimmer.","exampleZh":"我想要一间安静的房间。","icon":"home"}],"lessons":[{"id":"de-07-1","text":"Ich habe ein Zimmer reserviert.","zh":"我预订了一个房间。","tip":"reserviert 是过去分词。"},{"id":"de-07-2","text":"Ich bleibe für zwei Nächte.","zh":"我住两晚。","tip":"für zwei Nächte 表示时长。"},{"id":"de-07-3","text":"Kann ich den Schlüssel bekommen?","zh":"我能拿钥匙吗？","tip":"bekommen 表示获得。"},{"id":"de-07-4","text":"Ist das Frühstück im Preis enthalten?","zh":"价格包含早餐吗？","tip":"enthalten 表示包含。"},{"id":"de-07-5","text":"Im Bad fehlt ein Handtuch.","zh":"浴室里少一条毛巾。","tip":"fehlen 的主语是缺少的物品。"},{"id":"de-07-6","text":"Die Heizung funktioniert nicht.","zh":"暖气不能正常工作。","tip":"nicht 否定设备运行状态。"}],"dialogue":[{"speaker":"Gast","text":"Guten Abend, ich habe ein Zimmer auf den Namen Li reserviert.","zh":"晚上好，我以李这个姓预订了房间。"},{"speaker":"Rezeption","text":"Ja, für zwei Nächte. Hier ist Ihr Schlüssel.","zh":"是的，住两晚。这是您的钥匙。"},{"speaker":"Gast","text":"Wann gibt es Frühstück?","zh":"早餐什么时候供应？"},{"speaker":"Rezeption","text":"Von sieben bis zehn Uhr im Erdgeschoss.","zh":"七点到十点，在底层。"}],"reading":{"title":"住宿与入住：生活片段","text":"Li kommt am Abend in einem kleinen Hotel an. Sie hat ein Zimmer für zwei Nächte reserviert. An der Rezeption bekommt sie den Schlüssel und Informationen zum Frühstück. Es gibt keinen Aufzug, aber ihr Zimmer liegt im ersten Stock. Li trägt ihren kleinen Koffer nach oben. Im Bad bemerkt sie, dass ein Handtuch fehlt. Sie ruft die Rezeption an. Ein Mitarbeiter bringt ihr ein frisches Handtuch. Danach kann sie sich endlich ausruhen.","zh":"李女士晚上到达一家小旅馆。她预订了两晚的房间。在前台，她拿到了钥匙，并了解了早餐信息。旅馆没有电梯，但她的房间在二楼。她把小行李箱提上楼，发现浴室里少一条毛巾，便打电话给前台。一名员工给她送来干净毛巾。之后她终于可以休息了。"},"assessment":{"reading":{"title":"住宿与入住：独立阅读","text":"Marta reist beruflich nach Dresden und bleibt drei Nächte in einer Pension. Ihr Zimmer liegt zum Innenhof und ist sehr ruhig. Beim Einchecken fragt sie nach dem WLAN. Die Mitarbeiterin schreibt das Passwort auf eine Karte. Frühstück wird erst ab acht Uhr angeboten. Weil Marta morgen um halb acht einen Termin hat, möchte sie darauf verzichten. Sie fragt stattdessen nach einer Bäckerei in der Nähe und bekommt eine Wegbeschreibung."},"questions":[{"prompt":"玛尔塔住几晚？","options":["两晚","一晚","三晚"],"answer":2,"explanation":"她住三晚。"},{"prompt":"房间朝向哪里？","options":["内院","车站","大街"],"answer":0,"explanation":"房间朝向 Innenhof。"},{"prompt":"为何明天不吃旅馆早餐？","options":["太贵","预约早于早餐时间","不喜欢面包"],"answer":1,"explanation":"预约七点半，早餐八点开始。"},{"prompt":"她最后问什么？","options":["出租车价格","面包店位置","会议室号码"],"answer":1,"explanation":"她问附近的面包店。"}],"writing":"围绕“住宿与入住”，写5—6个句子。能办理入住、确认设施并报告房间问题。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“住宿与入住”中的一次真实交流，说出4—6句话。能办理入住、确认设施并报告房间问题。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-07","npc":"Lena","place":"旅馆前台","scene":"你来到预订的住处。说明来意，也把自己的需要说出来。","text":"Guten Abend! Haben Sie ein Zimmer reserviert?","zh":"晚上好！您预订房间了吗？","icon":"home"},"support":{"id":"de-07","pronunciation":{"focus":"词尾 -ieren","explanation":"reservieren 重音靠后，分词 reserviert 不加 ge-；Zimmer 的 z 为 ts。","examples":[{"text":"reserviert","zh":"预订了"},{"text":"Zimmer","zh":"房间"}]},"grammarNotes":["完成时 haben 变位，过去分词放末尾。","-ieren 结尾动词的分词不加 ge-。","fehlen 的主语是缺少的物品，复数配 fehlen。"],"cultureNote":"入住可先报预订信息；服务和费用须向住宿方逐项确认。","vocabularyNotes":[{"head":"reservieren","note":"reservieren 接宾格房间，分词 reserviert。"},{"head":"die Nacht","note":"die Nacht 复数 Nächte，für drei Nächte 是住三晚。"},{"head":"der Schlüssel","note":"der Schlüssel 单复数同形，复数冠词 die。"}],"transfer":[{"id":"de-07-transfer-1","prompt":"说明网上订房","text":"Ich habe online ein Doppelzimmer gebucht.","zh":"我网上订了双人房。","explanation":"完成时用 habe…gebucht。"},{"id":"de-07-transfer-2","prompt":"说明住到周日","text":"Ich bleibe bis Sonntag in Ihrem Hotel.","zh":"我在贵酒店住到周日。","explanation":"bis 表截止时间。"},{"id":"de-07-transfer-3","prompt":"索取第二张房卡","text":"Könnte ich eine zweite Zimmerkarte bekommen?","zh":"我能再拿一张房卡吗？","explanation":"Könnte 表委婉请求。"},{"id":"de-07-transfer-4","prompt":"询问早餐时间","text":"Ab wann wird das Frühstück serviert?","zh":"早餐从几点开始供应？","explanation":"wird 加分词为被动。"},{"id":"de-07-transfer-5","prompt":"反映床边缺灯","text":"Neben dem Bett fehlt eine Lampe.","zh":"床边缺一盏灯。","explanation":"Lampe 是主语。"},{"id":"de-07-transfer-6","prompt":"反映淋浴冷水","text":"Aus der Dusche kommt nur kaltes Wasser.","zh":"淋浴只出冷水。","explanation":"零冠词中性主格用 kaltes。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Ich habe ein Zimmer reserviert.","Ich habe ein Zimmer gereserviert.","Ich bin ein Zimmer reserviert."],"answer":0,"explanation":"reservieren 不加 ge-，完成时用 haben。"},{"prompt":"选择语法与词序正确的句子。","options":["Es fehlen zwei Kisse.","Es fehlen zwei Kissen.","Es fehlt zwei Kissen."],"answer":1,"explanation":"复数 Kissen 配 fehlen。"},{"prompt":"选择语法与词序正确的句子。","options":["Die Heizung funktionieren nicht.","Die Heizung nicht funktioniert.","Die Heizung funktioniert nicht."],"answer":2,"explanation":"单数 Heizung 配 funktioniert。"}],"writingChecklist":["逐句核对：完成时 haben 变位，过去分词放末尾。","检查本章表达：-ieren 结尾动词的分词不加 ge-。","写入具体情境细节，并核对：fehlen 的主语是缺少的物品，复数配 fehlen。"],"speakingFollowups":["早餐在哪一层供应？","我可以再拿一条毛巾吗？","退房后可以暂存行李吗？"]}},{"id":"de-08","number":8,"title":"家庭与每日作息","level":"A2","stage":"beginner","goal":"能描述起床、家务和日常安排。","grammar":{"title":"可分动词","explanation":"aufstehen 在主句拆成 stehe … auf。时间放句首时，变位动词仍在第二位：Am Abend räume ich auf。","examples":[{"text":"Ich stehe um sieben Uhr auf.","zh":"我七点起床。"},{"text":"Am Abend räume ich die Küche auf.","zh":"晚上我收拾厨房。"}]},"vocab":[{"head":"aufstehen","zh":"起床","example":"Ich stehe um sieben Uhr auf.","exampleZh":"我七点起床。","icon":"time"},{"head":"aufräumen","zh":"收拾","example":"Am Abend räume ich die Küche auf.","exampleZh":"晚上我收拾厨房。","icon":"home"},{"head":"waschen","zh":"洗","example":"Ich wasche am Samstag die Wäsche.","exampleZh":"我星期六洗衣服。","icon":"home"},{"head":"kochen","zh":"做饭","example":"Mein Bruder kocht heute das Abendessen.","exampleZh":"我哥哥或弟弟今天做晚饭。","icon":"food"},{"head":"sich kümmern","zh":"照顾；负责","example":"Ich kümmere mich um die Pflanzen.","exampleZh":"我照料植物。","icon":"nature"},{"head":"der Haushalt","zh":"家务；家庭事务","example":"Wir teilen uns die Arbeit im Haushalt.","exampleZh":"我们分担家务。","icon":"home"},{"head":"die Küche","zh":"厨房","example":"Die Küche ist morgens frei.","exampleZh":"厨房早上没人用。","icon":"home"},{"head":"gewöhnlich","zh":"通常","example":"Gewöhnlich frühstücke ich zu Hause.","exampleZh":"我通常在家吃早饭。","icon":"time"},{"head":"der Alltag","zh":"日常生活","example":"Mein Alltag beginnt früh.","exampleZh":"我的日常生活很早开始。","icon":"time"},{"head":"einschlafen","zh":"入睡","example":"Ich schlafe oft vor elf Uhr ein.","exampleZh":"我经常十一点前入睡。","icon":"health"}],"lessons":[{"id":"de-08-1","text":"Ich stehe um sieben Uhr auf.","zh":"我七点起床。","tip":"auf 是句末的可分前缀。"},{"id":"de-08-2","text":"Am Abend räume ich die Küche auf.","zh":"晚上我收拾厨房。","tip":"Am Abend 后紧接 räume。"},{"id":"de-08-3","text":"Ich wasche am Samstag die Wäsche.","zh":"我星期六洗衣服。","tip":"Wäsche 指待洗或洗好的衣物。"},{"id":"de-08-4","text":"Mein Bruder kocht heute das Abendessen.","zh":"我哥哥或弟弟今天做晚饭。","tip":"kocht 与单数主语一致。"},{"id":"de-08-5","text":"Ich kümmere mich um die Pflanzen.","zh":"我照料植物。","tip":"sich kümmern um 后接宾格。"},{"id":"de-08-6","text":"Wir teilen uns die Arbeit im Haushalt.","zh":"我们分担家务。","tip":"sich die Arbeit teilen 表示分担工作。"}],"dialogue":[{"speaker":"Kim","text":"Wann stehst du morgen auf?","zh":"你明天几点起床？"},{"speaker":"Jan","text":"Um sieben. Ich muss die Wäsche waschen.","zh":"七点。我得洗衣服。"},{"speaker":"Kim","text":"Dann koche ich das Mittagessen.","zh":"那我做午饭。"},{"speaker":"Jan","text":"Gut, danach räumen wir zusammen auf.","zh":"好，之后我们一起收拾。"}],"reading":{"title":"家庭与每日作息：生活片段","text":"Kim und Jan wohnen zusammen in einer kleinen Wohnung. Beide arbeiten unter der Woche und haben morgens wenig Zeit. Deshalb bereiten sie ihr Frühstück oft schon am Abend vor. Am Samstag teilen sie die Hausarbeit. Jan wäscht die Wäsche und putzt das Bad. Kim kauft ein und kocht. Nach dem Essen räumen sie gemeinsam die Küche auf. Am Nachmittag machen sie einen Spaziergang. So bleibt neben der Arbeit auch Zeit für Erholung.","zh":"金和扬合住在一套小公寓里。两人工作日都上班，早上时间不多，所以常在前一晚准备早餐。星期六他们分担家务。扬洗衣服、打扫浴室，金采购、做饭。饭后他们一起收拾厨房，下午去散步。这样除工作之外也有休息时间。"},"assessment":{"reading":{"title":"家庭与每日作息：独立阅读","text":"Seit zwei Wochen arbeitet Rosa am Nachmittag in einer Buchhandlung. Ihr Tagesablauf hat sich deshalb verändert. Sie steht um acht Uhr auf und frühstückt in Ruhe. Danach geht sie mit ihrem Hund spazieren. Um elf kocht sie eine warme Mahlzeit. Bevor sie zur Arbeit fährt, stellt sie das Essen für ihren Sohn in den Kühlschrank. Abends liest sie meistens noch eine halbe Stunde. Die Wäsche wäscht sie jetzt am Sonntag."},"questions":[{"prompt":"罗莎什么时候工作？","options":["上午","下午","深夜"],"answer":1,"explanation":"她下午在书店工作。"},{"prompt":"早餐后做什么？","options":["遛狗","洗衣服","去书店"],"answer":0,"explanation":"早餐后她带狗散步。"},{"prompt":"为儿子把饭放在哪里？","options":["烤箱","餐桌","冰箱"],"answer":2,"explanation":"她把食物放进冰箱。"},{"prompt":"她现在何时洗衣服？","options":["星期五","星期日","每天早晨"],"answer":1,"explanation":"最后一句说星期日洗。"}],"writing":"围绕“家庭与每日作息”，写5—6个句子。能描述起床、家务和日常安排。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“家庭与每日作息”中的一次真实交流，说出4—6句话。能描述起床、家务和日常安排。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-08","npc":"Jonas","place":"合住公寓","scene":"新室友想了解你的作息。说说日常安排，再商量共用空间。","text":"Wie sieht Ihr Alltag normalerweise aus?","zh":"您平时的日常生活是怎样的？","icon":"home"},"support":{"id":"de-08","pronunciation":{"focus":"可分前缀重音","explanation":"aufstehen、aufräumen 重读 auf；前缀独立放句末也保留重音。","examples":[{"text":"aufstehen","zh":"起床"},{"text":"aufräumen","zh":"收拾"}]},"grammarNotes":["主句可分动词前缀移到末尾：ich räume auf。","情态动词后用完整原形：ich muss aufräumen。","反身代词随人称变：ich kümmere mich、wir kümmern uns。"],"cultureNote":"合住时可具体商量家务和使用时段，各家庭习惯不同。","vocabularyNotes":[{"head":"aufstehen","note":"aufstehen 完成时 bin aufgestanden。"},{"head":"aufräumen","note":"aufräumen 侧重整理，可接 das Zimmer。"},{"head":"waschen","note":"waschen：du wäschst、er wäscht，有变元音。"}],"transfer":[{"id":"de-08-transfer-1","prompt":"说明夜班晚起","text":"Nach der Nachtschicht stehe ich erst mittags auf.","zh":"夜班后我中午才起床。","explanation":"stehe 与 auf 构成句框。"},{"id":"de-08-transfer-2","prompt":"收早餐餐桌","text":"Nach dem Frühstück räume ich den Tisch ab.","zh":"早饭后我收餐桌。","explanation":"abräumen 的 ab 在末尾。"},{"id":"de-08-transfer-3","prompt":"洗床单被套","text":"Am Wochenende wasche ich die Bettwäsche.","zh":"周末我洗床单被套。","explanation":"时间置首后 wasche 第二位。"},{"id":"de-08-transfer-4","prompt":"一起做汤","text":"Heute kochen wir zusammen eine Gemüsesuppe.","zh":"今天我们一起做蔬菜汤。","explanation":"wir 配 kochen。"},{"id":"de-08-transfer-5","prompt":"请照顾猫","text":"Kannst du dich morgen um die Katze kümmern?","zh":"你明天能照顾猫吗？","explanation":"du 用 dich，um 加宾格。"},{"id":"de-08-transfer-6","prompt":"轮流打扫","text":"Wir wechseln uns beim Putzen ab.","zh":"我们轮流打扫。","explanation":"反身 uns 与前缀 ab 都不能漏。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Ich stehen früh auf.","Ich stehe früh auf.","Ich aufstehe früh."],"answer":1,"explanation":"可分动词在主句分开。"},{"prompt":"选择语法与词序正确的句子。","options":["Wir müssen räumen die Küche auf.","Wir muss die Küche aufräumen.","Wir müssen die Küche aufräumen."],"answer":2,"explanation":"情态动词后用完整原形。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich kümmere mich um den Hund.","Ich kümmere sich um den Hund.","Ich kümmere mich um dem Hund."],"answer":0,"explanation":"ich 用 mich，um 支配宾格。"}],"writingChecklist":["逐句核对：主句可分动词前缀移到末尾：ich räume auf。","检查本章表达：情态动词后用完整原形：ich muss aufräumen。","写入具体情境细节，并核对：反身代词随人称变：ich kümmere mich、wir kümmern uns。"],"speakingFollowups":["这周谁负责洗衣服？","你通常几点起床？","我们可不可以轮流收拾餐桌？"]}},{"id":"de-09","number":9,"title":"就医时说明需求","level":"A2","stage":"beginner","goal":"能描述简单不适、预约并确认携带材料。","grammar":{"title":"seit 与持续状态","explanation":"seit 加第三格表达从过去持续至今，常配现在时。询问该带什么可用 Soll ich … mitbringen?。","examples":[{"text":"Seit gestern habe ich Schmerzen im Hals.","zh":"从昨天起我喉咙疼。"},{"text":"Ich brauche einen Termin in der Praxis.","zh":"我需要预约到诊所就诊。"}]},"vocab":[{"head":"der Schmerz","zh":"疼痛","example":"Seit gestern habe ich Schmerzen im Hals.","exampleZh":"从昨天起我喉咙疼。","icon":"health"},{"head":"der Termin","zh":"预约","example":"Ich brauche einen Termin in der Praxis.","exampleZh":"我需要预约到诊所就诊。","icon":"health"},{"head":"die Versichertenkarte","zh":"医保卡","example":"Soll ich meine Versichertenkarte mitbringen?","exampleZh":"我要带医保卡吗？","icon":"health"},{"head":"warten","zh":"等候","example":"Wie lange muss ich ungefähr warten?","exampleZh":"我大概需要等多久？","icon":"time"},{"head":"die Praxis","zh":"诊所","example":"Die Praxis öffnet um acht Uhr.","exampleZh":"诊所八点开门。","icon":"health"},{"head":"das Medikament","zh":"药物","example":"Ich nehme dieses Medikament regelmäßig.","exampleZh":"我定期服用这种药。","icon":"health"},{"head":"das Fieber","zh":"发烧","example":"Ich habe heute kein Fieber.","exampleZh":"我今天没有发烧。","icon":"health"},{"head":"der Husten","zh":"咳嗽","example":"Der Husten stört mich nachts.","exampleZh":"咳嗽让我夜里不舒服。","icon":"health"},{"head":"die Apotheke","zh":"药店","example":"Die Apotheke ist neben der Praxis.","exampleZh":"药店在诊所旁边。","icon":"health"},{"head":"mitbringen","zh":"带来","example":"Ich bringe meine Medikamentenliste mit.","exampleZh":"我会带来用药清单。","icon":"health"}],"lessons":[{"id":"de-09-1","text":"Seit gestern habe ich Schmerzen im Hals.","zh":"从昨天起我喉咙疼。","tip":"Schmerzen 常用复数。"},{"id":"de-09-2","text":"Ich brauche einen Termin in der Praxis.","zh":"我需要预约到诊所就诊。","tip":"einen Termin 是宾格。"},{"id":"de-09-3","text":"Soll ich meine Versichertenkarte mitbringen?","zh":"我要带医保卡吗？","tip":"soll 确认对方要求。"},{"id":"de-09-4","text":"Wie lange muss ich ungefähr warten?","zh":"我大概需要等多久？","tip":"ungefähr 表示大约。"},{"id":"de-09-5","text":"Die Praxis öffnet um acht Uhr.","zh":"诊所八点开门。","tip":"öffnet 的主语是诊所。"},{"id":"de-09-6","text":"Ich nehme dieses Medikament regelmäßig.","zh":"我定期服用这种药。","tip":"dieses 与中性宾格 Medikament 一致。"}],"dialogue":[{"speaker":"Patientin","text":"Ich habe seit gestern Halsschmerzen.","zh":"我从昨天起喉咙疼。"},{"speaker":"Empfang","text":"Möchten Sie einen Termin vereinbaren?","zh":"您想预约吗？"},{"speaker":"Patientin","text":"Ja. Haben Sie heute noch etwas frei?","zh":"是的。今天还有空的时段吗？"},{"speaker":"Empfang","text":"Um elf Uhr. Bringen Sie bitte Ihre Versichertenkarte mit.","zh":"十一点有。请带医保卡。"}],"reading":{"title":"就医时说明需求：生活片段","text":"Sofia fühlt sich seit gestern nicht gut und ruft ihre Hausarztpraxis an. Sie beschreibt, dass sie Halsschmerzen hat und schlecht schläft. Die Mitarbeiterin bietet ihr einen Termin am Vormittag an. Sofia notiert die Uhrzeit und fragt, was sie mitbringen soll. Sie legt ihre Versichertenkarte und eine Liste ihrer Medikamente in die Tasche. In der Praxis erklärt sie ihre Beschwerden noch einmal. Wenn sie ein Wort nicht versteht, bittet sie um eine einfache Erklärung.","zh":"索菲娅从昨天起不舒服，便给家庭医生诊所打电话。她说明自己喉咙疼、睡不好。员工提供了上午的预约时段。她记下时间并问该带什么，然后把医保卡和用药清单放进包里。在诊所她再次说明症状；有词不懂时，她会请对方简单解释。"},"assessment":{"reading":{"title":"就医时说明需求：独立阅读","text":"Herr Wang möchte einen Kontrolltermin vereinbaren. Er hat keine neuen Beschwerden, aber die Ärztin hat beim letzten Besuch eine weitere Untersuchung vorgeschlagen. Am Telefon erfährt er, dass am Dienstag um neun Uhr ein Platz frei ist. Er arbeitet dann jedoch schon. Deshalb wählt er Donnerstag um sechzehn Uhr. Die Mitarbeiterin bittet ihn, vorhandene Unterlagen mitzubringen. Herr Wang schreibt den Termin in seinen Kalender und prüft später, welche Unterlagen er zu Hause hat."},"questions":[{"prompt":"王先生为何预约？","options":["买药","做建议的进一步检查","新出现严重不适"],"answer":1,"explanation":"医生上次建议进一步检查。"},{"prompt":"为何不选星期二九点？","options":["要工作","诊所关闭","没有车"],"answer":0,"explanation":"那时他已经在工作。"},{"prompt":"最终预约何时？","options":["星期二下午","星期四九点","星期四十六点"],"answer":2,"explanation":"他选择星期四十六点。"},{"prompt":"员工请他带什么？","options":["现金","已有资料","午餐"],"answer":1,"explanation":"员工要求带已有资料。"}],"writing":"围绕“就医时说明需求”，写5—6个句子。能描述简单不适、预约并确认携带材料。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“就医时说明需求”中的一次真实交流，说出4—6句话。能描述简单不适、预约并确认携带材料。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-09","npc":"Mia","place":"就医接待处","scene":"你需要描述哪里不舒服。先说明感受和时间，再寻求帮助。","text":"Welche Beschwerden haben Sie und seit wann?","zh":"您有什么不适，从什么时候开始的？","icon":"health"},"support":{"id":"de-09","pronunciation":{"focus":"h 与长元音","explanation":"Husten 起首 h 送气；Fieber 的 ie 是长 i。","examples":[{"text":"Husten","zh":"咳嗽"},{"text":"Fieber","zh":"发烧"}]},"grammarNotes":["seit 加第三格，状态持续时常用现在时。","sollen 问他人要求，müssen 表必要性。","情态动词后 mitbringen 保持完整原形。"],"cultureNote":"描述症状可给出持续时间；预约、材料和等候安排须向诊所确认。","vocabularyNotes":[{"head":"der Schmerz","note":"Schmerzen 常用复数表示疼痛。"},{"head":"der Termin","note":"einen Termin vereinbaren 为预约，Termin 阳性。"},{"head":"die Versichertenkarte","note":"Versichertenkarte 阴性，宾语可用 meine Versichertenkarte。"}],"transfer":[{"id":"de-09-transfer-1","prompt":"说明咳嗽三天","text":"Seit drei Tagen habe ich Husten.","zh":"我咳嗽三天了。","explanation":"seit 后复数第三格加 n。"},{"id":"de-09-transfer-2","prompt":"预约检查","text":"Ich möchte einen Termin zur Untersuchung vereinbaren.","zh":"我想预约一次检查。","explanation":"einen Termin 为宾格。"},{"id":"de-09-transfer-3","prompt":"核对所需材料","text":"Welche Unterlagen soll ich zur Untersuchung mitbringen?","zh":"检查时我应带哪些材料？","explanation":"soll 后原形置末。"},{"id":"de-09-transfer-4","prompt":"问等待时长","text":"Muss ich länger als eine halbe Stunde warten?","zh":"我需要等超过半小时吗？","explanation":"länger als 比较时长。"},{"id":"de-09-transfer-5","prompt":"问周五关门时间","text":"Wann schließt die Praxis am Freitag?","zh":"诊所周五几点关门？","explanation":"单数 Praxis 配 schließt。"},{"id":"de-09-transfer-6","prompt":"说明按要求服药","text":"Ich nehme die Tabletten nach der vereinbarten Anweisung.","zh":"我按商定的说明服药。","explanation":"nach 后第三格。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Seit eine Woche habe ich Husten.","Seit einer Woche ich habe Husten.","Seit einer Woche habe ich Husten."],"answer":2,"explanation":"seit 后第三格，主句动词第二位。"},{"prompt":"选择语法与词序正确的句子。","options":["Soll ich die Karte mitbringen?","Soll ich bringe die Karte mit?","Sollen ich die Karte mitbringen?"],"answer":0,"explanation":"ich 配 soll，原形 mitbringen 置末。"},{"prompt":"选择语法与词序正确的句子。","options":["Die Praxis morgen öffnet.","Die Praxis öffnet morgen.","Die Praxis öffnen morgen."],"answer":1,"explanation":"单数主语配 öffnet。"}],"writingChecklist":["逐句核对：seit 加第三格，状态持续时常用现在时。","检查本章表达：sollen 问他人要求，müssen 表必要性。","写入具体情境细节，并核对：情态动词后 mitbringen 保持完整原形。"],"speakingFollowups":["这个症状持续多久了？","我去检查前需要带什么材料？","如果预约时间不合适，我可以怎样联系您？"]}},{"id":"de-10","number":10,"title":"邀请与婉拒","level":"A2","stage":"beginner","goal":"能发出邀请、说明冲突并提出其他时间。","grammar":{"title":"weil 原因从句","explanation":"weil 后的从句把变位动词放在末尾。主句与从句之间加逗号；情态动词在从句中位于原形之后。","examples":[{"text":"Ich lade dich am Samstag zum Essen ein.","zh":"我邀请你星期六来吃饭。"},{"text":"Danke für deine Einladung.","zh":"谢谢你的邀请。"}]},"vocab":[{"head":"einladen","zh":"邀请","example":"Ich lade dich am Samstag zum Essen ein.","exampleZh":"我邀请你星期六来吃饭。","icon":"talk"},{"head":"die Einladung","zh":"邀请","example":"Danke für deine Einladung.","exampleZh":"谢谢你的邀请。","icon":"talk"},{"head":"leider","zh":"遗憾地","example":"Leider kann ich am Samstag nicht kommen.","exampleZh":"可惜星期六我来不了。","icon":"talk"},{"head":"weil","zh":"因为","example":"Ich bleibe zu Hause, weil ich Besuch bekomme.","exampleZh":"我在家，因为有客人来。","icon":"talk"},{"head":"passen","zh":"合适","example":"Passt dir der Sonntag besser?","exampleZh":"星期日对你更合适吗？","icon":"time"},{"head":"mitbringen","zh":"带来","example":"Soll ich etwas zum Trinken mitbringen?","exampleZh":"我要带点喝的吗？","icon":"food"},{"head":"das Treffen","zh":"聚会；见面","example":"Unser Treffen beginnt um sechs Uhr.","exampleZh":"我们的聚会六点开始。","icon":"talk"},{"head":"absagen","zh":"取消","example":"Ich muss das Treffen leider absagen.","exampleZh":"可惜我得取消见面。","icon":"talk"},{"head":"sich freuen","zh":"期待；高兴","example":"Ich freue mich auf den Abend.","exampleZh":"我期待这个晚上。","icon":"talk"},{"head":"der Besuch","zh":"来访；访客","example":"Wir bekommen morgen Besuch.","exampleZh":"明天有人来拜访我们。","icon":"person"}],"lessons":[{"id":"de-10-1","text":"Ich lade dich am Samstag zum Essen ein.","zh":"我邀请你星期六来吃饭。","tip":"einladen 的 ein 放句末。"},{"id":"de-10-2","text":"Danke für deine Einladung.","zh":"谢谢你的邀请。","tip":"für 后接宾格。"},{"id":"de-10-3","text":"Leider kann ich am Samstag nicht kommen.","zh":"可惜星期六我来不了。","tip":"leider 表达遗憾。"},{"id":"de-10-4","text":"Ich bleibe zu Hause, weil ich Besuch bekomme.","zh":"我在家，因为有客人来。","tip":"weil 从句中 bekomme 在末尾。"},{"id":"de-10-5","text":"Passt dir der Sonntag besser?","zh":"星期日对你更合适吗？","tip":"passen 的对象用第三格 dir。"},{"id":"de-10-6","text":"Soll ich etwas zum Trinken mitbringen?","zh":"我要带点喝的吗？","tip":"etwas zum Trinken 指喝的东西。"}],"dialogue":[{"speaker":"Lena","text":"Möchtest du am Samstag zu mir kommen?","zh":"你星期六想来我家吗？"},{"speaker":"Tao","text":"Leider nicht, weil ich arbeiten muss.","zh":"可惜不行，因为我得上班。"},{"speaker":"Lena","text":"Und am Sonntag? Wir könnten zusammen kochen.","zh":"那星期日呢？我们可以一起做饭。"},{"speaker":"Tao","text":"Gern. Ich bringe Gemüse mit.","zh":"好啊。我带蔬菜。"}],"reading":{"title":"邀请与婉拒：生活片段","text":"Lena möchte am Wochenende Freunde zum Essen einladen. Sie schreibt Tao eine kurze Nachricht. Tao hat am Samstag Dienst und kann deshalb nicht kommen. Er erklärt den Grund und schlägt Sonntag vor. Lena findet die Idee gut. Sie treffen sich um fünf Uhr in ihrer Wohnung und kochen gemeinsam. Tao bringt frisches Gemüse mit, Lena kauft Reis und Getränke. Ein weiterer Freund kommt erst später, weil er vorher noch einen Familienbesuch hat.","zh":"莉娜想周末邀请朋友吃饭，便给涛发消息。涛星期六值班，不能来。他解释原因并提议星期日。莉娜觉得不错。他们五点在她家见面，一起做饭。涛带新鲜蔬菜，莉娜买米和饮料。另一位朋友会晚些来，因为他此前要探望家人。"},"assessment":{"reading":{"title":"邀请与婉拒：独立阅读","text":"Am Freitag feiert Nina ihren Geburtstag im Park. Sie lädt ihre Nachbarin Amal ein und schreibt, dass alle ab siebzehn Uhr kommen können. Amal hat bis achtzehn Uhr einen Kurs. Sie fragt, ob sie später dazukommen darf. Nina freut sich und bittet sie, eine Decke mitzubringen. Essen ist schon genug da. Falls es regnet, treffen sich alle in Ninas Wohnung. Die genaue Adresse schickt Nina am Donnerstag noch einmal."},"questions":[{"prompt":"妮娜庆祝什么？","options":["搬家","毕业","生日"],"answer":2,"explanation":"她庆祝生日。"},{"prompt":"阿玛尔为何晚来？","options":["有课","要做饭","要旅行"],"answer":0,"explanation":"她的课到十八点才结束。"},{"prompt":"请阿玛尔带什么？","options":["蛋糕","毯子","饮料"],"answer":1,"explanation":"妮娜请她带毯子。"},{"prompt":"下雨在哪里聚会？","options":["车站","妮娜家","学校"],"answer":1,"explanation":"下雨去妮娜的公寓。"}],"writing":"围绕“邀请与婉拒”，写5—6个句子。能发出邀请、说明冲突并提出其他时间。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“邀请与婉拒”中的一次真实交流，说出4—6句话。能发出邀请、说明冲突并提出其他时间。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-10","npc":"Lena","place":"公园长椅","scene":"朋友邀请你周末见面。接受、改时间和婉拒都可以礼貌表达。","text":"Hast du am Wochenende Zeit für ein Treffen?","zh":"你周末有时间见个面吗？","icon":"talk"},"support":{"id":"de-10","pronunciation":{"focus":"双元音与从句停顿","explanation":"einladen 的 ei 读双元音；weil 后句末动词不要吞音。","examples":[{"text":"einladen","zh":"邀请"},{"text":"weil","zh":"因为"}]},"grammarNotes":["weil 从句变位动词末位。","einladen 分离，ich lade dich ein 中 dich 为宾格。","passen 接第三格人称，问 Passt dir…?。"],"cultureNote":"婉拒可先感谢再简述不能参加，原因可以保持简短。","vocabularyNotes":[{"head":"einladen","note":"einladen 常接 zu 加第三格，如 zum Essen。"},{"head":"die Einladung","note":"Danke für die Einladung 用宾格感谢邀请。"},{"head":"leider","note":"leider 放句首时后接变位动词。"}],"transfer":[{"id":"de-10-transfer-1","prompt":"邀请野餐","text":"Ich lade dich am Sonntag zu einem Picknick ein.","zh":"我邀请你周日野餐。","explanation":"zu 后第三格，ein 置末。"},{"id":"de-10-transfer-2","prompt":"感谢生日邀请","text":"Vielen Dank für die Einladung zu deinem Geburtstag.","zh":"谢谢你邀请我过生日。","explanation":"zu 后第三格 deinem。"},{"id":"de-10-transfer-3","prompt":"说明已有安排","text":"Leider habe ich an dem Abend schon etwas vor.","zh":"很遗憾那晚我已有安排。","explanation":"vorhaben 分离。"},{"id":"de-10-transfer-4","prompt":"因照看孩子婉拒","text":"Ich kann nicht mitkommen, weil ich auf mein Kind aufpassen muss.","zh":"我不能一起去，因为要照看孩子。","explanation":"weil 从句以 muss 结尾。"},{"id":"de-10-transfer-5","prompt":"提议周三午餐","text":"Würde dir ein Mittagessen am Mittwoch passen?","zh":"周三午饭适合你吗？","explanation":"dir 为第三格。"},{"id":"de-10-transfer-6","prompt":"询问带甜点","text":"Soll ich einen Nachtisch für alle mitbringen?","zh":"我要给大家带甜点吗？","explanation":"mitbringen 原形置末。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Ich bleibe hier, weil ich arbeiten muss.","Ich bleibe hier, weil ich muss arbeiten.","Ich bleibe hier, weil muss ich arbeiten."],"answer":0,"explanation":"weil 从句以变位 muss 结尾。"},{"prompt":"选择语法与词序正确的句子。","options":["Passen dir der Abend?","Passt dir der Abend?","Passt dich der Abend?"],"answer":1,"explanation":"passen 接第三格 dir，Abend 单数。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich einlade euch zum Essen.","Ich lade ihr zum Essen ein.","Ich lade euch zum Essen ein."],"answer":2,"explanation":"邀请对象用宾格 euch，ein 置末。"}],"writingChecklist":["逐句核对：weil 从句变位动词末位。","检查本章表达：einladen 分离，ich lade dich ein 中 dich 为宾格。","写入具体情境细节，并核对：passen 接第三格人称，问 Passt dir…?。"],"speakingFollowups":["周日午餐对你更方便吗？","我需要带些吃的来吗？","你希望我们几点离开？"]}},{"id":"de-11","number":11,"title":"电话预约与改期","level":"A2","stage":"beginner","goal":"能通过电话改期并确认新时间。","grammar":{"title":"könnten 委婉请求","explanation":"Könnten wir …? 是委婉的建议。von … auf … 可表达从原预约时间改到新的时间。","examples":[{"text":"Ich möchte einen Termin vereinbaren.","zh":"我想约一个时间。"},{"text":"Könnten wir den Termin verschieben?","zh":"我们能改一下预约时间吗？"}]},"vocab":[{"head":"vereinbaren","zh":"约定","example":"Ich möchte einen Termin vereinbaren.","exampleZh":"我想约一个时间。","icon":"time"},{"head":"verschieben","zh":"改期","example":"Könnten wir den Termin verschieben?","exampleZh":"我们能改一下预约时间吗？","icon":"time"},{"head":"frei","zh":"空闲的","example":"Haben Sie am Freitag etwas frei?","exampleZh":"您星期五有空位吗？","icon":"time"},{"head":"bestätigen","zh":"确认","example":"Könnten Sie mir die Uhrzeit bestätigen?","exampleZh":"您能向我确认时间吗？","icon":"talk"},{"head":"erreichen","zh":"联系上","example":"Unter dieser Nummer erreichen Sie mich.","exampleZh":"拨这个号码能联系到我。","icon":"talk"},{"head":"zurückrufen","zh":"回电话","example":"Ich rufe Sie morgen zurück.","exampleZh":"我明天给您回电话。","icon":"talk"},{"head":"der Anruf","zh":"来电","example":"Danke für Ihren Anruf.","exampleZh":"谢谢您的来电。","icon":"talk"},{"head":"besetzt","zh":"占线的","example":"Die Leitung ist gerade besetzt.","exampleZh":"线路现在占线。","icon":"talk"},{"head":"die Nachricht","zh":"消息","example":"Ich hinterlasse eine Nachricht.","exampleZh":"我留个消息。","icon":"talk"},{"head":"der Kalender","zh":"日程表","example":"Ich schaue in meinen Kalender.","exampleZh":"我看一下日程表。","icon":"time"}],"lessons":[{"id":"de-11-1","text":"Ich möchte einen Termin vereinbaren.","zh":"我想约一个时间。","tip":"einen Termin vereinbaren 是常用搭配。"},{"id":"de-11-2","text":"Könnten wir den Termin verschieben?","zh":"我们能改一下预约时间吗？","tip":"Könnten 表示委婉请求。"},{"id":"de-11-3","text":"Haben Sie am Freitag etwas frei?","zh":"您星期五有空位吗？","tip":"frei 指尚可预约。"},{"id":"de-11-4","text":"Könnten Sie mir die Uhrzeit bestätigen?","zh":"您能向我确认时间吗？","tip":"mir 是第三格对象。"},{"id":"de-11-5","text":"Unter dieser Nummer erreichen Sie mich.","zh":"拨这个号码能联系到我。","tip":"Unter dieser Nummer 表示联系方式。"},{"id":"de-11-6","text":"Ich rufe Sie morgen zurück.","zh":"我明天给您回电话。","tip":"zurückrufen 在主句中拆开。"}],"dialogue":[{"speaker":"Kunde","text":"Ich habe morgen um zehn einen Termin bei Ihnen.","zh":"我明天十点在您那里有预约。"},{"speaker":"Salon","text":"Wie ist Ihr Name, bitte?","zh":"请问您的姓名是？"},{"speaker":"Kunde","text":"Zhao. Könnten wir den Termin auf Freitag verschieben?","zh":"赵。我们能改到星期五吗？"},{"speaker":"Salon","text":"Am Freitag ist um vierzehn Uhr noch etwas frei.","zh":"星期五十四点还有空位。"}],"reading":{"title":"电话预约与改期：生活片段","text":"Herr Zhao hat einen Termin im Friseursalon. Am Tag davor erfährt er, dass er länger arbeiten muss. Er ruft im Salon an und bittet um einen neuen Termin. Die Mitarbeiterin fragt nach seinem Namen und findet die Buchung im Kalender. Am Freitag um vierzehn Uhr ist noch ein Platz frei. Herr Zhao nimmt den Termin an und wiederholt Datum und Uhrzeit. Die Mitarbeiterin bestätigt beides. Er trägt den neuen Termin sofort in sein Handy ein.","zh":"赵先生在理发店有预约。前一天他得知要加班，于是打电话请求改时间。员工问了他的姓名，在日程表里找到预约。星期五十四点还有空位。赵先生接受了时段，复述了日期和时间。员工确认无误。他马上把新预约记到手机里。"},"assessment":{"reading":{"title":"电话预约与改期：独立阅读","text":"Eine Fahrradwerkstatt hat Lea für Mittwoch um fünfzehn Uhr eingeplant. Nun muss Lea an diesem Tag ihre Tochter abholen. Sie ruft am Montag an und fragt nach einem anderen Termin. Der Mechaniker bietet Donnerstagmorgen oder Freitagnachmittag an. Donnerstag passt Lea nicht, weil sie früh arbeitet. Sie entscheidet sich für Freitag um sechzehn Uhr. Das Fahrrad soll sie zehn Minuten vorher bringen. Lea notiert sich auch die neue Adresse der Werkstatt."},"questions":[{"prompt":"原预约何时？","options":["星期三十五点","星期四早晨","星期五十六点"],"answer":0,"explanation":"原定星期三十五点。"},{"prompt":"为何改期？","options":["车修好了","店搬家了","要接女儿"],"answer":2,"explanation":"她需要接女儿。"},{"prompt":"新预约何时？","options":["星期四九点","星期五十六点","星期五十五点"],"answer":1,"explanation":"她选择星期五十六点。"},{"prompt":"应提前多久送车？","options":["半小时","一小时","十分钟"],"answer":2,"explanation":"应提前十分钟送车。"}],"writing":"围绕“电话预约与改期”，写5—6个句子。能通过电话改期并确认新时间。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“电话预约与改期”中的一次真实交流，说出4—6句话。能通过电话改期并确认新时间。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-11","npc":"Jonas","place":"电话预约台","scene":"你要打电话预约或改期。先说清来意，再核对日期与钟点。","text":"Möchten Sie einen Termin vereinbaren oder verschieben?","zh":"您想预约，还是更改预约？","icon":"time"},"support":{"id":"de-11","pronunciation":{"focus":"ö 与 ü","explanation":"könnten 的 ö 舌位近 e 且圆唇，zurück 的 ü 舌位近 i 且圆唇。","examples":[{"text":"könnten","zh":"可以，委婉式"},{"text":"zurück","zh":"回来"}]},"grammarNotes":["Könnten Sie 加句末原形使请求委婉。","bestätigen 接第三格人和宾格内容。","zurückrufen 可分，主句 rufe…zurück。"],"cultureNote":"电话先报姓名与来意，复述日期时间有助减少误会。","vocabularyNotes":[{"head":"vereinbaren","note":"einen Termin vereinbaren 是商定预约。"},{"head":"verschieben","note":"verschieben auf Freitag 是改到周五。"},{"head":"frei","note":"frei 可表示空闲，etwas frei 问有无空位。"}],"transfer":[{"id":"de-11-transfer-1","prompt":"预约演示","text":"Ich würde gern einen Termin für eine Vorführung vereinbaren.","zh":"我想预约一次演示。","explanation":"würde gern 配原形。"},{"id":"de-11-transfer-2","prompt":"改到下周","text":"Könnten wir unseren Termin auf nächste Woche verschieben?","zh":"我们能把预约改到下周吗？","explanation":"auf 后给出目标时间。"},{"id":"de-11-transfer-3","prompt":"问周二上午空位","text":"Wäre am Dienstagvormittag noch ein Termin frei?","zh":"周二上午还有时段吗？","explanation":"wäre 为委婉询问。"},{"id":"de-11-transfer-4","prompt":"请邮件确认地点","text":"Könnten Sie mir den Ort per E-Mail bestätigen?","zh":"您能邮件确认地点吗？","explanation":"mir 第三格，Ort 宾格。"},{"id":"de-11-transfer-5","prompt":"说明下午可联系","text":"Am Nachmittag bin ich unter dieser Nummer erreichbar.","zh":"下午可通过此号码联系我。","explanation":"时间置首后 bin 第二位。"},{"id":"de-11-transfer-6","prompt":"午休后回电","text":"Nach der Mittagspause rufe ich Sie zurück.","zh":"午休后我给您回电。","explanation":"zurück 置末，Sie 宾格。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Könnten Sie mir hilft?","Könnten Sie mir helfen?","Könnten Sie mich helfen?"],"answer":1,"explanation":"helfen 接第三格，情态动词后原形。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich zurückrufe morgen.","Ich rufen morgen zurück.","Ich rufe morgen zurück."],"answer":2,"explanation":"zurückrufen 主句分离，ich 配 rufe。"},{"prompt":"选择语法与词序正确的句子。","options":["Bitte bestätigen Sie mir den Termin.","Bitte bestätigen Sie mich den Termin.","Bitte bestätigt Sie mir den Termin."],"answer":0,"explanation":"接受者 mir 第三格，内容 den Termin 宾格。"}],"writingChecklist":["逐句核对：Könnten Sie 加句末原形使请求委婉。","检查本章表达：bestätigen 接第三格人和宾格内容。","写入具体情境细节，并核对：zurückrufen 可分，主句 rufe…zurück。"],"speakingFollowups":["您下周哪天下午有空？","您能把新时间发到我的邮箱吗？","如果没接到电话，我什么时候再打比较合适？"]}},{"id":"de-12","number":12,"title":"出行计划与旅行经历","level":"A2","stage":"beginner","goal":"能比较交通选择并讲述一次短途旅行。","grammar":{"title":"完成时的助动词","explanation":"fahren、ankommen 在表示位移时用 sein 构成完成时；buchen、verpassen 用 haben。过去分词放句末。","examples":[{"text":"Ich bin gestern nach Köln gefahren.","zh":"我昨天乘车去了科隆。"},{"text":"Wir haben die Fahrkarten online gebucht.","zh":"我们网上订了车票。"}]},"vocab":[{"head":"fahren","zh":"乘车；行驶","example":"Ich bin gestern nach Köln gefahren.","exampleZh":"我昨天乘车去了科隆。","icon":"travel"},{"head":"buchen","zh":"预订","example":"Wir haben die Fahrkarten online gebucht.","exampleZh":"我们网上订了车票。","icon":"travel"},{"head":"die Verspätung","zh":"晚点","example":"Der Zug hatte zwanzig Minuten Verspätung.","exampleZh":"火车晚点二十分钟。","icon":"travel"},{"head":"ankommen","zh":"到达","example":"Wir sind am Mittag angekommen.","exampleZh":"我们中午到了。","icon":"travel"},{"head":"der Anschluss","zh":"接续交通","example":"Ich habe meinen Anschluss verpasst.","exampleZh":"我错过了接续的车。","icon":"travel"},{"head":"die Rückfahrt","zh":"返程","example":"Die Rückfahrt dauert zwei Stunden.","exampleZh":"返程需要两个小时。","icon":"travel"},{"head":"der Ausflug","zh":"短途出游","example":"Unser Ausflug war sehr schön.","exampleZh":"我们的短途出游很愉快。","icon":"travel"},{"head":"der Bahnsteig","zh":"站台","example":"Wir warten auf dem Bahnsteig.","exampleZh":"我们在站台等候。","icon":"travel"},{"head":"direkt","zh":"直达的","example":"Dieser Zug fährt direkt nach Bonn.","exampleZh":"这班火车直达波恩。","icon":"travel"},{"head":"vergleichen","zh":"比较","example":"Wir vergleichen die Preise.","exampleZh":"我们比较价格。","icon":"money"}],"lessons":[{"id":"de-12-1","text":"Ich bin gestern nach Köln gefahren.","zh":"我昨天乘车去了科隆。","tip":"位移用 bin gefahren。"},{"id":"de-12-2","text":"Wir haben die Fahrkarten online gebucht.","zh":"我们网上订了车票。","tip":"buchen 用 haben。"},{"id":"de-12-3","text":"Der Zug hatte zwanzig Minuten Verspätung.","zh":"火车晚点二十分钟。","tip":"hatte 是 haben 过去时。"},{"id":"de-12-4","text":"Wir sind am Mittag angekommen.","zh":"我们中午到了。","tip":"ankommen 分词为 angekommen。"},{"id":"de-12-5","text":"Ich habe meinen Anschluss verpasst.","zh":"我错过了接续的车。","tip":"verpassen 分词无 ge-。"},{"id":"de-12-6","text":"Die Rückfahrt dauert zwei Stunden.","zh":"返程需要两个小时。","tip":"Rückfahrt 指返程。"}],"dialogue":[{"speaker":"Anna","text":"Wie war dein Ausflug nach Köln?","zh":"你去科隆出游怎么样？"},{"speaker":"Bo","text":"Schön, aber der Zug hatte Verspätung.","zh":"很不错，但火车晚点了。"},{"speaker":"Anna","text":"Habt ihr trotzdem das Museum besucht?","zh":"你们还是参观了博物馆吗？"},{"speaker":"Bo","text":"Ja, wir haben dort zwei Stunden verbracht.","zh":"是的，我们在那里待了两个小时。"}],"reading":{"title":"出行计划与旅行经历：生活片段","text":"Anna und Bo planen einen Ausflug nach Köln. Sie vergleichen zuerst verschiedene Zugverbindungen. Ein direkter Zug kostet etwas mehr, aber sie müssen nicht umsteigen. Deshalb buchen sie diese Verbindung. Am Samstag hat der Zug zwanzig Minuten Verspätung. Trotzdem kommen sie rechtzeitig zum Museumsbesuch an. Sie sehen eine Ausstellung und essen danach am Fluss. Am Abend fahren sie müde zurück. Bo schreibt später eine Nachricht an seine Schwester und erzählt von dem schönen Tag.","zh":"安娜和博计划去科隆出游。他们先比较不同火车路线。直达车稍贵，但不用换乘，所以订了这趟车。星期六火车晚点二十分钟，但他们仍及时赶到博物馆。他们看展览后在河边吃饭。晚上他们疲惫地返回。随后博给姐姐或妹妹发消息，讲述愉快的一天。"},"assessment":{"reading":{"title":"出行计划与旅行经历：独立阅读","text":"Letzten Sonntag ist Karim mit zwei Freunden an einen See gefahren. Sie wollten zuerst den Bus nehmen, aber am Sonntag fuhr er nur selten. Deshalb sind sie mit dem Fahrrad gefahren. Die Fahrt hat eine Stunde gedauert. Am See haben sie Brot und Obst gegessen. Zum Schwimmen war das Wasser zu kalt. Nach einem langen Spaziergang sind sie zurückgefahren. Karim möchte im Sommer wiederkommen und dann vielleicht ein Boot mieten."},"questions":[{"prompt":"最后怎样去湖边？","options":["公交车","自行车","火车"],"answer":1,"explanation":"公交班次少，所以骑车去了。"},{"prompt":"骑去用了多久？","options":["一小时","半小时","两小时"],"answer":0,"explanation":"车程一小时。"},{"prompt":"为什么没游泳？","options":["忘带泳衣","天黑了","水太冷"],"answer":2,"explanation":"水太冷。"},{"prompt":"夏天可能想做什么？","options":["学开车","租船","搬家"],"answer":1,"explanation":"卡里姆想也许租船。"}],"writing":"围绕“出行计划与旅行经历”，写5—6个句子。能比较交通选择并讲述一次短途旅行。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“出行计划与旅行经历”中的一次真实交流，说出4—6句话。能比较交通选择并讲述一次短途旅行。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-12","npc":"Mia","place":"车站候车区","scene":"你们聊起旅行。试着说清计划，也讲讲过去遇到的小插曲。","text":"Wohin möchten Sie reisen und wie kommen Sie dorthin?","zh":"您想去哪里旅行，怎么去那里？","icon":"travel"},"support":{"id":"de-12","pronunciation":{"focus":"过去分词长元音","explanation":"gefahren 的 h 表示前元音长，不另发音；angekommen 保留 an 重音。","examples":[{"text":"gefahren","zh":"乘车去了"},{"text":"angekommen","zh":"到了"}]},"grammarNotes":["位移 fahren、ankommen 完成时通常用 sein。","buchen、verpassen 完成时用 haben。","过去分词置末，时间置首不改变分词位置。"],"cultureNote":"谈行程可报具体班次与目的地，延误后选择以实际交通信息为准。","vocabularyNotes":[{"head":"fahren","note":"fahren 位移完成时 ist gefahren。"},{"head":"buchen","note":"buchen 分词 gebucht，接宾格票或住宿。"},{"head":"die Verspätung","note":"mit einer Verspätung von…表示晚点多久。"}],"transfer":[{"id":"de-12-transfer-1","prompt":"叙述海边旅行","text":"Wir sind am Wochenende an die Ostsee gefahren.","zh":"周末我们去了波罗的海海边。","explanation":"位移 fahren 用 sein。"},{"id":"de-12-transfer-2","prompt":"预订夜车座位","text":"Ich habe einen Platz im Nachtzug gebucht.","zh":"我订了夜车座位。","explanation":"buchen 用 haben。"},{"id":"de-12-transfer-3","prompt":"说明巴士晚点","text":"Unser Bus hatte eine halbe Stunde Verspätung.","zh":"公交晚点半小时。","explanation":"hatte 是 haben 过去时。"},{"id":"de-12-transfer-4","prompt":"日落后抵达","text":"Wir sind erst nach Sonnenuntergang angekommen.","zh":"我们日落后才到。","explanation":"ankommen 用 sein。"},{"id":"de-12-transfer-5","prompt":"错过末班车","text":"Ich habe den letzten Bus verpasst.","zh":"我错过末班公交。","explanation":"verpasst 不加 ge-。"},{"id":"de-12-transfer-6","prompt":"说明返程时间","text":"Mit dem Fernbus dauert die Rückfahrt fast vier Stunden.","zh":"乘长途巴士返程近四小时。","explanation":"方式置首后 dauert 第二位。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Wir haben nach Bremen gefahren.","Wir sind nach Bremen gefahrt.","Wir sind nach Bremen gefahren."],"answer":2,"explanation":"位移用 sein，分词为 gefahren。"},{"prompt":"选择语法与词序正确的句子。","options":["Sie hat die Tickets gebucht.","Sie ist die Tickets gebucht.","Sie hat die Tickets gebuchen."],"answer":0,"explanation":"buchen 用 haben 和 gebucht。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich bin spät ankommen.","Ich bin spät angekommen.","Ich habe spät angekommen."],"answer":1,"explanation":"ankommen 完成时 bin…angekommen。"}],"writingChecklist":["逐句核对：位移 fahren、ankommen 完成时通常用 sein。","检查本章表达：buchen、verpassen 完成时用 haben。","写入具体情境细节，并核对：过去分词置末，时间置首不改变分词位置。"],"speakingFollowups":["您最后是怎么到达目的地的？","返程还需要换乘吗？","您买的是哪一班车的票？"]}},{"id":"de-13","number":13,"title":"租房提问与比较","level":"B1","stage":"intermediate","goal":"能询问租金构成、设施和看房条件，比较实际需求。","grammar":{"title":"间接疑问句","explanation":"礼貌询问信息可用 Können Sie mir sagen, ob …? 或 wie …?。间接问句中变位动词放末尾。是否问题用 ob。","examples":[{"text":"Wie hoch ist die monatliche Miete?","zh":"每月租金是多少？"},{"text":"Können Sie erklären, was die Nebenkosten enthalten?","zh":"您能解释杂费包含什么吗？"}]},"vocab":[{"head":"die Miete","zh":"租金","example":"Wie hoch ist die monatliche Miete?","exampleZh":"每月租金是多少？","icon":"money"},{"head":"die Nebenkosten","zh":"杂费；附加费用","example":"Können Sie erklären, was die Nebenkosten enthalten?","exampleZh":"您能解释杂费包含什么吗？","icon":"money"},{"head":"die Besichtigung","zh":"看房","example":"Ich würde gern eine Besichtigung vereinbaren.","exampleZh":"我想约个时间看房。","icon":"home"},{"head":"die Kaution","zh":"押金","example":"Wann soll die Kaution bezahlt werden?","exampleZh":"押金应当何时支付？","icon":"money"},{"head":"möbliert","zh":"带家具的","example":"Ich möchte wissen, ob das Zimmer möbliert ist.","exampleZh":"我想知道房间是否带家具。","icon":"home"},{"head":"der Mietvertrag","zh":"租赁合同","example":"Ich möchte den Mietvertrag in Ruhe lesen.","exampleZh":"我想仔细阅读租赁合同。","icon":"home"},{"head":"die Heizung","zh":"暖气","example":"Sind die Kosten für die Heizung enthalten?","exampleZh":"费用里包含暖气费吗？","icon":"home"},{"head":"die Wohnfläche","zh":"居住面积","example":"Wie groß ist die Wohnfläche?","exampleZh":"居住面积有多大？","icon":"home"},{"head":"der Vermieter","zh":"房东","example":"Der Vermieter beantwortet meine Fragen schriftlich.","exampleZh":"房东书面回答了我的问题。","icon":"person"},{"head":"verfügbar","zh":"可用的；可入住的","example":"Ab wann ist die Wohnung verfügbar?","exampleZh":"公寓何时起可以入住？","icon":"home"}],"lessons":[{"id":"de-13-1","text":"Wie hoch ist die monatliche Miete?","zh":"每月租金是多少？","tip":"Wie hoch 询问金额高低。"},{"id":"de-13-2","text":"Können Sie erklären, was die Nebenkosten enthalten?","zh":"您能解释杂费包含什么吗？","tip":"was 引导的间接问句将 enthalten 放末尾。"},{"id":"de-13-3","text":"Ich würde gern eine Besichtigung vereinbaren.","zh":"我想约个时间看房。","tip":"würde gern 表示委婉愿望。"},{"id":"de-13-4","text":"Wann soll die Kaution bezahlt werden?","zh":"押金应当何时支付？","tip":"被动态 bezahlt werden 询问安排而非假定法规。"},{"id":"de-13-5","text":"Ich möchte wissen, ob das Zimmer möbliert ist.","zh":"我想知道房间是否带家具。","tip":"ob 引导是否问句。"},{"id":"de-13-6","text":"Ich möchte den Mietvertrag in Ruhe lesen.","zh":"我想仔细阅读租赁合同。","tip":"in Ruhe 表示从容仔细地。"}],"dialogue":[{"speaker":"Interessentin","text":"Können Sie mir sagen, ob die Heizkosten enthalten sind?","zh":"您能告诉我是否包含暖气费吗？"},{"speaker":"Vermieter","text":"In diesem Angebot sind sie enthalten, Strom aber nicht.","zh":"这份报价包含暖气费，但不含电费。"},{"speaker":"Interessentin","text":"Dürfte ich vor einer Entscheidung den Vertrag lesen?","zh":"我能在决定前阅读合同吗？"},{"speaker":"Vermieter","text":"Natürlich. Ich schicke Ihnen einen Entwurf.","zh":"当然。我给您发一份草案。"}],"reading":{"title":"租房提问与比较：生活片段","text":"Mina sucht eine Wohnung näher an ihrer Arbeitsstelle. Eine Anzeige nennt eine günstige Miete, erklärt aber die Nebenkosten nicht genau. Bei der Besichtigung fragt Mina deshalb nach Strom, Heizung und Internet. Außerdem möchte sie wissen, wie laut die Straße am Abend ist. Der Vermieter beantwortet einige Fragen sofort und verspricht, die übrigen Angaben schriftlich zu schicken. Mina unterschreibt noch nichts. Zuerst möchte sie die gesamten monatlichen Kosten mit denen einer zweiten Wohnung vergleichen.","zh":"米娜想找离工作地点更近的公寓。一个广告标价便宜，但没有详细说明杂费。看房时她询问电、暖气和网络，还想知道晚上街道多吵。房东当场回答了一些问题，并答应书面发送其余信息。米娜暂不签字，想先把每月总支出与另一套公寓比较。"},"assessment":{"reading":{"title":"租房提问与比较：独立阅读","text":"Tarek besichtigt zwei Zimmer in einer Wohngemeinschaft. Das erste liegt nahe der Hochschule und hat schon ein Bett und einen Schreibtisch. Das zweite ist größer, liegt aber vierzig Minuten entfernt und ist leer. Bei beiden Angeboten muss Tarek die genauen Kosten noch klären. Er arbeitet oft abends an Studienprojekten und braucht einen ruhigen Platz. Deshalb möchte er die erste Wohnung noch einmal am Abend besuchen, bevor er sich entscheidet."},"questions":[{"prompt":"第一间房有什么？","options":["床和书桌","只有衣柜","没有家具"],"answer":0,"explanation":"第一间已有床和书桌。"},{"prompt":"第二间房的不足是什么？","options":["更小","没有窗户","距离较远且空置无家具"],"answer":2,"explanation":"它四十分钟路程且没有家具。"},{"prompt":"两份报价都需澄清什么？","options":["室友姓名","具体费用","大学地址"],"answer":1,"explanation":"两者的准确费用都还需澄清。"},{"prompt":"塔雷克为何想晚上再看第一间？","options":["确认安静程度","量床的尺寸","去交押金"],"answer":0,"explanation":"他晚上常做项目，需要安静空间。"}],"writing":"围绕“租房提问与比较”，写80—100个德语词。能询问租金构成、设施和看房条件，比较实际需求。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“租房提问与比较”中的一次真实交流，持续约一分钟。能询问租金构成、设施和看房条件，比较实际需求。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-13","npc":"Lena","place":"看房现场","scene":"房子看上去不错。作决定前，先把租金、费用和条件问清楚。","text":"Was möchten Sie über die Wohnung wissen?","zh":"关于这套住房，您想了解什么？","icon":"home"},"support":{"id":"de-13","pronunciation":{"focus":"复合名词分块","expla
