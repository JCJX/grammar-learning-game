nation":"Nebenkosten 分 Neben 和 Kosten 练读；möbliert 的 ö 保持圆唇。","examples":[{"text":"Nebenkosten","zh":"附加费用"},{"text":"möbliert","zh":"配家具的"}]},"grammarNotes":["间接疑问句变位动词放末尾。","是否用 ob 引导，不用表示条件的 wenn。","würde gern 加原形，不与 möchte 叠用。"],"cultureNote":"看房可分别核对费用、家具与入住时间，合同条件需双方确认。","vocabularyNotes":[{"head":"die Miete","note":"Wie hoch ist die Miete? 问租金数额。"},{"head":"die Nebenkosten","note":"Nebenkosten 通常用复数，动词配 sind。"},{"head":"die Besichtigung","note":"eine Besichtigung vereinbaren 为约看房。"}],"transfer":[{"id":"de-13-transfer-1","prompt":"询问总租金","text":"Wie hoch ist die Miete einschließlich der Nebenkosten?","zh":"含附加费用租金是多少？","explanation":"einschließlich 后第二格。"},{"id":"de-13-transfer-2","prompt":"核对取暖费","text":"Können Sie mir sagen, ob die Heizkosten enthalten sind?","zh":"您能告诉我取暖费是否包含？","explanation":"ob 从句 sind 置末。"},{"id":"de-13-transfer-3","prompt":"约周六看房","text":"Ich würde die Wohnung gern am Samstag besichtigen.","zh":"我想周六看房。","explanation":"würde 配 besichtigen。"},{"id":"de-13-transfer-4","prompt":"问押金截止","text":"Bis wann muss ich die Kaution überweisen?","zh":"我最晚何时要转账付押金？","explanation":"muss 后原形置末。"},{"id":"de-13-transfer-5","prompt":"问有无书桌","text":"Ich möchte wissen, ob im Zimmer ein Schreibtisch steht.","zh":"我想知道房间是否有书桌。","explanation":"间接疑问用 ob。"},{"id":"de-13-transfer-6","prompt":"请求带合同回家","text":"Darf ich den Vertrag mitnehmen und zu Hause lesen?","zh":"我能把合同带回家读吗？","explanation":"两个原形共用 darf。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Ich frage, ob das Zimmer frei ist.","Ich frage, ob ist das Zimmer frei.","Ich frage, wenn das Zimmer frei ist."],"answer":0,"explanation":"是否用 ob，动词置末。"},{"prompt":"选择语法与词序正确的句子。","options":["Können Sie sagen, wann die Besichtigung beginnen?","Können Sie sagen, wann die Besichtigung beginnt?","Können Sie sagen, wann beginnt die Besichtigung?"],"answer":1,"explanation":"间接疑问末位为 beginnt。"},{"prompt":"选择语法与词序正确的句子。","options":["Die Nebenkosten ist hoch.","Die Nebenkosten sein hoch.","Die Nebenkosten sind hoch."],"answer":2,"explanation":"复数 Nebenkosten 配 sind。"}],"writingChecklist":["逐句核对：间接疑问句变位动词放末尾。","检查本章表达：是否用 ob 引导，不用表示条件的 wenn。","写入具体情境细节，并核对：würde gern 加原形，不与 möchte 叠用。"],"speakingFollowups":["租金里包含取暖费吗？","房间里现有哪些家具？","我能先拿合同回去阅读吗？"]}},{"id":"de-14","number":14,"title":"协调多个预约","level":"B1","stage":"intermediate","goal":"能说明时间冲突、提出替代方案并确认安排。","grammar":{"title":"obwohl 与 trotzdem","explanation":"obwohl 引导让步从句，变位动词在末尾；trotzdem 可连接新的主句，置于句首时后面紧接变位动词。","examples":[{"text":"Es gibt eine Überschneidung mit meinem Kurs.","zh":"这与我的课程时间冲突。"},{"text":"Obwohl ich früh angerufen habe, kann ich den Termin nicht verschieben.","zh":"虽然我很早打了电话，仍无法改期。"}]},"vocab":[{"head":"die Überschneidung","zh":"时间冲突","example":"Es gibt eine Überschneidung mit meinem Kurs.","exampleZh":"这与我的课程时间冲突。","icon":"time"},{"head":"verschieben","zh":"改期","example":"Obwohl ich früh angerufen habe, kann ich den Termin nicht verschieben.","exampleZh":"虽然我很早打了电话，仍无法改期。","icon":"time"},{"head":"stattfinden","zh":"举行","example":"Die Beratung findet am Dienstag statt.","exampleZh":"咨询安排在星期二。","icon":"time"},{"head":"die Bestätigung","zh":"确认函；确认","example":"Ich brauche eine schriftliche Bestätigung.","exampleZh":"我需要书面确认。","icon":"talk"},{"head":"die Alternative","zh":"替代方案","example":"Gibt es eine Alternative am Nachmittag?","exampleZh":"下午有替代时段吗？","icon":"time"},{"head":"rechtzeitig","zh":"及时地","example":"Bitte sagen Sie rechtzeitig ab.","exampleZh":"请及时取消预约。","icon":"time"},{"head":"die Beratung","zh":"咨询","example":"Die Beratung dauert ungefähr eine Stunde.","exampleZh":"咨询大约一小时。","icon":"talk"},{"head":"verhindert","zh":"因故无法参加的","example":"Am Mittwoch bin ich leider verhindert.","exampleZh":"星期三我有事不能参加。","icon":"time"},{"head":"der Zeitraum","zh":"时间段","example":"In diesem Zeitraum bin ich flexibel.","exampleZh":"这段时间内我可以灵活安排。","icon":"time"},{"head":"eintragen","zh":"记入","example":"Ich trage beide Termine in den Kalender ein.","exampleZh":"我把两个预约都记入日程表。","icon":"time"}],"lessons":[{"id":"de-14-1","text":"Es gibt eine Überschneidung mit meinem Kurs.","zh":"这与我的课程时间冲突。","tip":"mit 后用第三格 meinem Kurs。"},{"id":"de-14-2","text":"Obwohl ich früh angerufen habe, kann ich den Termin nicht verschieben.","zh":"虽然我很早打了电话，仍无法改期。","tip":"obwohl 从句的 habe 在末尾。"},{"id":"de-14-3","text":"Die Beratung findet am Dienstag statt.","zh":"咨询安排在星期二。","tip":"stattfinden 的 statt 放主句末尾。"},{"id":"de-14-4","text":"Ich brauche eine schriftliche Bestätigung.","zh":"我需要书面确认。","tip":"schriftlich 表示书面的。"},{"id":"de-14-5","text":"Gibt es eine Alternative am Nachmittag?","zh":"下午有替代时段吗？","tip":"am Nachmittag 指下午时段。"},{"id":"de-14-6","text":"Bitte sagen Sie rechtzeitig ab.","zh":"请及时取消预约。","tip":"rechtzeitig 指留出足够提前量。"}],"dialogue":[{"speaker":"Kundin","text":"Leider überschneidet sich die Beratung mit meinem Kurs.","zh":"可惜咨询与我的课程冲突。"},{"speaker":"Berater","text":"Könnten Sie am Donnerstag um elf kommen?","zh":"您星期四十一点能来吗？"},{"speaker":"Kundin","text":"Ja. Bekomme ich eine Bestätigung per E-Mail?","zh":"可以。我会收到邮件确认吗？"},{"speaker":"Berater","text":"Ja, ich schicke sie Ihnen heute.","zh":"会的，我今天发给您。"}],"reading":{"title":"协调多个预约：生活片段","text":"Nora hat am Dienstag einen Beratungstermin und am selben Vormittag eine wichtige Prüfung. Obwohl sie beide Termine früh geplant hat, bemerkt sie die Überschneidung erst am Wochenende. Sie schreibt eine E-Mail und nennt zwei mögliche Ersatztermine. Am Montag erhält sie einen Anruf. Die Beratung kann am Donnerstag stattfinden. Nora wiederholt die neue Uhrzeit und bittet um eine schriftliche Bestätigung. Danach löscht sie den alten Eintrag aus ihrem Kalender, damit sie später nicht durcheinanderkommt.","zh":"诺拉星期二有咨询预约，同日上午还有重要考试。虽然两个安排都很早就定了，她到周末才发现冲突。她发邮件给出两个备选时间。星期一对方来电，说可改到星期四。她复述新时间并要求书面确认，随后删除日历中的旧记录，以免混淆。"},"assessment":{"reading":{"title":"协调多个预约：独立阅读","text":"Für einen Computerkurs hat Emil am Freitag ein Aufnahmegespräch vereinbart. Am Donnerstag erfährt er, dass seine Arbeitsbesprechung länger dauern wird und bis in den Freitagvormittag reicht. Er ruft das Kursbüro an. Ein Videogespräch am Freitagabend wäre möglich, ein persönliches Gespräch erst am Montag. Emil möchte die Räume kennenlernen und entscheidet sich für Montag. Das Büro bittet ihn, vorher einen kurzen Fragebogen auszufüllen. Die Bestätigung kommt anschließend per E-Mail."},"questions":[{"prompt":"埃米尔原本约了什么？","options":["体检","课程面谈","搬家"],"answer":1,"explanation":"他约了计算机课程的面谈。"},{"prompt":"为什么出现冲突？","options":["工作会议延长","生病","火车取消"],"answer":0,"explanation":"工作会议会延续到星期五上午。"},{"prompt":"他选择哪个方案？","options":["周五晚视频","周五早到访","周一面谈"],"answer":2,"explanation":"他想看看场地，选周一到访。"},{"prompt":"面谈前需做什么？","options":["付押金","填写简短问卷","购买电脑"],"answer":1,"explanation":"办公室请他提前填问卷。"}],"writing":"围绕“协调多个预约”，写80—100个德语词。能说明时间冲突、提出替代方案并确认安排。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“协调多个预约”中的一次真实交流，持续约一分钟。能说明时间冲突、提出替代方案并确认安排。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-14","npc":"Jonas","place":"日程安排桌","scene":"几个预约撞在一起。解释冲突，再提出可以协调的时间。","text":"Welche Termine überschneiden sich bei Ihnen?","zh":"您的哪些预约时间冲突了？","icon":"time"},"support":{"id":"de-14","pronunciation":{"focus":"st 辅音连缀","explanation":"stattfinden 起首 st 常读 sht，Bestätigung 词中 st 通常读 st。","examples":[{"text":"Bestätigung","zh":"确认"},{"text":"stattfinden","zh":"举行"}]},"grammarNotes":["obwohl 从句动词置末。","trotzdem 是主句副词，后接变位动词。","stattfinden 主句为 findet…statt。"],"cultureNote":"协调预约宜说明不可用时间并给备选时段，确认函需核对。","vocabularyNotes":[{"head":"die Überschneidung","note":"Überschneidung mit 加第三格说明冲突。"},{"head":"verschieben","note":"einen Termin auf Montag verschieben 为改到周一。"},{"head":"stattfinden","note":"stattfinden 主语通常为会议、活动。"}],"transfer":[{"id":"de-14-transfer-1","prompt":"说明培训冲突","text":"Die Beratung überschneidet sich mit meiner Schulung.","zh":"咨询与培训时间重叠。","explanation":"反身结构加 mit 第三格。"},{"id":"de-14-transfer-2","prompt":"虽写信仍未确认","text":"Obwohl ich zweimal geschrieben habe, fehlt mir noch eine Bestätigung.","zh":"虽然写过两次信，我仍缺确认。","explanation":"从句 habe 末位。"},{"id":"de-14-transfer-3","prompt":"改成线上会议","text":"Die Besprechung findet diesmal online statt.","zh":"这次讨论在线举行。","explanation":"findet 与 statt 分离。"},{"id":"de-14-transfer-4","prompt":"请求确认教室","text":"Bitte bestätigen Sie mir den neuen Raum schriftlich.","zh":"请书面确认新教室。","explanation":"mir 第三格，Raum 宾格。"},{"id":"de-14-transfer-5","prompt":"提议周四早晨","text":"Wäre Donnerstagmorgen eine mögliche Alternative?","zh":"周四早晨能作备选吗？","explanation":"wäre 委婉询问。"},{"id":"de-14-transfer-6","prompt":"请提前通知迟到","text":"Bitte geben Sie mir früh Bescheid, falls Sie sich verspäten.","zh":"若您迟到请早通知我。","explanation":"falls 从句动词末位。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Obwohl ich müde bin, ich komme.","Obwohl ich müde bin, komme ich.","Obwohl ich bin müde, komme ich."],"answer":1,"explanation":"从句末位 bin，主句动词先行。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich bin verhindert. Trotzdem ich antworte.","Ich bin verhindert. Trotzdem antworten ich.","Ich bin verhindert. Trotzdem antworte ich."],"answer":2,"explanation":"trotzdem 占首位，antworte 第二位。"},{"prompt":"选择语法与词序正确的句子。","options":["Die Sitzung findet morgen statt.","Die Sitzung stattfinden morgen.","Die Sitzung finden morgen statt."],"answer":0,"explanation":"单数 Sitzung 用 findet，statt 置末。"}],"writingChecklist":["逐句核对：obwohl 从句动词置末。","检查本章表达：trotzdem 是主句副词，后接变位动词。","写入具体情境细节，并核对：stattfinden 主句为 findet…statt。"],"speakingFollowups":["这两个预约是否完全重叠？","周四早晨能作为备选吗？","您最晚什么时候能确认新的时间？"]}},{"id":"de-15","number":15,"title":"维修与服务咨询","level":"B1","stage":"intermediate","goal":"能描述故障、询问报价和服务范围。","grammar":{"title":"被动态与服务流程","explanation":"现在时被动态用 werden 加过去分词，重点是事情如何处理。情态动词搭配被动态时，句末用分词加 werden。","examples":[{"text":"Wie lange dauert die Reparatur?","zh":"维修需要多久？"},{"text":"Ich möchte zuerst einen Kostenvoranschlag erhalten.","zh":"我想先收到费用预估。"}]},"vocab":[{"head":"die Reparatur","zh":"维修","example":"Wie lange dauert die Reparatur?","exampleZh":"维修需要多久？","icon":"home"},{"head":"der Kostenvoranschlag","zh":"费用预估","example":"Ich möchte zuerst einen Kostenvoranschlag erhalten.","exampleZh":"我想先收到费用预估。","icon":"money"},{"head":"prüfen","zh":"检查","example":"Das Gerät wird zuerst geprüft.","exampleZh":"设备会先接受检查。","icon":"idea"},{"head":"ersetzen","zh":"更换","example":"Muss dieses Teil ersetzt werden?","exampleZh":"这个部件必须更换吗？","icon":"home"},{"head":"die Gebühr","zh":"费用","example":"Fällt für die Prüfung eine Gebühr an?","exampleZh":"检查会收费吗？","icon":"money"},{"head":"abholen","zh":"取走","example":"Wann kann ich das Gerät abholen?","exampleZh":"我什么时候能取设备？","icon":"travel"},{"head":"der Defekt","zh":"故障","example":"Der Defekt tritt nur manchmal auf.","exampleZh":"故障只偶尔出现。","icon":"idea"},{"head":"der Auftrag","zh":"委托；订单","example":"Bitte beginnen Sie erst nach meiner Zustimmung mit dem Auftrag.","exampleZh":"请在我同意后再开始执行委托。","icon":"work"},{"head":"die Zustimmung","zh":"同意","example":"Meine Zustimmung erhalten Sie schriftlich.","exampleZh":"我会书面表示同意。","icon":"talk"},{"head":"die Werkstatt","zh":"维修店","example":"Die Werkstatt ruft mich nach der Prüfung an.","exampleZh":"维修店检查后给我打电话。","icon":"work"}],"lessons":[{"id":"de-15-1","text":"Wie lange dauert die Reparatur?","zh":"维修需要多久？","tip":"dauern 询问耗时。"},{"id":"de-15-2","text":"Ich möchte zuerst einen Kostenvoranschlag erhalten.","zh":"我想先收到费用预估。","tip":"Kostenvoranschlag 是预估，不能直接当最终账单。"},{"id":"de-15-3","text":"Das Gerät wird zuerst geprüft.","zh":"设备会先接受检查。","tip":"wird geprüft 是现在时被动态。"},{"id":"de-15-4","text":"Muss dieses Teil ersetzt werden?","zh":"这个部件必须更换吗？","tip":"muss … ersetzt werden 是情态动词被动态。"},{"id":"de-15-5","text":"Fällt für die Prüfung eine Gebühr an?","zh":"检查会收费吗？","tip":"anfallen 的 an 放句末。"},{"id":"de-15-6","text":"Wann kann ich das Gerät abholen?","zh":"我什么时候能取设备？","tip":"abholen 的原形位于 kann 后句末。"}],"dialogue":[{"speaker":"Kunde","text":"Der Laptop geht manchmal plötzlich aus.","zh":"笔记本电脑有时会突然关机。"},{"speaker":"Technikerin","text":"Wir können ihn prüfen. Das kostet dreißig Euro.","zh":"我们可以检查，费用三十欧元。"},{"speaker":"Kunde","text":"Bitte nennen Sie mir vor einer Reparatur die weiteren Kosten.","zh":"维修前请告诉我后续费用。"},{"speaker":"Technikerin","text":"Gern. Wir rufen Sie nach der Prüfung an.","zh":"好的。检查后我们会给您打电话。"}],"reading":{"title":"维修与服务咨询：生活片段","text":"Als Jonas seinen Laptop zur Werkstatt bringt, beschreibt er den Fehler möglichst genau. Das Gerät geht nach ungefähr zwanzig Minuten aus, besonders wenn er Videos ansieht. Die Technikerin erklärt, dass zuerst eine Prüfung nötig ist. Jonas fragt nach deren Preis und danach, ob weitere Arbeiten gesondert beauftragt werden müssen. Er möchte vor der Reparatur eine Kostenschätzung bekommen. Die Werkstatt notiert seine Telefonnummer und gibt ihm eine Auftragsbestätigung. Jonas bewahrt sie zusammen mit dem Kaufbeleg auf.","zh":"约纳斯把笔记本电脑送到维修店时，尽可能准确地描述了问题：设备约二十分钟后关机，尤其是看视频时。技师说需要先检查。约纳斯问检查价格，以及后续工作是否需另行委托。他希望维修前先获得费用估算。维修店记下电话号码并给他委托确认单。他把它和购买凭证一起保存。"},"assessment":{"reading":{"title":"维修与服务咨询：独立阅读","text":"Die Waschmaschine von Frau Seidel macht beim Schleudern ein ungewöhnliches Geräusch. Sie kontaktiert einen Reparaturdienst und beschreibt das Problem. Der Mitarbeiter bietet einen Besuch am Mittwoch an. Für die Anfahrt nennt er einen festen Preis; mögliche Ersatzteile sind darin nicht enthalten. Frau Seidel bittet darum, vor dem Einbau neuer Teile über die Kosten informiert zu werden. Bis zum Termin benutzt sie die Maschine nicht mehr. Die Bestätigung erhält sie als Nachricht auf ihr Handy."},"questions":[{"prompt":"洗衣机何时出现异响？","options":["进水时","关机后","脱水时"],"answer":2,"explanation":"Geräusch beim Schleudern 指脱水异响。"},{"prompt":"维修人员何时上门？","options":["星期三","星期一","星期五"],"answer":0,"explanation":"对方提供星期三上门。"},{"prompt":"固定报价包含什么？","options":["所有零件","上门交通费","新洗衣机"],"answer":1,"explanation":"固定价是 Anfahrt，不包含零件。"},{"prompt":"她提出什么要求？","options":["直接换全部零件","取消检查","装新零件前告知费用"],"answer":2,"explanation":"她要提前了解更换零件费用。"}],"writing":"围绕“维修与服务咨询”，写80—100个德语词。能描述故障、询问报价和服务范围。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“维修与服务咨询”中的一次真实交流，持续约一分钟。能描述故障、询问报价和服务范围。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-15","npc":"Mia","place":"维修咨询台","scene":"家里有东西坏了。描述问题，再确认检查、维修和联络步骤。","text":"Können Sie beschreiben, was nicht funktioniert?","zh":"您能描述一下什么不能正常使用吗？","icon":"work"},"support":{"id":"de-15","pronunciation":{"focus":"词尾清化","explanation":"Auftrag 词尾 g 常读 k；Gebühr 的 ü 是长圆唇元音。","examples":[{"text":"Auftrag","zh":"委托"},{"text":"Gebühr","zh":"费用"}]},"grammarNotes":["过程被动为 werden 加过去分词。","情态被动结尾是分词＋werden，如 muss geprüft werden。","情态动词后 abholen 为完整原形。"],"cultureNote":"描述故障先说观察现象，再问报价和流程，具体费用须确认。","vocabularyNotes":[{"head":"die Reparatur","note":"Wie lange dauert die Reparatur? 问维修时间。"},{"head":"der Kostenvoranschlag","note":"索要报价用 einen Kostenvoranschlag，阳性宾格。"},{"head":"prüfen","note":"prüfen 接宾格，分词 geprüft。"}],"transfer":[{"id":"de-15-transfer-1","prompt":"询问自行车维修","text":"Wie viele Tage brauchen Sie für die Reparatur des Fahrrads?","zh":"修自行车需几天？","explanation":"für 加宾格。"},{"id":"de-15-transfer-2","prompt":"请求维修前报价","text":"Bitte schicken Sie mir vor der Reparatur einen Kostenvoranschlag.","zh":"请维修前发报价。","explanation":"mir 第三格，报价宾格。"},{"id":"de-15-transfer-3","prompt":"确认交付前测试","text":"Die Maschine wird vor der Übergabe getestet.","zh":"机器交付前会测试。","explanation":"wird 加 getestet 为被动。"},{"id":"de-15-transfer-4","prompt":"问是否换电池","text":"Muss der Akku vollständig ersetzt werden?","zh":"电池必须整块更换吗？","explanation":"被动不定式为 ersetzt werden。"},{"id":"de-15-transfer-5","prompt":"问取件费用","text":"Fällt bei der Abholung eine zusätzliche Gebühr an?","zh":"取件时有额外费用吗？","explanation":"anfallen 分离。"},{"id":"de-15-transfer-6","prompt":"问周六取自行车","text":"Kann ich das Fahrrad am Samstag abholen?","zh":"我周六能取自行车吗？","explanation":"abholen 完整原形置末。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Das Gerät werden geprüft.","Das Gerät wird prüfen.","Das Gerät wird geprüft."],"answer":2,"explanation":"单数用 wird，被动用分词。"},{"prompt":"选择语法与词序正确的句子。","options":["Das Kabel muss ersetzt werden.","Das Kabel muss werden ersetzt.","Das Kabel muss ersetzt wird."],"answer":0,"explanation":"情态被动末尾为 ersetzt werden。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich hole dem Drucker morgen ab.","Ich hole den Drucker morgen ab.","Ich abhole den Drucker morgen."],"answer":1,"explanation":"可分前缀 ab 末位，宾格 den。"}],"writingChecklist":["逐句核对：过程被动为 werden 加过去分词。","检查本章表达：情态被动结尾是分词＋werden，如 muss geprüft werden。","写入具体情境细节，并核对：情态动词后 abholen 为完整原形。"],"speakingFollowups":["检查本身是否收费？","维修开始前您能先给报价吗？","设备修好后您会怎样通知我？"]}},{"id":"de-16","number":16,"title":"工作沟通与交接","level":"B1","stage":"intermediate","goal":"能说明进度、澄清任务并协商截止时间。","grammar":{"title":"条件句 wenn","explanation":"wenn 表达条件，变位动词在从句末尾。条件从句在前时，主句直接以变位动词开始。","examples":[{"text":"Könnten Sie die Aufgabe genauer erklären?","zh":"您能更具体地解释任务吗？"},{"text":"Bis wann läuft die Frist?","zh":"截止期限到什么时候？"}]},"vocab":[{"head":"die Aufgabe","zh":"任务","example":"Könnten Sie die Aufgabe genauer erklären?","exampleZh":"您能更具体地解释任务吗？","icon":"work"},{"head":"die Frist","zh":"截止期限","example":"Bis wann läuft die Frist?","exampleZh":"截止期限到什么时候？","icon":"time"},{"head":"übernehmen","zh":"接手；承担","example":"Ich kann den ersten Teil übernehmen.","exampleZh":"我可以负责第一部分。","icon":"work"},{"head":"die Übergabe","zh":"交接","example":"Bei der Übergabe fehlen zwei Informationen.","exampleZh":"交接时缺少两项信息。","icon":"work"},{"head":"zuständig","zh":"负责的","example":"Wer ist für die Bestellung zuständig?","exampleZh":"谁负责订货？","icon":"work"},{"head":"der Entwurf","zh":"草稿","example":"Wenn der Entwurf fertig ist, schicke ich ihn Ihnen.","exampleZh":"草稿完成后，我就发给您。","icon":"work"},{"head":"die Rückmeldung","zh":"反馈","example":"Ich brauche bis morgen eine Rückmeldung.","exampleZh":"我需要在明天之前收到反馈。","icon":"talk"},{"head":"erledigen","zh":"完成；处理","example":"Ich habe die Aufgabe bereits erledigt.","exampleZh":"我已完成任务。","icon":"work"},{"head":"die Besprechung","zh":"会议；商议","example":"Die Besprechung beginnt um neun.","exampleZh":"会议九点开始。","icon":"work"},{"head":"verlässlich","zh":"可靠的","example":"Wir brauchen verlässliche Angaben.","exampleZh":"我们需要可靠的信息。","icon":"idea"}],"lessons":[{"id":"de-16-1","text":"Könnten Sie die Aufgabe genauer erklären?","zh":"您能更具体地解释任务吗？","tip":"genauer 请求更具体的信息。"},{"id":"de-16-2","text":"Bis wann läuft die Frist?","zh":"截止期限到什么时候？","tip":"bis wann 问截止点。"},{"id":"de-16-3","text":"Ich kann den ersten Teil übernehmen.","zh":"我可以负责第一部分。","tip":"übernehmen 在这里表示承担工作。"},{"id":"de-16-4","text":"Bei der Übergabe fehlen zwei Informationen.","zh":"交接时缺少两项信息。","tip":"bei der Übergabe 用第三格。"},{"id":"de-16-5","text":"Wer ist für die Bestellung zuständig?","zh":"谁负责订货？","tip":"für etwas zuständig 是负责某事。"},{"id":"de-16-6","text":"Wenn der Entwurf fertig ist, schicke ich ihn Ihnen.","zh":"草稿完成后，我就发给您。","tip":"wenn 从句在前，主句用 schicke 开头。"}],"dialogue":[{"speaker":"Kollegin","text":"Kannst du den Bericht bis Donnerstag übernehmen?","zh":"你能负责在星期四前完成报告吗？"},{"speaker":"Kollege","text":"Den Text ja. Für die Zahlen brauche ich deine Hilfe.","zh":"文字可以。数据方面我需要你的帮助。"},{"speaker":"Kollegin","text":"Ich schicke dir die Tabelle heute Nachmittag.","zh":"我今天下午发给你表格。"},{"speaker":"Kollege","text":"Gut. Wenn Fragen offenbleiben, melde ich mich morgen.","zh":"好。如果还有问题，我明天联系你。"}],"reading":{"title":"工作沟通与交接：生活片段","text":"In einer kleinen Firma bereiten Aylin und Max einen Bericht vor. Aylin soll die Zahlen prüfen, Max schreibt die Erklärung dazu. Bei der Übergabe stellt Max fest, dass Angaben zu zwei Monaten fehlen. Er fragt nach, statt Zahlen zu schätzen. Gemeinsam vereinbaren sie, den ersten Entwurf am Donnerstag zu besprechen. Wenn die fehlenden Daten bis dahin nicht vorliegen, kennzeichnen sie die Lücke deutlich. Ihre Teamleiterin wird noch am selben Tag über den geänderten Ablauf informiert.","zh":"在一家小公司，艾琳和马克斯一起准备报告。艾琳检查数据，马克斯写说明。交接时马克斯发现缺少两个月的数据，便询问而不自行估算。他们约定星期四讨论初稿。如果届时数据还没到，就明确标注空缺。当天他们也会把调整后的流程告知组长。"},"assessment":{"reading":{"title":"工作沟通与交接：独立阅读","text":"Ravi arbeitet seit Kurzem in einem Lager. Am Dienstag soll er eine Lieferung kontrollieren. Er kennt das digitale Formular noch nicht und bittet seine Kollegin um eine kurze Erklärung. Sie zeigt ihm, wo fehlende Artikel eingetragen werden. Ravi entdeckt danach, dass zwei Kartons weniger angekommen sind als bestellt. Er dokumentiert die Abweichung und informiert den zuständigen Kollegen. Die Ware wird erst weiterverteilt, nachdem die offenen Fragen geklärt wurden. Die Kollegin prüft seinen ersten Eintrag gemeinsam mit ihm."},"questions":[{"prompt":"拉维要做什么？","options":["写广告","检查到货","清洗仓库"],"answer":1,"explanation":"他要检查一批货物。"},{"prompt":"他请求解释什么？","options":["数字表单","请假流程","薪资"],"answer":0,"explanation":"他尚不熟悉数字表单。"},{"prompt":"发现什么差异？","options":["颜色错误","货太多","少了两箱"],"answer":2,"explanation":"到货比订货少两箱。"},{"prompt":"什么时候分发货物？","options":["立即","澄清问题后","下个月固定日期"],"answer":1,"explanation":"问题澄清后才继续分发。"}],"writing":"围绕“工作沟通与交接”，写80—100个德语词。能说明进度、澄清任务并协商截止时间。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“工作沟通与交接”中的一次真实交流，持续约一分钟。能说明进度、澄清任务并协商截止时间。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-16","npc":"Lena","place":"工作交接桌","scene":"同事需要了解任务进展。说明已完成什么，以及还需要什么帮助。","text":"Welche Aufgaben sind erledigt und was ist noch offen?","zh":"哪些任务已完成，还有什么待办？","icon":"work"},"support":{"id":"de-16","pronunciation":{"focus":"fr 辅音连缀","explanation":"Frist 的 fr 连读，不在中间加元音；Rückmeldung 保持 ü 圆唇。","examples":[{"text":"Frist","zh":"期限"},{"text":"Rückmeldung","zh":"反馈"}]},"grammarNotes":["wenn 从句动词末位，前置时主句动词紧接。","schicken 接第三格接受者、宾格物品。","für etwas zuständig sein 用 für 加宾格。"],"cultureNote":"工作交接可明确责任人、截止时间和缺少信息，称呼依团队约定。","vocabularyNotes":[{"head":"die Aufgabe","note":"eine Aufgabe übernehmen 表承担任务。"},{"head":"die Frist","note":"bis Freitag 表截止，innerhalb der Frist 表期限内。"},{"head":"übernehmen","note":"übernehmen 不可分，分词 übernommen。"}],"transfer":[{"id":"de-16-transfer-1","prompt":"询问衡量标准","text":"Könnten Sie erklären, woran wir das Ergebnis messen?","zh":"您能解释如何衡量结果吗？","explanation":"间接疑问 messen 末位。"},{"id":"de-16-transfer-2","prompt":"确认完成日期","text":"Bis zu welchem Datum muss der Bericht fertig sein?","zh":"报告最晚什么日期完成？","explanation":"muss 后原形 sein。"},{"id":"de-16-transfer-3","prompt":"承担核对数字","text":"Ich kann die Zahlen prüfen und die Tabelle aktualisieren.","zh":"我能核对数字并更新表格。","explanation":"两原形共用 kann。"},{"id":"de-16-transfer-4","prompt":"说明缺附件","text":"Bei der Übergabe habe ich die Anhänge nicht erhalten.","zh":"交接时我没收到附件。","explanation":"erhalten 分词无 ge-。"},{"id":"de-16-transfer-5","prompt":"问技术责任人","text":"Wer ist für technische Fragen zuständig?","zh":"谁负责技术问题？","explanation":"für 后宾格复数。"},{"id":"de-16-transfer-6","prompt":"完成检查通知团队","text":"Wenn die Prüfung abgeschlossen ist, informiere ich das Team.","zh":"检查完成后我通知团队。","explanation":"前置从句后动词 informiere 先行。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Wenn ich fertig bin, rufe ich an.","Wenn ich bin fertig, rufe ich an.","Wenn ich fertig bin, ich rufe an."],"answer":0,"explanation":"从句动词末位，主句动词紧接。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich schicke Ihnen der Bericht.","Ich schicke Ihnen den Bericht.","Ich schicke Sie den Bericht."],"answer":1,"explanation":"接受者第三格 Ihnen，内容宾格。"},{"prompt":"选择语法与词序正确的句子。","options":["Sie ist für der Planung zuständig.","Sie ist für dem Planung zuständig.","Sie ist für die Planung zuständig."],"answer":2,"explanation":"für 支配宾格 die Planung。"}],"writingChecklist":["逐句核对：wenn 从句动词末位，前置时主句动词紧接。","检查本章表达：schicken 接第三格接受者、宾格物品。","写入具体情境细节，并核对：für etwas zuständig sein 用 für 加宾格。"],"speakingFollowups":["这项工作具体由谁负责？","您最晚什么时候需要初稿？","交接时还缺少哪些信息？"]}},{"id":"de-17","number":17,"title":"学校与学习合作","level":"B1","stage":"intermediate","goal":"能理解课程要求、申请帮助并协商小组任务。","grammar":{"title":"关系从句","explanation":"关系从句补充说明名词，变位动词放句末。关系代词的性、数来自所指名词，格由它在从句中的作用决定。","examples":[{"text":"Die Anmeldung, die ich gestern geschickt habe, ist angekommen.","zh":"我昨天发送的报名材料已收到。"},{"text":"Welche Voraussetzungen gelten für diesen Kurs?","zh":"这门课有哪些前提条件？"}]},"vocab":[{"head":"die Anmeldung","zh":"报名","example":"Die Anmeldung, die ich gestern geschickt habe, ist angekommen.","exampleZh":"我昨天发送的报名材料已收到。","icon":"study"},{"head":"die Voraussetzung","zh":"前提条件","example":"Welche Voraussetzungen gelten für diesen Kurs?","exampleZh":"这门课有哪些前提条件？","icon":"study"},{"head":"die Abgabe","zh":"提交","example":"Die Abgabe ist für Freitag geplant.","exampleZh":"提交安排在星期五。","icon":"study"},{"head":"die Gruppenarbeit","zh":"小组作业","example":"Bei der Gruppenarbeit teilen wir die Aufgaben auf.","exampleZh":"做小组作业时我们分配任务。","icon":"study"},{"head":"die Sprechstunde","zh":"答疑或接待时间","example":"Ich komme in Ihre Sprechstunde.","exampleZh":"我会在您的答疑时间来。","icon":"study"},{"head":"nachholen","zh":"补做；补学","example":"Wie kann ich den versäumten Stoff nachholen?","exampleZh":"我怎样补上错过的内容？","icon":"study"},{"head":"die Quelle","zh":"资料来源","example":"Wir nennen die Quelle jeder Grafik.","exampleZh":"我们注明每张图的来源。","icon":"study"},{"head":"die Präsentation","zh":"展示；报告","example":"Unsere Präsentation dauert zehn Minuten.","exampleZh":"我们的报告十分钟。","icon":"study"},{"head":"die Teilnahme","zh":"参加","example":"Ist eine Teilnahme per Video möglich?","exampleZh":"可以通过视频参加吗？","icon":"study"},{"head":"die Unterstützung","zh":"支持；帮助","example":"Vielen Dank für Ihre Unterstützung.","exampleZh":"非常感谢您的帮助。","icon":"talk"}],"lessons":[{"id":"de-17-1","text":"Die Anmeldung, die ich gestern geschickt habe, ist angekommen.","zh":"我昨天发送的报名材料已收到。","tip":"关系代词 die 指代阴性 Anmeldung，并在从句作宾语。"},{"id":"de-17-2","text":"Welche Voraussetzungen gelten für diesen Kurs?","zh":"这门课有哪些前提条件？","tip":"gelten für 表示适用于。"},{"id":"de-17-3","text":"Die Abgabe ist für Freitag geplant.","zh":"提交安排在星期五。","tip":"für Freitag geplant 表示计划安排。"},{"id":"de-17-4","text":"Bei der Gruppenarbeit teilen wir die Aufgaben auf.","zh":"做小组作业时我们分配任务。","tip":"aufteilen 的 auf 在句末。"},{"id":"de-17-5","text":"Ich komme in Ihre Sprechstunde.","zh":"我会在您的答疑时间来。","tip":"Sprechstunde 可指教师固定答疑时间。"},{"id":"de-17-6","text":"Wie kann ich den versäumten Stoff nachholen?","zh":"我怎样补上错过的内容？","tip":"versäumten Stoff 指错过的课程内容。"}],"dialogue":[{"speaker":"Studentin","text":"Ich war krank und habe die Einführung verpasst.","zh":"我生病了，错过了导论课。"},{"speaker":"Dozent","text":"Die Unterlagen, die Sie brauchen, liegen auf der Lernplattform.","zh":"您需要的材料在学习平台上。"},{"speaker":"Studentin","text":"Kann ich dazu in Ihre Sprechstunde kommen?","zh":"我能在您的答疑时间来问问题吗？"},{"speaker":"Dozent","text":"Ja, bringen Sie bitte konkrete Fragen mit.","zh":"可以，请带具体问题来。"}],"reading":{"title":"学校与学习合作：生活片段","text":"Für eine Gruppenarbeit sollen vier Kursteilnehmer einen kurzen Vortrag vorbereiten. Hana übernimmt die Recherche, die anderen erstellen Folien und Beispiele. Eine Quelle, die Hana zuerst findet, hat kein Veröffentlichungsdatum. Deshalb sucht sie nach besser überprüfbaren Informationen. Bei einem Treffen stellt die Gruppe fest, dass ihr Vortrag zu lang wird. Sie kürzt einige Beispiele und übt gemeinsam. Ein Teilnehmer, der am Treffen nicht teilnehmen kann, erhält anschließend eine Zusammenfassung und schickt seine Ergänzungen per E-Mail.","zh":"四名学员要合作准备一个简短报告。哈娜负责查资料，其他人制作幻灯片和例子。哈娜最初找到的一份资料没有发布日期，因此她寻找更易核实的信息。聚会时小组发现报告太长，删去一些例子并一起练习。没能参加的一名学员随后收到摘要，并通过邮件补充意见。"},"assessment":{"reading":{"title":"学校与学习合作：独立阅读","text":"Mira möchte an einem Abendkurs für Fotografie teilnehmen. Auf der Webseite steht, dass eigene Kameras mitgebracht werden sollen. Mira besitzt bisher nur ein Smartphone und fragt das Kursbüro nach einer Lösung. Für die ersten beiden Termine kann sie eine Kamera der Schule ausleihen. Danach muss sie erneut nachfragen, weil die Geräte auch von anderen Gruppen gebraucht werden. Mira meldet sich an und notiert, welche Materialien sie zum ersten Termin mitbringen soll."},"questions":[{"prompt":"米拉想上什么课？","options":["烹饪","语言","摄影"],"answer":2,"explanation":"她想参加摄影晚课。"},{"prompt":"她目前有什么设备？","options":["只有智能手机","专业相机","两台相机"],"answer":0,"explanation":"她目前只有智能手机。"},{"prompt":"前两次课可以怎样解决？","options":["不用参加","借学校相机","只看录像"],"answer":1,"explanation":"学校可借相机给她上前两次课。"},{"prompt":"为何之后要再询问？","options":["其他组也要用设备","课程停止","她要当老师"],"answer":0,"explanation":"其他组同样需要设备。"}],"writing":"围绕“学校与学习合作”，写80—100个德语词。能理解课程要求、申请帮助并协商小组任务。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“学校与学习合作”中的一次真实交流，持续约一分钟。能理解课程要求、申请帮助并协商小组任务。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-17","npc":"Jonas","place":"学习小组","scene":"你们准备一起学习。说明自己的目标，也请求具体帮助。","text":"Wobei brauchen Sie Unterstützung beim Lernen?","zh":"您在学习的哪些方面需要支持？","icon":"study"},"support":{"id":"de-17","pronunciation":{"focus":"词尾 -tion","explanation":"Präsentation 的 -tion 读 tsion 并重读；Gruppenarbeit 重音靠前。","examples":[{"text":"Präsentation","zh":"展示"},{"text":"Gruppenarbeit","zh":"小组作业"}]},"grammarNotes":["关系代词性数由先行词决定，格由从句功能决定。","die Anmeldung, die ich sende 中 die 是宾格。","关系从句用逗号分隔，变位动词置末。"],"cultureNote":"小组合作可明确分工，资料引用按课程具体要求核对。","vocabularyNotes":[{"head":"die Anmeldung","note":"sich für einen Kurs anmelden 表报名课程。"},{"head":"die Voraussetzung","note":"Voraussetzungen 常用复数表示多项条件。"},{"head":"die Abgabe","note":"Abgabe bis Freitag 表截止周五提交。"}],"transfer":[{"id":"de-17-transfer-1","prompt":"说明已填表格","text":"Das Formular, das ich online ausgefüllt habe, ist noch nicht bearbeitet.","zh":"我网上填的表尚未处理。","explanation":"中性宾格关系代词 das。"},{"id":"de-17-transfer-2","prompt":"问预备知识","text":"Welche Vorkenntnisse brauche ich für das Seminar?","zh":"研讨课需要什么预备知识？","explanation":"brauchen 接宾格。"},{"id":"de-17-transfer-3","prompt":"申请晚交一天","text":"Könnte ich den Bericht einen Tag später abgeben?","zh":"我能晚一天交报告吗？","explanation":"情态动词后 abgeben 完整。"},{"id":"de-17-transfer-4","prompt":"分配来源核查","text":"Wir teilen die Recherche so auf, dass jeder zwei Quellen prüft.","zh":"我们分配检索任务，每人核查两个来源。","explanation":"aufteilen 分离，dass 从句 prüft 末位。"},{"id":"de-17-transfer-5","prompt":"答疑讨论提纲","text":"Ich möchte in Ihrer Sprechstunde über meine Gliederung sprechen.","zh":"我想在答疑时间讨论提纲。","explanation":"in Ihrer Sprechstunde 第三格。"},{"id":"de-17-transfer-6","prompt":"问错过内容","text":"Kannst du mir erklären, was wir gestern besprochen haben?","zh":"你能解释昨天讨论了什么吗？","explanation":"间接疑问以 haben 结尾。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Der Kurs, den ich besuchen, ist interessant.","Der Kurs, den ich besuche, ist interessant.","Der Kurs, der ich besuche, ist interessant."],"answer":1,"explanation":"besuchen 宾语阳性宾格 den，ich 配 besuche。"},{"prompt":"选择语法与词序正确的句子。","options":["Die Lehrerin, den uns hilft, ist hier.","Die Lehrerin, die uns helfen, ist hier.","Die Lehrerin, die uns hilft, ist hier."],"answer":2,"explanation":"阴性主格关系代词 die，单数 hilft。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich frage, wann die Abgabe ist.","Ich frage, wann ist die Abgabe.","Ich frage, wann die Abgabe sind."],"answer":0,"explanation":"间接疑问动词末位，Abgabe 单数。"}],"writingChecklist":["逐句核对：关系代词性数由先行词决定，格由从句功能决定。","检查本章表达：die Anmeldung, die ich sende 中 die 是宾格。","写入具体情境细节，并核对：关系从句用逗号分隔，变位动词置末。"],"speakingFollowups":["这个课程要求哪些预备知识？","我们各自负责哪两个资料来源？","错过的内容我可以从哪里补学？"]}},{"id":"de-18","number":18,"title":"银行与支付安全","level":"B1","stage":"intermediate","goal":"能咨询费用、核对交易并保护敏感信息。","grammar":{"title":"间接转述与核实","explanation":"转述客服说明可用 dass 从句。信息核实时区分对方声称的内容与已经确认的事实，句末放变位动词。","examples":[{"text":"Ich möchte die Gebühren für dieses Konto wissen.","zh":"我想了解这个账户的费用。"},{"text":"Die Überweisung ist noch nicht angekommen.","zh":"转账还没到账。"}]},"vocab":[{"head":"das Konto","zh":"账户","example":"Ich möchte die Gebühren für dieses Konto wissen.","exampleZh":"我想了解这个账户的费用。","icon":"money"},{"head":"die Überweisung","zh":"转账","example":"Die Überweisung ist noch nicht angekommen.","exampleZh":"转账还没到账。","icon":"money"},{"head":"der Betrag","zh":"金额","example":"Ich erkenne diesen Betrag nicht wieder.","exampleZh":"我认不出这笔金额。","icon":"money"},{"head":"sperren","zh":"冻结；停用","example":"Wie kann ich die verlorene Karte sperren lassen?","exampleZh":"遗失的卡怎样停用？","icon":"money"},{"head":"die PIN","zh":"个人识别码；密码","example":"Meine PIN gebe ich am Telefon nicht weiter.","exampleZh":"我不会在电话里透露个人识别码。","icon":"money"},{"head":"der Kontoauszug","zh":"账户流水","example":"Auf dem Kontoauszug steht eine unbekannte Zahlung.","exampleZh":"账户流水上有一笔陌生付款。","icon":"money"},{"head":"die Zahlung","zh":"付款","example":"Ich möchte diese Zahlung prüfen lassen.","exampleZh":"我想请人核查这笔付款。","icon":"money"},{"head":"der Empfänger","zh":"收款人；接收人","example":"Bitte prüfen Sie den Namen des Empfängers.","exampleZh":"请核对收款人的姓名。","icon":"person"},{"head":"die Gebühr","zh":"费用","example":"Welche monatliche Gebühr fällt an?","exampleZh":"每月有哪些费用？","icon":"money"},{"head":"verdächtig","zh":"可疑的","example":"Diese Nachricht wirkt verdächtig.","exampleZh":"这条消息看起来可疑。","icon":"idea"}],"lessons":[{"id":"de-18-1","text":"Ich möchte die Gebühren für dieses Konto wissen.","zh":"我想了解这个账户的费用。","tip":"Gebühren 为费用的复数。"},{"id":"de-18-2","text":"Die Überweisung ist noch nicht angekommen.","zh":"转账还没到账。","tip":"ankommen 的完成时用 sein。"},{"id":"de-18-3","text":"Ich erkenne diesen Betrag nicht wieder.","zh":"我认不出这笔金额。","tip":"wiedererkennen 表示辨认。"},{"id":"de-18-4","text":"Wie kann ich die verlorene Karte sperren lassen?","zh":"遗失的卡怎样停用？","tip":"sperren lassen 表示请机构停用。"},{"id":"de-18-5","text":"Meine PIN gebe ich am Telefon nicht weiter.","zh":"我不会在电话里透露个人识别码。","tip":"weitergeben 的 weiter 在句末。"},{"id":"de-18-6","text":"Auf dem Kontoauszug steht eine unbekannte Zahlung.","zh":"账户流水上有一笔陌生付款。","tip":"auf dem Kontoauszug 用第三格。"}],"dialogue":[{"speaker":"Kundin","text":"Auf meinem Auszug steht eine Zahlung, die ich nicht kenne.","zh":"我的流水上有一笔不认识的付款。"},{"speaker":"Service","text":"Bitte nennen Sie Datum und Betrag, aber nicht Ihre PIN.","zh":"请提供日期和金额，不要提供密码。"},{"speaker":"Kundin","text":"Ich prüfe zuerst, ob ich die offizielle Servicenummer gewählt habe.","zh":"我先核对自己是否拨了官方服务号码。"},{"speaker":"Service","text":"Das können Sie über die Unterlagen Ihrer Bank prüfen.","zh":"您可以通过银行文件核对。"}],"reading":{"title":"银行与支付安全：生活片段","text":"Chen erhält eine Nachricht, die angeblich von seiner Bank kommt. Er soll sofort einen Link öffnen und seine Zugangsdaten eingeben. Weil ihn die Aufforderung überrascht, klickt er nicht darauf. Stattdessen öffnet er die ihm bekannte Bankanwendung und prüft dort die Nachrichten. Anschließend ruft er über eine bereits gespeicherte offizielle Nummer beim Service an. Er fragt, ob eine Handlung erforderlich ist. Im Gespräch nennt er keine PIN und notiert sich, welche nächsten Schritte ihm erklärt werden.","zh":"陈收到一条自称来自银行的消息，要求他立即打开链接、输入登录资料。这个要求让他意外，他没有点击，而是打开熟悉的银行应用查看消息。随后他通过已保存的官方号码联系服务人员，询问是否需要采取行动。他不在通话中提供密码，并记下对方说明的后续步骤。"},"assessment":{"reading":{"title":"银行与支付安全：独立阅读","text":"Auf ihrem Kontoauszug entdeckt Eva eine doppelte Abbuchung vom selben Geschäft. Sie vergleicht die beiden Einträge mit ihrem Kassenbon. Datum und Betrag sind jeweils gleich. Zuerst kontaktiert sie das Geschäft und bittet um Prüfung. Eine Mitarbeiterin kann am Telefon noch keine Erklärung geben und fragt nach einer Kopie des Belegs. Eva sendet nur die dafür benötigten Angaben über den vereinbarten Kontaktweg. Parallel notiert sie die Rückfragen, die sie ihrer Bank stellen möchte."},"questions":[{"prompt":"埃娃发现什么？","options":["陌生贷款","同一店铺重复扣款","账户关闭"],"answer":1,"explanation":"流水有同一店铺的两次扣款。"},{"prompt":"她用什么核对？","options":["购物小票","邻居的流水","广告"],"answer":0,"explanation":"她与自己的小票比较。"},{"prompt":"员工当场能做什么？","options":["承诺立即退款","提供完整原因","请求凭证副本以检查"],"answer":2,"explanation":"员工还不能解释，请她提供副本。"},{"prompt":"她如何发送资料？","options":["公开发布全部流水","通过约定渠道只发所需信息","发送密码"],"answer":1,"explanation":"她只按约定渠道发送必要资料。"}],"writing":"围绕“银行与支付安全”，写80—100个德语词。能咨询费用、核对交易并保护敏感信息。 请给出具体人物、时间或地点，不要照抄阅读。","speaking":"模拟“银行与支付安全”中的一次真实交流，持续约一分钟。能咨询费用、核对交易并保护敏感信息。 对方不明白时，请换一种说法或提出确认问题。"},"story":{"id":"de-18","npc":"Mia","place":"银行咨询台","scene":"付款记录让你有疑问。用虚构信息练习，不提供密码或验证码。","text":"Welche Frage haben Sie zu dieser Zahlung?","zh":"您对这笔付款有什么问题？","icon":"money"},"support":{"id":"de-18","pronunciation":{"focus":"p 与 b","explanation":"PIN 的 p 送气；Betrag 起首 b 不读强送气 p，词尾 g 清化。","examples":[{"text":"PIN","zh":"个人密码"},{"text":"Betrag","zh":"金额"}]},"grammarNotes":["dass 转述从句动词末位。","lassen 加原形表示请人办理，如 sperren lassen。","位置 auf dem Kontoauszug 第三格，金额作宾语用 diesen Betrag。"],"cultureNote":"沟通不明支付可说明日期金额，再经已知渠道核实，课程句子不构成银行承诺。","vocabularyNotes":[{"head":"das Konto","note":"Konto 复数 Konten，auf dem Konto 为账户上。"},{"head":"die Überweisung","note":"eine Überweisung prüfen lassen 表请人核查转账。"},{"head":"der Betrag","note":"Betrag 阳性，宾格 diesen Betrag。"}],"transfer":[{"id":"de-18-transfer-1","prompt":"问月费","text":"Welche monatlichen Gebühren fallen bei diesem Konto an?","zh":"此账户有哪些月费？","explanation":"anfallen 分离，复数 fallen。"},{"id":"de-18-transfer-2","prompt":"说明未见转账","text":"Auf meinem Konto ist die Überweisung noch nicht sichtbar.","zh":"我账户还看不到转账。","explanation":"auf 表位置第三格。"},{"id":"de-18-transfer-3","prompt":"核对重复金额","text":"Ich sehe denselben Betrag zweimal auf dem Auszug.","zh":"账单上同一金额出现两次。","explanation":"sehen 后宾格 denselben。"},{"id":"de-18-transfer-4","prompt":"问冻结步骤","text":"Bitte erklären Sie mir, wie ich die Karte sperren lassen kann.","zh":"请解释如何申请冻结卡片。","explanation":"间接疑问末尾 sperren lassen kann。"},{"id":"de-18-transfer-5","prompt":"拒绝消息发密码","text":"Ich schicke meine PIN nicht in einer Nachricht.","zh":"我不在消息中发个人密码。","explanation":"nicht 否定发送行为。"},{"id":"de-18-transfer-6","prompt":"转述消息待核实","text":"In der Nachricht steht, dass ich meine Daten bestätigen soll.","zh":"消息说我应确认资料。","explanation":"此句仅转述，dass 从句 soll 末位。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Sie sagt, dass fehlt die Zahlung.","Sie sagt, dass die Zahlung fehlen.","Sie sagt, dass die Zahlung fehlt."],"answer":2,"explanation":"dass 从句动词末位，Zahlung 单数。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich möchte die Karte sperren lassen.","Ich möchte die Karte sperrt lassen.","Ich möchte die Karte lassen sperren."],"answer":0,"explanation":"lassen 前保留原形 sperren。"},{"prompt":"选择语法与词序正确的句子。","options":["Der Betrag stehen auf dem Auszug.","Der Betrag steht auf dem Auszug.","Der Betrag steht auf den Auszug."],"answer":1,"explanation":"静态位置第三格，单数主语配 steht。"}],"writingChecklist":["逐句核对：dass 转述从句动词末位。","检查本章表达：lassen 加原形表示请人办理，如 sperren lassen。","写入具体情境细节，并核对：位置 auf dem Kontoauszug 第三格，金额作宾语用 diesen Betrag。"],"speakingFollowups":["这笔不明支付是哪天出现的？","您能解释这项费用对应什么吗？","我怎样通过熟悉的渠道核实这条消息？"]}},{"id":"de-19","number":19,"title":"消息与信息核实","level":"B1","stage":"intermediate","goal":"将已学表达迁移到消息与信息核实，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Ich habe eine Nachricht über einen Kurs bekommen.","zh":"我收到了一条关于课程的消息。"},{"text":"In der Nachricht steht nicht, wer sie geschrieben hat.","zh":"消息没有写明是谁写的。"}]},"vocab":[{"head":"die Aufgabe","zh":"任务","example":"Könnten Sie die Aufgabe genauer erklären?","exampleZh":"您能更具体地解释任务吗？","icon":"work","review":true},{"head":"die Frist","zh":"截止期限","example":"Bis wann läuft die Frist?","exampleZh":"截止期限到什么时候？","icon":"time","review":true},{"head":"übernehmen","zh":"接手；承担","example":"Ich kann den ersten Teil übernehmen.","exampleZh":"我可以负责第一部分。","icon":"work","review":true},{"head":"die Übergabe","zh":"交接","example":"Bei der Übergabe fehlen zwei Informationen.","exampleZh":"交接时缺少两项信息。","icon":"work","review":true},{"head":"zuständig","zh":"负责的","example":"Wer ist für die Bestellung zuständig?","exampleZh":"谁负责订货？","icon":"work","review":true},{"head":"der Entwurf","zh":"草稿","example":"Wenn der Entwurf fertig ist, schicke ich ihn Ihnen.","exampleZh":"草稿完成后，我就发给您。","icon":"work","review":true},{"head":"die Rückmeldung","zh":"反馈","example":"Ich brauche bis morgen eine Rückmeldung.","exampleZh":"我需要在明天之前收到反馈。","icon":"talk","review":true},{"head":"erledigen","zh":"完成；处理","example":"Ich habe die Aufgabe bereits erledigt.","exampleZh":"我已完成任务。","icon":"work","review":true},{"head":"die Besprechung","zh":"会议；商议","example":"Die Besprechung beginnt um neun.","exampleZh":"会议九点开始。","icon":"work","review":true},{"head":"verlässlich","zh":"可靠的","example":"Wir brauchen verlässliche Angaben.","exampleZh":"我们需要可靠的信息。","icon":"idea","review":true}],"lessons":[{"id":"de-19-1","text":"Ich habe eine Nachricht über einen Kurs bekommen.","zh":"我收到了一条关于课程的消息。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-19-2","text":"In der Nachricht steht nicht, wer sie geschrieben hat.","zh":"消息没有写明是谁写的。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-19-3","text":"Bevor ich meine Pläne ändere, prüfe ich die Information.","zh":"改变计划前，我会核实信息。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-19-4","text":"Ich frage lieber bei der bekannten Adresse der Schule nach.","zh":"我更愿意通过学校的已知地址询问。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-19-5","text":"Wenn sich die Uhrzeit ändert, sage ich den anderen Bescheid.","zh":"如果时间改变，我会告诉其他人。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-19-6","text":"Danach speichere ich die Bestätigung, damit ich sie wiederfinde.","zh":"随后我保存确认消息，以便再次找到。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Ich habe eine Nachricht über einen Kurs bekommen. In der Nachricht steht nicht, wer sie geschrieben hat. Bevor ich meine Pläne ändere, prüfe ich die Information. Ich frage lieber bei der bekannten Adresse der Schule nach. Wenn sich die Uhrzeit ändert, sage ich den anderen Bescheid. Danach speichere ich die Bestätigung, damit ich sie wiederfinde.","zh":"我收到了一条关于课程的消息。消息没有写明是谁写的。改变计划前，我会核实信息。我更愿意通过学校的已知地址询问。如果时间改变，我会告诉其他人。随后我保存确认消息，以便再次找到。"},"assessment":{"reading":{"title":"陌生情境验收","text":"Anna bekommt in einer Gruppe eine weitergeleitete Nachricht. Darin steht, dass der Kurs am Dienstag ausfällt. Die Nachricht enthält aber weder ein Datum noch den Namen einer verantwortlichen Person. Bevor Anna ihren Kalender ändert, schreibt sie an die bekannte Adresse der Schule. Die Antwort kommt am Nachmittag: Der Kurs findet am Dienstag statt, allerdings in einem anderen Raum. Anna speichert die Bestätigung und informiert die Person, die ihr die Nachricht geschickt hat."},"questions":[{"prompt":"最初消息声称什么？","options":["周二停课","更换教材","增加学费"],"answer":0,"explanation":"der Kurs am Dienstag ausfällt。"},{"prompt":"消息缺什么？","options":["地图","日期和负责人姓名","照片"],"answer":1,"explanation":"weder ein Datum noch den Namen。"},{"prompt":"实际改变什么？","options":["日期","学校","教室"],"answer":2,"explanation":"in einem anderen Raum。"},{"prompt":"Anna 保存什么？","options":["确认消息","银行密码","购物单"],"answer":0,"explanation":"speichert die Bestätigung。"}],"writing":"围绕“消息与信息核实”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“消息与信息核实”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"de-19","npc":"Lena","place":"社区消息栏","scene":"群里转来一条通知。先核实来源，再决定要不要改变计划。","text":"Haben Sie diese Information schon bei der Schule überprüft?","zh":"您已向学校核实过这项信息了吗？","icon":"idea"},"support":{"id":"de-19","pronunciation":{"focus":"核实时的信息重音","explanation":"核实信息时可重读 wer、wann，疑问从句末尾动词仍清楚发音。","examples":[{"text":"wer","zh":"谁"},{"text":"wann","zh":"何时"}]},"grammarNotes":["bevor 时间从句中动词末位。","间接问谁写的，用 wer…geschrieben hat。","damit 目的从句动词末位，主语可不同。"],"cultureNote":"不明消息可向熟悉的联系方式核实，转述时区分消息内容与已确认事实。","vocabularyNotes":[{"head":"die Aufgabe","note":"Aufgabe 可配 klären，明确核实任务。"},{"head":"die Frist","note":"Frist 是期限，Welche Frist gilt? 问适用期限。"},{"head":"übernehmen","note":"übernehmen 不可分，可接 die Prüfung der Angaben。"}],"transfer":[{"id":"de-19-transfer-1","prompt":"收到教室变更通知","text":"Ich habe eine Mitteilung über einen Raumwechsel erhalten.","zh":"我收到换教室的通知。","explanation":"erhalten 分词无 ge-。"},{"id":"de-19-transfer-2","prompt":"指出缺发送日期","text":"Aus der Mitteilung geht nicht hervor, wann sie verschickt wurde.","zh":"通知未说明何时发送。","explanation":"间接疑问 wurde 末位。"},{"id":"de-19-transfer-3","prompt":"先核实再转发","text":"Bevor ich die Nachricht weiterleite, frage ich im Sekretariat nach.","zh":"转发消息前我向办公室询问。","explanation":"从句 weiterleite 合写，主句 nach 置末。"},{"id":"de-19-transfer-4","prompt":"拨已存号码","text":"Ich rufe unter der Nummer an, die ich schon gespeichert habe.","zh":"我拨打之前保存的号码。","explanation":"Nummer 阴性，关系代词 die 作宾语。"},{"id":"de-19-transfer-5","prompt":"确认后通知小组","text":"Wenn der neue Raum bestätigt ist, informiere ich unsere Gruppe.","zh":"新教室确认后我通知小组。","explanation":"前置从句后主句动词先行。"},{"id":"de-19-transfer-6","prompt":"归档便于查找","text":"Ich lege die Antwort in einem Ordner ab, damit ich sie später finde.","zh":"我把答复存进文件夹以便以后找到。","explanation":"damit 从句 finde 末位。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Bevor ich antworte, prüfe ich die Adresse.","Bevor ich antworte, ich prüfe die Adresse.","Bevor ich antworte, prüfen ich die Adresse."],"answer":0,"explanation":"前置从句后主句变位动词先行。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich frage, wer die Nachricht geschrieben haben.","Ich frage, wer die Nachricht geschrieben hat.","Ich frage, wer hat die Nachricht geschrieben."],"answer":1,"explanation":"间接疑问完成时助动词末位。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich speichere sie, damit ich finde sie wieder.","Ich speichere sie, damit ich sie wiederfinden.","Ich speichere sie, damit ich sie wiederfinde."],"answer":2,"explanation":"从句可分动词合写，ich 配 wiederfinde。"}],"writingChecklist":["逐句核对：bevor 时间从句中动词末位。","检查本章表达：间接问谁写的，用 wer…geschrieben hat。","写入具体情境细节，并核对：damit 目的从句动词末位，主语可不同。"],"speakingFollowups":["这条通知是谁发来的？","学校确认的是哪个教室？","您能告诉我哪里能找到最新确认？"]}},{"id":"de-20","number":20,"title":"投诉与协商解决","level":"B1","stage":"intermediate","goal":"将已学表达迁移到投诉与协商解决，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Ich habe dieses Gerät gestern gekauft.","zh":"我昨天买了这台设备。"},{"text":"Zu Hause habe ich bemerkt, dass ein Teil fehlt.","zh":"在家我发现少了一个部件。"}]},"vocab":[{"head":"die Reparatur","zh":"维修","example":"Wie lange dauert die Reparatur?","exampleZh":"维修需要多久？","icon":"home","review":true},{"head":"der Kostenvoranschlag","zh":"费用预估","example":"Ich möchte zuerst einen Kostenvoranschlag erhalten.","exampleZh":"我想先收到费用预估。","icon":"money","review":true},{"head":"prüfen","zh":"检查","example":"Das Gerät wird zuerst geprüft.","exampleZh":"设备会先接受检查。","icon":"idea","review":true},{"head":"ersetzen","zh":"更换","example":"Muss dieses Teil ersetzt werden?","exampleZh":"这个部件必须更换吗？","icon":"home","review":true},{"head":"die Gebühr","zh":"费用","example":"Fällt für die Prüfung eine Gebühr an?","exampleZh":"检查会收费吗？","icon":"money","review":true},{"head":"abholen","zh":"取走","example":"Wann kann ich das Gerät abholen?","exampleZh":"我什么时候能取设备？","icon":"travel","review":true},{"head":"der Defekt","zh":"故障","example":"Der Defekt tritt nur manchmal auf.","exampleZh":"故障只偶尔出现。","icon":"idea","review":true},{"head":"der Auftrag","zh":"委托；订单","example":"Bitte beginnen Sie erst nach meiner Zustimmung mit dem Auftrag.","exampleZh":"请在我同意后再开始执行委托。","icon":"work","review":true},{"head":"die Zustimmung","zh":"同意","example":"Meine Zustimmung erhalten Sie schriftlich.","exampleZh":"我会书面表示同意。","icon":"talk","review":true},{"head":"die Werkstatt","zh":"维修店","example":"Die Werkstatt ruft mich nach der Prüfung an.","exampleZh":"维修店检查后给我打电话。","icon":"work","review":true}],"lessons":[{"id":"de-20-1","text":"Ich habe dieses Gerät gestern gekauft.","zh":"我昨天买了这台设备。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-20-2","text":"Zu Hause habe ich bemerkt, dass ein Teil fehlt.","zh":"在家我发现少了一个部件。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-20-3","text":"Ich habe den Beleg mitgebracht und möchte das Problem erklären.","zh":"我带了凭证，想说明问题。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-20-4","text":"Können Sie mir sagen, welche Möglichkeiten es gibt?","zh":"您能告诉我有哪些解决选项吗？","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-20-5","text":"Falls Sie es prüfen müssen, wann bekomme ich eine Antwort?","zh":"如果需要检查，我什么时候能得到答复？","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-20-6","text":"Bitte geben Sie mir eine Nummer für meine Anfrage.","zh":"请给我一个咨询编号。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Ich habe dieses Gerät gestern gekauft. Zu Hause habe ich bemerkt, dass ein Teil fehlt. Ich habe den Beleg mitgebracht und möchte das Problem erklären. Können Sie mir sagen, welche Möglichkeiten es gibt? Falls Sie es prüfen müssen, wann bekomme ich eine Antwort? Bitte geben Sie mir eine Nummer für meine Anfrage.","zh":"我昨天买了这台设备。在家我发现少了一个部件。我带了凭证，想说明问题。您能告诉我有哪些解决选项吗？如果需要检查，我什么时候能得到答复？请给我一个咨询编号。"},"assessment":{"reading":{"title":"陌生情境验收","text":"Am Montag kauft Chen eine Lampe für sein Zimmer. Beim Zusammenbauen bemerkt er, dass ein Teil nicht passt. Er liest die Anleitung noch einmal und macht zwei Fotos. Am Mittwoch geht er mit den Fotos und dem Beleg ins Geschäft. Die Mitarbeiterin hört ihm zu, möchte aber erst beim technischen Dienst nachfragen. Eine sofortige Erstattung verspricht sie nicht. Chen bekommt eine Nummer für seine Anfrage und soll die Antwort am Freitag per E-Mail erhalten."},"questions":[{"prompt":"Chen 买了什么？","options":["灯","鞋子","手机"],"answer":0,"explanation":"eine Lampe。"},{"prompt":"部件有什么问题？","options":["颜色浅","装配不合适","完全丢失"],"answer":1,"explanation":"ein Teil nicht passt。"},{"prompt":"是否立即承诺退款？","options":["是","只退一半","没有"],"answer":2,"explanation":"Eine sofortige Erstattung verspricht sie nicht。"},{"prompt":"何时预计收到答复？","options":["周五","周一","当天上午"],"answer":0,"explanation":"am Freitag per E-Mail。"}],"writing":"围绕“投诉与协商解决”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“投诉与协商解决”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"de-20","npc":"Jonas","place":"商店服务台","scene":"买到的商品出了问题。平静讲经过，再询问可以采取的步骤。","text":"Was ist mit dem Produkt passiert?","zh":"商品出了什么情况？","icon":"talk"},"support":{"id":"de-20","pronunciation":{"focus":"投诉的平稳语调","explanation":"陈述故障用平稳降调；询问方案突出重点词，避免逐词重读。","examples":[{"text":"defekt","zh":"坏的"},{"text":"ersetzen","zh":"更换"}]},"grammarNotes":["发现问题用完成时，dass 内容从句动词末位。","间接询问为 welche Möglichkeiten es gibt。","falls 条件从句先行时主句动词仍须紧接。"],"cultureNote":"投诉时先说明购买信息与现象，再询问可行处理；实际方案依具体情况确定。","vocabularyNotes":[{"head":"die Reparatur","note":"eine Reparatur anbieten 表提出维修方案。"},{"head":"der Kostenvoranschlag","note":"Kostenvoranschlag 是事先估算，不等同最终账单。"},{"head":"prüfen","note":"prüfen 接宾格对象，可指设备或材料。"}],"transfer":[{"id":"de-20-transfer-1","prompt":"说明购壶时间","text":"Ich habe den Wasserkocher am Montag in Ihrer Filiale gekauft.","zh":"我周一在贵门店买了电热水壶。","explanation":"gekauft 置句末。"},{"id":"de-20-transfer-2","prompt":"发现盖子关不上","text":"Beim ersten Gebrauch habe ich bemerkt, dass der Deckel nicht schließt.","zh":"首次使用时发现盖子关不上。","explanation":"dass 从句 schließt 末位。"},{"id":"de-20-transfer-3","prompt":"提供凭证照片","text":"Ich kann Ihnen ein Foto des Belegs zeigen.","zh":"我能给您看凭证照片。","explanation":"Ihnen 第三格，Foto 宾格。"},{"id":"de-20-transfer-4","prompt":"询问下一步","text":"Könnten Sie mir erklären, wie wir weiter vorgehen können?","zh":"您能解释下一步怎么处理吗？","explanation":"间接疑问 können 末位。"},{"id":"de-20-transfer-5","prompt":"问留件后通知方式","text":"Falls das Gerät hierbleiben muss, wie informieren Sie mich über das Ergebnis?","zh":"若设备必须留在这里，您如何通知结果？","explanation":"falls 从句 muss 末位，后接疑问主句。"},{"id":"de-20-transfer-6","prompt":"请求处理编号","text":"Bitte schicken Sie mir eine Bestätigung mit der Vorgangsnummer.","zh":"请发含处理编号的确认。","explanation":"mit 后第三格。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Ich habe bemerkt, dass ein Kabel fehlen.","Ich habe bemerkt, dass ein Kabel fehlt.","Ich habe bemerkt, dass fehlt ein Kabel."],"answer":1,"explanation":"dass 从句动词末位，Kabel 单数。"},{"prompt":"选择语法与词序正确的句子。","options":["Welche Möglichkeiten es gibt?","Welche Möglichkeiten geben es?","Welche Möglichkeiten gibt es?"],"answer":2,"explanation":"独立疑问动词跟在疑问短语后，固定 es gibt。"},{"prompt":"选择语法与词序正确的句子。","options":["Falls es länger dauert, rufen Sie mich bitte an.","Falls es länger dauert, Sie rufen mich bitte an.","Falls dauert es länger, rufen Sie mich bitte an."],"answer":0,"explanation":"条件从句动词末位，主句动词先行。"}],"writingChecklist":["逐句核对：发现问题用完成时，dass 内容从句动词末位。","检查本章表达：间接询问为 welche Möglichkeiten es gibt。","写入具体情境细节，并核对：falls 条件从句先行时主句动词仍须紧接。"],"speakingFollowups":["您第一次使用时发现了什么问题？","我需要提供哪些购买信息？","最晚什么时候能收到处理答复？"]}},{"id":"de-21","number":21,"title":"讲述过去的经历","level":"B1","stage":"intermediate","goal":"将已学表达迁移到讲述过去的经历，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Letzten Monat habe ich eine Freundin besucht.","zh":"上个月我去看望了一位朋友。"},{"text":"Ich bin früh losgefahren, weil ich den Weg nicht gut kannte.","zh":"我很早出发，因为不熟悉路线。"}]},"vocab":[{"head":"fahren","zh":"乘车；行驶","example":"Ich bin gestern nach Köln gefahren.","exampleZh":"我昨天乘车去了科隆。","icon":"travel","review":true},{"head":"buchen","zh":"预订","example":"Wir haben die Fahrkarten online gebucht.","exampleZh":"我们网上订了车票。","icon":"travel","review":true},{"head":"die Verspätung","zh":"晚点","example":"Der Zug hatte zwanzig Minuten Verspätung.","exampleZh":"火车晚点二十分钟。","icon":"travel","review":true},{"head":"ankommen","zh":"到达","example":"Wir sind am Mittag angekommen.","exampleZh":"我们中午到了。","icon":"travel","review":true},{"head":"der Anschluss","zh":"接续交通","example":"Ich habe meinen Anschluss verpasst.","exampleZh":"我错过了接续的车。","icon":"travel","review":true},{"head":"die Rückfahrt","zh":"返程","example":"Die Rückfahrt dauert zwei Stunden.","exampleZh":"返程需要两个小时。","icon":"travel","review":true},{"head":"der Ausflug","zh":"短途出游","example":"Unser Ausflug war sehr schön.","exampleZh":"我们的短途出游很愉快。","icon":"travel","review":true},{"head":"der Bahnsteig","zh":"站台","example":"Wir warten auf dem Bahnsteig.","exampleZh":"我们在站台等候。","icon":"travel","review":true},{"head":"direkt","zh":"直达的","example":"Dieser Zug fährt direkt nach Bonn.","exampleZh":"这班火车直达波恩。","icon":"travel","review":true},{"head":"vergleichen","zh":"比较","example":"Wir vergleichen die Preise.","exampleZh":"我们比较价格。","icon":"money","review":true}],"lessons":[{"id":"de-21-1","text":"Letzten Monat habe ich eine Freundin besucht.","zh":"上个月我去看望了一位朋友。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-21-2","text":"Ich bin früh losgefahren, weil ich den Weg nicht gut kannte.","zh":"我很早出发，因为不熟悉路线。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-21-3","text":"Als ich am Bahnhof ankam, war mein Zug schon weg.","zh":"我到车站时，火车已经开走了。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-21-4","text":"Ich habe um Hilfe gebeten und eine andere Verbindung gesucht.","zh":"我请求帮助，并寻找另一种接驳。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-21-5","text":"Dann habe ich meiner Freundin gesagt, dass ich später komme.","zh":"随后我告诉朋友我会晚到。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-21-6","text":"Am Ende konnten wir uns treffen und unseren Plan ändern.","zh":"最后我们见到了面，并调整了计划。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Letzten Monat habe ich eine Freundin besucht. Ich bin früh losgefahren, weil ich den Weg nicht gut kannte. Als ich am Bahnhof ankam, war mein Zug schon weg. Ich habe um Hilfe gebeten und eine andere Verbindung gesucht. Dann habe ich meiner Freundin gesagt, dass ich später komme. Am Ende konnten wir uns treffen und unseren Plan ändern.","zh":"上个月我去看望了一位朋友。我很早出发，因为不熟悉路线。我到车站时，火车已经开走了。我请求帮助，并寻找另一种接驳。随后我告诉朋友我会晚到。最后我们见到了面，并调整了计划。"},"assessment":{"reading":{"title":"陌生情境验收","text":"Am Samstag wollte Mei mit ihrer Freundin eine Ausstellung besuchen. Als sie aus dem Haus ging, regnete es stark. Der Bus kam später als gewöhnlich, deshalb rief Mei ihre Freundin an und erklärte die Verspätung. Sie prüfte auch eine andere Verbindung, doch dann kam ihr Bus. Die beiden trafen sich vierzig Minuten später als geplant. Vor dem Mittagessen blieb nur wenig Zeit. Deshalb sahen sie sich nur einen Ausstellungsraum an und beschlossen, an einem anderen Tag wiederzukommen."},"questions":[{"prompt":"天气怎样？","options":["下雨","晴朗","下雪"],"answer":0,"explanation":"regnete es stark。"},{"prompt":"为何打电话？","options":["订座","解释迟到","找钱包"],"answer":1,"explanation":"erklärte die Verspätung。"},{"prompt":"晚了多久见面？","options":["四分钟","一小时","四十分钟"],"answer":2,"explanation":"vierzig Minuten später。"},{"prompt":"他们最后怎样安排？","options":["只看一个展厅","看完所有展厅","没见面"],"answer":0,"explanation":"nur einen Ausstellungsraum。"}],"writing":"围绕“讲述过去的经历”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“讲述过去的经历”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"de-21","npc":"Mia","place":"朋友家的餐桌","scene":"朋友想听你的经历。按顺序说明发生了什么，以及你怎样处理。","text":"Wie war der Ausflug? Gab es eine unerwartete Situation?","zh":"出游怎么样？有没有意外情况？","icon":"travel"},"support":{"id":"de-21","pronunciation":{"focus":"叙事停顿","explanation":"Dann、Später 可作分段重音；gefahren 长 a 与 gebeten 长 e 清楚区分。","examples":[{"text":"gefahren","zh":"乘车去了"},{"text":"gebeten","zh":"请求了"}]},"grammarNotes":["单次过去事件常用 als，重复或条件常用 wenn。","动作可用完成时，背景常用 war、hatte、konnte。","dass 转述时态随语境，后续安排可用现在时。"],"cultureNote":"叙事先交代时间地点，再讲问题与解决方式，具体细节便于追问。","vocabularyNotes":[{"head":"fahren","note":"fahren 位移用 sein，losfahren 分词 losgefahren。"},{"head":"buchen","note":"buchen 用 haben，分词 gebucht。"},{"head":"die Verspätung","note":"wegen der Verspätung 表因为晚点。"}],"transfer":[{"id":"de-21-transfer-1","prompt":"讲参观展览","text":"Letzte Woche habe ich mit meinem Bruder eine Ausstellung besucht.","zh":"上周我和兄弟看了展览。","explanation":"besucht 无 ge-。"},{"id":"de-21-transfer-2","prompt":"说明早出发原因","text":"Wir sind zeitig losgefahren, weil wir unterwegs frühstücken wollten.","zh":"我们早出发因为想路上吃早饭。","explanation":"位移用 sind，weil 后 wollten 末位。"},{"id":"de-21-transfer-3","prompt":"讲抵达未开门","text":"Als wir am Museum ankamen, waren die Türen noch geschlossen.","zh":"我们到博物馆时门还关着。","explanation":"单次过去用 als。"},{"id":"de-21-transfer-4","prompt":"向工作人员问咖啡馆","text":"Wir haben einen Mitarbeiter nach einem offenen Café gefragt.","zh":"我们向工作人员问营业中的咖啡馆。","explanation":"人宾格，nach 后第三格。"},{"id":"de-21-transfer-5","prompt":"转述朋友晚到","text":"Meine Freundin hat geschrieben, dass sie erst am Nachmittag kommt.","zh":"朋友写来说下午才到。","explanation":"dass 从句 kommt 末位。"},{"id":"de-21-transfer-6","prompt":"讲最终调整行程","text":"Schließlich konnten wir zuerst spazieren gehen und später die Ausstellung sehen.","zh":"最后我们得以先散步再看展览。","explanation":"konnten 后接原形。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Als ich ankam, das Büro war geschlossen.","Als ich ankam, waren das Büro geschlossen.","Als ich ankam, war das Büro geschlossen."],"answer":2,"explanation":"前置 als 从句后 war 先行，Büro 单数。"},{"prompt":"选择语法与词序正确的句子。","options":["Wir sind früh losgefahren.","Wir haben früh losgefahren.","Wir sind früh losgefahrt."],"answer":0,"explanation":"位移用 sein，分词 losgefahren。"},{"prompt":"选择语法与词序正确的句子。","options":["Sie sagte, dass sie später kommen.","Sie sagte, dass sie später kommt.","Sie sagte, dass kommt sie später."],"answer":1,"explanation":"从句动词末位，单数 sie 配 kommt。"}],"writingChecklist":["逐句核对：单次过去事件常用 als，重复或条件常用 wenn。","检查本章表达：动作可用完成时，背景常用 war、hatte、konnte。","写入具体情境细节，并核对：dass 转述时态随语境，后续安排可用现在时。"],"speakingFollowups":["当时为什么提前出发？","错过车后您向谁求助了？","后来你们怎样改变了原来的计划？"]}},{"id":"de-22","number":22,"title":"计划与备选方案","level":"B1","stage":"intermediate","goal":"将已学表达迁移到计划与备选方案，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Wir möchten am nächsten Sonntag einen Ausflug machen.","zh":"我们想在下周日出游。"},{"text":"Zuerst müssen wir uns auf eine Abfahrtszeit einigen.","zh":"首先我们必须商定出发时间。"}]},"vocab":[{"head":"einladen","zh":"邀请","example":"Ich lade dich am Samstag zum Essen ein.","exampleZh":"我邀请你星期六来吃饭。","icon":"talk","review":true},{"head":"die Einladung","zh":"邀请","example":"Danke für deine Einladung.","exampleZh":"谢谢你的邀请。","icon":"talk","review":true},{"head":"leider","zh":"遗憾地","example":"Leider kann ich am Samstag nicht kommen.","exampleZh":"可惜星期六我来不了。","icon":"talk","review":true},{"head":"weil","zh":"因为","example":"Ich bleibe zu Hause, weil ich Besuch bekomme.","exampleZh":"我在家，因为有客人来。","icon":"talk","review":true},{"head":"passen","zh":"合适","example":"Passt dir der Sonntag besser?","exampleZh":"星期日对你更合适吗？","icon":"time","review":true},{"head":"mitbringen","zh":"带来","example":"Soll ich etwas zum Trinken mitbringen?","exampleZh":"我要带点喝的吗？","icon":"food","review":true},{"head":"das Treffen","zh":"聚会；见面","example":"Unser Treffen beginnt um sechs Uhr.","exampleZh":"我们的聚会六点开始。","icon":"talk","review":true},{"head":"absagen","zh":"取消","example":"Ich muss das Treffen leider absagen.","exampleZh":"可惜我得取消见面。","icon":"talk","review":true},{"head":"sich freuen","zh":"期待；高兴","example":"Ich freue mich auf den Abend.","exampleZh":"我期待这个晚上。","icon":"talk","review":true},{"head":"der Besuch","zh":"来访；访客","example":"Wir bekommen morgen Besuch.","exampleZh":"明天有人来拜访我们。","icon":"person","review":true}],"lessons":[{"id":"de-22-1","text":"Wir möchten am nächsten Sonntag einen Ausflug machen.","zh":"我们想在下周日出游。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-22-2","text":"Zuerst müssen wir uns auf eine Abfahrtszeit einigen.","zh":"首先我们必须商定出发时间。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-22-3","text":"Wenn es regnet, können wir etwas drinnen unternehmen.","zh":"如果下雨，我们可以安排室内活动。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-22-4","text":"Ich möchte den Plan bestätigen, bevor ich Fahrkarten kaufe.","zh":"我想在买票前确认计划。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-22-5","text":"Vielleicht sollten wir am Nachmittag etwas Zeit frei lassen.","zh":"也许我们应该在下午留些空闲时间。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-22-6","text":"So können wir ohne Stress auf Änderungen reagieren.","zh":"这样我们能从容应对变动。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Wir möchten am nächsten Sonntag einen Ausflug machen. Zuerst müssen wir uns auf eine Abfahrtszeit einigen. Wenn es regnet, können wir etwas drinnen unternehmen. Ich möchte den Plan bestätigen, bevor ich Fahrkarten kaufe. Vielleicht sollten wir am Nachmittag etwas Zeit frei lassen. So können wir ohne Stress auf Änderungen reagieren.","zh":"我们想在下周日出游。首先我们必须商定出发时间。如果下雨，我们可以安排室内活动。我想在买票前确认计划。也许我们应该在下午留些空闲时间。这样我们能从容应对变动。"},"assessment":{"reading":{"title":"陌生情境验收","text":"Lena und zwei Freunde möchten am Sonntag die Stadt verlassen. Sie vergleichen zwei Orte, die mit dem Zug erreichbar sind. In einem Ort gibt es einen Park am Fluss, im anderen ein Museum in Bahnhofsnähe. Sie haben noch keine Fahrkarten gekauft, weil sie auf die Wettervorhersage warten. Bei Regen wollen sie ins Museum gehen. Einer der Freunde arbeitet am Montag früh, deshalb möchten sie vor acht Uhr abends zurück sein. Den endgültigen Plan bestätigen sie am Freitag."},"questions":[{"prompt":"哪天出游？","options":["周日","周三","周一"],"answer":0,"explanation":"am Sonntag。"},{"prompt":"为什么未买票？","options":["没钱","等天气预报","找不到车站"],"answer":1,"explanation":"auf die Wettervorhersage warten。"},{"prompt":"雨天去哪？","options":["河边","公园","博物馆"],"answer":2,"explanation":"ins Museum。"},{"prompt":"为何早些返回？","options":["朋友周一早班","学校关门","餐厅搬走"],"answer":0,"explanation":"arbeitet am Montag früh。"}],"writing":"围绕“计划与备选方案”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“计划与备选方案”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"de-22","npc":"Lena","place":"周末计划桌","scene":"你们一起商量出游。提出一个计划，再准备一个备选方案。","text":"Was können wir machen, wenn es regnet?","zh":"如果下雨，我们可以做什么？","icon":"nature"},"support":{"id":"de-22","pronunciation":{"focus":"条件与建议语调","explanation":"wenn 从句可轻微升调等待主句；sollten 的 o 是短元音。","examples":[{"text":"sollten","zh":"应该，建议式"},{"text":"Ausflug","zh":"郊游"}]},"grammarNotes":["wenn 条件从句变位动词末位。","sich einigen auf 加宾格。","sollten 加原形提出建议，不表示安排已定。"],"cultureNote":"共同出行先核对集合点和备选活动，天气或班次改变时重新确认。","vocabularyNotes":[{"head":"einladen","note":"jemanden zu einem Ausflug einladen 表邀请郊游。"},{"head":"die Einladung","note":"Einladung 是邀请本身，不能直接替代活动。"},{"head":"leider","note":"leider 可说明限制，如 Leider ist das Museum geschlossen。"}],"transfer":[{"id":"de-22-transfer-1","prompt":"计划骑车去湖边","text":"Wir möchten am Samstag mit dem Fahrrad zum See fahren.","zh":"我们想周六骑车去湖边。","explanation":"fahren 原形置末。"},{"id":"de-22-transfer-2","prompt":"协商集合点","text":"Wir müssen uns noch auf einen Treffpunkt einigen.","zh":"我们还需商定集合点。","explanation":"反身 uns，auf 后宾格。"},{"id":"de-22-transfer-3","prompt":"准备大风方案","text":"Wenn es zu windig ist, besuchen wir stattdessen die Ausstellung.","zh":"若风太大就改看展览。","explanation":"从句 ist 末位，主句 besuchen 紧接。"},{"id":"de-22-transfer-4","prompt":"订票前核对人数","text":"Bevor ich die Tickets bestelle, möchte ich die Teilnehmerzahl wissen.","zh":"订票前我想知道人数。","explanation":"bevor 从句动词末位。"},{"id":"de-22-transfer-5","prompt":"建议安排休息","text":"Wir sollten nach dem Mittagessen eine Pause einplanen.","zh":"我们应午饭后安排休息。","explanation":"sollten 后 einplanen 完整。"},{"id":"de-22-transfer-6","prompt":"说明备用路线用途","text":"Mit einer zweiten Route können wir auf gesperrte Wege reagieren.","zh":"有第二路线就能应对封路。","explanation":"auf etwas reagieren 用宾格。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Wenn es regnet, bleiben wir drinnen.","Wenn es regnet, wir bleiben drinnen.","Wenn regnet es, bleiben wir drinnen."],"answer":0,"explanation":"从句动词末位，主句动词先行。"},{"prompt":"选择语法与词序正确的句子。","options":["Wir einigen uns auf einem Ort.","Wir einigen uns auf einen Ort.","Wir einigen sich auf einen Ort."],"answer":1,"explanation":"wir 配 uns，einigen auf 支配宾格。"},{"prompt":"选择语法与词序正确的句子。","options":["Wir sollten früher startet.","Wir sollte früher starten.","Wir sollten früher starten."],"answer":2,"explanation":"wir 用 sollten，后接原形。"}],"writingChecklist":["逐句核对：wenn 条件从句变位动词末位。","检查本章表达：sich einigen auf 加宾格。","写入具体情境细节，并核对：sollten 加原形提出建议，不表示安排已定。"],"speakingFollowups":["大家能接受哪个集合地点？","如果大雨持续，备选活动是什么？","我们最晚周几确认人数？"]}},{"id":"de-23","number":23,"title":"邻里与共同生活","level":"B1","stage":"intermediate","goal":"将已学表达迁移到邻里与共同生活，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Ich wohne mit zwei anderen Personen in einer Wohnung.","zh":"我和另外两个人合住。"},{"text":"Wir möchten Regeln für die gemeinsamen Räume vereinbaren.","zh":"我们想商定公共区域的规则。"}]},"vocab":[{"head":"aufstehen","zh":"起床","example":"Ich stehe um sieben Uhr auf.","exampleZh":"我七点起床。","icon":"time","review":true},{"head":"aufräumen","zh":"收拾","example":"Am Abend räume ich die Küche auf.","exampleZh":"晚上我收拾厨房。","icon":"home","review":true},{"head":"waschen","zh":"洗","example":"Ich wasche am Samstag die Wäsche.","exampleZh":"我星期六洗衣服。","icon":"home","review":true},{"head":"kochen","zh":"做饭","example":"Mein Bruder kocht heute das Abendessen.","exampleZh":"我哥哥或弟弟今天做晚饭。","icon":"food","review":true},{"head":"sich kümmern","zh":"照顾；负责","example":"Ich kümmere mich um die Pflanzen.","exampleZh":"我照料植物。","icon":"nature","review":true},{"head":"der Haushalt","zh":"家务；家庭事务","example":"Wir teilen uns die Arbeit im Haushalt.","exampleZh":"我们分担家务。","icon":"home","review":true},{"head":"die Küche","zh":"厨房","example":"Die Küche ist morgens frei.","exampleZh":"厨房早上没人用。","icon":"home","review":true},{"head":"gewöhnlich","zh":"通常","example":"Gewöhnlich frühstücke ich zu Hause.","exampleZh":"我通常在家吃早饭。","icon":"time","review":true},{"head":"der Alltag","zh":"日常生活","example":"Mein Alltag beginnt früh.","exampleZh":"我的日常生活很早开始。","icon":"time","review":true},{"head":"einschlafen","zh":"入睡","example":"Ich schlafe oft vor elf Uhr ein.","exampleZh":"我经常十一点前入睡。","icon":"health","review":true}],"lessons":[{"id":"de-23-1","text":"Ich wohne mit zwei anderen Personen in einer Wohnung.","zh":"我和另外两个人合住。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-23-2","text":"Wir möchten Regeln für die gemeinsamen Räume vereinbaren.","zh":"我们想商定公共区域的规则。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-23-3","text":"Unter der Woche muss ich ziemlich früh schlafen gehen.","zh":"工作日我必须较早睡觉。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-23-4","text":"Ich kann die Küche putzen, wenn jemand den Müll rausbringt.","zh":"如果有人倒垃圾，我可以打扫厨房。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-23-5","text":"Bei einem Problem möchte ich lieber direkt miteinander sprechen.","zh":"遇到问题，我更想直接交谈。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-23-6","text":"In zwei Wochen können wir unsere Vereinbarung überprüfen.","zh":"两周后我们可以重新讨论约定。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Ich wohne mit zwei anderen Personen in einer Wohnung. Wir möchten Regeln für die gemeinsamen Räume vereinbaren. Unter der Woche muss ich ziemlich früh schlafen gehen. Ich kann die Küche putzen, wenn jemand den Müll rausbringt. Bei einem Problem möchte ich lieber direkt miteinander sprechen. In zwei Wochen können wir unsere Vereinbarung überprüfen.","zh":"我和另外两个人合住。我们想商定公共区域的规则。工作日我必须较早睡觉。如果有人倒垃圾，我可以打扫厨房。遇到问题，我更想直接交谈。两周后我们可以重新讨论约定。"},"assessment":{"reading":{"title":"陌生情境验收","text":"Luis teilt sich eine Wohnung mit Sara und Paul. In letzter Zeit steht morgens oft schmutziges Geschirr in der Küche. Luis möchte keinen ärgerlichen Zettel schreiben, sondern bittet um ein Gespräch am Sonntag. Die drei verteilen die Aufgaben neu und vereinbaren, das Geschirr nicht bis zum nächsten Tag stehen zu lassen. Sara arbeitet im Schichtdienst und braucht deshalb flexible Zeiten. Sie wollen den neuen Plan zwei Wochen lang ausprobieren und danach gemeinsam überlegen, ob er im Alltag funktioniert."},"questions":[{"prompt":"主要问题在哪？","options":["厨房","火车站","学校"],"answer":0,"explanation":"schmutziges Geschirr in der Küche。"},{"prompt":"何时交谈？","options":["周五","周日","周三"],"answer":1,"explanation":"am Sonntag。"},{"prompt":"Sara 为什么要灵活时间？","options":["在度假","不合住","轮班工作"],"answer":2,"explanation":"arbeitet im Schichtdienst。"},{"prompt":"试行多久？","options":["两周","两年","一天"],"answer":0,"explanation":"zwei Wochen lang。"}],"writing":"围绕“邻里与共同生活”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“邻里与共同生活”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"de-23","npc":"Jonas","place":"公寓公共厨房","scene":"你和室友需要分配家务。把自己的困难说清楚，也回应对方的需要。","text":"Wie können wir die Aufgaben im Haushalt besser verteilen?","zh":"我们怎样才能更好地分配家务？","icon":"home"},"support":{"id":"de-23","pronunciation":{"focus":"家务动词的重音","explanation":"aufräumen、rausbringen 重读前缀；分工时可适度重读人称。","examples":[{"text":"aufräumen","zh":"收拾"},{"text":"rausbringen","zh":"拿出去"}]},"grammarNotes":["mit 加第三格，复数 mit zwei Mitbewohnern 加 n。","wenn 从句中可分动词合写并置末。","möchten、können 后动作原形保持完整。"],"cultureNote":"合住者对安静、访客和清洁期待不同，可协商具体约定。","vocabularyNotes":[{"head":"aufstehen","note":"aufstehen 完成时用 sein，可配 früh 或 spät。"},{"head":"aufräumen","note":"aufräumen 侧重整理，putzen 侧重清洁。"},{"head":"waschen","note":"洗碗通常用 das Geschirr spülen，洗衣服用 Wäsche waschen。"}],"transfer":[{"id":"de-23-transfer-1","prompt":"介绍合住安排","text":"Seit diesem Monat teile ich mir eine Wohnung mit einer Kollegin.","zh":"从本月起我和一名女同事合住。","explanation":"mit 后第三格。"},{"id":"de-23-transfer-2","prompt":"讨论访客留宿","text":"Wir sollten besprechen, wann Besuch übernachten kann.","zh":"我们应该讨论访客何时可留宿。","explanation":"间接疑问 kann 末位。"},{"id":"de-23-transfer-3","prompt":"说明白天需安静","text":"Nach meiner Nachtschicht brauche ich vormittags Ruhe.","zh":"夜班后我上午需要安静。","explanation":"时间置首后 brauche 第二位。"},{"id":"de-23-transfer-4","prompt":"交换家务","text":"Ich übernehme das Bad, wenn du diese Woche den Flur putzt.","zh":"若你这周打扫走廊，我负责浴室。","explanation":"从句 du 配 putzt。"},{"id":"de-23-transfer-5","prompt":"邀请面谈噪音","text":"Können wir heute Abend in Ruhe über die laute Musik sprechen?","zh":"我们今晚能平静谈谈音乐太响的问题吗？","explanation":"über 后宾格。"},{"id":"de-23-transfer-6","prompt":"月底评估分工","text":"Am Monatsende schauen wir gemeinsam, ob die Aufteilung funktioniert.","zh":"月底一起看看分工是否有效。","explanation":"ob 从句 funktioniert 末位。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Ich wohne mit zwei Mitbewohners.","Ich wohne mit zwei Mitbewohnern.","Ich wohne mit zwei Mitbewohner."],"answer":1,"explanation":"mit 后复数第三格加 n。"},{"prompt":"选择语法与词序正确的句子。","options":["Wenn du räumst auf, spüle ich das Geschirr.","Wenn du aufräumst, ich spüle das Geschirr.","Wenn du aufräumst, spüle ich das Geschirr."],"answer":2,"explanation":"从句中可分动词合写，主句动词紧接。"},{"prompt":"选择语法与词序正确的句子。","options":["Wir können die Aufgaben neu verteilen.","Wir können die Aufgaben neu verteilt.","Wir kann die Aufgaben neu verteilen."],"answer":0,"explanation":"wir 用 können，后接原形。"}],"writingChecklist":["逐句核对：mit 加第三格，复数 mit zwei Mitbewohnern 加 n。","检查本章表达：wenn 从句中可分动词合写并置末。","写入具体情境细节，并核对：möchten、können 后动作原形保持完整。"],"speakingFollowups":["你在哪些时段需要安静？","厨房和浴室的清洁如何分配？","我们什么时候再评估这个家务安排？"]}},{"id":"de-24","number":24,"title":"综合生活任务","level":"B1","stage":"intermediate","goal":"将已学表达迁移到综合生活任务，说明细节、请求澄清并记录后续行动。","grammar":{"title":"综合运用与迁移","explanation":"复用已学句式处理新情境。本章重点是把信息说清楚、按时间顺序说明，并在不确定时请求确认。请对照前章规则，保留重音、名词大小写和礼貌形式。","examples":[{"text":"Ich bin gerade umgezogen und muss mehrere Dinge erledigen.","zh":"我刚搬家，有几件事要办理。"},{"text":"Zuerst schreibe ich eine Liste mit den wichtigsten Aufgaben.","zh":"首先我列出最重要的任务。"}]},"vocab":[{"head":"die Überschneidung","zh":"时间冲突","example":"Es gibt eine Überschneidung mit meinem Kurs.","exampleZh":"这与我的课程时间冲突。","icon":"time","review":true},{"head":"verschieben","zh":"改期","example":"Obwohl ich früh angerufen habe, kann ich den Termin nicht verschieben.","exampleZh":"虽然我很早打了电话，仍无法改期。","icon":"time","review":true},{"head":"stattfinden","zh":"举行","example":"Die Beratung findet am Dienstag statt.","exampleZh":"咨询安排在星期二。","icon":"time","review":true},{"head":"die Bestätigung","zh":"确认函；确认","example":"Ich brauche eine schriftliche Bestätigung.","exampleZh":"我需要书面确认。","icon":"talk","review":true},{"head":"die Alternative","zh":"替代方案","example":"Gibt es eine Alternative am Nachmittag?","exampleZh":"下午有替代时段吗？","icon":"time","review":true},{"head":"rechtzeitig","zh":"及时地","example":"Bitte sagen Sie rechtzeitig ab.","exampleZh":"请及时取消预约。","icon":"time","review":true},{"head":"die Beratung","zh":"咨询","example":"Die Beratung dauert ungefähr eine Stunde.","exampleZh":"咨询大约一小时。","icon":"talk","review":true},{"head":"verhindert","zh":"因故无法参加的","example":"Am Mittwoch bin ich leider verhindert.","exampleZh":"星期三我有事不能参加。","icon":"time","review":true},{"head":"der Zeitraum","zh":"时间段","example":"In diesem Zeitraum bin ich flexibel.","exampleZh":"这段时间内我可以灵活安排。","icon":"time","review":true},{"head":"eintragen","zh":"记入","example":"Ich trage beide Termine in den Kalender ein.","exampleZh":"我把两个预约都记入日程表。","icon":"time","review":true}],"lessons":[{"id":"de-24-1","text":"Ich bin gerade umgezogen und muss mehrere Dinge erledigen.","zh":"我刚搬家，有几件事要办理。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-24-2","text":"Zuerst schreibe ich eine Liste mit den wichtigsten Aufgaben.","zh":"首先我列出最重要的任务。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-24-3","text":"Ich muss die Adresse und die Uhrzeit meines Termins bestätigen.","zh":"我必须确认预约地址和时间。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-24-4","text":"Wenn ich nicht kommen kann, sage ich rechtzeitig Bescheid.","zh":"如果不能来，我会及时通知。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-24-5","text":"Nach jedem Gespräch notiere ich die Antwort.","zh":"每次交谈后，我都记下答复。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"},{"id":"de-24-6","text":"Am Ende prüfe ich, welche Fragen noch offen sind.","zh":"最后我检查还有哪些问题没有解决。","tip":"先理解整句，再替换人物、时间和地点。请用新细节复述，不要只背原句。"}],"dialogue":[],"reading":{"title":"生活表达示范","text":"Ich bin gerade umgezogen und muss mehrere Dinge erledigen. Zuerst schreibe ich eine Liste mit den wichtigsten Aufgaben. Ich muss die Adresse und die Uhrzeit meines Termins bestätigen. Wenn ich nicht kommen kann, sage ich rechtzeitig Bescheid. Nach jedem Gespräch notiere ich die Antwort. Am Ende prüfe ich, welche Fragen noch offen sind.","zh":"我刚搬家，有几件事要办理。首先我列出最重要的任务。我必须确认预约地址和时间。如果不能来，我会及时通知。每次交谈后，我都记下答复。最后我检查还有哪些问题没有解决。"},"assessment":{"reading":{"title":"陌生情境验收","text":"Lin ist in ein neues Viertel gezogen. Am Mittwoch hat sie einen Termin, um Unterlagen abzugeben. Außerdem sucht sie einen Sprachkurs in der Nähe ihrer Wohnung. In der Terminbestätigung steht, dass die Beratung in einem anderen Gebäude stattfindet. Lin fragt nach der genauen Adresse und bereitet die genannten Unterlagen vor. Danach ruft sie eine Schule an. Ihr bevorzugter Kurs ist schon voll. Sie bittet um Informationen zu einem anderen Termin und notiert, dass diese Antwort noch fehlt."},"questions":[{"prompt":"预约在哪天？","options":["周三","周五","周一"],"answer":0,"explanation":"Am Mittwoch。"},{"prompt":"接待地点怎样？","options":["原地址","另一栋楼","只有网上"],"answer":1,"explanation":"in einem anderen Gebäude。"},{"prompt":"课程遇到什么问题？","options":["涨价","教材丢了","心仪课程已满"],"answer":2,"explanation":"bevorzugter Kurs ist schon voll。"},{"prompt":"还在等待什么？","options":["另一个时段信息","护照","租房合同"],"answer":0,"explanation":"Informationen zu einem anderen Termin。"}],"writing":"围绕“综合生活任务”，写80–100个目标语言词，包含背景、两个具体细节、请求和后续行动。写完检查时态、称呼与衔接，保存后修改一次。","speaking":"用目标语言模拟“综合生活任务”，持续约一分钟，再让伙伴提出两个追问。说明一个备选方案；没听懂时请求重复或改述。口语需自行或由合适的评阅者核对，系统不据此自动授予等级。"},"story":{"id":"de-24","npc":"Mia","place":"新社区的早晨","scene":"搬家后有几件事要办。先排出优先顺序，再确认还缺哪些信息。","text":"Welche Angelegenheit müssen Sie zuerst erledigen?","zh":"您需要先处理哪件事情？","icon":"idea"},"support":{"id":"de-24","pronunciation":{"focus":"条目式陈述","explanation":"Terminbestätigung 分块练读；每个事项后自然停顿，保留关键词重音。","examples":[{"text":"Termin","zh":"预约"},{"text":"Bestätigung","zh":"确认"}]},"grammarNotes":["用完成时交代已发生变化，再用现在时说明当前任务。","mit 后第三格，复数 mit den wichtigsten Unterlagen。","间接疑问动词末位，并按主语数变位。"],"cultureNote":"处理多项事务可记下答复并复述下一步，各机构要求分别确认。","vocabularyNotes":[{"head":"die Überschneidung","note":"Überschneidung mit 加第三格说明安排冲突。"},{"head":"verschieben","note":"verschieben 分词 verschoben，不加 ge-。"},{"head":"stattfinden","note":"stattfinden 分词 stattgefunden，完成时用 haben。"}],"transfer":[{"id":"de-24-transfer-1","prompt":"说明新工作安排","text":"Ich habe eine neue Stelle angefangen und muss meinen Alltag neu organisieren.","zh":"我开始新工作，得重新安排生活。","explanation":"完成时后接当前情态任务。"},{"id":"de-24-transfer-2","prompt":"列紧急任务","text":"Zuerst notiere ich, welche Aufgaben diese Woche besonders dringend sind.","zh":"我先记下这周哪些任务最急。","explanation":"间接疑问复数 sind 末位。"},{"id":"de-24-transfer-3","prompt":"核实所需材料","text":"Ich möchte bestätigen lassen, welche Unterlagen ich zum Gespräch mitbringen soll.","zh":"我想请对方确认面谈要带哪些材料。","explanation":"从句以 mitbringen soll 结尾。"},{"id":"de-24-transfer-4","prompt":"时间冲突及时联系","text":"Wenn sich zwei Termine überschneiden, melde ich mich sofort bei den Beteiligten.","zh":"两预约重叠时我立即联系相关人员。","explanation":"wenn 从句复数动词末位。"},{"id":"de-24-transfer-5","prompt":"记录答复期限","text":"Nach dem Telefonat schreibe ich auf, bis wann ich eine Antwort erwarten kann.","zh":"通话后记下最晚何时能等到答复。","explanation":"aufschreiben 分离，间接疑问 kann 末位。"},{"id":"de-24-transfer-6","prompt":"检查缺少的回复","text":"Zum Schluss kontrolliere ich, ob noch eine Rückmeldung fehlt.","zh":"最后检查是否还缺回复。","explanation":"单数 Rückmeldung 配 fehlt。"}],"grammarCheck":[{"prompt":"选择语法与词序正确的句子。","options":["Ich bin eine neue Stelle angefangen.","Ich habe eine neue Stelle angefangt.","Ich habe eine neue Stelle angefangen."],"answer":2,"explanation":"带宾语 anfangen 用 haben，分词 angefangen。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich komme mit den nötigen Unterlagen.","Ich komme mit die nötigen Unterlagen.","Ich komme mit der nötigen Unterlagen."],"answer":0,"explanation":"mit 后复数第三格 den nötigen Unterlagen。"},{"prompt":"选择语法与词序正确的句子。","options":["Ich prüfe, welche Antworten noch fehlt.","Ich prüfe, welche Antworten noch fehlen.","Ich prüfe, welche Antworten fehlen noch."],"answer":1,"explanation":"间接疑问动词末位，复数配 fehlen。"}],"writingChecklist":["逐句核对：用完成时交代已发生变化，再用现在时说明当前任务。","检查本章表达：mit 后第三格，复数 mit den wichtigsten Unterlagen。","写入具体情境细节，并核对：间接疑问动词末位，并按主语数变位。"],"speakingFollowups":["哪些事情必须这周先办完？","还有哪份答复尚未收到？","两个预约冲突时你会先联系谁？"]}}],"checkpoints":[{"id":"de-stage-1","afterChapter":6,"target":"A1","reading":{"text":"Am Dienstag geht Nora nach dem Kurs in einen kleinen Laden. Sie braucht zwei Hefte und einen Bleistift. Die Hefte kosten zusammen vier Euro. Nora hat nur einen großen Geldschein und fragt nach der Kartenzahlung. Das ist möglich. Danach sucht sie die Bushaltestelle. Eine Frau zeigt ihr den Weg: geradeaus bis zur Ampel und dann rechts. Der nächste Bus fährt um halb fünf. Nora hat noch zehn Minuten Zeit.","questions":[{"prompt":"诺拉何时
