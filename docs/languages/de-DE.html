去商店？","options":["上课前","上课后","周末"],"answer":1,"explanation":"文中说 nach dem Kurs。"},{"prompt":"两个本子多少钱？","options":["四欧元","两欧元","十欧元"],"answer":0,"explanation":"zusammen vier Euro 是共四欧元。"},{"prompt":"她怎样付款？","options":["用卡","硬币","没有付款"],"answer":0,"explanation":"她询问刷卡并获肯定答复。"},{"prompt":"公交几点开？","options":["五点半","四点整","四点半"],"answer":2,"explanation":"halb fünf 是四点半。"}]},"listening":{"text":"Guten Tag, hier ist die Buchhandlung am Markt. Ihr Wörterbuch ist da. Sie können es heute bis achtzehn Uhr abholen. Morgen öffnen wir erst um zehn Uhr. Bitte bringen Sie die Bestellnummer mit. Das Buch kostet zwölf Euro. Sie können bar oder mit Karte bezahlen. Wenn Sie Fragen haben, rufen Sie uns bitte zurück.","questions":[{"prompt":"哪里打来的电话？","options":["书店","诊所","车站"],"answer":0,"explanation":"Buchhandlung 是书店。"},{"prompt":"今天最晚几点取？","options":["十点","十八点","十二点"],"answer":1,"explanation":"bis achtzehn Uhr。"},{"prompt":"要带什么？","options":["车票","护照","订单号"],"answer":2,"explanation":"Bestellnummer 是订单号。"},{"prompt":"书价多少？","options":["十二欧元","二十欧元","十八欧元"],"answer":0,"explanation":"zwölf Euro。"}]},"writing":"给文具店写4—6句德语：说明需要两种物品，询问价格和付款方式，并确认周五取货时间。","speaking":"你想买词典，伙伴扮演店员。询问库存、价格和取货时间；对方说周五不营业后，提出另一个时间。"},{"id":"de-stage-2","afterChapter":12,"target":"A2","reading":{"text":"Am Wochenende wollte Felix seine Schwester besuchen. Er hatte ein Zimmer in der Nähe ihrer Wohnung reserviert. Am Samstagmorgen bekam er jedoch eine Nachricht: Seine Schwester war krank und brauchte Ruhe. Felix sagte den Besuch ab und rief im Hotel an. Das Zimmer konnte er auf die nächste Woche verschieben. Danach lud er einen Nachbarn zum Abendessen ein. Der Nachbar brachte einen Salat mit. Gemeinsam kochten sie eine Suppe und planten einen Spaziergang für Sonntag.","questions":[{"prompt":"最初想看谁？","options":["姐姐或妹妹","邻居","老师"],"answer":0,"explanation":"seine Schwester 为姐妹。"},{"prompt":"为何取消探访？","options":["没有票","姐妹生病需休息","酒店已满"],"answer":1,"explanation":"krank und brauchte Ruhe。"},{"prompt":"住宿怎样处理？","options":["改到下周","直接入住","转给邻居"],"answer":0,"explanation":"auf die nächste Woche verschieben。"},{"prompt":"邻居带来什么？","options":["面包","汤","沙拉"],"answer":2,"explanation":"brachte einen Salat mit。"}]},"listening":{"text":"Hallo Eva, ich bin gerade am Bahnhof angekommen. Mein Zug hatte etwas Verspätung, deshalb kann ich nicht um zwei Uhr bei dir sein. Ich nehme jetzt den Bus und komme ungefähr um halb drei. Den Kuchen habe ich schon gekauft. Du musst also keinen Nachtisch vorbereiten. Kannst du mir noch sagen, an welcher Haltestelle ich aussteigen soll?","questions":[{"prompt":"打电话者在哪里？","options":["机场","火车站","酒店"],"answer":1,"explanation":"am Bahnhof angekommen。"},{"prompt":"为何迟到？","options":["列车晚点","忘带钥匙","买错车票"],"answer":0,"explanation":"Zug hatte Verspätung。"},{"prompt":"大约何时到？","options":["两点","三点半","两点半"],"answer":2,"explanation":"halb drei 为两点半。"},{"prompt":"还需要问什么？","options":["下车站名","蛋糕价格","电话号码"],"answer":0,"explanation":"an welcher Haltestelle…aussteigen。"}]},"writing":"给朋友写60—80词：说明原定周末计划、无法参加的具体原因、一个新时间，并询问是否要带食物。","speaking":"你打电话改约，伙伴给出两个可用时间。选一个并说明原因，确认地点，再复述双方最终约定。"},{"id":"de-stage-3","afterChapter":18,"target":"B1","reading":{"text":"Lea arbeitet seit kurzem in einer kleinen Firma. Für eine Besprechung soll sie einen Raum buchen. Obwohl sie früh angefragt hat, ist der gewünschte Raum schon belegt. Sie findet eine Alternative im Nachbargebäude und bittet um eine schriftliche Bestätigung. Bevor sie die Einladung verschickt, prüft sie die Adresse und die technische Ausstattung. Ein Kollege, der die Präsentation vorbereitet, braucht einen Bildschirm. Wenn kein Bildschirm vorhanden ist, möchte er seinen eigenen mitbringen. Lea fragt deshalb noch einmal nach.","questions":[{"prompt":"莉娅要做什么？","options":["订会议室","开银行账户","修电脑"],"answer":0,"explanation":"einen Raum buchen。"},{"prompt":"原房间怎样？","options":["太小","已占用","停电"],"answer":1,"explanation":"schon belegt。"},{"prompt":"替代房间在哪里？","options":["邻栋楼","火车站","原楼地下室"],"answer":0,"explanation":"im Nachbargebäude。"},{"prompt":"同事需要什么？","options":["厨房","投影布","屏幕"],"answer":2,"explanation":"braucht einen Bildschirm。"}]},"listening":{"text":"Guten Tag, hier spricht Herr Weber aus der Werkstatt. Wir haben Ihren Drucker geprüft. Ein Kabel muss ersetzt werden. Bevor wir die Reparatur beginnen, möchten wir Ihnen die voraussichtlichen Kosten per E-Mail schicken. Bitte antworten Sie auf diese Nachricht, wenn Sie einverstanden sind. Ohne Ihre Rückmeldung warten wir mit der Reparatur. Bei Fragen erreichen Sie mich morgen zwischen neun und elf Uhr.","questions":[{"prompt":"已做了什么？","options":["检查打印机","寄出设备","更换所有零件"],"answer":0,"explanation":"Drucker geprüft。"},{"prompt":"什么需要更换？","options":["屏幕","电缆","墨盒"],"answer":1,"explanation":"Ein Kabel muss ersetzt werden。"},{"prompt":"开始维修前要做什么？","options":["发费用估算并等答复","直接扣款","取消订单"],"answer":0,"explanation":"先发成本信息，等待同意回复。"},{"prompt":"何时可电话联系？","options":["今天下午","明天九至十一点","周日全天"],"answer":1,"explanation":"morgen zwischen neun und elf Uhr。"}]},"writing":"写80—100词给会议场地方：说明所需日期人数与设备，询问可用房间和费用；说明若原时间不可用的备选时间，请对方书面确认。","speaking":"伙伴扮演维修人员。描述设备的具体故障，询问检查、估价和取件时间；听到需更换零件后，先请求费用说明再回应。"},{"id":"de-stage-4","afterChapter":24,"target":"B1","reading":{"text":"Nach ihrem Umzug möchte Mira an einem Kochkurs teilnehmen. In einer Nachricht liest sie, dass der Kurs früher beginnt. Der Absender ist ihr jedoch unbekannt. Deshalb ruft sie die Schule über die bereits gespeicherte Nummer an. Dort erfährt sie, dass die Nachricht veraltet ist. Der Kurs beginnt weiterhin um sieben Uhr. Mira informiert ihre Mitbewohnerin, mit der sie gemeinsam kochen wollte. Beide vereinbaren, das Abendessen auf den nächsten Tag zu verschieben. Mira speichert die aktuelle Kursbestätigung in ihrem Kalender.","questions":[{"prompt":"米拉想参加什么？","options":["烹饪课","骑车比赛","维修培训"],"answer":0,"explanation":"Kochkurs 为烹饪课。"},{"prompt":"她怎样核实消息？","options":["回复陌生发件人","拨已存学校电话","询问陌生群友"],"answer":1,"explanation":"über die bereits gespeicherte Nummer。"},{"prompt":"消息问题是什么？","options":["过时了","费用太高","没有日期"],"answer":0,"explanation":"Nachricht veraltet。"},{"prompt":"共同晚餐怎样安排？","options":["取消不再做","提前一小时","改到第二天"],"answer":2,"explanation":"auf den nächsten Tag verschieben。"}]},"listening":{"text":"Hallo zusammen, wegen der Baustelle können wir am Samstag nicht den Weg am Fluss nehmen. Ich schlage vor, dass wir uns um zehn Uhr vor der Bibliothek treffen und durch den Park gehen. Falls es stark regnet, könnten wir stattdessen die Fotoausstellung besuchen. Bitte sagt mir bis Freitagabend, ob ihr dabei seid. Danach schicke ich euch den endgültigen Treffpunkt noch einmal schriftlich.","questions":[{"prompt":"为什么换路线？","options":["施工","涨水","比赛"],"answer":0,"explanation":"wegen der Baustelle。"},{"prompt":"建议在哪里集合？","options":["公园门口","图书馆前","河边"],"answer":1,"explanation":"vor der Bibliothek。"},{"prompt":"大雨时的备选？","options":["看摄影展","去游泳","改坐船"],"answer":0,"explanation":"Fotoausstellung。"},{"prompt":"何时前回复？","options":["周六中午","周五晚上","周日早晨"],"answer":1,"explanation":"bis Freitagabend。"}]},"writing":"写90—120词说明一项共同计划的变更：交代原安排、已核实的新情况、对其他人的影响、两个可选方案和希望何时收到回复。","speaking":"你和伙伴协调合住生活与周末出游。解释一个时间冲突，询问对方优先需求，商定备选安排；伙伴再问两条细节，你需回答并最后复述决定。"}],"curriculumVersion":2};window.ContinentAudio={"Guten Tag":"../language-audio/bc08f943b6ab5b9b2aa966b7.mp3","Guten Tag, ich heiße Lina.":"../language-audio/dfb7c2412ae617265527431a.mp3","heißen":"../language-audio/de98bf4719681c94086249d1.mp3","Wie heißen Sie?":"../language-audio/1276eda66bea4502f49867b8.mp3","bitte":"../language-audio/968ff515e83c974935700ca6.mp3","Sprechen Sie bitte langsam.":"../language-audio/772d28f6be9c1876f71ff397.mp3","verstehen":"../language-audio/b590e49fd46905c9515bd013.mp3","Ich verstehe das nicht.":"../language-audio/376ec4d3eb7f7e59979c7549.mp3","wiederholen":"../language-audio/4796cedb32b036547437eb77.mp3","Können Sie das bitte wiederholen?":"../language-audio/77c9e233d06a793a330ee51d.mp3","danke":"../language-audio/fb88788e0836451a9d2a2300.mp3","Danke für Ihre Hilfe.":"../language-audio/3bef73433ebf69c6f7b4dda6.mp3","die Sprache" :"../language-audio/771b8f09cad5c753996cd636.mp3","die Milch":"../language-audio/a29b141caafb5dd8a05a0e95.mp3","Den Kaffee bitte mit Milch.":"../language-audio/426ca67cbfcd11925c9afb99.mp3","der Kuchen":"../language-audio/db0342eb42b881e933f81cbc.mp3","Ich nehme ein Stück Kuchen.":"../language-audio/545bd89a2f46ba849ed3ea3c.mp3","mitnehmen":"../language-audio/e31f76493155998d63b635ff.mp3","Ich möchte den Tee mitnehmen.":"../language-audio/64d0b4b5e922235b90b7b09d.mp3","bezahlen":"../language-audio/17fc788574502bf8ee2de1ce.mp3","Ich möchte bitte bezahlen.":"../language-audio/68f7d356e348af67e3f9a28d.mp3","das Wasser":"../language-audio/fa2e81bc0bc66bf83108f7a9.mp3","Ein Glas Wasser, bitte.":"../language-audio/80b202b0b6bb40aed51a747d.mp3","die Rechnung":"../language-audio/e72a854eca0a2e2eabaaf80c.mp3","Die Rechnung, bitte.":"../language-audio/65f92b049d218fee4427437e.mp3","ohne":"../language-audio/cee67ca06db86cfc606032b2.mp3","Für mich bitte ohne Zucker.":"../language-audio/de1623057a716951d0effd8f.mp3","Wir bezahlen zusammen.":"../language-audio/1a6205bbbc6132e5d3f4bd49.mp3","Guten Tag, einen Tee und ein Stück Kuchen, bitte.":"../language-audio/f101a8c21d776fe915bfbe88.mp3","Gern. Zum Mitnehmen?":"../language-audio/2468c1ecb31b980af7bdd5da.mp3","Nein, ich bleibe hier. Was kostet das zusammen?":"../language-audio/97515cf9c3a0a95c9d0ee92e.mp3","Sechs Euro fünfzig, bitte.":"../language-audio/55df6a41c658e6e5f7e85955.mp3","Mei hat nach dem Deutschkurs eine Pause. Sie geht in ein kleines Café am Platz. Dort bestellt sie einen Kaffee mit Milch und ein Stück Apfelkuchen. Die Mitarbeiterin fragt, ob Mei alles mitnehmen möchte. Mei bleibt lieber im Café, denn draußen regnet es. Sie setzt sich ans Fenster und liest ihre Notizen. Nach einer halben Stunde bittet sie um die Rechnung. Sie bezahlt zusammen sieben Euro und geht zurück zur Schule.":"../language-audio/d6f8d57580795f3ecd749a2f.mp3","Tobias wartet am Bahnhof auf seine Schwester. Ihr Zug kommt in vierzig Minuten. Im Café bestellt er einen schwarzen Tee ohne Zucker. Er möchte auch ein Brötchen, aber es gibt nur noch Kuchen. Deshalb nimmt er nichts zu essen. Den Tee trinkt er an einem kleinen Tisch. Als seine Schwester anruft, bezahlt er drei Euro. Dann verlässt er das Café und geht zum Gleis sieben.":"../language-audio/cdf2b5ad0e6228c819745ca8.mp3","Guten Tag! Was möchten Sie bestellen?":"../language-audio/7584827ec5174b4f53ffce04.mp3","Kuchen":"../language-audio/dd41ffb9baeb69b2fef71414.mp3","Milch":"../language-audio/88143326630a8b355bbc3dcf.mp3","Ich möchte einen Tee ohne Zucker.":"../language-audio/3bf27342128ac782d2d4d29a.mp3","Haben Sie auch Kaffee ohne Koffein?":"../language-audio/42c881fef6faea61c7963347.mp3","Den Cappuccino bitte mit Haferdrink.":"../language-audio/2acd71d5b68a5ea1b7c67bfb.mp3","Ich nehme heute eine Suppe.":"../language-audio/2f69aac261d5bc4f670790ef.mp3","Ich möchte das Sandwich für unterwegs mitnehmen.":"../language-audio/2a09a69eea2bfe50c577896e.mp3","Können wir bitte getrennt bezahlen?":"../language-audio/2fbeba08a1a8dc1def9b37a2.mp3","Ich möchte einen Kakao.":"../language-audio/28bb0115e1ad1026a994e1bc.mp3","Mit dem Tee bitte.":"../language-audio/5af935bfc98047bbabec3315.mp3","Ich möchte den Kuchen mitnehmen.":"../language-audio/e382915a2d358a9e0905ad29.mp3","der Apfel":"../language-audio/0d55ce8db2ca7854834a76ab.mp3","Ich nehme ein Kilo Äpfel.":"../language-audio/d2853fefff9c99b545ca4f52.mp3","das Brot":"../language-audio/cf7f94260ef581698f094da7.mp3","Wo finde ich das Brot?":"../language-audio/0aecd786158872e622d66774.mp3","die Tüte":"../language-audio/e87aa01a1e8e3d797ed7392e.mp3","Ich brauche keine Tüte.":"../language-audio/4cba3a320bf609160b377f60.mp3","die Karte":"../language-audio/3507b78b65aab005727c43ed.mp3","Kann ich mit Karte bezahlen?":"../language-audio/170bfafa3a57b86ccddb06da.mp3","die Kasse":"../language-audio/5a1d2472e5d4144f9c4dea2c.mp3","Die Kasse ist dort links.":"../language-audio/59951a3a33883f89622dc453.mp3","der Preis":"../language-audio/59fa8180dfa26bbdd3a03a8c.mp3","Ist das der Preis für ein Kilo?":"../language-audio/43827750420115631dbdea4d.mp3","das Gemüse":"../language-audio/e39351d3f2272ca14e19938c.mp3","Das Gemüse ist frisch.":"../language-audio/7b8ac87b3e2b167e478553b5.mp3","das Kilo":"../language-audio/87dcfb4f2877052ca2b08900.mp3","Ein Kilo Tomaten kostet vier Euro.":"../language-audio/88027b772388a680f2271a8e.mp3","brauchen":"../language-audio/ee2476b6196da9b833bae315.mp3","Wir brauchen noch Reis.":"../language-audio/b6803b3859efe2406d470ff2.mp3","der Einkaufszettel":"../language-audio/2dc463ab8b7aad35a2073631.mp3","Mein Einkaufszettel liegt zu Hause.":"../language-audio/0d8ff55ab1aa1cc5859d98f4.mp3","Entschuldigung, wo finde ich Reis?":"../language-audio/7b61d85adea7b155a90d9a36.mp3","Im zweiten Gang rechts.":"../language-audio/9e4dd726a4549e3a98475626.mp3","Danke. Kann ich hier mit Karte bezahlen?":"../language-audio/7447ea792d9850dedf0e1a03.mp3","Ja. An der Kasse können Sie mit Karte bezahlen.":"../language-audio/9ea66fd8105a71a3a2655f45.mp3","Am Samstag geht Eva mit einem Einkaufszettel zum Supermarkt. Sie braucht Reis, Brot und Gemüse für das Wochenende. Die Tomaten kosten heute vier Euro pro Kilo. Eva nimmt nur ein halbes Kilo, denn sie lebt allein. Den Reis findet sie zuerst nicht. Ein Mitarbeiter zeigt ihr den richtigen Gang. An der Kasse packt Eva alles in ihren eigenen Rucksack. Sie braucht keine Tüte und bezahlt mit ihrer Karte. Danach geht sie zu Fuß nach Hause.":"../language-audio/2fef05a48579e13c78ade6e4.mp3","Luis möchte am Abend für zwei Freunde kochen. Nach der Arbeit geht er einkaufen. Er kauft ein Kilo Kartoffeln und zwei Flaschen Wasser. Käse steht auch auf seiner Liste, doch der Käse im Angebot ist schon ausverkauft. Luis nimmt stattdessen Joghurt für das Frühstück. An der Kasse merkt er, dass seine Karte zu Hause liegt. Zum Glück hat er genug Bargeld. Seine Stofftasche ist groß genug für alles.":"../language-audio/a3c1cdb4a5c9face6b7a224d.mp3","Suchen Sie ein bestimmtes Produkt?":"../language-audio/e6996747b5ccc7092a03b5ed.mp3","Apfel":"../language-audio/4141d5541fe925a34f39a548.mp3","Äpfel":"../language-audio/50b5647a2d5f78d093287077.mp3","Ich hätte gern ein halbes Kilo Tomaten.":"../language-audio/8462c67cee7ec44431a604f7.mp3","Wo steht das glutenfreie Brot?":"../language-audio/cf34c38fa65b787af23f73a7.mp3","Ich brauche keinen Kassenbon.":"../language-audio/93fb1f3c6dc4dba89d173865.mp3","Kann ich hier bar bezahlen?":"../language-audio/8525afe6dea9a6ca9702631c.mp3","Welche Kasse ist noch geöffnet?":"../language-audio/9996c5c14816fa48d1ad9402.mp3","Gilt dieser Preis für eine Packung?":"../language-audio/1d259eb4ed344eccbab57153.mp3","Ich kaufe keine Äpfel.":"../language-audio/c000abb9e819f9c0747fa0b1.mp3","Ich brauche einen Beutel.":"../language-audio/08121c24b8779108537763a3.mp3","Kann ich mit der Karte zahlen?":"../language-audio/575c22712d685dc0e0d68e16.mp3","der Bahnhof":"../language-audio/c7e922c3834300c71ca62b1a.mp3","Wie komme ich zum Bahnhof?":"../language-audio/3c78b8244ffed2537e429d77.mp3","geradeaus":"../language-audio/234fcecf5ad395b5da5facfb.mp3","Gehen Sie bitte geradeaus.":"../language-audio/d4c39553108535e946ccb909.mp3","links":"../language-audio/f36ad22d4715605bcfa740fe.mp3","Biegen Sie hier links ab.":"../language-audio/780a5460cdf208e9059bff70.mp3","rechts":"../language-audio/f74efd5d73ae2073428b7713.mp3","Die Haltestelle ist rechts.":"../language-audio/94b2dc4f8c5f14b268050b05.mp3","der Bus":"../language-audio/07ba9d65edd8f682de2cb55e.mp3","Fährt dieser Bus zum Museum?":"../language-audio/e13ce050bfca4bf24667c5a2.mp3","die Fahrkarte":"../language-audio/c3b2928511b46c96802f2d15.mp3","Wo kann ich eine Fahrkarte kaufen?":"../language-audio/6882aa6196d2994c10e79834.mp3","die Haltestelle":"../language-audio/fb4a76b2592ac165d25c7132.mp3","Ich warte an der Haltestelle.":"../language-audio/0af10c5bd3c217a4ee552ed1.mp3","aussteigen":"../language-audio/18491236f1dfdae82461f44b.mp3","Steigen Sie am Markt aus.":"../language-audio/d525ebd300fb9fcf8d410add.mp3","umsteigen":"../language-audio/400de08b8007e434e24448dd.mp3","Sie müssen einmal umsteigen.":"../language-audio/3f0634637528a7f55929b7ff.mp3","die Straße":"../language-audio/1f8728ca4fe7d59039807299.mp3","Überqueren Sie die Straße vorsichtig.":"../language-audio/f95035763dc51a521bfece58.mp3","Entschuldigung, wie komme ich zum Museum?":"../language-audio/ea98fd5167a554830ee159b5.mp3","Nehmen Sie den Bus zwölf bis zum Markt.":"../language-audio/4fec2f678121cafbadecd18b.mp3","Muss ich umsteigen?":"../language-audio/84b3bdf7db982766f2f14ee3.mp3","Nein. Vom Markt gehen Sie fünf Minuten geradeaus.":"../language-audio/d6e43f1e9fb6010c80c34a2f.mp3","Yuna möchte das Stadtmuseum besuchen. Auf ihrem Handy ist der Akku leer, deshalb fragt sie einen Mann nach dem Weg. Er erklärt, dass der Bus zwölf direkt zum Markt fährt. Die Haltestelle liegt rechts neben dem Bahnhof. Yuna kauft eine Fahrkarte am Automaten und steigt ein. Am Markt steigt sie aus. Sie geht geradeaus und biegt an der Apotheke links ab. Nach wenigen Minuten sieht sie das Museum auf der anderen Straßenseite.":"../language-audio/1db07bea4b64182d4ac9dc8e.mp3","Heute besucht Deniz seinen Onkel im Krankenhaus. Er fährt mit der Straßenbahn vier bis zur Post. Dort muss er in den Bus neun umsteigen. Eine ältere Frau zeigt ihm die richtige Haltestelle auf der anderen Straßenseite. Deniz kauft seine Fahrkarte am Automaten. Nach drei Stationen steigt er vor dem Krankenhaus aus. Sein Onkel wartet im Garten. Für den Rückweg will Deniz dieselbe Verbindung nehmen, weil sie nur zwanzig Minuten dauert.":"../language-audio/e8d91e5a652ea755ae0a89a9.mp3","Wohin möchten Sie fahren? Ich kann Ihnen helfen.":"../language-audio/272385cb4f26d2aa95cf2a5e.mp3","Straße":"../language-audio/d95bdbe70c84ee0f72efb0f2.mp3","abbiegen":"../language-audio/707f063f8cda33f648fd33c6.mp3","Wie komme ich zur Stadtbibliothek?":"../language-audio/df44a97a7285811b2ab61cef.mp3","Gehen Sie bis zur Ampel.":"../language-audio/6447597e95835cab7000bf0b.mp3","Biegen Sie an der nächsten Kreuzung rechts ab.":"../language-audio/65978538b5334149f28e7833.mp3","Die Haltestelle liegt hinter der Brücke.":"../language-audio/cfb36cf00ab4d5e0037930bd.mp3","Fährt diese Straßenbahn zum Krankenhaus?":"../language-audio/34168ae1b8cfdc7740de0d6c.mp3","Kann ich die Fahrkarte im Bus kaufen?":"../language-audio/b69de6b9d7d217ccceda6a1f.mp3","Gehen Sie geradeaus.":"../language-audio/ba9a28b4ea9244a7be7044b8.mp3","Biegen Sie rechts ab.":"../language-audio/dd53d57e0fc527d906eaedcc.mp3","Ich fahre zur Schule.":"../language-audio/582f00d26d763d563266181d.mp3","reservieren":"../language-audio/58b59433b05c04070336e1d0.mp3","Ich habe ein Zimmer reserviert.":"../language-audio/2d7b8c17a03c2a4b99a68cf1.mp3","die Nacht":"../language-audio/107e8055e1e555d7c412cf7e.mp3","Ich bleibe für zwei Nächte.":"../language-audio/f0c5557e6f189edbe3f45366.mp3","der Schlüssel":"../language-audio/6397000703b84b044d0b4098.mp3","Kann ich den Schlüssel bekommen?":"../language-audio/9a78de21aaec9c33f335fdfd.mp3","das Frühstück":"../language-audio/91680bbf401727d4a63c8f8c.mp3","Ist das Frühstück im Preis enthalten?":"../language-audio/7471a7802ef813bdd0a3d999.mp3","das Handtuch":"../language-audio/53918a4595903865fbd66cd3.mp3","Im Bad fehlt ein Handtuch.":"../language-audio/6932df0e9cf7a96de97b9125.mp3","funktionieren":"../language-audio/1d18ceecad45668330c8a979.mp3","Die Heizung funktioniert nicht.":"../language-audio/47d7c95f3de8118d3e6b24e7.mp3","die Rezeption":"../language-audio/5432dc085eceaf9cb26effa9.mp3","Die Rezeption ist unten.":"../language-audio/224b6a2b083236b412ac1ecb.mp3","das Zimmer":"../language-audio/2a10ce7adc57e3f042905b14.mp3","Mein Zimmer liegt im zweiten Stock.":"../language-audio/a5ada749f2bae1a38a76607a.mp3","der Aufzug":"../language-audio/227423d0f3d0f7ffdab5a40f.mp3","Wo ist der Aufzug?":"../language-audio/3a6cef379ec9704151f9358e.mp3","ruhig":"../language-audio/753836140c77d215557c3cfa.mp3","Ich hätte gern ein ruhiges Zimmer.":"../language-audio/e8c5b8a781be12cef0524d0b.mp3","Guten Abend, ich habe ein Zimmer auf den Namen Li reserviert.":"../language-audio/eb9f337b0b84a9ca34de1466.mp3","Ja, für zwei Nächte. Hier ist Ihr Schlüssel.":"../language-audio/fc2d86f71485f9072f40ea64.mp3","Wann gibt es Frühstück?":"../language-audio/272ec5c38b4cdbc84bc2c051.mp3","Von sieben bis zehn Uhr im Erdgeschoss.":"../language-audio/9c8c08eb028684a3379ebb82.mp3","Li kommt am Abend in einem kleinen Hotel an. Sie hat ein Zimmer für zwei Nächte reserviert. An der Rezeption bekommt sie den Schlüssel und Informationen zum Frühstück. Es gibt keinen Aufzug, aber ihr Zimmer liegt im ersten Stock. Li trägt ihren kleinen Koffer nach oben. Im Bad bemerkt sie, dass ein Handtuch fehlt. Sie ruft die Rezeption an. Ein Mitarbeiter bringt ihr ein frisches Handtuch. Danach kann sie sich endlich ausruhen.":"../language-audio/3341b459353b2befb6fdb163.mp3","Marta reist beruflich nach Dresden und bleibt drei Nächte in einer Pension. Ihr Zimmer liegt zum Innenhof und ist sehr ruhig. Beim Einchecken fragt sie nach dem WLAN. Die Mitarbeiterin schreibt das Passwort auf eine Karte. Frühstück wird erst ab acht Uhr angeboten. Weil Marta morgen um halb acht einen Termin hat, möchte sie darauf verzichten. Sie fragt stattdessen nach einer Bäckerei in der Nähe und bekommt eine Wegbeschreibung.":"../language-audio/76dad06fca6aaa3fb4591bca.mp3","Guten Abend! Haben Sie ein Zimmer reserviert?":"../language-audio/265a0a1e797a37b69820f753.mp3","reserviert":"../language-audio/4e69c5959a17de58f92d70be.mp3","Zimmer":"../language-audio/b6c3d78b476c8c19ed6ea050.mp3","Ich habe online ein Doppelzimmer gebucht.":"../language-audio/0f0c3e75f27d88f33473923b.mp3","Ich bleibe bis Sonntag in Ihrem Hotel.":"../language-audio/f4048b2ad904b33a39471644.mp3","Könnte ich eine zweite Zimmerkarte bekommen?":"../language-audio/165ae92e33d49328bc89bea5.mp3","Ab wann wird das Frühstück serviert?":"../language-audio/43babd16e4d4ebd75064cabd.mp3","Neben dem Bett fehlt eine Lampe.":"../language-audio/5a81ee4e73f41a0ee8c4f38f.mp3","Aus der Dusche kommt nur kaltes Wasser.":"../language-audio/60db72924d9bfa09489e4e5a.mp3","Es fehlen zwei Kissen.":"../language-audio/94ac772289376ec24fe1d2f6.mp3","aufstehen":"../language-audio/5575903234e2479103cd0cbe.mp3","Ich stehe um sieben Uhr auf.":"../language-audio/c89e6b07630730b5a991e443.mp3","aufräumen":"../language-audio/7f821ae3436bbb51393b70fc.mp3","Am Abend räume ich die Küche auf.":"../language-audio/9525183a60321d3974f4065b.mp3","waschen":"../language-audio/47305bdaa094d761e928eebc.mp3","Ich wasche am Samstag die Wäsche.":"../language-audio/0f00c96dcb8dfaeb9605232b.mp3","kochen":"../language-audio/7e9edc894e22fcec258590c9.mp3","Mein Bruder kocht heute das Abendessen.":"../language-audio/fe6b4375f1ed942778507322.mp3","sich kümmern":"../language-audio/174ce50ef6c47b845b69c4b1.mp3","Ich kümmere mich um die Pflanzen.":"../language-audio/06e09c3b013062c1d35e8ca9.mp3","der Haushalt":"../language-audio/1ee7d37b152faeb3c90413d7.mp3","Wir teilen uns die Arbeit im Haushalt.":"../language-audio/55385e37c58c09b9161c0921.mp3","die Küche":"../language-audio/d9ec727f5361fe984ddc3f37.mp3","Die Küche ist morgens frei.":"../language-audio/1551b9dfc2f88929f69c9791.mp3","gewöhnlich":"../language-audio/a803d43357c8c45cc9217eac.mp3","Gewöhnlich frühstücke ich zu Hause.":"../language-audio/916b3436abdab6fefe8e4e21.mp3","der Alltag":"../language-audio/0195c28cf01fad778d703826.mp3","Mein Alltag beginnt früh.":"../language-audio/b075c983a50d88c9ab26dffb.mp3","einschlafen":"../language-audio/2046f778acd7d909cfb42e59.mp3","Ich schlafe oft vor elf Uhr ein.":"../language-audio/687cc9e62a6c6a66c8ad91da.mp3","Wann stehst du morgen auf?":"../language-audio/0a23bc24ea947c7c8fe6aa9a.mp3","Um sieben. Ich muss die Wäsche waschen.":"../language-audio/a281d8216498659e3466756c.mp3","Dann koche ich das Mittagessen.":"../language-audio/55650ac7f0d471141a0876f7.mp3","Gut, danach räumen wir zusammen auf.":"../language-audio/267be4b356a8a70a3f93dcec.mp3","Kim und Jan wohnen zusammen in einer kleinen Wohnung. Beide arbeiten unter der Woche und haben morgens wenig Zeit. Deshalb bereiten sie ihr Frühstück oft schon am Abend vor. Am Samstag teilen sie die Hausarbeit. Jan wäscht die Wäsche und putzt das Bad. Kim kauft ein und kocht. Nach dem Essen räumen sie gemeinsam die Küche auf. Am Nachmittag machen sie einen Spaziergang. So bleibt neben der Arbeit auch Zeit für Erholung.":"../language-audio/8f77d94ea2c1f3577ae246f6.mp3","Seit zwei Wochen arbeitet Rosa am Nachmittag in einer Buchhandlung. Ihr Tagesablauf hat sich deshalb verändert. Sie steht um acht Uhr auf und frühstückt in Ruhe. Danach geht sie mit ihrem Hund spazieren. Um elf kocht sie eine warme Mahlzeit. Bevor sie zur Arbeit fährt, stellt sie das Essen für ihren Sohn in den Kühlschrank. Abends liest sie meistens noch eine halbe Stunde. Die Wäsche wäscht sie jetzt am Sonntag.":"../language-audio/84b84e3409006876bace5feb.mp3","Wie sieht Ihr Alltag normalerweise aus?":"../language-audio/f4635c1103e640db9f439af1.mp3","Nach der Nachtschicht stehe ich erst mittags auf.":"../language-audio/eadaf74b5d49428856ef6ef7.mp3","Nach dem Frühstück räume ich den Tisch ab.":"../language-audio/d0604b7240f81d3d6a822a70.mp3","Am Wochenende wasche ich die Bettwäsche.":"../language-audio/df1df68d12f7f7c3f9e75828.mp3","Heute kochen wir zusammen eine Gemüsesuppe.":"../language-audio/68e19c7eeb4c5af6e7e05252.mp3","Kannst du dich morgen um die Katze kümmern?":"../language-audio/4e2db29f81b906240d29cfd8.mp3","Wir wechseln uns beim Putzen ab.":"../language-audio/5b69d3c5cb9630fa03a1b5bd.mp3","Ich stehe früh auf.":"../language-audio/3cdeef50185f75cabc698f44.mp3","Wir müssen die Küche aufräumen.":"../language-audio/af0605e7b88d53cacd0a7357.mp3","Ich kümmere mich um den Hund.":"../language-audio/83f5964120f4416ab685e30b.mp3","der Schmerz":"../language-audio/39fc4ee8ba417053d1cefa26.mp3","Seit gestern habe ich Schmerzen im Hals.":"../language-audio/b12bc2516fdbbca6d4a4c185.mp3","Ich brauche einen Termin in der Praxis.":"../language-audio/f744e349d4f416a0404d393f.mp3","die Versichertenkarte":"../language-audio/ccc13b0019477cbfddc961a1.mp3","Soll ich meine Versichertenkarte mitbringen?":"../language-audio/44c38c132b062d273c3a4e5a.mp3","warten":"../language-audio/8453769c89868168f48e31dd.mp3","Wie lange muss ich ungefähr warten?":"../language-audio/8bef3293cbcd179b87abc61a.mp3","die Praxis":"../language-audio/97fa8ba3b29dcc3c29643ab5.mp3","Die Praxis öffnet um acht Uhr.":"../language-audio/f44543fff76fc2be80625f9a.mp3","das Medikament":"../language-audio/4b8f6ec2c8957ac870457c29.mp3","Ich nehme dieses Medikament regelmäßig.":"../language-audio/5123e5bdfbb1377bcbb00527.mp3","das Fieber":"../language-audio/b20ddaa3bbde6021d62a982e.mp3","Ich habe heute kein Fieber.":"../language-audio/328c97f63b31f3cc6d91f8c2.mp3","der Husten":"../language-audio/bc541d6a357e9d40f793710f.mp3","Der Husten stört mich nachts.":"../language-audio/3b21444492331175d6b06ed3.mp3","die Apotheke":"../language-audio/560cc67ebd5fa15ceaaf71e0.mp3","Die Apotheke ist neben der Praxis.":"../language-audio/c854faa7505aa7982680c51c.mp3","mitbringen":"../language-audio/7fbc778e41ef7ca6d8e58e6b.mp3","Ich bringe meine Medikamentenliste mit.":"../language-audio/c0821713152ca58b846848f7.mp3","Ich habe seit gestern Halsschmerzen.":"../language-audio/1d464027e44a9decf5da3c95.mp3","Möchten Sie einen Termin vereinbaren?":"../language-audio/8efad985cf8f4feeb24ad4e1.mp3","Ja. Haben Sie heute noch etwas frei?":"../language-audio/5d9e43b367283ce0b788386e.mp3","Um elf Uhr. Bringen Sie bitte Ihre Versichertenkarte mit.":"../language-audio/9077a674097fb14cba21a2d5.mp3","Sofia fühlt sich seit gestern nicht gut und ruft ihre Hausarztpraxis an. Sie beschreibt, dass sie Halsschmerzen hat und schlecht schläft. Die Mitarbeiterin bietet ihr einen Termin am Vormittag an. Sofia notiert die Uhrzeit und fragt, was sie mitbringen soll. Sie legt ihre Versichertenkarte und eine Liste ihrer Medikamente in die Tasche. In der Praxis erklärt sie ihre Beschwerden noch einmal. Wenn sie ein Wort nicht versteht, bittet sie um eine einfache Erklärung.":"../language-audio/644ce542c5328be80121f078.mp3","Herr Wang möchte einen Kontrolltermin vereinbaren. Er hat keine neuen Beschwerden, aber die Ärztin hat beim letzten Besuch eine weitere Untersuchung vorgeschlagen. Am Telefon erfährt er, dass am Dienstag um neun Uhr ein Platz frei ist. Er arbeitet dann jedoch schon. Deshalb wählt er Donnerstag um sechzehn Uhr. Die Mitarbeiterin bittet ihn, vorhandene Unterlagen mitzubringen. Herr Wang schreibt den Termin in seinen Kalender und prüft später, welche Unterlagen er zu Hause hat.":"../language-audio/c7c7f20f80491e7f21d30e71.mp3","Welche Beschwerden haben Sie und seit wann?":"../language-audio/aa1315caeb738875f9225ef4.mp3","Husten":"../language-audio/703cd9ddde02d86c91ac3ab1.mp3","Fieber":"../language-audio/99d8ae1b596836643ea21573.mp3","Seit drei Tagen habe ich Husten.":"../language-audio/3b783089c1ce5573ca7638be.mp3","Ich möchte einen Termin zur Untersuchung vereinbaren.":"../language-audio/42127f570e307a4be84a8f14.mp3","Welche Unterlagen soll ich zur Untersuchung mitbringen?":"../language-audio/7549a2eda769c5f359a5b810.mp3","Muss ich länger als eine halbe Stunde warten?":"../language-audio/81375f475e014bb16c25cccf.mp3","Wann schließt die Praxis am Freitag?":"../language-audio/b56cab91ec1eb38c8ee546cd.mp3","Ich nehme die Tabletten nach der vereinbarten Anweisung.":"../language-audio/542a4e9fe6e7fda49f0a5224.mp3","Seit einer Woche habe ich Husten.":"../language-audio/aee4cf762ad679dbf40a9b3b.mp3","Soll ich die Karte mitbringen?":"../language-audio/00d979a553783b0b6c11ca65.mp3","Die Praxis öffnet morgen.":"../language-audio/cfc5d8581cb0fd32199075d3.mp3","einladen":"../language-audio/cc709e60bd393e83978f375a.mp3","Ich lade dich am Samstag zum Essen ein.":"../language-audio/ffbc36bd6530475c8bf2712f.mp3","die Einladung":"../language-audio/05fbab3883890a8dbfad2dc5.mp3","Danke für deine Einladung.":"../language-audio/67de5167d040fef567166420.mp3","leider":"../language-audio/e5875760085e968472f9ed56.mp3","Leider kann ich am Samstag nicht kommen.":"../language-audio/21d42b4c105890e010e687b5.mp3","weil":"../language-audio/bb9f19110457499ee83a2970.mp3","Ich bleibe zu Hause, weil ich Besuch bekomme.":"../language-audio/6285c49faf8fc3534bbd93cb.mp3","passen":"../language-audio/913d81ab319c6ff261abbd2d.mp3","Passt dir der Sonntag besser?":"../language-audio/f58dc8535f0c1b04f2c4c39d.mp3","Soll ich etwas zum Trinken mitbringen?":"../language-audio/6fbf8250bb8fcc708f2257b0.mp3","das Treffen":"../language-audio/ff139f5ba65dcc4461bed8f1.mp3","Unser Treffen beginnt um sechs Uhr.":"../language-audio/e178385c62a379f654508b83.mp3","absagen":"../language-audio/b138d69706bb216ca005d1f9.mp3","Ich muss das Treffen leider absagen.":"../language-audio/2edf9260e97765ad75f24594.mp3","sich freuen":"../language-audio/029938770b656243ffcaddb4.mp3","Ich freue mich auf den Abend.":"../language-audio/e17ea2bdfb43e5647bece2ea.mp3","der Besuch":"../language-audio/c08c217588892e1b28f43e25.mp3","Wir bekommen morgen Besuch.":"../language-audio/90c74fd8a667ee526ac378e7.mp3","Möchtest du am Samstag zu mir kommen?":"../language-audio/1c820074bad87db23789ee86.mp3","Leider nicht, weil ich arbeiten muss.":"../language-audio/e6c2c81c7f4674153adde749.mp3","Und am Sonntag? Wir könnten zusammen kochen.":"../language-audio/0c02d4c8f673574f0174d4ba.mp3","Gern. Ich bringe Gemüse mit.":"../language-audio/0101b139fe389d0345e321b7.mp3","Lena möchte am Wochenende Freunde zum Essen einladen. Sie schreibt Tao eine kurze Nachricht. Tao hat am Samstag Dienst und kann deshalb nicht kommen. Er erklärt den Grund und schlägt Sonntag vor. Lena findet die Idee gut. Sie treffen sich um fünf Uhr in ihrer Wohnung und kochen gemeinsam. Tao bringt frisches Gemüse mit, Lena kauft Reis und Getränke. Ein weiterer Freund kommt erst später, weil er vorher noch einen Familienbesuch hat.":"../language-audio/b170df84b5fc934abc6d8f49.mp3","Am Freitag feiert Nina ihren Geburtstag im Park. Sie lädt ihre Nachbarin Amal ein und schreibt, dass alle ab siebzehn Uhr kommen können. Amal hat bis achtzehn Uhr einen Kurs. Sie fragt, ob sie später dazukommen darf. Nina freut sich und bittet sie, eine Decke mitzubringen. Essen ist schon genug da. Falls es regnet, treffen sich alle in Ninas Wohnung. Die genaue Adresse schickt Nina am Donnerstag noch einmal.":"../language-audio/fa56c0b2bd286fe2523d789c.mp3","Hast du am Wochenende Zeit für ein Treffen?":"../language-audio/ff6a167c0ade5c467b1cd991.mp3","Ich lade dich am Sonntag zu einem Picknick ein.":"../language-audio/2a7b0d30716dbc7f05cfa6ca.mp3","Vielen Dank für die Einladung zu deinem Geburtstag.":"../language-audio/1864e8f5bb9f5d98d0cd9f12.mp3","Leider habe ich an dem Abend schon etwas vor.":"../language-audio/2aac13a30ddddd4cba182ad2.mp3","Ich kann nicht mitkommen, weil ich auf mein Kind aufpassen muss.":"../language-audio/d57860b2c4b8f4cfabc098e0.mp3","Würde dir ein Mittagessen am Mittwoch passen?":"../language-audio/e80f35c6a61530da4e7c8739.mp3","Soll ich einen Nachtisch für alle mitbringen?":"../language-audio/17def50421b6b84ab6057e84.mp3","Ich bleibe hier, weil ich arbeiten muss.":"../language-audio/4ade9c40521f75f553eb14e9.mp3","Passt dir der Abend?":"../language-audio/966cd8b5e2e6319fdb5b706d.mp3","Ich lade euch zum Essen ein.":"../language-audio/9760fea49f216338fd2688d1.mp3","vereinbaren":"../language-audio/2787c601a324276efbac0217.mp3","Ich möchte einen Termin vereinbaren.":"../language-audio/9fda9a03bf9e377e826938ef.mp3","verschieben":"../language-audio/236421d1378e91b7b8dc3a14.mp3","Könnten wir den Termin verschieben?":"../language-audio/72fe248557ba7c6b2deaa6d3.mp3","frei":"../language-audio/5a13b0b4d221e61785251bac.mp3","Haben Sie am Freitag etwas frei?":"../language-audio/6ebe57c4849a420d1b4f552a.mp3","bestätigen":"../language-audio/c1824a0d3b21d233898cad43.mp3","Könnten Sie mir die Uhrzeit bestätigen?":"../language-audio/ac36ec102dc1f34725c28228.mp3","erreichen":"../language-audio/f2a177c25574a9de5c3b561b.mp3","Unter dieser Nummer erreichen Sie mich.":"../language-audio/6c0cb912f59833e8e1e2a38c.mp3","zurückrufen":"../language-audio/7fd1a8e07004190b5fe65405.mp3","Ich rufe Sie morgen zurück.":"../language-audio/5115e130c98993d16a32ef37.mp3","der Anruf":"../language-audio/f3c7e574b92c1468567cdf01.mp3","Danke für Ihren Anruf.":"../language-audio/92f65b08ff889a4e6a849c72.mp3","besetzt":"../language-audio/af26510cc40de3c2c87cab8d.mp3","Die Leitung ist gerade besetzt.":"../language-audio/3aefc1cd444f916d86ebcfb0.mp3","die Nachricht":"../language-audio/91e801c1f21f1b2a63580d7c.mp3","Ich hinterlasse eine Nachricht.":"../language-audio/5b216454dd9932a77d71ed33.mp3","der Kalender":"../language-audio/55f31c79b8632b319a1a67d1.mp3","Ich schaue in meinen Kalender.":"../language-audio/bd9d1c2de8deb6e446736d6b.mp3","Ich habe morgen um zehn einen Termin bei Ihnen.":"../language-audio/71560a200de831cf4413957b.mp3","Wie ist Ihr Name, bitte?":"../language-audio/ab42f3728cffe850eb9fc078.mp3","Zhao. Könnten wir den Termin auf Freitag verschieben?":"../language-audio/9bb4a49d093c3d81291d1cf9.mp3","Am Freitag ist um vierzehn Uhr noch etwas frei.":"../language-audio/65c64ff19d1555d5ba5efd9b.mp3","Herr Zhao hat einen Termin im Friseursalon. Am Tag davor erfährt er, dass er länger arbeiten muss. Er ruft im Salon an und bittet um einen neuen Termin. Die Mitarbeiterin fragt nach seinem Namen und findet die Buchung im Kalender. Am Freitag um vierzehn Uhr ist noch ein Platz frei. Herr Zhao nimmt den Termin an und wiederholt Datum und Uhrzeit. Die Mitarbeiterin bestätigt beides. Er trägt den neuen Termin sofort in sein Handy ein.":"../language-audio/0ad60c795bb0d044e3c9daf4.mp3","Eine Fahrradwerkstatt hat Lea für Mittwoch um fünfzehn Uhr eingeplant. Nun muss Lea an diesem Tag ihre Tochter abholen. Sie ruft am Montag an und fragt nach einem anderen Termin. Der Mechaniker bietet Donnerstagmorgen oder Freitagnachmittag an. Donnerstag passt Lea nicht, weil sie früh arbeitet. Sie entscheidet sich für Freitag um sechzehn Uhr. Das Fahrrad soll sie zehn Minuten vorher bringen. Lea notiert sich auch die neue Adresse der Werkstatt.":"../language-audio/f56459e2f58e72ded1404bb2.mp3","Möchten Sie einen Termin vereinbaren oder verschieben?":"../language-audio/1c22aeb823bf13bc1d655313.mp3","könnten":"../language-audio/52fb80c64da8935f254b0149.mp3","zurück":"../language-audio/4a39624e53db789f4c6e2425.mp3","Ich würde gern einen Termin für eine Vorführung vereinbaren.":"../language-audio/e05d14d66b2b97440eef18a9.mp3","Könnten wir unseren Termin auf nächste Woche verschieben?":"../language-audio/524009a9fd2a4a7035d3a4e1.mp3","Wäre am Dienstagvormittag noch ein Termin frei?":"../language-audio/6bb3dda0903e6120839d4239.mp3","Könnten Sie mir den Ort per E-Mail bestätigen?":"../language-audio/9c395c3acfe2f0e06b6b8209.mp3","Am Nachmittag bin ich unter dieser Nummer erreichbar.":"../language-audio/ef714a0c6350a47c80758c9c.mp3","Nach der Mittagspause rufe ich Sie zurück.":"../language-audio/9dfaaeb283e8326344b45345.mp3","Könnten Sie mir helfen?":"../language-audio/e3d80a3e37004cdbf5cecf06.mp3","Ich rufe morgen zurück.":"../language-audio/901883cab27066085c0c7f2c.mp3","Bitte bestätigen Sie mir den Termin.":"../language-audio/b139d8de59ee356a7fb4e0de.mp3","fahren":"../language-audio/7909198adc7f8249fada0c01.mp3","Ich bin gestern nach Köln gefahren.":"../language-audio/fcc73ed5b3ebae897298cac3.mp3","buchen":"../language-audio/5733c7130fb5c984e4bb6e76.mp3","Wir haben die Fahrkarten online gebucht.":"../language-audio/f02cf50dd8bda2c1e1949d55.mp3","die Verspätung":"../language-audio/06ea1631408fa643e5bb1455.mp3","Der Zug hatte zwanzig Minuten Verspätung.":"../language-audio/25c06230dd6cd0d8d28b6627.mp3","ankommen":"../language-audio/bba292ae647b2f5b52b0efe4.mp3","Wir sind am Mittag angekommen.":"../language-audio/888fc5cd942bee3d5ecbfd44.mp3","der Anschluss":"../language-audio/0ece55cf6b27d1676fe8ece5.mp3","Ich habe meinen Anschluss verpasst.":"../language-audio/db18129c54730738e7d22b51.mp3","die Rückfahrt":"../language-audio/00444397de268eeea57b476b.mp3","Die Rückfahrt dauert zwei Stunden.":"../language-audio/db6fdc9e507ed22d79413f19.mp3","der Ausflug":"../language-audio/72edf7f44c67230c09ed2c41.mp3","Unser Ausflug war sehr schön.":"../language-audio/605a1b7d30145a04f0f29f49.mp3","der Bahnsteig":"../language-audio/f18cae5badf7459c1ad3e196.mp3","Wir warten auf dem Bahnsteig.":"../language-audio/c72642925facaf62989e5ec4.mp3","direkt":"../language-audio/f6cc4b3fce97a44afb775457.mp3","Dieser Zug fährt direkt nach Bonn.":"../language-audio/9d076bfd5f3e4c60fb221ccd.mp3","vergleichen":"../language-audio/2c99fa577fc36644ec642e8d.mp3","Wir vergleichen die Preise.":"../language-audio/45b1bad728c87a67e29f88c6.mp3","Wie war dein Ausflug nach Köln?":"../language-audio/e081ab8d622a4b735df8bd59.mp3","Schön, aber der Zug hatte Verspätung.":"../language-audio/f7782e9cb39653aadf2216d2.mp3","Habt ihr trotzdem das Museum besucht?":"../language-audio/92803b3d23ca64bfb606b885.mp3","Ja, wir haben dort zwei Stunden verbracht.":"../language-audio/85526c9e162128a5f6dce581.mp3","Anna und Bo planen einen Ausflug nach Köln. Sie vergleichen zuerst verschiedene Zugverbindungen. Ein direkter Zug kostet etwas mehr, aber sie müssen nicht umsteigen. Deshalb buchen sie diese Verbindung. Am Samstag hat der Zug zwanzig Minuten Verspätung. Trotzdem kommen sie rechtzeitig zum Museumsbesuch an. Sie sehen eine Ausstellung und essen danach am Fluss. Am Abend fahren sie müde zurück. Bo schreibt später eine Nachricht an seine Schwester und erzählt von dem schönen Tag.":"../language-audio/27c1feea0e0af386edcfe90a.mp3","Letzten Sonntag ist Karim mit zwei Freunden an einen See gefahren. Sie wollten zuerst den Bus nehmen, aber am Sonntag fuhr er nur selten. Deshalb sind sie mit dem Fahrrad gefahren. Die Fahrt hat eine Stunde gedauert. Am See haben sie Brot und Obst gegessen. Zum Schwimmen war cht weiterleite, frage ich im Sekretariat nach.":"../language-audio/af7179df15d6b837d0cced42.mp3","Ich rufe unter der Nummer an, die ich schon gespeichert habe.":"../language-audio/7dc8131945f088a801c861a6.mp3","Wenn der neue Raum bestätigt ist, informiere ich unsere Gruppe.":"../language-audio/7b23e5a420bb1ac10e84664f.mp3","Ich lege die Antwort in einem Ordner ab, damit ich sie später finde.":"../language-audio/b148fe0664a829e58f0cc540.mp3","Bevor ich antworte, prüfe ich die Adresse.":"../language-audio/a5da243416eb1301ec2171ed.mp3","Ich frage, wer die Nachricht geschrieben hat.":"../language-audio/c66a3a074a3f630268c56643.mp3","Ich speichere sie, damit ich sie wiederfinde.":"../language-audio/b8d890d8a7000b7257d7ab58.mp3","Ich habe dieses Gerät gestern gekauft.":"../language-audio/60046b70149ccd656fd7f073.mp3","Zu Hause habe ich bemerkt, dass ein Teil fehlt.":"../language-audio/d29c986b4f7db908597f0779.mp3","Ich habe den Beleg mitgebracht und möchte das Problem erklären.":"../language-audio/6e7c768b17cb3817f823dda2.mp3","Können Sie mir sagen, welche Möglichkeiten es gibt?":"../language-audio/b36b7cf7dc7eb941f99eac60.mp3","Falls Sie es prüfen müssen, wann bekomme ich eine Antwort?":"../language-audio/9997a24c2545b07cd861d35d.mp3","Bitte geben Sie mir eine Nummer für meine Anfrage.":"../language-audio/08ac0304e5e247430f41802d.mp3","Ich habe dieses Gerät gestern gekauft. Zu Hause habe ich bemerkt, dass ein Teil fehlt. Ich habe den Beleg mitgebracht und möchte das Problem erklären. Können Sie mir sagen, welche Möglichkeiten es gibt? Falls Sie es prüfen müssen, wann bekomme ich eine Antwort? Bitte geben Sie mir eine Nummer für meine Anfrage.":"../language-audio/a995b0980a1037030abdfc71.mp3","Am Montag kauft Chen eine Lampe für sein Zimmer. Beim Zusammenbauen bemerkt er, dass ein Teil nicht passt. Er liest die Anleitung noch einmal und macht zwei Fotos. Am Mittwoch geht er mit den Fotos und dem Beleg ins Geschäft. Die Mitarbeiterin hört ihm zu, möchte aber erst beim technischen Dienst nachfragen. Eine sofortige Erstattung verspricht sie nicht. Chen bekommt eine Nummer für seine Anfrage und soll die Antwort am Freitag per E-Mail erhalten.":"../language-audio/6b0df5ab4d7eb7914886727f.mp3","Was ist mit dem Produkt passiert?":"../language-audio/75f4a9355474b7bce3888d2f.mp3","defekt":"../language-audio/abddf99c43e8941c1bc12570.mp3","Ich habe den Wasserkocher am Montag in Ihrer Filiale gekauft.":"../language-audio/3cd8b7e9879df24509de708f.mp3","Beim ersten Gebrauch habe ich bemerkt, dass der Deckel nicht schließt.":"../language-audio/00f76a05d894cd508480e13b.mp3","Ich kann Ihnen ein Foto des Belegs zeigen.":"../language-audio/55ab1cd711b5a6713b2b243b.mp3","Könnten Sie mir erklären, wie wir weiter vorgehen können?":"../language-audio/6d5eef1ced93b1a08cba80f8.mp3","Falls das Gerät hierbleiben muss, wie informieren Sie mich über das Ergebnis?":"../language-audio/f5fc94a6e4b33166d0f011f6.mp3","Bitte schicken Sie mir eine Bestätigung mit der Vorgangsnummer.":"../language-audio/3ba9085b33d320ff274a8e78.mp3","Ich habe bemerkt, dass ein Kabel fehlt.":"../language-audio/72c58b9fa32886fa695accf3.mp3","Welche Möglichkeiten gibt es?":"../language-audio/bd4330322bc9331ad20f9667.mp3","Falls es länger dauert, rufen Sie mich bitte an.":"../language-audio/727ed1a3e385139d146076ed.mp3","Letzten Monat habe ich eine Freundin besucht.":"../language-audio/72d4d849780a12699b55b346.mp3","Ich bin früh losgefahren, weil ich den Weg nicht gut kannte.":"../language-audio/1471356cdfabb9f84de4a5b1.mp3","Als ich am Bahnhof ankam, war mein Zug schon weg.":"../language-audio/409e5a35757035594c2209f4.mp3","Ich habe um Hilfe gebeten und eine andere Verbindung gesucht.":"../language-audio/290605724526f7e9e3d3d0fb.mp3","Dann habe ich meiner Freundin gesagt, dass ich später komme.":"../language-audio/baed303c4cb8e1a8f4e88a92.mp3","Am Ende konnten wir uns treffen und unseren Plan ändern.":"../language-audio/4b5ccff9f615d2e9f3c2d474.mp3","Letzten Monat habe ich eine Freundin besucht. Ich bin früh losgefahren, weil ich den Weg nicht gut kannte. Als ich am Bahnhof ankam, war mein Zug schon weg. Ich habe um Hilfe gebeten und eine andere Verbindung gesucht. Dann habe ich meiner Freundin gesagt, dass ich später komme. Am Ende konnten wir uns treffen und unseren Plan ändern.":"../language-audio/ca553e65b2315d2991c6c907.mp3","Am Samstag wollte Mei mit ihrer Freundin eine Ausstellung besuchen. Als sie aus dem Haus ging, regnete es stark. Der Bus kam später als gewöhnlich, deshalb rief Mei ihre Freundin an und erklärte die Verspätung. Sie prüfte auch eine andere Verbindung, doch dann kam ihr Bus. Die beiden trafen sich vierzig Minuten später als geplant. Vor dem Mittagessen blieb nur wenig Zeit. Deshalb sahen sie sich nur einen Ausstellungsraum an und beschlossen, an einem anderen Tag wiederzukommen.":"../language-audio/b9cb0ef0f45e3e91e668b27c.mp3","Wie war der Ausflug? Gab es eine unerwartete Situation?":"../language-audio/4cf942f54abfbc2d85ee7c4d.mp3","gebeten":"../language-audio/7aaa43c3903d4da522526ded.mp3","Letzte Woche habe ich mit meinem Bruder eine Ausstellung besucht.":"../language-audio/c3fd75e8bb2c1876573612a0.mp3","Wir sind zeitig losgefahren, weil wir unterwegs frühstücken wollten.":"../language-audio/31bab62690e0e8ab863a3c32.mp3","Als wir am Museum ankamen, waren die Türen noch geschlossen.":"../language-audio/df05896499f98d97231e9714.mp3","Wir haben einen Mitarbeiter nach einem offenen Café gefragt.":"../language-audio/1f9d7dfa71dda587cb9af46d.mp3","Meine Freundin hat geschrieben, dass sie erst am Nachmittag kommt.":"../language-audio/c0b0d3f4aeca749f33d69abc.mp3","Schließlich konnten wir zuerst spazieren gehen und später die Ausstellung sehen.":"../language-audio/0e26ac772d0a0384f22ed3f4.mp3","Als ich ankam, war das Büro geschlossen.":"../language-audio/c92f60d5b89c51483c4b1d16.mp3","Wir sind früh losgefahren.":"../language-audio/1f9b2dfc048bc1a1ce979fe5.mp3","Sie sagte, dass sie später kommt.":"../language-audio/e7167025d2aae5cae8f18e9a.mp3","Wir möchten am nächsten Sonntag einen Ausflug machen.":"../language-audio/cbe1a5b425d88ff5f01f4584.mp3","Zuerst müssen wir uns auf eine Abfahrtszeit einigen.":"../language-audio/1ed933c2a810007d3a498e8c.mp3","Wenn es regnet, können wir etwas drinnen unternehmen.":"../language-audio/3ccd5762739cb0191a4bfb8f.mp3","Ich möchte den Plan bestätigen, bevor ich Fahrkarten kaufe.":"../language-audio/0b543b6d79a513973728df11.mp3","Vielleicht sollten wir am Nachmittag etwas Zeit frei lassen.":"../language-audio/b77f43296fdfbc2c45feb0a2.mp3","So können wir ohne Stress auf Änderungen reagieren.":"../language-audio/88b60c72371c2f70fb8c35a2.mp3","Wir möchten am nächsten Sonntag einen Ausflug machen. Zuerst müssen wir uns auf eine Abfahrtszeit einigen. Wenn es regnet, können wir etwas drinnen unternehmen. Ich möchte den Plan bestätigen, bevor ich Fahrkarten kaufe. Vielleicht sollten wir am Nachmittag etwas Zeit frei lassen. So können wir ohne Stress auf Änderungen reagieren.":"../language-audio/5246d3a8745be4a79c8d64cc.mp3","Lena und zwei Freunde möchten am Sonntag die Stadt verlassen. Sie vergleichen zwei Orte, die mit dem Zug erreichbar sind. In einem Ort gibt es einen Park am Fluss, im anderen ein Museum in Bahnhofsnähe. Sie haben noch keine Fahrkarten gekauft, weil sie auf die Wettervorhersage warten. Bei Regen wollen sie ins Museum gehen. Einer der Freunde arbeitet am Montag früh, deshalb möchten sie vor acht Uhr abends zurück sein. Den endgültigen Plan bestätigen sie am Freitag.":"../language-audio/17ffca8f100d022172e61f74.mp3","Was können wir machen, wenn es regnet?":"../language-audio/53c0c5b627db97c1789fd999.mp3","sollten":"../language-audio/1028d4ae1d164126f02e3b7b.mp3","Ausflug":"../language-audio/70e13ff3408fa27f5b809bcf.mp3","Wir möchten am Samstag mit dem Fahrrad zum See fahren.":"../language-audio/39f6d4936b97722a17e1e80c.mp3","Wir müssen uns noch auf einen Treffpunkt einigen.":"../language-audio/944644930ad568e1c8650959.mp3","Wenn es zu windig ist, besuchen wir stattdessen die Ausstellung.":"../language-audio/710a2126ae480a704edf4716.mp3","Bevor ich die Tickets bestelle, möchte ich die Teilnehmerzahl wissen.":"../language-audio/ee956df7dd9496e8718ae004.mp3","Wir sollten nach dem Mittagessen eine Pause einplanen.":"../language-audio/cea712b13e23d3fac8e2036f.mp3","Mit einer zweiten Route können wir auf gesperrte Wege reagieren.":"../language-audio/9cf06d4ca7994efc5a7c0af7.mp3","Wenn es regnet, bleiben wir drinnen.":"../language-audio/f1ba42f065daefab9d82bcb3.mp3","Wir einigen uns auf einen Ort.":"../language-audio/a783f1911683c0b1a6202ec5.mp3","Wir sollten früher starten.":"../language-audio/38b4aa0ca0ee1ceb39b01fa8.mp3","Ich wohne mit zwei anderen Personen in einer Wohnung.":"../language-audio/710094db3ea8d70be1e85583.mp3","Wir möchten Regeln für die gemeinsamen Räume vereinbaren.":"../language-audio/8fa32e7913b4135f96a4bf88.mp3","Unter der Woche muss ich ziemlich früh schlafen gehen.":"../language-audio/466d17210c238fc89e436ae2.mp3","Ich kann die Küche putzen, wenn jemand den Müll rausbringt.":"../language-audio/bf3b52c1c7e62071b8fa379d.mp3","Bei einem Problem möchte ich lieber direkt miteinander sprechen.":"../language-audio/a5eb897a1995bdc8f5206152.mp3","In zwei Wochen können wir unsere Vereinbarung überprüfen.":"../language-audio/010dbba23ecb0287c5521aef.mp3","Ich wohne mit zwei anderen Personen in einer Wohnung. Wir möchten Regeln für die gemeinsamen Räume vereinbaren. Unter der Woche muss ich ziemlich früh schlafen gehen. Ich kann die Küche putzen, wenn jemand den Müll rausbringt. Bei einem Problem möchte ich lieber direkt miteinander sprechen. In zwei Wochen können wir unsere Vereinbarung überprüfen.":"../language-audio/628ce582753b77a4d7478e48.mp3","Luis teilt sich eine Wohnung mit Sara und Paul. In letzter Zeit steht morgens oft schmutziges Geschirr in der Küche. Luis möchte keinen ärgerlichen Zettel schreiben, sondern bittet um ein Gespräch am Sonntag. Die drei verteilen die Aufgaben neu und vereinbaren, das Geschirr nicht bis zum nächsten Tag stehen zu lassen. Sara arbeitet im Schichtdienst und braucht deshalb flexible Zeiten. Sie wollen den neuen Plan zwei Wochen lang ausprobieren und danach gemeinsam überlegen, ob er im Alltag funktioniert.":"../language-audio/5c9177c9f74f6a0aa0287c6c.mp3","Wie können wir die Aufgaben im Haushalt besser verteilen?":"../language-audio/57d7e4a2a24ec780eda2c51d.mp3","rausbringen":"../language-audio/6c4e3c16f0b64afc37cdb49a.mp3","Seit diesem Monat teile ich mir eine Wohnung mit einer Kollegin.":"../language-audio/328e4bead308d15c7f832bc2.mp3","Wir sollten besprechen, wann Besuch übernachten kann.":"../language-audio/f956436b74a468bcd1f874c0.mp3","Nach meiner Nachtschicht brauche ich vormittags Ruhe.":"../language-audio/79dee7a5ba812fde9dedf724.mp3","Ich übernehme das Bad, wenn du diese Woche den Flur putzt.":"../language-audio/626560219a31a2712ea37053.mp3","Können wir heute Abend in Ruhe über die laute Musik sprechen?":"../language-audio/42dc94f46f73e8babfe1e59e.mp3","Am Monatsende schauen wir gemeinsam, ob die Aufteilung funktioniert.":"../language-audio/c013e5779eb675ad403bf48f.mp3","Ich wohne mit zwei Mitbewohnern.":"../language-audio/b5a73909516827d6ae6c745d.mp3","Wenn du aufräumst, spüle ich das Geschirr.":"../language-audio/442b079767b91ce1dee3435f.mp3","Wir können die Aufgaben neu verteilen.":"../language-audio/0a4ba610a33bd1486f245c59.mp3","Ich bin gerade umgezogen und muss mehrere Dinge erledigen.":"../language-audio/5b70ee4f9278c04a03d559fa.mp3","Zuerst schreibe ich eine Liste mit den wichtigsten Aufgaben.":"../language-audio/9c563058295debe9208bd327.mp3","Ich muss die Adresse und die Uhrzeit meines Termins bestätigen.":"../language-audio/d8d6edbf6a1a84c69ee798a6.mp3","Wenn ich nicht kommen kann, sage ich rechtzeitig Bescheid.":"../language-audio/ff34f29b45777fcb8b31aaf5.mp3","Nach jedem Gespräch notiere ich die Antwort.":"../language-audio/3769cbf00f58a6b6fe70f7f6.mp3","Am Ende prüfe ich, welche Fragen noch offen sind.":"../language-audio/183793f95ddcc80d192176bd.mp3","Ich bin gerade umgezogen und muss mehrere Dinge erledigen. Zuerst schreibe ich eine Liste mit den wichtigsten Aufgaben. Ich muss die Adresse und die Uhrzeit meines Termins bestätigen. Wenn ich nicht kommen kann, sage ich rechtzeitig Bescheid. Nach jedem Gespräch notiere ich die Antwort. Am Ende prüfe ich, welche Fragen noch offen sind.":"../language-audio/48aaaccf67007fb3af7154ea.mp3","Lin ist in ein neues Viertel gezogen. Am Mittwoch hat sie einen Termin, um Unterlagen abzugeben. Außerdem sucht sie einen Sprachkurs in der Nähe ihrer Wohnung. In der Terminbestätigung steht, dass die Beratung in einem anderen Gebäude stattfindet. Lin fragt nach der genauen Adresse und bereitet die genannten Unterlagen vor. Danach ruft sie eine Schule an. Ihr bevorzugter Kurs ist schon voll. Sie bittet um Informationen zu einem anderen Termin und notiert, dass diese Antwort noch fehlt.":"../language-audio/307c8877fcea7da96b91140b.mp3","Welche Angelegenheit müssen Sie zuerst erledigen?":"../language-audio/ddf845a88587c17aaade16a6.mp3","Termin":"../language-audio/499bbbb0ac4583c0c67334e6.mp3","Ich habe eine neue Stelle angefangen und muss meinen Alltag neu organisieren.":"../language-audio/f738333636028eebc3cc0652.mp3","Zuerst notiere ich, welche Aufgaben diese Woche besonders dringend sind.":"../language-audio/1ea05ca5a0e4a8b1e5d87025.mp3","Ich möchte bestätigen lassen, welche Unterlagen ich zum Gespräch mitbringen soll.":"../language-audio/93fa0c4b27dcd4ce5f492b69.mp3","Wenn sich zwei Termine überschneiden, melde ich mich sofort bei den Beteiligten.":"../language-audio/db74c2dd305e58e88fb03551.mp3","Nach dem Telefonat schreibe ich auf, bis wann ich eine Antwort erwarten kann.":"../language-audio/b3344a9e76628331c84c7e68.mp3","Zum Schluss kontrolliere ich, ob noch eine Rückmeldung fehlt.":"../language-audio/48607a4d5c3ac50ad39538b7.mp3","Ich habe eine neue Stelle angefangen.":"../language-audio/78614b5cc6bcceda18cd8509.mp3","Ich komme mit den nötigen Unterlagen.":"../language-audio/f4e7a86ae568011227bf253c.mp3","Ich prüfe, welche Antworten noch fehlen.":"../language-audio/9661a975dd9703092bbb12c3.mp3","Am Dienstag geht Nora nach dem Kurs in einen kleinen Laden. Sie braucht zwei Hefte und einen Bleistift. Die Hefte kosten zusammen vier Euro. Nora hat nur einen großen Geldschein und fragt nach der Kartenzahlung. Das ist möglich. Danach sucht sie die Bushaltestelle. Eine Frau zeigt ihr den Weg: geradeaus bis zur Ampel und dann rechts. Der nächste Bus fährt um halb fünf. Nora hat noch zehn Minuten Zeit.":"../language-audio/e05f8337473f9b5975fba8da.mp3","Guten Tag, hier ist die Buchhandlung am Markt. Ihr Wörterbuch ist da. Sie können es heute bis achtzehn Uhr abholen. Morgen öffnen wir erst um zehn Uhr. Bitte bringen Sie die Bestellnummer mit. Das Buch kostet zwölf Euro. Sie können bar oder mit Karte bezahlen. Wenn Sie Fragen haben, rufen Sie uns bitte zurück.":"../language-audio/f1378375d06617fdf34d3adf.mp3","Am Wochenende wollte Felix seine Schwester besuchen. Er hatte ein Zimmer in der Nähe ihrer Wohnung reserviert. Am Samstagmorgen bekam er jedoch eine Nachricht: Seine Schwester war krank und brauchte Ruhe. Felix sagte den Besuch ab und rief im Hotel an. Das Zimmer konnte er auf die nächste Woche verschieben. Danach lud er einen Nachbarn zum Abendessen ein. Der Nachbar brachte einen Salat mit. Gemeinsam kochten sie eine Suppe und planten einen Spaziergang für Sonntag.":"../language-audio/466a06f9a5c0a53222b886f0.mp3","Hallo Eva, ich bin gerade am Bahnhof angekommen. Mein Zug hatte etwas Verspätung, deshalb kann ich nicht um zwei Uhr bei dir sein. Ich nehme jetzt den Bus und komme ungefähr um halb drei. Den Kuchen habe ich schon gekauft. Du musst also keinen Nachtisch vorbereiten. Kannst du mir noch sagen, an welcher Haltestelle ich aussteigen soll?":"../language-audio/4636216d6b403ef93c6a7929.mp3","Lea arbeitet seit kurzem in einer kleinen Firma. Für eine Besprechung soll sie einen Raum buchen. Obwohl sie früh angefragt hat, ist der gewünschte Raum schon belegt. Sie findet eine Alternative im Nachbargebäude und bittet um eine schriftliche Bestätigung. Bevor sie die Einladung verschickt, prüft sie die Adresse und die technische Ausstattung. Ein Kollege, der die Präsentation vorbereitet, braucht einen Bildschirm. Wenn kein Bildschirm vorhanden ist, möchte er seinen eigenen mitbringen. Lea fragt deshalb noch einmal nach.":"../language-audio/5bf6cef05c4968251c5135a5.mp3","Guten Tag, hier spricht Herr Weber aus der Werkstatt. Wir haben Ihren Drucker geprüft. Ein Kabel muss ersetzt werden. Bevor wir die Reparatur beginnen, möchten wir Ihnen die voraussichtlichen Kosten per E-Mail schicken. Bitte antworten Sie auf diese Nachricht, wenn Sie einverstanden sind. Ohne Ihre Rückmeldung warten wir mit der Reparatur. Bei Fragen erreichen Sie mich morgen zwischen neun und elf Uhr.":"../language-audio/bb8995bf6179f00c7a3e9667.mp3","Nach ihrem Umzug möchte Mira an einem Kochkurs teilnehmen. In einer Nachricht liest sie, dass der Kurs früher beginnt. Der Absender ist ihr jedoch unbekannt. Deshalb ruft sie die Schule über die bereits gespeicherte Nummer an. Dort erfährt sie, dass die Nachricht veraltet ist. Der Kurs beginnt weiterhin um sieben Uhr. Mira informiert ihre Mitbewohnerin, mit der sie gemeinsam kochen wollte. Beide vereinbaren, das Abendessen auf den nächsten Tag zu verschieben. Mira speichert die aktuelle Kursbestätigung in ihrem Kalender.":"../language-audio/d5dc41fe3ab3b559f33bbc54.mp3","Hallo zusammen, wegen der Baustelle können wir am Samstag nicht den Weg am Fluss nehmen. Ich schlage vor, dass wir uns um zehn Uhr vor der Bibliothek treffen und durch den Park gehen. Falls es stark regnet, könnten wir stattdessen die Fotoausstellung besuchen. Bitte sagt mir bis Freitagabend, ob ihr dabei seid. Danach schicke ich euch den endgültigen Treffpunkt noch einmal schriftlich.":"../language-audio/f14772746649a6c81dd4f614.mp3"};</script><script>(function(root){'use strict';

function daily(){const p=L.plan(S(),C);frame('今日学习计划','<section class="card wide"><p>以到期回忆为先，少量交错学习。可以随时结束；不要求连续刷满，也不会以连续签到评定能力。</p><label>每次到期词目标<select id="dailyGoal">'+[5,10,15,20].map(n=>'<option '+(D().dailyGoal===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label><div class="plan-step"><b>01 · 词汇回忆</b><p>'+p.words.length+' 个已学到期词。选择和拼写合在一页，朗读可另行练习。</p><button id="dailyVocab" '+(!p.words.length?'disabled':'')+'>开始到期词复习</button></div><div class="plan-step"><b>02 · 错题回炉</b><p>'+p.errors.length+' 个到期任务，其中 '+p.errors.filter(e=>e.due<=Date.now()).length+' 个可以计入延迟复练。其余只计训练。</p>'+p.errors.map(e=>'<button data-error="'+H(e.id)+'">'+H(e.prompt.slice(0,70))+'</button>').join('')+'</div><div class="plan-step"><b>03 · 新句与迁移</b><p>'+H(p.next?p.next.chapter.title+' · '+p.next.lesson.zh:'所有句子五步练习已完成，可以回到阶段测评补充证据。')+'</p><button id="dailyLesson" '+(!p.next?'disabled':'')+'>开始一小节</button></div></section>');$('#dailyGoal').onchange=e=>{D().dailyGoal=+e.target.value;A.save();daily()};$('#dailyVocab').onclick=()=>runWords(p.words);$('#dailyLesson').onclick=()=>lesson(p.next.lesson.id,p.next.chapter);bindErrors()}
function profile(){const p=A.summary(),x=stats();frame('个人学习档案','<section class="card wide"><div class="stats"><div class="stat"><strong>'+p.studied+'</strong>已学习词条</div><div class="stat"><strong>'+p.mastered+'</strong>掌握及以上</div><div class="stat"><strong>'+p.fluent+'</strong>熟练及以上</div><div class="stat"><strong>'+p.remembered+'</strong>已牢记</div></div><h2>课程目标与阶段距离</h2><p>实际 CEFR 水平：<b>未测定</b>。A1／A2／B1 是本路线内容目标；四技能、自然互动和陌生语料能力需要独立证据。</p>'+[['A1',0,6],['A2',6,12],['B1',12,24]].map(([name,start,end])=>{const group=C.chapters.slice(start,end),done=group.filter(x.deepChapter).length;return '<article class="stage-line"><b>'+name+' 目标</b><span>'+done+'/'+group.length+' 章精练通过 · 还需 '+(group.length-done)+' 章</span><div class="progress"><span style="width:'+done/group.length*100+'%"></span></div></article>'}).join('')+'<h2>输入、输出与保持</h2><p>五步训练 '+x.stages+'/'+x.totalStages+'；写作版本 '+x.revisions+'；已记录口语练习 '+x.spoken+' 章。</p><p>错题 '+x.activeErrors+' 项待巩固，'+x.stableErrors+' 项完成三次延迟复练。延迟复练仍可能使用见过的材料，不代表正式达级。</p><p>旧版 '+x.legacyLessons+' 个句子理解记录已保留；需要补做新增步骤，才计入“精练通过”。</p><button id="profileStages">查看阶段测评记录</button></section>');$('#profileStages').onclick=checkpoints}

function lesson(id,c,options={}){const info=L.lesson(C,id);c=info.chapter;const useStory=!options.stages&&!!window.ContinentStory,paint=(title,body,step)=>useStory?window.ContinentStory.frame(info,title,body,step):frame(title,body);const list=options.stages||L.STAGES;let index=options.stages?0:Math.max(0,list.findIndex(k=>!D().stages[id]?.[k]?.correct));const render=()=>{if(index>=list.length){if(options.done){options.done();return}paint('一小节完成','<section class="card wide"><h2>把句子放回生活中。</h2><p>试着不看屏幕，用自己的细节再说一次。这次训练不自动增加词汇掌握次数。</p><button id="lessonReturn">返回本章</button></section>',6);$('#lessonReturn').onclick=()=>A.openChapter(c.id);return}const stage=list[index],target=L.expected(C,id,stage),task=stage==='transfer'?info.transfer:info.lesson;let assisted=false,chosen=[],submitted=false,choices=[],tiles=[];if(stage==='meaning'||stage==='listening')choices=shuffle([target,...shuffle(c.lessons.filter(l=>l.id!==id)).slice(0,2).map(l=>l.zh)]);if(stage==='order'||stage==='transfer')tiles=shuffle(L.tokens(target).map((text,i)=>({text,id:i})));
L.expose(S(),id+':'+stage);A.save();const prompt=stage==='listening'?'听这句话，选择它表达的意思。':stage==='gap'?'结合整句和中文，回忆缺少的表达。':stage==='order'?'按正确顺序重组句子。':stage==='transfer'?task.prompt:'读这句话，选择对应含义。';paint(label[stage],'<article class="card wide"><small>'+H(c.title)+' · 第'+(index+1)+'/'+list.length+'步</small><h2>'+H(prompt)+'</h2>'+(stage==='meaning'?'<p class="target" lang="'+C.id+'">'+H(info.lesson.text)+'</p>':'')+(stage!=='transfer'?A.audioButtons(info.lesson.text):'')+(stage==='gap'?'<p class="target" lang="'+C.id+'">'+H(L.gap(info.lesson.text).text)+'</p><p>'+H(info.lesson.zh)+'</p>':'')+'<form id="detailForm">'+(choices.length?choices.map((x,i)=>'<label class="option"><input type="radio" name="choice" required value="'+i+'">'+H(x)+'</label>').join(''):tiles.length?'<div id="builtSentence" class="built-sentence" aria-live="polite">点击词块构句</div><div id="sentenceTiles" class="tile-bank">'+tiles.map((x,i)=>'<button type="button" data-tile="'+i+'">'+H(x.text)+'</button>').join('')+'</div><button type="button" id="undoTile">撤回一词</button> <button type="button" id="clearTiles">重新排列</button>':'<input id="detailAnswer" aria-label="缺少的表达" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required maxlength="300">'+accents('detailAnswer'))+'<div class="row"><button class="primary">提交本步</button><button type="button" id="detailHint">查看提示（不计独立通过）</button></div></form><div id="detailFeedback" role="status"></div><button id="detailContinue" hidden></button></article>',index+2);
const redraw=()=>{$('#builtSentence').textContent=chosen.map(i=>tiles[i].text).join(' ')||'点击词块构句';document.querySelectorAll('[data-tile]').forEach(b=>b.disabled=chosen.includes(+b.dataset.tile))};document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{chosen.push(+b.dataset.tile);redraw()});if(tiles.length){$('#undoTile').onclick=()=>{chosen.pop();redraw()};$('#clearTiles').onclick=()=>{chosen=[];redraw()}}bindAccents();$('#detailHint').onclick=()=>{assisted=true;$('#detailFeedback').innerHTML='<div class="feedback">'+H(target)+'<p>'+H(stage==='transfer'?task.explanation:info.lesson.tip)+'</p></div>'};$('#detailForm').onsubmit=e=>{e.preventDefault();if(submitted)return;const response=choices.length?choices[+new FormData(e.target).get('choice')]:tiles.length?chosen.map(i=>tiles[i].text).join(' '):$('#detailAnswer').value;if(!response){$('#detailFeedback').textContent='请先选择答案、排列词块或填写缺少的表达。';return}submitted=true;const result=L.stageAnswer(S(),C,id,stage,response,{assisted});window.QuestAnswerSounds?.result(L.equal(response,result.answer,C.id,['order','transfer'].includes(stage)));if(!result.correct)options.onFailure?.();A.save();$('#detailFeedback').innerHTML='<div class="feedback"><b>'+(result.correct?'✓ 本步通过':'↻ 本步需要复练')+'</b><p>'+H(result.answer)+'</p><p>'+H(stage==='transfer'?task.explanation:info.lesson.tip)+'</p>'+(stage==='order'||stage==='gap'?'<p>'+H(c.support.grammarNotes[0])+'</p>':'')+(assisted?'<p>本次使用提示，先理解后再独立回忆。</p>':'')+'</div>'+(stage==='transfer'?A.audioButtons(task.text):'');bindAudio();e.target.querySelectorAll('input,button').forEach(x=>x.disabled=true);$('#detailContinue').hidden=false;$('#detailContinue').textContent=result.correct?'继续 →':'重新独立尝试';$('#detailContinue').onclick=()=>{if(result.correct){if(options.onCorrect)options.onCorrect();index++}render()}}};if(useStory)window.ContinentStory.intro(info,render);else render()}
function grammar(c){const qs=c.support.grammarCheck;frame('语法辨析 · '+c.title,'<article class="card wide"><p>比较常见易错表达，答题后阅读具体规则。至少2/3记为本章语法训练通过；这属于练习。</p><form id="grammarForm">'+qs.map((q,i)=>'<fieldset><legend>'+(i+1)+'. '+H(q.prompt)+'</legend>'+shuffle(q.options.map((text,j)=>({text,j}))).map(o=>'<label class="option"><input type="radio" name="g'+i+'" required value="'+o.j+'"><span lang="'+C.id+'">'+H(o.text)+'</span></label>').join('')+'</fieldset>').join('')+'<button class="primary">提交辨析</button></form><div id="grammarFeedback"></div><button id="grammarReturn">返回本章</button></article>');$('#grammarReturn').onclick=()=>A.openChapter(c.id);$('#grammarForm').onsubmit=e=>{e.preventDefault();const answers=qs.map((_,i)=>+new FormData(e.target).get('g'+i)),correct=answers.filter((a,i)=>a===qs[i].answer).length;window.QuestAnswerSounds?.result(correct===qs.length);D().grammar.push({chapter:c.id,date:Date.now(),answers,correct});D().grammar=D().grammar.slice(-200);qs.forEach((q,i)=>{if(answers[i]!==q.answer)L.error(S(),'grammar:'+c.id+':'+i,{chapter:c.id,source:'语法辨析',cause:'grammar',prompt:q.prompt,answer:q.options[q.answer],response:q.options[answers[i]],explanation:q.explanation})});A.save();$('#grammarFeedback').innerHTML='<div class="feedback"><h3>'+correct+'/3</h3>'+qs.map(q=>'<p><b>'+H(q.options[q.answer])+'</b><br>'+H(q.explanation)+'</p>').join('')+'</div>';e.target.querySelectorAll('input,button').forEach(b=>b.disabled=true)}}
function words(){const map=new Map(C.chapters.flatMap(c=>c.vocab).map(v=>[v.head,v])),entries=[...map.values()].filter(v=>S().vocab[v.head]?.seen);frame('分级词汇与复习安排','<section class="card wide"><p>只显示实际学过的词条。同一词条去重计数；这不代表已掌握所有词义。日期由间隔规则安排，未校准为记忆概率。</p><input id="wordSearch" placeholder="检索词头或中文" aria-label="检索已学词汇"><div class="row">'+Object.entries(tier).map(([k,t])=>'<label><input type="checkbox" data-exclude="'+k+'" '+(D().excluded.includes(k)?'checked':'')+'>排除'+t+'</label>').join('')+'</div><button id="wordQuiz">随机抽查20词</button><div id="wordList"></div></section>');const draw=()=>{const q=$('#wordSearch').value.toLocaleLowerCase(C.id);$('#wordList').innerHTML=entries.filter(v=>!D().excluded.includes(L.vocabTier(S().vocab[v.head]))&&(v.head+' '+v.zh).toLocaleLowerCase(C.id).includes(q)).slice(0,100).map(v=>{const x=S().vocab[v.head],due=Math.min(x.spelling?.due||0,x.meaning?.due||0);return '<details><summary>'+H(v.head)+' · '+H(v.zh)+' · '+tier[L.vocabTier(x)]+'</summary>'+A.audioButtons(v.head)+'<p>'+H(v.example)+'<br>'+H(v.exampleZh)+'</p><p>拼写 '+(x.spelling?.count||0)+' 次 · 词义 '+(x.meaning?.count||0)+' 次有效正确。'+(due<=Date.now()?'待复习':'下次建议：'+new Date(due).toLocaleDateString())+'</p></details>'}).join('')||'<p>当前筛选没有词汇。</p>';bindAudio()};$('#wordSearch').oninput=draw;document.querySelectorAll('[data-exclude]').forEach(e=>e.onchange=()=>{D().excluded=[...document.querySelectorAll('[data-exclude]:checked')].map(x=>x.dataset.exclude);A.save();draw()});$('#wordQuiz').onclick=practice;draw()}

function runWords(queue){let index=0,passed=0;const map=new Map(C.chapters.flatMap(c=>c.vocab).map(v=>[v.head,v]));const next=()=>{if(index>=queue.length){frame('本轮回忆完成','<article class="card wide"><h2>'+passed+'/'+queue.length+' 词两项都正确</h2><p>拼写、词义分别记录。至少间隔24小时的独立正确才增加该项次数：3次掌握、6次熟练、10次牢记。口语识别不参与。</p><button id="roundPlan">返回今日计划</button></article>');$('#roundPlan').onclick=daily;return}const v=queue[index],options=shuffle([v.zh,...shuffle([...new Set([...map.values()].map(v=>v.zh))].filter(x=>x!==v.zh)).slice(0,3)]);let helped=false,submitted=false;frame('听音拼写与词义','<article class="card wide"><small>第 '+(index+1)+' / '+queue.length+' 词</small><div class="cue">'+WordCues.svg(v.head,v.zh,v.icon)+'</div><h2>听单词，写下来，再选词义。</h2>'+A.audioButtons(v.head)+'<p class="muted">简图只作联想提示。重音、变音符号及德语名词、句首大小写有意义。</p><form id="detailWordForm"><input id="quizSpelling" lang="'+C.id+'" aria-label="听音拼写" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required maxlength="250">'+accents('quizSpelling')+options.map((x,i)=>'<label class="option"><input type="radio" name="meaning" required value="'+i+'">'+H(x)+'</label>').join('')+'<div class="row"><button class="primary">提交这个词</button><button type="button" id="wordHelp">提示（不计通过）</button></div></form><div id="wordFeedback"></div><button id="wordContinue" hidden>下一个词 →</button></article>');bindAccents();$('#wordHelp').onclick=()=>{helped=true;$('#wordFeedback').textContent=v.head+' · '+v.zh};$('#detailWordForm').onsubmit=e=>{e.preventDefault();if(submitted)return;submitted=true;const spelling=L.equal($('#quizSpelling').value,v.head,C.id),meaning=options[+new FormData(e.target).get('meaning')]===v.zh;window.QuestAnswerSounds?.result(spelling&&meaning);L.observeWord(S(),C,v,'spelling',spelling,{assisted:helped});L.observeWord(S(),C,v,'meaning',meaning,{assisted:helped});if(spelling&&meaning&&!helped)passed++;A.save();$('#wordFeedback').innerHTML='<div class="feedback"><b>'+H(v.head)+' · '+H(v.zh)+'</b><p>拼写 '+(spell function wrong(){L.syncLegacy(S(),C);const errors=Object.values(D().errors).sort((a,b)=>Number(a.stable)-Number(b.stable)||a.due-b.due);frame('统一错题本与延迟复练','<section class="card wide"><p>汇总句子、听音、词汇、语法辨析、阅读与阶段测评的错误。错因按练习类型初步标记，可自行更正。先理解，再回忆；相隔1、7、21天的正确复练用于观察保持，不是正式水平认证。</p><label>显示<select id="errorFilter"><option value="active">待巩固</option><option value="all">全部记录</option><option value="due">到期延迟复练</option><option value="stable">复练稳定</option></select></label><div id="errorList"></div></section>');const draw=()=>{const filter=$('#errorFilter').value;$('#errorList').innerHTML=errors.filter(e=>filter==='all'||filter==='active'&&!e.stable||filter==='stable'&&e.stable||filter==='due'&&!e.stable&&e.due<=Date.now()).map(e=>'<article class="error-item"><small>'+H(e.source)+' · '+(e.stable?'复练稳定':e.validations+'/3 次延迟通过')+'</small><h3>'+H(e.prompt)+'</h3><details><summary>错因与理解</summary><p>此前回答：'+H(e.response||'旧版未记录具体作答')+'</p><p>参考：'+H(e.answer)+'</p><p>'+H(e.explanation)+'</p></details><label>我的错因<select data-cause="'+H(e.id)+'">'+Object.entries(L.CAUSES).map(([k,v])=>'<option value="'+k+'" '+(e.cause===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><p>建议延迟复练：'+new Date(e.due).toLocaleString()+'。到期前可以训练，但不计延迟通过。</p><button data-error="'+H(e.id)+'">理解与变式复练</button></article>').join('')||'<p>当前没有符合筛选的错题。</p>';bindErrors();document.querySelectorAll('[data-cause]').forEach(e=>e.onchange=()=>{D().errors[e.dataset.cause].cause=e.value;A.save()})};$('#errorFilter').onchange=draw;draw()}

function repair(id){const e=D().errors[id];if(!e)return;const c=C.chapters.find(c=>c.id===e.chapter);let viewed=false;frame('理解与延迟回忆','<article class="card wide"><h2>'+H(e.prompt)+'</h2><p>如果已到延迟复练日期，先独立作答；打开下面的答案讲解会标记本轮使用提示。</p><details id="repairExplain"><summary>先查看错因与参考答案（本轮不计独立通过）</summary><p>'+H(e.answer)+'</p><div class="feedback">'+H(e.explanation)+'</div></details><label for="errorNote">用自己的话记录理解或疑问</label><textarea id="errorNote" maxlength="2000">'+H(e.note)+'</textarea><p class="muted">到期前答对只计训练。延迟复练可能包含原题，再接章节变式；熟题不会被说成陌生能力证据。</p><button class="primary" id="repairStart">开始独立回忆</button></article>');$('#repairExplain').ontoggle=()=>{if($('#repairExplain')?.open)viewed=true};$('#repairStart').onclick=()=>{e.note=$('#errorNote').value;A.save();if(e.head&&e.skill){repairWord(id,viewed);return}let q=null,context='',listen=false;const parts=id.split(':');if(id.startsWith('grammar:'))q=c.support.grammarCheck[+parts.at(-1)];if(id.startsWith('checkpoint:')){const b=C.checkpoints.find(b=>b.id===parts[1]),i=+parts.at(-1);if(b){q=[...b.reading.questions,...b.listening.questions][i];listen=i>=4;context=listen?b.listening.text:b.reading.text}}if(id.startsWith('legacy:')){const m=id.match(/-q(\d+)$/);if(m){q=c.assessment.questions[+m[1]];context=c.assessment.reading.text}}
const complete=()=>repairComplete(id,viewed),fail=()=>{L.retention(S(),id,false);A.save()},variant=()=>{const chosen=e.lesson?L.lesson(C,e.lesson):L.lesson(C,c.lessons[e.validations%c.lessons.length].id);lesson(chosen.lesson.id,c,{stages:[e.validations%2===0?'transfer':'listening'],onFailure:fail,done:complete})};
if(!q){variant();return}frame('原题回忆与章节迁移','<article class="card wide"><p class="muted">本题已见过，用于延迟回忆，不是陌生测评。</p>'+(context?(listen?A.audioButtons(context):'<p class="target">'+H(context)+'</p>'):'')+'<h2>'+H(q.prompt)+'</h2><form id="repairQuestion">'+shuffle(q.options.map((text,i)=>({text,i}))).map(o=>'<label class="option"><input required type="radio" name="r" value="'+o.i+'">'+H(o.text)+'</label>').join('')+'<button class="primary">提交回忆</button></form><div id="repairFeedback"></div><button id="repairVariant" hidden>继续本章变式</button></article>');$('#repairQuestion').onsubmit=event=>{event.preventDefault();const ok=+new FormData(event.target).get('r')===q.answer;window.QuestAnswerSounds?.result(ok);if(!ok)fail();$('#repairFeedback').innerHTML='<div class="feedback">'+(ok?'✓ 回忆正确':'↻ 需要重新理解')+'<p>'+H(q.options[q.answer])+'</p><p>'+H(q.explanation)+'</p></div>';event.target.querySelectorAll('input,button').forEach(b=>b.disabled=true);$('#repairVariant').hidden=false;$('#repairVariant').onclick=variant}}}
function repairComplete(id,assisted){const r=L.retention(S(),id,true,{assisted});A.save();frame('复练记录已保存','<article class="card wide"><p>'+(r.counted?'本次计入延迟复练，当前 '+r.error.validations+'/3 次。':assisted?'本轮看过讲解，记为提示练习；下次独立回忆再验证。':'本次为到期前训练，未增加延迟通过次数。')+'</p><p>下一次建议：'+new Date(r.error.due).toLocaleString()+'。这里记录的是复练保持，不自动证明整体语言水平。</p><button id="repairBack">返回错题本</button></article>');$('#repairBack').onclick=wrong}
function repairWord(id,viewed){const e=D().errors[id],v=C.chapters.flatMap(c=>c.vocab).find(v=>v.head===e.head);if(!v){wrong();return}const options=shuffle([v.zh,...shuffle([...new Set(C.chapters.flatMap(c=>c.vocab).map(v=>v.zh))].filter(x=>x!==v.zh)).slice(0,3)]);frame('词汇独立回忆','<article class="card wide"><p>'+H(v.exampleZh)+'</p>'+A.audioButtons(v.head)+'<form id="repairWordForm">'+(e.skill==='spelling'?'<input required id="repairSpelling" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="词汇拼写">'+accents('repairSpelling'):options.map((x,i)=>'<label class="option"><input type="radio" name="r" required value="'+i+'">'+H(x)+'</label>').join(''))+'<button class="primary">提交词汇回忆</button></form><div id="repairWordFeedback"></div><button id="repairWordContinue" hidden>查看复练记录</button></article>');bindAccents();$('#repairWordForm').onsubmit=event=>{event.preventDefault();const ok=e.skill==='spelling'?L.equal($('#repairSpelling').value,v.head,C.id):options[+new FormData(event.target).get('r')]===v.zh;window.QuestAnswerSounds?.result(ok);L.observeWord(S(),C,v,e.skill,ok,{assisted:viewed});if(!ok)L.retention(S(),id,false);A.save();$('#repairWordFeedback').innerHTML='<div class="feedback">'+(ok?'✓':'↻')+' '+H(v.head)+' · '+H(v.zh)+'<p>'+H(v.example)+'<br>'+H(v.exampleZh)+'</p></div>';event.target.querySelectorAll('input,button').forEach(b=>b.disabled=true);$('#repairWordContinue').hidden=false;$('#repairWordContinue').onclick=()=>repairComplete(id,viewed)}}
function output(c){const sup=c.support,container=document.createElement('article');container.className='card support-card';const versions=D().revisions[c.id]||[],spoken=D().speaking[c.id]||{};container.innerHTML='<h2>写作版本与修订</h2>'+accents('draft')+'<p>系统提供过程记录和自检，不根据词数、关键词或自评授予等级。</p><fieldset><legend>本章自检</legend>'+sup.writingChecklist.map((x,i)=>'<label class="option"><input type="checkbox" data-writing-check="'+i+'">'+H(x)+'</label>').join('')+'</fieldset><p class="feedback">人工评阅建议分别检查：任务是否完成、组织是否清楚、语言是否准确、语域是否适合对象。口语另看可理解性、连贯性、互动回应与澄清修复。自评和伙伴反馈用于改进，不授予等级。</p><label>反馈来源<select id="reviewRole"><option value="self">自我检查</option><option value="partner">学习伙伴</option><option value="teacher">教师／评阅者（自行填写身份）</option></select></label><input id="reviewerName" type="text" maxlength="80" aria-label="反馈者称呼" placeholder="反馈者称呼（可选）"><label for="revisionNote">反馈／修改理由</label><textarea id="revisionNote" maxlength="4000" placeholder="记录伙伴、教师反馈，或说明这一版改了什么。"></textarea><button id="saveRevision">保存当前草稿为一个版本</button><div id="revisionStatus" role="status"></div><div id="revisionHistory">'+versions.map((r,i)=>'<details><summary>版本 '+(i+1)+' · '+new Date(r.date).toLocaleString()+' · '+L.tokens(r.text).length+' 个空格分隔片段</summary><p class="target">'+H(r.text)+'</p><p>'+H(r.note)+'</p><small>反馈来源：'+H({self:'自评',partner:'伙伴',teacher:'自行登记的教师／评阅者'}[r.role||'self'])+' '+H(r.reviewer||'')+'</small></details>').join('')+'</div><h2>口语追问与表达记录</h2><ol>'+sup.speakingFollowups.map(x=>'<li>'+H(x)+'</li>').join('')+'</ol><label for="speakingNote">记录卡住的地方、伙伴回应和下一次改进</label><textarea id="speakingNote" maxlength="10000">'+H(spoken.note||'')+'</textarea><label class="option"><input type="checkbox" id="spokenPracticed" '+(spoken.practiced?'checked':'')+'>我已实际练习并回听／和伙伴交流（自报记录，非能力评分）</label><div class="row"><button id="saveSpeaking">保存口语记录</button><button id="exportRecording">导出录音文件</button><button id="exportRecordingJson">导出录音JSON备份</button><label>恢复录音备份<input id="restoreRecording" type="file" accept="application/json,.json"></label></div><div id="restoredAudio"></div><p class="muted">录音备份单独保存，学习进度JSON不含声音。三语暂无本地自动识别；识别失败不会影响词汇分级。</p>';$('#chapterBody').append(container);$('#saveRevision').onclick=()=>{const text=$('#draft').value.trim();if(!text){$('#revisionStatus').textContent='请先在上方写作框填写草稿。';return}const list=D().revisions[c.id]||=[];if(list.at(-1)?.text===text&&list.at(-1)?.note===$('#revisionNote').value){$('#revisionStatus').textContent='与上一个版本相同，无需重复保存。';return}list.push({text,date:Date.now(),note:$('#revisionNote').value,role:$('#reviewRole').value,reviewer:$('#reviewerName').value,checks:[...document.querySelectorAll('[data-writing-check]:checked')].map(x=>+x.dataset.writingCheck)});D().revisions[c.id]=list.slice(-10);S().drafts[c.id]=text;A.save();$('#revisionStatus').textContent='版本已保存。每章最多保留最近10版；请定期导出进度。'};$('#saveSpeaking').onclick=()=>{D().speaking[c.id]={note:$('#speakingNote').value,practiced:$('#spokenPracticed').checked,date:Date.now()};A.save();$('#notice').textContent='口语过程记录已保存；没有自动评定语言等级。'};$('#exportRecordingJson').onclick=exportRecording;$('#exportRecording').onclick=async()=>{const blob=A.latestRecording;if(!blob){$('#notice').textContent='请先录音或导入设备录音。';return}try{const type=blob.type,extension=type.includes('wav')?'wav':type.includes('mpeg')?'mp3':type.includes('ogg')?'ogg':type.includes('mp4')?'m4a':'webm';await window.QuestLocalExport.audio('语言大陆-'+C.id+'-'+Date.now()+'.'+extension,blob)}catch(e){$('#notice').textContent='导出失败：'+e.message}};$('#restoreRecording').onchange=restoreRecording;bindAccents()}
async function exportRecording(){const blob=A.latestRecording;if(!blob){$('#notice').textContent='请先录音或导入设备录音，再导出。';return}if(blob.size>15000000){$('#notice').textContent='录音过大，请缩短至120秒以内。';return}const bytes=new Uint8Array(await blob.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));download('语言大陆-'+C.id+'-录音.json',JSON.stringify({type:'continent-recording',version:1,locale:C.id,mime:blob.type,date:Date.now(),data:btoa(binary)}))}

async function restoreRecording(e){try{const file=e.target.files[0];if(!file||file.size>21000000)throw Error('请选择21MB以内的本应用录音备份');const x=JSON.parse(await file.text());if(x.type!=='continent-recording'||x.version!==1||x.locale!==C.id||!/^audio\//.test(x.mime)||typeof x.data!=='string')throw Error('录音格式或语言不匹配');const raw=atob(x.data);if(raw.length>15000000)throw Error('录音过大');const blob=new Blob([Uint8Array.from(raw,c=>c.charCodeAt(0))],{type:x.mime});A.latestRecording=blob;const u=URL.createObjectURL(blob);$('#restoredAudio').innerHTML='<audio controls></audio>';$('#restoredAudio audio').src=u;$('#restoredAudio audio').onloadeddata=()=>URL.revokeObjectURL(u)}catch(e){$('#notice').textContent='恢复录音失败：'+e.message}}

function checkpoint(id){const bank=C.checkpoints.find(b=>b.id===id);let fresh=!D().exposures[id+':reading']&&!D().exposures[id+':listening'],assisted=false,submitted=false,heard=false;const started=Date.now();L.expose(S(),id+':reading',started);L.expose(S(),id+':listening',started);A.save();const qs=[...bank.reading.questions,...bank.listening.questions];frame('阶段综合测评 · '+bank.target,'<article class="card wide"><p>'+(fresh?'本机首次接触本组材料。':'本组材料已接触过，本次记为熟题复测。')+' 暂不查看翻译或笔记，先完成客观题。可随时离开，离开也保留“已暴露”标记。</p><h2>阅读</h2><p class="target" lang="'+C.id+'">'+H(bank.reading.text)+'</p><h2>听力</h2>'+A.audioButtons(bank.listening.text)+'<button id="showTranscript">需要文字脚本（将标记使用提示）</button><div id="transcript"></div><form id="checkpointForm">'+qs.map((q,i)=>'<fieldset><legend>'+(i<4?'阅读':'听力')+' '+(i%4+1)+' · '+H(q.prompt)+'</legend>'+shuffle(q.options.map((text,j)=>({text,j}))).map(o=>'<label class="option"><input required type="radio" name="s'+i+'" value="'+o.j+'">'+H(o.text)+'</label>').join('')+'</fieldset>').join('')+'<button class="primary">提交客观题</button></form><div id="checkpointFeedback"></div><h2>写作与互动</h2><p>'+H(bank.writing)+'</p><p>'+H(bank.speaking)+'</p><p class="muted">请在对应章节的写作与口语页保存输出及反馈。客观题通过不替代这两项能力证据。</p><button id="stageBack">返回阶段记录</button></article>');$('#stageBack').onclick=checkpoints;document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=async()=>{const player=await A.play(b.dataset.audio,Number(b.dataset.rate)||1);player?.addEventListener?.('ended',()=>{heard=true;$('#notice').textContent='已完整播放一次听力，可提交客观题。'},{once:true})});$('#showTranscript').onclick=()=>{assisted=true;$('#transcript').innerHTML='<p class="target">'+H(bank.listening.text)+'</p><p class="muted">本次已标记使用文字提示。</p>'};$('#checkpointForm').onsubmit=e=>{e.preventDefault();if(submitted)return;if(!heard){$('#notice').textContent='请先完整播放至少一次听力音频，再提交本组客观题。';return}submitted=true;const answers=qs.map((_,i)=>+new FormData(e.target).get('s'+i)),bits=answers.map((a,i)=>a===qs[i].answer),record={id (function(){'use strict';const KEY='twin-islands-grammar-summary-v1';let carried=null;

(function(){'use strict';const KEY='continent-summaries-v1',ids=['english','grammar','pt-PT','es-ES','de-DE'];let summaries={};
