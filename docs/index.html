(function(){'use strict';const KEY='twin-islands-grammar-summary-v1';let carried=null;
function valid(x){if(!x||typeof x!=='object')return null;for(const k of ['chapters','completedChapters','missions','completedMissions','questions','solvedQuestions','independentQuestions','wrong'])if(!Number.isInteger(x[k])||x[k]<0||x[k]>100000)return null;if(x.completedChapters>x.chapters||x.completedMissions>x.missions||x.solvedQuestions>x.questions||x.independentQuestions>x.solvedQuestions)return null;return x}
try{carried=valid(JSON.parse(localStorage.getItem(KEY)||'null'))}catch{}
if(location.hash.startsWith('#grammar-summary='))try{const x=valid(JSON.parse(decodeURIComponent(location.hash.slice(17))));if(x&&(!carried||Number(x.updated)>=Number(carried.updated))){carried=x;try{localStorage.setItem(KEY,JSON.stringify(x))}catch{}}}catch{}
function update(){if(typeof window.QuestGrammarProgress==='function'){const x=valid(window.QuestGrammarProgress());if(x){carried=x;try{localStorage.setItem(KEY,JSON.stringify(x))}catch{}}}return carried}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const x=update();if(!x)return;const url=new URL(a.href,location.href);if(url.origin===location.origin&&!url.pathname.includes('/grammar/')&&(/\/(index|suite|先打开双岛英语)\.html$/.test(decodeURIComponent(url.pathname)))){x.theme=window.QuestTheme?.get();url.hash='grammar-summary='+encodeURIComponent(JSON.stringify(x));a.href=url.href}},true);
window.addEventListener('pagehide',update);document.addEventListener('visibilitychange',()=>{if(document.hidden)update()});window.QuestSuiteGrammar=update;
})();

(function(){'use strict';const KEY='continent-summaries-v1',ids=['english','grammar','pt-PT','es-ES','de-DE'];let summaries={};
function clean(x){if(!x||typeof x!=='object')return null;const out={};for(const k of ['chapters','completed','lessons','totalLessons','studied','mastered','fluent','remembered','updated','deepCompleted','completedStages','totalStages']){const n=Number(x[k]||0);if(!Number.isFinite(n)||n<0||n>1e14)return null;out[k]=Math.floor(n)}if(out.completed>out.chapters||out.lessons>out.totalLessons||out.deepCompleted>out.chapters||out.completedStages>out.totalStages)return null;return out}
function merge(x){for(const id of ids){const v=clean(x?.[id]);if(v&&(!summaries[id]||v.updated>=summaries[id].updated))summaries[id]=v}}
try{merge(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{}merge(window.ContinentIncoming?.summaries);
const g=window.ContinentIncoming?.grammar;if(g&&typeof window.VocabularyProgress?.grammarSummary==='function'){const v=window.VocabularyProgress.grammarSummary(g);if(v)try{localStorage.setItem('twin-islands-grammar-summary-v1',JSON.stringify(v))}catch{}}else if(g&&Number.isInteger(g.completedMissions)&&g.completedMissions<=g.missions)try{localStorage.setItem('twin-islands-grammar-summary-v1',JSON.stringify(g))}catch{}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(summaries))}catch{}document.querySelectorAll('[data-continent-progress]').forEach(el=>{const id=el.dataset.continentProgress,v=summaries[id];el.textContent=v&&v.totalStages?v.deepCompleted+' / '+v.chapters+' 章精练 · '+v.completedStages+' / '+v.totalStages+' 步':v?v.completed+' / '+v.chapters+' 章 · '+v.lessons+' / '+v.totalLessons+(id==='grammar'?' 个任务':' 个句子任务'):'尚未开始 · 进度保存在本机'})}
function publish(id,x){if(!ids.includes(id))return;const v=clean(x);if(v){summaries[id]=v;persist()}}
function update(){try{if(window.ContinentCourse)publish(window.ContinentData.id,window.ContinentCourse.summary());if(typeof state!=='undefined'&&typeof lessons!=='undefined'&&typeof chapters!=='undefined'){const completed=new Set(state.completed||[]),v=window.VocabularyProgress?.summary(state);publish('english',{chapters:chapters.length,completed:chapters.filter((c,i)=>{const ls=lessons.filter(l=>l.chapter===i+1);return ls.length&&ls.every(l=>completed.has(l.id))}).length,lessons:completed.size,totalLessons:lessons.length,studied:v?.studied||0,mastered:v?.masteredTotal||0,fluent:v?.fluent||0,remembered:v?.remembered||0,updated:Date.now()})}const g=window.QuestSuiteGrammar?.();if(g)publish('grammar',{chapters:g.chapters,completed:g.completedChapters,lessons:g.completedMissions,totalLessons:g.missions,updated:g.updated||Date.now()})}catch{}persist()}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a||a.download)return;try{const u=new URL(a.href,location.href);if(u.origin!==location.origin||!u.pathname.endsWith('.html')||u.pathname===location.pathname)return;update();u.hash='continent='+encodeURIComponent(JSON.stringify({summaries,theme:window.QuestTheme?.get(),grammar:window.QuestSuiteGrammar?.()}));a.href=u.href}catch{}},true);
window.ContinentHub={publish,update,get:()=>JSON.parse(JSON.stringify(summaries))};window.addEventListener('pagehide',update);update();
})();
