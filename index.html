{title:'有名字的，不一定摸得到',body:'apple 是苹果，water 是水，idea 是想法，kindness 是善意。实物和抽象概念都能有名词。可数性则看英语里这个词在这里怎样使用，不能只凭“看不看得见”判断。',example:'I have an apple and an idea.',zh:'我有一个苹果，也有一个想法。',visual:'bag',tags:['实物：apple','抽象概念：idea','可数性看词义与用法']},
{title:'一只背包，两种装法',body:'苹果可以说 one apple、two apples；本关把 water 当作水这种物质，说 two cups of water。数的是杯，不是给 water 加 s。常见复数加 -s 或 -es，也有 child → children 这样的变化。点背包和数量按钮，看英文怎样改变。',example:'Two apples. Two cups of water.',zh:'两个苹果。两杯水。',visual:'bag',tags:['many / a few + 可数复数','much / a little + 不可数','some 两种都可用','a coffee 可指一杯咖啡：语境会改变用法']},
{title:'代词小衣柜',body:'Mia 作主语可以换成 she；动作涉及她，用 her。my book 后面有名词，mine 可以单独表示“我的那本”。Mia 在镜中看自己时用 herself；不表示同一对象时不能机械换成反身代词。something、everyone 等则用来泛指。',example:'She sees herself. This book is mine.',zh:'她看见自己。这本书是我的。',visual:'mirror',tags:['主语 she → 宾语 her','my book → mine','自己：herself','everyone 语法上按单数配动词']},

{title:'形容词，也会换句中角色',body:'a happy fox 中 happy 作定语；The fox is happy. 中 happy 作表语。多个形容词放在名词前常有自然顺序，先练“看法 → 大小 → 颜色”，如 a lovely small red bag。这是常见次序，不是所有表达都必须套同一条口诀。',example:'A lovely small red bag. The fox is happy.',zh:'一个可爱的小红背包。狐狸很开心。',visual:'mirror',tags:['词性不变，句中功能可以变','限定词 a / the / my 与形容词有区别','先练清楚、自然的短语']}

{id:'be1',number:'BE',kind:'extension',title:'身份镜屋',subtitle:'换一个人物，让 be 找到新搭档',mechanic:'人物切换 · 时间镜面 · be 连接',theme:'lavender',scene:'mirror',book:'拓展 1 · 书内 49–52 页',brief:'I am、she is、they are：人物走到镜子前，连接词也跟着变。再试昨天、否定句和问句，分清 be 的两份工作。',lessons:[
{title:'现在，谁站在镜子前？',body:'I 配 am；he/she/it 和单个名字配 is；you/we/they 配 are。you 指一个人或多个人时都配 are。be 后面可以说身份、状态或位置，不必每次都硬译成“是”。',example:'I am happy. She is a painter. They are here.',zh:'我很开心。她是一位画家。他们在这里。',visual:'mirror',tags:['I am','she / he / it is','you / we / they are','单数名字 Mia is']},
{title:'昨天的镜子',body:'说过去的状态，I/he/she/it 常配 was，you/we/they 常配 were。这里只练普通陈述句；虚拟结构等特殊情形以后再学。be 的家族还包括原形 be、过去分词 been、-ing 形式 being，要按结构选择。',example:'I was tired yesterday. They were happy.',zh:'我昨天很累。他们（那时）很开心。',visual:'clock',tags:['现在 am / is → 过去 was','现在 are → 过去 were','will / can 后用 be','have / has 后可用 been']},
{title:'镜子与动作助手，是两份工作',body:'Mia is happy. 里的 is 连接米娅和状态，是系动词。Mia is reading. 里的 is 与 reading 合作构成进行时，是助动词。被动结构也会用到 be。不能看到 be 后有词，就把后面统统叫作表语。',example:'Mia is happy. Mia is reading.',zh:'米娅很开心。米娅正在读书。',visual:'mirror',tags:['连接身份 / 状态 / 位置','be + 动词-ing → 进行结构','be + 过去分词 → 可构成被动','不能随意删掉 be']},
{title:'加 not，或者换个站位',body:'否定句把 not 放在 be 后：She is not tired. 问句把 be 提到主语前：Is she tired? 简短回答可以说 Yes, she is. 不必加 do。短语 the book on the shelf 可以描述书，但它本身还不是普通的完整陈述句。',example:'Is she tired? No, she is not.',zh:'她累吗？不，她不累。',visual:'book',tags:['she is → she is not','she is → is she?','不能说 she happy 来代替普通陈述句','短语与完整句子分开认识']}

// New mechanisms share the existing progress and review pipeline, not answer screens.
function newLabState(){return {bin:'',count:1,clues:[],subject:'',time:'',be:'',settings:{}};}
function packPhrase(q,lab){const n=['','one','two','three','four','five'][lab.count];return n+' '+(lab.bin==='unit'?(lab.count===1?q.unit:q.unit+'s')+' of '+q.noun:(lab.count===1?q.noun:q.plural));}
function labAnswer(q,lab){if(q.type==='pack')return lab.bin+'|'+lab.count;if(q.type==='mirror')return [lab.subject,lab.time,lab.be].join('|');if(q.type==='director')return JSON.stringify(Object.fromEntries(Object.keys(q.axes).map(k=>[k,lab.settings[k]])));return '';}
function portraitSVG(person){const color=person.color==='red'?'#c98168':'#739eaf',scale=person.size==='small'?.77:1;return `<svg viewBox="0 0 160 175" aria-hidden="true"><ellipse cx="80" cy="158" rx="48" ry="7" fill="#d9dfcd"/><g transform="translate(80 153) scale(${scale}) translate(-80 -153)"><path d="M53 104Q80 88 107 104L119 151H41Z" fill="${color}"/><path d="m45 70 5-45 28 19 28-19 9 45q-6 41-35 41T45 70" fill="#e5a26e"/><path d="m48 76 32 12 32-12q-9 28-32 28T48 76" fill="#fff0d2"/><circle cx="67" cy="72" r="3" fill="#435244"/><circle cx="93" cy="72" r="3" fill="#435244"/><path d="m75 87 5 5 5-5" fill="#435244"/>${person.prop==='hat'?'<path d="M40 42h80v9H40zm15 0 6-28h38l7 28" fill="#d8b46f"/><path d="M57 34h46" stroke="#857b56" stroke-width="7"/>':'<path d="m55 112 25 4 25-4v30l-25 4-25-4Z" fill="#f4e1a3" stroke="#b69b69" stroke-width="2"/><path d="M80 116v30" stroke="#b69b69" stroke-width="2"/>'}</g></svg>`;}
function renderPlayground(q,session,art,esc){const l=session.lab,locked=!!session.feedback||session.answered,off=locked?'disabled':'';let body='';
if(q.type==='pack'){body=`<div class="pack-table"><div class="cargo-row">${Array.from({length:l.count},()=>`<span class="cargo">${l.bin==='unit'?(q.unit==='cup'?'☕':q.unit==='bowl'?'🥣':q.unit==='slice'?'🍞':'🧺'):(q.icon==='apple'?'🍎':q.icon==='box'?'📦':q.icon==='water'?'💧':q.icon==='bread'?'🍞':'🍚')}</span>`).join('')}</div><div class="bag-choices"><button data-action="lab-bin" data-value="direct" aria-pressed="${l.bin==='direct'}" class="bag-choice ${l.bin==='direct'?'selected':''}" ${off}><span class="bag-handle"></span><strong>直接数物品</strong><small>one apple · two apples</small><span class="bag-pocket">1 · 2 · 3</span></button><button data-action="lab-bin" data-value="unit" aria-pressed="${l.bin==='unit'}" class="bag-choice ${l.bin==='unit'?'selected':''}" ${off}><span class="bag-handle"></span><strong>借助单位装</strong><small>a cup of water</small><span class="bag-pocket">杯 · 碗 · 片</span></button></div><div class="quantity"><span>装多少？</span><button data-action="lab-count" data-value="-1" aria-label="数量减一" ${locked||l.count===1?'disabled':''}>−</button><output aria-live="polite">${l.count}</output><button data-action="lab-count" data-value="1" aria-label="数量加一" ${locked||l.count===5?'disabled':''}>＋</button></div><div class="lab-preview"><small>试装表达 · 确认后看解释</small><p lang="en">${l.bin?esc(packPhrase(q,l)):'先选一只背包'}</p></div><button class="primary" data-action="check-lab" ${locked||!l.bin?'disabled':''}>装包完成，检查一下 ✓</button></div>`;}
if(q.type==='portrait'){const active=l.clues.map(i=>q.clues[i]);const count=q.characters.filter(p=>active.every(([k,v])=>p[k]===v)).length;body=`<div class="portrait-studio"><div class="clue-desk"><span>点亮线索，看看谁留下来</span>${q.clues.map((c,i)=>`<button data-action="lab-clue" data-index="${i}" aria-pressed="${l.clues.includes(i)}" class="clue ${l.clues.includes(i)?'selected':''}" ${off}>${l.clues.includes(i)?'✓':'＋'} ${esc(c[2])}</button>`).join('')}</div><p class="candidate-count" aria-live="polite">${active.length?'线索交集':'还没筛选'} · 当前 ${count} 位候选人</p><div class="portrait-grid">${q.characters.map(p=>{const fits=active.every(([k,v])=>p[k]===v),label=p.id+'号 · '+(p.size==='small'?'小个子':'大个子')+' · '+(p.color==='red'?'红衣服':'蓝衣服')+' · '+(p.prop==='hat'?'戴帽子':'拿着书');return `<button data-action="answer" data-answer="${p.id}" class="portrait-candidate ${fits?'':'ruled-out'} ${session.answered&&p.id===q.answer?'delivered':''}" ${locked||!fits?'disabled':''} aria-label="${label}">${portraitSVG(p)}<span>${p.id} 号朋友</span><small>${esc(label.slice(5))}</small>${!fits?'<i>线索不符合</i>':''}</button>`;}).join('')}</div><p class="interaction-tip">可以再次点击线索撤回筛选。线索是题目的一部分，不算额外提示。</p></div>`;}
if(q.type==='mirror'){body=`<div class="mirror-room"><div class="mirror-glass ${l.time==='past'?'yesterday':''}"><div class="mirror-people">${Array.from({length:['They','We'].includes(l.subject)?3:1},(_,i)=>`<div>${portraitSVG({size:'small',color:i%2?'blue':'red',prop:'hat'})}</div>`).join('')}</div><p lang="en">${esc(l.subject||'谁')} <strong>${esc(l.be||'___')}</strong> ${esc(q.tail)}.</p><span>${l.time==='past'?'◷ 昨天的回忆':l.time==='now'?'● 现在的镜子':'先选时间'}</span></div><div class="mirror-controls"><fieldset><legend>① 人物</legend>${['I','She','They','You','Mia','We'].map(p=>`<button data-action="lab-person" data-value="${p}" aria-pressed="${l.subject===p}" class="${l.subject===p?'selected':''}" ${off}>${p}</button>`).join('')}</fieldset><fieldset><legend>② 时间</legend>${[['now','现在'],['past','昨天']].map(([v,t])=>`<button data-action="lab-time" data-value="${v}" aria-pressed="${l.time===v}" class="${l.time===v?'selected':''}" ${off}>${t}</button>`).join('')}</fieldset><fieldset><legend>③ 接上 be</legend>${['am','is','are','was','were'].map(v=>`<button data-action="lab-be" data-value="${v}" aria-pressed="${l.be===v}" class="${l.be===v?'selected':''}" ${off}>${v}</button>`).join('')}</fieldset></div><p class="interaction-tip">镜中是你正在试接的句子，完成后检查人物、时间与 be 是否都匹配任务。</p><button class="primary" data-action="check-lab" ${locked||!l.subject||!l.time||!l.be?'disabled':''}>连接镜子，检查搭档 ✓</button></div>`;}
if(q.type==='director'){const s=l.settings,filled=Object.keys(q.axes).every(k=>!!s[k]),sentence=q.frame.replace(/\{(\w+)\}/g,(_,k)=>s[k]||'___'),freq=s.frequency==='always'?5:s.frequency==='sometimes'?2:s.frequency==='never'?0:null;body=`<div class="director-room"><div class="movie-stage ${q.axes.degree?'degree-scene':''} ${s.place==='at home'?'at-home':'garden'} ${s.time==='tomorrow'?'tomorrow':''} ${s.frequency==='never'?'never':''}" style="--walk-time:${s.manner==='quickly'?'1.5s':'5s'}"><span class="movie-sun">${s.time==='tomorrow'?'明天':'☀'}</span><div class="movie-scenery">${art(s.place==='at home'?'house':'flower')}</div><div class="walking-fox">${portraitSVG({size:'small',color:'red',prop:'hat'})}</div>${s.degree?`<span class="tired-meter" aria-label="疲倦程度">${s.degree==='very'?'Z z z z':'z'}<i style="width:${s.degree==='very'?88:25}%"></i></span>`:''}${freq!==null?`<div class="frequency-dots" aria-label="频率示意，非精确比例">${Array.from({length:5},(_,i)=>`<i class="${i<freq?'on':''}"></i>`).join('')}<span>${s.frequency==='never'?'从不出发':s.frequency==='always'?'每次出发':'有时出发'}</span></div>`:''}</div><div class="director-controls">${Object.entries(q.axes).map(([axis,opts])=>`<fieldset><legend>${({manner:'速度与方式',place:'地点',frequency:'频率',time:'故事时间',degree:'程度'})[axis]}</legend>${opts.map(([v,t])=>`<button data-action="lab-direct" data-axis="${axis}" data-value="${v}" aria-pressed="${s[axis]===v}" class="${s[axis]===v?'selected':''}" ${off}><strong>${esc(v)}</strong><small>${esc(t)}</small></button>`).join('')}</fieldset>`).join('')}</div><div class="lab-preview"><small>正在试拍的故事</small><p lang="en">${esc(sentence)}</p></div><button class="primary" data-action="check-lab" ${locked||!filled?'disabled':''}>这个镜头符合任务 ✓</button></div>`;}
return `<div id="playground-host" class="playground playground-${q.type} ${session.answered?'lab-success':''}">${body}</div>`;}

function chapterPage(id){const c=chapterById(id);if(!c){go('home');return;}view='chapter';currentChapter=c;state.last=c.id;persist();lessonIndex=Math.min(lessonIndex,c.lessons.length-1);const l=c.lessons[lessonIndex];render(`<div class="page-top">${btn('← 小岛地图','home','','back')}<span>${c.book}</span></div><section class="chapter-heading">${label(c.id==='t1'?'TIME TRAVEL · SAMPLE':chapterTag(c))}<h1>${c.title}</h1><p>${c.brief}</p></section><section class="lesson-panel ${c.theme}"><div class="lesson-picture">${art(l.visual)}<span class="lesson-stamp">先看一看 · 再听一听</span></div><div class="lesson-copy"><div class="lesson-counter">小故事 ${lessonIndex+1} / ${c.lessons.length}<div class="lesson-dots">${c.lessons.map((_,i)=>`<button aria-label="第 ${i+1} 个小故事" aria-pressed="${i===lessonIndex}" data-action="lesson" data-index="${i}" class="${i===lessonIndex?'selected':''}"></button>`).join('')}</div></div><h2>${l.title}</h2><p>${l.body}</p><div class="example"><p lang="en">${esc(l.example)}</p><small>${l.zh}</small><div>${btn('♫ 听英文','speak',`data-text="${esc(l.example)}"`,'sound-button')}${btn('听中文说明','speak',`data-lang="zh-CN" data-text="${esc(l.body)}"`,'sound-button')}</div></div><div class="tags">${l.tags.map(t=>`<span>${t}</span>`).join('')}</div><div class="lesson-controls">${btn('← 上一个','lesson',`data-index="${Math.max(0,lessonIndex-1)}" ${lessonIndex===0?'disabled':''}`,'text-button')}${lessonIndex<c.lessons.length-1?btn('下一个小故事 →','lesson',`data-index="${lessonIndex+1}"`,'text-button'):btn('我来试一试 ↓','scroll-missions','','text-button')}</div></div></section><section id="missions"><div class="section-heading"><div>${label('PLAY, NOTICE, UNDERSTAND')}<h2>轮到你动手啦</h2></div><p>可以重玩 · 不计时 · 答错也没关系</p></div><div class="mission-grid">${c.missions.map((m,i)=>`<button class="mission-card ${state.done.includes(m.id)?'finished':''}" data-action="play" data-id="${m.id}"><span class="mission-number">${state.done.includes(m.id)?'✓':String(i+1).padStart(2,'0')}</span><div><h3>${m.title}</h3><p>${m.note}</p><small>${m.items.length} 个挑战 · ${state.done.includes(m.id)?'已完成，可重玩':'随时出发'}</small></div><span>↗</span></button>`).join('')}</div></section><p class="source-note">学习依据：${c.book}。例句、场景与练习为原创改编。${c.id==='t1'?'样板仅覆盖习惯、此刻进行和过去事件，完整时态章节将在后续制作。':'先掌握入门模型，后续章节会补充更丰富的结构与用法。'}</p>`);}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function startPlay(id,review=false){const m=missionById(id);if(!review&&!m)return;stopSpeech();const questions=review?state.wrong.map(qById).filter(Boolean):m.items;if(!questions.length){go('review');return;}session={id,review,questions:[...questions],index:0,attempts:0,correct:0,first:0,answered:false,selected:[],pool:[],feedback:null,timeView:'habit',start:Date.now()};prepareQuestion();game();}
function prepareQuestion(){session.attempts=0;session.answered=false;session.selected=[];session.feedback=null;const q=session.questions[session.index];session.pool=q.type==='build'?shuffle(q.words.map((word,i)=>({word,i}))):shuffle(q.options||q.parts||[]);if(q.type==='build'&&session.pool.every((x,i)=>x.i===i))session.pool.reverse();session.timeView='habit';session.lab=newLabState();}
function highlighted(q){const s=esc(q.sentence);if(!q.target||q.target==='整句'||q.target==='主干'||q.target==='基本句型'||q.target==='省略的主语')return s;const t=esc(q.target);const i=s.indexOf(t);return i>=0?s.slice(0,i)+'<mark>'+t+'</mark>'+s.slice(i+t.length):s;}
function timeScene(which){const info={habit:['每天的习惯','反复出现的足迹，不表示此刻一定在做。','I water the flowers every day.'],now:['此刻正在发生','镜头里的动作正在进行。','I am watering the flowers now.'],past:['过去已经发生','昨天的照片，留在现在之前。','I watered the flowers yesterday.']}[which];return `<div class="time-view ${which}"><div class="timeline-scene">${art('flower')}<div class="water-drops"><i></i><i></i><i></i></div>${which==='habit'?'<div class="habit-dots"><i></i><i></i><i></i><i></i><i></i></div>':''}${which==='past'?'<span class="photo-label">YESTERDAY · 昨天的照片</span>':''}${which==='now'?'<span class="live-label">● NOW · 正在发生</span>':''}</div><strong>${info[0]}</strong><p>${info[1]}</p><p class="mini-en" lang="en">${info[2]}</p></div>`;}
function game(keepPosition=false){view=session.review?'review':'play';const q=session.questions[session.index],c=chapterById(q.chapter),m=missionById(q.mission);let interaction='';
if(CUSTOM_TYPES.has(q.type))interaction=renderPlayground(q,session,art,esc);
else if(q.type==='build')interaction=`<div class="build-scene"><div class="building-roof">${esc(q.pattern)}<span>把词块放入骨架</span></div><div class="building-slots">${q.words.map((_,i)=>{const item=session.selected[i];return `<div class="build-column"><span>${q.roles[i]||'词块'}</span><button data-action="unbuild" data-index="${i}" ${session.answered||!item?'disabled':''} aria-label="${item?'撤回 '+esc(item.word):'待放入词块 '+(i+1)}">${item?esc(item.word):'<span class="slot-plus">＋</span>'}</button></div>`;}).join('')}</div><div class="word-bank">${session.pool.map(item=>`<button data-action="build" data-index="${item.i}" ${session.answered||session.selected.some(x=>x.i===item.i)?'disabled':''}>${esc(item.word)}</button>`).join('')}</div>${btn('检查我的句子 ✓','check-build',session.selected.length!==q.words.length||session.answered?'disabled':'','primary')} ${btn('重新摆放','clear-build',session.answered?'disabled':'','text-button')}</div>`;
else if(q.type==='role')interaction=`<div class="train-platform"><span class="engine">▰<small>句子小火车</small></span>${q.parts.map((p,i)=>`<button class="carriage car-${i%4}" data-action="answer" data-answer="${esc(p)}" ${session.answered?'disabled':''}><span>${esc(p)}</span><i></i><i></i></button>`).join('')}</div><p class="interaction-tip">点击你找到的词块车厢 ↑</p>`;
else interaction=`${q.type==='time'?`<div class="time-lab"><div class="time-tabs" role="group" aria-label="观察时间镜头"><span>先玩一玩镜头</span>${['habit','now','past'].map((v,i)=>`<button data-action="time" data-value="${v}" aria-pressed="${session.timeView===v}" class="${session.timeView===v?'selected':''}">${['每天 ↻','此刻 ●','昨天 ◷'][i]}</button>`).join('')}</div><div id="time-observation">${timeScene(session.timeView)}</div></div>`:''}<div class="answer-options ${q.options.length===4?'four':''}">${session.pool.map((opt,i)=>`<button class="answer-option ${q.options===undefined?'':q.options.length===4?'mailbox':''}" data-action="answer" data-answer="${esc(opt)}" ${session.answered?'disabled':''}><span class="option-key">${String.fromCharCode(65+i)}</span><span>${esc(opt)}</span><span class="option-select">↗</span></button>`).join('')}</div>`;
render(`<div class="game-top">${btn('← '+(session.review?'复习背包':c.title),'leave-play',`data-id="${c.id}"`,'back')}<span>${session.review?'复习挑战':m.title}</span><span>${session.index+1} / ${session.questions.length}</span></div><div class="game-progress"><i style="width:${session.index/session.questions.length*100}%"></i></div><section class="play-header">${label(session.review?'LET’S TRY AGAIN':c.mechanic)}<h1>${gameTitle(q,c)}</h1><p>${CUSTOM_TYPES.has(q.type)?esc(q.zh):q.type==='build'?'按中文意思拼句。词块已经准备好了。':q.type==='role'?esc(q.zh):q.target==='整句'?'观察句子，选择最合适的句型。':q.target==='主干'?'拿掉这句中可选的细节，保留主干。':'观察场景和高亮提示，慢慢想一想。'}</p></section><div class="game-layout chapter-${c.id} ${q.type==='time'?'time-game':''}"><aside class="question-scene ${c.theme}">${art(q.icon)}<div class="guide-caption">${q.type==='build'?'词块建筑台':q.type==='role'?'每节车厢，都有自己的工作':q.type==='time'?'故事没变，时间镜头变了':'先想意思，再找它的工作'}</div></aside><section class="challenge"><div class="sentence-box"><div class="sentence-label"><span>${q.type==='build'?'你的任务':'看看这句话'}</span>${btn('♫ 听英文','speak',`data-text="${esc(questionSentence(q))}"`,'sound-button')}</div>${q.type==='build'?`<h2>${esc(q.zh)}</h2>`:`<h2 lang="en">${CUSTOM_TYPES.has(q.type)?esc(questionSentence(q)):highlighted(q)}</h2><p>${q.type==='role'?esc(''):esc(q.zh)}</p>`}${q.type!=='build'&&q.target&&q.target!=='整句'?`<span class="target-label">${q.type==='role'?'':esc(q.target)}</span>`:''}</div>${interaction}<div id="feedback" aria-live="polite"></div><div class="game-tools">${btn('☀ 阿栗的提示','hint','','text-button')}${btn('听中文任务','speak',`data-lang="zh-CN" data-text="${esc(q.zh)}"`,'text-button')}<span>书内 ${esc(q.pages)} 页 · 原创练习</span></div></section></div>`,!keepPosition);
if(keepPosition){const next=document.querySelector('.word-bank button:not(:disabled)')||document.querySelector('[data-action="check-build"]');next?.focus({preventScroll:true});}if(session.feedback)showFeedback();if(state.settings.auto&&!keepPosition&&session.attempts===0)speak(questionSentence(q));}
function showFeedback(){const f=session.feedback,q=session.questions[session.index];$('#feedback').innerHTML=`<div class="feedback ${f.correct?'correct':'retry'}"><span class="feedback-icon">${f.correct?'✦':'☀'}</span><div><h3>${f.correct?(session.attempts===1?'你发现规律啦！':'这次连接上啦！'):'没关系，我们一起看看'}</h3><p>${esc(q.why)}</p>${f.correct?`<p class="correct-answer" lang="en">${esc(q.sentence.replace('___',q.answer||''))}</p>${btn('♫ 听完整表达','speak',`data-text="${esc(q.sentence.replace('___',q.answer||''))}"`,'sound-button')}`:''}${btn(f.correct?(session.index===session.questions.length-1?'完成这次探险 →':'下一个挑战 →'):'明白了，再试一次',f.correct?'next':'retry','','primary')}</div></div>`;$('#feedback [data-action="next"],#feedback [data-action="retry"]')?.focus({preventScroll:true});$('#feedback').scrollIntoView({behavior:state.settings.motion?'smooth':'instant',block:'nearest'});}
function evaluate(answer){if(!session||session.answered||session.feedback)return;const q=session.questions[session.index];session.attempts++;const correct=q.type==='build'?answer===q.words.join('|'):answer===q.answer;if(correct){session.answered=true;session.correct++;if(session.attempts===1)session.first++;const old=state.solved[q.id];state.solved[q.id]={independent:!!old?.independent||session.attempts===1};if(session.review)state.wrong=state.wrong.filter(id=>id!==q.id);persist();document.querySelectorAll('[data-action="answer"],[data-action="build"],[data-action="unbuild"],[data-action="check-build"],[data-action="clear-build"]').forEach(b=>b.disabled=true);$('.question-scene')?.classList.add('celebrate');}else{if(!state.wrong.includes(q.id))state.wrong.push(q.id);persist();}document.querySelectorAll('[data-action="answer"],[data-action="build"],[data-action="unbuild"],[data-action="check-build"],[data-action="clear-build"]').forEach(b=>{b.disabled=true;if(correct&&b.dataset.answer===answer)b.classList.add('delivered');});session.feedback={correct};if(CUSTOM_TYPES.has(q.type))updateLab();showFeedback();}
function finish(){stopSpeech();if(!session.review&&!state.done.includes(session.id))state.done.push(session.id);persist();const c=chapterById(session.questions[0].chapter),m=missionById(session.id),next=c.missions[c.missions.findIndex(x=>x.id===session.id)+1];view='finish';render(`<section class="finish-screen"><div class="finish-stars">✧ <span>✦</span> ✧</div>${art('fox')} ${label('ONE LITTLE STEP, WELL DONE!')}<h1>${session.review?'背包又轻了一点！':'一小段冒险，完成啦！'}</h1><p>${session.review?'你重新想了一遍，也让知识更牢了一点。':'你不只选出了答案，也看见了句子背后的关系。'}</p><div class="finish-stats"><div><strong>${session.correct}</strong><span>完成挑战</span></div><div><strong>${session.first}</strong><span>本次独立完成</span></div><div><strong>${state.wrong.length}</strong><span>留待复习</span></div></div><p class="finish-note">${session.first===session.questions.length?'每一道都独立完成，真好。':'看过解释再做对，也是一种进步。答错的题已放进复习背包。'}</p><div class="finish-actions">${next&&!session.review?btn('下一个任务 →','play',`data-id="${next.id}"`):btn(session.review?'回到复习背包':'回到章节故事',''+(session.review?'review':'chapter'),`data-id="${c.id}"`)}${btn('回小岛地图','home','','secondary')}</div></section>`);}
function reviewPage(){view='review';render(`<div class="page-top">${btn('← 小岛地图','home','','back')}<span>温柔地，再试一次</span></div><section class="review-hero"><div>${label('YOUR LITTLE LEARNING BACKPACK')}<h1>复习背包</h1><p>有些知识，需要多见几次面。<br>答对后，它就会从背包里毕业。</p><div class="review-actions">${btn(state.wrong.length?`复习这 ${state.wrong.length} 个挑战 →`:'去小岛上探索 →',state.wrong.length?'start-review':'home')}</div></div>${art(state.wrong.length?'book':'fox')}</section>${state.wrong.length?`<div class="review-list">${state.wrong.map(id=>{const q=qById(id);return `<article><span>☀</span><div><small>${chapterById(q.chapter).title} · ${missionById(q.mission).title}</small><p lang="en">${esc(q.sentence)}</p></div>${btn('♫','speak',`data-text="${esc(q.sentence)}" aria-label="朗读 ${esc(q.sentence)}"`,'sound-button')}</article>`;}).join('')}</div>`:'<div class="empty-state"><span>✧</span><h2>背包现在空空的</h2><p>不用专门答错来填满它。学到的每一点，都算数。</p></div>'}`);}
function planPage(){view='plan';render(`<div class="page-top">${btn('← 小岛地图','home','','back')}<span>19 章 + 3 个拓展 · 全书精做路线</span></div><section class="chapter-heading">${label('A WHOLE WORLD TO DISCOVER')}<h1>一整本书，一座小世界。</h1><p>每章有自己的玩法，让抽象的语法变成可以看见、可以操作的故事。<br>带“可玩”标记的区域已经开放，其他区域展示后续计划。</p></section><div class="plan-legend"><span><i class="dot"></i> 第 1–6 章与 be 已开放</span><span>◐ 第 7 章为入门样板</span><span>○ 其余为规划，尚未制作</span></div><section class="roadmap">${roadmap.map((r,i)=>`<${r[5]?'button':'article'} class="roadmap-card ${r[5]?'available':''}" ${r[5]?`data-action="chapter" data-id="${r[5]}"`:''}><span class="road-number">${r[0]}</span><div class="road-art">${art(r[3])}</div><div><span class="status-badge">${r[5]?(r[5]==='t1'?'样板可玩':'已开放 · 可玩'):'后续计划'}</span><h2>${r[1]}</h2><p>${r[2]}</p><small>${r[4]}</small></div>${r[5]?'<span class="road-go">↗</span>':''}</${r[5]?'button':'article'}>`).join('')}</section><section class="plan-note"><h2>全书精做，按章生长</h2><p>每章都将有图解故事、独立机制、语义动画、对比挑战与迁移复习。当前已开放第 1–6 章和 be 拓展，并用有限时态样板验证时间轴玩法。后续开发会逐章增加内容、动画与复习关联。</p><p>已完成软件检查不等于已经证明教学效果。后续会结合真实使用反馈，继续调整难度与表达。</p></section>`);}
function stopSpeech(){speechToken++;if('speechSynthesis'in window)window.speechSynthesis.cancel();}
function loadVoices(){if('speechSynthesis'in window)voices=window.speechSynthesis.getVoices();}
if('speechSynthesis'in window){loadVoices();window.speechSynthesis.addEventListener('voiceschanged',loadVoices);}
function speak(text,lang='en-US',rate=state.settings.rate){if(!('speechSynthesis'in window)){toast('这个浏览器没有朗读功能，文字仍可正常学习。');return;}stopSpeech();loadVoices();const utterance=new SpeechSynthesisUtterance(text.replace(/___/g,'blank'));utterance.lang=lang;utterance.rate=rate;const voice=voices.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2)));if(voice)utterance.voice=voice;const token=speechToken;let began=false;utterance.onstart=()=>{began=true;toast(lang.startsWith('en')?'正在朗读英文 ♪':'正在朗读中文 ♪');};utterance.onerror=()=>{if(token===speechToken)toast('朗读未能播放。请检查设备声音或切换浏览器重试。');};utterance.onend=()=>{if(token===speechToken)toast('朗读完成，可以再听一次。');};window.speechSynthesis.speak(utterance);setTimeout(()=>{if(!began&&token===speechToken)toast('设备暂未开始朗读。请检查是否安装了对应语言的语音。');},5000);}
function dialog(html){$('#dialog-content').innerHTML=html;$('#dialog').showModal();}
function settings(){loadVoices();dialog(`<div class="dialog-heading"><h2>按你的节奏来</h2>${btn('×','close','','close')}</div><p>不用快，听清楚、看明白就好。</p><label class="field">朗读速度<select id="rate"><option value=".65" ${state.settings.rate===.65?'selected':''}>慢一点 · 0.65 倍</option><option value=".8" ${state.settings.rate===.8?'selected':''}>轻松听 · 0.8 倍</option><option value="1" ${state.settings.rate===1?'selected':''}>正常速度 · 1 倍</option></select></label><label class="toggle-row"><span><strong>自动读英文题目</strong><small>进入新题时朗读；也可以随时手动重听。</small></span><input type="checkbox" id="auto-read" ${state.settings.auto?'checked':''}></label><label class="toggle-row"><span><strong>开启场景动画</strong><small>关闭后画面静止，操作仍可正常进行。</small></span><input type="checkbox" id="motion" ${state.settings.motion?'checked':''}></label><p class="settings-help">朗读使用浏览器或系统语音，不录音、不开麦。声音与离线可用性取决于设备。${voices.some(v=>v.lang.startsWith('en'))?'已检测到英文声音。':'尚未检测到英文声音，首次播放时系统可能继续加载。'}</p><div class="settings-actions">${btn('♫ 试听英文','test-speech','','secondary')}${btn('导出进度','export','','secondary')}<label class="file-button">恢复进度<input type="file" id="import-progress" accept="application/json,.json"></label></div><p class="settings-help">进度仅保存在当前浏览器。换设备前可导出，恢复时会覆盖当前进度。</p>${btn('保存设置','save-settings','','primary wide')}`);}
function about(){dialog(`<div class="dialog-heading"><h2>学习说明</h2>${btn('×','close','','close')}</div><p>语法小岛把抽象规则变成有意义的操作。建议先看每章小故事，再做任务；如果还不认识英文，请使用英文朗读和中文提示，儿童可由成人陪同。</p><p>当前开放第 1–6 章与 be 拓展的核心入门目标，含 ${allQuestions.length} 个原创挑战。第 7 章仅有时态样板。其他章节为规划，尚未开放。</p><p>采用《一看就懂的英语语法书》的章节路线，例句、场景与练习为原创改编；使用语境限定和例外提示，避免机械套用简化口诀。五种句型是入门框架。</p><p>补充核对：<a href="https://dictionary.cambridge.org/grammar/british-grammar/complements" target="_blank" rel="noopener">Cambridge · Complements</a>；<a href="https://dictionary.cambridge.org/uk/grammar/british-grammar/verb-patterns-with-and-without-objects" target="_blank" rel="noopener">Verb patterns</a>；<a href="https://learnenglishkids.britishcouncil.org/grammar-vocabulary/grammar-practice/present-simple-present-continuous" target="_blank" rel="noopener">British Council · 现在时入门</a>。</p><p>没有倒计时。答错不扣命：查看解释后重试，并在复习背包重新作答。完成任务与首次答对会分别记录。</p>${btn('明白了，一起探索','close','','primary')}`);}
function download(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='语法小岛-学习进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('学习进度已导出。');}
let importState=null;
document.addEventListener('change',async e=>{if(e.target.id!=='import-progress')return;try{const file=e.target.files[0];if(!file)return;if(file.size>2e6)throw Error('文件太大');importState=sanitize(JSON.parse(await file.text()));$('#dialog-content').innerHTML=`<h2>恢复这份进度？</h2><p>备份包含 ${importState.done.length} 个已完成任务、${Object.keys(importState.solved).length} 个已学挑战。恢复会覆盖当前浏览器记录。</p><div class="settings-actions">${btn('确认恢复','confirm-import')}${btn('保留当前进度','settings','','secondary')}</div>`;}catch{toast('无法读取这份进度，请选择语法小岛导出的 JSON 文件。');e.target.value='';}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;switch(a){
case'home':go('home');break;case'chapter':lessonIndex=0;go('chapter/'+b.dataset.id);break;case'review':go('review');break;case'plan':go('plan');break;case'scroll-map':$('#islands')?.scrollIntoView({behavior:state.settings.motion?'smooth':'instant'});break;case'scroll-missions':$('#missions')?.scrollIntoView({behavior:state.settings.motion?'smooth':'instant'});break;
case'lesson':lessonIndex=Number(b.dataset.index);stopSpeech();chapterPage(currentChapter.id);break;case'play':go('play/'+b.dataset.id);break;case'start-review':go('practice');break;case'leave-play':go(session?.review?'review':'chapter/'+b.dataset.id);break;
case'answer':evaluate(b.dataset.answer);break;
case'lab-bin':if(session?.feedback)return;session.lab.bin=b.dataset.value;updateLab();break;
case'lab-count':if(session?.feedback)return;session.lab.count=Math.max(1,Math.min(5,session.lab.count+Number(b.dataset.value)));updateLab();break;
case'lab-clue':{if(session?.feedback)return;const i=Number(b.dataset.index);session.lab.clues=session.lab.clues.includes(i)?session.lab.clues.filter(v=>v!==i):[...session.lab.clues,i];updateLab();break;}
case'lab-person':if(session?.feedback)return;session.lab.subject=b.dataset.value;updateLab();break;
case'lab-time':if(session?.feedback)return;session.lab.time=b.dataset.value;updateLab();break;
case'lab-be':if(session?.feedback)return;session.lab.be=b.dataset.value;updateLab();break;
case'lab-direct':if(session?.feedback)return;session.lab.settings[b.dataset.axis]=b.dataset.value;updateLab();break;
case'check-lab':evaluate(labAnswer(session.questions[session.index],session.lab));break;
case'build':if(session?.feedback)return;session.selected.push(session.pool.find(x=>x.i===Number(b.dataset.index)));game(true);break;
case'unbuild':if(session?.feedback)return;session.selected.splice(Number(b.dataset.index),1);game(true);break;
case'clear-build':if(session?.feedback)return;session.selected=[];game(true);break;
case'check-build':evaluate(session.selected.map(x=>x.word).join('|'));break;
case'retry':session.feedback=null;session.selected=[];session.lab=newLabState();game();break;
case'next':stopSpeech();if(session.index===session.questions.length-1)finish();else{session.index++;prepareQuestion();game();}break;
case'hint':{if(!session)return;session.attempts=Math.max(1,session.attempts);const q=session.questions[session.index];dialog(`<div class="dialog-heading"><h2>阿栗的小提示</h2>${btn('×','close','','close')}</div><div class="hint-art">${art('fox')}</div><p>${esc(q.why)}</p><p class="settings-help">看提示很正常。这一题会记作“看过提示完成”，继续试试吧。</p>${btn('我来试一试','close')}`);break;}
case'time':session.timeView=b.dataset.value;document.querySelectorAll('[data-action="time"]').forEach(t=>{t.classList.toggle('selected',t.dataset.value===session.timeView);t.setAttribute('aria-pressed',String(t.dataset.value===session.timeView));});$('#time-observation').innerHTML=timeScene(session.timeView);break;
case'speak':speak(b.dataset.text,b.dataset.lang||'en-US');break;case'settings':settings();break;case'about':about();break;case'close':$('#dialog').close();break;
case'test-speech':speak('Hello! Welcome to Grammar Island.','en-US',Number($('#rate').value));break;
case'save-settings':state.settings.rate=Number($('#rate').value);state.settings.auto=$('#auto-read').checked;state.settings.motion=$('#motion').checked;persist();$('#dialog').close();toast('已保存，按你的节奏来。');break;
case'export':download();break;case'confirm-import':if(importState){state=importState;importState=null;persist();$('#dialog').close();go('home');toast('进度恢复完成。');}break;
}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))$('#dialog').close();});
function route(){stopSpeech();const [path,id]=location.hash.slice(1).split('/');if(path==='play'){startPlay(id);return;}if(path==='practice'){startPlay(null,true);return;}session=null;if(path==='chapter')chapterPage(id);else if(path==='review')reviewPage();else if(path==='plan')planPage();else home();}
window.addEventListener('hashchange',route);window.addEventListener('pagehide',stopSpeech);route();
</script></body></html>
